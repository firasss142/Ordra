<title>Entrepôt Ordra</title>
<style>
/* ============================================================
   Entrepôt — prototype de refonte
   Tokens repris de src/app/globals.css (console claire Ordra).
   Le mode sombre est conçu, pas inversé : mêmes rôles, pas mêmes valeurs.
   ============================================================ */
:root{
  --ground:#F6F6F7; --card:#FFFFFF; --sunken:#F4F3EF; --raised:#FFFFFF;
  --line:#E1E3E5; --line-strong:#C9CCCF; --line-soft:#EDEEF0;
  --ink-1:#1B1917; --ink-2:#5C5852; --ink-3:#78726A;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  --ok:#2F7A4A; --ok-bg:#E8F4EC;
  --warn:#A9670C; --warn-ink:#8F5608; --warn-bg:#FBF1E2;
  --bad:#B23A32; --bad-bg:#FBECEA;
  --info:#0E7A6E; --info-ink:#0B6A60; --info-bg:#E4F3F0;
  --accent:#6E56CF; --accent-ink:#513FA8; --accent-bg:#F1EEFC;
  --nav:#1A1A1A; --nav-2:#232323; --nav-ink:#E7E7E7; --nav-ink-2:#9A9A9A; --nav-green:#10B981;
  --chart-1:#15803D; --chart-2:#6E56CF; --chart-grid:#E8E9EB;
  --shadow-pop:0 8px 28px rgba(16,24,40,.12);
  --shadow-row:0 1px 2px rgba(16,24,40,.04);
  --r:10px; --r-sm:8px; --r-pill:9999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1114; --card:#17191E; --sunken:#1D2026; --raised:#1F232A;
    --line:#2A2E36; --line-strong:#3A404A; --line-soft:#23272E;
    --ink-1:#F1F2F4; --ink-2:#A9AEB8; --ink-3:#7E8590;
    --brand:#22A15C; --brand-hover:#2CB268; --brand-bg:#12291D; --brand-tint:#101E17;
    --ok:#3FA96B; --ok-bg:#12271A;
    --warn:#D08A22; --warn-ink:#E0A445; --warn-bg:#2A2011;
    --bad:#E06A60; --bad-bg:#2C1715;
    --info:#2AA294; --info-ink:#43BCAD; --info-bg:#0F2523;
    --accent:#9A85E8; --accent-ink:#B3A2F0; --accent-bg:#1E1930;
    --nav:#0B0C0E; --nav-2:#15171A; --nav-ink:#E7E7E7; --nav-ink-2:#8E939B; --nav-green:#10B981;
    --chart-1:#0EA871; --chart-2:#8B7CF0; --chart-grid:#262A31;
    --shadow-pop:0 8px 28px rgba(0,0,0,.5);
    --shadow-row:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1114; --card:#17191E; --sunken:#1D2026; --raised:#1F232A;
  --line:#2A2E36; --line-strong:#3A404A; --line-soft:#23272E;
  --ink-1:#F1F2F4; --ink-2:#A9AEB8; --ink-3:#7E8590;
  --brand:#22A15C; --brand-hover:#2CB268; --brand-bg:#12291D; --brand-tint:#101E17;
  --ok:#3FA96B; --ok-bg:#12271A;
  --warn:#D08A22; --warn-ink:#E0A445; --warn-bg:#2A2011;
  --bad:#E06A60; --bad-bg:#2C1715;
  --info:#2AA294; --info-ink:#43BCAD; --info-bg:#0F2523;
  --accent:#9A85E8; --accent-ink:#B3A2F0; --accent-bg:#1E1930;
  --nav:#0B0C0E; --nav-2:#15171A; --nav-ink:#E7E7E7; --nav-ink-2:#8E939B; --nav-green:#10B981;
  --chart-1:#0EA871; --chart-2:#8B7CF0; --chart-grid:#262A31;
  --shadow-pop:0 8px 28px rgba(0,0,0,.5);
  --shadow-row:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--ground); color:var(--ink-1);
  font-family:Inter,"Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}
.num{font-variant-numeric:tabular-nums;}
.ar{font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- App frame ---------- */
.app{display:flex;min-height:100vh;}
.side{
  width:240px;flex:0 0 240px;background:var(--nav);color:var(--nav-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.side.hidden{display:none;}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--nav-green);display:grid;place-items:center;color:#06210F;font-weight:800;font-size:13px;}
.brand-name{font-weight:650;letter-spacing:-.01em;font-size:15px;}
.nav-group{padding:6px 10px 2px;}
.nav-group-h{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:var(--r-sm);
  color:var(--nav-ink-2);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;margin:1px 0;border-radius:var(--r-sm);
  color:var(--nav-ink);font-size:13.5px;text-align:start;transition:background .12s;
}
.nav-item:hover{background:var(--nav-2);}
.nav-item[aria-current="page"]{background:var(--nav-2);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--nav-green);}
.nav-item.muted{color:#6B6B6B;}
.nav-item .ico{width:15px;height:15px;flex:0 0 15px;opacity:.85;}
.nav-count{margin-inline-start:auto;font-size:11px;font-weight:650;color:var(--nav-ink-2);}
.side-foot{margin-top:auto;padding:12px 14px 16px;border-top:1px solid #262626;display:flex;align-items:center;gap:9px;}
.avatar{width:26px;height:26px;border-radius:var(--r-pill);background:#3A3A3A;display:grid;place-items:center;font-size:11px;font-weight:650;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
}
.market-pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);
  border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--card);
}
.dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--brand);flex:0 0 7px;}
.top-spacer{margin-inline-start:auto;}
.tabband{display:flex;gap:2px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:53px;z-index:29;}
.tab{
  display:inline-flex;align-items:center;gap:7px;padding:11px 13px;font-size:13.5px;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab:hover{color:var(--ink-1);}
.tab[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
.tab .cnt{font-size:11px;font-weight:650;background:var(--sunken);color:var(--ink-2);padding:1px 6px;border-radius:var(--r-pill);}
.tab[aria-current="page"] .cnt{background:var(--brand-bg);color:var(--brand);}
.page{padding:22px 24px 72px;max-width:1440px;width:100%;}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.ph h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.02em;}
.ph p{margin:3px 0 0;color:var(--ink-2);font-size:13px;}
.ph-actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink-1);
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--line-strong);background:var(--sunken);}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);}
.btn-danger{color:var(--bad);border-color:var(--line);}
.btn-danger:hover{background:var(--bad-bg);border-color:var(--bad);}
.btn-sm{padding:5px 10px;font-size:12.5px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary:disabled{background:var(--sunken);border-color:var(--line);color:var(--ink-3);opacity:1;}

/* ---------- Cards & KPI ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
.card-h h2{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em;}
.card-h .sub{font-size:12px;color:var(--ink-3);}
.card-h .right{margin-inline-start:auto;display:flex;gap:8px;align-items:center;}
.card-b{padding:16px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:12px;margin-bottom:18px;}
.kpi{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;transition:border-color .12s,box-shadow .12s;}
.kpi:hover{border-color:var(--line-strong);box-shadow:var(--shadow-row);}
.kpi-l{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.075em;color:var(--ink-2);}
.kpi-v{margin-top:7px;font-size:30px;font-weight:650;line-height:1.1;letter-spacing:-.022em;font-variant-numeric:tabular-nums;}
.kpi-v .u{font-size:.5em;font-weight:600;letter-spacing:normal;color:var(--ink-3);margin-inline-start:5px;}
.kpi-v.bad{color:var(--bad);} .kpi-v.warn{color:var(--warn-ink);} .kpi-v.ok{color:var(--brand);}
.kpi-note{margin-top:6px;font-size:12px;color:var(--ink-2);}
.kpi-foot{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0;}
.kpi-foot.three{grid-template-columns:repeat(3,1fr);}
.kpi-foot > div{padding-inline-end:8px;}
.kpi-foot > div + div{border-inline-start:1px solid var(--line);padding-inline-start:10px;}
.kpi-foot .fv{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi-foot .fl{margin-top:2px;font-size:11.5px;color:var(--ink-2);}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-warn{background:var(--warn-bg);color:var(--warn-ink);}
.b-bad{background:var(--bad-bg);color:var(--bad);}
.b-info{background:var(--info-bg);color:var(--info-ink);}
.b-accent{background:var(--accent-bg);color:var(--accent-ink);}
.b-mute{background:var(--sunken);color:var(--ink-2);}
.b-brand{background:var(--brand-bg);color:var(--brand);}
.swatch{width:11px;height:11px;border-radius:3px;border:1px dashed var(--line-strong);background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-soft) 3px 6px);flex:0 0 11px;}

/* ---------- Segmented control ---------- */
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;}
.seg button{padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink-1);box-shadow:var(--shadow-row);}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--card);}
.chip[aria-pressed="true"]{background:var(--brand-bg);border-color:var(--brand);color:var(--brand);}
.search{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);min-width:200px;flex:1;max-width:340px;}
.search input{border:none;background:none;outline:none;width:100%;font-size:13px;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}

/* ---------- Flow strip ---------- */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:0;}
.flow-step{padding:16px;display:flex;flex-direction:column;gap:3px;}
.flow-step .n{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.flow-step .t{font-size:12.5px;font-weight:650;color:var(--ink-1);}
.flow-step .m{font-size:11.5px;color:var(--ink-2);}
.flow-arrow{display:grid;place-items:center;padding:0 4px;color:var(--line-strong);}
.flow-bar{height:4px;border-radius:var(--r-pill);margin-top:8px;background:var(--sunken);overflow:hidden;}
.flow-bar i{display:block;height:100%;border-radius:var(--r-pill);}

/* ---------- Lists / rows ---------- */
.grp{border-top:1px solid var(--line);}
.grp:first-child{border-top:none;}
.grp-h{display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--sunken);font-size:11.5px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;}
.grp-h .cnt{margin-inline-start:auto;text-transform:none;letter-spacing:normal;font-size:12px;color:var(--ink-3);}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);transition:background .1s;}
.grp-h + .row{border-top:none;}
.row:hover{background:var(--sunken);}
.row.sel{background:var(--brand-tint);box-shadow:inset 2px 0 0 var(--brand);}
.row .who{min-width:0;flex:1.4;}
.row .who b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .who.wrap b,.row .who.wrap span{white-space:normal;overflow:visible;text-overflow:clip;}
.row .who span{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .what{min-width:0;flex:1.2;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .meta{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
.row input[type=checkbox]{width:15px;height:15px;accent-color:var(--brand);flex:0 0 15px;}
.linkish{color:var(--ink-1);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line-strong);}
.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13px;}

/* ---------- Two-column work area ---------- */
.work{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.85fr);gap:14px;align-items:start;}
.work.wide{grid-template-columns:minmax(0,2fr) minmax(296px,.68fr);}
td .cmd{display:flex;align-items:center;gap:11px;min-width:0;}
td .cmd-b{min-width:0;}
td .cmd-b b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
td .cmd-b span{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
td.c-cmd{min-width:206px;max-width:260px;}
td.c-prod{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);}
.sticky{position:sticky;top:112px;}
@media (max-width:1080px){.work{grid-template-columns:1fr;} .sticky{position:static;}}

/* ---------- Scanner ---------- */
.scan-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line-strong);border-radius:var(--r);background:var(--sunken);}
.scan-in input{flex:1;border:none;background:none;outline:none;font-size:17px;font-weight:650;letter-spacing:.04em;font-variant-numeric:tabular-nums;}
.scan-in input::placeholder{font-size:13.5px;font-weight:500;letter-spacing:normal;color:var(--ink-3);}
.scan-in:focus-within{border-color:var(--brand);background:var(--brand-tint);}
.tile{border-radius:var(--r);padding:14px;border:1px solid var(--line);background:var(--sunken);}
.tile.ok{background:var(--brand-bg);border-color:var(--brand);}
.tile.err{background:var(--bad-bg);border-color:var(--bad);}
.tile .th{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;}
.tile.ok .th{color:var(--brand);} .tile.err .th{color:var(--bad);}
.tile .tb{margin-top:6px;font-size:12.5px;color:var(--ink-2);}
.tile .tb b{color:var(--ink-1);}
.flash{animation:flash .45s ease-out;}
@keyframes flash{0%{transform:scale(.985);opacity:.55;}100%{transform:scale(1);opacity:1;}}
.target{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--card);}
.target .lbl{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.075em;color:var(--ink-3);}
.mini{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-soft);}
.mini:first-of-type{border-top:none;}
.mini .t{margin-inline-start:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11.5px;}

/* ---------- Progress ---------- */
.prog{height:7px;border-radius:var(--r-pill);background:var(--sunken);overflow:hidden;}
.prog i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill);transition:width .3s;}
.posbar{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--sunken);gap:2px;}
.posbar i{display:block;height:100%;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:7px;}
.legend b{color:var(--ink-1);font-variant-numeric:tabular-nums;}
.key{width:9px;height:9px;border-radius:2px;display:inline-block;margin-inline-end:5px;}

/* ---------- Alerts ---------- */
.alert{display:flex;gap:11px;padding:13px 16px;border-top:1px solid var(--line-soft);align-items:flex-start;}
.alert:first-child{border-top:none;}
.alert .ai{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;flex:0 0 28px;}
.alert .ab{min-width:0;flex:1;}
.alert .ab b{display:block;font-size:13.5px;font-weight:600;}
.alert .ab span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;}

/* ---------- Table (journal / manifests) ---------- */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:start;padding:9px 14px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tbody tr:hover{background:var(--sunken);}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;}
.daysep td{background:var(--sunken);font-size:11.5px;font-weight:650;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;padding:6px 14px;}

/* ---------- Modal / drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.42);z-index:60;display:grid;place-items:center;padding:20px;}
.scrim[hidden]{display:none;}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(520px,100%);box-shadow:var(--shadow-pop);max-height:88vh;overflow:auto;}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);}
.modal-h h3{margin:0;font-size:15px;font-weight:650;}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px;}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:var(--sunken);border-radius:0 0 12px 12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);}
.field input,.field select,.field textarea{padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);outline:none;font-size:13.5px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);}
.field .hint{font-size:11.5px;color:var(--ink-3);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100%);background:var(--card);border-inline-start:1px solid var(--line);z-index:61;box-shadow:var(--shadow-pop);overflow-y:auto;}
.drawer[hidden]{display:none;}
.dl{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px;}
.dl:first-of-type{border-top:none;}
.dl span{color:var(--ink-2);}
.dl b{font-weight:600;text-align:end;}
.tl{position:relative;padding-inline-start:18px;}
.tl li{list-style:none;position:relative;padding:0 0 14px;font-size:12.5px;}

.toasts{position:fixed;inset-block-end:18px;inset-inline-start:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}

/* ---------- Prototype control bar ---------- */
.proto{

.h-teal{background:var(--info-bg);color:var(--info-ink);}
.h-mute{background:var(--sunken);color:var(--ink-2);}

function seedJournal(m){
  const raw = m.products;
  const p = new Proxy({}, { get:(_,k) => raw[Number(k) % raw.length] });
  const a0 = m.agents[0].n, a1 = (m.agents[1] || m.agents[0]).n, aL = m.agents[m.agents.length-1].n;

  // Événements du plus ancien au plus récent : le solde est calculé, jamais saisi,
  // pour que la colonne « stock » du journal reste cohérente d'une ligne à l'autre.
  const ev = [
    ['Lundi 16 août','14:02','scan','Sortie scannée · '+p[2].name, a0, p[2], -1],
    ['Lundi 16 août','16:30','print','Étiquettes imprimées · lot de 22', a0, null, null],
    ['Hier','09:12', m.code==='ly'?'transfer':'print', m.code==='ly' ? 'Transfert vers Darb Tripoli · '+p[1].name : 'Étiquettes imprimées · lot de 8', a0, m.code==='ly'?p[1]:null, m.code==='ly'?-60:null],
    ['Hier','09:55','handover','Remise transporteur · '+m.accounts[0].label+' · 16 colis', a0, null, null],
    ['Hier','11:08','reception','Réception fournisseur · '+p[0].name+' · BL 2026-0812', a0, p[0], +120],
    ['Hier','15:40','return','Retour endommagé · '+p[0].name+' · dommage transporteur', a0, p[0], 0],
    ['Hier','17:22','count','Inventaire · '+p[1].name+' · écart de comptage', a0, p[1], -2],
    ["Aujourd'hui",'08:12','scan','Sortie scannée · '+p[0].name, a0, p[0], -1],
    ["Aujourd'hui",'08:31','print','Étiquettes imprimées · lot de 12', a0, null, null],
    ["Aujourd'hui",'08:47','scan','Sortie scannée · '+p[2].name, a1, p[2], -1],
    ["Aujourd'hui",'09:15','return','Retour remis en stock · '+p[1].name, aL, p[1], +1],
    ["Aujourd'hui",'09:38','handover','Remise transporteur · '+m.accounts[0].label+' · 9 colis', a0, null, null],
    ["Aujourd'hui",'09:51','scan','Sortie scannée · '+p[1].name, a0, p[1], -1],
    ["Aujourd'hui",'10:04','scan','Sortie scannée · '+p[0].name, a0, p[0], -1],
  ];

  // Le stock courant est l'état APRÈS le dernier événement : on remonte le temps
  // pour retrouver le solde de départ de chaque produit.
  const bal = new Map();
  raw.forEach(pr => bal.set(pr.id, pr.stock));
  for (let i = ev.length - 1; i >= 0; i--){
    const [, , , , , pr, d] = ev[i];
    if (pr && d) bal.set(pr.id, bal.get(pr.id) - d);
  }

  const j = [];
  ev.forEach(([day, time, kind, text, who, pr, d]) => {
    let stock = null;
    if (pr && d !== null){ bal.set(pr.id, bal.get(pr.id) + d); stock = bal.get(pr.id); }
    j.push({ day, time, kind, text, who, delta: d, stock });
  });
  return j.reverse();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(v){ return v.toFixed(2).replace('.', ',') + ' ' + M().currency; }
function dec(n, d){ return n.toFixed(d === undefined ? 1 : d).replace('.', ','); }
function ageStr(h){ if (h < 24) return h + ' h'; const d = Math.round(h/24); return d + ' j'; }
function ageTone(h){ return h >= 72 ? 'b-bad' : h >= 24 ? 'b-warn' : 'b-mute'; }
function isArabic(s){ return /[؀-ۿ]/.test(s); }
function nm(s){ return '<bdi class="'+(isArabic(s)?'ar':'')+'">'+esc(s)+'</bdi>'; }
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2600);

function prepList(){
  const m = M();
  let rows = m.toPrepare.filter(o => o.state === 'todo');
  if (state.prepFilter === 'fresh') rows = rows.filter(o => o.hours <= 24);
  if (state.prepFilter === 'old') rows = rows.filter(o => o.hours > 48);
  if (state.prepRegion) rows = rows.filter(o => o.region === state.prepRegion);
  if (state.prepProduct) rows = rows.filter(o => o.product.id === state.prepProduct);
  const q = state.prepQuery.trim().toLowerCase();
  if (q) rows = rows.filter(o => (o.name+' '+o.city+' '+o.product.name+' '+o.ref+' '+o.tracking).toLowerCase().includes(q));
  return rows;
}
function groupsFor(rows){
  const m = M();
  if (m.code === 'tn') return [{ key:'tn', label:m.carrierLabel, rows }];
  const out = [];
  for (const k of ['ouest','est','sud']){
    const r = rows.filter(o => o.region === k);
    if (r.length) out.push({ key:k, label:LY_REGIONS[k].label, rows:r });
  }
  return out;
}

/* Aire 2 séries — hover crosshair + infobulle. Teintes validées (chart-1/chart-2). */
function areaChart(a, b, labels, w, h){
  w = w || 560; h = h || 132;
  const pad = { t:8, r:8, b:16, l:8 };
  const max = Math.max(...a, ...b, 1) * 1.15;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = i => pad.l + (i / (a.length - 1)) * iw;
  const Y = v => pad.t + ih - (v / max) * ih;
  const path = (s) => s.map((v,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = (s) => path(s) + ' L' + X(s.length-1).toFixed(1) + ' ' + (pad.t+ih) + ' L' + X(0) + ' ' + (pad.t+ih) + ' Z';
  const grid = [0.5, 1].map(f => '<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+(pad.t+ih-f*ih).toFixed(1)+'" y2="'+(pad.t+ih-f*ih).toFixed(1)+'" stroke="var(--chart-grid)" stroke-width="1"/>').join('');
  const hit = a.map((_,i) => '<rect class="hit" data-i="'+i+'" x="'+(X(i)-iw/(a.length-1)/2).toFixed(1)+'" y="0" width="'+(iw/(a.length-1)).toFixed(1)+'" height="'+h+'" fill="transparent"/>').join('');
  return '<div class="sparkwrap"><div class="chart-legend">'
    + '<span><i class="key" style="background:var(--chart-1)"></i>Sorties scannées</span>'
    + '<span><i class="key" style="background:var(--chart-2)"></i>Retours traités</span></div>'
    + '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="Activité entrepôt sur 14 jours" style="display:block">'
    + grid
    + '<path d="'+area(a)+'" fill="var(--chart-1)" opacity="0.10"/>'
    + '<path d="'+path(a)+'" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<path d="'+path(b)+'" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/>'
    + '<circle cx="'+X(a.length-1)+'" cy="'+Y(a[a.length-1])+'" r="3.5" fill="var(--chart-1)" stroke="var(--card)" stroke-width="2"/>'
    + '<line class="cross" x1="0" x2="0" y1="'+pad.t+'" y2="'+(pad.t+ih)+'" stroke="var(--line-strong)" stroke-width="1" opacity="0"/>'
    + hit + '</svg>'
    + '<div class="tt" hidden></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:2px"><span>'+esc(labels[0])+'</span><span>'+esc(labels[1])+'</span></div>'
    + '</div>';
}
function wireChart(root){
  const wrap = root.querySelector('.sparkwrap'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tt = wrap.querySelector('.tt'), cross = wrap.querySelector('.cross');
  const m = M();
  wrap.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mouseenter', () => {
      const i = +r.dataset.i, x = +r.getAttribute('x') + (+r.getAttribute('width'))/2;
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity','1');
      tt.hidden = false;
      tt.innerHTML = 'J-'+(13-i)+' · <b>'+m.series[i]+'</b> sorties · <b>'+m.seriesRet[i]+'</b> retours';
      const pct = x / svg.viewBox.baseVal.width;
      tt.style.left = Math.min(Math.max(pct * wrap.clientWidth - 60, 0), wrap.clientWidth - 170) + 'px';
      tt.style.top = '26px';
    });
  });
  wrap.addEventListener('mouseleave', () => { tt.hidden = true; cross.setAttribute('opacity','0'); });
}
