    + '<div class="rk-b"><b>'+esc(a.n)+'</b><span>'+a.v+' sorties · '+dec(a.v/8)+'/h · '+(4+i)+' h actives</span></div>'
    + '<div class="rk-v"><div class="rk-n">'+dec(a.v/8)+'<small>/h</small></div>'
    + '<div class="prog" style="margin-top:5px"><i style="width:'+Math.min(Math.round(a.v/8/3*100),100)+'%"></i></div>'
    + '<div class="rk-t">'+dec(a.v/8)+' / 3,0</div></div></div>').join('');

  const chartCard = '<div class="card">'+cardHead('Activité','14 derniers jours')+'<div class="card-b">'
      + areaChart(m.series, m.seriesRet, ['5 août', 'aujourd’hui']) + '</div></div>';

  const right = isAgent()
    ? '<div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:11px">'
      + '<div style="font-size:13px;color:var(--ink-2)">Le poste est prêt. La douchette est active dès l’ouverture de la préparation.</div>'
      + '<button class="btn btn-primary" data-tab="prep" style="justify-content:center">'+ic('scan',15)+' Commencer la préparation</button>'
      + '<button class="btn" data-tab="returns" style="justify-content:center">'+ic('ret',15)+' Trancher les retours ('+m.returns.length+')</button>'
      + '</div></div>'
    : '<div class="card">'+cardHead('Classement','sorties par heure active · cible 3,0')+ranking
      + '<div class="note">Le débit se lit par heure de présence, pas par journée : un agent à mi-temps n’est pas un agent lent.</div></div>';

  return '<div class="ph"><div><h1>'+(isAgent()?'Ma journée':'Entrepôt')+'</h1>'
    + '<p>'+(isAgent()?'Poste de préparation · '+esc(m.label):'Vue opérationnelle · '+esc(m.label)+' · '+esc(m.carrierLabel))+'</p></div>'
    + '<div class="ph-actions"><button class="btn" data-tab="journal">'+ic('file',15)+' Journal</button>'
    + '<button class="btn btn-primary" data-tab="prep">'+ic('scan',15)+' Préparer</button></div></div>'
    + heroes + pipeline
    + '<div class="work"><div class="stack"><div class="card">'
    + '<div class="card-h"><h2>Actions prioritaires</h2><span class="sub">'+acts.length+'</span>'
    + '<div class="right"><span style="font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.075em;color:var(--ink-3)">Total à rattraper</span>'
    + '<b style="font-size:15px;font-variant-numeric:tabular-nums">'+backlogTotal+'</b></div></div>'
    + actsHtml + '</div>'
    + (isAgent() ? '' : chartCard) + '</div>'
    + right + '</div>';
}

/* ============================================================
   Écran 2 — Préparation
   ============================================================ */
function prodInitial(p){
  const m = p.short.match(/[A-Za-zÀ-ÿ]/);
  return m ? m[0].toUpperCase() : '#';
}
function thumb(p){
  return '<span class="thumb" aria-hidden="true"><b style="font-size:12px;font-weight:650;color:var(--ink-2)">'+esc(prodInitial(p))+'</b></span>';
}

function screenPrep(){
  const m = M(), rows = prepList(), groups = groupsFor(rows);
  const todo = m.toPrepare.filter(o => o.state === 'todo');
  const done = m.toPrepare.filter(o => o.state === 'scanned').length;
  const goal = 40;
  const scanned = m.scansToday + done;

  const heroes = '<div class="heroes">'
    + hero({ h:'h-brand', icon:'pkg', value:rows.length, label:'file de préparation',
             sub: m.code === 'ly' ? groups.length + ' région' + (groups.length>1?'s':'') + ' · rouleaux distincts' : 'transporteur ' + m.carrierLabel })
    + hero({ h:'h-brand', icon:'scan', value:scanned, label:'sorties scannées',
             delta:{ dir:'up', v:Math.round(scanned/goal*100)+' %' }, sub:'aujourd’hui · objectif ' + goal })
    + hero({ h: state.selected.size ? 'h-violet' : 'h-mute', icon:'check', value:state.selected.size, label:'sélection',
             sub: state.selected.size ? 'prêtes pour une action en lot' : 'cochez des lignes pour agir en lot' })
    + '<div class="hero-total">'+todo.filter(o=>o.hours>48).length+' colis au-delà de 48 h</div>'
    + '</div>';

  /* Recherche pleine largeur + ligne d'aide + puces à chevron : la barre de Commandes. */
  const prodLabel = state.prepProduct ? (m.products.find(p=>p.id===state.prepProduct)||{}).short : 'Produit';
  const regLabel = state.prepRegion
    ? (m.code === 'ly' ? LY_REGIONS[state.prepRegion].label.split(' — ')[0] : m.carrierLabel)
    : (m.code === 'ly' ? 'Région' : 'Transporteur');
  const ageLabel = { all:'Âge', fresh:'≤ 24 h', old:'En retard' }[state.prepFilter];

  const filters = '<div class="searchwide">'+ic('scan',15)
    + '<input id="prepq" placeholder="Rechercher — client, ville, produit, référence, n° de suivi…" value="'+esc(state.prepQuery)+'" autocomplete="off">'
    + '<span class="slash">/</span></div>'
    + '<div class="helperline">Client · ville · produit · référence · n° de suivi'+(m.code==='ly'?' · numéro de sticker':'')+'</div>'
    + '<div class="fchips">'
    + '<button class="fchip'+(state.prepFilter!=='all'?' on':'')+'" id="f-age">'+ic('clock',14)+esc(ageLabel)+'<span class="cv">'+ic('down',13)+'</span></button>'
    + '<button class="fchip'+(state.prepRegion?' on':'')+'" id="f-reg">'+ic(m.code==='ly'?'truck':'truck',14)+esc(regLabel)+'<span class="cv">'+ic('down',13)+'</span></button>'
    + '<button class="fchip'+(state.prepProduct?' on':'')+'" id="f-prod">'+ic('layers',14)+esc(prodLabel)+'<span class="cv">'+ic('down',13)+'</span></button>'
    + (state.prepFilter!=='all'||state.prepRegion||state.prepProduct
        ? '<button class="fchip" data-act="clear-filters">'+ic('x',13)+'Réinitialiser</button>' : '')
    + '</div>';

  /* Tableau : en-têtes minuscules en capitales, vignette produit, pastilles d'état —
     l'anatomie de la table Commandes. */
  const rowHtml = (o) => {
    const sel = state.selected.has(o.ref);
    const isTarget = state.target === o.ref;
    return '<tr'+(isTarget?' style="background:var(--brand-tint);box-shadow:inset 2px 0 0 var(--brand)"':'')+' data-ref="'+o.ref+'">'
      + '<td style="width:34px"><input type="checkbox" data-check="'+o.ref+'" '+(sel?'checked':'')+' aria-label="Sélectionner '+esc(o.ref)+'"></td>'
      + '<td class="c-cmd"><div class="cmd">'+thumb(o.product)
      + '<div class="cmd-b"><b>'+nm(o.name)+'</b>'
      + '<span>'+esc(o.ref)+' · '+nm(o.city)+'</span></div></div></td>'
      + '<td class="c-prod">'+nm(o.product.short)+' <span style="color:var(--ink-3)">× '+o.qty+'</span></td>'
      + '<td class="num" style="white-space:nowrap">'+money(o.price*o.qty)+'</td>'
      + (m.code === 'tn'
          ? '<td>'+(o.labelled === false
              ? '<span class="badge b-warn">'+ic('print',11)+'À imprimer</span>'
              : '<span class="badge b-info">'+ic('check',11)+'Étiquetée</span>')+'</td>'
          : '')
      + '<td><span class="badge '+ageTone(o.hours)+'">'+ageStr(o.hours)+'</span></td>'
      + '<td class="num"><span class="badge '+(o.product.stock<=o.product.seuil?'b-bad':'b-mute')+'">'+o.product.stock+'</span></td>'
      + '<td style="width:96px;text-align:end">'
      + (m.code === 'ly'
          ? '<button class="btn btn-sm" data-take="'+o.ref+'">'+(isTarget?'En main':'Prendre')+'</button>'
          : '<button class="btn btn-sm" data-detail="'+o.ref+'">Détail</button>')
      + '</td></tr>';
  };

  const cols = m.code === 'tn' ? 8 : 7;
  const head = '<thead><tr><th></th><th>Commande</th><th>Produit</th><th class="num">Encaisser</th>'
    + (m.code === 'tn' ? '<th>Étiquette</th>' : '')
    + '<th>Âge</th><th class="num">Stock</th><th></th></tr></thead>';

  const body = groups.length
    ? groups.map(g =>
        '<tr class="daysep"><td colspan="'+cols+'"><div style="display:flex;align-items:center;gap:9px">'
        + (m.code === 'ly' ? '<span class="swatch" title="Couleur de rouleau à définir"></span>' : ic('truck',13))
        + '<span>'+esc(g.label)+'</span>'
        + (m.code === 'ly' ? '<span style="text-transform:none;letter-spacing:normal;font-weight:500;color:var(--ink-3)">rouleau — couleur à définir</span>' : '')
        + '<span style="margin-inline-start:auto;text-transform:none;letter-spacing:normal;font-weight:500;color:var(--ink-3)">'+g.rows.length+' colis</span>'
        + '</div></td></tr>' + g.rows.map(rowHtml).join('')).join('')
    : '<tr><td colspan="'+cols+'"><div class="empty">Aucune commande ne correspond à ces filtres.</div></td></tr>';

  const selbar = state.selected.size
    ? '<div class="selbar"><span class="n num">'+state.selected.size+' sélectionnée'+(state.selected.size>1?'s':'')+'</span>'
      + '<button class="btn btn-sm" data-act="clear-sel">Tout décocher</button>'
      + '<div class="sp">'
      + (m.code === 'tn'
          ? '<button class="btn btn-sm btn-primary" data-act="print">'+ic('print',14)+' Imprimer les étiquettes</button>'
          : '<button class="btn btn-sm btn-primary" data-act="picklist">'+ic('file',14)+' Liste de picking</button>')
      + '</div></div>'
    : '';

  const target = state.target ? m.toPrepare.find(o => o.ref === state.target) : null;
  const targetCard = m.code === 'ly'
    ? (target
        ? '<div class="target"><div class="lbl">Colis en main</div>'
          + '<div style="display:flex;align-items:center;gap:11px;margin-top:8px">'+thumb(target.product)
          + '<div style="min-width:0"><div style="font-size:14px;font-weight:650">'+nm(target.name)+'</div>'
          + '<div style="font-size:12.5px;color:var(--ink-2)">'+nm(target.city)+' · '+nm(target.product.short)+' × '+target.qty+'</div></div></div>'
          + '<div style="display:flex;gap:7px;margin-top:10px;align-items:center;flex-wrap:wrap">'
          + '<span class="badge b-accent"><span class="swatch"></span>'+esc(LY_REGIONS[target.region].label)+'</span>'
          + '<span class="badge b-mute num">réf. '+esc(target.tracking)+'</span></div>'
          + '<div style="margin-top:11px;font-size:12.5px;color:var(--ink-2)">Collez le sticker sur le colis, <b>puis</b> scannez-le. Le numéro remplacera la référence provisoire.</div>'
          + '</div>'
        : '<div class="target"><div class="lbl">Aucun colis en main</div>'
          + '<div style="margin-top:6px;font-size:13px;color:var(--ink-2)">Choisissez une commande dans la file (<b>Prendre</b>), emballez-la, collez le sticker, puis scannez.</div></div>')
    : '<div class="target"><div class="lbl">Prêt à scanner</div>'
      + '<div style="margin-top:6px;font-size:13px;color:var(--ink-2)">Scannez le QR de notre étiquette. Le code-barres transporteur reste celui de '+esc(m.carrierLabel)+'.</div></div>';

  const fb = state.scanFeedback;
  const fbHtml = fb
    ? '<div class="tile '+(fb.ok?'ok':'err')+' flash"><div class="th">'+ic(fb.ok?'check':'x',15)+esc(fb.title)+'</div><div class="tb">'+fb.body+'</div></div>'
    : '<div class="tile"><div class="th" style="color:var(--ink-2)">'+ic('scan',15)+'En attente d’un scan</div>'
      + '<div class="tb">La douchette écrit directement dans le champ. Entrée valide.</div></div>';

  const recent = state.scans.length
    ? state.scans.slice(0,8).map(s => '<div class="mini">'+ic(s.ok?'check':'x',13)
        + '<span class="'+(s.ok?'tone-ok':'tone-bad')+'">'+esc(s.code)+'</span>'
        + '<span style="color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+s.label+'</span>'
        + '<span class="t">'+esc(s.time)+'</span></div>').join('')
    : '<div class="empty" style="padding:16px">Aucun scan pour l’instant.</div>';

  return '<div class="ph"><div><h1>Préparation</h1><p>Emballer, étiqueter, scanner la sortie · '+esc(m.label)+'</p></div>'
    + '<div class="ph-actions">'
    + (m.code === 'ly'
        ? '<button class="btn" data-act="picklist">'+ic('file',15)+' Liste de picking</button>'
        : '<button class="btn" data-act="print">'+ic('print',15)+' Imprimer les étiquettes</button>')
    + '</div></div>'
    + heroes
    + '<div class="work wide"><div>'
    + filters
    + '<div class="countline">'+rows.length+' commande'+(rows.length>1?'s':'')+' à préparer</div>'
    + '<div class="card"><div class="tw"><table>'+head+'<tbody>'+body+'</tbody></table></div>'+selbar+'</div>'
    + '</div>'
    + '<div class="card sticky">'
    + cardHead(m.code === 'ly' ? 'Scan du sticker Darb' : 'Scan de l’étiquette', m.code === 'ly' ? 'un sticker = un colis' : 'QR de notre étiquette')
    + '<div class="card-b" style="display:flex;flex-direction:column;gap:12px">'
    + targetCard
    + '<label class="scan-in"><span style="color:var(--ink-3)">'+ic('scan',18)+'</span>'
    + '<input id="scanin" autocomplete="off" placeholder="'+(m.code==='ly'?'Scannez le sticker Darb…':'Scannez le QR de l’étiquette…')+'" aria-label="Champ de scan"></label>'
    + fbHtml
    + '<div><div class="kpi-l" style="margin-bottom:6px">Derniers scans</div>'+recent+'</div>'
    + '</div>'
    + '<div class="note">Ne jamais saisir un numéro à la main : le transporteur accepte n’importe quel numéro sans vérifier qu’il nous appartient.</div>'
    + '</div></div>';
}

/* ============================================================
   Écran 3 — Remise transporteur
   ============================================================ */
function screenHandover(){
  const m = M();
  const byAcc = m.accounts.map(a => ({
    acc:a, rows:m.handover.filter(o => a.regions.includes(o.region))
  })).filter(g => g.rows.length || m.accounts.length === 1);

  const kpis = [
    kpi({ label:'À remettre', value:m.handover.length,
          note:m.handover.length ? 'scannés, en attente du transporteur' : 'rien en attente',
          foot:byAcc.slice(0,2).map(g => ({ v:g.rows.length, l:g.acc.label.replace('Darb Assabil — ','') })) }),
    kpi({ label:'Remis aujourd’hui', value:m.handedToday, tone:'ok', note:m.manifestsToday+' manifeste'+(m.manifestsToday>1?'s':'')+' émis',
          foot:[{v:m.manifestsToday, l:'manifestes'},{v:'—', l:'écarts'}] }),
    kpi({ label:'Attente moyenne', value:'2 h 10', note:'entre le scan de sortie et la remise',
          foot:[{v:'0 h 40', l:'plus rapide'},{v:'5 h 20', l:'plus lente', tone:'warn'}] }),
  ];

  const cards = byAcc.map(g => {
    const preview = g.rows.slice(0,5).map(o =>
      '<div class="row" data-ref="'+o.ref+'"><div class="who"><b>'+nm(o.name)+'</b><span>'+nm(o.city)+' · '+esc(o.ref)+'</span></div>'
      + '<div class="what">'+nm(o.product.short)+' × '+o.qty+'</div>'
      + '<div class="meta"><span class="badge b-mute num">'+esc(o.sticker || o.tracking)+'</span>'
      + '<span class="badge b-accent">scanné '+esc(o.scannedAt)+'</span></div></div>').join('');
    const more = g.rows.length > 5 ? '<div class="note">+ '+(g.rows.length-5)+' autres colis dans ce lot.</div>' : '';
    return '<div class="card">'
      + cardHead(g.acc.label, g.rows.length+' colis prêts',
          g.rows.length ? '<button class="btn btn-primary btn-sm" data-handover="'+g.acc.id+'">'+ic('truck',14)+' Remettre '+g.rows.length+' colis</button>' : '')
      + (g.rows.length ? preview + more : '<div class="empty">Aucun colis en attente pour ce compte.</div>')
      + '</div>';
  }).join('');

  const manifests = [
    { t:'09:38', acc:m.accounts[0].label, n:9, who:m.agents[0].n, id:'MF-2026-0818-02' },
    { t:'08:05', acc:m.accounts[0].label, n:5, who:m.agents[0].n, id:'MF-2026-0818-01' },
    { t:'hier 16:12', acc:m.accounts[m.accounts.length-1].label, n:16, who:m.agents[0].n, id:'MF-2026-0817-03' },
  ];

  return '<div class="ph"><div><h1>Remise transporteur</h1><p>Les colis scannés quittent l’entrepôt par lot, avec un manifeste signé</p></div></div>'
    + '<div class="kpis">'+kpis.join('')+'</div>'
    + '<div class="work"><div class="stack">'+cards+'</div>'
    + '<div class="card sticky">'+cardHead('Remises récentes','manifestes émis')
    + '<div class="tw"><table><thead><tr><th>Heure</th><th>Transporteur</th><th class="num">Colis</th><th>Manifeste</th></tr></thead><tbody>'
    + manifests.map(x => '<tr><td class="num">'+esc(x.t)+'</td><td>'+esc(x.acc)+'</td><td class="num">'+x.n+'</td>'
      + '<td><button class="linkish" data-act="manifest">'+esc(x.id)+'</button></td></tr>').join('')
    + '</tbody></table></div>'
    + '<div class="note">La remise passe les colis en « expédié ». Elle ne touche pas au stock : il a déjà été débité au scan de sortie.</div>'
    + '</div></div>';
}

/* ============================================================
   Écran 4 — Retours
   ============================================================ */
const RETURN_REASONS = [
  { id:'packaging', l:'Emballage' },
  { id:'product_defect', l:'Défaut produit' },
  { id:'customer_damage', l:'Dommage client' },
  { id:'carrier_damage', l:'Dommage transporteur' },
  { id:'other', l:'Autre' },
];
function screenReturns(){
  const m = M();
  const pick = state.returnPick ? m.returns.find(r => r.ref === state.returnPick) : null;
  const rate = m.code === 'ly' ? 21 : 17;

  const kpis = [
    kpi({ label:'À traiter', value:m.returns.length, tone:m.returns.length>5?'warn':'',
          note:m.returns.length ? 'le plus ancien : '+Math.max(...m.returns.map(r=>r.days))+' j' : 'file vide',
          foot:[{v:m.returns.filter(r=>r.days<=3).length, l:'≤ 3 j'},{v:m.returns.filter(r=>r.days>7).length, l:'> 7 j', tone:'bad'}] }),
    kpi({ label:'Traités aujourd’hui', value:1, tone:'ok', note:'1 remis en stock · 0 déprécié',
          foot:[{v:'1', l:'en stock'},{v:'0', l:'endommagés'}] }),
    kpi({ label:'Taux de retour', value:rate, unit:'%', note:'sur 28 jours, livraisons + retours',
          foot:[{v:(rate-3)+' %', l:'28 j précédents'},{v:'—', l:'objectif'}] }),
    kpi({ label:'Dépréciés', value:0, unit:'u', note:'aucune perte enregistrée sur 28 j',
          foot:[{v:'0', l:'unités'},{v:money(0), l:'valeur'}] }),
  ];

  const queue = m.returns.map(r =>
    '<div class="row'+(state.returnPick===r.ref?' sel':'')+'" data-ref="'+r.ref+'">'
    + '<div class="who"><b>'+nm(r.name)+'</b><span>'+esc(r.ref)+' · '+nm(r.city)+'</span></div>'
    + '<div class="what">'+nm(r.product.short)+' × '+r.qty+'</div>'
    + '<div class="meta"><span class="badge b-mute">'+esc(r.reason)+'</span>'
    + '<span class="badge '+(r.days>7?'b-bad':r.days>3?'b-warn':'b-mute')+'">'+r.days+' j</span>'
    + '<button class="btn btn-sm" data-pick="'+r.ref+'">Traiter</button></div></div>').join('');

  const choice = (id, icon, title, sub, tone) =>
    '<button class="target" data-mode="'+id+'" style="text-align:start;width:100%;'+(state.returnMode===id?'border-color:var(--'+tone+');background:var(--'+tone+'-bg)':'')+'">'
    + '<div style="display:flex;align-items:center;gap:9px"><span style="color:var(--'+tone+')">'+ic(icon,16)+'</span>'
    + '<b style="font-size:13.5px">'+esc(title)+'</b></div>'
    + '<div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">'+esc(sub)+'</div></button>';

  const reasons = state.returnMode === 'damaged'
    ? '<div><div class="kpi-l" style="margin-bottom:7px">Motif — obligatoire</div><div class="chips">'
      + RETURN_REASONS.map(r => '<button class="chip" data-reason="'+r.id+'" aria-pressed="'+(state.returnReason===r.id)+'">'+esc(r.l)+'</button>').join('')
      + '</div>'
      + '<button class="btn btn-sm" data-act="photo" style="margin-top:10px">'+ic('file',14)+' Joindre une photo (dossier litige)</button></div>'
    : '';

  const decision = pick
    ? '<div class="card-b" style="display:flex;flex-direction:column;gap:13px">'
      + '<div class="target"><div class="lbl">Colis retourné</div>'
      + '<div style="margin-top:6px;font-size:14px;font-weight:650">'+nm(pick.name)+'</div>'
      + '<div style="font-size:12.5px;color:var(--ink-2);margin-top:2px">'+nm(pick.city)+' · '+nm(pick.product.short)+' × '+pick.qty+' · '+money(pick.price*pick.qty)+'</div>'
      + '<div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap"><span class="badge b-mute">'+esc(pick.reason)+'</span>'
      + '<span class="badge '+(pick.days>7?'b-bad':'b-warn')+'">retour il y a '+pick.days+' j</span>'
      + '<span class="badge b-mute num">'+esc(pick.tracking)+'</span></div></div>'
      + choice('restock','check','Remettre en stock','Colis intact · stock +'+pick.qty,'brand')
      + choice('damaged','alert','Endommagé','Sortie définitive · compteur dégâts +'+pick.qty,'bad')
      + choice('redeliver','refresh','Re-livrable','Nouvelle tentative · le colis reste sorti du stock','info')
      + reasons
      + '<button class="btn btn-primary" data-act="confirm-return" style="justify-content:center" '+(!state.returnMode || (state.returnMode==='damaged' && !state.returnReason) ? 'disabled' : '')+'>Valider la décision</button>'
      + '</div>'
    : '<div class="card-b"><label class="scan-in"><span style="color:var(--ink-3)">'+ic('scan',18)+'</span>'
      + '<input id="retin" autocomplete="off" placeholder="Scannez le colis retourné…" aria-label="Scan retour"></label>'
      + '<div class="empty">Scannez un colis ou choisissez « Traiter » dans la file.</div></div>';

  return '<div class="ph"><div><h1>Retours</h1><p>Chaque colis revenu reçoit une décision explicite — jamais un simple passage en file</p></div></div>'
    + '<div class="kpis">'+kpis.join('')+'</div>'
    + '<div class="work">'
    + '<div class="card">'+cardHead('File des retours', m.returns.length+' colis')+ (m.returns.length ? queue : '<div class="empty">Aucun retour en attente.</div>') +'</div>'
    + '<div class="card sticky">'+cardHead('Décision', pick ? pick.ref : 'aucun colis sélectionné')+decision+'</div>'
    + '</div>';
}

/* ============================================================
   Écran 5 — Stock
   ============================================================ */
function screenStock(){
  const m = M();
  const low = m.products.filter(p => p.stock <= p.seuil);
  const cover = m.products.filter(p => p.demand > 0).map(p => Math.floor((p.stock - p.engaged) / p.demand));
  const minCover = cover.length ? Math.min(...cover) : null;
  const held = m.carrierHeld.reduce((s,x) => s + x.qty, 0);

  const kpis = [
    kpi({ label:'Sous seuil', value:low.length, tone:low.length?'bad':'ok',
          note:low.length ? low.map(p=>p.short).join(' · ') : 'aucun produit sous seuil',
          foot:[{v:m.products.length, l:'références'},{v:m.products.filter(p=>p.demand===0).length, l:'sans demande'}] }),
    kpi({ label:'Couverture minimale', value:minCover===null?'—':minCover, unit:minCover===null?'':'j',
          note:minCover===null ? 'pas de demande mesurée' : 'sur la référence la plus tendue',
          foot:[{v:cover.length, l:'produits suivis'},{v:m.products.length-cover.length, l:'dormants'}] }),
    kpi({ label:'Unités chez le transporteur', value:held, tone:held?'':'',
          note:held ? 'détenues par Darb Assabil, expédiées sans passer par nous' : 'aucun stock déporté',
          foot:[{v:m.carrierHeld.length, l:'références'},{v:m.carrierHeldOrders, l:'commandes en cours'}] }),
    kpi({ label:'Réceptions', value:m.receptions28, unit:'28 j',
          note:'dernière : 17 août · BL 2026-0812',
          foot:[{v:'120 u', l:'entrées'},{v:'—', l:'attendues'}] }),
  ];

  const posRow = (p) => {
    const free = Math.max(p.stock - p.engaged, 0);
    const deficit = p.engaged > p.stock;
    const total = Math.max(p.stock, p.engaged);
    const wFree = Math.round(free / total * 100), wEng = Math.round(Math.min(p.engaged, p.stock) / total * 100);
    const cov = p.demand > 0 ? Math.floor(free / p.demand) + ' j de couverture' : 'aucune vente sur 28 j';
    return '<div class="row" style="align-items:flex-start;flex-direction:column;gap:9px">'
      + '<div style="display:flex;align-items:center;gap:10px;width:100%">'
      + '<div class="who" style="flex:1"><b>'+nm(p.name)+'</b><span>'+esc(p.short)+' · seuil '+p.seuil+' u</span></div>'
      + '<span class="badge '+(p.stock<=p.seuil?'b-bad':p.demand===0?'b-mute':'b-ok')+'">'+(p.stock<=p.seuil?'Sous seuil':p.demand===0?'Dormant':'Sain')+'</span>'
      + '<div class="rowbtns"><button class="btn btn-sm" data-modal="reception" data-pid="'+p.id+'">Réception</button>'
      + '<button class="btn btn-sm" data-modal="count" data-pid="'+p.id+'">Inventaire</button>'
      + (m.code==='ly' ? '<button class="btn btn-sm" data-modal="transfer" data-pid="'+p.id+'">Transfert</button>' : '')
      + '</div></div>'
      + '<div style="width:100%">'
      + '<div class="posbar">'
      + (wFree ? '<i style="width:'+wFree+'%;background:var(--chart-1)"></i>' : '')
      + (wEng ? '<i style="width:'+wEng+'%;background:var(--chart-2)"></i>' : '')
      + (deficit ? '<i style="width:12%;background:repeating-linear-gradient(45deg,var(--bad) 0 4px,var(--bad-bg) 4px 8px)"></i>' : '')
      + '</div>'
      + '<div class="legend"><span><i class="key" style="background:var(--chart-1)"></i>Libre <b>'+free+'</b></span>'
      + '<span><i class="key" style="background:var(--chart-2)"></i>Engagé <b>'+p.engaged+'</b></span>'
      + '<span style="color:var(--ink-3)">Registre <b>'+p.stock+'</b></span>'
      + '<span style="margin-inline-start:auto;color:var(--ink-3)">'+esc(cov)+'</span></div>'
      + '</div></div>';
  };

  const heldPanel = m.carrierHeld.length
    ? '<div class="card">'+cardHead('Chez Darb Assabil','entrepôt Tripoli · relevé transporteur',
        '<span class="badge b-mute">'+ic('refresh',11)+' il y a 12 min</span>')
      + m.carrierHeld.map(x =>
        '<div class="row" style="align-items:flex-start;flex-wrap:wrap;gap:8px"><div class="who wrap" style="flex:1 1 100%"><b>'+nm(x.product.name)+'</b><span>'+esc(x.product.short)+'</span></div>'
        + '<div class="meta"><span class="badge b-accent num">'+x.locked+' réservées</span>'
        + '<span class="badge b-info num">'+(x.qty-x.locked)+' disponibles</span>'
        + '<span class="badge b-mute num">'+x.qty+' au total</span></div></div>').join('')
      + '<div class="note">Ces quantités appartiennent au relevé du transporteur, pas à notre registre. Un transfert sortant les déplace de l’un vers l’autre.</div></div>'
    : '<div class="card">'+cardHead('Stock déporté','aucun')
      + '<div class="empty">Aucun stock détenu par un transporteur sur ce marché.</div></div>';

  return '<div class="ph"><div><h1>Stock</h1><p>Position réelle, entrées et corrections — la valeur en dinars reste dans Finances</p></div>'
    + '<div class="ph-actions">'
    + '<button class="btn" data-modal="reception">'+ic('plus',15)+' Réception</button>'
    + '<button class="btn" data-modal="count">'+ic('check',15)+' Inventaire</button>'
    + (m.code==='ly' ? '<button class="btn" data-modal="transfer">'+ic('truck',15)+' Transfert Darb</button>' : '')
    + '</div></div>'
    + '<div class="kpis">'+kpis.join('')+'</div>'
    + '<div class="work">'
    + '<div class="card">'+cardHead('Position par produit', m.products.length+' références actives')+m.products.map(posRow).join('')+'</div>'
    + '<div class="stack sticky">'+heldPanel
    + '<div class="card">'+cardHead('Derniers mouvements','stock uniquement')
    + m.journal.filter(j => j.delta !== null).slice(0,5).map(j =>
      '<div class="row"><div class="who"><b style="font-weight:600">'+nm(j.text)+'</b><span>'+esc(j.day)+' · '+esc(j.time)+' · '+esc(j.who)+'</span></div>'
      + '<div class="meta"><span class="badge '+(j.delta>0?'b-ok':j.delta<0?'b-bad':'b-mute')+' num">'+(j.delta>0?'+':'')+j.delta+'</span></div></div>').join('')
    + '</div></div></div>';
}

/* ============================================================
   Écran 6 — Journal
   ============================================================ */
const KINDS = {
  scan:{ l:'Sortie', c:'b-accent', i:'scan' },
  handover:{ l:'Remise', c:'b-info', i:'truck' },
  return:{ l:'Retour', c:'b-warn', i:'ret' },
  reception:{ l:'Réception', c:'b-ok', i:'plus' },
  count:{ l:'Inventaire', c:'b-mute', i:'check' },
  transfer:{ l:'Transfert', c:'b-info', i:'truck' },
  print:{ l:'Impression', c:'b-mute', i:'print' },
};
function screenJournal(){
  const m = M();
  let rows = m.journal.slice();
  if (state.journalFilter !== 'all') rows = rows.filter(r => r.kind === state.journalFilter);
  const q = state.journalQuery.trim().toLowerCase();
  if (q) rows = rows.filter(r => (r.text + ' ' + r.who).toLowerCase().includes(q));

  const days = [];
  rows.forEach(r => { const d = days.find(x => x.day === r.day); if (d) d.rows.push(r); else days.push({ day:r.day, rows:[r] }); });

  const body = days.length ? days.map(d =>
    '<tr class="daysep"><td colspan="5">'+esc(d.day)+'</td></tr>'
    + d.rows.map(r => {
      const k = KINDS[r.kind];
      return '<tr><td class="num" style="width:64px;color:var(--ink-3)">'+esc(r.time)+'</td>'
        + '<td style="width:120px"><span class="badge '+k.c+'">'+ic(k.i,11)+esc(k.l)+'</span></td>'
        + '<td>'+nm(r.text)+'</td>'
        + '<td style="width:110px;color:var(--ink-2)">'+esc(r.who)+'</td>'
        + '<td class="num" style="width:110px">'+(r.delta === null ? '<span style="color:var(--ink-3)">—</span>'
            : '<b class="'+(r.delta>0?'tone-ok':r.delta<0?'tone-bad':'tone-mute')+'">'+(r.delta>0?'+':'')+r.delta+'</b>'
              + (r.stock!==null?' <span style="color:var(--ink-3)">→ '+r.stock+'</span>':''))+'</td></tr>';
    }).join('')).join('')
    : '<tr><td colspan="5"><div class="empty">Aucun événement ne correspond à ces filtres.</div></td></tr>';

  const filters = [['all','Tout'],['scan','Sorties'],['handover','Remises'],['return','Retours'],['reception','Réceptions'],['count','Inventaires'],['transfer','Transferts'],['print','Impressions']];

  return '<div class="ph"><div><h1>Journal</h1><p>Registre en écriture seule — rien n’est modifié ni supprimé, seulement complété</p></div>'
    + '<div class="ph-actions"><button class="btn" data-act="export">'+ic('dl',15)+' Exporter CSV</button></div></div>'
    + '<div class="kpis">'
    + kpi({ label:'Événements', value:m.journal.filter(j=>j.day==="Aujourd'hui").length, unit:"aujourd'hui",
            note:'toutes catégories confondues', foot:[{v:m.journal.filter(j=>j.kind==='scan'&&j.day==="Aujourd'hui").length, l:'sorties'},{v:m.journal.filter(j=>j.delta!==null).length, l:'mouvements de stock'}] })
    + kpi({ label:'Anomalies', value:1, tone:'warn', note:'1 écart d’inventaire à justifier',
            foot:[{v:'-2 u', l:'écart cumulé'},{v:'1', l:'à revoir'}] })
    + kpi({ label:'Traçabilité', value:'100', unit:'%', tone:'ok', note:'chaque mouvement porte un auteur et un motif',
            foot:[{v:m.agents.length, l:'opérateurs'},{v:'0', l:'sans auteur'}] })
    + '</div>'
    + '<div class="card">'
    + '<div class="card-h"><h2>Événements</h2><span class="sub">'+rows.length+'</span><div class="right">'
    + '<div class="chips">'+filters.map(f => '<button class="chip" data-jf="'+f[0]+'" aria-pressed="'+(state.journalFilter===f[0])+'">'+esc(f[1])+'</button>').join('')+'</div>'
    + '</div></div>'
    + '<div class="card-b" style="padding:12px 16px;border-bottom:1px solid var(--line)"><div class="search">'+ic('scan',14)
    + '<input id="jq" placeholder="Rechercher (produit, opérateur, motif…)" value="'+esc(state.journalQuery)+'"></div></div>'
    + '<div class="tw"><table><thead><tr><th>Heure</th><th>Type</th><th>Événement</th><th>Opérateur</th><th class="num">Stock</th></tr></thead>'
    + '<tbody>'+body+'</tbody></table></div></div>';
}
</script>

<script>
/* ============================================================
   Modales
   ============================================================ */
const USED_STICKERS = new Set(['889190','889193']);

function openModal(html, onMount){
  $('modal').innerHTML = html;
  $('scrim').hidden = false;
  if (onMount) onMount($('modal'));
  const f = $('modal').querySelector('input,select,textarea,button');
  if (f) f.focus();
}
function closeModal(){ $('scrim').hidden = true; $('modal').innerHTML = ''; }

function productOptions(pid){
  return M().products.map(p => '<option value="'+p.id+'" '+(p.id===pid?'selected':'')+'>'+esc(p.short)+' — '+esc(p.name)+'</option>').join('');
}
function findProduct(id){ return M().products.find(p => p.id === id) || M().products[0]; }

function modalReception(pid){
  openModal(
    '<div class="modal-h">'+ic('plus',17)+'<h3>Réception de marchandise</h3></div>'
    + '<div class="modal-b">'
    + '<div class="field"><label for="r-p">Produit</label><select id="r-p">'+productOptions(pid)+'</select></div>'
    + '<div class="grid2">'
    + '<div class="field"><label for="r-q">Quantité reçue</label><input id="r-q" type="number" min="1" value="120"></div>'
    + '<div class="field"><label for="r-d">Date de réception</label><input id="r-d" type="date" value="2026-08-18"></div>'
    + '</div>'
    + '<div class="field"><label for="r-ref">Référence fournisseur / BL</label><input id="r-ref" placeholder="BL 2026-0818" value="BL 2026-0818"></div>'
    + '<div class="field"><label for="r-n">Note</label><textarea id="r-n" rows="2" placeholder="Carton abîmé, 2 unités mises de côté…"></textarea>'
    + '<span class="hint">La note apparaît dans le journal et ne peut plus être effacée ensuite.</span></div>'
    + '<div class="tile" id="r-prev"></div>'
    + '</div>'
    + '<div class="modal-f"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" data-act="do-reception">Enregistrer l’entrée</button></div>',
    (root) => {
      const upd = () => {
        const p = findProduct(root.querySelector('#r-p').value);
        const q = Math.max(0, +root.querySelector('#r-q').value || 0);
        root.querySelector('#r-prev').innerHTML =
          '<div class="th" style="color:var(--ink-2)">Effet sur le registre</div>'
          + '<div class="tb"><b>'+p.stock+'</b> → <b class="tone-ok">'+(p.stock+q)+'</b> unités · +'+q+'</div>';
      };
      root.querySelector('#r-p').oninput = upd; root.querySelector('#r-q').oninput = upd; upd();
    });
}

function modalCount(pid){
  openModal(
    '<div class="modal-h">'+ic('check',17)+'<h3>Inventaire physique</h3></div>'
    + '<div class="modal-b">'
    + '<div class="field"><label for="c-p">Produit</label><select id="c-p">'+productOptions(pid)+'</select></div>'
    + '<div class="grid2">'
    + '<div class="field"><label for="c-sys">Registre</label><input id="c-sys" disabled></div>'
    + '<div class="field"><label for="c-q">Quantité comptée</label><input id="c-q" type="number" min="0" value="0"></div>'
    + '</div>'
    + '<div class="field"><label for="c-r">Motif de l’écart</label><select id="c-r">'
    + '<option value="">— choisir —</option><option>Casse non enregistrée</option><option>Erreur de comptage précédente</option>'
    + '<option>Colis sorti sans scan</option><option>Retour non enregistré</option><option>Vol / perte</option><option>Autre</option></select>'
    + '<span class="hint">Obligatoire : un écart sans motif ne peut pas être justifié plus tard.</span></div>'
    + '<div class="tile" id="c-prev"></div>'
    + '</div>'
    + '<div class="modal-f"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" data-act="do-count" disabled>Valider l’inventaire</button></div>',
    (root) => {
      const upd = () => {
        const p = findProduct(root.querySelector('#c-p').value);
        root.querySelector('#c-sys').value = p.stock + ' unités';
        const q = +root.querySelector('#c-q').value || 0;
        const d = q - p.stock;
        const reason = root.querySelector('#c-r').value;
        root.querySelector('#c-prev').innerHTML = d === 0
          ? '<div class="th" style="color:var(--ink-2)">'+ic('check',15)+'Aucun écart</div><div class="tb">Le comptage confirme le registre. L’inventaire sera tout de même journalisé.</div>'
          : '<div class="th" style="color:var(--'+(d<0?'bad':'brand')+')">'+ic('alert',15)+'Écart de '+(d>0?'+':'')+d+' unités</div>'
            + '<div class="tb">Registre <b>'+p.stock+'</b> → comptage <b>'+q+'</b>. Une ligne de correction sera écrite au journal.</div>';
        root.querySelector('[data-act="do-count"]').disabled = (d !== 0 && !reason);
      };
      ['#c-p','#c-q','#c-r'].forEach(s => { root.querySelector(s).oninput = upd; root.querySelector(s).onchange = upd; });
      upd();
    });
}

function modalTransfer(pid){
  openModal(
    '<div class="modal-h">'+ic('truck',17)+'<h3>Transfert vers l’entrepôt Darb</h3></div>'
    + '<div class="modal-b">'
    + '<div class="field"><label for="t-p">Produit</label><select id="t-p">'+productOptions(pid)+'</select></div>'
    + '<div class="grid2">'
    + '<div class="field"><label for="t-q">Quantité transférée</label><input id="t-q" type="number" min="1" value="60"></div>'
    + '<div class="field"><label for="t-w">Entrepôt destinataire</label><select id="t-w"><option>Darb Assabil — Tripoli</option><option>Darb Assabil — Benghazi</option></select></div>'
    + '</div>'
    + '<div class="field"><label for="t-n">Bon de transfert / note</label><input id="t-n" placeholder="TR-2026-0818-01" value="TR-2026-0818-01"></div>'
    + '<div class="tile" id="t-prev"></div>'
    + '<div class="note" style="border:none;border-radius:var(--r-sm)">Après transfert, ces unités sont expédiées par Darb sans passer par nos étagères : aucun scan de sortie ne sera attendu pour elles.</div>'
    + '</div>'
    + '<div class="modal-f"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" data-act="do-transfer">Enregistrer le transfert</button></div>',
    (root) => {
      const upd = () => {
        const p = findProduct(root.querySelector('#t-p').value);
        const q = Math.max(0, +root.querySelector('#t-q').value || 0);
        const over = q > p.stock;
        root.querySelector('#t-prev').className = 'tile' + (over ? ' err' : '');
        root.querySelector('#t-prev').innerHTML = over
          ? '<div class="th">'+ic('alert',15)+'Quantité supérieure au stock</div>'
            + '<div class="tb">Vous ne détenez que <b>'+p.stock+'</b> unités. Enregistrez d’abord une réception, ou corrigez par un inventaire.</div>'
          : '<div class="th" style="color:var(--ink-2)">Effet</div>'
            + '<div class="tb">Notre registre <b>'+p.stock+'</b> → <b class="tone-bad">'+(p.stock-q)+'</b> · chez Darb <b class="tone-ok">+'+q+'</b></div>';
        root.querySelector('[data-act="do-transfer"]').disabled = over || q === 0;
      };
      root.querySelector('#t-p').oninput = upd; root.querySelector('#t-q').oninput = upd;
      root.querySelector('#t-p').onchange = upd; upd();
    });
}

function modalHandover(accId){
  const m = M();
  const acc = m.accounts.find(a => a.id === accId);
  const rows = m.handover.filter(o => acc.regions.includes(o.region));
  openModal(
    '<div class="modal-h">'+ic('truck',17)+'<h3>Remise au transporteur</h3></div>'
    + '<div class="modal-b">'
    + '<div class="target"><div class="lbl">Lot</div>'
    + '<div style="margin-top:6px;font-size:14px;font-weight:650">'+esc(acc.label)+'</div>'
    + '<div style="font-size:12.5px;color:var(--ink-2);margin-top:2px">'+rows.length+' colis · '+money(rows.reduce((s,o)=>s+o.price*o.qty,0))+' à encaisser</div></div>'
    + '<div style="max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)">'
    + rows.map(o => '<div class="mini" style="padding:8px 11px;border-top:1px solid var(--line-soft)">'
        + '<span style="font-weight:600">'+nm(o.name)+'</span><span style="color:var(--ink-3)">'+nm(o.city)+'</span>'
        + '<span class="t num">'+esc(o.sticker || o.tracking)+'</span></div>').join('')
    + '</div>'
    + '<div class="field"><label for="h-n">Réceptionné par (agent transporteur)</label><input id="h-n" placeholder="Nom du chauffeur"></div>'
    + '<div class="note" style="border:none;border-radius:var(--r-sm)">Un manifeste PDF sera généré et les colis passeront en « expédié ». Le stock ne bouge pas.</div>'
    + '</div>'
    + '<div class="modal-f"><button class="btn" data-close>Annuler</button>'
    + '<button class="btn btn-primary" data-act="do-handover" data-acc="'+accId+'">'+ic('check',14)+' Remettre '+rows.length+' colis</button></div>');
}

/* ============================================================
   Tiroir de détail commande
   ============================================================ */
function openDrawer(ref){
  const m = M();
  const o = m.toPrepare.concat(m.handover, m.returns).find(x => x.ref === ref);
  if (!o) return;
  const stage = o.scannedAt ? 2 : o.days ? 4 : 1;
  const steps = ['Confirmée','Téléchargée chez '+m.carrierLabel,'Scannée en sortie','Remise au transporteur','En livraison'];
  $('drawer').innerHTML =
    '<div class="card-h" style="position:sticky;top:0;background:var(--card);z-index:2">'
    + '<h2>'+esc(o.ref)+'</h2><span class="sub">'+esc(m.carrierLabel)+'</span>'
    + '<div class="right"><button class="btn btn-sm" data-close-drawer>'+ic('x',14)+'</button></div></div>'
    + '<div class="card-b" style="display:flex;flex-direction:column;gap:16px">'
    + '<div><div style="font-size:16px;font-weight:650">'+nm(o.name)+'</div>'
    + '<div style="font-size:13px;color:var(--ink-2)">'+nm(o.city)+(m.code==='ly'?' · '+esc(LY_REGIONS[o.region] ? LY_REGIONS[o.region].label : ''):'')+'</div></div>'
    + '<div>'
    + '<div class="dl"><span>Produit</span><b>'+nm(o.product.short)+'</b></div>'
    + '<div class="dl"><span>Quantité</span><b class="num">'+o.qty+'</b></div>'
    + '<div class="dl"><span>Montant à encaisser</span><b class="num">'+money(o.price*o.qty)+'</b></div>'
    + '<div class="dl"><span>Référence transporteur</span><b class="num">'+esc(o.tracking)+'</b></div>'
    + (o.sticker ? '<div class="dl"><span>Sticker Darb</span><b class="num">'+esc(o.sticker)+'</b></div>' : '')
    + '<div class="dl"><span>Stock du produit</span><b class="num">'+o.product.stock+' u</b></div>'
    + '</div>'
    + '<div><div class="kpi-l" style="margin-bottom:9px">Parcours</div><ul class="tl" style="margin:0;padding-inline-start:18px">'
    + steps.map((s,i) => '<li class="'+(i<stage?'done':'')+'"><b style="font-weight:600">'+esc(s)+'</b>'
        + (i<stage?'<div style="color:var(--ink-3)">'+(i===0?'hier 14:02':i===1?'hier 14:03':'aujourd’hui '+(o.scannedAt||'09:15'))+'</div>':'')+'</li>').join('')
    + '</ul></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn btn-sm" data-act="print">'+ic('print',14)+' Réimprimer</button>'
    + '<button class="btn btn-sm" data-close-drawer>Fermer</button></div>'
    + '</div>';
  $('drawer').hidden = false;
}
function closeDrawer(){ $('drawer').hidden = true; }

/* ============================================================
   Scan
   ============================================================ */
function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function doScan(code){
  const m = M();
  code = (code || '').trim();
  if (!code) return;
  let res;

  if (m.code === 'ly'){
    const target = state.target ? m.toPrepare.find(o => o.ref === state.target) : null;
    if (!/^\d{6,7}$/.test(code)){
      res = { ok:false, title:'Numéro de sticker invalide', body:'Un sticker Darb porte 6 ou 7 chiffres. Scannez-le, ne le saisissez pas.' };
    } else if (!target){
      res = { ok:false, title:'Aucun colis en main', body:'Choisissez d’abord la commande dans la file (bouton <b>Prendre</b>), sinon le sticker serait lié au mauvais colis.' };
    } else if (USED_STICKERS.has(code)){
      res = { ok:false, title:'Sticker déjà utilisé', body:'Le sticker <b>'+esc(code)+'</b> est déjà lié à un autre colis. Prenez le suivant sur le rouleau et signalez celui-ci.' };
    } else if (code.startsWith('7')){
      res = { ok:false, title:'Darb a refusé la liaison', body:'Le transporteur n’a pas répondu. Le colis reste à préparer, le stock n’a pas bougé. Réessayez dans un instant.' };
    } else {
      USED_STICKERS.add(code);
      target.state = 'scanned'; target.sticker = code; target.scannedAt = nowTime();
      target.product.stock -= target.qty;
      m.handover.unshift(target);
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'scan',
        text:'Sortie scannée · '+target.product.name+' · sticker '+code, who:'Vous', delta:-target.qty, stock:target.product.stock });
      state.selected.delete(target.ref);
      state.target = null;
      res = { ok:true, title:'Sticker '+code+' lié', body:'<b>'+esc(target.name)+'</b> · '+esc(target.product.short)+' · stock <b>'+(target.product.stock+target.qty)+' → '+target.product.stock+'</b>' };
    }
  } else {
    const target = m.toPrepare.find(o => o.state === 'todo' && (o.ref.toLowerCase() === code.toLowerCase() || o.tracking.toLowerCase() === code.toLowerCase()));
    if (!target){
      res = { ok:false, title:'Étiquette inconnue', body:'Aucune commande à préparer ne porte le code <b>'+esc(code)+'</b>. Vérifiez qu’elle a bien été téléchargée chez '+esc(m.carrierLabel)+'.' };
    } else if (target.labelled === false){
      res = { ok:false, title:'Étiquette non imprimée', body:'Imprimez l’étiquette de <b>'+esc(target.ref)+'</b> avant de scanner sa sortie.' };
    } else {
      target.state = 'scanned'; target.scannedAt = nowTime();
      target.product.stock -= target.qty;
      m.handover.unshift(target);
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'scan',
        text:'Sortie scannée · '+target.product.name, who:'Vous', delta:-target.qty, stock:target.product.stock });
      state.selected.delete(target.ref);
      res = { ok:true, title:'Sortie enregistrée', body:'<b>'+esc(target.name)+'</b> · '+esc(target.product.short)+' · stock <b>'+(target.product.stock+target.qty)+' → '+target.product.stock+'</b>' };
    }
  }

  state.scanFeedback = res;
  state.scans.unshift({ ok:res.ok, code, time:nowTime(), label:res.ok ? 'sortie enregistrée' : res.title.toLowerCase() });
  if (res.ok) m.scansToday++;
  render();
  const inp = $('scanin'); if (inp){ inp.value = ''; inp.focus(); }
  toast(res.ok ? res.title : res.title, res.ok ? 'ok' : 'err');
}

/* ============================================================
   Rendu + événements
   ============================================================ */
function resetTransient(){
  state.selected.clear(); state.target = null; state.scanFeedback = null; state.scans = [];
  state.returnPick = null; state.returnMode = null; state.returnReason = null;
  state.prepFilter = 'all'; state.prepQuery = ''; state.journalFilter = 'all'; state.journalQuery = '';
  state.prepRegion = null; state.prepProduct = null;
}

/* Menu déroulant des puces de filtre — ancré sous la puce, fermé au clic extérieur. */
let openMenu = null;
function closeMenu(){ if (openMenu){ openMenu.remove(); openMenu = null; } }
function chipMenu(anchor, options, current, onPick){
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = options.map(o =>
    '<button data-v="'+esc(String(o.v))+'" aria-pressed="'+(String(o.v) === String(current))+'">'+esc(o.l)+'</button>').join('');
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect();
  el.style.top = (r.bottom + window.scrollY + 6) + 'px';
  el.style.left = Math.min(r.left + window.scrollX, window.innerWidth - el.offsetWidth - 12) + 'px';
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.v;
    closeMenu();
    onPick(v === 'null' ? null : v);
  });
  openMenu = el;
}
function wirePrepFilters(){
  const m = M();
  const age = $('f-age'), reg = $('f-reg'), prod = $('f-prod');
  if (age) age.onclick = (e) => { e.stopPropagation(); chipMenu(age,
    [{v:'all',l:'Tous les âges'},{v:'fresh',l:'≤ 24 h'},{v:'old',l:'En retard (> 48 h)'}],
    state.prepFilter, (v) => { state.prepFilter = v || 'all'; render(); }); };
  if (reg) reg.onclick = (e) => { e.stopPropagation(); chipMenu(reg,
    [{v:'null', l: m.code === 'ly' ? 'Toutes les régions' : 'Tous les transporteurs'}].concat(
      m.code === 'ly'
        ? Object.keys(LY_REGIONS).map(k => ({ v:k, l:LY_REGIONS[k].label }))
        : [{ v:'tn', l:m.carrierLabel }]),
    state.prepRegion, (v) => { state.prepRegion = v; render(); }); };
  if (prod) prod.onclick = (e) => { e.stopPropagation(); chipMenu(prod,
    [{v:'null',l:'Tous les produits'}].concat(m.products.map(p => ({ v:p.id, l:p.short }))),
    state.prepProduct, (v) => { state.prepProduct = v; render(); }); };
}
document.addEventListener('click', () => closeMenu());
window.addEventListener('resize', () => closeMenu());

const SCREENS = { today:screenToday, prep:screenPrep, handover:screenHandover, returns:screenReturns, stock:screenStock, journal:screenJournal };

function render(){
  renderSide(); renderTop(); renderTabs(); renderProto();
  $('page').innerHTML = SCREENS[state.screen]();
  wireChart($('page'));
  if (state.screen === 'prep'){
    wirePrepFilters();
    const s = $('scanin'); if (s) setTimeout(() => s.focus(), 30);
    const q = $('prepq'); if (q) q.oninput = (e) => { state.prepQuery = e.target.value; const p = e.target.selectionStart; render(); const n = $('prepq'); if (n){ n.focus(); n.setSelectionRange(p,p); } };
  }
  if (state.screen === 'journal'){
    const q = $('jq'); if (q) q.oninput = (e) => { state.journalQuery = e.target.value; const p = e.target.selectionStart; render(); const n = $('jq'); if (n){ n.focus(); n.setSelectionRange(p,p); } };
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-role],[data-mk],[data-filter],[data-check],[data-take],[data-detail],[data-act],[data-modal],[data-handover],[data-pick],[data-mode],[data-reason],[data-jf],[data-close],[data-close-drawer],[data-ref]');
  if (!t) return;

  if (t.dataset.tab){ state.screen = t.dataset.tab; state.scanFeedback = null; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.role){ state.role = t.dataset.role; if (isAgent() && state.screen==='today') {} render(); return; }
  if (t.dataset.mk){ if (state.market !== t.dataset.mk){ state.market = t.dataset.mk; resetTransient(); render(); toast('Marché : '+M().label); } return; }
  if (t.dataset.filter){ state.prepFilter = t.dataset.filter; render(); return; }
  if (t.dataset.jf){ state.journalFilter = t.dataset.jf; render(); return; }
  if (t.dataset.check !== undefined && t.dataset.check){
    const r = t.dataset.check;
    if (state.selected.has(r)) state.selected.delete(r); else state.selected.add(r);
    render(); return;
  }
  if (t.dataset.detail){ openDrawer(t.dataset.detail); return; }
  if (t.dataset.take){ state.target = state.target === t.dataset.take ? null : t.dataset.take; state.scanFeedback = null; render(); return; }
  if (t.dataset.pick){ state.returnPick = t.dataset.pick; state.returnMode = null; state.returnReason = null; render(); return; }
  if (t.dataset.mode){ state.returnMode = t.dataset.mode; if (t.dataset.mode !== 'damaged') state.returnReason = null; render(); return; }
  if (t.dataset.reason){ state.returnReason = t.dataset.reason; render(); return; }
  if (t.dataset.modal){ const pid = t.dataset.pid;
    if (t.dataset.modal === 'reception') modalReception(pid);
    if (t.dataset.modal === 'count') modalCount(pid);
    if (t.dataset.modal === 'transfer') modalTransfer(pid);
    return; }
  if (t.dataset.handover){ modalHandover(t.dataset.handover); return; }
  if (t.hasAttribute('data-close')){ closeModal(); return; }
  if (t.hasAttribute('data-close-drawer')){ closeDrawer(); return; }

  const act = t.dataset.act;
  if (act){
    const m = M();
    if (act === 'clear-sel'){ state.selected.clear(); render(); return; }
    if (act === 'clear-filters'){ state.prepFilter='all'; state.prepRegion=null; state.prepProduct=null; state.prepQuery=''; render(); return; }
    if (act === 'print'){
      const n = state.selected.size || 1;
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'print', text:'Étiquettes imprimées · lot de '+n, who:'Vous', delta:null, stock:null });
      m.toPrepare.forEach(o => { if (state.selected.has(o.ref)) o.labelled = true; });
      state.selected.clear(); closeModal(); render();
      toast(n+' étiquette'+(n>1?'s':'')+' envoyée'+(n>1?'s':'')+' à l’imprimante', 'ok'); return;
    }
    if (act === 'picklist'){ toast('Liste de picking générée'); return; }
    if (act === 'manifest'){ toast('Manifeste ouvert'); return; }
    if (act === 'export'){ toast('Export CSV du journal lancé'); return; }
    if (act === 'photo'){ toast('Photo jointe au dossier litige', 'ok'); return; }
    if (act === 'alert'){ state.screen = 'prep'; render(); return; }
    if (act === 'do-reception'){
      const p = findProduct($('modal').querySelector('#r-p').value);
      const q = Math.max(1, +$('modal').querySelector('#r-q').value || 0);
      const ref = $('modal').querySelector('#r-ref').value || '—';
      p.stock += q; m.receptions28++;
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'reception', text:'Réception fournisseur · '+p.name+' · '+ref, who:'Vous', delta:+q, stock:p.stock });
      closeModal(); render(); toast('Réception enregistrée · +'+q+' unités', 'ok'); return;
    }
    if (act === 'do-count'){
      const p = findProduct($('modal').querySelector('#c-p').value);
      const q = +$('modal').querySelector('#c-q').value || 0;
      const reason = $('modal').querySelector('#c-r').value || 'Comptage conforme';
      const d = q - p.stock;
      p.stock = q;
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'count', text:'Inventaire · '+p.name+' · '+reason, who:'Vous', delta:d, stock:p.stock });
      closeModal(); render();
      toast(d === 0 ? 'Inventaire conforme' : 'Écart de '+(d>0?'+':'')+d+' unités enregistré', d === 0 ? 'ok' : ''); return;
    }
    if (act === 'do-transfer'){
      const p = findProduct($('modal').querySelector('#t-p').value);
      const q = Math.max(1, +$('modal').querySelector('#t-q').value || 0);
      const wh = $('modal').querySelector('#t-w').value;
      p.stock -= q;
      const held = m.carrierHeld.find(x => x.product.id === p.id);
      if (held) held.qty += q; else m.carrierHeld.push({ product:p, qty:q, locked:0 });
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'transfer', text:'Transfert vers '+wh+' · '+p.name, who:'Vous', delta:-q, stock:p.stock });
      closeModal(); render(); toast(q+' unités transférées vers '+wh, 'ok'); return;
    }
    if (act === 'do-handover'){
      const acc = m.accounts.find(a => a.id === t.dataset.acc);
      const rows = m.handover.filter(o => acc.regions.includes(o.region));
      m.handover = m.handover.filter(o => !acc.regions.includes(o.region));
      m.handedToday += rows.length; m.manifestsToday++;
      m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'handover', text:'Remise transporteur · '+acc.label+' · '+rows.length+' colis', who:'Vous', delta:null, stock:null });
      closeModal(); render(); toast(rows.length+' colis remis · manifeste émis', 'ok'); return;
    }
    if (act === 'confirm-return'){
      const r = m.returns.find(x => x.ref === state.returnPick);
      if (!r) return;
      m.returns = m.returns.filter(x => x.ref !== r.ref);
      if (state.returnMode === 'restock'){
        r.product.stock += r.qty;
        m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'return', text:'Retour remis en stock · '+r.product.name, who:'Vous', delta:+r.qty, stock:r.product.stock });
        toast('Remis en stock · +'+r.qty, 'ok');
      } else if (state.returnMode === 'damaged'){
        const lbl = (RETURN_REASONS.find(x => x.id === state.returnReason) || {}).l || 'Autre';
        m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'return', text:'Retour endommagé · '+r.product.name+' · '+lbl, who:'Vous', delta:0, stock:r.product.stock });
        toast('Déprécié · motif « '+lbl+' »', 'err');
      } else {
        m.journal.unshift({ day:"Aujourd'hui", time:nowTime(), kind:'return', text:'Retour re-livrable · '+r.product.name, who:'Vous', delta:null, stock:null });
        m.handover.unshift(r);
        toast('Colis remis en file de livraison', 'ok');
      }
      state.returnPick = null; state.returnMode = null; state.returnReason = null;
      render(); return;
    }
  }

  if (t.dataset.ref && !e.target.closest('button,input')) openDrawer(t.dataset.ref);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){ if (!$('scrim').hidden) closeModal(); else if (!$('drawer').hidden) closeDrawer(); }
  if (e.key === 'Enter'){
    if (e.target && e.target.id === 'scanin'){ e.preventDefault(); doScan(e.target.value); }
    if (e.target && e.target.id === 'retin'){
      e.preventDefault();
      const m = M(), v = e.target.value.trim().toLowerCase();
      const r = m.returns.find(x => x.ref.toLowerCase() === v || x.tracking.toLowerCase() === v);
      if (r){ state.returnPick = r.ref; render(); toast('Retour '+r.ref+' ouvert'); }
      else toast('Aucun retour ne porte ce code', 'err');
    }
  }
});
$('scrim').addEventListener('click', (e) => { if (e.target === $('scrim')) closeModal(); });

render();
</script>
