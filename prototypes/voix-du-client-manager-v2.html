<!doctype html>
<!--
  Voix du client — côté RESPONSABLE, prototype v2. Construit 2026-10-01.
  Plan : plans/voix-du-client.md (Phase 0). Remplace la v1 (tableau de statistiques), refusée par le
  propriétaire le 2026-10-01 : « clair, pas dense, bien structuré, une feuille organisée — surtout pour
  prendre les retours et en tirer des insights, pas centré sur les refus ».
  Décisions du propriétaire (2026-10-01) : feuille groupée avec vues enregistrées · les insights se créent
  à partir des retours sélectionnés · 3 chiffres simples en tête · aucune donnée de refus sur cette page.
  Ce qui est montré :
   · Vue « Tous les retours »  — la feuille, groupée par produit (ou type / sujet / agent / aucun), la phrase
                                 du client en colonne principale, 5 lignes par groupe puis « voir plus ».
   · Vue « À lire »            — ce que personne n'a encore ouvert ; ouvrir une ligne la marque lue.
   · Vue « Réclamations »      — groupée par statut (Ouverte / En cours / Résolue), suivi dans le panneau.
   · Vue « Insights »          — ce que l'équipe a appris, avec ses preuves (les retours liés) et son statut.
   · Vue « Importés à vérifier » — l'arriéré des notes « Autre » importées ; disparaît une fois vidé.
   · Panneau latéral (clic ou Entrée) · sélection multiple (case ou x) → « Créer un insight ».
  URL : ?lang=ar|fr &view=all|unread|complaints|insights|imports &group=product|type|topic|agent|none
        &peek=<réf> &role=super_admin|manager
  DONNÉES RÉELLES (Libye, lues le 2026-09-30 22:46 UTC, reprises de voix-du-client-manager-v1.html) :
  les 148 notes « Autre » porteuses d'un retour (20 mai → 30 sept., datées par order_history), leur
  produit et l'agent qui les a écrites ; 3 réclamations aux mots réels. Types/sujets = règles d'import du
  plan. SIMULÉ : 36 imports encore « à vérifier » (les 38 plus anciens, moins 2 requalifiés en réclamations), l'état « lu », le cycle des réclamations, et les
  4 insights d'exemple (leurs preuves, elles, sont les vraies notes correspondantes).
  Aucune donnée client réelle : noms et téléphones inventés (générés depuis la référence de commande).
-->
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voix du client — responsable, prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F6F6F7; --surface:#FFFFFF; --sunken:#FAFAFB; --hover:#F7F8F9;
    --line:#E1E3E5; --line-subtle:#ECEEF0; --line-strong:#D2D5D9;
    --ink-1:#1A1A1A; --ink-2:#5C6166; --ink-3:#9CA3AF;
    --brand:#15803D; --brand-hover:#12692F; --brand-bg:#EAF6EE; --brand-line:#BBE5C9;
    --crit:#D72C0D; --crit-bg:#FFF4F4; --warn:#8A5A00; --warn-bg:#FFF8E6; --ok:#008060; --ok-bg:#F1F8F5;
    --ins:#6D28D9; --ins-bg:#F5F3FF; --ins-line:#DDD6FE;
    --sidebar:#0E1013; --sidebar-el:#1A1D21; --sidebar-ink:#E6E8EB; --sidebar-2:#B5BAC2; --sidebar-3:#6B7178; --brand-on-dark:#10B981;
    --pb:44px;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
  }
  [data-t=complaint]{--tb:#FEE2E2;--ti:#991B1B;--td:#EF4444}
  [data-t=product]  {--tb:#EDE9FE;--ti:#5B21B6;--td:#8B5CF6}
  [data-t=price]    {--tb:#FEF3C7;--ti:#92400E;--td:#F59E0B}
  [data-t=payment]  {--tb:#CCFBF1;--ti:#115E59;--td:#14B8A6}
  [data-t=delivery] {--tb:#DBEAFE;--ti:#1D4ED8;--td:#3B82F6}
  [data-t=request]  {--tb:#E0E7FF;--ti:#3730A3;--td:#6366F1}
  [data-t=praise]   {--tb:#DCFCE7;--ti:#166534;--td:#22C55E}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink-1);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  [dir=rtl] .flip{transform:scaleX(-1)}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  .q{unicode-bidi:plaintext}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:#fff;font:700 10.5px/1 var(--f);color:var(--ink-2)}
  h1,h2,h3,p{margin:0}

  /* ── prototype chrome (always LTR, French) ── */
  .pbar{position:sticky;top:0;z-index:300;height:var(--pb);background:#1F2328;color:#E6E8EB;padding:0 18px;display:flex;align-items:center;gap:14px;direction:ltr;font-family:var(--f);font-size:12.5px;border-bottom:3px solid var(--brand)}
  .pbar .tag{font-size:10px;font-weight:700;letter-spacing:.13em;color:#7F858F}
  .pbar b{font-size:13px}
  .pbar .grow{flex:1}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:#2B3036}
  .seg button{padding:4px 9px;border-radius:5px;color:#AEB4BB;font-size:12px;font-weight:600}
  .seg button[aria-pressed=true]{background:#fff;color:#111}
  .note{direction:ltr;font-family:var(--f);font-size:12.5px;line-height:1.6;color:#5C6166;background:#FFFBEB;border-bottom:1px solid #FDE68A;padding:8px 18px}
  .note b{color:#1A1A1A}
  .note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:0 4px;border-radius:4px}

  /* ── shell ── */
  .app{display:flex;min-height:calc(100vh - var(--pb));min-width:1360px}
  .app[dir=rtl]{font-family:var(--f-ar)}
  .sb{width:224px;flex:none;background:var(--sidebar);color:var(--sidebar-2);padding:14px 10px 18px;font-size:13px;display:flex;flex-direction:column;gap:1px;position:sticky;top:var(--pb);height:calc(100vh - var(--pb));overflow-y:auto}
  .sb .brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px;padding:4px 10px 12px;font-family:var(--f)}
  .sb .brand i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:12px}
  .sb .mk{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;padding:7px 10px;border-radius:8px;background:var(--sidebar-el);color:var(--sidebar-ink);font-size:12.5px;font-weight:600}
  .sb .mk span{color:var(--sidebar-3);font-weight:500;font-size:11.5px}
  .sb .sec{padding:9px 10px 3px;font-size:12px;color:var(--sidebar-2);font-weight:600}
  .sb .it{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-inline-start:20px;border-radius:7px;color:#9BA1A8}
  .sb .it.on{background:var(--brand);color:#fff;font-weight:600}
  .sb .it .n{margin-inline-start:auto;font-size:11px;font-weight:700;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.2);display:grid;place-items:center}
  .sb .grow{flex:1}
  .sb .me{display:flex;align-items:center;gap:9px;padding:10px;border-top:1px solid rgba(255,255,255,.07);margin-top:10px}
  .sb .me i{width:28px;height:28px;border-radius:50%;background:#2B3036;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
  .sb .me b{display:block;color:var(--sidebar-ink);font-size:12.5px}
  .sb .me span{font-size:11.5px;color:var(--sidebar-3)}

  .main{flex:1;min-width:0;padding:22px 28px 60px}
  .ph{display:flex;align-items:flex-start;gap:16px}
  .ph h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .ph p{margin-top:3px;color:var(--ink-2);font-size:14px}
  .ph .end{margin-inline-start:auto;display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-hover)}
  .btn.ins{background:var(--ins);border-color:var(--ins);color:#fff}
  .btn.sm{height:30px;padding:0 10px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* the three numbers */
  .nums{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .nums button{display:flex;align-items:center;gap:14px;padding:14px 18px;text-align:start;border-inline-start:1px solid var(--line-subtle)}
  .nums button:first-child{border-inline-start:0}
  .nums button:hover{background:var(--hover)}
  .nums button[aria-pressed=true]{box-shadow:inset 0 -2px 0 var(--brand)}
  .nums .v{font-size:26px;font-weight:700;line-height:1;min-width:44px}
  .nums .l{font-size:13.5px;font-weight:600}
  .nums .s{font-size:12.5px;color:var(--ink-2);margin-top:1px}
  .nums .v.crit{color:var(--crit)}

  .work{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
  /* the views rail */
  .rail{position:sticky;top:calc(var(--pb) + 16px)}
  .rail h4{margin:14px 10px 6px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
  .rail h4:first-child{margin-top:0}
  .rail button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border-radius:8px;text-align:start;font-size:13.5px;color:var(--ink-2);font-weight:500}
  .rail button:hover{background:#EDEEF0;color:var(--ink-1)}
  .rail button[aria-pressed=true]{background:#fff;color:var(--ink-1);font-weight:700;box-shadow:0 0 0 1px var(--line)}
  .rail button .ic{color:var(--ink-3)}
  .rail button[aria-pressed=true] .ic{color:var(--brand)}
  .rail button .c{margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
  .rail button .c.dot{min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}
  .rail button .c.ins{background:var(--ins-bg);color:var(--ins);min-width:20px;height:18px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:11px}
  .rail .pthumb{width:22px;height:22px;border-radius:6px}
  .rail .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  /* the sheet */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:12px;min-width:0}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-subtle)}
  .search{display:flex;align-items:center;gap:8px;height:36px;flex:1 1 280px;max-width:420px;padding:0 11px;border:1px solid var(--line);border-radius:9px;color:var(--ink-3)}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13.5px;color:var(--ink-1)}
  .sel{height:36px;padding:0 30px 0 11px;border:1px solid var(--line);border-radius:9px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 9px center/14px;appearance:none;font-size:13px;font-weight:500;color:var(--ink-1)}
  [dir=rtl] .sel{padding:0 11px 0 30px;background-position:left 9px center}
  .gseg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:9px;background:#F1F2F4;margin-inline-start:auto}
  .gseg span{font-size:12px;color:var(--ink-2);padding:0 8px 0 6px}
  .gseg button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .gseg button[aria-pressed=true]{background:#fff;color:var(--ink-1);box-shadow:0 0 0 1px var(--line)}
  .tchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-subtle)}
  .tchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);background:#fff}
  .tchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--td)}
  .tchip b{font-weight:600;color:var(--ink-3)}
  .tchip[aria-pressed=true]{background:var(--tb);border-color:var(--td);color:var(--ti)}
  .tchip[aria-pressed=true] b{color:var(--ti)}
  .fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:999px;background:#F1F2F4;font-size:12.5px;font-weight:600}
  [dir=rtl] .fchip{padding:0 10px 0 6px}
  .fchip button{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2)}
  .fchip button:hover{background:#E1E3E5}

  .cols,.row{display:grid;grid-template-columns:34px 118px minmax(0,1fr) 150px 176px;gap:14px;align-items:center;padding:0 16px}
  .cols{height:34px;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-subtle);position:sticky;top:var(--pb);background:#fff;z-index:5;border-radius:12px 12px 0 0}
  .grp{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;background:var(--sunken);border-bottom:1px solid var(--line-subtle);border-top:1px solid var(--line-subtle);cursor:pointer;user-select:none}
  .grp:first-of-type{border-top:0}
  .grp .chev{color:var(--ink-3);transition:transform .15s}
  .grp[aria-expanded=true] .chev{transform:rotate(90deg)}
  [dir=rtl] .grp[aria-expanded=true] .chev{transform:scaleX(-1) rotate(90deg)}
  .grp .gt{font-size:14.5px;font-weight:700}
  .grp .gc{font-size:13px;color:var(--ink-2)}
  .grp .gnew{font-size:11.5px;font-weight:700;color:var(--brand);background:var(--brand-bg);border-radius:999px;padding:1px 8px}
  .grp .mix{margin-inline-start:auto;display:flex;width:150px;height:6px;border-radius:999px;overflow:hidden;background:#EEF0F2}
  .grp .mix i{display:block;height:100%;background:var(--td)}
  .grp .gall{font-size:12.5px;font-weight:600;color:var(--brand);padding:4px 8px;border-radius:6px}
  .grp .gall:hover{background:var(--brand-bg)}
  .row{min-height:62px;border-bottom:1px solid var(--line-subtle);cursor:pointer;position:relative}
  .row:hover{background:var(--hover)}
  .row[data-focus]{box-shadow:inset 0 0 0 1.5px var(--brand);background:#fff}
  .row[data-sel]{background:#F3FAF5}
  .row[data-peek]{background:#F3FAF5;box-shadow:inset 3px 0 0 var(--brand)}
  [dir=rtl] .row[data-peek]{box-shadow:inset -3px 0 0 var(--brand)}
  .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);background:#fff;display:grid;place-items:center;color:#fff}
  .cb[aria-checked=true]{background:var(--brand);border-color:var(--brand)}
  .cb .ic{width:12px;height:12px;stroke-width:3}
  .tg{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:600;white-space:nowrap;max-width:100%}
  .tg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--td);flex:none}
  .quote{min-width:0}
  .quote .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink-1);min-width:0}
  .quote .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
  .row[data-unread] .quote .t{font-weight:700}
  .row[data-unread] .quote .t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
  .quote .m{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:flex;gap:6px;white-space:nowrap;overflow:hidden}
  .quote .m .d{color:var(--ink-3)}
  .who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;font-family:var(--f)}
  .who b{display:block;font-weight:600;font-size:13px}
  .who small{display:block;color:var(--ink-3);font-size:12px}
  .end{display:flex;align-items:center;gap:6px;justify-content:flex-start;min-width:0}
  .insc{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--ins-bg);color:var(--ins);border:1px solid var(--ins-line);font-size:12px;font-weight:600;max-width:100%;overflow:hidden}
  .insc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .insc .ic{width:13px;height:13px}
  .st{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .st[data-s=open]{background:var(--crit-bg);color:var(--crit)}
  .st[data-s=in_progress]{background:var(--warn-bg);color:var(--warn)}
  .st[data-s=resolved]{background:var(--ok-bg);color:var(--ok)}
  .age{font-size:12px;color:var(--ink-2);white-space:nowrap}
  .age.late{color:var(--crit);font-weight:700}
  .none{color:var(--ink-3)}
  .more{display:flex;align-items:center;gap:6px;height:42px;padding:0 16px;padding-inline-start:66px;font-size:13px;font-weight:600;color:var(--brand);border-bottom:1px solid var(--line-subtle);width:100%}
  .more:hover{background:var(--hover)}
  .sug{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ins);background:var(--ins-bg);border-radius:999px;padding:1px 7px}
  .rowacts{display:flex;gap:6px}
  .rowacts .btn{height:28px;padding:0 9px;font-size:12px}
  .sfoot{display:flex;align-items:center;gap:14px;height:44px;padding:0 16px;font-size:12px;color:var(--ink-2)}
  .sfoot span{display:inline-flex;align-items:center;gap:4px}
  .sfoot .grow{flex:1}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-2)}
  .banner{display:flex;gap:12px;align-items:flex-start;margin:12px 14px 4px;padding:12px 14px;border-radius:10px;background:var(--ins-bg);border:1px solid var(--ins-line);font-size:13.5px;color:#3B1F7A}
  .banner .ic{color:var(--ins);width:18px;height:18px;margin-top:1px}
  .banner b{display:block}
  .banner .btn{margin-inline-start:auto}

  /* product thumbs */
  .pthumb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
  .pthumb .ic{width:15px;height:15px}

  /* ── peek panel ── */
  .veil{position:fixed;inset:var(--pb) 0 0 0;background:rgba(17,24,39,.18);z-index:90}
  .peek{position:fixed;top:var(--pb);bottom:0;inset-inline-end:0;width:500px;background:#fff;border-inline-start:1px solid var(--line);z-index:100;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(17,24,39,.12)}
  .peek .hd{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px 0 18px;border-bottom:1px solid var(--line-subtle);flex:none}
  [dir=rtl] .peek .hd{padding:0 18px 0 14px}
  .peek .hd .grow{flex:1}
  .ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
  .ibtn:hover{background:#F1F2F4}
  .peek .bd{flex:1;min-height:0;overflow-y:auto;padding:18px}
  .bigq{position:relative;padding:16px 20px;border-radius:14px;background:var(--sunken);border:1px solid var(--line-subtle);border-inline-start:4px solid var(--brand);font-size:20px;line-height:1.6;font-weight:600}
  .bigq small{direction:inherit}
  .bigq small{display:block;margin-top:8px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;margin-top:18px;font-size:13.5px;align-items:center}
  .kv dt{color:var(--ink-2)}
  .kv dd{margin:0;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
  .lnk{color:var(--brand);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}

}

/* ═══════════ Notes for the owner ═══════════ */
const NOTES = {
  all:`<b>La feuille.</b> Une seule table calme : la <b>phrase du client</b> est la colonne principale, en gras tant que personne ne l'a lue. Groupée par <b>produit</b> par défaut (ou type, sujet, agent, aucun) ; chaque groupe montre 5 lignes puis « voir plus », et une fine barre de couleurs résume ses types — c'est la seule « statistique » de la page. En tête, trois chiffres seulement, cliquables. Cochez des lignes (case ou <kbd>x</kbd>) → <b>Créer un insight</b>. Clic ou <kbd>Entrée</kbd> → panneau latéral, <kbd>j</kbd>/<kbd>k</kbd> passent à la ligne suivante sans le fermer. Aucune donnée de refus sur cette page.`,
  unread:`<b>À lire.</b> Ce que personne n'a encore ouvert (simulé : les 5 derniers jours). Ouvrir une ligne la marque lue ; le compteur de la barre latérale et du chiffre « À lire » descend. Un seul état « lu » partagé par marché — un responsable qui lit, lit pour l'équipe.`,
  complaints:`<b>Réclamations.</b> La même feuille, groupée par statut. Âge en rouge au-delà de 3 jours. Le panneau porte le suivi : statut, responsable, note de résolution obligatoire pour « Résolue », historique. Les mots et commandes sont réels ; le cycle est simulé.`,
  insights:`<b>Insights.</b> Ce que l'équipe a appris et ce qu'elle en fait — le cœur de « prendre des insights ». Un insight = un titre, une note, un statut (À étudier / En cours / Fait / Écarté), un responsable, et ses <b>preuves</b> : les retours liés. Les 4 insights sont des exemples ; leurs preuves sont les vraies notes du sujet. Ouvrez « Proposer le paiement par carte » : les retours arrivés <b>après</b> sa création sur le même sujet sont proposés en « nouveaux, non liés » → un clic pour les lier.`,
  imports:`<b>Importés à vérifier.</b> L'arriéré des 148 notes « Autre » : type suggéré par mots-clés, un clic pour confirmer ou ignorer, « Tout confirmer » par groupe. La vue disparaît de la barre latérale quand elle est vide — elle ne sert qu'une fois.`,
};

/* ═══════════ Render ═══════════ */
function render(){
  const t = T();
  document.documentElement.lang = S.lang;
  document.getElementById("note").innerHTML = NOTES[S.view] || "";
  [["segLang","lang"],["segRole","role"],["segView","view"]].forEach(([id,k]) => document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S[k])));
  const peekE = S.peek && E.find(e=>e.id===S.peek), peekI = S.ipeek && insOf(S.ipeek);
  document.getElementById("root").innerHTML = `<div class="app" dir="${AR()?"rtl":"ltr"}">${sidebar()}<main class="main">
    <div class="ph"><div><h1>${t.title}</h1><p>${t.sub}</p></div><div class="end"><button class="btn">${IC.down}${t.export}</button></div></div>
    ${numbers()}<div class="work">${rail()}${S.view==="insights"?board():sheet()}</div></main>
    ${peekE?peekFeedback(peekE):""}${peekI?peekInsight(peekI):""}${S.modal?modal():""}${bulk()}${toast()}</div>`;
  const u = new URLSearchParams({lang:S.lang, view:S.view, group:S.group}); if (S.peek) u.set("peek", S.peek);
  history.replaceState(null, "", location.pathname + "?" + u);
}
function keepFocus(id){ render(); const el = document.getElementById(id); if (el){ el.focus(); const v=el.value||""; el.setSelectionRange && el.setSelectionRange(v.length,v.length);} }
function openPeek(id){ const e = E.find(x=>x.id===id); if (!e) return; S.peek = id; S.ipeek = null; S.focus = id; S.linking = false; S.resErr = false; if (e.unread) e.unread = false; render(); document.querySelector(`.row[data-id="${id}"]`)?.scrollIntoView({block:"nearest"}); }
function flash(msg, see){ S.toast = {msg, see}; render(); clearTimeout(S.tt); S.tt = setTimeout(()=>{ S.toast=null; render(); }, 3500); }
function setView(v){ S.view = v; S.prod = ""; S.types.clear(); S.topic=""; S.agent=""; S.sel.clear(); S.peek=null; S.ipeek=null; S.focus=null; S.expanded={}; S.collapsed={}; if (v!=="all") S.per="all"; render(); }
function createInsight(){
  const title = (document.getElementById("mTitle").value || "").trim(); if (!title) return;
  const note = document.getElementById("mNote").value.trim();
  const i = { id:"n"+Date.now(), st:document.getElementById("mSt").value, owner:document.getElementById("mOw").value, created:TODAY,
    title:{fr:title, ar:title}, note:{fr:note||"—", ar:note||"—"}, match:null };
  INS.unshift(i); S.modal.ids.forEach(id => { const e = E.find(x=>x.id===id); if (e && !e.ins.includes(i.id)) e.ins.unshift(i.id); });
  S.modal = null; S.sel.clear(); flash(T().created, i.id);
}

/* ═══════════ Events ═══════════ */
document.addEventListener("click", ev => {
  const g = ev.target.closest.bind(ev.target);
  const seg = g("#segLang button,#segRole button,#segView button");
  if (seg){ const k = {segLang:"lang",segRole:"role",segView:"view"}[seg.parentElement.id]; if (k==="view") return setView(seg.dataset.v); S[k]=seg.dataset.v; return render(); }
  if (S.modal){ if (g("[data-createins]")) return createInsight(); if (g("[data-closemodal]") && !g("[data-stop]") || ev.target.matches("[data-closemodal]")) { S.modal=null; return render(); } return; }
  let el;
  if ((el = g("[data-num]"))){ const n = el.dataset.num; if (n==="week"){ setView("all"); S.per="d7"; return render(); } return setView(n==="compl"?"complaints":"unread"); }
  if ((el = g("[data-view]"))) return setView(el.dataset.view);
  if ((el = g("[data-prod]"))){ setView("all"); S.prod = el.dataset.prod; S.group = S.group==="product"?"type":S.group; return render(); }
  if ((el = g("[data-clear]"))){ S[el.dataset.clear] = ""; return render(); }
  if ((el = g("[data-group]"))){ S.group = el.dataset.group; S.expanded={}; S.collapsed={}; return render(); }
  if ((el = g("[data-type]"))){ const k = el.dataset.type; S.types.has(k)?S.types.delete(k):S.types.add(k); return render(); }
  if ((el = g("[data-more]"))){ S.expanded[el.dataset.more] = true; return render(); }
  if ((el = g("[data-confirmgrp]"))){ ev.stopPropagation(); pool().filter(e=>e.sug[0]===el.dataset.confirmgrp).forEach(e=>{e.review=false;}); if (!pool().length) return setView("all"); return render(); }
  if ((el = g("[data-grp]"))){ const k = el.dataset.grp; S.collapsed[k] = !S.collapsed[k]; return render(); }
  if ((el = g("[data-cb]"))){ const id = el.dataset.cb; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); return render(); }
  if ((el = g("[data-confirm]"))){ const e = E.find(x=>x.id===el.dataset.confirm); e.review=false; e.unread=true; if (S.peek===e.id) S.peek=null; if (!pool().length) return setView("all"); return render(); }
  if ((el = g("[data-ignore]"))){ const e = E.find(x=>x.id===el.dataset.ignore); e.ignored=true; if (S.peek===e.id) S.peek=null; if (!pool().length) return setView("all"); return render(); }
  if (g("[data-confirmsel]")){ S.sel.forEach(id=>{const e=E.find(x=>x.id===id); e.review=false;}); S.sel.clear(); if (!pool().length) return setView("all"); return render(); }
  if (g("[data-mkins]")){ S.modal = {ids:[...S.sel]}; render(); return document.getElementById("mTitle")?.select(); }
  if ((el = g("[data-newins-one]"))){ S.modal = {ids:[el.dataset.newinsOne]}; render(); return document.getElementById("mTitle")?.select(); }
  if (g("[data-newins]")){ S.modal = {ids:[], title:""}; render(); return document.getElementById("mTitle")?.focus(); }
  if (g("[data-markread]")){ S.sel.forEach(id=>{E.find(x=>x.id===id).unread=false;}); S.sel.clear(); return render(); }
  if (g("[data-clearsel]")){ S.sel.clear(); return render(); }
  if (g("[data-closepeek]")){ S.peek=null; S.ipeek=null; return render(); }
  if ((el = g("[data-step]"))){ const rows = visibleRows(), i = rows.findIndex(x=>x.id===S.peek), n = rows[i + +el.dataset.step]; if (n) openPeek(n.id); return; }
  if ((el = g("[data-cst]"))){ const e = E.find(x=>x.id===S.peek), s = el.dataset.cst, note = document.getElementById("res").value.trim();
    if (s==="resolved" && !note){ S.resErr = true; return render(); }
    S.resErr=false; e.resolution = note; if (e.status!==s){ e.status = s; e.tl.push({k:"status",d:TODAY,s,a:S.role==="super_admin"?"Super Admin":"Manager LY"}); } return render(); }
  if (g("[data-linking]")){ S.linking = true; return render(); }
  if ((el = g("[data-linkto]"))){ const e = E.find(x=>x.id===S.peek); e.ins.unshift(el.dataset.linkto); S.linking=false; return flash(T().linked); }
  if ((el = g("[data-ipeek]"))){ S.ipeek = el.dataset.ipeek; S.peek=null; return render(); }
  if ((el = g("[data-ist]"))){ insOf(S.ipeek).st = el.dataset.ist; return render(); }
  if ((el = g("[data-link1]"))){ const [iid, eid] = el.dataset.link1.split("|"); E.find(x=>x.id===eid).ins.push(iid); return render(); }
  if ((el = g("[data-linkall]"))){ const i = insOf(el.dataset.linkall); newUnlinked(i).forEach(e=>e.ins.push(i.id)); return render(); }
  if ((el = g("[data-seeins]"))){ const id = el.dataset.seeins; setView("insights"); S.ipeek = id; S.toast=null; return render(); }
  if ((el = g("[data-open-e]"))){ return; }
  if ((el = g(".row[data-id]"))) return openPeek(el.dataset.id);
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id==="fTopic"){ S.topic = ev.target.value; return render(); }
  if (id==="fAgent"){ S.agent = ev.target.value; return render(); }
  if (id==="fPer"){ S.per = ev.target.value; return render(); }
  if (id==="owner"){ const e = E.find(x=>x.id===S.peek); e.owner = ev.target.value; e.tl.push({k:"assigned",d:TODAY,a:"Manager LY",o:e.owner}); return render(); }
  if (id==="iowner"){ insOf(S.ipeek).owner = ev.target.value; return render(); }
});
document.addEventListener("input", ev => { if (ev.target.id==="q"){ S.q = ev.target.value; keepFocus("q"); } });
const editable = el => el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT");
document.addEventListener("keydown", ev => {
  if (S.modal){ if (ev.key==="Escape"){ S.modal=null; return render(); } if (ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)) return createInsight(); return; }
  if (ev.key==="Escape"){ if (S.peek||S.ipeek){ S.peek=null; S.ipeek=null; return render(); } if (S.sel.size){ S.sel.clear(); return render(); } }
  if (editable(ev.target)) return;
  if (S.view==="insights") return;
  const rows = visibleRows(); if (!rows.length) return;
  const cur = S.peek || S.focus, i = rows.findIndex(x=>x.id===cur);
  if (ev.key==="j"||ev.key==="ArrowDown"){ ev.preventDefault(); const n = rows[Math.min(i+1, rows.length-1)] || rows[0]; if (S.peek) return openPeek(n.id); S.focus = n.id; render(); return document.querySelector(`.row[data-id="${n.id}"]`)?.scrollIntoView({block:"nearest"}); }
  if (ev.key==="k"||ev.key==="ArrowUp"){ ev.preventDefault(); const n = rows[Math.max(i-1, 0)] || rows[0]; if (S.peek) return openPeek(n.id); S.focus = n.id; render(); return document.querySelector(`.row[data-id="${n.id}"]`)?.scrollIntoView({block:"nearest"}); }
  if (ev.key==="Enter" && S.focus && !S.peek){ ev.preventDefault(); return openPeek(S.focus); }
  if (ev.key==="x" && (S.focus||S.peek)){ ev.preventDefault(); const id = S.peek||S.focus; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); return render(); }
  if (ev.key==="/"){ ev.preventDefault(); document.getElementById("q")?.focus(); }
});
render();
</script>
</body>
