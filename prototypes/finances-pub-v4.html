<!doctype html>
<!--
  Finances › Dépenses pub — prototype v4 (2026-10-05).

  Demande du propriétaire : « garder presque tout tel quel, seulement améliorer le visuel pour une cohérence avec
  /products ». Réponses du 5 oct. (toutes « recommandé ») :
    · le LOOK de Produits & marges (kit Finances : verre, fond aurore, Plus Jakarta Sans, titres 32/800) ;
    · + les corrections D'AFFICHAGE seulement — aucune nouvelle fonction, aucune donnée nouvelle ;
    · la CHAÎNE du haut reste une chaîne (une carte de verre), pas des tuiles ;
    · la page entière + le CADRE des fenêtres (Campagnes et produits, Nouvelle dépense, Importer CSV, Supprimer) ;
      la disposition intérieure du tiroir « Campagnes et produits » (v2 du 1er oct.) ne change pas.

  Base = la page EN LIGNE /finance/ad-spend (AdSpendClient + AdSpendEconomics), blocs dans le même ordre, mêmes
  colonnes, mêmes mots. PAS repris de la v3 (nouvelles fonctions, non demandées) : sélecteur de période, plateformes
  par campagne, « + N encore en route », « Trop tôt », clic sur une barre → tableau, cellules TikTok/Snapchat.

  Corrections d'affichage (pastilles numérotées, masquables avec ?notes=0) :
    1. le coût payé par lead est ORANGE (la couleur « pub » de toute la section) — en ligne il était VERT, la
       couleur du bénéfice partout ailleurs ;
    2. « Profit net » → « Bénéfice brut », comme le P&L et Produits & marges ;
    3. les produits sans dépense pub ne font plus chacun une ligne « Coût inconnu » : une seule ligne repliée ;
    4. la colonne Produit du tableau reste collée quand on fait défiler ses 11 colonnes ;
    5. chaque verdict dit sa raison au survol ;
    6. « Où partent… » suit l'ordre des coûts de la section (achat, livraison, retours, pub, emballage) et ses
       couleurs (emballage violet, retours = teinte de la livraison) ;
    7. « Supprimer cette dépense ? » dit la devise du marché — la chaîne fr/ar écrit « TND » en dur, même en Libye.

  Écran super_admin seulement → toujours en français (le super_admin n'a pas de marché, middleware → fr).
  DONNÉES FICTIVES (feuille commune du plan, 12 semaines) — le dépôt est public.
  URL : ?screen=page|drawer|entry|locked|import|preview|delete · ?open=tad|mal|unm · ?notes=0
-->

/* banners — the live two, as Produits' notes */
.notes{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.note{flex:1 1 100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;font-size:13.5px;font-weight:500;line-height:1.45;border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink-2)}
.note b{font-weight:800;color:var(--ink)}
.note.warn{background:linear-gradient(160deg,rgba(255,244,224,.95),rgba(255,255,255,.62))}
.note.warn .nh{background:var(--warn-dot);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--warn-dot) 40%,transparent)}
.note.bad{background:linear-gradient(160deg,rgba(255,228,232,.95),rgba(255,255,255,.62))}
.note.bad .nh{background:var(--bad-dot);color:#fff}
.nh{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.nh .ic{width:16px;height:16px}
.note .go{margin-inline-start:auto;font-size:13px;font-weight:800;color:var(--warn);white-space:nowrap;text-decoration:underline;text-underline-offset:3px}

/* 1 · the chain — one glass card; steps carry Produits' tinted holders, links carry the ratios */
.chain{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px 18px}
.step{display:flex;flex-direction:column;min-width:0}
.step .sh{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k) 13%,#fff);color:var(--k)}
.tk .ic{width:15px;height:15px;stroke-width:2}
.step .sv{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.step .sl{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:7px;white-space:nowrap}
.step.last .sv{color:var(--good)} .step.last.bad .sv{color:var(--bad)}
.lnk{display:flex;flex-direction:column;align-items:center;padding:0 4px;margin-top:22px;flex:none}
.lk{border-radius:12px;padding:5px 10px;text-align:center;background:rgba(255,255,255,.82);border:1px solid var(--glass-in-bd);box-shadow:0 2px 8px rgba(42,52,110,.06)}
.lk b{display:block;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.lk span{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;margin-top:1px}
.lk.cost{background:var(--bad-bg);border-color:transparent;box-shadow:none} .lk.cost b,.lk.cost span{color:var(--bad)}
.lnk svg{width:34px;height:9px;color:var(--ink-4);margin-top:7px}
/* below 1340px the live chain drops its links and wraps to a grid — kept */
@media (max-width:1340px){.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}.lnk{display:none}}

/* two panels */
.two{display:grid;grid-template-columns:1.18fr 1fr;gap:16px;align-items:start}
@media (max-width:1180px){.two{grid-template-columns:1fr}}
.chead h2{font-size:18px;letter-spacing:-.015em;display:flex;align-items:center}
.chead .q{max-width:64ch;line-height:1.5}
.ibtn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.09)}
.ibtn:hover{background:#fff;color:var(--ink)}
.pop.fx{min-width:340px;padding:14px 16px;font-size:12.5px}
.pop.fx h4{font-size:13px;font-weight:800;margin-bottom:8px}
.fxr{display:flex;justify-content:space-between;gap:14px;line-height:1.85}
.fxr span{color:var(--ink-3);font-weight:600} .fxr b{font-weight:700}
.fxr.hr{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}

/* 2 · what you pay for a lead vs what it is worth */
.bgrid{display:grid;grid-template-columns:minmax(180px,236px) 1fr 96px;gap:14px;align-items:center}
.bhead{padding:12px 24px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.bhead .r{text-align:end;line-height:1.4}
.bars{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.brow{padding:8px 12px;border-radius:14px;width:100%;text-align:start;cursor:default}
.brow:hover{background:rgba(255,255,255,.62)}
.brow.neg{background:color-mix(in srgb,var(--bad-bg) 42%,transparent)}
.brow.neg:hover{background:color-mix(in srgb,var(--bad-bg) 62%,transparent)}
.bname{display:flex;align-items:center;gap:10px;min-width:0}
.bname .txt{min-width:0;flex:1}
.bname b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.spk{flex:none;width:46px;height:20px;overflow:visible}
.btrack{position:relative;height:26px}
.btrack::before{content:"";position:absolute;inset:3px 0;border-radius:8px;background:var(--track)}
.bfill{position:absolute;inset-block:2px;inset-inline-start:0;background:var(--m-ads);border-start-start-radius:8px;border-end-start-radius:8px;transform-origin:left;animation:growx .7s cubic-bezier(.2,.8,.2,1) backwards}
.bgap{position:absolute;inset-block:2px;border-start-end-radius:8px;border-end-end-radius:8px;background:repeating-linear-gradient(135deg,#BFE8CF 0 5px,#E4F6EA 5px 10px);box-shadow:inset 0 0 0 1px #A9DCBD}
.brow.neg .bgap{background:repeating-linear-gradient(135deg,#F7B3C3 0 5px,#FDE2E8 5px 10px);box-shadow:inset 0 0 0 1px #F08AA3}
.bcap{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:9px;font-size:11.5px;font-weight:800;color:#fff;z-index:2;font-variant-numeric:tabular-nums}
.bseuil{position:absolute;inset-block:-2px;width:3px;margin-inline-start:-1.5px;background:var(--ink);border-radius:2px;z-index:3}
.bm{text-align:end;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.bm.ok{color:var(--good)} .bm.bad{color:var(--bad)}
.bm em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:3px}
.nospend{margin:8px 24px 0;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px dashed var(--ink-4);border-radius:14px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.nospend b{color:var(--ink);font-weight:800}
.nospend .ic{width:15px;height:15px;color:var(--ink-q)}
.axrow{padding:4px 24px 0}
.axis{position:relative;height:36px;border-top:1px solid var(--line)}
.axis i{position:absolute;top:5px;font-size:11px;color:var(--ink-q);font-style:normal;font-weight:600;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.axis .cap{position:absolute;top:20px;inset-inline-start:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-q);font-weight:600;white-space:nowrap}
.leg{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:6px 24px 20px;font-size:12px;color:var(--ink-2);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg .s{width:12px;height:12px;border-radius:4px;flex:none}
.leg .t{width:3px;height:14px;border-radius:2px;background:var(--ink);flex:none}
.tv{display:none;margin:0 24px 22px;max-height:250px;overflow:auto}
.tv.on{display:block}
.tv table{width:100%;border-collapse:collapse;font-size:12.5px}
.tv th,.tv td{padding:7px 12px;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tv th:first-child,.tv td:first-child{text-align:start}
.tv thead th{position:sticky;top:0;background:rgba(250,251,255,.97);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.tv tbody tr + tr td{border-top:1px solid var(--line)}

/* product tile — Produits' .pimg */
.pimg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--ti);box-shadow:inset 0 0 0 1px rgba(15,23,40,.05)}
.pimg .ic{width:17px;height:17px}
.pimg.sm{width:32px;height:32px;border-radius:10px}
.pimg.sm .ic{width:15px;height:15px}
.pimg.dash{background:transparent;box-shadow:none;border:1.5px dashed var(--ink-4);color:var(--ink-q)}

/* 3 · where a delivered order's money goes */
.stbar{display:flex;height:34px;gap:3px;margin:14px 24px 0;border-radius:12px;overflow:hidden}
.stbar i{display:block;height:100%;position:relative;min-width:3px;background:var(--k);transform-origin:left;animation:growx .7s cubic-bezier(.2,.8,.2,1) backwards}
.stbar i span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;font-style:normal}
.stls{padding:6px 24px 0}
.stl{display:grid;grid-template-columns:12px 1fr auto 56px;align-items:center;gap:11px;padding:9px 0;font-size:13.5px;font-weight:600}
.stl + .stl{border-top:1px solid var(--line)}
.stl .sw{width:12px;height:12px}
.stl .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.stl .p{font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.stl.tot{border-top:1.5px solid rgba(15,23,40,.12)}
.stl.tot .v{color:var(--good);font-size:15px}
.stack .note{margin:12px 24px 22px;box-shadow:none}

/* 4 · per-product table — one glass container, hairlines, Produits' header row */
.tcard{overflow:hidden}
.tcard .chead{padding-bottom:16px}
.tscroll{overflow-x:auto;border-top:1px solid var(--line)}
table.g{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1320px}
.g th,.g td{padding:0 12px;text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.g thead th{padding:13px 12px 12px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);background:rgba(255,255,255,.4);border-bottom:1px solid var(--line);vertical-align:bottom;line-height:1.4}
.g thead th small{display:block;font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-q)}
/* fix 4 — the product column stays put; an opaque ground so figures never show through */
.g th:first-child,.g td:first-child{text-align:start;padding-inline-start:20px;position:sticky;inset-inline-start:0;z-index:2;background:#FAFAFD;box-shadow:10px 0 14px -12px rgba(16,24,40,.28)}
.g thead th:first-child{background:#FBFBFE}
.g tr.prod{cursor:pointer}
.g tr.prod td{padding-block:13px;border-top:1px solid var(--line)}
.g tbody tr.prod:first-child td{border-top:0}
.g tr.prod:hover td{background:rgba(255,255,255,.62)}
.g tr.prod:hover td:first-child{background:#FFFFFF}
.g tr.prod.neg td{background:color-mix(in srgb,var(--bad-bg) 38%,transparent)}
.g tr.prod.neg td:first-child{background:#FFF3F6}
.pcell{display:flex;align-items:center;gap:11px}
.exp{width:16px;height:16px;color:var(--ink-q);flex:none;transition:transform .15s}
tr.open .exp{transform:rotate(90deg)}
[dir=rtl] .exp{transform:scaleX(-1)} [dir=rtl] tr.open .exp{transform:rotate(90deg)}
.pcell b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.pcell small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px}
.fun{color:var(--ink-3)} .fun b{color:var(--ink);font-weight:700}
.big{font-size:14.5px;font-weight:800}
.big.ok{color:var(--good)} .big.bad{color:var(--bad)}
.sub2{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.dim{color:var(--ink-4)}
.vb{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:800;cursor:help;white-space:nowrap}
.vb .ic{width:12px;height:12px;stroke-width:2.4}
.v-scale{background:var(--brand);color:#fff}
.v-ok{background:var(--good-bg);color:var(--good)}
.v-fix{background:var(--warn-bg);color:var(--warn)}
.v-cut{background:var(--bad);color:#fff}
.v-none{background:var(--flat-bg);color:var(--ink-2)}
.v-att{background:rgba(255,255,255,.9);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn-dot)}
.lever{cursor:help}
tr.camps > td{padding:2px 20px 14px 56px!important;background:rgba(255,255,255,.3);position:static!important;box-shadow:none!important;text-align:start}
.cbox{border-radius:var(--r-in);background:rgba(255,255,255,.78);border:1px solid var(--glass-in-bd);overflow:hidden}
table.c{width:100%;border-collapse:collapse;font-size:12.5px}
.c td{padding:10px 14px;text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.c td:first-child{text-align:start;color:var(--ink);white-space:normal}
.c tr + tr td{border-top:1px solid var(--line)}
.c tr.as td{padding-block:7px}
.c tr.as td:first-child{padding-inline-start:36px}
.c .cl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c .cn{font-weight:700}
.c .ci{display:block;font-size:11px;color:var(--ink-q);font-weight:500;margin-top:2px}
.c .amt{color:var(--ink);font-weight:700}
.kick{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-q)}
.c tr.kh td{padding:11px 14px 4px;text-align:start}
.ro{display:inline-flex;align-items:center;gap:5px;color:var(--ink-q);font-weight:600}
.ro .ic{width:12px;height:12px}
.mbtn{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-3)}
.mbtn .ic{width:15px;height:15px}
.mbtn:hover{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.12)}
.mbtn.del:hover{color:var(--bad)}
.g tfoot td{font-weight:800;background:rgba(255,255,255,.5);border-top:1.5px solid rgba(15,23,40,.1);padding-block:14px}
.g tfoot td:first-child{background:#FAFAFD}

/* sync strip — same cells as live, glass */
.sync{display:flex;flex-wrap:wrap}
.sy{flex:1;min-width:170px;padding:15px 20px;display:flex;flex-direction:column;gap:3px}
.sy + .sy{border-inline-start:1px solid var(--line)}
.sy .sv{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;margin-top:3px}
.sy .sv.mut{font-weight:600;color:var(--ink-2)}
.sy .sv i{width:7px;height:7px;border-radius:50%;flex:none}
.sy .sn{font-size:12px;color:var(--ink-3);font-weight:500}

/* tooltip rows (kit .tip holds them) */
.tip .tt{font-weight:800;margin-bottom:5px}
.tip .trw{display:flex;gap:18px;justify-content:space-between;line-height:1.75}
.tip .trw span{color:#B5BAC2;font-weight:600} .tip .trw b{font-variant-numeric:tabular-nums}
.tip .hr{height:1px;background:rgba(255,255,255,.15);margin:6px 0}
.tip p{margin:4px 0 0;color:#D0D4DA;font-weight:500;line-height:1.5}

/* ═══ overlays — the kit's frame; content as today ═══ */
.drawer.wide{width:min(1060px,calc(100vw - 24px));--h:var(--m-ads)}
.dr-h .chip{margin-top:8px}
.dr-band{flex:none;margin:0 24px 14px;box-shadow:none}
.dr-band .meter{margin-inline-start:auto;display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.dr-band .meter i{display:block;width:110px;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.dr-band .meter i b{display:block;height:100%;background:var(--live);border-radius:99px}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:350px 1fr;border-top:1px solid var(--line)}
.pane-l{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pane-l .srch{margin:14px 14px 4px}
.srch{position:relative}
.srch input{width:100%;height:38px;border-radius:12px;border:1px solid var(--card-bd);background:rgba(255,255,255,.85);padding-inline:36px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--card-sh)}
.srch input::placeholder{color:var(--ink-q);font-weight:500}
.srch input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
.srch .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;color:var(--ink-q)}
.colcap{text-align:end;padding:6px 22px 4px;font-size:11.5px;color:var(--ink-q);font-weight:600}
.clist{flex:1;overflow:auto;padding:0 8px 20px}
.cgl{padding:12px 12px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:14px;width:100%;text-align:start}
.crow:hover{background:rgba(255,255,255,.7)}
.crow.on{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.1)}
.crow b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .a{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;text-align:end}
.crow small{font-size:12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.crow small.todo{color:var(--warn);font-weight:700}
.pane-r{overflow:auto;padding:20px 24px 28px;display:grid;gap:16px;align-content:start}
.pane-r h4.big{font-size:18px;font-weight:800;letter-spacing:-.015em}
.pane-r .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.pane-r .meta b{color:var(--ink);font-weight:800}
.dsp{display:flex;align-items:flex-end;gap:2px;height:44px;padding:4px 0}
.dsp i{flex:1;background:color-mix(in srgb,var(--m-ads) 70%,#fff);border-radius:2px 2px 0 0;min-height:2px}
.sell{display:flex;align-items:center;gap:12px}
.sell b{font-size:14px;font-weight:800}
.sell small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.sell .btn2{margin-inline-start:auto}
.asr{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.asr + .asr{border-top:1px solid var(--line)}
.asr span{flex:1;min-width:0;font-weight:600}
.asr small{color:var(--ink-3);font-weight:500}
.frame-note{font-size:12px;color:var(--ink-q);font-weight:600;display:flex;gap:7px;align-items:center}
.frame-note .ic{width:14px;height:14px}

.modal{position:fixed;inset:0;z-index:520;display:grid;place-items:center;padding:16px;pointer-events:none}
.mbox{pointer-events:auto;position:relative;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;background:rgba(250,251,255,.92);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--card-bd);box-shadow:0 30px 80px rgba(20,25,60,.24);isolation:isolate;display:flex;flex-direction:column}
.mbox.w{width:min(780px,100%)}
.mbox.s{width:min(420px,100%)}
.mbox::before{content:"";position:absolute;z-index:-1;inset-inline-start:-90px;top:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--h,var(--m-ads)) 26%,transparent),transparent 70%)}
.mbox .dr-h{padding:22px 24px 10px}
.mb{padding:6px 24px 18px;display:grid;gap:14px}
.mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.mf .grow{flex:1}
.fld{display:grid;gap:6px}
.fld > span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fld > span em{font-style:normal;font-weight:500;color:var(--ink-q)}
.inp{height:40px;border-radius:12px;border:1px solid rgba(15,23,40,.12);background:rgba(255,255,255,.9);padding:0 12px;font-size:14px;font-weight:600;width:100%;display:flex;align-items:center;gap:8px}
.inp:focus,.inp.focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
.inp .ic{color:var(--ink-q);width:15px;height:15px}
.inp .grow{flex:1}
.inp .suf{font-size:12px;font-weight:800;color:var(--ink-3)}
textarea.inp{height:auto;min-height:118px;padding:10px 12px;font:500 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;font-weight:600;color:var(--warn)}
.chk i{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--warn-dot);background:#fff;flex:none;margin-top:1px;display:grid;place-items:center}
.drop{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px dashed var(--ink-4);border-radius:18px;background:rgba(255,255,255,.5)}
.drop .hold{width:40px;height:40px}
.drop b{display:block;font-size:13.5px;font-weight:800}
.drop small{font-size:12px;color:var(--ink-3);font-weight:500}
.drop .btn2{margin-inline-start:auto}
.or{font-size:12px;font-weight:700;color:var(--ink-3)}
.pv{border-radius:var(--r-in);background:rgba(255,255,255,.78);border:1px solid var(--glass-in-bd);overflow:hidden}
.pv table{width:100%;border-collapse:collapse;font-size:12.5px}
.pv th,.pv td{padding:8px 12px;text-align:start;white-space:nowrap}
.pv th{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);background:rgba(255,255,255,.5)}
.pv td.n{text-align:end;font-variant-numeric:tabular-nums;font-weight:700}
.pv tr + tr td{border-top:1px solid var(--line)}
.pv .inp{height:32px;border-radius:10px;font-size:12.5px}
.btn.bad{background:var(--bad)} .btn.bad:hover{background:#A00D3C}
</style>

const ic = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

const fmt = (n) => nf.format(Math.round(n)).replace(/\u202f/g, "\u00a0");

/* a trend pill: dir = "up" | "down" | "eq"; good = is this direction good news? */
function trend(delta, unit, goodWhenUp = true, tipText = "") {
  if (Math.abs(delta) < 0.5) return `<span class="tr eq" ${tipText ? `data-tip="${esc(tipText)}"` : ""}>=</span>`;
  const up = delta > 0, good = up === goodWhenUp;
  return `<span class="tr ${good ? "good" : "bad"}" ${tipText ? `data-tip="${esc(tipText)}"` : ""}>${ic(up ? "up" : "dn")}${fmt(Math.abs(delta))}${unit ? " " + unit : ""}</span>`;
}

    return `<${tag} class="sb-item${it.k === active ? " on" : ""}"${href}>${ic(it.i)}<span>${esc(it.t)}</span>${it.b ? `<em class="sb-badge">${it.b}</em>` : ""}</${tag}>`;
  };
  $("#side").innerHTML = `

}

  p.margin = p.seuil - p.cpl;

  p.revenue = p.deliv * p.aov;
  p.roas = p.spend ? p.revenue / p.spend : null;
  p.drNeeded = (p.cpl + p.rr * RF + p.cr * p.pack) / p.net;
  const d = p.daily, t = Math.max(2, Math.round(d.length / 3));
  p.trend = (d.slice(-t).reduce((a, b) => a + b, 0) - d.slice(0, t).reduce((a, b) => a + b, 0)) / Math.max(1, d.slice(0, t).reduce((a, b) => a + b, 0));

function spark(vals, color) {
  const w = 46, h = 20, pad = 2, mx = Math.max(...vals), mn = Math.min(...vals), rg = Math.max(1, mx - mn);
  const pts = vals.map((v, i) => [pad + (i / (vals.length - 1)) * (w - 2 * pad), h - pad - ((v - mn) / rg) * (h - 2 * pad)]);
  const last = pts[pts.length - 1];
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join("")}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`;
}

/* verdict — the live rule; fix 5 adds the reason on hover */
function verdict(p) {
  if (p.none) return `<span class="vb v-none" data-at="${tt("Non attribué", [], "Aucune dépense ne lui est attribuée : sa marge est inconnue, pas excellente.")}">Non attribué</span>`;
  if (p.margin < 0) {

    return severe
      ? `<span class="vb v-cut" data-at="${tt("À couper", [["Perte", sg(p.profit, 0) + " " + CUR], ["Encaissé", nfd(p.revenue) + " " + CUR]], "La perte dépasse 15 % de ce que le produit a encaissé, ou ses leads augmentent : chaque jour coûte plus.")}">À couper</span>`
      : `<span class="vb v-fix" data-at="${tt("Réparer", [["Perte", sg(p.profit, 0) + " " + CUR]], "Perte petite et stable : un réglage d'enchère ou de confirmation, pas un mauvais produit.")}">${ic("pencil")}Réparer</span>`;
  }
  return p.margin > 0.4 * p.seuil
    ? `<span class="vb v-scale" data-at="${tt("Scaler", [["Marge par lead", sg(p.margin) + " " + CUR], ["Seuil", nfd(p.seuil, 2) + " " + CUR]], "La marge dépasse 40 % du seuil : de la place pour dépenser plus.")}">Scaler</span>`
    : `<span class="vb v-ok" data-at="${tt("Sain", [["Marge par lead", sg(p.margin) + " " + CUR], ["Seuil", nfd(p.seuil, 2) + " " + CUR]], "Rentable, avec peu de place pour payer le lead plus cher.")}">Sain</span>`;
}
function lever(p) {
  if (p.none || p.margin >= 0) return `<span class="dim">—</span>`;
  const cplCut = (p.cpl - p.seuil) / p.cpl, drLift = (p.drNeeded - p.dr) / p.dr;
  return drLift < cplCut
    ? `<span class="tag warn lever" data-at="${tt(`Taux de livraison actuel ${pc1(p.dr)}`)}">Livraison ≥ ${pc1(p.drNeeded)}</span>`
    : `<span class="tag warn lever" data-at="${tt(`CPL actuel ${nfd(p.cpl, 2)}`)}">CPL ≤ ${nfd(p.seuil, 2)} ${CUR}</span>`;
}

    <div class="chead"><div><h2>Où partent ${nfd(rev, 2)} ${CUR} d'une commande livrée${nv(6)}</h2><p class="q">Sur une commande livrée moyenne (tous produits confondus).</p></div></div>
    <div class="stbar">${parts.map((s) => { const pct = (s.v / rev) * 100; return `<i class="${s.c}" style="inline-size:${pct}%" data-at="${tt(s.k, [["Par commande livrée", nfd(s.v, 2) + " " + CUR], ["Part du revenu", nfd(pct, 1) + " %"]])}">${pct > 7 ? `<span>${nfd(pct, 0)} %</span>` : ""}</i>`; }).join("")}</div>
    <div class="stls">${parts.map((s) => `<div class="stl${s.tot ? " tot" : ""}"><span class="sw ${s.c}"></span><span>${s.k}</span><span class="v">${nfd(s.v, 2)}<span class="cur">${CUR}</span></span><span class="p">${nfd((s.v / rev) * 100, 1)} %</span></div>`).join("")}</div>
    <div class="note warn"><span class="nh">${ic("zap")}</span><span>La publicité coûte <b>${nfd(per1(totalSpend) / per1(T.cogs), 1)}×</b> le prix du produit lui-même.</span></div>
  </div>`;
}

/* ─── 4 · per product ─── */
function campRows(p) {
  const synced = `<span class="ro" data-at="${tt("Synchronisé", [], "Ligne synchronisée — la prochaine sync écraserait toute modification.")}">${ic("lock")}Synchronisé</span>`;
  const shareTag = (s) => s === "—" ? "" : `<span class="tag${s.includes("auto") ? " good" : ""}">${s}</span>`;
  let h = (p.camps || []).map((c) => `<tr>
      <td><span class="cl"><span class="kick">Campagne</span><span class="cn">${esc(c.n)}</span>${shareTag(c.share)}<a class="link" href="#" data-scr="drawer">Attribuer</a></span><span class="ci">${c.id}</span></td>
      <td class="amt">${nfd(c.s)} ${CUR}</td>
      <td>${c.ach ? `${c.share.includes("auto") ? "≈ " : ""}${nfd(c.ach)} achats Meta` : "—"}</td>
      <td>${c.ach ? `${nfd(c.s / c.ach, 2)} ${CUR} / achat` : "—"}</td>
      <td>${synced}</td></tr>` +
    (c.sets || []).map((a) => `<tr class="as"><td><span class="cl"><span class="kick">Ensemble</span>${esc(a.n)}</span></td><td>${nfd(a.s)}</td><td></td><td></td><td></td></tr>`).join("")).join("");
  const man = (p.manual || []).filter((m) => m.s > 0);
  if (man.length) h += `<tr class="kh"><td colspan="5"><span class="kick">Saisies manuelles</span></td></tr>` + man.map((m) => `<tr>
      <td><b style="font-weight:600">${esc(m.l)}</b><span class="ci">${m.per}</span></td><td class="amt">${nfd(m.s)} ${CUR}</td><td></td><td></td>
      <td><button class="mbtn" type="button" aria-label="Modifier" data-scr="entry">${ic("pencil")}</button><button class="mbtn del" type="button" aria-label="Supprimer" data-scr="delete">${ic("trash")}</button></td></tr>`).join("");
  if (!h) h = `<tr><td colspan="5" style="color:var(--ink-2)">Aucune dépense enregistrée pour ce produit sur la période.</td></tr>`;
  return `<tr class="camps"><td colspan="11"><div class="cbox"><table class="c">${h}</table></div></td></tr>`;
}
function renderTable() {
  const exp = `<svg class="exp ic" aria-hidden="true"><use href="#i-right"/></svg>`;
  let body = P.map((p) => {
    const neg = !p.none && p.margin < 0, isOpen = open.has(p.k);
    const n = p.camps.length + p.manual.filter((m) => m.s > 0).length;
    const sub = p.camps.length ? `${p.camps.length} campagne${p.camps.length > 1 ? "s" : ""}` : n ? `${n} ligne(s) de dépense` : "Aucune dépense";
    return `<tr class="prod${neg ? " neg" : ""}${isOpen ? " open" : ""}" data-row="${p.k}">
      <td><div class="pcell">${exp}${tile(p)}<span><b>${esc(p.fr)}</b><small>${sub}</small></span></div></td>
      <td>${p.none ? `<span class="dim">—</span>` : nfd(p.spend)}</td>
      <td>${nfd(p.leads)}</td>
      <td class="fun"><b>${p.leads}</b> → <b>${p.conf}</b> → <b>${p.deliv}</b></td>
      <td>${pc1(p.dr)}</td>
      <td>${p.none ? `<span class="dim">—</span>` : nfd(p.cpl, 2)}</td>
      <td>${nfd(p.seuil, 2)}</td>
      <td class="big ${p.none ? "" : neg ? "bad" : "ok"}">${p.none ? `<span class="dim">—</span>` : sg(p.margin)}</td>
      <td class="big ${p.none ? "" : p.profit < 0 ? "bad" : "ok"}">${p.none ? `<span class="dim">—</span>` : sg(p.profit, 0)}${p.roas ? `<div class="sub2">ROAS ${nfd(p.roas, 2)}×</div>` : ""}</td>
      <td>${lever(p)}</td>
      <td>${verdict(p)}</td>
    </tr>` + (isOpen ? campRows(p) : "");
  }).join("");
  const uOpen = open.has("unm");
  body += `<tr class="prod${uOpen ? " open" : ""}" data-row="unm">
    <td><div class="pcell">${exp}<span class="pimg dash">${ic("link")}</span><span><b>Non rattaché à un produit</b><small>${UNMAPPED.camps.length} campagnes</small></span></div></td>
    <td>${nfd(UNMAPPED.spend)}</td>${'<td><span class="dim">—</span></td>'.repeat(7)}
    <td><span class="tag warn">Rattacher à un produit</span></td><td><span class="vb v-att" data-at="${tt("À rattacher", [], "Cette dépense compte dans le bénéfice, mais aucun produit ne la porte : impossible de dire si elle est rentable.")}">À rattacher</span></td></tr>` + (uOpen ? campRows({ camps: UNMAPPED.camps, manual: [] }) : "");
  const foot = `<tr><td>Total</td><td>${nfd(totalSpend)}</td><td>${nfd(T.leads)}</td>
    <td class="fun"><b>${nfd(T.leads)}</b> → <b>${nfd(T.conf)}</b> → <b>${nfd(T.deliv)}</b></td><td>${pc1(T.deliv / T.leads)}</td>
    <td>${nfd(totalSpend / T.leads, 2)}</td><td></td><td></td>
    <td class="big ${totalProfit < 0 ? "bad" : "ok"}">${sg(totalProfit, 0)}<div class="sub2">ROAS ${nfd(T.revenue / totalSpend, 2)}×</div></td><td></td><td></td></tr>`;
  return `
  <div class="card tcard">
    <div class="chead"><div><h2>Par produit</h2><p class="q">Performance et décision par produit (agrégée sur la période sélectionnée).</p></div>
      <div class="rt"><button class="btn2 sm" type="button" data-scr="drawer">${ic("link")}Mapper les campagnes</button></div></div>
    <div class="tscroll"><table class="g">
      <thead><tr><th>Produit${nv(4)}</th><th>Dépenses<small>${CUR}</small></th><th>Leads</th><th>Entonnoir<small>lead → confirmés → livrés</small></th><th>% livraison<small>des leads</small></th><th>CPL payé<small>${CUR}</small></th><th>Seuil max. payable<small>${CUR}</small></th><th>Marge / lead<small>${CUR}</small></th><th>Bénéfice brut<small>${CUR} (ROAS)</small></th><th>Point mort<small>ce qu'il faut atteindre</small></th><th>Verdict${nv(5)}</th></tr></thead>
      <tbody>${body}</tbody><tfoot>${foot}</tfoot>
    </table></div>
  </div>`;
}

/* ─── sync health — the live cells ─── */
function renderSync() {
  const cell = (l, v, n, dot, mut) => `<div class="sy"><span class="eyebrow">${l}</span><span class="sv${mut ? " mut" : ""}">${dot ? `<i style="background:${dot}"></i>` : ""}${v}</span><span class="sn">${n}</span></div>`;
  return `<div class="card sync">
    ${cell("Dernière sync", "il y a 12 min", "214 lignes écrites · 15 campagnes", "var(--live)")}
    ${cell("Prochaine", "18:08", "chaque heure · fenêtre 7 j")}
    ${cell("Compte pub · Libye", "OK · USD", "Africa/Tripoli", "var(--live)")}
    ${cell("Dernière erreur", "Aucune", "30 derniers jours", null, true)}
  </div>`;
}

function renderPage() {
  $("#page").innerHTML = renderHead() + renderNotes() + renderChain() + `<div class="two">${renderBars()}${renderStack()}</div>` + renderTable() + renderSync() +
    `<p class="foot">${ic("info")}<span>Base : les leads reçus dans la période, suivis jusqu'à aujourd'hui (le P&amp;L compte les ventes livrées dans le mois). <b>Prototype v4</b> — la page en ligne au look de Produits &amp; marges, données fictives.</span></p>`;
}

/* ═══ overlays — the kit's frame around today's content ═══ */
function drawerHtml() {
  const row = (n, a, sm, on, todo) => `<button class="crow${on ? " on" : ""}" type="button"><b>${n}</b><span class="a">${a}</span><small class="${todo ? "todo" : ""}">${sm}</small></button>`;
  return `<aside class="drawer wide on" role="dialog" aria-modal="true" aria-labelledby="dr-t">
    <div class="dr-h"><div><h3 id="dr-t">Campagnes et produits</h3><p>La dépense d'une campagne compte dans la marge du produit qu'elle vend.</p><span class="chip"><i class="dot"></i>Synchronisé il y a 12 min</span></div>
      <button class="dr-x" type="button" data-close aria-label="Fermer">${ic("x")}</button></div>
    <div class="note warn dr-band"><span class="nh">${ic("alert")}</span><span><b>${nfd(UNMAPPED.spend)} ${CUR}</b> dépensés par ${UNMAPPED.camps.length} campagnes ne comptent dans la marge d'aucun produit. <button class="go" type="button" style="margin:0">Attribuer</button></span>
      <span class="meter">93 % sur des produits <i><b style="width:93%"></b></i></span></div>
    <div class="panes">
      <section class="pane-l" aria-label="Campagnes">
        <label class="srch">${ic("search")}<input type="search" placeholder="Chercher une campagne ou un produit"></label>
        <div class="colcap">Dépensé depuis le 23 mai</div>
        <div class="clist">
          <div class="cgl">À attribuer</div>
          ${row("Promo automne · Large", "2 010", "Aucun produit", false, true)}
          ${row("Notoriété · Vidéo marque", "670", "Aucun produit", false, true)}
          <div class="cgl">En cours</div>
          ${row("TAD · Lookalike 3 %", "3 420", "Tadabbur", true)}
          ${row("Livres · Catalogue large", "2 287", "2 produits · selon les commandes")}
          ${row("SAC · Sport hommes 18–35", "3 460", "Sac de frappe")}
          ${row("COR · Cadeau enfants", "3 720", "Coran couleurs")}
          <div class="cgl">En pause</div>
          ${row("MAL · Vidéo lecture", "1 555", "Le mal et le remède")}
        </div>
      </section>
      <section class="pane-r">
        <div><h4 class="big">TAD · Lookalike 3 %</h4>
          <div class="meta" style="margin-top:8px"><span class="tag good">En cours</span><span><b>3 420 ${CUR}</b> dépensés du 23 mai au 4 oct.</span></div></div>
        <div class="dsp" aria-label="Dépense quotidienne depuis le 23 mai">${[3,4,4,5,6,5,6,7,6,8,7,7,8,9,8,9,10,9,11,10,9,10,11,12,11,10,12,13,12,11].map((v) => `<i style="height:${v * 7}%"></i>`).join("")}</div>
        <div class="dr-sec"><h4>Ce qu'elle vend</h4>
          <div class="sell">${tile(P.find((p) => p.k === "tad"))}<span><b>Tadabbur</b><small>Depuis le début · 590 commandes pendant sa diffusion</small></span><button class="btn2 sm" type="button">${ic("pencil")}Modifier</button></div></div>
        <div class="dr-sec"><h4>Ensembles de publicités</h4>
          <div class="asr"><span>LAL 3 % · hommes 25–45<br><small>Même produit que la campagne</small></span><button class="link" type="button">Attribuer à part</button></div>
          <div class="asr"><span>LAL 3 % · femmes 25–45<br><small>Même produit que la campagne</small></span><button class="link" type="button">Attribuer à part</button></div></div>
        <p class="frame-note">${ic("info")}Seul le cadre change : liste, détail, éditeur et historique gardent la disposition v2 du 1er oct.</p>
      </section>
    </div>
  </aside>`;
}
function entryHtml(locked) {
  return `<div class="modal"><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="m-t">
    <div class="dr-h"><div><h3 id="m-t">${locked ? "Modifier la dépense" : "Nouvelle dépense"}</h3><p>Libye · ${CUR}</p></div><button class="dr-x" type="button" data-close aria-label="Fermer">${ic("x")}</button></div>
    <div class="mb">
      <div class="row2">
        <label class="fld"><span>Début de période</span><span class="inp">${ic("cal")}<span class="grow">${locked ? "01/06/2026" : "01/10/2026"}</span></span></label>
        <label class="fld"><span>Fin de période</span><span class="inp">${ic("cal")}<span class="grow">${locked ? "30/06/2026" : "05/10/2026"}</span></span></label>
      </div>
      <label class="fld"><span>Montant</span><span class="inp focus"><span class="grow">${locked ? "1 239" : "850"}</span><span class="suf">${CUR}</span></span></label>
      <label class="fld"><span>Produit</span><span class="inp"><span class="grow">${locked ? "Coran couleurs" : "Marché entier (sans produit)"}</span>${ic("down")}</span></label>
      <label class="fld"><span>Note <em>· Optionnel</em></span><span class="inp"><span class="grow" style="color:var(--ink-q);font-weight:500">${locked ? "Influenceuse · story" : "Optionnel"}</span></span></label>
      ${locked ? `<div class="note warn" style="box-shadow:none"><span class="nh">${ic("lock")}</span><span><b>Période clôturée</b> — un relevé investisseur couvre déjà juin.</span></div>
      <label class="chk"><i></i>Je confirme la modification d'une période clôturée</label>` : ""}
    </div>
    <div class="mf"><button class="btn2" type="button" data-close>Annuler</button><button class="btn" type="button"${locked ? " disabled" : ""}>Enregistrer</button></div>
  </div></div>`;
}
function importHtml(preview) {
  const rows = [["Promo automne · Large", "01/09", "30/09", "2 010", "Marché entier"], ["TAD · Vidéo témoignage", "01/09", "30/09", "2 170", "Tadabbur"], ["SAC · Carrousel", "01/09", "30/09", "2 035", "Sac de frappe"], ["MEM · Parents", "01/09", "30/09", "2 930", "Mémoriser facilement"]];
  return `<div class="modal"><div class="mbox w" role="dialog" aria-modal="true" aria-labelledby="m-t">
    <div class="dr-h"><div><h3 id="m-t">Importer depuis CSV</h3><p>${preview ? `${rows.length} ligne(s) détectée(s) — associez chaque campagne à un produit ou laissez « Marché entier ».` : "Collez ou importez un export Meta Ads ou TikTok Ads. Les colonnes sont détectées automatiquement."}</p></div><button class="dr-x" type="button" data-close aria-label="Fermer">${ic("x")}</button></div>
    <div class="mb">${preview
      ? `<div class="pv"><table><thead><tr><th>Campagne</th><th>Début</th><th>Fin</th><th style="text-align:end">Montant</th><th>Produit</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${r[3]}</td><td><span class="inp"><span class="grow">${r[4]}</span>${ic("down")}</span></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="drop"><span class="hold">${ic("file")}</span><span><b>Un export Meta ou TikTok</b><small>.csv · colonnes détectées automatiquement</small></span><button class="btn2 sm" type="button">${ic("upload")}Choisir un fichier</button></div>
         <span class="or">ou coller directement</span>
         <textarea class="inp" placeholder="Collez ici l'export CSV (Meta ou TikTok)…"></textarea>`}
    </div>
    <div class="mf">${preview ? `<button class="btn2" type="button" data-scr="import">Retour</button><span class="grow"></span><button class="btn2" type="button" data-close>Annuler</button><button class="btn" type="button">Importer ${rows.length} ligne(s)</button>` : `<button class="btn2" type="button" data-close>Annuler</button><button class="btn" type="button" data-scr="preview">Analyser</button>`}</div>
  </div></div>`;
}
function deleteHtml() {
  return `<div class="modal"><div class="mbox s" role="dialog" aria-modal="true" aria-labelledby="m-t" style="--h:var(--bad-dot)">
    <div class="dr-h"><div><h3 id="m-t">Supprimer cette dépense ?</h3><p>Dépense de 1 239 ${CUR} — cette action est irréversible.${nv(7)}</p></div></div>
    <div class="mf"><button class="btn2" type="button" data-close>Annuler</button><button class="btn bad" type="button">${ic("trash")}Supprimer</button></div>
  </div></div>`;
}
function renderOverlay() {
  const map = { drawer: drawerHtml, entry: () => entryHtml(false), locked: () => entryHtml(true), import: () => importHtml(false), preview: () => importHtml(true), delete: deleteHtml };
  $("#overlay").innerHTML = map[screen] ? map[screen]() : "";
  $("#scrim").classList.toggle("on", screen !== "page");
  $("#pb-screens").innerHTML = `<i>Écran</i>` + Object.entries(SCREENS).map(([k, l]) => `<a href="?screen=${k}${notesOn ? "" : "&notes=0"}" class="${k === screen ? "on" : ""}">${l}</a>`).join("");
  $("#nt1").classList.toggle("on", notesOn); $("#nt0").classList.toggle("on", !notesOn);
}
function go(s) { screen = s; renderOverlay(); }

document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href='#']"); if (a) e.preventDefault();
  if (e.target.closest("[data-close]") || e.target.id === "scrim") return go("page");
  const s = e.target.closest("[data-scr]"); if (s) { e.preventDefault(); e.stopPropagation(); return go(s.dataset.scr); }
  if (e.target.closest("#fbtn")) return $("#fpop").classList.toggle("on");
  if (!e.target.closest("#fpop")) $("#fpop")?.classList.remove("on");
  if (e.target.closest("#tvbtn")) { const on = $("#tv1").classList.toggle("on"); $("#tvbtn").textContent = on ? "Masquer" : "Tableau"; return; }
  const r = e.target.closest("tr[data-row]");
  if (r) { const k = r.dataset.row; open.has(k) ? open.delete(k) : open.add(k); renderPage(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && screen !== "page") go("page"); });

renderShell("pub");
renderPage();
renderOverlay();
</script>
</body>
</html>
