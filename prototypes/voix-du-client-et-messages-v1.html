<!doctype html>
<!--
  Voix du client + Messages — planche v1 (2026-10-06). « Aurore calme ».
  Plan : plans/voix-du-client-et-messages-redesign.md

  Ce que le propriétaire compare :
    structure=deux|hub      deux pages (Voix du client · Messages) ou un seul hub
    premier=raisons|feuille « Pourquoi ils n'achètent pas » ou « la feuille » en premier
    page=voix|messages      quelle page (en mode hub : quel onglet)
    wa=off|on               WhatsApp non connecté (la réalité du 6 oct.) ou connecté
    lang=fr|ar              le studio reste LTR, seule la scène est en miroir

  Chiffres : Libye, 30 derniers jours au 6 oct. 2026, lus sur la base de prod (97 retours).
  Les phrases des clients sont réelles (sans nom ni numéro). Prénoms d'agents INVENTÉS,
  clients et numéros WhatsApp INVENTÉS (dépôt public). Aucune conversation WhatsApp n'existe :
  la boîte « connectée » est une simulation réaliste.
  Touches : 1/2 structure · A/B premier écran · V/M page · W WhatsApp · L langue
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voix et Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fa:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --quiet:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --card:rgba(255,255,255,.86); --card-bd:rgba(16,24,40,.06); --r:20px; --r-in:14px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(42,52,110,.05);
  --sh-float:0 20px 52px rgba(42,52,110,.18); --sh-panel:0 30px 80px rgba(42,52,110,.24);
  --brand:#15803D; --brand-h:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  /* categories — calm validated steps */
  --c-rec:#E46A7B; --c-obj:#E9A23B; --c-sug:#4DAE7E;
  --good:#067647; --good-bg:#ECFDF3; --bad:#B42318; --bad-bg:#FEF3F2; --flat:#475467; --flat-bg:#F2F4F7;
  --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009; --live:#12B76A;
  --wa:#25D366;
  --aurore:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
           radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
           radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), #F6F7FB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;background:#F6F7FB}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ar{font-family:var(--fa)}
.num{font-variant-numeric:tabular-nums}

/* ── studio bar (not part of the design) ───────────────────────────── */
.studio{position:sticky;top:0;z-index:80;background:#0E1013;color:#E6E8EB;padding:10px 20px 11px;display:grid;gap:7px;direction:ltr;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.studio .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.studio .word{font-weight:800;letter-spacing:-.01em;font-size:15px}
.studio .word small{font-weight:500;color:#7F858F;font-size:12.5px;margin-inline-start:8px}
.studio .grp{display:flex;align-items:center;gap:7px}
.studio .glab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7F858F}
.studio .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#1B1F26}
.studio .seg button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:#B5BAC2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.studio .seg button:hover{color:#fff}
.studio .seg button.on{background:#2A303A;color:#fff}
.studio .seg kbd{font:600 10px var(--f);color:#7F858F;border:1px solid #3A414C;border-radius:4px;padding:0 4px;line-height:15px}
.studio .why{font-size:12.5px;color:#B5BAC2;line-height:1.5}
.studio .why b{color:#fff;font-weight:700}

/* ── shell ─────────────────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 86px)}
.side{background:#0E1013;color:#C9CDD3;padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;position:sticky;top:86px;height:calc(100vh - 86px);overflow:auto}
.side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;color:#fff;font-weight:800;font-size:16px;letter-spacing:-.01em}
.side .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#15803D,#10B981);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.side .mk{margin:0 4px 12px;padding:9px 10px;border-radius:12px;background:#171A20;display:flex;align-items:center;gap:9px;font-size:13px;color:#fff;font-weight:600}
.side .mk small{color:#7F858F;font-weight:500;margin-inline-start:auto}
.side .sec{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#C9CDD3;font-weight:600}
.side .sec .ic{color:#7F858F}
.side .sec.open{color:#fff}
.side .sec.open .ic{color:#fff}
.side .sub{display:flex;flex-direction:column;gap:1px;margin:0 0 6px;padding-inline-start:26px}
.side .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#AEB3BA;font-weight:500;font-size:13px;text-align:start;width:100%}
.side .it:hover{background:#171A20;color:#fff}
.side .it.on{background:rgba(16,185,129,.12);color:#fff;font-weight:700;box-shadow:inset 2px 0 0 #10B981}
[dir=rtl] .side .it.on{box-shadow:inset -2px 0 0 #10B981}
.side .bdg{margin-inline-start:auto;min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:#10B981;color:#04140C;font-size:11px;font-weight:800;display:grid;place-items:center}
.side .bdg.off{background:#2A303A;color:#7F858F}

.stage{background:var(--aurore);background-attachment:fixed;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:26px 32px 90px;display:flex;flex-direction:column;gap:18px}

/* header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.crumb i{font-style:normal;margin:0 6px;color:var(--ink-4)}
.ph h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ph .subl{margin-top:6px;font-size:13.5px;color:var(--ink-3);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .end{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.segc{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.segc button{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.segc .cnt{min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.segc .cnt.grey{background:rgba(15,23,40,.07);color:var(--ink-2)}

/* filter buttons — §4.7b */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{height:38px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid rgba(15,23,40,.09);display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.fb .ic{color:var(--quiet);width:15px;height:15px}
.fb .l{color:var(--ink-3);font-weight:600}
.fb .v{font-weight:700}
.fb .chev{width:14px;height:14px;color:var(--quiet)}
.fb:hover{border-color:rgba(15,23,40,.18)}
.fb.set{background:color-mix(in srgb,var(--brand) 7%,#fff);border-color:color-mix(in srgb,var(--brand) 32%,#fff)}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--sh);min-width:0;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none}
.pad{padding:22px 26px}
.meta{font-size:12.5px;color:var(--ink-3);font-weight:500}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
[dir=rtl] .eyebrow{letter-spacing:0;text-transform:none;font-size:12px}
.h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 2px -4px}
.h2 h2{font-size:20px;font-weight:800;letter-spacing:-.022em}
.h2 p{font-size:13px;color:var(--ink-3);font-weight:500}

/* lede + category rows */
.lede{font-size:23px;font-weight:700;letter-spacing:-.022em;line-height:1.3;max-width:900px}
.lede b{font-weight:800}
.lede .soft{color:var(--ink-2);font-weight:600}
.lede-s{margin-top:6px;font-size:13px;color:var(--ink-3);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:200px minmax(0,1fr) 54px 46px 66px;gap:12px 16px;align-items:center;margin-top:18px}
.cats .row{display:contents}
.cats .row > *{transition:opacity .15s}
.cats:hover .row:not(:hover) > *{opacity:.4}
.cl{display:flex;flex-direction:column;gap:1px;min-width:0}
.cl b{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.cl small{font-size:12px;color:var(--ink-3);font-weight:500;padding-inline-start:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.bt{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));min-width:4px}
.bn{font-size:17px;font-weight:700;text-align:end;letter-spacing:-.02em}
.bp{font-size:13px;font-weight:600;color:var(--ink-3);text-align:end}
.bd{display:flex;justify-content:flex-end}
.tr{display:inline-flex;align-items:center;gap:2px;height:21px;padding:0 7px 0 5px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tr .ic{width:11px;height:11px;stroke-width:2.6}
.tr.good{background:var(--good-bg);color:var(--good)}
.tr.bad{background:var(--bad-bg);color:var(--bad)}
.tr.eq{background:var(--flat-bg);color:var(--flat);padding:0 8px}
.tr.new{background:#F4F3FF;color:#5925DC;padding:0 8px}

.todo{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.todo button{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink-2)}
.todo button:hover{color:var(--ink)}
.todo .red{color:var(--bad)}
.todo .red b{color:var(--bad)}
.todo b{font-weight:800;color:var(--ink)}
.todo .note{margin-inline-start:auto;color:var(--ink-3);font-weight:500;display:inline-flex;gap:6px;align-items:center}

/* reason cards */
.reasons{display:flex;flex-direction:column;gap:12px}
.rc{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(0,.8fr);gap:0;padding:0;overflow:hidden}
.rc > div{padding:18px 22px;min-width:0}
.rc > div + div{border-inline-start:1px solid var(--line)}
.rc:hover{border-color:rgba(16,24,40,.12)}
.rk{display:flex;align-items:flex-start;gap:12px}
.rank{width:26px;height:26px;border-radius:50%;background:rgba(16,24,40,.05);color:var(--ink-2);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.rname{font-size:16px;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.rname-ar{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:1px}
.rfig{display:flex;align-items:baseline;gap:9px;margin-top:12px}
.rfig b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1}
.rfig small{font-size:13px;font-weight:600;color:var(--ink-3)}
.rfig .tr{align-self:center}
.rbar{height:8px;margin-top:12px;border-radius:99px;background:var(--track);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c))}
.ans{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--brand-tint);border:1px solid color-mix(in srgb,var(--brand) 16%,#fff);font-size:13px;line-height:1.45}
.ans .eyebrow{color:var(--brand-h);margin-bottom:3px;font-size:10px}
.ans p{font-weight:600;color:var(--ink)}
.ans-add{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-h);padding:6px 10px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--brand) 40%,#fff)}
.ans-add:hover{background:var(--brand-tint)}
.quotes{display:flex;flex-direction:column;gap:10px}
.q{position:relative;padding-inline-start:14px}
.q::before{content:"";position:absolute;inset-inline-start:0;top:3px;bottom:3px;width:3px;border-radius:3px;background:color-mix(in srgb,var(--c) 55%,#fff)}
.q p{font-family:var(--fa);font-size:15px;font-weight:500;line-height:1.55;unicode-bidi:plaintext}
.q small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px}
.seeall{margin-top:12px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seeall:hover{color:var(--ink)}
.prods{display:flex;flex-direction:column;gap:9px}
.pr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.thumb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.thumb.sm{width:24px;height:24px;border-radius:7px}
.thumb.sm .ic{width:13px;height:13px}
.pr span{font-family:var(--fa);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.pr b{font-size:14px;font-weight:700}
.faded{opacity:.55}

/* product strip (entity cards) */
.pstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pc{padding:15px 16px;text-align:start;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.pc:hover{border-color:rgba(16,24,40,.14)}
.pc.on{box-shadow:inset 0 0 0 1.5px var(--brand),var(--sh)}
.pc .top{display:flex;gap:10px;align-items:center}
.pc .nm{font-family:var(--fa);font-size:14px;font-weight:700;line-height:1.35;unicode-bidi:plaintext;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .fig{display:flex;align-items:baseline;gap:8px}
.pc .fig b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.pc .fig small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.pc .mix{display:flex;gap:2px;height:7px;border-radius:99px;overflow:hidden;background:var(--track)}
.pc .mix i{display:block;height:100%;background:var(--c)}
.pc .topr{font-size:12.5px;color:var(--ink-2);font-weight:600}
.pc .topr em{font-style:normal;color:var(--ink-3);font-weight:500}

/* complaints */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 22px}
.crow + .crow{border-top:1px solid var(--line)}
.crow .t{display:flex;gap:12px;align-items:flex-start}
.ci{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-rec) 14%,#fff);color:#C0354B;flex:none}
.crow h3{font-size:14.5px;font-weight:800}
.crow p{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px}
.crow .says{font-family:var(--fa);color:var(--ink);font-weight:500;font-size:14px;unicode-bidi:plaintext}
.crow .acts{display:flex;gap:8px}
.btn{height:34px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-h)}
.btn.sec{background:rgba(255,255,255,.9);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn.sec:hover{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.10)}
.btn.ghost{color:var(--ink-2)}
.btn.ghost:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.btn .ic{width:15px;height:15px}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.open{background:var(--bad-bg);color:var(--bad)}
.st.prog{background:var(--warn-bg);color:var(--warn)}
.st.done{background:var(--good-bg);color:var(--good)}
.st.check{background:var(--warn-bg);color:var(--warn)}
.st.imp{background:none;color:var(--ink-3);font-weight:600;padding:0}
.cfoot{padding:11px 22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}

/* sheet */
.sheet{overflow:hidden}
.stools{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.views{display:flex;gap:4px;flex-wrap:wrap}
.vw{height:30px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.vw:hover{background:rgba(15,23,40,.04);color:var(--ink)}
.vw.on{background:var(--ink);color:#fff}
.vw.on .n{color:#C9CED7}
.vw .n{font-weight:600;color:var(--ink-3);font-size:12px}
.vw .dot{width:7px;height:7px}
.grpby{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.mini{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:rgba(15,23,40,.05)}
.mini button{height:26px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mini button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.4)}
[dir=rtl] th{letter-spacing:0;text-transform:none;font-size:12px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:rgba(255,255,255,.75)}
tbody tr.r.sel td{background:color-mix(in srgb,var(--brand) 6%,#fff)}
tbody tr.r.peek td{background:#fff}
tbody tr.r.peek td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
[dir=rtl] tbody tr.r.peek td:first-child{box-shadow:inset -3px 0 0 var(--brand)}
tr.g td{background:rgba(246,247,251,.7);padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}
tr.g td .gin{display:flex;align-items:center;gap:9px}
tr.g td .gn{color:var(--ink-3);font-weight:600}
tr.g td .ic{width:14px;height:14px;color:var(--quiet);transition:transform .15s}
tr.g.closed td .ic.chev{transform:rotate(-90deg)}
[dir=rtl] tr.g.closed td .ic.chev{transform:rotate(90deg)}
tr.more td{font-size:12.5px;color:var(--ink-3);font-weight:600;padding:8px 12px 8px 48px}
.says{font-family:var(--fa);font-size:14.5px;font-weight:500;unicode-bidi:plaintext;display:block;max-width:440px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.cb{width:16px;height:16px;border-radius:5px;border:1.5px solid rgba(15,23,40,.22);display:grid;place-items:center;background:#fff}
.cb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cb .ic{width:11px;height:11px;stroke-width:3}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink-2)}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;background:linear-gradient(140deg,var(--a5),var(--a7));box-shadow:0 0 0 2px #fff,0 4px 10px color-mix(in srgb,var(--a5) 35%,transparent)}
.av .ic{width:12px;height:12px}
.mom{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.mom .ic{width:14px;height:14px;color:var(--quiet)}
.date{color:var(--ink-3);font-weight:600;white-space:nowrap;font-size:13px}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.minis > div{padding:16px 22px;border-inline-start:1px solid var(--line)}
.minis > div:first-child{border:0}
.minis .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.minis .v{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.minis .v b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.minis .v small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.minis .alert b{color:var(--bad)}

.bulk{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;background:#101828;color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-float);font-size:13.5px;font-weight:600}
.bulk .btn.sec{background:#1D2939;border-color:#344054;color:#fff}
.bulk .btn.sec:hover{background:#344054;box-shadow:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,40,.22);backdrop-filter:blur(3px);z-index:70}
.drawer{position:fixed;top:98px;bottom:12px;inset-inline-end:12px;width:500px;max-width:calc(100vw - 24px);z-index:71;background:rgba(250,251,255,.92);border:1px solid #fff;border-radius:26px;box-shadow:var(--sh-panel);backdrop-filter:blur(24px);display:flex;flex-direction:column;overflow:hidden;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
[dir=rtl] .drawer{animation-name:slider}
@keyframes slider{from{transform:translateX(-30px);opacity:0}}
.dh{padding:20px 22px 14px;display:flex;gap:12px;align-items:flex-start}
.dh .x{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.7);border:1px solid #fff;color:var(--ink-2);flex:none}
.dh h2{font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.dh .s{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);font-weight:600}
.db{padding:0 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.gl{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:15px 16px}
.bigq{font-family:var(--fa);font-size:19px;font-weight:500;line-height:1.6;unicode-bidi:plaintext}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px 12px;font-size:13.5px;margin-top:10px}
.facts dt{color:var(--ink-3);font-weight:600}
.facts dd{margin:0;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.facts a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-4)}
.df{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.5)}
.df .sp{flex:1}
.sel{height:36px;border-radius:10px;border:1px solid rgba(15,23,40,.12);background:#fff;padding:0 10px;font-size:13.5px;font-weight:600;width:100%}

/* Arabic words inside a French page align with their captions */
.stage[dir=ltr] .q p,.stage[dir=ltr] .pr span,.stage[dir=ltr] .says,.stage[dir=ltr] .pc .nm,.stage[dir=ltr] .bigq,.stage[dir=ltr] .cv .pv{text-align:left}
.stage[dir=rtl] .q p,.stage[dir=rtl] .pr span,.stage[dir=rtl] .says,.stage[dir=rtl] .pc .nm,.stage[dir=rtl] .cv .pv{text-align:right}

/* ── messages ───────────────────────────────────────────────────────── */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr) 300px;gap:14px;height:calc(100vh - 250px);min-height:560px}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lhead{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{height:36px;border-radius:11px;background:#fff;border:1px solid rgba(15,23,40,.09);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--quiet);font-size:13px;font-weight:500}
.ltabs{display:flex;gap:4px}
.ltabs .vw{height:28px;font-size:12.5px;padding:0 10px}
.list{overflow:auto;flex:1}
.cv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:start;width:100%;align-items:start}
.cv:hover{background:rgba(255,255,255,.7)}
.cv.on{background:#fff;box-shadow:inset 3px 0 0 var(--brand)}
[dir=rtl] .cv.on{box-shadow:inset -3px 0 0 var(--brand)}
.cav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink-2);background:linear-gradient(140deg,#EEF0F5,#DDE1EA)}
.cv .nm{font-size:14px;font-weight:700;display:flex;gap:7px;align-items:baseline;min-width:0}
.cv .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .ph{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.cv .pv{font-family:var(--fa);font-size:13.5px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.cv .hint{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(15,23,40,.05);color:var(--ink-2);white-space:nowrap}
.tag .ic{width:11px;height:11px}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.brand{background:var(--brand-bg);color:var(--brand-h)}
.cv .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.cv .end .wait{color:var(--warn)}
.ub{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}

.chead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.chead h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.chead .s{font-size:12.5px;color:var(--ink-3);font-weight:600;direction:ltr;unicode-bidi:isolate}
.chead .wnd{margin-inline-start:auto}
.thread{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(246,247,251,.5),rgba(246,247,251,.85))}
.day{align-self:center;font-size:11.5px;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,.8);padding:3px 10px;border-radius:99px;margin:6px 0}
.bub{max-width:72%;padding:9px 13px 7px;border-radius:16px;font-size:14.5px;line-height:1.5;position:relative}
.bub p{font-family:var(--fa);unicode-bidi:plaintext}
.bub small{display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:2px}
.bub.in{align-self:flex-start;background:#fff;border:1px solid rgba(15,23,40,.06);border-end-start-radius:6px}
.bub.out{align-self:flex-end;background:#E3F5E9;border:1px solid #CBEBD6;border-end-end-radius:6px}
.bub.auto{align-self:flex-end;background:#fff;border:1px dashed rgba(15,23,40,.15);border-end-end-radius:6px}
.bub .by{font-size:11px;font-weight:800;color:var(--brand-h);margin-bottom:2px;font-family:var(--f)}
.bub.auto .by{color:var(--ink-3)}
.compose{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:8px;align-items:flex-end;background:rgba(255,255,255,.6)}
.compose .box{flex:1;min-height:40px;border-radius:12px;background:#fff;border:1px solid rgba(15,23,40,.1);padding:10px 12px;font-size:14px;color:var(--quiet);font-weight:500}
.compose .btn{height:40px}
.wclosed{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);font-weight:600;background:rgba(255,255,255,.6)}
.wclosed .btn{margin-inline-start:auto}

.who-p{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.who-p h3{font-size:15px;font-weight:800}
.match{border-radius:14px;background:#fff;border:1px solid rgba(15,23,40,.07);padding:12px}
.match .mt{display:flex;gap:10px;align-items:center}
.match .mt b{font-size:13.5px;font-weight:800}
.match .mt small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.match .ms{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:600}
.match .btn{width:100%;justify-content:center;margin-top:10px}
.hintp{font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.45}
.done-box{border-radius:14px;background:var(--good-bg);color:var(--good);padding:12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.ospill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700}

/* dormant */
.dorm{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;overflow:hidden}
.dorm > div{padding:30px 32px}
.dorm > div + div{border-inline-start:1px solid var(--line);background:rgba(255,255,255,.45)}
.waic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--wa) 14%,#fff);color:#128C4A;margin-bottom:16px}
.waic .ic{width:26px;height:26px}
.dorm h2{font-size:22px;font-weight:800;letter-spacing:-.022em}
.dorm .lead{margin-top:8px;font-size:14.5px;color:var(--ink-2);font-weight:500;line-height:1.55;max-width:520px}
.will{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.will li{display:flex;gap:12px;align-items:flex-start}
.will .n{width:30px;height:30px;border-radius:10px;background:rgba(15,23,40,.05);display:grid;place-items:center;color:var(--ink-2);flex:none}
.will b{display:block;font-size:14px;font-weight:700}
.will span{font-size:13px;color:var(--ink-3);font-weight:500}
.steps{display:flex;flex-direction:column;gap:0;margin-top:14px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps .c{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--ink-4);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-3);flex:none}
.steps b{display:block;font-size:13.5px;font-weight:700}
.steps span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.ghost-inbox{margin-top:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;opacity:.6}
.gh{height:64px;border-radius:14px;border:1.5px dashed var(--ink-4);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink-3);font-size:12.5px;font-weight:600}
.gh i{width:30px;height:30px;border-radius:50%;background:var(--track);flex:none}

.tbl-card{overflow:hidden}
.offline{margin:14px 18px 0;padding:10px 12px;border-radius:12px;background:rgba(15,23,40,.04);font-size:13px;color:var(--ink-2);font-weight:600;display:flex;gap:8px;align-items:center}

.annot{font-size:12.5px;color:var(--ink-3);font-weight:500;display:flex;gap:6px;align-items:center;margin:0 2px}

@media (max-width:1100px){
  .rc{grid-template-columns:1fr}
  .rc > div + div{border-inline-start:0;border-top:1px solid var(--line)}
  .inbox{grid-template-columns:300px minmax(0,1fr)}
  .inbox .who-col{display:none}
  .pstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .page{padding:18px 16px 90px}
  .cats{grid-template-columns:minmax(0,1fr) 44px 60px}
  .cats .bt,.cats .bp{display:none}
  .dorm{grid-template-columns:1fr}
  .minis{grid-template-columns:repeat(2,1fr)}
  .inbox{grid-template-columns:1fr;height:auto}
}
</style>
</head>

<script>

const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═════════ state ═════════ */
const qs=new URLSearchParams(location.search);
const S={
  struct: qs.get('structure')==='hub'?'hub':'two',
  first: qs.get('premier')==='feuille'?'sheet':'reasons',

function av(k,size){const a=AG[k];const s=size?`width:${size}px;height:${size}px;font-size:${size>30?14:11}px;`:'';return `<span class="av" style="--a5:${a.a5};--a7:${a.a7};${s}">${a.courier?ic('truck'):a.n[0]}</span>`}
function whoName(k){return k==='darb'?t('courier'):AG[k].n}
function thumb(p,sm){const x=PROD[p];return `<span class="thumb ${sm?'sm':''}" style="background:${x.bg}">${ic(x.ic)}</span>`}
function trend(n,prev,cat){
  if(prev===0&&n>0)return `<span class="tr new" title="${esc(t('vsPrev')(prev))}">${t('newT')}</span>`;
  const d=n-prev; if(d===0)return `<span class="tr eq" title="${esc(t('vsPrev')(prev))}">=</span>`;
  const bad=cat==='suggestion'?false:d>0; const cls=cat==='suggestion'?(d>0?'good':'eq'):(bad?'bad':'good');
  return `<span class="tr ${cls}" title="${esc(t('vsPrev')(prev))}" dir="ltr">${ic(d>0?'up':'down')}${Math.abs(d)}</span>`;
}
function pct(a,b){return Math.round(a*100/b)+(S.lang==='ar'?'%':' %')}

function sheetView(){
  const live=ROWS.filter(r=>!S.discarded.has(r.id));
  let rows=live;
  if(S.view==='check')rows=rows.filter(r=>!r.reason);
  else if(S.view!=='all')rows=rows.filter(r=>r.cat===S.view);
  if(S.prod)rows=rows.filter(r=>r.prod===S.prod);
  const nCheck=checkN();
  const views=[['all',t('vAll'),97-S.discarded.size],['objection',t('catP').objection,81],['suggestion',t('catP').suggestion,15],['reclamation',t('catP').reclamation,1],['check',t('vCheck'),nCheck]];
  const minis=`<section class="card minis">
    ${['objection','suggestion','reclamation'].map(c=>{const n={objection:81,suggestion:15,reclamation:1}[c];const p={objection:27,suggestion:0,reclamation:7}[c];return `<div style="--c:${CATC[c]}" class="${c==='reclamation'?'alert':''}"><div class="lbl"><span class="dot"></span>${t('catP')[c]}</div><div class="v"><b class="num">${n}</b>${c==='reclamation'?`<small>${S.lang==='ar'?'مفتوحة':'ouverte'}</small>`:`<small>${pct(n,97)}</small>`}${trend(n,p,c)}</div></div>`}).join('')}
    <div><div class="lbl">${ic('info')}${t('vCheck')}</div><div class="v"><b class="num">${nCheck}</b><small>${t('noReason').toLowerCase()}</small></div></div>
  </section>`;

  const head=`<tr><th style="width:36px"></th><th>${t('colDate')}</th><th>${t('colSays')}</th>${S.group!=='reason'?`<th>${t('colReason')}</th>`:''}${S.group!=='prod'?`<th>${t('colProd')}</th>`:''}<th>${t('colMom')}</th><th>${t('colBy')}</th><th>${t('colState')}</th></tr>`;
  const ncol=6+(S.group!=='reason'?1:0)+(S.group!=='prod'?1:0);
  const row=r=>`<tr class="r ${S.sel.has(r.id)?'sel':''} ${S.peek===r.id?'peek':''}" data-peek="${r.id}">
    <td><button class="cb ${S.sel.has(r.id)?'on':''}" data-sel="${r.id}" aria-label="select">${S.sel.has(r.id)?ic('check'):''}</button></td>
    <td class="date num">${r.date}</td>
    <td><span class="says">${esc(r.body)}</span></td>
    ${S.group!=='reason'?`<td><span class="rchip" style="--c:${CATC[r.cat]}"><span class="dot"></span>${esc(RNAME(r.reason))}</span></td>`:''}
    ${S.group!=='prod'?`<td><span class="rchip">${thumb(r.prod,1)}<span class="ar" style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${esc(PROD[r.prod].ar)}</span></span></td>`:''}
    <td><span class="mom">${ic(momIc[r.mom])}${t('momS')[r.mom]}</span></td>
    <td><span class="who">${av(r.who)}${whoName(r.who)}</span></td>
    <td>${r.complaint?`<span class="st ${S.cstatus.k1||'open'}"><i></i>${t('st')[S.cstatus.k1||'open']}</span>`:!r.reason?`<span class="st check">${t('toCheck')}</span>`:r.src==='import'?`<span class="st imp">${t('imported')}</span>`:''}</td>
  </tr>`;
  let body='';
  if(S.group==='none'){body=rows.map(row).join('');}
  else{
    const key=S.group==='reason'?(r=>r.reason||'_none'):(r=>r.prod);
    const groups=new Map();rows.forEach(r=>{const k=key(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
    for(const [k,list] of groups){
      const closed=S.closed.has(k);
      const realN=S.group==='reason'?RTOTAL(k==='_none'?null:k):list.length;
      const label=S.group==='reason'?`<span class="rchip" style="--c:${CATC[list[0].cat]};color:var(--ink);font-weight:800"><span class="dot"></span>${esc(RNAME(k==='_none'?null:k))}</span>`:`<span class="rchip" style="color:var(--ink);font-weight:800">${thumb(k,1)}<span class="ar">${esc(PROD[k].ar)}</span></span>`;
      body+=`<tr class="g ${closed?'closed':''}" data-grp="${k}"><td colspan="${ncol}"><div class="gin">${ic('chev','chev')}${label}<span class="gn num">${realN}</span></div></td></tr>`;
      if(!closed){body+=list.map(row).join('');if(realN>list.length)body+=`<tr class="more"><td colspan="${ncol}">${t('moreRows')(realN-list.length)}</td></tr>`;}
    }
  }
  const tbl=`<section class="card sheet">
    <div class="stools">
      <div class="views">${views.map(([k,l,n])=>`<button class="vw ${S.view===k?'on':''}" data-view="${k}">${k!=='all'&&k!=='check'?`<span class="dot" style="--c:${CATC[k]}"></span>`:''}${l}<span class="n num">${n}</span></button>`).join('')}</div>
      <div class="grpby">${t('grp')}<div class="mini">${[['reason',t('gReason')],['prod',t('gProd')],['none',t('gNone')]].map(([k,l])=>`<button data-group="${k}" class="${S.group===k?'on':''}">${l}</button>`).join('')}</div></div>
    </div>
    <div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  </section>`;
  return `${filters()}${minis}${tbl}`;
}

    <div class="db">
      <div class="gl"><div class="eyebrow">${ic('quote')}${t('colSays')}</div><p class="bigq" style="margin-top:8px">${esc(r.body)}</p></div>
      <div class="gl"><dl class="facts" style="margin:0">
        <dt>${t('dProd')}</dt><dd>${thumb(r.prod,1)}<span class="ar">${esc(PROD[r.prod].ar)}</span></dd>
        <dt>${t('dCustomer')}</dt><dd><span>${S.lang==='ar'?'عميلة':'Cliente'} · <span dir="ltr" class="num">+218 9• ••• •• 4•</span></span></dd>
        <dt>${t('dOrder')}</dt><dd><a href="#" dir="ltr">#10${(r.id.charCodeAt(1)*7)%900+100}</a></dd>
        <dt>${t('dMom')}</dt><dd><span class="mom">${ic(momIc[r.mom])}${t('mom')[r.mom]}</span></dd>
        <dt>${t('dBy')}</dt><dd>${av(r.who)}${whoName(r.who)}</dd>
        <dt>${t('dSource')}</dt><dd style="font-weight:500;color:var(--ink-2)">${t('src')[r.src]}</dd>
      </dl></div>
      ${r.complaint?'':`<div class="gl"><div class="eyebrow" style="margin-bottom:8px">${ic('target')}${t('dReason')}</div>
        <select class="sel">${[...REASONS,...WANTS].map(x=>`<option ${x.id===r.reason?'selected':''}>${S.lang==='ar'?x.ar:x.fr}</option>`).join('')}<option ${!r.reason?'selected':''}>${t('noReason')}</option></select></div>`}
    </div>
    <div class="df">${r.complaint?(st==='done'?`<button class="btn sec" data-cs="open">${t('reopen')}</button>`:`${st==='open'?`<button class="btn sec" data-cs="prog">${t('take')}</button>`:''}<button class="btn pri" data-cs="done">${ic('check')}${t('resolve')}</button>`):''}<span class="sp"></span><button class="btn ghost" data-discard1="${r.id}">${ic('trash')}${t('discard')}</button></div>
  </aside>`;
}

/* ═════════ MESSAGES ═════════ */
function dormant(){
  const ar=S.lang==='ar';
  return `<section class="card dorm">
    <div>
      <div class="waic">${ic('msg')}</div>
      <h2>${t('dTitle')}</h2>
      <p class="lead">${t('dLead')}</p>
      <div class="eyebrow" style="margin-top:26px">${ic('sparkle')}${t('dWill')}</div>
      <ul class="will">${t('will').map(([i,b,s])=>`<li><span class="n">${ic(i)}</span><div><b>${b}</b><span>${s}</span></div></li>`).join('')}</ul>
    </div>
    <div>
      <div class="eyebrow">${ic('shield')}${t('dSteps')}</div>
      <ol class="steps">${t('steps').map(([b,s],i)=>`<li><span class="c num">${i+1}</span><div><b>${b}</b><span>${s}</span></div></li>`).join('')}</ol>
      <div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap"><button class="btn pri">${t('openConn')} ${ic('arrowR')}</button><span class="meta">${t('onlySa')}</span></div>
    </div>
  </section>
`;
}

function inbox(){
  const list=CONVS.filter(c=>S.ltab==='all'||(S.ltab==='orphans'?!S.attached[c.id]:c.unread>0));
  const cur=CONVS.find(c=>c.id===S.conv)||CONVS[0];
  const att=S.attached[cur.id];
  const cnt={orphans:ORPHAN_TOTAL-Object.keys(S.attached).length,unread:CONVS.filter(c=>c.unread).length,all:ALL_TOTAL};
  const L=`<section class="card col">
    <div class="lhead"><div class="search">${ic('search')}${t('search')}</div>
      <div class="ltabs">${[['orphans',t('lOrph')],['unread',t('lUnread')],['all',t('lAll')]].map(([k,l])=>`<button class="vw ${S.ltab===k?'on':''}" data-ltab="${k}">${l}<span class="n num">${cnt[k]}</span></button>`).join('')}</div></div>
    <div class="list">${list.map(c=>`<button class="cv ${c.id===cur.id?'on':''}" data-conv="${c.id}">
      <span class="cav">${c.name?c.name[0]:ic('user')}</span>
      <span style="min-width:0"><span class="nm"><span>${c.name||`<span dir="ltr">${c.phone}</span>`}</span></span>
        <span class="pv">${esc(c.pv)}</span>
        <span class="hint">${S.attached[c.id]?`<span class="tag good">${ic('check')}${AG[c.match.agent].n} · ${c.match.ref}</span>`:c.match?`<span class="tag brand">${ic('link')}${c.match.ref}</span>`:''}${S.kept.has(c.id)?`<span class="tag" style="background:#ECFDF3;color:#067647">${ic('quote')}${t('cat').suggestion}</span>`:''}${c.win==='closed'?`<span class="tag">${ic('clock')}${S.lang==='ar'?'النافذة مغلقة':'fenêtre fermée'}</span>`:''}</span></span>
      <span class="end"><span class="${c.unread?'wait':''}">${t('waits')(c.wait)}</span>${c.unread?`<span class="ub num">${c.unread}</span>`:''}</span>
    </button>`).join('')}</div>
  </section>`;

  const bub=m=>{
    if(m[0]==='day')return `<div class="day">${S.lang==='ar'?(m[1]==='Hier'?'أمس':'اليوم'):m[1]}</div>`;
    if(m[0]==='in')return `<div class="bub in"><p>${esc(m[1])}</p><small class="num">${m[2]}</small></div>`;
    if(m[0]==='auto')return `<div class="bub auto"><div class="by">${t('autoBy')}</div><p>${esc(m[1])}</p><small class="num">${m[2]} ${ic('ticks')}</small></div>`;
    return `<div class="bub out"><div class="by">${m[3]}</div><p>${esc(m[1])}</p><small class="num">${m[2]} ${ic('ticks')}</small></div>`;
  };
  const wnd=cur.win==='open'?`<span class="tag good wnd">${ic('clock')}${t('wOpen')(S.lang==='ar'?cur.until.replace('demain','غداً'):cur.until)}</span>`:`<span class="tag wnd">${ic('clock')}${t('wClosed')}</span>`;
  const C=`<section class="card col">
    <div class="chead"><span class="cav" style="width:36px;height:36px;font-size:13px">${cur.name?cur.name[0]:ic('user')}</span><div><h2>${cur.name||'—'}</h2><div class="s">${cur.phone}</div></div>${wnd}</div>
    <div class="thread">${cur.msgs.map(bub).join('')}</div>
    ${cur.win==='open'?`<div class="compose"><div class="box">${t('place')}</div><button class="btn sec">${ic('file')}${t('tpl')}</button><button class="btn pri">${ic('send')}${t('send')}</button></div>`
    :`<div class="wclosed">${ic('info')}${S.lang==='ar'?'مرّ أكثر من 24 ساعة على آخر رسالة من العميل.':'Plus de 24 h depuis le dernier message du client.'}<button class="btn pri">${ic('file')}${t('sendTpl')}</button></div>`}
  </section>`;

  let W=`<section class="card col who-col"><div class="who-p"><h3>${t('who')}</h3>`;
  if(att){W+=`<div class="done-box">${ic('check')}<span>${t('attached')(AG[cur.match.agent].n,cur.match.ref)}</span></div>`}
  else if(cur.match){const m=cur.match;W+=`<p class="hintp">${t('ordered')}</p>
    <div class="match"><div class="mt">${thumb(m.prod)}<div style="min-width:0"><b dir="ltr">${m.ref}</b><small class="ar">${PROD[m.prod].ar}</small></div></div>
     <div class="ms"><span class="ospill" style="background:${m.stbg};color:${m.stc}">${S.lang==='ar'?m.statusAr:m.status}</span>· ${m.date} · ${av(m.agent)}${AG[m.agent].n}</div>
     <button class="btn pri" data-attach="${cur.id}">${ic('link')}${t('attachTo')(m.ref)}</button>
     <p class="hintp" style="margin-top:8px">${t('attachHint')(AG[m.agent].n)}</p></div>`}
  else{W+=`<p class="hintp">${t('never')}</p><button class="btn sec" style="justify-content:center">${ic('plus')}${t('createLead')}</button><p class="hintp">${t('leadHint')}</p>`}
  W+=`<div class="search" style="margin-top:2px">${ic('search')}${t('other')}</div>`;
  W+=`<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:2px">${S.kept.has(cur.id)?`<div class="done-box">${ic('quote')}<span>${t('kept')}</span></div>`:`<button class="btn sec" style="width:100%;justify-content:center;${cur.voiceHint?'border-color:color-mix(in srgb,var(--c-sug) 50%,#fff)':''}" data-keep="${cur.id}">${ic('quote')}${t('keep')}</button><p class="hintp" style="margin-top:8px">${t('keepHint')}</p>`}</div>`;
  W+=`</div></section>`;
  return `<div class="inbox">${L}${C}${W}</div>`;
}

function templates(){
  const off=S.wa==='off';
  const lst=TPLS.map(([n,w,l,s])=>({n,w,l,s:off?'draft':s}));
  const stc={ok:'done',wait:'prog',no:'open',draft:'imp'};
  return `<section class="card tbl-card">
    <div class="stools"><div><div style="font-size:17px;font-weight:800">${t('tTpl')}</div><div class="meta">${t('tplSub')}</div></div><span style="flex:1"></span><button class="btn sec" ${off?'disabled style="opacity:.45"':''}>${ic('clock')}${t('sync')}</button></div>
    ${off?`<div class="offline">${ic('info')}${t('tplOff')}</div>`:''}
    <div style="overflow-x:auto;margin-top:${off?10:0}px"><table><thead><tr><th>${t('cTpl')}</th><th>${t('cWhen')}</th><th>${t('cLang')}</th><th>${t('cState')}</th></tr></thead>
    <tbody>${lst.map(x=>`<tr class="r"><td><code style="font:600 12.5px ui-monospace,Menlo,monospace;color:var(--ink-2)">${x.n}</code></td><td style="font-weight:600">${x.w}</td><td class="meta">${x.l==='ar'?'العربية':'Français'}</td><td><span class="st ${stc[x.s]}"><i></i>${t('tst')[x.s]}</span></td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

function messagesView(){
  if(S.struct==='two'&&S.mtab==='templates')return templates();
  if(S.wa==='off')return dormant();
  return inbox();
}

/* ═════════ render ═════════ */
function render(){
  studio(); side();
  const st=document.getElementById('stage');
  st.dir=S.lang==='ar'?'rtl':'ltr'; st.lang=S.lang; st.style.fontFamily=S.lang==='ar'?'var(--fa)':'';
  document.getElementById('side').dir=st.dir;
  let body;
  if(S.page==='messages')body=messagesView();
  else body=S.vtab==='reasons'?reasonsView():sheetView();
  let bulk='';
  if(S.sel.size&&S.page==='voice'&&S.vtab==='sheet')bulk=`<div class="bulk" dir="${st.dir}">${t('selN')(S.sel.size)}<button class="btn sec" data-bulkdiscard="1">${ic('trash')}${t('discard')}</button><button class="btn sec">${ic('target')}${t('changeR')}</button><button class="btn ghost" style="color:#C9CED7" data-bulkcancel="1">${t('cancel')}</button></div>`;
  if(S.toast)bulk+=`<div class="bulk" dir="${st.dir}">${S.toast}<button class="btn sec" data-undo="1">${t('undo')}</button></div>`;
  st.innerHTML=`<div class="page">${header()}${body}</div>${bulk}`;
  document.getElementById('overlay').innerHTML=S.peek&&S.page==='voice'?drawer():'';
  const u=new URLSearchParams({structure:S.struct==='hub'?'hub':'deux',premier:S.first==='sheet'?'feuille':'raisons',page:S.page==='messages'?'messages':'voix',wa:S.wa,lang:S.lang});
  history.replaceState(null,'','?'+u);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-peek],[data-grp],[data-close]'); if(!b)return;
  const d=b.dataset;
  if(d.s){S[d.s]=d.v; if(d.s==='first')S.vtab=d.v; if(d.s==='page'&&d.v==='voice'&&S.vtab==='wa')S.vtab=S.first; S.peek=null; S.toast=null; render(); return;}
  if(d.go){S.page=d.go; if(d.go==='voice')S.vtab=S.first; S.peek=null; render(); return;}
  if(d.vtab){ if(d.vtab==='wa'){S.page='messages'} else {S.page='voice';S.vtab=d.vtab} S.peek=null; render(); return;}
  if(d.mtab){S.mtab=d.mtab; render(); return;}
  if(d.prod){S.prod=S.prod===d.prod?null:d.prod; render(); return;}
  if(d.clearprod&&S.prod){S.prod=null; render(); return;}
  if(d.see){S.vtab='sheet';S.group='reason';S.view='all';S.closed=new Set([...REASONS,...WANTS].map(r=>r.id).filter(x=>x!==d.see).concat(['_none','nonconf']));render();return;}
  if(d.gocheck){S.vtab='sheet';S.view='check';S.closed=new Set();render();return;}
  if(d.k){S.vtab='sheet';S.peek='k1';render();return;}
  if(d.ans){S.answers[d.ans]=true;render();return;}
  if(d.cs){S.cstatus.k1=d.cs;render();return;}
  if(d.view){S.view=d.view;render();return;}
  if(d.group){S.group=d.group;S.closed=new Set();render();return;}
  if(d.sel){e.stopPropagation();S.sel.has(d.sel)?S.sel.delete(d.sel):S.sel.add(d.sel);render();return;}
  if(d.bulkcancel){S.sel.clear();render();return;}
  if(d.bulkdiscard){S.last=[...S.sel];S.last.forEach(id=>S.discarded.add(id));S.toast=t('discarded')(S.sel.size);S.sel.clear();render();return;}
  if(d.discard1){S.last=[d.discard1];S.discarded.add(d.discard1);S.toast=t('discarded')(1);S.peek=null;render();return;}
  if(d.undo){(S.last||[]).forEach(id=>S.discarded.delete(id));S.toast=null;render();return;}
  if(d.close){S.peek=null;render();return;}
  if(d.grp){S.closed.has(d.grp)?S.closed.delete(d.grp):S.closed.add(d.grp);render();return;}
  if(d.peek){S.peek=d.peek;render();return;}
  if(d.ltab){S.ltab=d.ltab;render();return;}
  if(d.conv){S.conv=d.conv;const c=CONVS.find(x=>x.id===d.conv);c.unread=0;render();return;}
  if(d.attach){S.attached[d.attach]=true;render();return;}
  if(d.keep){S.kept.add(d.keep);render();return;}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select'))return;
  const k=e.key.toLowerCase();
  if(k==='escape'){S.peek=null;render();return}
  const map={'1':['struct','two'],'2':['struct','hub'],a:['first','reasons'],b:['first','sheet'],v:['page','voice'],m:['page','messages']};
  if(map[k]){S[map[k][0]]=map[k][1];if(map[k][0]==='first')S.vtab=map[k][1];if(k==='v')S.vtab=S.first;S.peek=null;render();return}
  if(k==='w'){S.wa=S.wa==='on'?'off':'on';render()}
  if(k==='l'){S.lang=S.lang==='ar'?'fr':'ar';render()}
});
render();
</script>
