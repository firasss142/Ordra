<!doctype html>
<!--
  Finances › Dépenses pub — prototype v2 (2026-10-05). Remplace la v1 (gardée telle quelle à côté).

  Retour du propriétaire sur la v1 (5 oct.) : « j'aime le design précédent, la façon dont les informations sont
  affichées ; vise juste une UX/UI optimisée et améliorée. Agis en expert. »
  « Précédent » = la page EN LIGNE (/finance/ad-spend, AdSpendClient + AdSpendEconomics). La v2 garde donc SON ordre et
  SES blocs, dans la langue Aurore :
    1. la chaîne : dépensé → leads → confirmées → livrées → encaissé → bénéfice, avec la conversion entre deux étapes ;
    2. à gauche « Combien vous payez un lead — et combien il vaut » (barre payée, marge hachurée, trait du seuil) ;
       à droite « Où partent X د.ل d'une commande livrée » ;
    3. le tableau « Par produit », dépliable en campagnes.
  Améliorations d'expert (chacune est nommée dans la réponse au propriétaire) :
    a. « ≈ attendu » : les colis encore en route sont comptés au taux de livraison habituel du produit — une fenêtre
       courte n'affiche plus une fausse perte ;
    b. tableau 11 → 8 colonnes, plus de défilement horizontal (payé et seuil dans une cellule, % livraison sous l'entonnoir) ;
    c. même ordre de produits dans les barres et le tableau ; cliquer une barre ouvre ses campagnes dans le tableau ;
    d. « Trop tôt » sous 30 leads (un verdict sur 18 leads est du bruit) ;
    e. une cohorte finie qui contredit la projection l'emporte, et la page le dit (Coran couleurs) ;
    f. le levier « pour revenir à zéro » connaît aussi le taux de confirmation ;
    g. santé de chaque plateforme dans l'en-tête (Snapchat : 3 jours sans chiffres) ;
    h. Importer + Nouvelle dépense regroupés sous « Ajouter » ;
    i. « Profit net » → « Bénéfice brut », comme le P&L ;
    j. la plateforme est une RÉPARTITION de la dépense, jamais un filtre des verdicts : aucune commande ne porte sa
       plateforme, un « coût par livrée Meta » serait inventé.

  DONNÉES FICTIVES (feuille commune du plan, 7 jours : 8 120 dépensés, 864 leads).
  URL : ?win=today|7d|30d · ?open=tad|mal|… (déplie un produit dans le tableau)
-->

/* motion — explains once; off under reduced motion */

/* ═══════════════ PAGE · Dépenses pub v2 ═══════════════ */
:root{--ok:#12B76A;--ok-ink:#067647;--no:#E8385A;--no-ink:#C01048;

/* 1 · the chain */
.chain{padding:22px 24px 18px}
.ch-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:44px;position:relative}
.stn{position:relative;padding:4px 14px 0 0;min-width:0}
.stn + .stn{padding-inline-start:20px}
.stn-h{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stn-n{margin-top:8px;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.stn-n .ap{font-size:.62em;color:var(--ink-q);font-weight:700;margin-inline-end:2px}
.stn-n .cur{font-size:.4em}
.stn-n.good{color:var(--ok-ink)} .stn-n.bad{color:var(--no-ink)}
.stn-s{margin-top:5px;font-size:12px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn-s b{color:var(--ink-2);font-weight:700}
.mini{display:flex;height:6px;border-radius:99px;overflow:hidden;gap:2px;margin-top:9px;max-width:150px;background:var(--track)}
.mini i{display:block;height:100%}
.mini .now{background:var(--ink-2);border-radius:99px 0 0 99px}
.mini .est{background:var(--hatch-est)}
.mini .pf{background:var(--m-ads)}
/* the conversion between two steps sits on the seam */
.lk{position:absolute;top:-40px;inset-inline-start:0;transform:translateX(-50%);display:grid;justify-items:center;gap:1px;padding:4px 9px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(42,52,110,.07);z-index:2;white-space:nowrap}
.lk b{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.lk small{font-size:10.5px;font-weight:600;color:var(--ink-3)}
.lk.cost{background:var(--bad-bg);border-color:transparent}
.lk.cost b,.lk.cost small{color:var(--bad)}
.stn + .stn::before{content:"";position:absolute;top:-6px;bottom:2px;inset-inline-start:0;border-inline-start:1px solid var(--line)}
.ch-f{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);font-weight:500}
.ch-f .ic{width:15px;height:15px;color:var(--ink-q)}
.ch-f b{color:var(--ink-2)}
.unm{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:rgba(255,244,224,.82);border:1px solid rgba(247,144,9,.25);font-size:13.5px;color:var(--ink);font-weight:500}
.unm .hold{background:#fff;color:var(--warn)}
.unm b{font-weight:800}
.unm .btn2{margin-inline-start:auto;height:34px}

/* 2 · two cards side by side */
.duo{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:18px;align-items:start}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--glass-in);border:1px solid var(--glass-in-bd);color:var(--ink-2)}
.ib:hover{background:#fff}
.formula{width:330px;padding:14px 16px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.formula h4{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px}
.formula .fr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.formula .fr:last-child{border-bottom:0;font-weight:800;color:var(--ink)}

/* CPL bars */
.cb-head,.cb-row,.cb-axis{display:grid;grid-template-columns:minmax(170px,220px) minmax(0,1fr) 96px;gap:14px;align-items:center}
.cb{padding:4px 18px 16px}
.cb-head{padding:8px 6px 6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-q)}
.cb-head span:last-child{text-align:end}
.cb-row{padding:7px 6px;border-radius:12px;width:100%;text-align:start;transition:background .15s}
.cb-row:hover{background:rgba(255,255,255,.75)}
.cb-row.neg{background:rgba(255,228,232,.45)}
.pn{display:flex;align-items:center;gap:10px;min-width:0}
.ptile{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink-2);background:linear-gradient(145deg,#fff,#EEF0F6);box-shadow:inset 0 0 0 1px var(--line)}
.pn-t{display:grid;min-width:0}
.pn-t b{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-t small{font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{width:44px;height:20px;flex:none;margin-inline-start:auto}
.trk{position:relative;height:26px}
.trk .paid{position:absolute;top:2px;bottom:2px;inset-inline-start:0;border-radius:7px 0 0 7px;background:var(--ok);transform-origin:left;animation:growx .7s cubic-bezier(.2,.8,.2,1) backwards}
.trk .paid.no{background:var(--no)}
.trk .paid.dim{background:#98A2B3}
.trk .gap{position:absolute;top:2px;bottom:2px;border-radius:0 7px 7px 0}
.trk .gap.ok{background:var(--hatch-ok)} .trk .gap.no{background:var(--hatch-no)}
.trk .none{position:absolute;top:2px;bottom:2px;inset-inline-start:0;border-radius:7px;border:1.5px dashed var(--ink-4);background:rgba(255,255,255,.5)}
.trk .pv{position:absolute;top:5px;inset-inline-start:9px;font-size:11.5px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.trk .fl{position:absolute;top:-2px;bottom:-2px;width:3px;margin-inline-start:-1.5px;border-radius:2px;background:var(--ink);z-index:2}
.mg{text-align:end;display:grid;gap:1px}
.mg b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.mg b.good{color:var(--ok-ink)} .mg b.bad{color:var(--no-ink)} .mg b.flat{color:var(--ink-3);font-size:13px}
.mg small{font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.cb-axis{padding:6px 6px 0}
.ax{position:relative;height:16px}
.ax span{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--ink-q);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 6px 0;font-size:12px;color:var(--ink-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.fl{width:3px;height:14px;border-radius:2px;background:var(--ink)}

/* cost stack */
.cs{padding:4px 22px 20px}
.stack{display:flex;height:38px;border-radius:12px;overflow:hidden;gap:2px;margin-top:6px}
.stack i{position:relative;display:grid;place-items:center;height:100%;background:var(--k);font-style:normal;font-size:11.5px;font-weight:800;color:#fff;min-width:4px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards}
.stack i.ret{background:repeating-linear-gradient(135deg,var(--m-ship) 0 4px,#5FC7BC 4px 8px)}
.stack i.profit{background:linear-gradient(180deg,#27A35A,var(--m-profit))}
.cs-l{margin-top:10px}
.cs-r{display:grid;grid-template-columns:14px minmax(0,1fr) auto 50px;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.cs-r .sw{width:12px;height:12px}
.cs-r .sw.ret{background:repeating-linear-gradient(135deg,var(--m-ship) 0 3px,#5FC7BC 3px 6px)}
.cs-r span:nth-child(2){font-weight:600}
.cs-r b{text-align:end;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cs-r em{text-align:end;font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums}
.cs-r.ads span:nth-child(2){font-weight:800}
.cs-r.res{border-bottom:0;border-top:1.5px solid rgba(15,23,40,.12);margin-top:-1px}
.cs-r.res b{color:var(--m-profit);font-size:15px}
.cs-note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(255,244,224,.75);font-size:13px;color:var(--ink);font-weight:500}
.cs-note .ic{color:var(--warn);margin-top:1px}

/* 3 · the table */
.tb-wrap{padding:0 0 6px;overflow-x:auto}
table.pt8{width:100%;border-collapse:collapse;font-size:13.5px}
.pt8 th{padding:10px;text-align:end;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-q);border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.pt8 th small{display:block;font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-q)}
.pt8 th:first-child{text-align:start;padding-inline-start:24px}
.pt8 th:last-child,.pt8 td:last-child{padding-inline-end:24px}
.pt8 td{padding:12px 10px;text-align:end;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pt8 td:first-child{text-align:start;padding-inline-start:16px}
.pt8 tr.pr{cursor:pointer;transition:background .15s}
.pt8 tr.pr:hover{background:rgba(255,255,255,.7)}
.pt8 tr.pr.neg{background:rgba(255,228,232,.4)}
.pt8 tr.pr.open{background:rgba(255,255,255,.85)}
.pt8 tr.pr.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:rgba(68,76,231,.12)}}
.pt8 .chev{width:15px;height:15px;color:var(--ink-q);transition:transform .2s}
.pt8 tr.open .chev{transform:rotate(90deg)}
.pt8 .pn{gap:10px}
.fun{color:var(--ink-3);font-weight:600}
.fun b{color:var(--ink);font-weight:700}
.fun small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.pf2 b{font-weight:800}
.pf2 small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:2px}
.num-g{color:var(--ok-ink);font-weight:800;font-size:14.5px}
.num-b{color:var(--no-ink);font-weight:800;font-size:14.5px}
.num-d{color:var(--ink-q)}
.lev{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:9px;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:800}
.vd{height:28px;padding:0 11px;font-size:12.5px;font-weight:800;gap:6px}
.vd .g{font-size:10px}
.vd.scale{background:var(--ok-ink);color:#fff}
.vd.ok{background:#fff;color:var(--ok-ink);box-shadow:inset 0 0 0 1.5px rgba(18,183,106,.55)}
.vd.fix{background:var(--warn-bg);color:var(--warn)}
.vd.cut{background:var(--no);color:#fff}
.vd.early,.vd.none{background:var(--flat-bg);color:var(--ink-2)}
.pt8 tr.camp td{background:rgba(250,251,255,.7);padding-top:9px;padding-bottom:9px;font-size:13px;color:var(--ink-2)}
.pt8 tr.camp td:first-child{padding-inline-start:62px}
.pt8 tr.kick td{padding:10px 12px 4px 62px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-q);text-align:start;border-bottom:0;background:rgba(250,251,255,.7)}
.cmp-n{display:flex;align-items:center;gap:8px;min-width:0}
.cmp-n b{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:280px}
.plat{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(15,23,40,.06);color:var(--ink-2)}
.share{font-size:11.5px;color:var(--ink-3);font-weight:600}
.pt8 tr.tot td{border-bottom:0;font-weight:800;padding-top:14px;padding-bottom:16px}
.pt8 tr.nop td{background:rgba(255,244,224,.45)}
.tb-head{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 14px;flex-wrap:wrap}
.tb-head h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tb-head p{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:4px}
.tb-head .btn2{margin-inline-start:auto}
</style>
</head>

/* verdict — always on the 7-day sheet (one day is too small to judge), whatever window is shown */
function verdict(p) {
  if (!p.spend) return { k: "none", why: `Aucune pub ne lui est attribuée : ses ${p.leads} leads viennent d'ailleurs.` };
  if (p.leads < 30) return { k: "early", why: `${p.leads} leads depuis le ${p.since} — verdict à partir de 30 leads.` };
  const cpl = p.spend / p.leads, seuil = seuilOf(p), m = seuil - cpl;
  if (p.coh && (p.coh.profit < 0) !== (m < 0))
    return { k: p.coh.profit < 0 ? "fix" : "ok", override: true, why: `Sur 7 jours il reste ${fmt2(m)} par lead, mais la cohorte d'${p.coh.l}, finie, a perdu ${fmt(-p.coh.profit)} د.ل (${p.coh.per} د.ل par livrée pour ${p.max} max). La cohorte finie l'emporte.` };
  if (m < 0) {
    const loss = -m * p.leads, rev = (p.leads * p.d100 / 100) * p.price;
    return loss > 0.15 * rev
      ? { k: "cut", why: `Chaque lead coûte ${fmt2(-m)} de plus qu'il ne rapporte ; la perte dépasse 15 % de l'encaissé.` }
      : { k: "fix", why: `Perte petite et stable : un réglage d'enchère, pas un mauvais produit.` };
  }
  return m > 0.4 * seuil
    ? { k: "scale", why: `Il reste ${fmt2(m)} par lead, plus de 40 % du seuil : de la place pour dépenser plus.` }

}

}

      <div class="acts">
        <div class="seg" role="tablist" aria-label="Période">${Object.entries(WIN).map(([k, w]) => `<button type="button" role="tab" aria-selected="${k === win}" class="${k === win ? "on" : ""}" data-win="${k}">${w.l}</button>`).join("")}</div>
        <button class="btn2" type="button" data-tip="Dire quel produit vend chaque campagne">${ic("link")}Campagnes et produits <span class="bdg">${UNMAPPED.n}</span></button>
        <div class="popw">
          <button class="btn" id="addbtn" type="button" aria-haspopup="true">${ic("plus")}Ajouter</button>
          <div class="pop menu" id="addpop">
            <button type="button"><span class="hold">${ic("upload")}</span><span><b>Importer un CSV</b><small>export TikTok Ads ou Snapchat Ads</small></span></button>
            <button type="button"><span class="hold">${ic("receipt")}</span><span><b>Nouvelle dépense</b><small>hors plateforme : influenceur, page sponsorisée…</small></span></button>
            <button type="button"><span class="hold">${ic("sync")}</span><span><b>Synchroniser Meta maintenant</b><small>sinon toutes les heures</small></span></button>
          </div>
        </div>
      </div>
      <div class="cmp">Verdicts : 7 derniers jours · « ≈ » = attendu</div>
    </div>
  </header>`;
}

/* 1 · the chain — what the money turned into, end to end */
function renderChain(R) {
  const t = totals(R), w = WIN[win];
  const exp = Math.round(t.exp), tot = PLATF.reduce((a, p) => a + p.v, 0);
  const pfBar = `<div class="mini" aria-hidden="true">${PLATF.map((p, i) => `<i class="pf" style="width:${(p.v / tot) * 100}%;opacity:${1 - i * 0.3}"></i>`).join("")}</div>`;
  const delBar = `<div class="mini" aria-hidden="true"><i class="now" style="width:${exp ? (t.delNow / exp) * 100 : 0}%"></i><i class="est" style="flex:1"></i></div>`;
  const approx = w.mat < 1 ? `<span class="ap">≈</span>` : "";
  const st = [
    { h: "Dépensé en pub", n: money(t.spend), s: "Meta · TikTok · Snapchat", x: pfBar, tip: PLATF.map((p) => `${p.n} · ${fmt(p.v * w.f)} د.ل`).join("<br>") },
    { h: "Leads reçus", n: fmt(t.leads), s: "commandes reçues" },
    { h: "Confirmées", n: fmt(t.conf), s: "au téléphone" },
    { h: "Livrées", n: approx + fmt(exp), s: `<b>${fmt(t.delNow)}</b> livrées · ${fmt(exp - t.delNow)} en route`, x: delBar, tip: `<b>${fmt(t.delNow)} déjà livrées</b><small>${fmt(exp - t.delNow)} encore en route, comptées au taux de livraison habituel de chaque produit</small>` },
    { h: "Encaissé", n: approx + money(t.revenue), s: `<b>${fmt(t.revNow)}</b> déjà encaissés` },
    { h: "Bénéfice brut", n: approx + money(t.profit), s: "tous coûts déduits", cls: t.profit < 0 ? "bad" : "good" },
  ];
  const lk = [
    [`${fmt2(t.spend / t.leads)} د.ل`, "par lead"],
    [`${Math.round((t.conf / t.leads) * 100)} %`, "confirmés"],
    [`${Math.round((exp / t.conf) * 100)} %`, "livrées"],
    [`${fmt(t.revenue / t.exp)} د.ل`, "par livrée"],
    [`− ${fmt(t.revenue - t.profit)}`, `dont ${fmt(t.spend)} de pub`, true],
  ];
  return `
  <section class="card chain rise" style="--d:1" aria-label="Ce que la pub a produit">
    <div class="eyebrow">Ce que la pub a produit · ${w.lead} · toutes plateformes</div>
    <div class="ch-row">${st.map((s, i) => `
      <div class="stn"${s.tip ? ` data-tip="${esc(s.tip)}"` : ""}>
        ${i > 0 ? `<span class="lk${lk[i - 1][2] ? " cost" : ""}"><b>${lk[i - 1][0]}</b><small>${lk[i - 1][1]}</small></span>` : ""}
        <div class="stn-h">${s.h}</div>
        <div class="stn-n ${s.cls || ""}">${s.n}</div>
        <div class="stn-s">${s.s}</div>
        ${s.x || ""}
      </div>`).join("")}
    </div>
    <div class="ch-f">${ic("info")}<span><b>≈ attendu</b> : les colis encore en route sont comptés au taux de livraison habituel de chaque produit. Le chiffre devient exact quand ils sont livrés ou retournés — une semaine récente n'affiche plus une fausse perte.</span></div>
  </section>
  <div class="unm rise" style="--d:2"><span class="hold">${ic("link")}</span><span><b>${fmt(UNMAPPED.v * w.f)} د.ل</b> dépensés par ${UNMAPPED.n} campagnes ne comptent dans la marge d'aucun produit. Le bénéfice ci-dessus les compte quand même.</span><button class="btn2" type="button">Attribuer${ic("right")}</button></div>`;
}

/* 2a · what you pay for a lead vs what it is worth */
function niceScale(v) {
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(1, v))));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * pow).find((c) => v / c <= 5) ?? 10 * pow;
  return { max: Math.ceil(v / step) * step, step };
}
function spark(vals, color) {
  const mx = Math.max(...vals, 1), pts = vals.map((v, i) => `${(i / (vals.length - 1)) * 44},${18 - (v / mx) * 16}`).join(" ");
  return `<svg class="spark" viewBox="0 0 44 20" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function renderBars(R) {
  const { max, step } = niceScale(Math.max(...R.map((r) => Math.max(r.cpl || 0, r.seuil))) * 1.08);
  const pc = (v) => Math.min(100, (v / max) * 100);
  const ticks = []; for (let v = 0; v <= max + 1e-9; v += step) ticks.push(v);
  const row = (r) => {
    const neg = r.margin != null && r.margin < 0 && r.v.k !== "early";
    let bar, right;
    if (r.cpl == null) {
      bar = `<span class="none" style="width:${pc(r.seuil)}%"></span>`;
      right = `<b class="flat">Sans pub</b><small>peut payer ${fmt2(r.seuil)}</small>`;
    } else if (r.v.k === "early") {
      bar = `<span class="paid dim" style="width:${pc(r.cpl)}%;border-radius:7px"></span>`;
      right = `<b class="flat">Trop tôt</b><small>${r.leads} leads sur 30</small>`;
    } else {
      const solid = neg ? r.seuil : r.cpl, a = Math.min(r.cpl, r.seuil), b = Math.max(r.cpl, r.seuil);
      bar = `<span class="paid${neg ? " no" : ""}" style="width:${pc(solid)}%"></span><span class="gap ${neg ? "no" : "ok"}" style="left:${pc(a)}%;width:${pc(b) - pc(a)}%"></span>${pc(solid) > 14 ? `<span class="pv">${fmt2(r.cpl)}</span>` : ""}`;
      right = `<b class="${neg ? "bad" : "good"}">${sg(r.margin, 1)}</b><small>par lead</small>`;
    }
    const tip = `<b>${esc(r.n)}</b><small>vous payez ${r.cpl == null ? "—" : fmt2(r.cpl) + " د.ل"} le lead · il peut coûter jusqu'à ${fmt2(r.seuil)} د.ل</small><small>${r.d100} livrées pour 100 leads · ${r.max} د.ل laissés par livrée avant la pub</small><small>Cliquer : ses campagnes</small>`;
    return `<button class="cb-row${neg ? " neg" : ""}" type="button" data-go="${r.k}" data-tip="${esc(tip)}">
      <span class="pn"><span class="ptile">${r.g}</span><span class="pn-t"><b>${esc(r.n)}</b><small>${fmt(r.leads)} leads · ${r.d100} livrées / 100</small></span>${spark(r.spark, neg ? "#E8385A" : r.cpl == null || r.v.k === "early" ? "#98A2B3" : "#12B76A")}</span>
      <span class="trk">${bar}<span class="fl" style="left:${pc(r.seuil)}%"></span></span>
      <span class="mg">${right}</span>
    </button>`;
  };
  return `
  <section class="card rise" style="--d:3" aria-label="Combien vous payez un lead">
    <div class="chead">
      <div><h2>Combien vous payez un lead — et combien il vaut</h2><p class="q">Le trait noir : le plus qu'un lead peut coûter sans perdre d'argent sur ce produit.</p></div>
      <div class="rt popw">
        <button class="ib" id="fbtn" type="button" aria-label="Comment le seuil est calculé">${ic("info")}</button>
        <div class="pop formula" id="fpop">
          <h4>Le seuil d'un lead, exemple Tadabbur</h4>
          <div class="fr"><span>Une livrée laisse, avant la pub</span><b>137 د.ل</b></div>
          <div class="fr"><span>× livrées pour 100 leads</span><b>16 %</b></div>
          <div class="fr"><span>= un lead peut coûter jusqu'à</span><b>21,9 د.ل</b></div>
        </div>
      </div>
    </div>
    <div class="cb">
      <div class="cb-head"><span>Produit</span><span>Coût par lead (د.ل)</span><span>Marge / lead</span></div>
      ${R.map(row).join("")}
      <div class="cb-axis"><span></span><div class="ax">${ticks.map((t) => `<span style="left:${pc(t)}%">${fmt(t)}</span>`).join("")}</div><span></span></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>Payé par lead</span>
        <span><i style="background:var(--hatch-ok)"></i>Marge qui reste</span>
        <span><i style="background:var(--hatch-no)"></i>Dépassement</span>
        <span><i class="fl"></i>Seuil</span>
      </div>
    </div>
  </section>`;
}

/* 2b · where the money of one delivered order goes */
function renderStack(R) {
  const t = totals(R), price = t.revenue / t.exp, keep = t.keep / t.exp, pre = price - keep, ads = t.spend / t.exp, prof = keep - ads;
  const parts = [
    { k: "cogs", t: "Produits", v: pre * 0.667 },
    { k: "ship", t: "Livraison", v: pre * 0.229 },
    { k: "ship", t: "Retours", v: pre * 0.031, ret: true },
    { k: "ads", t: "Pub", v: ads },
    { k: "pack", t: "Emballage", v: pre * 0.073 },
    { k: "profit", t: "Bénéfice brut", v: prof },
  ];
  const pct = (v) => Math.round((v / price) * 100);
  return `
  <section class="card rise" style="--d:3" aria-label="Où partent les dinars d'une commande livrée">
    <div class="chead"><div><h2>Où partent ${fmt(price)} د.ل d'une commande livrée</h2><p class="q">Une commande livrée moyenne, tous produits confondus.</p></div></div>
    <div class="cs">
      <div class="stack" role="img" aria-label="Répartition d'une commande livrée">${parts.map((p, i) => `<i class="k-${p.k}${p.ret ? " ret" : ""}${p.k === "profit" ? " profit" : ""}" style="width:${(p.v / price) * 100}%;animation-delay:${i * 60}ms" data-tip="<b>${p.t}</b> · ${fmt(p.v)} د.ل<small>${pct(p.v)} % de la commande</small>">${pct(p.v) >= 8 ? pct(p.v) + " %" : ""}</i>`).join("")}</div>
      <div class="cs-l">${parts.map((p) => `<div class="cs-r${p.k === "ads" ? " ads" : ""}${p.k === "profit" ? " res" : ""}"><i class="sw k-${p.k}${p.ret ? " ret" : ""}"></i><span>${p.t}</span><b>${p.k === "profit" ? "" : "− "}${fmt(p.v)}${LYD}</b><em>${pct(p.v)} %</em></div>`).join("")}</div>
      ${ads > pre * 0.667 ? `<div class="cs-note">${ic("alert")}<span>La pub coûte <b>${fmt2(ads / (pre * 0.667))}×</b> le prix du produit lui-même.</span></div>` : ""}
    </div>
  </section>`;
}

/* 3 · by product — 8 columns, unfolds into campaigns */
function renderTable(R) {
  const t = totals(R), f = WIN[win].f;
  const head = `<tr>
    <th>Produit</th><th>Dépensé<small>د.ل</small></th><th>Leads → conf. → livrées<small>≈ attendues</small></th>
    <th>Payé / seuil<small>par lead, د.ل</small></th><th>Marge<small>par lead</small></th><th>Bénéfice brut<small>≈ · ROAS</small></th>
    <th>Pour revenir à zéro</th><th>Verdict</th></tr>`;
  const body = R.map((r) => {
    const isOpen = open.has(r.k), neg = r.margin != null && r.margin < 0 && r.v.k !== "early";
    const camps = CAMP[r.k] || [], man = MANUAL[r.k] || [];
    const sub = camps.length ? `${camps.length} campagne${camps.length > 1 ? "s" : ""}` : "aucune campagne";
    let rows = `<tr class="pr${neg ? " neg" : ""}${isOpen ? " open" : ""}" data-row="${r.k}" id="row-${r.k}">
      <td><span class="pn">${ic("right", "chev")}<span class="ptile">${r.g}</span><span class="pn-t"><b>${esc(r.n)}</b><small>${sub}</small></span></span></td>
      <td>${r.spend ? fmt(r.spend) : `<span class="num-d">—</span>`}</td>
      <td class="fun"><b>${fmt(r.leads)}</b> → <b>${fmt(r.confN)}</b> → <b>≈${fmt(Math.round(r.exp))}</b><small>${fmt(r.delNow)} livrées · ${fmt(r.enRoute)} en route</small></td>
      <td class="pf2">${r.cpl == null ? `<span class="num-d">—</span>` : `<b>${fmt2(r.cpl)}</b>`} <span class="num-d">/ ${fmt2(r.seuil)}</span></td>
      <td>${r.margin == null || r.v.k === "early" ? `<span class="num-d">—</span>` : `<span class="${neg ? "num-b" : "num-g"}">${sg(r.margin, 1)}</span>`}</td>
      <td class="pf2">${r.v.k === "early" ? `<span class="num-d">—</span>` : `<span class="${r.profit < 0 ? "num-b" : "num-g"}">${sg(r.profit)}</span><small>${r.roas ? `ROAS ${fmt2(r.roas)}×` : "sans pub"}</small>`}</td>
      <td>${lever(r, r.v)}</td>
      <td>${vpill(r.v)}</td>
    </tr>`;
    if (isOpen) {
      if (!camps.length && !man.length) rows += `<tr class="camp"><td colspan="8" style="text-align:start">Aucune campagne ne vend ce produit — ses leads viennent du bouche-à-oreille ou de clients qui reviennent.</td></tr>`;
      if (camps.length) {
        rows += `<tr class="kick"><td colspan="8">Campagnes · la plateforme compte ses achats, Ordra compte les leads du produit</td></tr>`;
        rows += camps.map((c) => `<tr class="camp">
          <td><span class="cmp-n"><span class="plat">${c.pf}</span><b>${esc(c.n)}</b></span></td>
          <td>${fmt(c.s * f)}</td>
          <td colspan="2" style="text-align:start;padding-inline-start:28px">${c.ach ? `${fmt(c.ach * f)} achats ${c.pf} · ${fmt2(c.s / c.ach)} د.ل l'achat` : `<span class="num-d">${c.pf} ne compte pas les achats</span>`}</td>
          <td colspan="3" style="text-align:start"><span class="share">${c.share ? c.share : "100 % de la campagne"}</span></td>
          <td><a class="link" href="#">Attribuer${ic("right")}</a></td>
        </tr>`).join("");
      }
      if (man.length) rows += `<tr class="kick"><td colspan="8">Saisies manuelles</td></tr>` + man.map((m) => `<tr class="camp"><td><b style="color:var(--ink)">${esc(m.n)}</b></td><td><span class="num-d">—</span></td><td colspan="5" style="text-align:start;padding-inline-start:28px">${m.note}</td><td><a class="link" href="#">Modifier</a></td></tr>`).join("");
    }
    return rows;
  }).join("");
  const unm = `<tr class="pr nop"><td><span class="pn"><span style="width:15px"></span><span class="ptile">${ic("link")}</span><span class="pn-t"><b>Sans produit</b><small>${UNMAPPED.n} campagnes</small></span></span></td>
    <td>${fmt(UNMAPPED.v * f)}</td><td colspan="5" style="text-align:start;padding-inline-start:28px;color:var(--ink-3)">Comptés dans le bénéfice du marché, dans la marge d'aucun produit.</td><td><button class="btn2 sm" type="button">Attribuer</button></td></tr>`;
  const tot = `<tr class="tot"><td style="padding-inline-start:24px">Total</td><td>${fmt(t.spend)}</td>
    <td class="fun"><b>${fmt(t.leads)}</b> → <b>${fmt(t.conf)}</b> → <b>≈${fmt(Math.round(t.exp))}</b></td>
    <td class="pf2"><b>${fmt2(t.spend / t.leads)}</b></td><td></td>
    <td class="pf2"><span class="${t.profit < 0 ? "num-b" : "num-g"}">${sg(t.profit)}</span><small>ROAS ${fmt2(t.revenue / t.spend)}×</small></td><td></td><td></td></tr>`;
  return `
  <section class="card rise" style="--d:4" aria-label="Par produit">
    <div class="tb-head"><div><h2>Par produit</h2><p>Cliquez une ligne pour voir ses campagnes. Même ordre que les barres : la plus grosse dépense en haut.</p></div>
      <button class="btn2 sm" type="button">${ic("dl")}Exporter</button></div>
    <div class="tb-wrap"><table class="pt8"><thead>${head}</thead><tbody>${body}${unm}${tot}</tbody></table></div>
  </section>`;
}

function render() {
  const R = rowsNow();
  $("#page").innerHTML = renderHeader() + renderChain(R) + `<div class="duo">${renderBars(R)}${renderStack(R)}</div>` + renderTable(R) + `
    <p class="foot rise" style="--d:5">${ic("info")}<span><b>Base : les leads reçus dans la période, suivis jusqu'à aujourd'hui.</b> Le P&amp;L compte les ventes livrées dans le mois : les deux chiffres diffèrent, c'est voulu. Une plateforme n'est jamais un filtre des verdicts — aucune commande ne dit de quelle plateforme elle vient.</span></p>`;
  $$(".pbar [data-win]").forEach((a) => a.classList.toggle("on", a.dataset.win === win));
}

document.addEventListener("click", (e) => {
  const w = e.target.closest(".seg [data-win]");
  if (w) { win = w.dataset.win; render(); history.replaceState(null, "", `?win=${win}`); return; }
  if (e.target.closest("#addbtn")) { e.stopPropagation(); $("#addpop").classList.toggle("on"); return; }
  if (e.target.closest("#fbtn")) { e.stopPropagation(); $("#fpop").classList.toggle("on"); return; }
  const go = e.target.closest("[data-go]");
  if (go) {
    const k = go.dataset.go; open.add(k); render();
    const tr = $(`#row-${k}`); tr.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" }); tr.classList.add("flash");
    return;
  }
  const row = e.target.closest("tr[data-row]");
  if (row) { const k = row.dataset.row; open.has(k) ? open.delete(k) : open.add(k); render(); }
});

renderShell("pub");
render();
if (qs.get("open")) setTimeout(() => $(`#row-${qs.get("open")}`)?.scrollIntoView({ block: "center", inline: "nearest" }), 60);
</script>
</body>
