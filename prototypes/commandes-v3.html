<!doctype html>
<!--
  Commandes — prototype v3 (2026-10-04). Depuis v2 : « Reçues aujourd'hui » en premier ; « Téléchargées
  aujourd'hui » remplace « Confirmées à envoyer » (les confirmées en attente restent dites dans sa ligne) ;
  « Doublons » devient « Clients récurrents » : 4 tuiles-filtres (Tous · En double · À risque · Fidèles), la
  liste des clients à gauche, UN client à droite (chiffres, doublons à nettoyer, parcours, en cours).

  v2. Changements depuis v1, demandés par le propriétaire :
  - Doublons réunit les COMMANDES EN DOUBLE et les CLIENTS QUI REVIENNENT (même téléphone) : deux grandes
    tuiles ; un client qui revient = une carte avec sa fiabilité, le parcours de toutes ses commandes en
    pastilles (cliquables), et ses commandes en cours ;
  - les commandes SUPPRIMÉES vivent dans Archivées › Supprimées (restaurables), plus de filtre dans Commandes ;
  - les étiquettes « Déjà rejeté » / « Client fidèle » viennent maintenant du vrai passé du client.

  v1 : la rénovation « Aurore » de tout l'espace Commandes.

  Ce que le propriétaire a demandé : « j'aime la page comme elle est, pas trop de changements » ; surtout du
  visuel et de l'expérience ; simple, clair, facile — pas de densité d'information.
  Ses réponses (4 oct., deux tours) :
  - périmètre = TOUT L'ESPACE COMMANDES : la liste, le panneau d'une commande (sa mise en page), Archivées,
    Doublons et la fenêtre « Nouvelle commande » ;
  - en haut = des RACCOURCIS DE TRAVAIL, comptés « maintenant », chacun ouvre exactement ce qu'il compte :
    Non assignées · À rappeler · Confirmées à envoyer · Reçues aujourd'hui. Le taux de confirmation, les
    livrées et les rejetées vivent dans Performance › Commandes ;
  - la ligne = mêmes colonnes, même ordre, des SIGNAUX EN MOTS (au plus deux étiquettes) ; l'âge ne prend
    de couleur que s'il est en retard ; « Source » devient « Boutique » (la couleur de la boutique, comme
    sur Accueil) ;
  - les filtres = UNE LIGNE CALME : recherche + dates, puis Statut · Agent · Boutique, le reste sous « Plus » ;
  - le panneau = LE MÊME CONTENU, PLUS CALME. Il remplacera aussi celui des agents : managers d'abord,
    agents une semaine plus tard ;
  - Archivées = RANGER LES COMMANDES (la liste des commandes finies). L'analyse part dans Performance ;
  - Doublons = UNE CARTE PAR GROUPE.
  Décisions de l'expert : vue par défaut (toutes, les plus récentes d'abord), 25 par page, temps réel,
  export et actions groupées inchangés ; les mots et les couleurs des statuts restent, seule la forme de la
  pastille change (« ☎ 1/3 » devient « Appel 1/3 ») ; « Non assignées » ouvre la liste, où l'on assigne en
  groupe ; le formulaire « Nouvelle commande » reste le même, habillé Aurore.
  Habillage : docs/design-system.md « Aurore », densité « établi » (§1.1) — un conteneur en verre, des
  lignes blanches séparées par un filet, aucune animation sur les lignes.

  DONNÉES FICTIVES générées dans la page (graine fixe) : boutiques, produits, agents et clients inventés.
  « Avant » = captures de la page actuelle sur la base LOCALE de test (aucun vrai client).
  URL : ?screen=list|archive|dup &view=rep &tab=deleted &lang=ar &before=1 &open=<réf> &create=1 &tile=un|re|se|to
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commandes · rénovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fa:"Noto Sans Arabic","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-hov:rgba(255,255,255,.07);
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:22px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 18px 46px rgba(42,52,110,.13);
  --glass-in:rgba(255,255,255,.72); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7; --line:rgba(15,23,40,.07);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A; --warn:#B54708; --warn-bg:#FFF4E0; --bad:#B42318; --bad-bg:#FEF3F2;
  --flat-bg:rgba(15,23,40,.05); --tip-bg:#101828; --accent:#3538CD; --pbh:45px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
/* status families — a pill is a wash + a 1px edge + ink in its own hue (design-system §4.19) */
.h-neutral{--pb:#F2F4F7;--pd:#E4E7EC;--pi:#344054}
.h-amber{--pb:#FFFAEB;--pd:#FEDF89;--pi:#B54708}
.h-violet{--pb:#F4F3FF;--pd:#D9D6FE;--pi:#5925DC}
.h-teal{--pb:#F0FDF9;--pd:#99F6E0;--pi:#107569}
.h-green{--pb:#ECFDF3;--pd:#ABEFC6;--pi:#067647}
.h-red{--pb:#FEF3F2;--pd:#FECDCA;--pi:#B42318}
.h-blue{--pb:#EFF8FF;--pd:#B2DDFF;--pi:#175CD3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
.stage[lang=ar]{font-family:var(--fa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* prototype bar (always LTR, always French) */
.pbar{position:sticky;top:0;z-index:400;background:#16191E;color:#E6E8EB;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #000;direction:ltr;font-family:"Plus Jakarta Sans",sans-serif}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2}
.looks button:hover{color:#fff}
.looks button.on{background:#fff;color:#0E1013}

/* shell + sidebar — the live structure on main */
.stage{display:flex;min-height:calc(100vh - var(--pbh))}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:var(--pbh);height:calc(100vh - var(--pbh))}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1;font-family:"Plus Jakarta Sans",sans-serif}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1;text-align:start}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.sb-mk svg.flag{width:26px;height:18px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-item .sb-badge{flex:none}
.sb-badge{flex:none;height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(247,144,9,.18);color:#FDB022}
.sb-item.on .sb-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-group{margin-top:14px}
.sb-gl{height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center}
[lang=ar] .sb-gl{letter-spacing:0}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:24px 28px 120px;background:var(--page);background-attachment:fixed}
.page{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* header — workbench scale (H1 24 / 800) */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
[lang=ar] .ph h1{letter-spacing:0}
.sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700}
.live i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--live)}
.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 1.8s ease-out infinite}
.acts{display:flex;gap:8px;align-items:center}
.btn{height:38px;padding:0 15px;border-radius:11px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn .ic{width:15px;height:15px}
.btn2{height:36px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.88);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover:not(:disabled){background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2:disabled{opacity:.4}
.btn2 .ic{width:15px;height:15px}
.btn2.neg{color:var(--bad)}
.ph .acts .btn,.ph .acts .btn2{height:40px}

/* 1 · work shortcuts — counted now, each one a filter */
.wts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:start;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.wt:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover)}
.wt.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand),var(--card-sh)}
.wt .hold{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.wt .hold .ic{width:20px;height:20px}
.wt-t{display:grid;min-width:0}
.wt b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wt-t > span{font-size:13.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small em{font-style:normal;color:var(--bad);font-weight:700}
.wt.zero b{color:var(--ink-q)}
.wt-x{position:absolute;top:10px;inset-inline-end:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff}
.wt-x .ic{width:12px;height:12px;stroke-width:2.6}

/* 2 · search + dates, then one calm line of filters */
.tools{display:flex;gap:10px;align-items:flex-start}
.srch{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);color:var(--ink-3)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;color:var(--ink);min-width:0;font-weight:500}
.srch input::placeholder{color:var(--ink-3)}
.srch:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12),var(--card-sh)}
.kbd2{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid rgba(15,23,40,.12);border-radius:6px;padding:0 6px;line-height:20px}
.fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbw{position:relative}
.fb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 10px 0 12px;border-radius:11px;background:rgba(255,255,255,.75);border:1px solid rgba(15,23,40,.08);font-size:13px;font-weight:700;color:var(--ink-2)}
.fb:hover,.fb.open{background:#fff;color:var(--ink)}
.fb.on{background:#fff;color:var(--ink);border-color:rgba(21,128,61,.55)}
.fb .ic{width:15px;height:15px}
.fb .chev{width:13px;height:13px;color:var(--ink-3)}
.fb em{font-style:normal;min-width:19px;height:19px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.fl .count{margin-inline-start:auto;font-size:13px;color:var(--ink-2);font-weight:600}
.fl .count b{color:var(--ink);font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:-4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 4px 0 11px;border-radius:99px;background:#fff;border:1px solid rgba(15,23,40,.1);font-size:12.5px;font-weight:600;color:var(--ink-3);max-width:420px}
[dir=rtl] .chip{padding:0 11px 0 4px}
.chip b{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.chip button:hover{background:var(--flat-bg);color:var(--ink)}
.chip button .ic{width:12px;height:12px}
.clearall{font-size:12.5px;font-weight:700;color:var(--brand);padding:0 6px}

/* menus */
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:90;min-width:270px;max-height:440px;overflow:auto;padding:6px;border-radius:14px;background:rgba(255,255,255,.98);border:1px solid var(--card-bd);box-shadow:0 22px 54px rgba(20,25,60,.2);animation:drop .14s ease-out}
.menu.end{inset-inline-start:auto;inset-inline-end:0}
.up > .menu{top:auto;bottom:calc(100% + 8px)}
.menu h6{margin:10px 8px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
[lang=ar] .menu h6{letter-spacing:0}
.menu h6:first-child{margin-top:4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 8px;border-radius:9px;font-size:13px;font-weight:600;text-align:start}
.mi:hover{background:#F2F4F7}
.mi .cb{width:16px;height:16px;border-radius:5px;border:1.5px solid #C9CED7;display:grid;place-items:center;flex:none;background:#fff}
.mi.on .cb{background:var(--brand);border-color:var(--brand);color:#fff}
.mi .cb .ic{width:11px;height:11px;stroke-width:3}
.mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.mi.zero:not(.on){opacity:.42}
.mi .dotk{width:8px;height:8px;border-radius:50%;background:var(--pi);flex:none}
.mi.act{color:var(--ink)} .mi.act.neg{color:var(--bad)}
.mi.act .ic{color:var(--ink-3)} .mi.act.neg .ic{color:var(--bad)}
.msep{height:1px;background:var(--line);margin:6px 4px}

/* 3 · the list — one glass container, plain white rows with hairlines, no motion on rows */
.list{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
.lh,.row{display:grid;grid-template-columns:44px minmax(250px,1fr) 104px 178px 74px 148px 150px 40px;align-items:center;column-gap:10px;padding-inline:6px 8px}
.lh{height:42px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
[lang=ar] .lh{letter-spacing:0;font-size:12px}
.lh .e{text-align:end}
.rows{background:#fff}
.row{position:relative;min-height:64px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:#F8F9FC}
.row.sel{background:var(--brand-wash)}
.row.open::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--brand)}
.row.del{opacity:.55}
.ck{width:18px;height:18px;border-radius:6px;border:1.5px solid #C9CED7;display:grid;place-items:center;margin:auto;background:#fff;color:#fff}
.ck.on{background:var(--brand);border-color:var(--brand)}
.ck .ic{width:12px;height:12px;stroke-width:3}
.oc{display:flex;align-items:center;gap:12px;min-width:0}
.oc-t{min-width:0;flex:1}
.thumb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--ti);box-shadow:inset 0 0 0 1px rgba(15,23,40,.05)}
.thumb .ic{width:19px;height:19px}
.l1{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.l2 b{color:var(--ink-2);font-weight:600}
.l2 .qty{color:var(--ink);font-weight:800}
.l2 .miss{color:var(--warn);font-weight:700}
.amt{text-align:end;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-inline-start:4px;letter-spacing:.02em}
.age{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.age .ic{width:12px;height:12px}
.age.late{color:var(--warn);font-weight:800}
.age.vlate{color:var(--bad);font-weight:800}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:600}
.who > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .none{font-style:italic;color:var(--ink-3);font-weight:500}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:color-mix(in srgb,var(--h) 16%,#fff);color:color-mix(in srgb,var(--h) 78%,#000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 28%,#fff)}
/* presence: the assignee is inside the order right now (managers only, as today) */
.av.here{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--live)}
.av.free{background:#fff;box-shadow:inset 0 0 0 1.5px #D0D5DD;color:var(--ink-3)}
.av.free .ic{width:12px;height:12px}
.shop{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.shop i{width:10px;height:10px;border-radius:3.5px;background:linear-gradient(135deg,var(--a5),var(--a7));flex:none}
.shop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.kb:hover{background:var(--flat-bg);color:var(--ink)}
.kbw{position:relative}

/* pills and tags — a status says its word; a tag says its number */
.pl{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px 0 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid var(--pd);background:var(--pb);color:var(--pi);max-width:100%;overflow:hidden}
[dir=rtl] .pl{padding:0 8px 0 10px}
.pl span{overflow:hidden;text-overflow:ellipsis}
.pl .ic{width:13px;height:13px}
.tg{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pi);flex:none;cursor:help}
.tg .ic{width:11px;height:11px;stroke-width:2.4}

.pg{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.82);font-size:13px;color:var(--ink-2);font-weight:600}
.pg .nav{display:flex;gap:6px;margin-inline-start:auto}
.pg .btn2{height:32px}
.ps{display:inline-flex;align-items:center;gap:8px}
.ps select{height:32px;border-radius:9px;border:1px solid rgba(15,23,40,.12);background:#fff;padding:0 8px;font-weight:700}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px;background:#fff;display:grid;justify-items:center;gap:10px}
.empty .ic{width:28px;height:28px;color:var(--ink-4)}

/* the bulk bar — white glass, never dark (nothing in the content area is dark but the tooltip) */
.bulk{position:fixed;bottom:22px;inset-inline-start:calc(240px + (100vw - 240px) / 2);transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 22px 56px rgba(20,25,60,.24);font-size:13px;font-weight:700;animation:rise .2s ease-out;white-space:nowrap}
[dir=rtl] .bulk{transform:translateX(50%);padding:8px 16px 8px 8px}
.bulk .vsep{width:1px;height:24px;background:var(--line)}
.bulk .btn2{height:36px}
.lnkb{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:0 8px}
.lnkb:hover{color:var(--ink)}

/* drawers — the order panel and « Nouvelle commande »: opaque, they slide in once */
.scrim{position:fixed;inset:0;top:var(--pbh);z-index:200;background:rgba(15,23,40,.16);animation:fade .2s}
.drawer{position:fixed;top:var(--pbh);bottom:0;inset-inline-end:0;z-index:210;width:min(600px,100vw);background:#fff;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(15,23,40,.06),-30px 0 70px rgba(20,25,60,.18);animation:slide .24s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .drawer{box-shadow:0 0 0 1px rgba(15,23,40,.06),30px 0 70px rgba(20,25,60,.18);animation-name:slideR}
.dr-top{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);flex:none}
[dir=rtl] .dr-top{padding:12px 18px 12px 12px}
.dr-age{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sla{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:800;white-space:nowrap}
.sla .ic{width:12px;height:12px}
.sp{flex:1}
.ref{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;direction:ltr}
.ref .ic{width:13px;height:13px;color:var(--ink-3)}
.ref:hover,.xbtn:hover{background:var(--flat-bg)}
.xbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.dr-body{flex:1;overflow:auto;overscroll-behavior:contain}
.pc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:18px 20px 16px;align-items:center}
.pc-n{display:flex;align-items:center;gap:10px;min-width:0}
.pc-n h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rel{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pi);border:1px solid var(--pd);flex:none}
.rel .ic{width:12px;height:12px}
.pc-btns{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px}
.pc-add{grid-column:1 / -1;margin-top:-2px}
.pc-btns .btn,.pc-btns .btn2{height:40px}
.pc-ph{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);flex-wrap:wrap}
.pc-ph .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mini{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.mini .ic{width:13px;height:13px}
.mini:hover{background:var(--flat-bg);color:var(--ink)}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--brand)}
.lnk .ic{width:13px;height:13px}
.lnk:hover{text-decoration:underline}
.facts{display:grid;grid-template-columns:118px minmax(0,1fr);gap:11px 12px;margin:0;padding:16px 20px 18px;border-top:1px solid var(--line);font-size:13.5px}
.facts dt{color:var(--ink-3);font-weight:600}
.facts dd{margin:0;font-weight:600;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.miss{display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-weight:700}
.miss .ic{width:13px;height:13px}
.q{color:var(--ink-3);font-weight:500}
.tabwrap{position:sticky;top:0;z-index:3;background:#fff;padding:10px 20px;border-top:1px solid var(--line)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:#F2F4F7}
.tabs button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,40,.14)}
.tabs em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.pane{padding:6px 20px 22px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line b{font-size:14px;font-weight:700;display:block}
.line small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.line .amt{font-size:14.5px;white-space:nowrap}
.line .amt small{display:inline;margin-top:0}
.pane-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pane-acts .btn2{height:34px;font-size:12.5px}
.tot{display:grid;gap:7px;padding:16px 0 0;font-size:13.5px;color:var(--ink-2);font-weight:600}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{color:var(--ink);font-size:16px;font-weight:800;padding-top:8px;border-top:1px solid var(--line)}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding-inline-start:26px;padding-block:7px;font-size:13.5px;font-weight:600}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--pi);box-shadow:0 0 0 3px var(--pb)}
.tl li::after{content:"";position:absolute;inset-inline-start:9px;top:26px;bottom:-8px;width:1.5px;background:#E4E7EC}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.tl li.now{font-weight:800}
.trk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F8F9FC;border:1px solid var(--line);margin:8px 0 10px}
.trk .hold,.reco .hold{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.trk div{flex:1;display:grid;min-width:0}
.trk small,.reco small{font-size:12px;color:var(--ink-3);font-weight:600}
.trk b{font-size:14px;font-weight:800;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.reco{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:#F8F9FC;border:1px solid var(--line);margin-top:8px}
.reco div{display:grid;gap:2px}
.reco b{font-size:14px;font-weight:800}
.thread{display:grid;gap:8px;margin-top:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;background:#F2F4F7;font-family:var(--fa)}
.bub.out{margin-inline-start:auto;background:#DCFAE6;color:#05432A;border-end-end-radius:4px}
.bub.in{border-end-start-radius:4px}
.bub small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;font-family:var(--f);font-weight:600}
.compose{display:flex;gap:8px;margin-top:14px}
.compose input{flex:1;height:40px;border-radius:11px;border:1px solid #D0D5DD;padding:0 12px;font-size:13.5px;min-width:0}
.compose .btn{height:40px}
.thread-empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--ink-3);font-size:13px;text-align:center}
.notes{flex:none;display:grid;gap:6px;padding:12px 16px 0;border-top:1px solid var(--line)}
.note{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:12.5px;font-weight:700;background:var(--pb);color:var(--pi);border:1px solid var(--pd)}
.note .ic{width:14px;height:14px}
.dr-foot{flex:none;display:flex;gap:8px;padding:12px 16px 14px}
.fa{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 6px}
.fa span{overflow:hidden;text-overflow:ellipsis}
.fa:hover{background:#F9FAFB}
.fa .ic{width:15px;height:15px}
.fa.pri{background:var(--brand);border-color:var(--brand);color:#fff;flex:1.1}
.fa.pri:hover{background:var(--brand-hover)}
.fa.neg{color:var(--bad)}
.fa.io{flex:none;width:44px;padding:0}
.fa.wide{flex:2}

/* « Nouvelle commande » — the same fields, in Aurore */
.dr-title{flex:1;display:grid}
.dr-title b{font-size:17px;font-weight:800}
.dr-title small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.fs{margin:16px 20px 0;padding:16px;border-radius:16px;background:#FAFBFD;border:1px solid var(--line);display:grid;gap:13px}
.fs h3{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800}
.fs h3 .hold{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--pb);color:var(--pi)}
.fs h3 .hold .ic{width:15px;height:15px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fld label i{color:var(--bad);font-style:normal;margin-inline-start:2px}
.inp{height:40px;border-radius:11px;border:1px solid #D0D5DD;background:#fff;padding:0 12px;font-size:14px;color:var(--ink);width:100%;font-weight:500}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
textarea.inp{height:64px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp-pre{display:flex}
.inp-pre span{display:grid;place-items:center;padding:0 12px;border:1px solid #D0D5DD;border-inline-end:0;border-start-start-radius:11px;border-end-start-radius:11px;background:#F2F4F7;font-weight:700;font-size:13.5px;direction:ltr}
.inp-pre .inp{border-start-start-radius:0;border-end-start-radius:0;direction:ltr;text-align:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;height:40px;border:1px solid #D0D5DD;border-radius:11px;overflow:hidden;background:#fff}
.step button{width:40px;display:grid;place-items:center;color:var(--ink-2)}
.step button:hover{background:#F2F4F7}
.step span{flex:1;display:grid;place-items:center;font-weight:800;border-inline:1px solid #EAECF0}
.calc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--good-bg);color:var(--good)}
.calc b{font-size:17px;font-weight:800}
.calc small{display:block;font-size:12px;font-weight:600;opacity:.85}

/* Archivées */
.rule{display:flex;align-items:center;gap:12px 16px;padding:12px 16px;border-radius:18px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);flex-wrap:wrap;font-size:13.5px;font-weight:600}
.rule .rl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rule select{height:32px;border-radius:9px;border:1px solid rgba(15,23,40,.12);background:#fff;padding:0 6px;font-weight:800}
.rule .rh{font-size:12.5px;color:var(--ink-3);font-weight:500;flex:1 1 300px}
.tog{width:38px;height:22px;border-radius:99px;background:#D0D5DD;position:relative;flex:none;transition:background .15s}
.tog.on{background:var(--brand)}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.tog.on::after{inset-inline-start:19px}
.door{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid rgba(15,23,40,.09);font-size:12.5px;font-weight:700;color:var(--ink)}
.door .ic{width:14px;height:14px;color:var(--accent)}
.door:hover{box-shadow:0 4px 14px rgba(42,52,110,.12)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid var(--card-bd);box-shadow:var(--card-sh)}
.seg button{height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,40,.14)}
.seg em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:800;font-variant-numeric:tabular-nums}
.seg button.on em{color:var(--brand)}
.seg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg-row .hint{font-size:12.5px;color:var(--ink-3);font-weight:600}

/* Doublons — one card per group, the copies as rows */
.grps{display:grid;gap:14px}
.grp{background:var(--card);border:1px solid var(--card-bd);border-radius:20px;box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
.gh{display:flex;align-items:center;gap:10px 12px;padding:14px 18px;flex-wrap:wrap}
.gav{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#EEF2F6;color:var(--ink-2);font-weight:800;flex:none;font-family:var(--fa)}
.gt{display:grid;min-width:0;margin-inline-end:6px}
.gt h3{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.gt small .num{direction:ltr;unicode-bidi:isolate}
.conf{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--pb);color:var(--pi);border:1px solid var(--pd)}
.conf .ic{width:12px;height:12px}
.gmeta{font-size:12.5px;color:var(--ink-2);font-weight:600}
.diff{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warn)}
.diff .ic{width:12px;height:12px}
.cps{background:#fff}
.cp{display:grid;grid-template-columns:132px 128px minmax(160px,1fr) 186px 104px 120px 34px;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer;min-height:58px}
.cp:hover{background:#F8F9FC}
.cp > .keep,.cp > .locked,.cp > .dk{justify-self:start}
.cp.kept{background:#F6FBF8}
.cp .tm{font-size:12.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.cp .pr{display:flex;align-items:center;gap:10px;min-width:0;font-size:13px;font-weight:700}
.cp .pr .thumb{width:34px;height:34px;border-radius:10px}
.cp .pr .thumb .ic{width:16px;height:16px}
.cp .pr > span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keep{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:var(--good-bg);color:var(--good);font-size:12.5px;font-weight:800;white-space:nowrap}
.keep .ic{width:13px;height:13px;fill:currentColor}
.locked{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.locked .ic{width:13px;height:13px}
.dk{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
[dir=rtl] .dk{padding:0 6px 0 10px}
.dk:hover{background:#F2F4F7}
.dk .ck{margin:0}
.dk.on{color:var(--bad)}
.dk.on .ck{background:var(--bad);border-color:var(--bad)}
.mk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-4)}
.mk:hover{background:#F2F4F7;color:var(--good)}
.mk .ic{width:15px;height:15px}
.gf{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.75)}
.gf .btn2{height:34px}

/* the returning customer: one card — who, how reliable, every order on one trail, what is still in progress */
.wts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.trail{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;padding:2px 18px 14px}
.stop{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 9px;border-radius:99px;background:var(--pb);border:1px solid var(--pd);color:var(--pi);font-size:12px;font-weight:700;white-space:nowrap}
[dir=rtl] .stop{padding:0 9px 0 11px}
.stop i{width:8px;height:8px;border-radius:50%;background:var(--pi);flex:none}
.stop.now{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--pi)}
.stop:hover{filter:brightness(.97)}
.link{width:16px;height:2px;border-radius:2px;background:#D0D5DD;flex:none}
.cstat{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.cstat span{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;background:#F2F4F7;font-size:12px;font-weight:700;color:var(--ink-2)}
.cstat b{font-weight:800;color:var(--ink)}
.cstat .g{background:#ECFDF3;color:#067647}.cstat .g b{color:#067647}

function range(k){

/* ═══ Clients récurrents — the same phone, several orders. A « case » is one client: a duplicate group if they
   sent the same order twice, and/or a past if they came back. One client at a time: the list left, the client right. */
function cases(){
  const out = [];
  CUST.forEach((list, phone) => {
    const all = list.filter(o => o.st !== "deleted");
    const g = GROUPS.find(x => x.m.length > 1 && x.m[0].phone === phone) || null;
    const os = all.filter(o => o.dup == null || GROUPS[o.dup].m.length < 2 || GROUPS[o.dup].m[0] === o);
    const back = os.length >= 2 && os[os.length - 1].ad <= 7;
    if (!g && !back) return;
    const dl = os.filter(o => o.st === "delivered").length, bad = os.filter(o => o.st === "rejected" || o.st === "returned").length;
    out.push({phone, all, os, g, dl, bad, last:all[all.length - 1], rel:os.length < 2 ? "new" : bad >= 2 && bad > dl ? "risk" : dl && !bad ? "ok" : "mid"});
  });
  return out.sort((a, b) => b.last.t - a.last.t);
}
const OUTC = o => o.st === "delivered" ? ["green","Livrée","تم التسليم"] : o.st === "rejected" ? ["red","Rejetée","مرفوضة"] : o.st === "returned" ? ["red","Retournée","مرتجعة"] : o.st === "cancelled" ? ["neutral","Annulée","ملغاة"] : SHIPPED.has(o.st) ? ["teal","En route","في الطريق"] : ["violet","En cours","قيد المعالجة"];
const RELC = c => ({risk:["red","alert",L("À risque","غير موثوق")], ok:["green","check",L("Fiable","موثوق")], mid:["amber","help",L("Moyen","متوسط")], new:["neutral","user",L("Nouveau client","عميل جديد")]}[c.rel]);
const DUPF = [
  {k:"all", icon:"team", hue:"neutral", fr:"Tous les clients", ar:"كل العملاء", hint:["même numéro, plusieurs commandes","نفس الرقم، عدة طلبات"], f:() => true},
  {k:"dup", icon:"copy", hue:"blue", fr:"En double", ar:"طلبات مكررة", hint:["reçue deux fois — à nettoyer","وصل مرتين — للتنظيف"], f:c => !!c.g},
  {k:"risk", icon:"alert", hue:"red", fr:"À risque", ar:"غير موثوقين", hint:["refus ou retours répétés","رفض أو إرجاع متكرر"], f:c => c.rel === "risk"},
  {k:"ok", icon:"star", hue:"green", fr:"Fidèles", ar:"أوفياء", hint:["livrés, aucun échec","سبق التسليم، دون فشل"], f:c => c.rel === "ok"}
];
function caseRow(c){
  const f = c.all[0], R = RELC(c), on = S.case === c.phone;
  const sum = c.g ? L(`${c.g.m.length} commandes en ${spanText(c.g.span)}`, `${c.g.m.length} طلبات خلال ${spanText(c.g.span)}`) : L(`${c.os.length} commandes · ${c.dl} ${pl(c.dl, "livrée", "livrées")}`, `${c.os.length} طلبات · ${c.dl} مسلّمة`);
  return `<button class="cr${on ? " on" : ""}" data-case="${c.phone}" aria-current="${on}"><span class="gav">${esc(f.name.slice(0, 1))}</span>
    <span class="cr-t"><b><span dir="auto">${esc(f.name)}</span></b><small>${sum} · ${whenText(c.last.t)}</small><span class="dots">${c.os.map(o => `<i class="h-${OUTC(o)[0]}${FINAL.has(o.st) ? "" : " now"}"></i>`).join("")}</span></span>
    <span class="cr-b">${c.g ? `<span class="mc h-${c.g.shipped ? "red" : "blue"}">${ic("copy")}×${c.g.m.length}</span>` : ""}${c.rel === "new" ? "" : `<span class="mc h-${R[0]}">${R[2]}</span>`}</span></button>`;
}
function caseDetail(c){
  const f = c.all[0], R = RELC(c), live = c.os.filter(o => !FINAL.has(o.st) && (!c.g || !c.g.m.includes(o)));

function cal(m, side){
  const first = m + "-01", last = lastDay(m), lead = (dt(first).getUTCDay() + 6) % 7, d = S.dp;
  const prevOff = lastDay(addMonths(m, -1)) < FIRST, nextOff = m >= TODAY.slice(0, 7);
  const W = S.lang === "ar" ? ["ن","ث","ر","خ","ج","س","ح"] : ["L","M","M","J","V","S","D"];
  let h = `<div class="cal"><div class="cal-h">${side < 0 ? `<button class="cal-nav" data-dpnav="-1" aria-label="${esc(L("Mois précédent", "الشهر السابق"))}" ${prevOff ? "disabled" : ""}>${ic("left", "flip")}</button>` : "<span></span>"}<b>${monthName(m)} ${m.slice(0, 4)}</b>${side > 0 ? `<button class="cal-nav" data-dpnav="1" aria-label="${esc(L("Mois suivant", "الشهر التالي"))}" ${nextOff ? "disabled" : ""}>${ic("right", "flip")}</button>` : "<span></span>"}</div>
    <div class="cal-g">${W.map(x => `<span class="cal-w">${x}</span>`).join("")}${"<span></span>".repeat(lead)}`;
  for (let x = first; x <= last; x = addDays(x, 1)){
    const dis = x < FIRST || x > TODAY;
    const cls = [dis ? "c-dis" : "", x === TODAY ? "c-today" : "", d.s === x ? "c-st" : "", d.e === x ? "c-en" : "", d.s && d.e && x > d.s && x < d.e ? "c-in" : ""].filter(Boolean).join(" ");
    h += `<button class="cal-d ${cls}" data-dday="${x}" ${dis ? "disabled" : ""}>${+x.slice(8)}</button>`;
  }
  return h + `</div></div>`;
}

  /* list */
  if ((t = g("[data-tile]"))){ const k = t.dataset.tile; keep(() => { S.tile = S.tile === k ? null : k; S.page = 0; S.sel.clear(); }); return; }
  if ((t = g("[data-chipx]"))){ const k = t.dataset.chipx; keep(() => { S.page = 0; if (k === "tile") S.tile = null; else if (k === "q") S.q = ""; else if (k === "period") S.period = "all"; else S[k].clear(); }); return; }
  if (g("[data-clearall]")){ keep(() => { const scr = S.screen; resetFilters(); S.screen = scr; }); return; }
  if ((t = g("[data-sel]"))){ const id = +t.dataset.sel; keep(() => { if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); }); return; }
  if (g("[data-selall]")){ const rows = rowsNow().slice(S.page * S.size, S.page * S.size + S.size).map(o => o.id), all = rows.every(id => S.sel.has(id)); keep(() => rows.forEach(id => all ? S.sel.delete(id) : S.sel.add(id))); return; }
  if ((t = g("[data-page]"))){ keep(() => { S.page = Math.max(0, S.page + +t.dataset.page); S.sel.clear(); }); scrollTo(0, 0); return; }
  if ((t = g("[data-bulk]"))){ const k = t.dataset.bulk, n = S.sel.size;
    if (k === "clear"){ keep(() => S.sel.clear()); return; }
    if (k === "restore"){ keep(() => { S.sel.forEach(id => { const o = ORDERS[id]; o.st = o.att ? "attempt_" + Math.min(3, o.att) : "pending"; o.delT = undefined; }); S.sel.clear(); }); toast(L(`${n} commande(s) restaurée(s) — elles reviennent dans Commandes, au même point d'appel`, `استُعيد ${n} طلب — يعود إلى الطلبات في نفس مرحلة الاتصال`)); return; }
    if (k === "putaway" || k === "unarchive"){ keep(() => { S.sel.forEach(id => ORDERS[id].arch = k === "putaway"); S.sel.clear(); }); toast(k === "putaway" ? L(`${n} commande(s) rangée(s) — elles comptent toujours dans vos chiffres et la recherche`, `تم ترتيب ${n} طلب — ما زالت محسوبة في أرقامك وفي البحث`) : L(`${n} commande(s) remise(s) dans Commandes`, `أُعيد ${n} طلب إلى الطلبات`)); return; }
    toast({send:L(`Envoi de ${n} commande(s) chez le transporteur — le résultat ligne par ligne`, `إرسال ${n} طلب إلى الناقل — النتيجة لكل طلب`), reopen:L(`Réouvrir ${n} commande(s) téléchargée(s)`, `إعادة فتح ${n} طلب مرفوع`), cancel:L(`Annuler ${n} commande(s) ?`, `إلغاء ${n} طلب؟`)}[k]); return; }
  /* panel + create */
  if (g("[data-close]")){ keep(() => { S.open = null; S.create = false; }); return; }
  if ((t = g("[data-tab]"))){ keep(() => S.tab = t.dataset.tab, true); return; }
  if ((t = g("[data-act]"))){ act(t.dataset.act); return; }
  if (g("[data-create]")){ keep(() => { S.create = true; S.open = null; S.cf = freshCF(); }, true); return; }
  if ((t = g("[data-qty]"))){ keep(() => S.cf.qty = Math.max(1, S.cf.qty + +t.dataset.qty)); return; }
  if (g("[data-over]")){ keep(() => { S.cf.over = true; S.cf.total = String(S.cf.qty * (+S.cf.price || 0)); }); return; }
  if (g("[data-submit]")){ const f = S.cf;
    if (!f.phone.trim() || !f.name.trim() || !f.city.trim() || !f.addr.trim()){ toast(L("Téléphone, nom, ville et adresse sont obligatoires", "الهاتف والاسم والمدينة والعنوان إلزامية")); return; }
    const ci = CITIES.findIndex(c => c[0] === f.city || c[1] === f.city), P = PRODUCTS[f.p];
    const o = {t:NOW_T, ad:0, day:TODAY, s:f.s, p:f.p, v:P.v ? (f.v ?? 0) : null, qty:f.qty, total:f.over && f.total !== "" ? +f.total : f.qty * (+f.price || 0), age:0, name:f.name.trim(), phone:"0" + f.phone.replace(/\D/g, "").slice(-9), city:ci >= 0 ? ci : null, addr:0, st:"pending", ag:null, att:0};
    o.id = ORDERS.length; o.ref = String(41207 + o.id); ORDERS.push(o);
    keep(() => { S.create = false; S.tile = null; S.page = 0; }); toast(L(`Commande #${o.ref} créée — elle attend un agent`, `تم إنشاء الطلب #${o.ref} — بانتظار وكيل`)); return; }
  /* archive */
  if ((t = g("[data-arch]"))){ keep(() => { S.arch = t.dataset.arch; S.page = 0; S.sel.clear(); }); return; }
  if (g("[data-rule]")){ keep(() => S.rule = !S.rule); return; }
  /* doublons */
  if ((t = g("[data-dupf]"))){ keep(() => { S.dupf = t.dataset.dupf; S.case = null; }); return; }
  if ((t = g("[data-case]"))){ keep(() => S.case = t.dataset.case); return; }
  if ((t = g("[data-dupv]"))){ keep(() => S.dupv = t.dataset.dupv); return; }
  if ((t = g("[data-rept]"))){ keep(() => S.rept = t.dataset.rept); return; }
  if ((t = g("[data-custlist]"))){ const ph = t.dataset.custlist; keep(() => { S.screen = "list"; resetFilters(); S.q = ph; }); scrollTo(0, 0); return; }
  if ((t = g("[data-dupt]"))){ keep(() => S.dupt = t.dataset.dupt); return; }
  if ((t = g("[data-dsel]"))){ const id = +t.dataset.dsel; keep(() => { if (S.dsel.has(id)) S.dsel.delete(id); else S.dsel.add(id); }); return; }
  if ((t = g("[data-keep]"))){ const [gid, id] = t.dataset.keep.split(":").map(Number); keep(() => { S.keep[gid] = id; S.dsel.delete(id); }); return; }
  if ((t = g("[data-gdel]"))){ const gr = GROUPS[+t.dataset.gdel], kp = keepOf(gr), del = gr.m.filter(o => o.id !== kp && !SHIPPED.has(o.st) && S.dsel.has(o.id));
    keep(() => { del.forEach(o => { o.st = "deleted"; o.delT = NOW_T; S.dsel.delete(o.id); }); gr.m = gr.m.filter(o => !del.includes(o)); }); toast(L(`${del.length} copie(s) supprimée(s) — consultables et restaurables`, `حُذفت ${del.length} نسخة — يمكن الاطلاع عليها واستعادتها`)); return; }
  if (g("[data-dupdel]")){ let n = 0; keep(() => { GROUPS.forEach(gr => { const kp = keepOf(gr), del = gr.m.filter(o => o.id !== kp && !SHIPPED.has(o.st) && S.dsel.has(o.id)); del.forEach(o => { o.st = "deleted"; o.delT = NOW_T; S.dsel.delete(o.id); n++; }); gr.m = gr.m.filter(o => !del.includes(o)); }); }); toast(L(`${n} commande(s) supprimée(s) — consultables et restaurables`, `حُذف ${n} طلب — يمكن الاطلاع عليها واستعادتها`)); return; }
  if (g("[data-dupclear]")){ keep(() => S.dsel.clear()); return; }
  if ((t = g("[data-merge]"))){ toast(L("Fusionner : une seule livraison, l'adresse choisie explicitement (comme aujourd'hui)", "دمج: توصيل واحد، مع اختيار العنوان صراحةً (كما هو اليوم)")); return; }
  if ((t = g("[data-open]"))){ openOrder(+t.dataset.open); return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q"){ keep(() => { S.q = el.value; S.page = 0; S.sel.clear(); }); return; }
  if (el.dataset.cf){ S.cf[el.dataset.cf] = el.value; return; }
  if (el.dataset.cfn){ S.cf[el.dataset.cfn] = el.value.replace(",", "."); const calc = document.querySelector(".calc b"); if (calc) calc.textContent = `${fnum(S.cf.over && S.cf.total !== "" ? +S.cf.total : S.cf.qty * (+S.cf.price || 0))} ${CCY()}`; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "ps"){ keep(() => { S.size = +el.value; S.page = 0; }); return; }
  if (el.id === "ruledays"){ keep(() => { S.ruleDays = +el.value; S.page = 0; S.sel.clear(); }); return; }
  if (el.dataset.cfs){ const k = el.dataset.cfs, v = +el.value; keep(() => { if (k === "s"){ S.cf.s = v; S.cf.p = PRODUCTS.findIndex(p => p.s === v); S.cf.v = null; S.cf.price = PRODUCTS[S.cf.p].price; } if (k === "p"){ S.cf.p = v; S.cf.v = null; S.cf.price = PRODUCTS[v].price; } if (k === "v") S.cf.v = v; }); }
});
document.addEventListener("keydown", e => {
  const typing = e.target.matches && e.target.matches("input,textarea,select");
  if (e.key === "Escape"){ if (S.menu || S.dp) keep(() => { S.menu = null; S.dp = null; }); else if (S.open != null || S.create) keep(() => { S.open = null; S.create = false; }); return; }
  if (typing) return;
  if (e.key === "/"){ const q = document.getElementById("q"); if (q){ e.preventDefault(); q.focus(); } return; }
  if (e.key === "b" || e.key === "B"){ keep(() => S.before = !S.before); return; }
  const r = e.target.closest && e.target.closest("[data-open]");
  if (r && (e.key === "Enter" || e.key === " ") && e.target === r){ e.preventDefault(); openOrder(+r.dataset.open); }
});
document.addEventListener("mouseover", e => {
  if (S.dp && S.dp.s && !S.dp.e){ const dd = e.target.closest && e.target.closest("[data-dday]"), s = S.dp.s;
    document.querySelectorAll(".cal-d").forEach(b => { const x = b.dataset.dday; b.classList.toggle("c-hv", !!dd && ((x > s && x <= dd.dataset.dday) || (x < s && x >= dd.dataset.dday))); }); }
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t){ if (!tip.textContent.startsWith("→")) tip.classList.remove("on"); return; }
  if (tip.textContent.startsWith("→") && tip.classList.contains("on")) return;
  tip.textContent = t.dataset.tip; tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on") || tip.textContent.startsWith("→")) return;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 50) y = e.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
addEventListener("resize", () => document.documentElement.style.setProperty("--pbh", document.getElementById("pbar").offsetHeight + "px"));

/* ═════════════ start ═════════════ */
generate();
const q0 = new URLSearchParams(location.search);
if (["list","archive","dup"].includes(q0.get("screen"))) S.screen = q0.get("screen");
if (q0.get("lang") === "ar") S.lang = "ar";
if (["dup","risk","ok"].includes(q0.get("f"))) S.dupf = q0.get("f");
if (["eligible","archived","recent","deleted"].includes(q0.get("tab"))) S.arch = q0.get("tab");
if (q0.get("before") === "1") S.before = true;
if (["un","re","up","to"].includes(q0.get("tile"))) S.tile = q0.get("tile");
if (q0.get("open")){ const o = ORDERS.find(x => x.ref === q0.get("open")); if (o){ S.open = o.id; S.tab = o.trk ? "dlv" : "art"; } }
if (q0.get("create") === "1"){ S.create = true; S.cf = freshCF(); }
render();
</script>
