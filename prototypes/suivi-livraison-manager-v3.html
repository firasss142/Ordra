<!doctype html>
<!--
  Suivi livraison — écran manager, planche v3 (2026-10-08). « Aurore calme », un cran plus doux : v2 + couleurs adoucies (fonds d'équipe, halos, pastilles, barres, aurore, badges) à la demande du propriétaire.
  Reconstruit sur le squelette de Prospects (/leads) et de Voix du client (/feedback) :
  en-tête · bandeau (la réponse + « À faire ») · 4 bacs · l'équipe · la liste · tiroir.
  Le panneau de droite (cockpit à 3 onglets) disparaît. Plan : plans/delivery-board-aurore.md

  Ce que le propriétaire compare :
    data=busy|calm|empty     une journée chargée (simulée sur les volumes libyens de septembre),
                             tout est à jour, rien en route
    view=colis|livreurs      les deux vues du sélecteur
    band=sauves|afaire       quel chiffre répond à la page : sauvés cette semaine, ou à traiter maintenant
    lang=fr|ar               le studio reste LTR, seule la scène est en miroir

  Prénoms d'agents, clients, livreurs et numéros INVENTÉS (dépôt public).
  Touches : 1/2/3 données · C/V vue · A/B bandeau · L langue · Échap ferme
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fa:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --quiet:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --card:rgba(255,255,255,.86); --card-bd:rgba(16,24,40,.06);
  --card-sh:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(42,52,110,.05);
  --sh-float:0 20px 52px rgba(42,52,110,.18); --sh-panel:0 30px 80px rgba(42,52,110,.24);
  --brand:#15803D; --brand-h:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  --answer:#2C7F57;
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A;
  --warn:#B4581A; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --bad-dot:#E8385A;
  --aurore:radial-gradient(58% 40% at 2% 0%,#E0E6FF 0%,transparent 70%),radial-gradient(48% 36% at 100% 0%,#FBE2F1 0%,transparent 70%),
           radial-gradient(56% 46% at 98% 100%,#D8F5E5 0%,transparent 70%),radial-gradient(52% 46% at 0% 100%,#FFEFCF 0%,transparent 70%),
           radial-gradient(40% 30% at 50% 50%,#F1EDFF 0%,transparent 80%),#F7F8FB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;background:#F6F7FB}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
bdi{unicode-bidi:isolate}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ── studio bar (not part of the design) ── */
.studio{position:sticky;top:0;z-index:900;background:#0E1013;color:#E6E8EB;padding:10px 20px 11px;display:grid;gap:7px;direction:ltr;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.studio .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.studio .word{font-weight:800;font-size:15px}
.studio .word small{font-weight:500;color:#7F858F;font-size:12.5px;margin-inline-start:8px}
.studio .grp{display:flex;align-items:center;gap:7px}
.studio .glab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7F858F}
.studio .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#1B1F26}
.studio .seg button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:#B5BAC2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.studio .seg button:hover{color:#fff}
.studio .seg button.on{background:#2A303A;color:#fff}
.studio .seg kbd{font:600 10px var(--f);color:#7F858F;border:1px solid #3A414C;border-radius:4px;padding:0 4px;line-height:15px}
.studio .why{font-size:12.5px;color:#B5BAC2;line-height:1.5}
.studio .why b{color:#fff}

/* ── shell ── */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 86px)}
.side{background:#0E1013;color:#C9CDD3;padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;position:sticky;top:86px;height:calc(100vh - 86px);overflow:auto}
.side .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;color:#fff;font-weight:800;font-size:16px}
.side .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#15803D,#10B981);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.side .mk{margin:0 4px 12px;padding:9px 10px;border-radius:12px;background:#171A20;display:flex;align-items:center;gap:9px;font-size:13px;color:#fff;font-weight:600}
.side .mk small{color:#7F858F;font-weight:500;margin-inline-start:auto}
.side .sec{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#C9CDD3;font-weight:600}
.side .sec .ic{color:#7F858F}
.side .sec.open,.side .sec.open .ic{color:#fff}
.side .sub{display:flex;flex-direction:column;gap:1px;margin:0 0 6px;padding-inline-start:26px}
.side .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#AEB3BA;font-weight:500;font-size:13px}
.side .it.on{background:var(--brand);color:#fff;font-weight:700}
.side .bdg{margin-inline-start:auto;min-width:19px;height:19px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.stage{background:var(--aurore);background-attachment:fixed;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:26px 34px 110px;display:flex;flex-direction:column;gap:22px}

/* ── header ── */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumb .ic{width:13px;height:13px;color:var(--ink-4)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
[dir=rtl] h1{letter-spacing:0}
.sub{margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.95);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(18,183,106,.18);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(18,183,106,.08)}}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.segc{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.segc button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.segc .cnt{min-width:20px;height:19px;padding:0 6px;border-radius:99px;background:rgba(15,23,40,.07);color:var(--ink-2);font-size:11px;font-weight:800;display:grid;place-items:center}
.segc button.on .cnt{background:var(--brand);color:#fff}
.glass{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.glass .ic{color:var(--quiet)}
.glass b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:11px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-h)}
.btn.sec{background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);color:var(--ink)}
.btn.sec:hover{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.10)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

/* ── cards ── */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:20px;box-shadow:var(--card-sh);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px -8px}
.sh h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
[dir=rtl] .sh h2{letter-spacing:0}
.sh small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
[dir=rtl] .eyebrow{letter-spacing:0;text-transform:none;font-size:12px}

/* ── band ── */
.bandw{position:relative;z-index:40}
.topband{display:flex;align-items:stretch;min-height:96px}
.tb-a{flex:1;min-width:0;padding:16px 24px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tb-l{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.tb-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:700;color:var(--ink-2)}
.tb-n b{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--answer)}
.tb-n b.warn{color:var(--warn)}
.tb-n b.zero{color:var(--ink-4)}
[dir=rtl] .tb-n b{letter-spacing:0}
.tb-n i{font-style:normal;color:var(--ink-4)}
.tb-n .lost b{font-size:20px;color:var(--ink)}
.tb-m{font-size:12.5px;color:var(--ink-3);font-weight:500}
.tb-m b{color:var(--ink-2);font-weight:700}
.tb-sep{width:1px;background:var(--line);margin:16px 0}
.tb-z{width:min(460px,46%);padding:10px;display:flex;align-items:center}
.tb-t{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-align:start}
.tb-t.act:hover,.tb-t.open{background:rgba(255,255,255,.75)}
.tb-ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative;background:var(--good-bg);color:var(--good)}
.tb-ti.bad{background:#FFF0F2;color:#D9486A}
.tb-ti .ic{width:19px;height:19px}
.tb-ti i{position:absolute;top:-5px;inset-inline-end:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#F07A8E;color:#fff;font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.tb-t > div{flex:1;min-width:0}
.tb-t b{display:block;font-size:14.5px;font-weight:800}
.tb-t small{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.tb-t small span{display:inline-flex;align-items:center;gap:6px}
.d{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d.bad{background:var(--bad-dot)}.d.warn{background:var(--warn-dot)}.d.flat{background:var(--ink-4)}
.tb-t .ic.chev{color:var(--quiet);transition:transform .15s}
.tb-t.open .ic.chev{transform:rotate(180deg)}
.tpanel{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:min(620px,100%);background:#fff;border-radius:16px;box-shadow:var(--sh-float);border:1px solid var(--card-bd);padding:4px 18px;animation:drop .16s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tline{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tline:first-child{border-top:0}
.tline .ti{width:22px;height:22px;display:grid;place-items:center;flex:none}
.tline .ti .ic{width:19px;height:19px}
.tline.bad .ti{color:var(--bad)}.tline.warn .ti{color:var(--warn)}.tline.flat .ti{color:var(--ink-3)}
.tline .tt{flex:1;min-width:0}
.tline .tt b{font-size:14px;font-weight:700}
.tline.bad .n{color:var(--bad)}.tline.warn .n{color:var(--warn)}
.tline .tt p{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}

/* ── bucket cards ── */
.bks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bk{padding:18px 18px 16px;text-align:start;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s,border-color .15s,opacity .15s}
.bk:hover{border-color:rgba(16,24,40,.14)}
.bk.on{border-color:var(--brand);box-shadow:var(--card-sh),0 0 0 1px var(--brand)}
.bk.dim{opacity:.55}
.bk .top{display:flex;gap:11px;align-items:flex-start}
.bk .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(15,23,40,.045);color:var(--ink-2);flex:none}
.bk h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.bk .rule{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px;line-height:1.35}
.bk .tot{display:flex;align-items:baseline;gap:6px}
.bk .tot b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bk .tot b.zero{color:var(--ink-4)}
.bk .tot span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.bk .tot em{margin-inline-start:auto;font-style:normal;font-size:13px;font-weight:700;color:var(--ink-2)}
.bar{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden}
.bar:empty{background:var(--track)}
.bar i{display:block;height:100%;min-width:3px}
.cap{display:grid;grid-template-columns:1fr;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600;min-height:62px}
.cap span{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap i{width:8px;height:8px;border-radius:50%;flex:none}
.cap b{font-weight:800;color:var(--ink);min-width:22px}
.bk .foot{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-height:31px}
.bk .foot.warn{color:var(--warn)}
.bk .foot .ic{width:14px;height:14px}
.bk .flt{position:absolute;top:12px;inset-inline-end:12px;height:20px;padding:0 8px;border-radius:999px;background:var(--brand-bg);color:var(--brand-h);font-size:11px;font-weight:800;display:none;align-items:center}
.bk.on .flt{display:inline-flex}

/* ── agent cards ── */
.ags{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.ag{position:relative;overflow:hidden;border-radius:20px;padding:16px 14px 14px;text-align:start;display:flex;flex-direction:column;align-items:stretch;gap:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--a5) 5%,#fff) 0,#fff 130px);border:1px solid color-mix(in srgb,var(--a5) 13%,transparent);
  box-shadow:inset 0 1px 0 #fff,0 6px 20px color-mix(in srgb,var(--a5) 6%,transparent);transition:transform .15s,box-shadow .15s,opacity .15s}
.ag::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--a5) 70%,#fff),color-mix(in srgb,var(--a5) 15%,transparent))}
[dir=rtl] .ag::before{background:linear-gradient(-90deg,color-mix(in srgb,var(--a5) 70%,#fff),color-mix(in srgb,var(--a5) 15%,transparent))}
.ag::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;top:-150px;inset-inline-start:-120px;background:radial-gradient(circle,color-mix(in srgb,var(--a5) 12%,transparent),transparent 70%);pointer-events:none}
.ag:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 12px 28px color-mix(in srgb,var(--a5) 10%,transparent)}
.ag.on{box-shadow:0 0 0 1.5px var(--a5),0 12px 28px color-mix(in srgb,var(--a5) 10%,transparent)}
.ag.dim{opacity:.6}
.ag > *{position:relative;z-index:1}
.ag .who{display:flex;align-items:center;gap:9px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13.5px;background:linear-gradient(140deg,var(--a5),var(--a7));box-shadow:0 0 0 3px #fff,0 4px 10px color-mix(in srgb,var(--a5) 22%,transparent)}
.av.s24{width:24px;height:24px;font-size:11px;box-shadow:0 0 0 2px #fff}
.av.s44{width:44px;height:44px;font-size:17px}
.av.none{background:linear-gradient(140deg,#98A2B3,#667085);box-shadow:0 0 0 2px #fff}
.ag .nm{font-size:14.5px;font-weight:800;color:var(--a9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .st{font-size:11.5px;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:5px}
.rng{display:grid;place-items:center;position:relative;margin:2px auto 0;width:84px;height:84px}
.rng svg{position:absolute;inset:0;transform:rotate(-90deg)}
[dir=rtl] .rng svg{transform:rotate(-90deg) scaleY(-1)}
.rng b{font-size:24px;font-weight:800;color:var(--a9);letter-spacing:-.03em;line-height:1}
.rng b.zero{color:var(--ink-4)}
.ag .rl{font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center;margin-top:-4px}
.ag .flag{min-height:22px;display:flex;justify-content:center}
.tag{display:inline-flex;align-self:center;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.flat{background:rgba(15,23,40,.05);color:var(--ink-2)}
.tag.good{background:var(--good-bg);color:var(--good)}
.ag .mo{margin-top:auto;border-top:1px solid color-mix(in srgb,var(--a5) 14%,transparent);padding-top:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:center}
.ag .mo b{color:var(--answer);font-weight:800}
.ag .mo small{display:block;font-size:11px;color:var(--ink-3);font-weight:600}

/* ── list ── */
.list{overflow:visible}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.fbw{position:relative}
.fb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 12px;border-radius:10px;background:#fff;border:1px solid rgba(15,23,40,.09);font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
[dir=rtl] .fb{padding:0 12px 0 10px}
.fb b{color:var(--ink);font-weight:700}
.fb .ic{width:14px;height:14px;color:var(--quiet)}
.fb:hover{border-color:rgba(15,23,40,.18)}
.fb.set{border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-tint)}
.fb.open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.fb .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.fb .x:hover{background:rgba(15,23,40,.07)}
.fb .x .ic{width:12px;height:12px}
.pop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:60;min-width:250px;background:#fff;border-radius:14px;border:1px solid var(--card-bd);box-shadow:var(--sh-float);padding:6px;animation:drop .14s ease-out}

const REMARKS=['الزبون لا يرد','يطلب التأجيل للسبت','العنوان غير واضح','الزبون ألغى الطلب','الهاتف مغلق','سيستلم من الفرع'];

function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function build(kind){
  if(kind==='empty')return {rows:[],agents:AGENTS.map(a=>({...a,treated:0,week:[0,0]})),saved:0,lost:0};
  const R=rng(kind==='busy'?42:7), pick=a=>a[Math.floor(R()*a.length)];
  const rows=[]; let n=0;
  const add=(o)=>{n++;const p=Math.floor(R()*PROD.length);rows.push({id:'p'+n,ref:'DRB'+(48100+n*7),cust:pick(CUST),city:pick(CITY),prod:p,qty:R()<.15?2:1,amt:pick(PRICES),carrier:R()<.62?0:1,
    phone:'09'+(1+Math.floor(R()*4))+' '+String(100+Math.floor(R()*899))+' '+String(1000+Math.floor(R()*8999)),courier:null,acted:false,actText:null,remark:null,late:false,dead:false,...o})};
  const ags=kind==='busy'?AGENTS:AGENTS.map(a=>({...a,treated:[3,2,4,2,3,5][AGENTS.indexOf(a)],week:[[2,0],[1,1],[3,0],[1,0],[2,1],[2,0]][AGENTS.indexOf(a)]}));
  const actNow=kind==='busy'
    ?{amira:[10,5],salma:[8,4],nour:[9,3],hiba:[6,0],rim:[7,0],yasmine:[6,0]}
    :{amira:[1,0],salma:[1,0],nour:[1,0],hiba:[0,0],rim:[1,0],yasmine:[1,0]};
  const lateSits=['no_answer','no_answer','cancel','address','due','proactive','delayed'];
  const okSits=['no_answer','address','due','proactive','out_of_coverage','delayed','cancel'];
  for(const a of ags){
    const [tot,late]=actNow[a.id];
    for(let i=0;i<tot;i++){
      const isLate=i<late, s=isLate?pick(lateSits):pick(okSits);
      const idle=a.id==='hiba';
      const acted=!isLate&&!idle&&R()<.7;
      add({agent:a.id,bucket:'act_now',sit:s,hours:isLate?5+Math.floor(R()*22):idle?1+Math.floor(R()*3):(acted?3+Math.floor(R()*20):1+Math.floor(R()*3)),late:isLate,acted,
        actText:acted?Math.floor(R()*5):null,actAt:acted?8+Math.floor(R()*6):null,remark:['no_answer','cancel','address','delayed'].includes(s)?pick(REMARKS):null,remarkH:1+Math.floor(R()*8)});
    }
  }
  const spread=(bucket,sits,count)=>{for(let i=0;i<count;i++){const s=pick(sits);add({agent:pick(ags).id,bucket,sit:s,hours:bucket==='waiting_carrier'?2+Math.floor(R()*70):bucket==='returning'?12+Math.floor(R()*200):4+Math.floor(R()*30),
    acted:bucket==='waiting_customer'&&R()<.35,actText:bucket==='waiting_customer'?3:null,actAt:9+Math.floor(R()*5),remark:bucket==='returning'?pick(REMARKS):null,remarkH:4+Math.floor(R()*60)})}};
  if(kind==='busy'){
    spread('returning',['returning','to_be_returned','to_be_returned'],34);
    for(let i=0;i<4;i++)add({agent:null,bucket:'returning',sit:'to_be_returned',hours:50+i*30,remark:pick(REMARKS),remarkH:40});
    spread('waiting_customer',['waiting_customer'],71);
    spread('waiting_carrier',['waiting_carrier','waiting_carrier','waiting_carrier','at_warehouse'],157);
    for(let i=0;i<68;i++)add({agent:pick(ags).id,bucket:'act_now',sit:'stalled',hours:(22+Math.floor(R()*90))*24,dead:true,remark:pick(REMARKS),remarkH:(30+Math.floor(R()*60))*24});
    for(let i=0;i<40;i++)add({agent:pick(ags).id,bucket:'done',sit:R()<.7?'delivered':'returned',hours:2+Math.floor(R()*30)});
  } else {
    spread('returning',['returning','to_be_returned'],6);
    spread('waiting_customer',['waiting_customer'],9);
    spread('waiting_carrier',['waiting_carrier','at_warehouse'],22);
    for(let i=0;i<12;i++)add({agent:pick(ags).id,bucket:'done',sit:R()<.7?'delivered':'returned',hours:2+Math.floor(R()*30)});
  }
  // couriers hold what is out with the carrier
  rows.forEach(r=>{if(['act_now','returning','waiting_customer'].includes(r.bucket)&&!r.dead&&R()<.85)r.courier=Math.floor(R()*COURIERS.length)});
  // a courier piles up unreachable customers (busy day)
  if(kind==='busy')rows.filter(r=>r.sit==='no_answer').slice(0,5).forEach(r=>{r.courier=1});
  return {rows,agents:ags,saved:kind==='busy'?23:15,lost:kind==='busy'?9:3};
}

const live=()=>D.rows.filter(r=>r.bucket!=='done'&&!r.dead);
function agentBoard(a){
  const mine=D.rows.filter(r=>r.agent===a.id);
  const act=mine.filter(r=>r.bucket==='act_now'&&!r.dead);
  const late=act.filter(r=>r.late);
  const remaining=act.filter(r=>!r.acted).length;
  const verdict=late.length?'late':(act.length&&a.treated===0)?'idle':'ok';
  return {...a,toTreat:act.length,late:late.length,oldest:late.reduce((m,r)=>Math.max(m,r.hours),0),remaining,ringTotal:a.treated+remaining,inFlight:mine.filter(r=>r.bucket!=='done').length,verdict};
}
const boards=()=>{const b=D.agents.map(agentBoard),o={late:0,idle:1,ok:2};return b.sort((x,y)=>o[x.verdict]-o[y.verdict]||x.name.localeCompare(y.name))};
function todoLines(){
  const out=[], L=live(), late=L.filter(r=>r.late);
  if(late.length){const by={};late.forEach(r=>by[r.agent]=(by[r.agent]||0)+1);out.push({k:'late',sev:'bad',n:late.length,by:Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`${AG(id).name} (${n})`).join(' · ')})}
  boards().filter(b=>b.verdict==='idle').forEach(b=>out.push({k:'idle',sev:'warn',a:b,n:b.inFlight}));
  const none=L.filter(r=>!r.agent).length; if(none)out.push({k:'none',sev:'warn',n:none});
  const byC={};L.filter(r=>r.sit==='no_answer'&&r.courier!==null).forEach(r=>byC[r.courier]=(byC[r.courier]||0)+1);
  Object.entries(byC).filter(([,n])=>n>=4).forEach(([c,n])=>out.push({k:'courier',sev:'warn',c:COURIERS[c],n}));
  const dead=D.rows.filter(r=>r.dead).length; if(dead)out.push({k:'stall',sev:'flat',n:dead});
  return out;
}

  else if(S.toast)bulk=`<div class="bulk" dir="${st.dir}"><span class="ok">${ic('check')}</span>${S.toast}<button data-undo="1">${t('undo')}</button></div>`;
  st.innerHTML=`<div class="page">${header()}${band()}${body}</div>${bulk}`;

const scrollList=()=>requestAnimationFrame(()=>document.getElementById('list')?.scrollIntoView({behavior:'smooth',block:'start'}));
const tog=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
let undoState=null;
function moveTo(ids,agentId){undoState=ids.map(id=>[id,D.rows.find(r=>r.id===id).agent]);ids.forEach(id=>{D.rows.find(r=>r.id===id).agent=agentId});S.toast=t('moved',ids.length,AG(agentId).name);S.sel.clear();S.modal=null;S.pickTo=null;S.peek=null;setTimeout(()=>{S.toast=null;render()},6000)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-clr],button,[data-peek],[data-close],[data-mclose]');
  if(!b){if(S.pop||S.todo){S.pop=null;S.todo=false;render()}return}
  const d=b.dataset;
  if(d.s){S[d.s]=d.v;if(d.s==='data'){D=build(S.data);S.f={...S.f,bucket:[],agent:[],sit:[],carrier:[],state:'live',page:1};S.sel.clear();S.peek=null}S.pop=null;S.todo=false;render();return}
  if(d.view){S.view=d.view;S.todo=false;render();return}
  if(d.todo){S.todo=!S.todo;S.pop=null;render();return}
  if(d.seelate){S.todo=false;S.view='colis';S.f={...S.f,state:'late',bucket:[],agent:[],page:1};render();scrollList();return}
  if(d.seestall){S.todo=false;S.view='colis';S.f={...S.f,state:'stalled',bucket:[],page:1};render();scrollList();return}
  if(d.assignnone){S.todo=false;S.modal={ids:live().filter(r=>!r.agent).map(r=>r.id),from:null};render();return}
  if(d.absent){S.todo=false;S.modal={ids:D.rows.filter(r=>r.agent===d.absent&&r.bucket!=='done').map(r=>r.id),from:d.absent};render();return}
  if(d.bk){S.f.bucket=tog(S.f.bucket,d.bk);S.f.state='live';S.f.page=1;render();scrollList();return}
  if(d.ag){S.f.agent=tog(S.f.agent,d.ag);S.f.page=1;render();scrollList();return}
  if(d.state){S.f.state=d.state;S.f.page=1;render();return}
  if(d.clr){e.stopPropagation();S.f[d.clr]=[];S.pop=null;S.f.page=1;render();return}
  if(d.pop){S.pop=S.pop===d.pop?null:d.pop;S.todo=false;render();return}
  if(d.opt){S.f[d.opt]=tog(S.f[d.opt],d.v);S.f.page=1;render();return}
  if(d.sortnext){const o=['prio','wait','amount'];S.f.sort=o[(o.indexOf(S.f.sort)+1)%3];render();return}
  if(d.clearall){S.f={...S.f,bucket:[],agent:[],sit:[],carrier:[],q:'',page:1};render();return}
  if(d.pg){S.f.page=+d.pg;render();scrollList();return}
  if(d.sel){e.stopPropagation();S.sel.has(d.sel)?S.sel.delete(d.sel):S.sel.add(d.sel);S.toast=null;render();return}
  if(d.bulkx){S.sel.clear();render();return}
  if(d.bulkre){S.modal={ids:[...S.sel],from:null};render();return}
  if(d.reassign1){S.modal={ids:[d.reassign1],from:D.rows.find(r=>r.id===d.reassign1).agent};render();return}
  if(d.pick){S.pickTo=d.pick;render();return}
  if(d.mgo&&S.pickTo){moveTo(S.modal.ids,S.pickTo);render();return}
  if(d.mclose!==undefined&&b.dataset.mclose){S.modal=null;S.pickTo=null;render();return}
  if(d.undo){(undoState||[]).forEach(([id,a])=>{D.rows.find(r=>r.id===id).agent=a});S.toast=null;render();return}
  if(d.close){S.peek=null;render();return}
  if(d.peek){S.peek=d.peek;S.pop=null;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;S.f.page=1;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}});

  if(e.key==='Escape'){if(S.modal){S.modal=null}else if(S.peek){S.peek=null}else{S.pop=null;S.todo=false;S.sel.clear()}render();return}
  if(e.target.closest('input'))return;
  const k=e.key.toLowerCase(), m={'1':['data','busy'],'2':['data','calm'],'3':['data','empty'],c:['view','colis'],v:['view','livreurs'],a:['band','sauves'],b:['band','afaire']};
  if(m[k]){S[m[k][0]]=m[k][1];if(m[k][0]==='data'){D=build(S.data);S.f={...S.f,bucket:[],agent:[],sit:[],carrier:[],state:'live',page:1};S.sel.clear();S.peek=null}render();return}
  if(k==='l'){S.lang=S.lang==='ar'?'fr':'ar';render()}
});
// one tooltip for the page: any element with data-tip
document.addEventListener('mousemove',e=>{const el=e.target.closest?.('[data-tip]'),tip=document.getElementById('tip');if(!el){tip.style.opacity=0;return}tip.textContent=el.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+18)+'px'});
render();
