<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrepôt Day Loop Agent v2</title>
<!--
  Prototype — Entrepôt « day loop », AGENT (téléphone). v2, 2026-10-02 — même structure que v1,
  traitement visuel affiné (voir plans/entrepot-day-loop-redesign.md §4bis).
  Presets : ?lang=ar|fr  ?screen=today|out|run|bound|free|wrongsite|returns|verdict|stock|product|count|settings
  Données réelles (prod 2026-10-02) ; photos produits = les vraies images de products.image_url, recadrées
  et embarquées en data: URI. Prénoms clients fictifs. Jetons Ordra (globals.css).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column; one card per question; the day drawn as a line through four jobs.
   Elegance by subtraction — hairlines inset, one filled accent per screen (Scan), photos instead of icons. */
:root{
  color-scheme:light;
  /* Ordra tokens (src/app/globals.css) */
  --bg:#F6F6F7; --card:#FFFFFF; --sunken:#F3F3F4; --track:#ECEDEF;
  --ink:#1A1A1A; --ink2:#6D7175; --ink3:#A3A8AE;
  --line:#ECEEF0; --line2:#E1E3E5; --line3:#C9CCCF;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  --action:#2C6ECB; --action-bg:#EEF4FC;
  --success:#008060; --success-bg:#F1F8F5;
  --warning:#B98900; --warning-bg:#FFF8E6; --warning-ink:#7A5B00;
  --critical:#D72C0D; --critical-bg:#FFF4F4;
  --viewfinder:#111315;
  --float:0 10px 30px rgba(16,24,40,.12);
  --photo-edge:rgba(26,26,26,.07);
  /* scale */
  --r-card:20px; --r-tile:14px; --r-ph:12px; --pill:9999px;
  --t-micro:11px; --t-meta:13px; --t-body:15px; --t-title:17px; --t-fig:22px; --t-screen:30px; --t-hero:60px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --studio:#E7E8EA; --studio-ink:#24272B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--studio);color:var(--ink);font:400 var(--t-body)/1.5 Inter,"Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;padding:0}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.02em}

/* ── studio (LTR, outside the product) ──────────────────────────────────── */
.studio{min-height:100vh;display:grid;grid-template-columns:1fr;justify-items:center}
.notes{display:none}
@media (min-width:960px){
  .studio{grid-template-columns:340px auto;justify-content:center;align-items:start;gap:56px;padding:36px 40px}
  .notes{display:block;position:sticky;top:32px;direction:ltr;color:var(--studio-ink);font-size:13px;max-width:340px}
  .notes h1{font-size:17px;font-weight:700;margin-bottom:2px}
  .notes .sub{color:#5B6067;margin-bottom:16px}
  .notes .row{display:flex;gap:6px;margin-bottom:12px}
  .notes .row button{padding:5px 10px;border:1px solid #C9CCCF;border-radius:7px;background:#F7F7F8;font-size:12.5px;font-weight:600}
  .notes .row button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .notes .pick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:16px}
  .notes .pick button{padding:7px 10px;border:1px solid #D5D7DA;border-radius:8px;background:#F7F7F8;font-size:12.5px}
  .notes .pick button[aria-current=true]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-hover);font-weight:600}
  .notes .why{background:#fff;border:1px solid #D5D7DA;border-radius:12px;padding:14px 16px}
  .notes .why h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6D7175;margin-bottom:6px}
  .notes .why p{margin-bottom:8px}
  .notes .why p:last-child{margin-bottom:0}
  .notes code{font-family:var(--mono);font-size:11.5px;background:#F2F2F3;padding:1px 4px;border-radius:4px}
  .phone{width:390px;height:844px;border:10px solid #141618;border-radius:50px;overflow:hidden;position:relative;background:var(--bg)}
}
@media (max-width:959px){.phone{width:100%;min-height:100vh;position:relative;background:var(--bg)}}

/* ── stage ──────────────────────────────────────────────────────────────── */
.phone[dir=rtl]{font-family:Cairo,"Noto Sans Arabic",system-ui,sans-serif}
.phone{text-align:start}
.screen{position:absolute;inset:0;overflow-y:auto;padding:22px 20px 128px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.full{padding-bottom:28px}
@media (max-width:959px){.screen{position:static;min-height:100vh}}
.screen>*{animation:rise .42s var(--ease) both}
.screen>*:nth-child(2){animation-delay:.03s}.screen>*:nth-child(3){animation-delay:.06s}.screen>*:nth-child(4){animation-delay:.09s}.screen>*:nth-child(5){animation-delay:.12s}.screen>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flip{display:inline-flex}
.phone[dir=rtl] .flip{transform:scaleX(-1)}

/* type */
.eyebrow{font-size:var(--t-meta);font-weight:500;color:var(--ink2)}
.screen-title{font-size:var(--t-screen);font-weight:700;letter-spacing:-.025em;line-height:1.15}
.phone[dir=rtl] .screen-title{letter-spacing:0}
.title{font-size:var(--t-title);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.meta{font-size:var(--t-meta);color:var(--ink2)}
.micro{font-size:var(--t-micro);font-weight:600;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
.phone[dir=rtl] .micro{letter-spacing:0;text-transform:none;font-size:12px}
.fig{font-size:var(--t-fig);font-weight:600;letter-spacing:-.02em;line-height:1}
.hero-fig{font-size:var(--t-hero);font-weight:600;letter-spacing:-.045em;line-height:.9}
.strong{color:var(--ink);font-weight:600}
.dim{color:var(--ink3)}

/* layout */
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gap-s{display:flex;flex-direction:column;gap:6px}
.section{margin-top:28px}
.section>.micro{display:block;margin:0 4px 10px}
.card{background:var(--card);border-radius:var(--r-card);border:1px solid var(--line)}
.card.flat{border-color:transparent}

/* header */
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:22px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);flex:none}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--track);color:var(--ink2);font-weight:600;flex:none}
.status{display:flex;align-items:center;gap:8px;margin-top:10px;white-space:nowrap;font-size:var(--t-meta);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.dot.warn{background:var(--warning)} .dot.ok{background:var(--success)} .dot.bad{background:var(--critical)}
.link{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.status .link{margin-inline-start:auto;padding:6px 12px;border-radius:var(--pill);background:var(--card);border:1px solid var(--line2);font-size:var(--t-meta)}

/* product photo + sticker roll */
.ph{width:44px;height:44px;border-radius:var(--r-ph);object-fit:cover;flex:none;display:block;box-shadow:0 0 0 1px var(--photo-edge);background:var(--sunken)}
.ph.lg{width:72px;height:72px;border-radius:16px}
.ph.xl{width:96px;height:96px;border-radius:20px}
.roll{flex:none;display:block}

/* ── Aujourd'hui: the day line ───────────────────────────────────────────── */
.day{padding:6px 0}
.step{display:grid;grid-template-columns:44px 1fr;width:100%;text-align:start;position:relative}
.step .rail{position:relative;display:flex;justify-content:center}
.step .rail::before{content:"";position:absolute;top:0;bottom:0;width:1.5px;background:var(--line2);inset-inline-start:calc(50% - .75px)}
.step:first-child .rail::before{top:30px}
.step.lead .rail::before{bottom:0}
.step:last-child .rail::before{bottom:calc(100% - 30px)}
.node{position:relative;z-index:1;margin-top:24px;width:13px;height:13px;border-radius:50%;background:var(--card);border:1.5px solid var(--line3)}
.node.on{background:var(--ink);border-color:var(--ink);box-shadow:0 0 0 5px var(--card),0 0 0 6.5px var(--line2)}
.node.has{background:var(--ink);border-color:var(--ink)}
.node.warn{background:var(--warning);border-color:var(--warning)}
.step .body{padding:18px 18px 18px 0;min-width:0}
.phone[dir=rtl] .step .body{padding:18px 0 18px 18px}
.step+.step .body{border-top:1px solid var(--line)}
.step .label{font-size:var(--t-meta);font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.step .label .n{color:var(--ink3);font-weight:500}
.lead .hero{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.track{height:4px;border-radius:var(--pill);background:var(--track);position:relative;margin-top:18px}
.track>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:inherit;background:var(--brand);animation:grow .9s var(--ease) both .15s}
.track>b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink3)}
@keyframes grow{from{width:0}}
.next{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:var(--r-tile);background:var(--sunken);width:100%}
.next:hover{background:var(--track)}
.mini{display:flex;align-items:center;gap:14px}
.mini .fig{margin-inline-start:auto}
.quiet{color:var(--ink3)}
.warn-text{color:var(--warning-ink)}
.chev{color:var(--ink3);display:inline-flex}

/* stock strip */
.strip{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%}
.stack{display:flex}
.stack img{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--card);background:var(--sunken)}
.stack img+img{margin-inline-start:-9px}

/* soft tabs */
.tabs{display:flex;gap:2px;background:var(--track);border-radius:14px;padding:3px;margin-bottom:20px}
.tabs button{flex:1;padding:9px 10px;border-radius:11px;font-size:var(--t-meta);font-weight:600;color:var(--ink2);text-align:center;transition:background .16s,color .16s}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.tabs .c{color:var(--ink3);margin-inline-start:6px;font-weight:500}

/* lists with inset dividers */
.list>*{position:relative}
.list>*+*::before{content:"";position:absolute;top:0;inset-inline-start:72px;inset-inline-end:18px;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;width:100%;min-height:72px;text-align:start}
.item.tight{min-height:64px;padding-block:12px}
.item .t{font-weight:600;font-size:var(--t-body)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.rollhead{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;min-height:72px}
.rollhead .go{font-size:var(--t-meta);font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--pill);background:var(--ink);color:#fff}
.nested{background:var(--sunken);margin:0 10px 10px;border-radius:16px}
.nested .item{min-height:64px;padding-inline:14px}
.nested.list>*+*::before{inset-inline-start:68px;inset-inline-end:14px}
.age{font-size:var(--t-meta);color:var(--ink3);white-space:nowrap}
.age.late{color:var(--warning-ink);font-weight:600}
.more{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;font-size:var(--t-meta);font-weight:600;color:var(--ink2);width:100%}

/* ── scan run ───────────────────────────────────────────────────────────── */
.rollbar{position:absolute;top:0;left:0;right:0;height:6px;z-index:2}
.runhead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.plate{font-family:var(--mono);font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line2);color:var(--ink2)}
.dots{display:flex;gap:4px}
.dots i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.dots i.d{background:var(--ink)}
.dots i.c{background:var(--ink3)}
.hand{padding:20px}
.hand .name{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.qty{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:var(--t-meta);color:var(--ink2)}
.viewfinder{margin-top:16px;height:220px;border-radius:24px;background:var(--viewfinder);position:relative;overflow:hidden;display:grid;place-items:center;color:#9AA0A6;width:100%}
.viewfinder .c{position:absolute;width:30px;height:30px;border:3px solid var(--rc,#fff);opacity:.95}
.viewfinder .c1{top:26px;left:26px;border-right:0;border-bottom:0;border-top-left-radius:12px}
.viewfinder .c2{top:26px;right:26px;border-left:0;border-bottom:0;border-top-right-radius:12px}
.viewfinder .c3{bottom:26px;left:26px;border-right:0;border-top:0;border-bottom-left-radius:12px}
.viewfinder .c4{bottom:26px;right:26px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.viewfinder .laser{position:absolute;left:48px;right:48px;height:1.5px;background:var(--rc,#fff);opacity:.8;animation:laser 2.2s ease-in-out infinite alternate}
@keyframes laser{from{top:52px}to{top:166px}}
.typed{display:flex;gap:8px;margin-top:12px}
.typed input{flex:1;min-width:0;height:50px;border:1px solid var(--line2);border-radius:var(--r-tile);padding:0 16px;background:var(--card);font-family:var(--mono);font-size:16px}
.typed input::placeholder{font-family:Inter,Cairo,sans-serif;color:var(--ink3);font-size:var(--t-meta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:var(--r-tile);font-weight:600;font-size:var(--t-body);white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line2)}
.btn.soft{background:var(--sunken)}
.btn.ghost{color:var(--ink2)}
.btn.block{width:100%}
.btn.xl{min-height:58px;border-radius:18px}

/* outcome */
.outcome{position:relative;overflow:hidden;padding:28px 20px 24px;text-align:center}
.outcome .sweep{position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--success-bg);transform:translateX(-110%);animation:sweep .8s var(--ease) .05s forwards}
@keyframes sweep{to{transform:translateX(260%)}}
.outcome>*:not(.sweep){position:relative}
.seal{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;color:#fff;animation:pop .36s cubic-bezier(.3,1.5,.5,1)}
.seal.ok{background:var(--success)} .seal.bad{background:var(--critical)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.outcome.bad{animation:shake .32s ease-in-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.code{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:.08em;margin:8px 0 4px}
.delta-line{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:7px 14px;border-radius:var(--pill);background:var(--sunken);font-size:var(--t-meta);color:var(--ink2)}
.delta-line b{color:var(--ink);font-weight:600}
.ring-timer{width:24px;height:24px;flex:none}
.ring-timer circle{fill:none;stroke-width:2.5}
.ring-timer .t{stroke:var(--line2)} .ring-timer .p{stroke:var(--ink);stroke-dasharray:63;stroke-dashoffset:63;animation:tick 1.4s linear forwards;transform:rotate(-90deg);transform-origin:center}
@keyframes tick{to{stroke-dashoffset:0}}

/* choice */
.opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;width:100%;background:var(--card);border:1.5px solid var(--line)}
.opt+.opt{margin-top:8px}
.opt[aria-checked=true]{border-color:var(--ink)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line3);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .radio{border-color:var(--ink);background:var(--ink)}
.opt[aria-checked=true] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* verdict */
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border-radius:20px;font-weight:600;font-size:var(--t-title);text-align:center;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile small{font-size:var(--t-meta);font-weight:500;opacity:.85}
.tile.ok{background:var(--brand);color:#fff}
.tile.bad{background:var(--card);color:var(--critical);border:1.5px solid #F2C4BA}
.tile.bad[aria-pressed=true]{background:var(--critical-bg);border-color:var(--critical)}
.causes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.causes button{padding:10px 16px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--card);font-weight:500;font-size:var(--t-meta)}
.causes button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.field{width:100%;height:48px;margin-top:10px;border:1px solid var(--line2);border-radius:var(--r-tile);padding:0 14px;background:var(--card)}

/* stock */
.truth{display:flex;gap:14px;align-items:flex-start;padding:18px}
.spark{width:52px;height:24px;flex:none}
.spark path{fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--ink)}
.free{text-align:end}
.free .fig{font-size:20px}
.low{color:var(--critical);font-weight:600}
.bar{display:flex;gap:3px;height:10px;margin:20px 0 12px}
.bar i{display:block;height:100%;border-radius:3px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:var(--t-meta);color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--k)}
.legend b{color:var(--ink);font-weight:600}
.mv{display:flex;align-items:center;gap:14px;padding:13px 18px}
.mv .d{font-weight:600;min-width:40px;text-align:end}
.daytag{padding:14px 18px 4px;font-size:12px;font-weight:600;color:var(--ink3)}

/* count */
.counter{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px}
.counter button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:500;color:var(--ink)}
.counter input{width:150px;border:0;border-bottom:2px solid var(--ink);background:transparent;text-align:center;font-size:56px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;padding:0 0 4px;outline:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--pill);font-size:var(--t-meta);font-weight:600}
.pill.ok{background:var(--success-bg);color:var(--success)}
.pill.bad{background:var(--critical-bg);color:var(--critical)}
.pill.info{background:var(--action-bg);color:var(--action)}
.pill.warn{background:var(--warning-bg);color:var(--warning-ink)}

/* settings */
.set{display:flex;align-items:center;gap:12px;padding:16px 18px;min-height:58px}
.toggle{width:46px;height:28px;border-radius:var(--pill);background:var(--brand);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* ── tab bar ─────────────────────────────────────────────────────────────── */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:10px;z-index:5}
@media (max-width:959px){.tabbar{position:fixed;height:calc(86px + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:var(--t-micro);font-weight:500;color:var(--ink3);position:relative}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page] svg{stroke-width:2.2}
.tab .badge{position:absolute;top:-3px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--critical);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--card)}
.scanbtn{justify-self:center;margin-top:-30px;width:62px;height:62px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--bg),var(--float);transition:transform .12s}
.scanbtn:active{transform:scale(.94)}
.scanlbl{display:block;text-align:center;font-size:var(--t-micro);font-weight:600;color:var(--brand-hover);margin-top:7px}
.hide-bar .tabbar{display:none}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(17,19,21,.42);z-index:8;display:none;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 28px;z-index:9;display:none;max-height:92%;overflow:auto;animation:up .32s var(--ease)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
@keyframes up{from{transform:translateY(40%)}}
.open .scrim,.open .sheet{display:block}
.sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sim button{padding:7px 12px;border-radius:var(--pill);border:1px dashed var(--line3);font-size:12px;font-weight:600;color:var(--ink2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function spark(seed){
  const pts = Array.from({length:14},(_,i)=>[2+i*3.6, 12 - (Math.sin(i*.9+seed)*3.6 + Math.cos(i*.37+seed*2)*2.6)*.9 + (i/14)*3]);
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 52 24"><path d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" L")}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2"/></svg>`;
}

      <div class="rollhead">${roll(r,30)}<div class="grow"><div style="font-weight:600">${t("roll")} ${z[lang]}</div><div class="meta ell">${L(z.zar,z.zfr)}</div></div>
        <span class="fig num" style="font-size:20px">${list.length}</span><button class="go" data-go="run">${t("start")}</button></div>
      ${gi === 0 ? `<div class="nested list">${list.slice(0,3).map(parcelRow).join("")}<button class="more">${t("moreN").replace("{n}", list.length-3)} ${ic("down",15)}</button></div>` : ""}
    </div>`;}).join("")}
  </div>
  <div class="section"><button class="card strip"><span class="avatar" style="width:36px;height:36px">${ic("clock",17)}</span><div class="grow"><div style="font-weight:600">${t("older")} · <span class="num">11</span></div><div class="meta">${t("olderHint")}</div></div><span class="chev">${ic("down",16)}</span></button></div>`;

const runHead = (r, extra="") => { const z = ZONES[r]; return `
  <span class="rollbar" style="background:${z.hex}"></span>
  <div class="runhead">${roll(r,44)}<div class="grow"><div class="title">${t("roll")} ${z[lang]}</div><div class="meta">${L(z.zar,z.zfr)}</div></div><span class="plate">${z.code}</span>
    <button class="icon-btn" data-go="out" aria-label="close">${ic("x",18)}</button></div>${extra}`; };

R.run = () => `
  ${runHead("green", `<div class="row meta" style="margin-bottom:8px"><span class="grow">${t("inHand")}</span><span class="num"><span class="strong">3</span> / 8</span></div><div class="dots" style="margin-bottom:18px">${Array.from({length:8},(_,i)=>`<i class="${i<2?"d":i===2?"c":""}"></i>`).join("")}</div>`)}
  <div class="card hand"><div class="row" style="align-items:center;gap:16px">${ph("qr","lg")}
    <div class="grow"><div class="name">${pn("qr")}</div><div class="meta" style="margin-top:4px">${L("درنة · مريم","Derna · Meryem")}</div></div><span class="qty num">×1</span></div></div>
  <div class="hint">${roll("green",18)}<span>${t("stickHint").replace("{c}", ZONES.green[lang])}</span></div>
  <button class="viewfinder" style="--rc:${ZONES.green.hex}" data-go="bound"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><span class="laser"></span>
    <span class="meta" style="display:flex;align-items:center;gap:8px;color:#9AA0A6">${ic("cam",18)} ${t("tapCam")}</span></button>
  <div class="typed"><input inputmode="numeric" placeholder="${t("typeNum")}" aria-label="${t("typeNum")}"><button class="btn sec" data-go="bound">${t("bind")}</button></div>
  <button class="btn ghost block" style="margin-top:4px">${t("skip")}</button>`;

R.bound = () => `
  ${runHead("green")}
  <div class="card outcome"><span class="sweep"></span>
    <div class="seal ok">${ic("check",28,2.6)}</div>
    <div class="title">${t("bound")}</div>
    <div class="code">1213127</div>
    <div class="meta">${pn("qr")} · ${L("درنة","Derna")}</div>
    <div class="delta-line">${t("stockFx")} <b class="num">943 → 942</b></div>
  </div>
  <div class="section"><span class="micro">${t("next")}</span>
    <div class="card item">${ph("qr")}<div class="grow"><div class="t">${pn("qr")} <span class="num dim" style="font-weight:500">×1</span></div><div class="meta">${L("طبرق · فاطمة","Tobrouk · Fatma")}</div></div>
      <svg class="ring-timer" viewBox="0 0 24 24"><circle class="t" cx="12" cy="12" r="10"/><circle class="p" cx="12" cy="12" r="10"/></svg></div>
    <div class="meta" style="text-align:center;margin-top:10px">${t("autoNext")}</div></div>
  <div class="row" style="margin-top:22px"><button class="btn sec grow" data-go="out">${t("close")}</button><button class="btn ink grow" data-go="run">${t("nextBtn")}</button></div>`;

R.free = () => { const list = Q.filter(q => q[0]==="green").slice(2,5); return `
  ${head(t("freeT"),{back:"out",eyebrow:t("scan")})}
  <div class="card item" style="min-height:76px"><span class="avatar">${ic("scan",18)}</span><div class="grow"><div class="code" style="font-size:24px;margin:0">1213140</div><div class="meta">${t("freeSub")}</div></div></div>
  <div class="section"><h2 class="title">${t("freeQ")}</h2><div class="meta" style="margin:2px 0 14px;display:flex;align-items:center;gap:8px">${roll("green",16)} ${t("freeHint")}</div>
  ${list.map((q,i)=>`<button class="opt" role="radio" aria-checked="${i===chosen}" data-choose="${i}"><span class="radio"></span>${ph(q[5])}
    <div class="grow"><div style="font-weight:600">${pn(q[5])} <span class="num dim" style="font-weight:500">×${q[6]}</span></div><div class="meta">${L(q[1],q[2])} · ${L(q[3],q[4])} · ${age(q[7])}</div></div></button>`).join("")}
  <button class="btn ghost block" style="margin-top:6px">${t("seeAll")}</button>
  <button class="btn pri block xl" style="margin-top:8px" data-go="bound">${t("confirmBind")}</button></div>`; };

R.wrongsite = () => `
  ${head(t("scan"),{back:"out",eyebrow:t("out")})}
  <div class="card outcome bad"><div class="seal bad">${ic("x",28,2.6)}</div>
    <div class="title">${t("wrongT")}</div><p class="meta" style="margin-top:6px">${t("wrongB")}</p>
    <div class="code" style="font-size:22px;margin-top:14px">SH1844962</div>
    <div class="row" style="justify-content:center;margin-top:10px">${ph("qr")}<span class="meta">${pn("qr")} · ${L("سبها","Sebha")}</span></div></div>
  <button class="btn sec block xl" style="margin-top:16px" data-go="out">${t("ok")}</button>`;

R.returns = () => `
  ${head(t("retTitle"))}
  <p class="meta" style="margin:-12px 0 22px">${t("retRule")}</p>
  <span class="micro" style="display:block;margin:0 4px 10px">${t("retAtDarb")} · <span class="num">2</span></span>
  <div class="card list" style="overflow:hidden">
    ${[["qr","طبرق","Tobrouk","سعاد","Souad","refused",4],["bs","الزاوية","Zawiya","منير","Mounir","unreachable",1]].map(r=>`
    <button class="item" data-go="verdict">${ph(r[0])}<div class="grow"><div class="t ell">${pn(r[0])}</div><div class="meta">${L(r[1],r[2])} · ${L(r[3],r[4])} · ${t(r[5])}</div></div><span class="age ${r[6]>2?"late":""}">${age(r[6]*24)}</span></button>`).join("")}
  </div>
  <div class="section"><span class="micro">${t("retOnWay")} · <span class="num">3</span> — ${t("retOnWayS")}</span>
  <div class="card list" style="overflow:hidden">
    ${[["qr","سرت","Syrte"],["qr","مصراتة","Misrata"],["da","بنغازي","Benghazi"]].map(r=>`
    <div class="item tight" style="opacity:.55">${ph(r[0])}<div class="grow"><div class="t ell">${pn(r[0])}</div><div class="meta">${L(r[1],r[2])} · ${t("scanOnArrival")}</div></div></div>`).join("")}
  </div></div>`;

R.verdict = () => `
  ${head(t("retTitle"),{back:"returns",eyebrow:`<span class="mono">SH1851028</span>`})}
  <div class="card hand"><div class="row" style="gap:16px">${ph("qr","lg")}<div class="grow"><div class="name">${pn("qr")}</div><div class="meta" style="margin-top:4px">${L("طبرق · سعاد","Tobrouk · Souad")}</div></div><span class="qty num">×1</span></div>
    <div class="row meta" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><span class="grow">${t("darbReason")}</span><span class="strong">${t("refused")}</span></div></div>
  <div class="verdict">
    <button class="tile ok" data-go="returns">${ic("check",26,2.2)}<span>${t("intact")}</span><small>${t("intactS")}</small></button>
    <button class="tile bad" data-toggle aria-pressed="${damagedOpen}">${ic("alert",26,2)}<span>${t("damaged")}</span><small>${t("damagedS")}</small></button>
  </div>
  ${damagedOpen ? `<div class="card" style="padding:18px;margin-top:12px;animation:rise .3s var(--ease)">
    <div style="font-weight:600">${t("cause")}</div>
    <div class="causes">${["c1","c2","c3","c4","c5"].map(c=>`<button data-cause="${c}" aria-pressed="${cause===c}">${t(c)}</button>`).join("")}</div>
    ${cause==="c5" ? `<input class="field" placeholder="${t("notePh")}">` : ""}
    <button class="btn block" style="margin-top:14px;background:var(--critical);color:#fff;opacity:${cause?1:.35}" data-go="returns">${t("record")}</button></div>` : ""}`;

R.stock = () => `
  ${head(t("stockTitle"))}
  <div class="card truth"><span class="dot warn" style="margin-top:8px"></span><div class="grow"><div style="font-weight:600">${t("truthT")}</div><div class="meta" style="margin-top:2px">${t("truthB")}</div>
    <button class="btn ink" style="min-height:42px;margin-top:14px;font-size:14px" data-go="count">${ic("tally",16)} ${t("truthBtn")}</button></div></div>
  <div class="section"><div class="card list" style="overflow:hidden">
  ${Object.entries(P).map(([k,p],i) => { const free = p.stock - p.engaged; return `
    <button class="item" data-go="product">${ph(k)}
      <div class="grow"><div class="t clamp">${p[lang]}</div><div class="meta">${t("onShelf")} <span class="num">${p.stock}</span>${free <= p.thr ? ` · <span class="low">${t("low")}</span>` : ""}</div></div>
      ${spark(i+1)}
      <div class="free"><div class="fig num">${free}</div><div class="meta" style="font-size:12px">${t("free")}</div></div></button>`; }).join("")}
  </div></div>`;

R.product = () => { const p = P.qr, free = p.stock - p.engaged; return `
  <header class="head"><button class="icon-btn" data-go="stock" aria-label="back"><span class="flip">${ic("arrowl",18)}</span></button><span class="grow"></span><span class="pill warn"><span class="dot warn"></span>${t("neverCounted")}</span></header>
  <div class="row" style="gap:16px;align-items:center">${ph("qr","xl")}<div class="grow"><div class="mono meta">${p.sku}</div><h1 class="title" style="font-size:22px;margin-top:2px">${p[lang]}</h1></div></div>
  <div class="card" style="padding:20px;margin-top:20px">
    <div class="micro">${t("free")}</div>
    <div class="hero-fig num" style="margin-top:10px">${free}</div>
    <div class="bar"><i style="flex:${p.engaged};background:var(--ink)"></i><i style="flex:${free};background:var(--brand)"></i></div>
    <div class="legend"><span style="--k:var(--ink)">${t("engaged")} <b class="num">${p.engaged}</b></span><span style="--k:var(--brand)">${t("free")} <b class="num">${free}</b></span><span style="--k:var(--line3)">${t("onShelf")} <b class="num">${p.stock}</b></span></div>
  </div>
  <div class="section"><span class="micro">${t("prodSites")}</span><div class="card item meta" style="min-height:60px">${ic("inbox",18)}<span class="grow">${t("siteNone")}</span></div></div>
  <div class="section"><span class="micro">${t("moves")}</span><div class="card" style="overflow:hidden">
    <div class="daytag">${t("sep29")}</div>
    <div class="mv"><div class="grow"><div style="font-weight:500">${t("mvScan")}</div><div class="meta num">14:42 · adel</div></div><span class="d num">−1</span><span class="meta num" style="min-width:34px;text-align:end">943</span></div>
    <div class="daytag" style="border-top:1px solid var(--line);margin-top:4px">${t("sep28")}</div>
    ${[["15:42","944"],["15:42","945"],["15:41","946"],["15:40","947"]].map(m=>`<div class="mv"><div class="grow"><div style="font-weight:500">${t("mvScan")}</div><div class="meta num">${m[0]} · adel</div></div><span class="d num">−1</span><span class="meta num" style="min-width:34px;text-align:end">${m[1]}</span></div>`).join("")}
  </div><button class="btn ghost block">${t("allMoves")}</button></div>
  <button class="btn sec block xl" style="margin-top:4px" data-go="count">${ic("tally",18)} ${t("countThis")}</button>`; };

const deltaPill = d => d === 0 ? `<span class="pill ok">${ic("check",14,2.4)} ${t("same")}</span>` : `<span class="pill ${d < 0 ? "bad" : "info"}">${t("diff")} <span class="num">${sign(d)}</span></span>`;
R.count = () => { const p = P.th, d = countVal - p.stock; return `
  <header class="head" style="align-items:center"><button class="icon-btn" data-go="stock" aria-label="close">${ic("x",18)}</button><div class="grow"><div class="eyebrow">${t("countTitle")} · ${t("site")}</div></div><span class="num meta"><span class="strong">2</span> / 7</span></header>
  <div class="dots" style="margin:-6px 0 26px">${Array.from({length:7},(_,i)=>`<i class="${i<1?"d":i===1?"c":""}"></i>`).join("")}</div>
  <div style="display:flex;justify-content:center">${ph("th","xl")}</div>
  <div style="text-align:center;margin-top:14px"><div class="title" style="font-size:20px">${p[lang]}</div><div class="meta" style="margin-top:2px">${t("book")} <span class="num strong">${p.stock}</span></div></div>
  <div class="meta" style="text-align:center;margin-top:28px">${t("countQ")}</div>
  <div class="counter"><button data-step="-1" aria-label="-1">−</button><input id="countIn" inputmode="numeric" value="${countVal}" aria-label="${t("countQ")}"><button data-step="1" aria-label="+1">+</button></div>
  <div id="delta" style="text-align:center;margin-top:18px;min-height:30px">${deltaPill(d)}</div>
  <div class="meta" style="text-align:center;margin-top:6px;font-size:12px">${t("countReason")}</div>
  <div class="row" style="margin-top:26px"><button class="btn sec grow">${t("skipC")}</button><button class="btn ink grow" style="flex:2">${t("nextC")}</button></div>`; };

R.settings = () => `
  ${head(t("setTitle"),{back:"today",eyebrow:t("role")})}
  <div class="card item"><span class="avatar" style="width:48px;height:48px;font-size:18px">${L("ع","A")}</span><div class="grow"><div style="font-weight:600">adel</div><div class="meta">${t("site")}</div></div></div>
  <div class="section"><span class="micro">${t("myDay")}</span><div class="card" style="display:grid;grid-template-columns:1fr 1fr;padding:18px">
    <div><div class="fig num" style="font-size:28px">14</div><div class="meta">${t("scannedToday")}</div></div><div><div class="fig num" style="font-size:28px">0</div><div class="meta">${t("handled")}</div></div></div></div>
  <div class="section"><div class="card list">${["sound","vib","cam"].map(k=>`<div class="set"><span class="grow" style="font-weight:500">${t(k)}</span><span class="toggle"></span></div>`).join("")}</div></div>
  <button class="btn sec block" style="margin-top:20px;color:var(--critical)">${t("signOut")}</button>`;

function sheet(){
  return `<div class="grab"></div>
  <div class="row" style="margin-bottom:16px;align-items:flex-start"><div class="grow"><div class="title">${t("lookT")}</div><div class="meta">${t("lookB")}</div></div><button class="icon-btn" data-close aria-label="close">${ic("x",18)}</button></div>
  <div class="viewfinder" style="--rc:#fff;margin-top:0;height:200px"><span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><span class="laser"></span>${ic("cam",20)}</div>
  <div class="typed"><input inputmode="numeric" placeholder="${t("typeNum")}"><button class="btn sec">${t("scan")}</button></div>
  <div class="sim"><span class="meta" style="align-self:center">${t("simulate")}</span>
    <button data-go="free" data-close>${t("s1")}</button><button data-go="verdict" data-close>${t("s2")}</button><button data-already>${t("s3")}</button><button data-go="wrongsite" data-close>${t("s4")}</button></div>
  <div id="already"></div>`;
}

const phone = document.getElementById("phone");
function render(){
  phone.dir = lang === "ar" ? "rtl" : "ltr"; phone.lang = lang;
  document.getElementById("screens").innerHTML = `<section class="screen ${FULL.includes(screen) ? "full" : ""}">${R[screen]()}</section>`;
  phone.classList.toggle("hide-bar", FULL.includes(screen));
  const cur = TAB_OF[screen];
  const tab = (k, icon, badge) => `<button class="tab" data-go="${k}" ${cur===k ? 'aria-current="page"' : ""}>${ic(icon,22)}<span>${t(k)}</span>${badge ? `<span class="badge num">${badge}</span>` : ""}</button>`;
  document.getElementById("tabbar").innerHTML = tab("today","home") + tab("out","out") +
    `<div><button class="scanbtn" data-sheet aria-label="${t("scan")}">${ic("scan",26,2.1)}</button><span class="scanlbl">${t("scan")}</span></div>` + tab("returns","back",2) + tab("stock","boxes");
  document.getElementById("sheet").innerHTML = sheet();
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("pick").innerHTML = SCREENS.map(s => `<button data-go="${s}" ${s===screen ? 'aria-current="true"' : ""}>${s}</button>`).join("");
  document.getElementById("why").innerHTML = WHY[screen];
  try { const u = new URL(location); u.searchParams.set("lang", lang); u.searchParams.set("screen", screen); history.replaceState(null, "", u); } catch (e) {}
}
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-go]"); if (!el) return;
  if (el.dataset.lang){ lang = el.dataset.lang; render(); return; }
  if (el.hasAttribute("data-sheet")){ phone.classList.add("open"); return; }
  if (el.hasAttribute("data-already")){ document.getElementById("already").innerHTML = `<div class="card" style="margin-top:14px;padding:16px"><div class="row">${ph("qr")}<div class="grow"><div style="font-weight:600">${pn("qr")} · ${L("بنغازي","Benghazi")}</div><div class="meta">${t("outAlready")} · ${t("notTaken")}</div></div></div><button class="btn sec block" style="margin-top:14px;color:var(--critical)">${t("unscan")}</button></div>`; return; }
  if (el.hasAttribute("data-close")) phone.classList.remove("open");
  if (el.hasAttribute("data-toggle")){ damagedOpen = !damagedOpen; render(); return; }
  if (el.dataset.cause){ cause = el.dataset.cause; render(); return; }
  if (el.dataset.choose){ chosen = +el.dataset.choose; render(); return; }
  if (el.dataset.step){ countVal = Math.max(0, countVal + +el.dataset.step); render(); return; }
  if (el.dataset.go){ screen = el.dataset.go; damagedOpen = false; cause = null; render(); document.querySelector(".screen")?.scrollTo(0,0); }
});
document.getElementById("scrim").addEventListener("click", () => phone.classList.remove("open"));
document.addEventListener("input", e => { if (e.target.id === "countIn"){ countVal = parseInt(e.target.value || "0", 10) || 0; document.getElementById("delta").innerHTML = deltaPill(countVal - P.th.stock); } });
render();
})();
</script>
</body>
</html>
