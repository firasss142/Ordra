<!doctype html>
<!--
  Performance › Commandes — prototype v4 (2026-10-04) : filtres produits + agents qui suivent toute la page, un seul bouton de dates
  (raccourcis + mois entiers + calendrier), l'argent (livré, perdu en retours — propriétaire seulement), « Délais » retiré.
  Réponses du propriétaire (4 oct.) : une section « Performance » (Commandes · Équipe · Livraison) ;
  « performance des commandes » = OÙ les commandes se perdent ; usage = check du matin, enquête quand ça baisse,
  revue hebdo/mensuelle ; lecteurs = propriétaire + managers (sans argent) ; Accueil = résumé + portes ;
  on descend jusqu'aux commandes ; base = commandes REÇUES dans la période, suivies jusqu'à aujourd'hui.
  Style : principes de Performance équipe v3 (« Aurore ») + 3 habillages proposés à côté (Éditorial, Prisme, Boréale).

  DONNÉES FICTIVES générées dans la page (graine fixe) — à la demande du propriétaire, pour aller vite.
  Prénoms d'agents et villes inventés ou génériques ; aucune donnée client.
  URL : ?period=7d|30d|90d|month|m:2026-09|custom &from=&to= &p=0,4.1 &ag=1,2 &cmp=p:…|a:…|d:from|to &role=manager
-->
<html lang="fr" data-look="aurore">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Performance des commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fd:var(--f);
  --brand:#15803D;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-4:#5A616B; --sb-hov:rgba(255,255,255,.07);
  /* agents (identity colours — v3 ramps, fictional names) */
  --amina-5:#444CE7; --amina-7:#3538CD; --sara-5:#DD2590; --sara-7:#C11574; --leila-5:#088AB2; --leila-7:#0E7090;
  --nour-5:#CA8504; --nour-7:#A15C07; --yasmine-5:#4CA30D; --yasmine-7:#3B7C0F;
  /* outcomes — fixed (validated in v2/v3) */
  --o-del:#079455; --o-ret:#F79009; --o-rej:#E8385A; --o-junk:#7A5AF8; --o-pend:#D5D9E0; --o-road:#38C0AE;
  --flow-a:#7C8CF8; --flow-b:#34C38F;
  /* Aurore surfaces */
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:24px; --r-in:16px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 20px 52px rgba(42,52,110,.14);
  --glass-in:rgba(255,255,255,.62); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#8A94A6; --ink-4:#C9CED7; --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --bad:#C01048; --bad-bg:#FFE4E8; --flat:#475467; --flat-bg:rgba(15,23,40,.05);
  --tip-bg:#101828; --tip-ink:#fff; --accent:#3538CD; --seg-bg:rgba(255,255,255,.55); --seg-on:#fff; --seg-on-ink:var(--ink);
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}

/* prototype bar */
.pbar{position:sticky;top:0;z-index:300;background:#16191E;color:#E6E8EB;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #000;font-family:"Plus Jakarta Sans",sans-serif}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px}
.looks button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2;display:inline-flex;align-items:center;gap:6px}
.looks button i{font-style:normal;font-size:10.5px;color:#5A616B;font-weight:800}
.looks button.on{background:#fff;color:#0E1013}
.looks button.on i{color:#8A94A6}
.pbar label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B5BAC2;cursor:pointer}

/* app shell + new sidebar */
.stage{display:flex;min-height:calc(100vh - 45px)}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:45px;height:calc(100vh - 45px);font-family:"Plus Jakarta Sans",sans-serif}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.flag{width:26px;height:18px;border-radius:4px;overflow:hidden;display:grid;grid-template-rows:1fr 2fr 1fr;box-shadow:0 0 0 1px rgba(255,255,255,.14);position:relative}
.flag i:nth-child(1){background:#E70013}.flag i:nth-child(2){background:#000}.flag i:nth-child(3){background:#239E46}
.flag b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:9px}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start;position:relative}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .sb-badge,.sb-item .chg{flex:none}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.sb-badge.wn{background:rgba(247,144,9,.18);color:#FDB022}.sb-badge.s{background:rgba(18,183,106,.18);color:#47CD89}.sb-badge.c{background:rgba(240,68,56,.2);color:#F97066}
.sb-group{margin-top:14px}
.sb-gl{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sb-gl span{flex:1}
.sb-gl.perf{color:#C7D7FE}
.chg{display:none;height:16px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;align-items:center}
.marks .chg{display:inline-flex}
.chg.new{background:#7A5AF8;color:#fff}.chg.mv{background:rgba(255,255,255,.1);color:#C7D7FE}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:28px 36px 90px;background:var(--page);background-attachment:fixed;transition:background .3s}
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ph h1{font-family:var(--fd);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--good-bg);color:var(--good)}
.pill.warn{background:#FEF0C7;color:#B54708}
.chipb{height:28px;padding:0 11px;border-radius:99px;background:var(--glass-in);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2)}
.btn{height:34px;padding:0 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center}

/* shared */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chead{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 6px;flex-wrap:wrap}
.chead h2{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:-.02em}
.chead .q{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:3px}
.chead .rt{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kick{display:none}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.meta{font-size:13px;color:var(--ink-3);font-weight:500}
.tr{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap;font-family:var(--f)}
.tr .ic{width:12px;height:12px;stroke-width:2.8}
.tr.good{background:var(--good-bg);color:var(--good)} .tr.bad{background:var(--bad-bg);color:var(--bad)} .tr.eq,.tr.na{background:var(--flat-bg);color:var(--flat);padding:0 9px}
.k-del{--k:var(--o-del)} .k-ret{--k:var(--o-ret)} .k-rej{--k:var(--o-rej)} .k-junk{--k:var(--o-junk)} .k-pend{--k:var(--o-pend)} .k-road{--k:var(--o-road)}
.sw{width:11px;height:11px;border-radius:4px;background:var(--k);flex:none;display:inline-block}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--a5),var(--a7));flex:none;text-transform:uppercase}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.link:hover{text-decoration:underline}
.empty{padding:34px;text-align:center;color:var(--ink-2);font-weight:600}
.rate{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:12px;background:var(--glass-in);border:1px solid var(--glass-in-bd);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.rate b{font-family:var(--fd);font-size:17px;color:var(--ink);font-weight:800}

/* 1 · hero */
.ov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;padding:28px 32px;align-items:center}
.waffle{--cell:24px;--cg:4px;display:grid;grid-template-columns:repeat(10,var(--cell));gap:var(--cg)}
.wc{width:var(--cell);height:var(--cell);border-radius:7px;background:var(--k);animation:pop .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i) * 6ms);transition:opacity .2s,transform .2s;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.ov[data-hl] .wc{opacity:.15}
.ov[data-hl=del] .wc.k-del,.ov[data-hl=ret] .wc.k-ret,.ov[data-hl=rej] .wc.k-rej,.ov[data-hl=junk] .wc.k-junk,.ov[data-hl=pend] .wc.k-pend{opacity:1;transform:scale(1.07)}
.hl{font-family:var(--fd);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-bottom:6px}
.hl em{font-style:normal;color:var(--o-del)}
.hl-s{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st{position:relative;padding:15px 16px 14px;border-radius:var(--r-in);background:var(--glass-in);border:1px solid var(--glass-in-bd);cursor:pointer;transition:transform .2s;text-align:start}
.st:hover{transform:translateY(-2px)}
.st-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.st-h .tr{margin-inline-start:auto}
.st-n{display:flex;align-items:baseline;gap:3px;margin-top:10px}
.st-n b{font-family:var(--fd);font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.st-n small{font-size:14px;font-weight:700;color:var(--ink-3)}
.st-s{font-size:12px;color:var(--ink-3);margin-top:6px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-f{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-3);font-weight:500;flex-wrap:wrap}
.ov-f b{color:var(--ink-2);font-weight:700}
.note{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(247,144,9,.1);color:var(--ink-2);font-size:12.5px;font-weight:500}

/* 2 · à regarder */
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.w{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:var(--r-in);background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);position:relative;overflow:hidden;text-align:start}
.w::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--t)}
.w-h{display:flex;align-items:center;gap:9px}
.w-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t);flex:none}
.w b{font-size:14.5px;font-weight:800;line-height:1.3}
.w p{font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.4}
.w .link{margin-top:auto}

/* 3 · flow */
#flow{padding:4px 18px 4px;position:relative}
#flow svg{display:block;width:100%;overflow:visible}
.fl-band{transition:opacity .2s}
.fl-leak{cursor:pointer;transition:opacity .2s}
#flow:hover .fl-leak{opacity:.55}
#flow .fl-leak:hover{opacity:1}
.fl-st{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3)}
.fl-n{font-family:var(--fd);font-size:22px;font-weight:800;fill:var(--ink);letter-spacing:-.02em}
.fl-p{font-size:12px;font-weight:700;fill:var(--ink-3)}
.fl-pl{font-size:12.5px;font-weight:800;fill:var(--ink)}
.fl-pv{font-size:11.5px;font-weight:600;fill:var(--ink-2)}
.fl-f{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:6px 24px 20px;font-size:12px;color:var(--ink-3);font-weight:500}
.fl-f span{display:inline-flex;align-items:center;gap:6px}
.dashsw{width:14px;height:10px;border-radius:3px;border:1.5px dashed var(--ink-3)}

/* 4 · fuites */
.lk{display:grid;gap:10px;padding:10px 20px 20px}
.lk-row{display:grid;grid-template-columns:30px minmax(220px,1.3fr) minmax(200px,1.5fr) 96px 64px 26px;gap:16px;align-items:center;padding:13px 14px;border-radius:var(--r-in);background:var(--glass-in);border:1px solid var(--glass-in-bd);cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:start;width:100%}
.lk-row:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover)}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--flat-bg);color:var(--ink-2)}
.lk-t{display:flex;align-items:center;gap:11px;min-width:0}
.lk-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 14%,transparent);color:var(--t);flex:none}
.lk-t b{display:block;font-size:14.5px;font-weight:800;line-height:1.25}
.lk-t small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-bar{display:flex;height:12px;border-radius:99px;background:var(--track);overflow:hidden;gap:2px}
.lk-bar i{display:block;height:100%;background:var(--t);border-radius:3px}
.lk-bar i:nth-child(2){opacity:.72}.lk-bar i:nth-child(3){opacity:.5}.lk-bar i:nth-child(n+4){opacity:.32}
.lk-sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.lk-sub span b{color:var(--ink-2)}
.lk-n{text-align:end}
.lk-n b{font-family:var(--fd);font-size:28px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.lk-n small{font-size:12.5px;color:var(--ink-3);font-weight:700}
.lk-n div{font-size:11.5px;color:var(--ink-3);font-weight:600}
.lk-go{color:var(--ink-3)}

/* 5 · produits + jours */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.pr{display:grid;gap:8px;padding:10px 20px 20px}
.pr-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(160px,1.6fr) 70px;gap:14px;align-items:center;padding:10px 12px;border-radius:var(--r-in);cursor:pointer;transition:background .15s;text-align:start;width:100%}
.pr-row:hover{background:var(--glass-in)}
.pr-p{display:flex;align-items:center;gap:10px;min-width:0}
.thumb{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 4px 12px color-mix(in srgb,var(--c1) 35%,transparent)}
.pr-p b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-p small{font-size:11.5px;color:var(--ink-3);font-weight:500}
.sbar{display:flex;height:22px;gap:2px;border-radius:7px;overflow:hidden}
.sbar i{display:grid;place-items:center;background:var(--k);font-style:normal;font-size:10.5px;font-weight:800;color:#fff;min-width:2px}
.sbar i.k-pend{color:var(--ink-2)}

    const quiet = last ? daysBetween(last, TODAY) : 0, since = pool.filter(o => o.d > last).length, pn = Object.keys(S.sel).length ? ` « ${selName(S.sel)} »` : "";
    if (quiet >= 2){ const adOff = Object.keys(ADS).filter(d => ADS[d] > 0).sort().pop();

  if (stuck.length){ const old = stuck.map(o => o.d).sort()[0];

  /* 3 · rejected without a reason */
  const au = cur.filter(FAM.autre.test);

  const cs = Object.entries(byc).filter(([, v]) => v[0] + v[1] >= 40).map(([c, v]) => ({c:+c, r:v[0] / (v[0] + v[1]) * 100, n:v[0] + v[1]}));

    if (rr - worst.r >= 8) cards.push({t:"var(--o-ret)", icon:"truck", h:`${CITIES[worst.c][0]} livre moins bien`, p:`${fpct(worst.r)} des colis livrés contre ${fpct(rr)} ailleurs (${fnum(worst.n)} colis). Le détail par ville vit dans Performance › Livraison.`, a:`<a class="link" href="#" data-toast="Performance › Livraison ?ville=${CITIES[worst.c][0]} (même période)">Performance › Livraison ${ic("ext")}</a>`}); }

  return `<section><div class="chead" style="padding:0 2px 12px"><div><div class="kick">02 — CE MATIN</div><h2>À regarder</h2></div></div>
    <div class="watch">${cards.slice(0, 3).map(c => `<div class="w" style="--t:${c.t}"><div class="w-h"><span class="w-ic">${ic(c.icon)}</span><b>${glue(esc(c.h))}</b></div><p>${glue(esc(c.p))}</p>${c.a}</div>`).join("")}</div></section>`;

/* biggest leaks, by cause */
function famRows(list){
  const n = list.length;
  return Object.entries(FAM).map(([key, F]) => {
    const xs = list.filter(F.test);
    const subs = {}; if (F.sub) xs.forEach(o => { const s = F.sub(o); subs[s] = (subs[s] || 0) + 1; });
    return {key, F, xs, n:xs.length, per:n ? xs.length / n * 100 : 0, subs:Object.entries(subs).sort((a, b) => b[1] - a[1])};
  }).filter(r => r.n).sort((a, b) => b.n - a.n);
}
function where(list, xs, F){
  /* the product — or the agent — most over-represented in this leak (excess orders, ≥ 30 orders) */
  const rate = xs.length / list.length, dims = []; let best = null;
  if (new Set(list.map(o => o.p)).size > 1) PRODUCTS.forEach((p, i) => dims.push({name:p.s, test:o => o.p === i}));
  if (F.k !== "junk" && new Set(list.map(o => o.a)).size > 1) AGENTS.forEach((a, i) => dims.push({name:"chez " + aName(i), test:o => o.a === i}));
  dims.forEach(d => { const all = list.filter(d.test); if (all.length < 30) return; const mine = all.filter(F.test).length, ex = mine - rate * all.length; if (!best || ex > best.ex) best = {name:d.name, ex, r:mine / all.length * 100}; });
  if (!dims.length) return "";
  return best && best.ex >= 5 ? `surtout ${best.name} : ${Math.round(best.r)} sur 100 (moy. ${Math.round(rate * 100)})` : "réparti partout";
}

/* the thin B bar of a row: same row, B's agents (in « Par produit ») or B's products (in « Par agent »), or B's dates */
function thinB(C, test, block){
  if (!C.B || C.B.empty) return "";
  let xs = null;
  if (S.cmp === "d") xs = cohort(S.cmpFrom, S.cmpTo).filter(o => test(o) && (block === "p" ? agOk(o, S.ag) : match(o, S.sel)));
  if (S.cmp === "a" && block === "p") xs = C.all.filter(o => test(o) && agOk(o, S.cmpAg));
  if (S.cmp === "p" && block === "a") xs = C.all.filter(o => test(o) && match(o, S.cmpSel));
  if (!xs) return "";
  const bs = sum(xs); if (bs.n < 10) return "";
  const br = round100(bs.p);
  return `<span class="sbar b" data-tip="${esc(`B · ${C.B.label} : ${Math.round(bs.p.del)} livrées sur 100 · ${fnum(bs.n)} commandes`)}">${KEYS.map(k => br[k] ? `<i class="k-${k}" style="flex:${br[k]}"></i>` : "").join("")}</span>`;
}
const bTxt = (C, block) => C.B && !C.B.empty && (S.cmp === "d" || (S.cmp === "a" && block === "p") || (S.cmp === "p" && block === "a")) ? ` Trait fin = B (${esc(C.B.label)}).` : "";

/* by product — every product (the agent filter applies), the A selection marked; one sized product = its sizes */
function products(C){
  const pool = C.all.filter(o => agOk(o, S.ag)), ks = Object.keys(S.sel).map(Number);
  const one = ks.length === 1 && PRODUCTS[ks[0]].sizes ? ks[0] : null, who = S.ag.length ? ` de ${agName(S.ag)}` : "";
  const head = `<div class="chead"><div><div class="kick">05 — PAR PRODUIT</div><h2>${one != null ? "Par taille" : "Par produit"}</h2><div class="q">${one != null ? `Les tailles de « ${esc(pShort(one))} »${esc(who)}.` : ks.length ? `Tous les produits${esc(who)}, la sélection A marquée.` : `Tous les produits${esc(who)}.`} Cliquez pour filtrer la page.${bTxt(C, "p")}</div></div>
    <div class="rt legend">${KEYS.map(k => `<span class="k-${k}"><span class="sw"></span>${O1[k]}</span>`).join("")}</div></div>`;
  let rows = one != null
    ? PRODUCTS[one].sizes.map((z, v) => ({i:one, v, label:z, test:o => o.p === one && o.v === v, a:Array.isArray(S.sel[one]) && S.sel[one].includes(v)}))
    : PRODUCTS.map((p, i) => ({i, v:-1, label:p.s, test:o => o.p === i, a:S.sel[i] !== undefined, b:S.cmp === "p" && S.cmpSel[i] !== undefined}));
  rows.forEach(r => { r.xs = pool.filter(r.test); r.s = sum(r.xs); });
  rows = rows.filter(r => r.s.n >= 10 || ((r.a || r.b) && r.s.n)).sort((a, b) => b.s.n - a.s.n);
  if (!rows.length) return `<section class="card">${head}<div class="empty">Trop peu de commandes.</div></section>`;
  const refL = one != null ? pool.filter(o => o.p === one) : pool, ref = sum(refL), refF = famRows(refL);
  return `<section class="card">${head}<div class="pr">${rows.map(r => {
      const s = r.s, ok = s.n >= 30, dlt = s.p.del - ref.p.del;
      let lk = null; famRows(r.xs).forEach(f => { const avg = (refF.find(x => x.key === f.key) || {per:0}).per, ex = f.per - avg; if (!lk || ex > lk.ex) lk = {f, ex}; });
      return `<button class="pr-row${r.a ? " sel" : r.b ? " selb" : ""}${ok ? "" : " thin"}" data-ppick="${r.i}${r.v >= 0 ? ":" + r.v : ""}">
        <span class="pr-p">${thumb(r.i)}<span style="min-width:0"><b>${r.a ? tagAB("A") : ""}${r.b ? tagAB("B") : ""}${esc(r.label)}</b><small>${fnum(s.n)} reçues · conf. ${fpct(s.conf || 0)}</small></span></span>
        <span>${sbar(s)}${thinB(C, r.test, "p")}
          ${!ok ? "" : lk && lk.ex >= 3 ? `<span class="leakchip" style="--t:${lk.f.F.tone}"><i></i>Fuite : ${esc(lk.f.F.t.toLowerCase())} · +${Math.round(lk.ex)} pts</span>` : `<span class="leakchip" style="--t:var(--o-del)"><i></i>Pas de fuite au-dessus de la moyenne</span>`}</span>
        <span class="pr-v">${ok ? `<b>${Math.round(s.p.del)}</b><small>/100</small><div><span class="tr ${Math.round(dlt) > 0 ? "good" : Math.round(dlt) < 0 ? "bad" : "eq"}" data-tip="Livrées sur 100, contre ${Math.round(ref.p.del)} pour ${one != null ? "le produit entier" : "tous les produits"}">${Math.round(dlt) ? ic(dlt > 0 ? "up" : "dn") + Math.abs(Math.round(dlt)) : "="}</span></div>` : `<small style="white-space:normal;display:block;line-height:1.3">trop peu pour comparer</small>`}</span></button>`;
    }).join("")}</div>
    <div class="cfoot"><span>livrées sur 100 reçues · flèche = écart avec ${one != null ? "le produit entier" : "tous les produits"}${esc(who)} · moins de 30 commandes = pas comparé</span></div></section>`;
}

/* by agent — every agent on the chosen products, ranked. Fair measure: delivered per 100 REAL orders
   (« jamais réelles » are shown but not held against the agent). */
const realDel = s => s.n - s.junk ? s.d / (s.n - s.junk) * 100 : null;
function agentsBlock(C){
  const base = C.base, T = sum(base), tr = realDel(T), on = Object.keys(S.sel).length ? ` sur « ${esc(selName(S.sel))} »` : "";
  const head = `<div class="chead"><div><div class="kick">06 — PAR AGENT</div><h2>Par agent</h2><div class="q">Toute l'équipe${on}${S.ag.length ? ", la sélection A marquée" : ""}. Cliquez pour filtrer la page.${bTxt(C, "a")}</div></div>
    <div class="rt"><a class="link" href="team-performance-v3.html" data-href="team-performance-v3.html">Profils dans Performance › Équipe ${ic("ext")}</a></div></div>`;
  if (T.n < 30) return `<section class="card agents">${head}<div class="empty">Trop peu de commandes sur ces produits.</div></section>`;
  const rows = AGENTS.map((a, i) => { const xs = base.filter(o => o.a === i), s = sum(xs); return {i, s, rd:realDel(s), ok:s.n >= 30}; }).filter(r => r.s.n)
    .sort((a, b) => (b.ok - a.ok) || (b.ok ? b.rd - a.rd : b.s.n - a.s.n));
  return `<section class="card agents">${head}
    <div class="pr">${rows.map((r, rank) => {
      const s = r.s, dlt = r.ok && tr != null ? r.rd - tr : null, isA = S.ag.includes(r.i), isB = S.cmp === "a" && S.cmpAg.includes(r.i);
      return `<button class="pr-row${isA ? " sel" : isB ? " selb" : ""}${r.ok ? "" : " thin"}" data-agpick="${r.i}" data-tip="${esc(`${aName(r.i)} · ${fnum(s.n)} commandes traitées · ${fnum(s.d)} livrées · ${fnum(s.junk)} jamais réelles (non comptées)`)}">
        <span class="pr-p">${r.ok ? `<span class="rk" style="width:22px;height:22px;font-size:11px">${rank + 1}</span>` : ""}${av(AGENTS[r.i].k)}<span style="min-width:0"><b>${isA ? tagAB("A") : ""}${isB ? tagAB("B") : ""}${esc(aName(r.i))}</b><small>${fnum(s.n)} cmd · conf. ${fpct(s.conf || 0)}</small></span></span>
        <span>${sbar(s)}${thinB(C, o => o.a === r.i, "a")}
          <span class="leakchip" style="--t:var(--o-junk)"><i></i>${fnum(s.p.junk, 0)} jamais réelles · non comptées</span></span>
        <span class="pr-v">${r.ok ? `<b>${Math.round(r.rd)}</b><small>/100</small><div><span class="tr ${Math.round(dlt) > 0 ? "good" : Math.round(dlt) < 0 ? "bad" : "eq"}" data-tip="Livrées sur 100 vraies commandes, contre ${Math.round(tr)} pour l'équipe${on ? " sur ces produits" : ""}">${Math.round(dlt) ? ic(dlt > 0 ? "up" : "dn") + Math.abs(Math.round(dlt)) : "="}</span></div>` : `<small style="white-space:normal;display:block;line-height:1.3">trop peu pour comparer</small>`}</span></button>`;
    }).join("")}</div>
    <div class="cfoot"><span style="display:block">livrées sur 100 <b>vraies</b> commandes (les « jamais réelles » ne comptent pas contre l'agent) · flèche = écart avec l'équipe (${tr == null ? "—" : Math.round(tr)}) · moins de 30 commandes = pas classé</span></div></section>`;
}

/* day after day */
function daysBlock(C){
  const {w, cur} = C, days = daysOf(w.from, w.to);
  const by = {}; days.forEach(d => by[d] = {n:0, del:0, ret:0, rej:0, junk:0, pend:0}); cur.forEach(o => { by[o.d].n++; by[o.d][GROUP[o.bk]]++; });
  const max = Math.max(1, ...days.map(d => by[d].n)), cols = `grid-template-columns:repeat(${days.length},minmax(0,1fr))`;
  const zeroRun = days.filter(d => by[d].n <= 1 && d >= "2026-09-30").length;
  return `<section class="card"><div class="chead"><div><div class="kick">07 — LE FLUX</div><h2>Jour après jour</h2><div class="q">Les commandes reçues chaque jour, et ce qu'elles sont devenues.${C.B && !C.B.empty ? " A seulement." : ""}</div></div></div>
    <div class="days" style="${cols}">${days.map(d => { const b = by[d];
      return `<div class="dcol${b.n ? "" : " zero"}" data-drill="day:${d}" data-tip="${esc(`${dLong(d)} · ${b.n} ${pl(b.n, "commande", "commandes")}${b.n ? " · " + KEYS.filter(k => b[k]).map(k => `${b[k]} ${O[k].toLowerCase()}`).join(", ") : ""} · pub ${ADS[d] ? (S.role === "owner" ? `active (${fnum(ADS[d])} د.ل)` : "active") : "à l'arrêt"}`)}">${["pend","junk","rej","ret","del"].map(k => b[k] ? `<i class="k-${k}" style="height:${b[k] / max * 150}px"></i>` : "").join("")}</div>`; }).join("")}</div>
    <div class="ads" style="${cols}" data-tip="Pub Meta : trait plein = active ce jour-là">${days.map(d => `<i class="${ADS[d] ? "" : "off"}"></i>`).join("")}</div>
    <div class="dlab" style="${cols}">${days.map((d, i) => `<span>${days.length <= 31 || i % 3 === 0 ? +d.slice(8) : ""}</span>`).join("")}</div>
    ${zeroRun >= 2 ? `<div class="gap-note">${ic("stop")}Depuis le 30 sept. : la pub est à l'arrêt, les commandes aussi.</div>` : ""}
    <div class="cfoot"><span><i style="width:16px;height:6px;border-radius:3px;background:var(--accent);opacity:.75;display:inline-block"></i>pub active</span><span><i style="width:16px;height:6px;border-radius:3px;border:1.5px dashed var(--ink-4);display:inline-block"></i>pub à l'arrêt</span><span>cliquez un jour pour voir ses commandes</span></div></section>`;
}

function defs(){
  return `<details class="defs"><summary>Comment lire cette page</summary><div>Une commande compte dans la période où elle est <b>arrivée</b>, et on la juge sur ce qu'elle est devenue aujourd'hui.

    ${S.role === "owner" ? "<b>L'argent</b> = le prix des commandes, le seul champ de chiffre d'affaires : livré, perdu en retours (colis revenus ou annulés avant le départ), encore en route. Une commande à plusieurs produits partage son prix entre eux, comme dans Produits. " : ""}Les flèches comparent à la période juste avant, seulement quand les deux ont au moins 90 % de commandes à l'issue finale. Moins de 30 commandes : pas de « sur 100 ».
    Les mêmes définitions servent Accueil, Produits, Performance › Équipe et › Livraison.</div></details>`;
}

/* ═════════════ drill-down drawer ═════════════ */
function drillSpec(key, C){
  const [kind, v] = key.split(":");
  if (kind === "out") return {title:O[v], tone:`var(--o-${v})`, icon:v === "del" ? "check" : v === "ret" ? "ret" : v === "rej" ? "g_refus_client" : v === "junk" ? "g_commande_invalide" : "clock", test:o => GROUP[o.bk] === v};
  if (kind === "fam") return {title:FAM[v].t, tone:FAM[v].tone, icon:FAM[v].icon, test:FAM[v].test};
  if (kind === "bk") return {title:{c:"En appel",u:"À uploader",r:"En route"}[v], tone:v === "r" ? "var(--o-road)" : "var(--ink-3)", icon:"clock", test:o => o.bk === v};
  if (kind === "prod") return {title:PRODUCTS[v].n, tone:PRODUCTS[v].c1, icon:"pkg", test:o => o.p === +v};
  if (kind === "day") return {title:dLong(v), tone:"var(--accent)", icon:"cal", test:o => o.d === v};
  if (kind === "stuck") return {title:"Sans décision depuis plus de 2 jours", tone:"var(--o-ret)", icon:"clock", test:o => (o.bk === "c" || o.bk === "u") && daysBetween(o.d, TODAY) > 2};
  return null;
}
function badge(o){
  const g = GROUP[o.bk];
  let lab = O1[g], icn = null;
  if (o.bk === "x" || o.bk === "j" || o.bk === "s"){ lab = REASON[o.rs].s; icn = "g_" + REASON[o.rs].g; }
  else if (o.bk === "f"){ lab = "Retournée · " + REMARK[o.rs].s; icn = "ret"; }
  else if (o.bk === "b"){ lab = "Annulée avant départ"; icn = "stop"; }
  else if (o.bk === "c") lab = "En appel"; else if (o.bk === "u") lab = "À uploader"; else if (o.bk === "r"){ lab = "En route"; }
  const k = o.bk === "r" ? "road" : g;
  return `<span class="badge k-${k}">${icn ? ic(icn) : ""}${esc(lab)}</span>`;
}
function renderDrawer(){
  const el = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  if (!S.drill){ el.classList.remove("on"); scrim.classList.remove("on"); return; }
  const C = ctx(), sp = drillSpec(S.drill, C); if (!sp){ S.drill = null; return renderDrawer(); }
  const all = C.cur.filter(sp.test);
  const list = S.dsel ? all.filter(o => S.dsel.t === "p" ? o.p === S.dsel.v : S.dsel.t === "a" ? o.a === S.dsel.v : S.dsel.t === "r" ? o.rs === S.dsel.v : o.ci === S.dsel.v) : all;
  const prevN = C.prev.filter(sp.test).length, per = all.length / Math.max(1, C.A.n) * 100, pper = prevN / Math.max(1, C.P.n) * 100;
  const brk = (title, entries, t, fmt) => entries.length < 2 && !(entries.length === 1 && S.dsel) ? "" : `<div class="dr-sec"><h4>${title}</h4>${entries.slice(0, 6).map(([k, v]) => {
    const on = S.dsel && S.dsel.t === t && String(S.dsel.v) === String(k);
    return `<button class="br${on ? " on" : ""}" style="--t:${sp.tone}" data-sel="${t}:${k}">${fmt(k)}<span class="bar"><i style="width:${v / all.length * 100}%"></i></span><b>${fnum(v)}</b></button>`; }).join("")}</div>`;
  const count = f => { const m = {}; all.forEach(o => { const k = f(o); if (k == null || k === -1) return; m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const reasons = count(o => o.rs), prods = count(o => o.p), ags = count(o => o.a), cities = count(o => o.ci);
  const rlab = k => `<span>${esc(REASON[k] ? REASON[k].fr : REMARK[k] ? REMARK[k].fr : k)}</span>`;
  const rows = list.slice().sort((a, b) => (b.d + b.m).localeCompare(a.d + a.m)).slice(0, S.dmore);
  const url = `/orders?recu_du=${C.w.from}&au=${C.w.to}&issue=${S.drill}${S.ag.length ? `&agents=${S.ag.map(aName).join(",")}` : ""}${S.dsel ? `&${S.dsel.t}=${S.dsel.v}` : ""}`;
  el.innerHTML = glue(`<div class="dr-h"><span class="lk-ic" style="--t:${sp.tone}">${ic(sp.icon)}</span><div><h3>${esc(sp.title)}</h3><div class="meta">${fnum(all.length)} ${pl(all.length, "commande", "commandes")} · ${fnum(per, per < 10 ? 1 : 0)} sur 100 reçues · ${esc(C.w.label)}${Object.keys(S.sel).length || S.ag.length ? " · " + esc(fullName(S.sel, S.ag)) : ""}</div></div>
      <button class="dr-x" data-close aria-label="Fermer">${ic("x")}</button></div>
    <div class="dr-b">
      <div class="dr-kpi"><span class="rate">Sur 100 reçues <b>${fnum(per, per < 10 ? 1 : 0)}</b>${trend(per, pper, sp.tone.includes("del"), C)}</span><span class="rate">Période d'avant <b>${fnum(prevN)}</b></span>${S.role === "owner" ? `<span class="rate" data-tip="Somme des prix de ces commandes">Valeur <b>${fnum(list.reduce((s, o) => s + o.tp, 0))}</b> د.ل</span>` : ""}</div>
      ${brk("Par motif", reasons, "r", rlab)}
      ${brk("Par produit", prods, "p", k => `<span class="who">${thumb(+k)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(PRODUCTS[k].n)}</span></span>`)}
      ${brk("Par agent", ags, "a", k => `<span class="who">${av(AGENTS[k].k)}${aName(+k)}</span>`)}
      ${brk("Par ville", cities, "c", k => `<span>${CITIES[k][0]}</span>`)}
      ${S.dsel && S.dsel.t === "a" ? `<a class="link" href="team-performance-v3.html" data-href="team-performance-v3.html">Voir ${aName(S.dsel.v)} dans Performance › Équipe ${ic("ext")}</a>` : ""}
      <div class="dr-sec"><h4>Les commandes${S.dsel ? " · filtrées" : ""} (${fnum(list.length)})</h4><div class="ol">${rows.map(o => `<div class="or">
        <code>#${o.ref}</code><span class="wh">${dShort(o.d)} · ${String(Math.floor(o.m / 60)).padStart(2, "0")}:${String(o.m % 60).padStart(2, "0")}</span>
        <span class="pp">${thumb(o.p)}<span>${esc(PRODUCTS[o.p].s)}</span>${av(AGENTS[o.a].k)}${o.ci >= 0 ? `<span style="color:var(--ink-3);font-weight:600">${CITIES[o.ci][0]}</span>` : ""}</span>
        ${badge(o)}</div>`).join("")}</div>
        ${list.length > rows.length ? `<button class="chipb more" data-more>Afficher 40 de plus (${fnum(list.length - rows.length)} restantes)</button>` : ""}</div>
    </div>
    <div class="dr-f"><button class="btn" data-toast="Ouvre Commandes avec ce filtre exact : ${esc(url)}">Ouvrir ces ${fnum(list.length)} commandes dans Commandes ${ic("ext")}</button></div>`);
  el.classList.add("on"); scrim.classList.add("on");
}

/* ═════════════ render ═════════════ */
function render(){
  renderBar(); renderSide();
  const C = ctx();
  document.getElementById("page").innerHTML = glue(header(C) + filterBar(C) + hero(C) + money(C) + watch(C) + flowShell(C) + leaksBlock(C) + `<div class="duo">${products(C)}${agentsBlock(C)}</div>` + daysBlock(C) + defs());
  drawFlow(C); renderDrawer();
  const q = new URLSearchParams(); q.set("period", S.period); if (S.period === "custom"){ q.set("from", S.from); q.set("to", S.to); }
  const enc = sel => Object.entries(sel).map(([i, v]) => v ? `${i}.${v.join("-")}` : i).join(",");
  if (Object.keys(S.sel).length) q.set("p", enc(S.sel)); if (S.ag.length) q.set("ag", S.ag.join(",")); if (S.role !== "owner") q.set("role", S.role);
  if (S.cmp === "p") q.set("cmp", "p:" + enc(S.cmpSel)); if (S.cmp === "a") q.set("cmp", "a:" + S.cmpAg.join(",")); if (S.cmp === "d") q.set("cmp", `d:${S.cmpFrom}|${S.cmpTo}`);

}
const keep = fn => { const y = scrollY; fn(); render(); scrollTo(0, y); };

/* ═════════════ events ═════════════ */
const tip = document.getElementById("tip"); let toastT;
function toast(msg){ tip.textContent = "→ " + msg; tip.classList.add("on"); tip.style.left = "50%"; tip.style.top = "64px"; tip.style.transform = "translateX(-50%)"; clearTimeout(toastT); toastT = setTimeout(() => { tip.classList.remove("on"); tip.style.transform = ""; }, 2600); }
document.addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let t;
  if ((t = g("[data-href]"))){ e.preventDefault(); location.href = t.dataset.href; return; }
  if ((t = g("[data-toast]"))){ e.preventDefault(); toast(t.dataset.toast); return; }
  if ((t = g("[data-role]"))){ keep(() => S.role = t.dataset.role); return; }
  if ((t = g("[data-dp]"))){ const w0 = t.dataset.dp; keep(() => { if (S.dp && S.dp.w === w0) S.dp = null; else openDp(w0); }); return; }
  if ((t = g("[data-dpp]"))){ const v = t.dataset.dpp, w0 = v.slice(0, 1), k = v.slice(2); keep(() => {
      if (w0 === "a"){ S.period = k; S.from = S.to = null; } else { [S.cmpFrom, S.cmpTo] = k.startsWith("r:") ? k.slice(2).split("|") : range(k); } S.dp = null; }); return; }
  if ((t = g("[data-dday]"))){ const x = t.dataset.dday, d = S.dp; keep(() => { if (!d.s || d.e){ d.s = x; d.e = null; } else if (x < d.s){ d.e = d.s; d.s = x; } else d.e = x; }); return; }
  if ((t = g("[data-dpnav]"))){ keep(() => S.dp.m = addMonths(S.dp.m, +t.dataset.dpnav)); return; }
  if (g("[data-dpcancel]")){ keep(() => S.dp = null); return; }
  if (g("[data-dpapply]")){ const d = S.dp; if (d.s && d.e) keep(() => { if (d.w === "a"){ const k = nameRange(d.s, d.e); S.period = k; S.from = k === "custom" ? d.s : null; S.to = k === "custom" ? d.e : null; } else { S.cmpFrom = d.s; S.cmpTo = d.e; } S.dp = null; }); return; }
  if (g(".dp")) return;
  if (S.dp){ keep(() => S.dp = null); }
  if (g("[data-reset]")){ keep(() => { S.sel = {}; S.ag = []; S.cmp = null; S.cmpSel = {}; S.cmpAg = []; S.fpop = null; }); return; }
  if ((t = g("[data-ppick]"))){ const [i, v] = t.dataset.ppick.split(":").map(Number); keep(() => {
      if (v === undefined){ const only = Object.keys(S.sel).length === 1 && S.sel[i] === null; S.sel = only ? {} : {[i]:null}; }
      else { const only = Array.isArray(S.sel[i]) && S.sel[i].length === 1 && S.sel[i][0] === v; S.sel = {[i]:only ? null : [v]}; } }); return; }
  if ((t = g("[data-fpop]"))){ const k = t.dataset.fpop; keep(() => S.fpop = S.fpop === k ? null : k); return; }
  if ((t = g("[data-pk]"))){ const [w, i] = t.dataset.pk.split(":"); keep(() => toggleProduct(w === "a" ? S.sel : S.cmpSel, +i)); return; }
  if ((t = g("[data-pz]"))){ const [w, i, v] = t.dataset.pz.split(":"); keep(() => toggleSize(w === "a" ? S.sel : S.cmpSel, +i, +v)); return; }
  if ((t = g("[data-pa]"))){ const [w, i] = t.dataset.pa.split(":"); keep(() => toggleAg(w === "a" ? S.ag : S.cmpAg, +i)); return; }
  if ((t = g("[data-aclear]"))){ const w = t.dataset.aclear; keep(() => { if (w === "a") S.ag = []; else S.cmpAg = []; }); return; }
  if ((t = g("[data-unag]"))){ const [w, i] = t.dataset.unag.split(":"); keep(() => toggleAg(w === "a" ? S.ag : S.cmpAg, +i)); return; }
  if ((t = g("[data-agpick]"))){ const i = +t.dataset.agpick; keep(() => { S.ag = S.ag.length === 1 && S.ag[0] === i ? [] : [i]; }); return; }
  if ((t = g("[data-pclear]"))){ const w = t.dataset.pclear; keep(() => { if (w === "a") S.sel = {}; else S.cmpSel = {}; }); return; }
  if (g("[data-pdone]")){ keep(() => S.fpop = null); return; }
  if ((t = g("[data-unsel]"))){ const [w, i] = t.dataset.unsel.split(":"); keep(() => { delete (w === "a" ? S.sel : S.cmpSel)[i]; }); return; }
  if ((t = g("[data-cmp]"))){ const c = t.dataset.cmp || null; keep(() => { S.cmp = c; S.fpop = c === "p" && !Object.keys(S.cmpSel).length ? "b" : c === "a" && !S.cmpAg.length ? "bag" : null; S.dp = null; if (c === "d") openDp("b"); }); return; }
  if (g(".picker") || g(".pop")) return;
  if (S.fpop && !g(".fbar")){ keep(() => S.fpop = null); }
  if ((t = g("[data-sel]"))){ const [k, v] = t.dataset.sel.split(":"); const val = k === "r" ? v : +v; S.dsel = S.dsel && S.dsel.t === k && S.dsel.v === val ? null : {t:k, v:val}; S.dmore = 40; renderDrawer(); return; }
  if (g("[data-more]")){ S.dmore += 40; renderDrawer(); return; }
  if (g("[data-close]") || g("#scrim")){ S.drill = null; S.dsel = null; renderDrawer(); return; }
  if ((t = g("[data-drill]"))){ e.preventDefault(); S.drill = t.dataset.drill; S.dsel = null; S.dmore = 40; renderDrawer(); return; }
});
document.addEventListener("change", e => { if (e.target.id === "marks"){ S.marks = e.target.checked; renderSide(); } });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape" && (S.fpop || S.dp)){ keep(() => { S.fpop = null; S.dp = null; }); return; }
  if (e.key === "Escape" && S.drill){ S.drill = null; S.dsel = null; renderDrawer(); return; }
});
document.addEventListener("mouseover", e => {
  /* calendar: preview the range while choosing the last day */
  if (S.dp && S.dp.s && !S.dp.e){ const dd = e.target.closest && e.target.closest("[data-dday]"), s = S.dp.s;
    document.querySelectorAll(".cal-d").forEach(b => { const x = b.dataset.dday; b.classList.toggle("c-hv", !!dd && ((x > s && x <= dd.dataset.dday) || (x < s && x >= dd.dataset.dday))); }); }
  const t = e.target.closest && e.target.closest("[data-tip]");
  const ov = document.getElementById("ov"), k = e.target.closest && e.target.closest("#ov [data-k]");
  if (ov){ if (k) ov.dataset.hl = k.dataset.k; else delete ov.dataset.hl; }
  if (!t){ if (!tip.textContent.startsWith("→")) tip.classList.remove("on"); return; }
  if (tip.textContent.startsWith("→") && tip.classList.contains("on")) return;
  tip.textContent = t.dataset.tip; tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on") || tip.textContent.startsWith("→")) return;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 50) y = e.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => drawFlow(ctx()), 120); });

const q = new URLSearchParams(location.search);
const per = q.get("period") || "";
if (PRESETS.some(p => p[0] === per) || WHOLE.some(m => per === "m:" + m) || per === "custom") S.period = per;
if (q.get("role") === "manager") S.role = "manager";
if (S.period === "custom"){ S.from = q.get("from") || "2026-09-01"; S.to = q.get("to") || "2026-09-30"; }
if (q.get("drill")) S.drill = q.get("drill");
const dec = str => { const o = {}; (str || "").split(",").filter(Boolean).forEach(t => { const [i, v] = t.split("."); if (PRODUCTS[+i]) o[+i] = v ? v.split("-").map(Number) : null; }); return o; };
S.sel = dec(q.get("p"));
const decAg = str => (str || "").split(",").filter(Boolean).map(Number).filter(i => AGENTS[i]).sort();
S.ag = decAg(q.get("ag"));
const cq = q.get("cmp") || ""; if (cq.startsWith("p:")){ S.cmp = "p"; S.cmpSel = dec(cq.slice(2)); } else if (cq.startsWith("a:")){ S.cmp = "a"; S.cmpAg = decAg(cq.slice(2)); } else if (cq.startsWith("d:")){ S.cmp = "d"; [S.cmpFrom, S.cmpTo] = cq.slice(2).split("|"); }
/* ?dp=a|b opens the date popover (review links) */
if (q.get("dp") === "a" || q.get("dp") === "b") openDp(q.get("dp"));
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawFlow(ctx()));
</script>
</body>
</html>
