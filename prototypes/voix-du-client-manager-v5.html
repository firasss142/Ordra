  else if (d.lang) set({lang:AR()?"fr":"ar", limit:S.limit});
  else if (d.keep){ ev.stopPropagation(); const e = E.find(x=>x.id===d.keep); e.review=false; if (e.cat==="reclamation"&&!e.status) e.status="open"; set({limit:S.limit}); }
  else if (d.ign){ ev.stopPropagation(); E.find(x=>x.id===d.ign).ignored=true; set({limit:S.limit}); }
  else if (d.st){ const e = E.find(x=>x.id===S.peek); e.status=d.st; if (!e.owner) e.owner="Super Admin"; set({limit:S.limit}); }
  else if (d.close) set({peek:"", limit:S.limit});
  else if (d.peek && !S.review) set({peek:d.peek, limit:S.limit});
});
document.addEventListener("change", ev => { if (ev.target.id==="agentSel") set({agent:ev.target.value}); });
document.addEventListener("keydown", ev => { if (ev.key==="Escape" && S.peek) set({peek:"", limit:S.limit}); });
render();
</script>
</body>
</html>
