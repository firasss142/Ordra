<!doctype html>
<!--
  Voix du client — côté RESPONSABLE, prototype v4. Construit 2026-10-02. REFONTE COMPLÈTE.
  Plan : plans/voix-du-client.md (Phase 0). La v3 a été refusée le 2026-10-02 : « pas clair, pas de mots qui
  expliquent, pas de structure claire » — demande : une page descriptive, claire, peu dense, simple.

  Diagnostic de la v3 → principe de la v4 :
   1. Cinq systèmes de navigation en même temps (vues, catégories, produits, puces, « Grouper »)
      → UN seul : 5 onglets, chacun avec une phrase qui dit à quoi il sert.
   2. Des codes au lieu de mots (« À vérifier », icônes de moment, compteurs nus)
      → chaque section a un TITRE et une PHRASE d'explication ; les lignes se lisent comme des phrases
        (« dit à tasnim pendant l'appel de confirmation, il y a 2 jours »).
   3. Des lignes-tableur à 5 colonnes → la phrase du client d'abord, une ligne de contexte en clair dessous.
   4. Aucune hiérarchie → la Vue d'ensemble répond, dans l'ordre, à : Que dois-je faire ? · Que disent les
      clients ? · Où nous parlent-ils ? · Qu'avons-nous décidé ? · Quoi de neuf ?
   5. Densité → une colonne centrée (1120 px), 3 cartes maximum par rangée, 5 éléments par bloc puis « Voir tout ».

  Décisions conservées : 3 catégories par intention (Réclamation · Objection · Suggestion) avec leur phrase ·
  4 moments déduits du statut · remarques du livreur à confirmer par le responsable · insights créés à partir
  de retours · réclamations suivies jusqu'à résolution · aucune donnée de refus affichée.
  Langue : le super_admin voit TOUJOURS le français (middleware : pas de marché → fr) ; le responsable Libye
  voit l'arabe. Défaut : fr.
  URL : ?lang=fr|ar &tab=overview|all|complaints|insights|review &role=super_admin|manager
  DONNÉES RÉELLES (Libye) : 148 notes « Autre » porteuses d'un retour (20 mai → 30 sept., datées par
  order_history) et 35 remarques réelles du livreur Darb (lues le 2026-10-01). SIMULÉ : ce qui reste à
  vérifier, l'état « lu », le cycle des réclamations, les titres des insights (leurs preuves sont réelles).
  Noms et téléphones des clients INVENTÉS.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voix du client — responsable, prototype v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#F6F6F7; --card:#FFFFFF; --sunken:#F9FAFB; --hover:#F7F8F9;
    --line:#E1E3E5; --line-subtle:#EDEEF0; --line-strong:#D2D5D9;
    --ink-1:#1A1A1A; --ink-2:#5C6166; --ink-3:#8A9096;
    --brand:#15803D; --brand-hover:#12692F; --brand-bg:#EAF6EE; --brand-line:#BBE5C9;
    --crit:#D72C0D; --crit-bg:#FFF4F4; --warn:#8A5A00; --warn-bg:#FFF8E6; --ok:#008060; --ok-bg:#F1F8F5;
    --ins:#6D28D9; --ins-bg:#F5F3FF; --ins-line:#DDD6FE;
    --sidebar:#0E1013; --sidebar-el:#1A1D21; --sidebar-ink:#E6E8EB; --sidebar-2:#B5BAC2; --sidebar-3:#6B7178;
    --pb:44px;
    --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
  }
  [data-c=reclamation]{--tb:#FEE2E2;--ti:#991B1B;--td:#EF4444;--tl:#FECACA}
  [data-c=objection]  {--tb:#FEF3C7;--ti:#92400E;--td:#F59E0B;--tl:#FDE68A}
  [data-c=suggestion] {--tb:#DCFCE7;--ti:#166534;--td:#22C55E;--tl:#BBF7D0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink-1);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  [dir=rtl] .flip{transform:scaleX(-1)}
  .num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
  .q{unicode-bidi:plaintext}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
  kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:#fff;font:700 10.5px/1 var(--f);color:var(--ink-2)}
  h1,h2,h3,h4,p{margin:0}

  /* prototype chrome */
  .pbar{position:sticky;top:0;z-index:300;height:var(--pb);background:#1F2328;color:#E6E8EB;padding:0 18px;display:flex;align-items:center;gap:14px;direction:ltr;font:12.5px var(--f);border-bottom:3px solid var(--brand)}
  .pbar .tag{font-size:10px;font-weight:700;letter-spacing:.13em;color:#7F858F}
  .pbar b{font-size:13px}
  .pbar .grow{flex:1}
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:#2B3036}
  .seg button{padding:4px 9px;border-radius:5px;color:#AEB4BB;font-size:12px;font-weight:600}
  .seg button[aria-pressed=true]{background:#fff;color:#111}
  .note{direction:ltr;font:12.5px/1.6 var(--f);color:#5C6166;background:#FFFBEB;border-bottom:1px solid #FDE68A;padding:8px 18px}
  .note b{color:#1A1A1A}

  /* shell */
  .app{display:flex;min-height:calc(100vh - var(--pb));min-width:1340px}
  .app[dir=rtl]{font-family:var(--f-ar)}
  .sb{width:224px;flex:none;background:var(--sidebar);color:var(--sidebar-2);padding:14px 10px 18px;font-size:13px;display:flex;flex-direction:column;gap:1px;position:sticky;top:var(--pb);height:calc(100vh - var(--pb));overflow-y:auto}
  .sb .brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px;padding:4px 10px 12px;font-family:var(--f)}
  .sb .brand i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:12px}
  .sb .mk{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;padding:7px 10px;border-radius:8px;background:var(--sidebar-el);color:var(--sidebar-ink);font-size:12.5px;font-weight:600}
  .sb .mk span{color:var(--sidebar-3);font-weight:500;font-size:11.5px}
  .sb .sec{padding:9px 10px 3px;font-size:12px;color:var(--sidebar-2);font-weight:600}
  .sb .it{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-inline-start:20px;border-radius:7px;color:#9BA1A8}
  .sb .it.on{background:var(--brand);color:#fff;font-weight:600}
  .sb .it .n{margin-inline-start:auto;font-size:11px;font-weight:700;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.2);display:grid;place-items:center}
  .sb .grow{flex:1}
  .sb .me{display:flex;align-items:center;gap:9px;padding:10px;border-top:1px solid rgba(255,255,255,.07);margin-top:10px}
  .sb .me i{width:28px;height:28px;border-radius:50%;background:#2B3036;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
  .sb .me b{display:block;color:var(--sidebar-ink);font-size:12.5px}
  .sb .me span{font-size:11.5px;color:var(--sidebar-3)}

  /* page */
  .main{flex:1;min-width:0;padding:28px 32px 80px}
  .wrap{max-width:1120px;margin:0 auto}
  .crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
  .ph{display:flex;align-items:flex-start;gap:16px}
  .ph h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
  .ph p{margin-top:6px;color:var(--ink-2);font-size:15px;max-width:720px;line-height:1.55}
  .ph .end{margin-inline-start:auto;display:flex;gap:8px;padding-top:4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
  .btn:hover{background:var(--hover)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-hover)}
  .btn.ins{background:var(--ins);border-color:var(--ins);color:#fff}
  .btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
  .btn.link{border:0;background:none;color:var(--brand);padding:0;height:auto}
  .btn.link:hover{text-decoration:underline;background:none}

  /* tabs (design-system §4.11 underline tabs) */
  .tabs{display:flex;gap:28px;margin-top:22px;border-bottom:1px solid var(--line)}
  .tabs button{display:inline-flex;align-items:center;gap:8px;height:46px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button:hover{color:var(--ink-1)}
  .tabs button[aria-selected=true]{color:var(--ink-1);border-bottom-color:var(--brand)}
  .tabs .n{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:#EDEEF0;color:var(--ink-2);font-size:12px;font-weight:700;display:grid;place-items:center}
  .tabs .n.hot{background:var(--crit-bg);color:var(--crit)}
  .tabs .n.warn{background:var(--warn-bg);color:var(--warn)}
  .tabs .n.ins{background:var(--ins-bg);color:var(--ins)}
  .tabdesc{margin-top:14px;font-size:14px;color:var(--ink-2)}

  /* sections */
  .section{margin-top:34px}
  .shead{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
  .shead h2{font-size:19px;font-weight:700}
  .shead p{margin-top:3px;font-size:14px;color:var(--ink-2)}
  .shead .end{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

  /* « À faire » */
  .todo{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;text-align:start;overflow:hidden}
  .todo::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--accent)}
  .todo .big{display:flex;align-items:baseline;gap:10px}
  .todo .big b{font-size:32px;line-height:1;font-weight:700;color:var(--accent-ink)}
  .todo .big span{font-size:15.5px;font-weight:600}
  .todo p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .todo .qt{font-size:14px;color:var(--ink-1);background:var(--sunken);border-radius:8px;padding:6px 10px}
  .todo .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--brand)}
  .todo.done{--accent:#D1D5DB;--accent-ink:var(--ink-3)}

  /* « Ce que disent les clients » */
  .catcard{display:flex;flex-direction:column;padding:18px;gap:14px}
  .catcard .hd{display:flex;align-items:center;gap:10px}
  .catcard .dot{width:12px;height:12px;border-radius:50%;background:var(--td)}
  .catcard .hd h3{font-size:17px;font-weight:700}
  .catcard .hd .cnt{margin-inline-start:auto;font-size:22px;font-weight:700}
  .catcard .desc{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:-6px}
  .catcard h4{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.01em}
  .tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .tlist li button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;margin:0 -8px;border-radius:8px;font-size:14px;text-align:start}
  .tlist li button:hover{background:var(--hover)}
  .tlist .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlist .bar{width:56px;height:6px;border-radius:999px;background:#EEF0F2;overflow:hidden;flex:none}
  .tlist .bar i{display:block;height:100%;background:var(--td);opacity:.8}
  .tlist .v{min-width:24px;text-align:end;font-weight:600;color:var(--ink-2)}
  .example{border-radius:10px;background:var(--tb);padding:10px 12px}
  .example small{display:block;font-size:12px;color:var(--ti);opacity:.85;margin-bottom:3px;font-weight:600}
  .example .qt{font-size:15px;font-weight:600;color:var(--ink-1)}
  .example .ctx{font-size:12.5px;color:var(--ink-2);margin-top:4px}
  .catcard .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--brand);padding-top:4px}

  /* « Où les clients nous parlent » */
  .moment{display:flex;flex-direction:column;gap:6px;padding:16px;text-align:start}
  .moment:hover{border-color:var(--line-strong)}
  .moment .top{display:flex;align-items:center;gap:10px}
  .moment .mic{width:34px;height:34px;border-radius:10px;background:#F1F5F9;color:#475569;display:grid;place-items:center}
  .moment .top b{margin-inline-start:auto;font-size:22px;font-weight:700}
  .moment h3{font-size:15px;font-weight:700;margin-top:4px}
  .moment p{font-size:13px;color:var(--ink-2);line-height:1.45}
  .moment.empty b{color:var(--ink-3)}
  .hintline{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--ink-2)}
  .hintline .ic{color:var(--ink-3);margin-top:2px}

  /* insight rows */
  .irow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:start;padding:18px;border-bottom:1px solid var(--line-subtle);text-align:start;width:100%}
  .irow:last-child{border-bottom:0}
  .irow:hover{background:var(--hover)}
  .irow h3{font-size:16px;font-weight:700;line-height:1.35}
  .irow .why{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .irow .ev{font-size:13px;color:var(--ink-2);margin-top:8px}
  .irow .ev b{color:var(--ink-1)}
  .irow .new{display:inline-flex;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-bg);border-radius:999px;padding:2px 9px}
  .irow .own{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
  .ist{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .ist::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .ist[data-i=study]{background:#F1F2F4;color:#4B5563}
  .ist[data-i=progress]{background:var(--warn-bg);color:var(--warn)}
  .ist[data-i=done]{background:var(--ok-bg);color:var(--ok)}
  .ist[data-i=dismissed]{background:#F9FAFB;color:var(--ink-3)}

  /* feedback rows — sentences, not columns */
  .fgroup{padding:10px 18px 6px;font-size:12.5px;font-weight:700;color:var(--ink-3);background:var(--sunken);border-bottom:1px solid var(--line-subtle);border-top:1px solid var(--line-subtle)}
  .fgroup:first-child{border-top:0;border-radius:14px 14px 0 0}
  .frow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line-subtle);cursor:pointer}
  .frow:last-child{border-bottom:0}
  .frow:hover{background:var(--hover)}
  .frow[data-focus]{box-shadow:inset 0 0 0 1.5px var(--brand)}
  .frow[data-sel]{background:#F3FAF5}
  .frow[data-peek]{background:#F3FAF5;box-shadow:inset 3px 0 0 var(--brand)}
  [dir=rtl] .frow[data-peek]{box-shadow:inset -3px 0 0 var(--brand)}
  .cb{width:18px;height:18px;margin-top:3px;border-radius:5px;border:1.5px solid var(--line-strong);background:#fff;display:grid;place-items:center;color:#fff}
  .cb[aria-checked=true]{background:var(--brand);border-color:var(--brand)}
  .cb .ic{width:12px;height:12px;stroke-width:3}
  .frow .l1{display:flex;align-items:center;gap:10px;min-width:0}
  .frow .qt{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
  .udot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
  .frow .l2{margin-top:5px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
  .frow .l2 b{color:var(--ink-1);font-weight:600}
  .frow .l3{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
  .frow .l4{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ins);background:var(--ins-bg);border-radius:999px;padding:2px 10px}
  .frow .l4 .ic{width:13px;height:13px}
  .frow .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  .tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 9px;border-radius:999px;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:700;white-space:nowrap;flex:none}
  .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--td)}
  .st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
  .st[data-s=open]{background:var(--crit-bg);color:var(--crit)}
  .st[data-s=in_progress]{background:var(--warn-bg);color:var(--warn)}
  .st[data-s=resolved]{background:var(--ok-bg);color:var(--ok)}
  .more{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;width:100%;font-size:14px;font-weight:600;color:var(--brand);border-top:1px solid var(--line-subtle)}
  .more:hover{background:var(--hover)}
  .empty{padding:44px 20px;text-align:center;color:var(--ink-2);font-size:14px}
  .empty b{display:block;font-size:16px;color:var(--ink-1);margin-bottom:4px}

  /* list controls */
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
  .search{display:flex;align-items:center;gap:8px;height:42px;flex:1 1 320px;max-width:460px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-3)}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;color:var(--ink-1)}
  .catseg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:#EDEEF0}
  .catseg button{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .catseg button[data-c]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--td)}
  .catseg button b{font-weight:600;color:var(--ink-3)}
  .catseg button[aria-pressed=true]{background:#fff;color:var(--ink-1);box-shadow:0 0 0 1px var(--line)}
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .filters label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .sel{height:36px;padding:0 30px 0 11px;border:1px solid var(--line);border-radius:9px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239CA3AF' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 9px center/14px;appearance:none;font-size:13.5px;font-weight:500;color:var(--ink-1)}
  [dir=rtl] .sel{padding:0 11px 0 30px;background-position:left 9px center}
  .active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink-2)}
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-1)}
  [dir=rtl] .chip{padding:0 11px 0 6px}
  .chip button{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--ink-3)}
  .chip button:hover{background:#EDEEF0}
  .listhead{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font-size:13px;color:var(--ink-2)}
  .listhead .grow{flex:1}

  /* explain box (review / complaints) */
  .explain{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:16px 18px;border-radius:14px;background:#fff;border:1px solid var(--line)}
  .explain .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
  .explain h3{font-size:15px;font-weight:700}

const aname = a => a==="admin"?"Super Admin":a==="darb"?(AR()?"مندوب درب":"livreur Darb"):a;

const MOMIC = {call:"phone",transit:"truck",door:"door",after:"boxok"};
const av = a => a==="darb" ? `<span class="av" style="background:${AGC.darb}">${IC.truck}</span>` : `<span class="av" style="background:${AGC[a]||"#6B7280"}">${esc(aname(a)[0].toUpperCase())}</span>`;
const insOf = id => INS.find(i => i.id === id);
const evidenceOf = i => E.filter(e => e.ins.includes(i.id) && !e.ignored);
const newUnlinked = i => E.filter(e => !e.review && !e.ignored && i.match && i.match(e) && !e.ins.includes(i.id));
const live = e => !e.ignored && !e.review;
const perFrom = () => S.per==="d7" ? "2026-09-24" : S.per==="d30" ? "2026-09-01" : "0000";
function sentence(e){ const t = T(), m = t.momPhrase[e.mom]; return e.agent==="darb" ? t.notedBy(m) : t.saidTo(esc(aname(e.agent)), m); }

/* ═══════════ Shell ═══════════ */
function sidebar(){
  const t = T(), me = t.me[S.role], unread = E.filter(e=>live(e)&&e.unread).length;
  return `<aside class="sb"><div class="brand"><i>O</i>Ordra</div><div class="mk">${t.market}<span>${t.marketSub}</span></div>
    ${t.nav.filter(s=>!(s[2]==="sa"&&S.role!=="super_admin")).map(([sec, items]) => `<div class="sec">${sec}</div>${items.map(it => { const on = it===(AR()?"صوت العميل":"Voix du client"); return `<a class="it ${on?"on":""}">${it}${on&&unread?`<span class="n num">${unread}</span>`:""}</a>`; }).join("")}`).join("")}
    <div class="grow"></div><div class="me"><i>${me[0][0]}</i><div><b>${me[0]}</b><span>${me[1]}</span></div></div></aside>`;
}
function tabs(){
  const t = T();
  const openC = E.filter(e=>live(e)&&e.cat==="reclamation"&&e.status&&e.status!=="resolved").length, rev = E.filter(e=>!e.ignored&&e.review).length;
  const items = [["overview",""],["all",E.filter(live).length,""],["complaints",openC,"hot"],["insights",INS.length,"ins"]].concat(rev?[["review",rev,"warn"]]:[]);
  return `<div class="tabs" role="tablist">${items.map(([k,n,cls])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k||(k==="all"&&S.tab==="unread")}">${t.tabs[k]}${n!==""&&n!==undefined?`<span class="n ${cls||""} num">${n}</span>`:""}</button>`).join("")}</div>
    <p class="tabdesc">${t.tabdesc[S.tab]}</p>`;
}

/* ═══════════ Overview ═══════════ */
function overview(){
  const t = T();
  const open = E.filter(e=>live(e)&&e.cat==="reclamation"&&e.status&&e.status!=="resolved").sort((a,b)=>a.date<b.date?-1:1);
  const unassigned = open.filter(e=>!e.owner).length, oldest = open[0];
  const revC = E.filter(e=>!e.ignored&&e.review&&e.src==="courier").length, revI = E.filter(e=>!e.ignored&&e.review&&e.src==="import").length;
  const unread = E.filter(e=>live(e)&&e.unread).length;
  const todo = (n, accent, ink, label, body, go, tabTo) => n ? `<button class="card todo" style="--accent:${accent};--accent-ink:${ink}" data-go="${tabTo}"><div class="big"><b class="num">${n}</b><span>${label}</span></div>${body}<span class="go">${go}${IC.arrow}</span></button>`
    : `<div class="card todo done"><div class="big"><b>✓</b><span>${t.todoDone}</span></div></div>`;
  const s1 = `<section class="section"><div class="shead"><div><h2>${t.todoT}</h2><p>${t.todoS}</p></div></div><div class="grid3">
    ${todo(open.length,"#D72C0D","#D72C0D",t.todo1(open.length),`<p>${t.todo1s(unassigned,oldest?dd(oldest.date,TODAY):0)}</p>${oldest?`<div class="qt q">${esc(oldest.note)}</div>`:""}`,t.todo1go,"complaints")}
    ${todo(revC+revI,"#B98900","#8A5A00",t.todo2(revC+revI),`<p>${t.todo2s(revC,revI)}</p>`,t.todo2go,"review")}
    ${todo(unread,"#15803D","#15803D",t.todo3(unread),`<p>${t.todo3s}</p>`,t.todo3go,"unread")}</div></section>`;

  const from = perFrom(), pool = E.filter(e=>live(e)&&e.date>=from);
  const cards = CATS.map(c => {
    const xs = pool.filter(e=>e.cat===c), cnt = {};
    xs.forEach(e => { const k = e.topic||"-"; cnt[k]=(cnt[k]||0)+1; });
    const top = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,4), max = top.length ? cnt[top[0]] : 1;
    const ex = xs.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
    return `<div class="card catcard" data-c="${c}"><div class="hd"><span class="dot"></span><h3>${t.catPlural[c]}</h3><span class="cnt num">${xs.length}</span></div>
      <p class="desc">${t.catLong[c]}</p>
      <div><h4>${t.topTopics}</h4><ul class="tlist">${top.map(k=>`<li><button data-drill="${c}|${k}"><span class="lb">${k==="-"?t.noTopic:esc(toplabel(c,k))}</span><span class="bar"><i style="width:${cnt[k]/max*100}%"></i></span><span class="v num">${cnt[k]}</span></button></li>`).join("")||`<li style="color:var(--ink-3);font-size:13.5px">—</li>`}</ul></div>
      ${ex?`<div class="example"><small>${t.example}</small><div class="qt q">${esc(ex.note)}</div><div class="ctx">${pname(ex.p)} · ${t.momPhrase[ex.mom]}</div></div>`:""}
      <button class="go" data-drill="${c}|">${t.seeAll(xs.length,t.catPlural[c])}${IC.arrow}</button></div>`;
  }).join("");
  const s2 = `<section class="section"><div class="shead"><div><h2>${t.sayT}</h2><p>${t.sayS}</p></div><div class="end"><select class="sel" id="ovPer">${Object.keys(t.per).map(k=>`<option value="${k}" ${S.per===k?"selected":""}>${t.per[k]}</option>`).join("")}</select></div></div><div class="grid3">${cards}</div></section>`;

  const mc = {call:0,transit:0,door:0,after:0}; pool.forEach(e => mc[e.mom]++);
  const s3 = `<section class="section"><div class="shead"><div><h2>${t.whereT}</h2><p>${t.whereS}</p></div></div><div class="grid4">
    ${Object.keys(mc).map(m=>`<button class="card moment ${mc[m]?"":"empty"}" data-mom-go="${m}"><div class="top"><span class="mic">${IC[MOMIC[m]]}</span><b class="num">${mc[m]}</b></div><h3>${t.momT[m]}</h3><p>${t.momD[m]}</p></button>`).join("")}</div>
    <p class="hintline">${IC.info}<span>${t.whereHint}</span></p></section>`;

  const ins = INS.filter(i=>i.st!=="done"&&i.st!=="dismissed").sort((a,b)=>(a.st==="progress"?0:1)-(b.st==="progress"?0:1)).slice(0,3);
  const s4 = `<section class="section"><div class="shead"><div><h2>${t.insT}</h2><p>${t.insS}</p></div><div class="end"><button class="btn sm" data-newins>${IC.plus}${t.newIns}</button></div></div>
    <div class="card">${ins.map(irow).join("")}<button class="more" data-go="insights">${t.allIns}${IC.arrow}</button></div></section>`;

  const latest = E.filter(live).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,5);
  const s5 = `<section class="section"><div class="shead"><div><h2>${t.latestT}</h2><p>${t.latestS}</p></div></div>
    <div class="card">${latest.map(e=>frow(e,{noCb:true})).join("")}<button class="more" data-go="all">${t.allFb}${IC.arrow}</button></div></section>`;
  return s1 + s2 + s3 + s4 + s5;
}
function irow(i){
  const t = T(), ev = evidenceOf(i), nu = newUnlinked(i).length, mc = {};
  ev.forEach(e => mc[e.mom]=(mc[e.mom]||0)+1);
  const parts = ["call","transit","door","after"].filter(m=>mc[m]).map(m=>t.evPart[m](mc[m])).join(", ");
  return `<button class="irow" data-ipeek="${i.id}"><span>${ist(i.st)}</span><div><h3 class="q">${esc(i.title[S.lang])}</h3><p class="why">${esc(i.note[S.lang])}</p>
    <p class="ev">${t.ev(ev.length, parts||"—")}</p>${nu?`<span class="new">${t.newUnl(nu)}</span>`:""}</div>
    <span class="own">${i.owner?`${av(i.owner==="Super Admin"?"admin":"hend")}${i.owner}`:t.noOwner}</span></button>`;
}
function frow(e, o={}){
  const t = T(), age = dd(e.date, TODAY), sel = S.sel.has(e.id);
  const ins = e.ins.length ? insOf(e.ins[0]) : null;
  const topic = toplabel(e.cat, e.topic);
  const right = e.status ? `${stp(e.status)}<span>${t.ownerLine(e.owner)}</span>` : `<span>${t.ago(age)}</span>`;
  return `<div class="frow" data-id="${e.id}" ${S.focus===e.id?"data-focus":""} ${sel?"data-sel":""} ${S.peek===e.id?"data-peek":""} ${e.unread?"data-unread":""} ${o.noCb?'style="grid-template-columns:minmax(0,1fr) auto"':""}>
    ${o.noCb?"":`<span class="cb" role="checkbox" data-cb="${e.id}" aria-checked="${sel}">${sel?IC.check:""}</span>`}
    <div style="min-width:0"><div class="l1">${e.unread?`<span class="udot" title="${AR()?"غير مقروءة":"Non lu"}"></span>`:""}${tag(e.cat)}<span class="qt">${esc(e.note)}</span></div>
      <div class="l2">${topic?`<b>${esc(topic)}</b> — `:""}${sentence(e)}${e.status?`, ${t.ago(age)}`:""}.</div>
      <div class="l3"><span class="q">${pname(e.p)}</span> · <span class="q">${esc(e.cust.name)}</span> · <span class="num">#${e.ref}</span></div>
      ${ins?`<span class="l4">${IC.bulb}${t.linkedTo} <span class="q">${esc(ins.title[S.lang])}</span></span>`:""}</div>
    <div class="end">${right}</div></div>`;
}

/* ═══════════ Tous les retours ═══════════ */
function listPool(){
  const q = S.q.trim(), from = perFrom();
  return E.filter(e => live(e) && e.date >= from && (!S.cat || e.cat === S.cat) && (!S.mom || e.mom === S.mom) && (!S.prod || e.p === S.prod)
    && (!S.agent || e.agent === S.agent) && (!S.topic || e.topic === S.topic) && (S.tab!=="unread" || e.unread)
    && (!q || e.note.includes(q) || e.cust.name.includes(q) || e.ref.toLowerCase().includes(q.toLowerCase())))
    .sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : a.ref < b.ref ? 1 : -1);
}
const bucketOf = e => { const d = dd(e.date, TODAY); return d<=0?"today":d===1?"yesterday":d<7?"week":d<30?"month":"older"; };
function allTab(){
  const t = T(), base = E.filter(e=>live(e)&&e.date>=perFrom()), cc = {}; base.forEach(e=>cc[e.cat]=(cc[e.cat]||0)+1);
  const xs = listPool(), shown = xs.slice(0, S.limit);
  const agents = [...new Set(E.filter(live).map(e=>e.agent))], prods = Object.keys(PROD).filter(k=>E.some(e=>live(e)&&e.p===k));
  const chips = [];
  if (S.tab==="unread") chips.push([t.todo3(2).replace(/^./,c=>c.toUpperCase()),"unread"]);
  if (S.topic) chips.push([toplabel(S.cat||E.find(e=>e.topic===S.topic)?.cat, S.topic),"topic"]);
  if (S.mom) chips.push([t.momT[S.mom],"mom"]);
  if (S.prod) chips.push([pname(S.prod),"prod"]);
  if (S.agent) chips.push([aname(S.agent),"agent"]);
  let body = "", last = "";
  shown.forEach(e => { const b = bucketOf(e); if (b !== last){ body += `<div class="fgroup">${t.buckets[b]}</div>`; last = b; } body += frow(e); });
  if (!xs.length) body = `<div class="empty"><b>${t.emptyT}</b>${t.emptyS}</div>`;
  return `<div class="controls"><label class="search">${IC.search}<input id="q" value="${esc(S.q)}" placeholder="${t.search}"></label>
      <div class="catseg"><button data-setcat="" aria-pressed="${!S.cat}">${t.allCats} <b class="num">${base.length}</b></button>${CATS.map(c=>`<button data-c="${c}" data-setcat="${c}" aria-pressed="${S.cat===c}" title="${t.catShort[c]}">${t.catPlural[c]} <b class="num">${cc[c]||0}</b></button>`).join("")}</div>
      <button class="btn" data-filters>${IC.filter}${S.filtersOpen?t.lessFilters:t.moreFilters}</button></div>
    ${S.filtersOpen?`<div class="filters">
      <label>${t.fMoment}<select class="sel" id="fMom"><option value="">${t.anyM}</option>${Object.keys(t.momT).map(m=>`<option value="${m}" ${S.mom===m?"selected":""}>${t.momT[m]}</option>`).join("")}</select></label>
      <label>${t.fProduct}<select class="sel" id="fProd"><option value="">${t.anyP}</option>${prods.map(k=>`<option value="${k}" ${S.prod===k?"selected":""}>${pname(k)}</option>`).join("")}</select></label>
      <label>${t.fAgent}<select class="sel" id="fAgent"><option value="">${t.anyA}</option>${agents.map(a=>`<option value="${a}" ${S.agent===a?"selected":""}>${aname(a)}</option>`).join("")}</select></label>
      <label>${t.fPer}<select class="sel" id="fPer">${Object.keys(t.per).map(k=>`<option value="${k}" ${S.per===k?"selected":""}>${t.per[k]}</option>`).join("")}</select></label></div>`:""}
    ${chips.length?`<div class="active">${chips.map(([l,k])=>`<span class="chip"><span class="q">${esc(l)}</span><button data-unset="${k}">${IC.x}</button></span>`).join("")}<button class="btn link" data-clearall>${t.clear}</button></div>`:""}
    <div class="listhead"><span>${t.results(xs.length)}</span><span class="grow"></span><span><kbd>j</kbd> <kbd>k</kbd> · <kbd>${AR()?"Enter":"Entrée"}</kbd> · <kbd>x</kbd></span></div>
    <div class="card">${body}${xs.length>S.limit?`<button class="more" data-more>${t.showMore(Math.min(25, xs.length-S.limit))}</button>`:""}</div>`;
}

/* ═══════════ Réclamations ═══════════ */
function complaintsTab(){
  const t = T(), xs = E.filter(e=>live(e)&&e.cat==="reclamation"&&e.status);
  return ["open","in_progress","resolved"].map(s => {
    const ys = xs.filter(e=>e.status===s).sort((a,b)=>a.date<b.date?-1:1).slice(0, s==="resolved"?5:99);
    return `<section class="section"><div class="shead"><div><h2>${t.cmpSec[s]} <span class="num" style="color:var(--ink-3);font-weight:600">· ${xs.filter(e=>e.status===s).length}</span></h2><p>${t.cmpSecD[s]}</p></div></div>
      <div class="card">${ys.length?ys.map(e=>{const age=dd(e.date,TODAY);return `<div class="frow" data-id="${e.id}" ${S.peek===e.id?"data-peek":""} style="grid-template-columns:minmax(0,1fr) auto">
        <div style="min-width:0"><div class="l1"><span class="qt">${esc(e.note)}</span></div><div class="l2"><b>${esc(toplabel(e.cat,e.topic)||"—")}</b> — ${sentence(e)}.</div>
        <div class="l3"><span class="q">${pname(e.p)}</span> · <span class="q">${esc(e.cust.name)}</span> · <span class="num">#${e.ref}</span></div></div>
        <div class="end"><span style="${s!=="resolved"&&age>3?"color:var(--crit);font-weight:700":""}">${s==="resolved"?t.ago(age):t.waits(age)}</span><span>${t.ownerLine(e.owner)}</span>${s!=="resolved"?`<button class="btn sm pri" data-treat="${e.id}">${t.treat}</button>`:""}</div></div>`;}).join(""):`<div class="empty">—</div>`}</div></section>`;
  }).join("");
}

/* ═══════════ Insights ═══════════ */

/* ═══════════ À vérifier ═══════════ */
function reviewTab(){
  const t = T(), xs = E.filter(e=>!e.ignored&&e.review);
  if (!xs.length) return `<div class="explain"><span class="ico" style="background:var(--ok-bg);color:var(--ok)">${IC.check}</span><div><h3>${t.rvDone}</h3></div></div>`;
  const sec = (src, title, desc) => { const ys = xs.filter(e=>e.src===src).sort((a,b)=>a.date<b.date?1:-1); if (!ys.length) return "";
    return `<section class="section"><div class="shead"><div><h2>${title} <span class="num" style="color:var(--ink-3);font-weight:600">· ${ys.length}</span></h2><p>${desc}</p></div><div class="end"><button class="btn sm" data-keepall="${src}">${IC.check}${t.keepAll(ys.length)}</button></div></div>
      <div class="card">${ys.slice(0, src==="import"?8:99).map(e=>`<div class="frow rv" data-id="${e.id}" style="grid-template-columns:minmax(0,1fr);cursor:default">
        <div><div class="src">${src==="courier"?IC.truck:IC.import}${src==="courier"?t.rvNoted(fdate(e.date)):t.rvImported(fdate(e.date))} · <span class="q">${pname(e.p)}</span> · <span class="num">#${e.ref}</span></div>
          <div class="l1"><span class="qt" style="white-space:normal">${esc(e.note)}</span></div>
          <div class="prop">${t.rvProp} ${tag(e.cat)}${e.topic?`<span>${esc(toplabel(e.cat,e.topic))}</span>`:""}</div>
          ${S.fixing===e.id?`<div class="picker">${CATS.map(c=>`<button data-c="${c}" data-fixcat="${c}" aria-pressed="${e.cat===c}"><b>${t.cat[c]}</b><small>${t.catShort[c]}</small></button>`).join("")}</div>`:""}
          <div class="acts"><button class="btn sm pri" data-keep="${e.id}">${IC.check}${t.keep}</button><button class="btn sm" data-fix="${e.id}">${t.fix}</button><button class="btn sm" data-ignore="${e.id}">${t.ignore}</button></div></div></div>`).join("")}
        ${ys.length>8&&src==="import"?`<button class="more" data-go="review">${t.showMore(ys.length-8)}</button>`:""}</div></section>`; };
  return `<div class="explain"><span class="ico" style="background:var(--warn-bg);color:var(--warn)">${IC.eye}</span><div><h3>${t.rvExplainT}</h3><p>${t.rvExplain}</p></div></div>` +
    sec("courier", t.rvCourier, t.rvCourierD) + sec("import", t.rvImport, t.rvImportD);
}

/* ═══════════ Drawers ═══════════ */
const visibleList = () => S.tab==="all"||S.tab==="unread" ? listPool().slice(0, S.limit) : S.tab==="complaints" ? E.filter(e=>live(e)&&e.cat==="reclamation"&&e.status) : E.filter(live).sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
function peekFeedback(e){
  const t = T(), rows = visibleList(), idx = rows.findIndex(x=>x.id===e.id);
  const said = e.agent==="darb" ? t.notedLong(t.momPhrase[e.mom], fdate(e.date)) : t.saidLong(aname(e.agent), t.momPhrase[e.mom], fdate(e.date));
  let follow = "";
  if (e.status) {
    const tlx = (e.tl||[]).map(x=>`<li><i></i><span>${(t.tl[x.k]||"").replace("{a}",aname(x.a||"")).replace("{o}",x.o||t.unassigned).replace("{s}",x.s?t.st[x.s]:"")}<small>${fdate(x.d)}</small></span></li>`).join("");
    follow = `<div class="dsec"><h3>${t.follow}</h3><div class="steps">${["open","in_progress","resolved"].map(s=>`<button data-s="${s}" data-cst="${s}" aria-pressed="${e.status===s}">${t.st[s]}</button>`).join("")}</div>
      <dl class="kv" style="margin-top:14px"><dt>${t.owner}</dt><dd><select class="sel" id="owner">${OWNERS.map(o=>`<option value="${o}" ${e.owner===o?"selected":""}>${o||t.unassigned}</option>`).join("")}</select></dd></dl>
      <label style="display:block;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink-2)">${t.resNote}</label><textarea class="ta" id="res" placeholder="${t.resPh}">${esc(e.resolution)}</textarea>${S.resErr?`<p class="err">${t.resErr}</p>`:""}<ul class="tl">${tlx}</ul></div>`;
  }
  const linked = e.ins.map(insOf).filter(Boolean), picks = INS.filter(i=>!e.ins.includes(i.id));
  return `<div class="veil" data-closepeek></div><aside class="drawer" role="dialog">
    <div class="hd"><h2>${t.dTitle}</h2><span class="grow"></span><button class="ibtn" data-step="-1" title="${t.prev}">${IC.up}</button><button class="ibtn" data-step="1" title="${t.next}">${IC.dn}</button><button class="ibtn" data-closepeek>${IC.x}</button></div>
    <div class="bd">
      <div class="dsec"><h3>${t.whatSaid}</h3><div class="bigq"><span dir="auto" style="display:block">${esc(e.note)}</span></div><p class="said">${esc(said)}</p></div>
      <div class="dsec"><h3>${t.class}</h3><div class="catpick">${CATS.map(c=>`<button data-c="${c}" data-setcat2="${c}" aria-pressed="${e.cat===c}"><b>${t.cat[c]}</b><small>${t.catShort[c]}</small></button>`).join("")}</div>
        <p style="font-size:12.5px;color:var(--ink-3);margin-top:12px">${t.topicOpt}</p><div class="tpick" style="margin-top:6px">${TOPICS[e.cat].map(([k,f,a])=>`<button data-c="${e.cat}" data-settopic="${k}" aria-pressed="${e.topic===k}">${AR()?a:f}</button>`).join("")}</div></div>
      <div class="dsec"><h3>${t.context}</h3><dl class="kv">
        <dt>${t.kWhen}</dt><dd>${IC[MOMIC[e.mom]]}<span>${t.momT[e.mom]}</span><span style="font-size:12.5px;color:var(--ink-3)">· ${t.autoMom}</span></dd>
        <dt>${t.kCust}</dt><dd><span class="q">${esc(e.cust.name)}</span><span class="num" style="color:var(--ink-2)">${e.cust.phone}</span><a class="lnk">${t.history}${IC.ext}</a></dd>
        <dt>${t.kOrder}</dt><dd><span class="num">#${e.ref}</span><a class="lnk">${t.open}${IC.ext}</a></dd>
        <dt>${t.kProduct}</dt><dd><span class="q">${pname(e.p)}</span><a class="lnk">${t.sheet}${IC.ext}</a></dd></dl></div>
      ${follow}
      <div class="dsec"><h3>${t.links}</h3>${linked.map(i=>`<div class="lcard">${IC.bulb}<div class="grow"><b class="q">${esc(i.title[S.lang])}</b><small>${t.evid(evidenceOf(i).length)}</small></div>${ist(i.st)}</div>`).join("")}
        ${S.linking?`<div class="pick">${picks.map(i=>`<button data-linkto="${i.id}">${IC.bulb}<span class="q">${esc(i.title[S.lang])}</span><small>${t.evid(evidenceOf(i).length)}</small></button>`).join("")}<button data-newins-one="${e.id}">${IC.plus}<span>${t.createFrom}</span></button></div>`
          :`<div style="display:flex;gap:8px"><button class="btn sm" data-linking>${IC.bulb}${t.linkIns}</button><button class="btn sm" data-newins-one="${e.id}">${IC.plus}${t.mkIns}</button></div>`}</div>
    </div>
    <div class="ft"><span><kbd>j</kbd> <kbd>k</kbd> ${t.next.toLowerCase()} / ${t.prev.toLowerCase()}</span><span class="grow"></span>${idx>=0?`<span class="num">${t.pos(idx+1, rows.length)}</span>`:""}</div></aside>`;
}
function peekInsight(i){
  const t = T(), ev = evidenceOf(i), nu = newUnlinked(i);
  const mini = (e, act) => `<div class="mini"><div style="min-width:0"><div class="qt">${esc(e.note)}</div><small>${t.cat[e.cat]} · <span class="q">${pname(e.p)}</span> · ${t.momPhrase[e.mom]} · ${fdate(e.date)}</small></div>${act||""}</div>`;
  return `<div class="veil" data-closepeek></div><aside class="drawer" role="dialog" style="width:580px">
    <div class="hd"><h2>${t.iTitle}</h2><span class="grow"></span><button class="ibtn" data-closepeek>${IC.x}</button></div>
    <div class="bd"><div class="dsec"><h2 class="q" style="font-size:22px;font-weight:700;line-height:1.35">${esc(i.title[S.lang])}</h2></div>
      <div class="dsec"><h3>${t.iStatus}</h3><div class="steps" style="grid-template-columns:repeat(4,1fr)">${["study","progress","done","dismissed"].map(s=>`<button data-i="${s}" data-ist="${s}" aria-pressed="${i.st===s}">${t.ist[s]}</button>`).join("")}</div>
        <dl class="kv" style="margin-top:14px"><dt>${t.iOwner}</dt><dd><select class="sel" id="iowner">${OWNERS.map(o=>`<option value="${o}" ${i.owner===o?"selected":""}>${o||t.noOwner}</option>`).join("")}</select></dd></dl></div>
      <div class="dsec"><h3>${t.iWhy}</h3><textarea class="ta">${esc(i.note[S.lang])}</textarea></div>
      ${nu.length?`<div class="dsec"><h3 style="display:flex;align-items:center;gap:8px">${t.iNew(nu.length)}<span style="flex:1"></span><button class="btn sm ins" data-linkall="${i.id}">${t.linkAll}</button></h3><p style="font-size:13px;color:var(--ink-2);margin:-2px 0 6px">${t.iNewS}</p>${nu.slice(0,5).map(e=>mini(e,`<button class="btn sm" data-link1="${i.id}|${e.id}">${t.link}</button>`)).join("")}</div>`:""}
      <div class="dsec"><h3>${t.iEvid(ev.length)}</h3>${ev.slice(0,10).map(e=>mini(e)).join("")}</div></div></aside>`;
}
function modal(){
  const t = T(), ev = S.modal.ids.map(id=>E.find(e=>e.id===id));
  const cnt = {}; ev.forEach(e => { const k=e.cat+":"+e.topic; cnt[k]=(cnt[k]||0)+1; });
  const top = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0], guess = top ? toplabel(...top.split(":")) : "";
  return `<div class="mveil" data-closemodal><div class="modal" role="dialog" data-stop><div class="mh"><h3>${t.mTitle}</h3><p>${t.mSub}</p></div>
    <div class="mb"><label class="l">${t.mName}</label><input class="in q" id="mTitle" value="${esc(S.modal.title ?? guess)}" placeholder="${t.mNamePh}">
      <label class="l">${t.mNote}</label><textarea class="ta" id="mNote" placeholder="${t.mNotePh}"></textarea>
      <div class="two"><div><label class="l">${t.mStatus}</label><select class="sel" id="mSt" style="width:100%">${["study","progress","done"].map(s=>`<option value="${s}">${t.ist[s]}</option>`).join("")}</select></div>
        <div><label class="l">${t.mOwner}</label><select class="sel" id="mOw" style="width:100%">${OWNERS.map(o=>`<option value="${o}">${o||t.noOwner}</option>`).join("")}</select></div></div>
      <label class="l">${t.mEv()} <small>· ${t.mEvN(ev.length)}</small></label>${ev.map(e=>`<div class="mini"><div style="min-width:0"><div class="qt">${esc(e.note)}</div><small>${t.cat[e.cat]} · <span class="q">${pname(e.p)}</span></small></div></div>`).join("")}</div>
    <div class="mf"><span style="font-size:12px;color:var(--ink-3)"><kbd>Ctrl</kbd>+<kbd>↵</kbd></span><span class="grow"></span><button class="btn" data-closemodal>${t.cancel}</button><button class="btn ins" data-createins>${IC.bulb}${t.create}</button></div></div></div>`;
}
const bulk = () => { const t = T(), n = S.sel.size; if (!n) return ""; return `<div class="bulk"><b>${t.selected(n)}</b><button class="btn ins" data-mkins>${IC.bulb}${t.mkIns}</button><button class="btn" data-markread>${t.markRead}</button><button class="x" data-clearsel>${IC.x}</button></div>`; };
const toast = () => S.toast ? `<div class="toast">${IC.check}<span>${S.toast.msg}</span>${S.toast.see?`<button data-seeins="${S.toast.see}">${T().see}</button>`:""}</div>` : "";

/* ═══════════ Notes for the owner ═══════════ */
const NOTES = {
  overview:`<b>v4 — refonte.</b> Plus de barre de vues, de puces ni de « Grouper ». <b>Cinq onglets</b>, chacun avec une phrase qui dit à quoi il sert. La <b>Vue d'ensemble</b> se lit de haut en bas : <b>À faire</b> (3 cartes avec une phrase et un bouton) → <b>Ce que disent les clients</b> (les 3 catégories, chacune avec sa définition, ses sujets fréquents et une phrase réelle) → <b>Où les clients nous parlent</b> (les 4 moments, expliqués) → <b>Ce que nous en avons appris</b> (les insights, avec leurs preuves en toutes lettres) → <b>Les derniers retours</b>. Tout est cliquable vers la liste filtrée.`,
  all:`<b>Tous les retours.</b> Une seule liste, groupée par date (Aujourd'hui, Hier, Cette semaine…). Chaque ligne se lit comme une phrase : la catégorie, les mots du client, puis « <i>Pas de cash maintenant — dit à tasnim pendant l'appel de confirmation</i> ». Les filtres secondaires (moment, produit, agent, période) sont rangés derrière « Plus de filtres ». Cochez des lignes pour créer un insight.`,
  unread:`<b>À lire.</b> La même liste, limitée à ce que personne n'a ouvert. Ouvrir une ligne la marque lue pour toute l'équipe.`,
  complaints:`<b>Réclamations.</b> Trois blocs dans l'ordre du travail : À traiter → En cours → Résolues. Chaque ligne dit depuis combien de temps elle attend et qui s'en occupe ; « Traiter » ouvre le suivi.`,
  insights:`<b>Insights.</b> Groupés par statut. Chaque insight dit sa leçon, pourquoi, et ses preuves en toutes lettres (« Appuyé par 20 retours — 14 à l'appel, 5 à la porte »).`,
  review:`<b>À vérifier.</b> Un encadré explique d'abord d'où viennent ces phrases. Chaque ligne dit qui l'a notée et quand, propose une catégorie, et offre trois gestes : Garder · Corriger · Ignorer.`,
};

/* ═══════════ Render ═══════════ */
function render(){
  const t = T();
  document.documentElement.lang = S.lang;
  document.getElementById("note").innerHTML = NOTES[S.tab] || "";
  [["segLang","lang"],["segRole","role"]].forEach(([id,k]) => document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S[k])));
  const body = S.tab==="overview" ? overview() : S.tab==="complaints" ? complaintsTab() : S.tab==="insights" ? insightsTab() : S.tab==="review" ? reviewTab() : allTab();
  const pe = S.peek && E.find(e=>e.id===S.peek), pi = S.ipeek && insOf(S.ipeek);
  document.getElementById("root").innerHTML = `<div class="app" dir="${AR()?"rtl":"ltr"}">${sidebar()}<main class="main"><div class="wrap">
    <p class="crumb">${t.crumb}</p><div class="ph"><div><h1>${t.title}</h1><p>${t.sub}</p></div><div class="end"><button class="btn">${IC.down}${t.export}</button></div></div>
    ${tabs()}${body}</div></main>${pe?peekFeedback(pe):""}${pi?peekInsight(pi):""}${S.modal?modal():""}${bulk()}${toast()}</div>`;
  history.replaceState(null, "", location.pathname + "?" + new URLSearchParams({lang:S.lang, tab:S.tab, role:S.role}));
}
function goTab(tab, extra={}){ Object.assign(S,{tab, cat:"", mom:"", prod:"", agent:"", topic:"", q:"", limit:25, peek:null, ipeek:null, focus:null, fixing:null}, extra); S.sel.clear(); render(); window.scrollTo(0,0); }
function openPeek(id){ const e = E.find(x=>x.id===id); if (!e) return; Object.assign(S,{peek:id, ipeek:null, focus:id, linking:false, resErr:false}); e.unread = false; render(); }
function flash(msg, see){ S.toast = {msg, see}; render(); clearTimeout(S.tt); S.tt = setTimeout(()=>{ S.toast=null; render(); }, 3500); }
function keepFocus(id){ render(); const el = document.getElementById(id); if (el){ el.focus(); const v = el.value||""; el.setSelectionRange && el.setSelectionRange(v.length, v.length); } }
function keep(e){ e.review = false; e.unread = true; e.tl.push({k:"confirmed",d:TODAY,a:S.role==="super_admin"?"Super Admin":"Manager LY"}); if (e.cat==="reclamation" && !e.status) e.status = "open"; }
function createInsight(){
  const title = (document.getElementById("mTitle").value || "").trim(); if (!title) return;
  const note = document.getElementById("mNote").value.trim();
  const i = { id:"n"+Date.now(), st:document.getElementById("mSt").value, owner:document.getElementById("mOw").value, created:TODAY, title:{fr:title, ar:title}, note:{fr:note||"—", ar:note||"—"}, match:null };
  INS.unshift(i); S.modal.ids.forEach(id => { const e = E.find(x=>x.id===id); if (e && !e.ins.includes(i.id)) e.ins.unshift(i.id); });
  S.modal = null; S.sel.clear(); flash(T().created, i.id);
}
document.addEventListener("click", ev => {
  const g = ev.target.closest.bind(ev.target); let el;
  if ((el = g("#segLang button,#segRole button"))){ S[el.parentElement.id==="segLang"?"lang":"role"] = el.dataset.v; return render(); }
  if (S.modal){ if (g("[data-createins]")) return createInsight(); if (ev.target.matches("[data-closemodal]") || (g("[data-closemodal]") && !g("[data-stop]")) || g(".mf [data-closemodal]")) { S.modal = null; return render(); } return; }
  if ((el = g("[data-tab]"))) return goTab(el.dataset.tab);
  if ((el = g("[data-go]"))){ const to = el.dataset.go; return to==="unread" ? goTab("unread") : goTab(to); }
  if ((el = g("[data-drill]"))){ const [c,k] = el.dataset.drill.split("|"); return goTab("all", {cat:c, topic:k&&k!=="-"?k:""}); }
  if ((el = g("[data-mom-go]"))) return goTab("all", {mom:el.dataset.momGo, filtersOpen:true});
  if ((el = g("[data-setcat]"))){ S.cat = el.dataset.setcat; S.topic = ""; S.limit = 25; return render(); }
  if (g("[data-filters]")){ S.filtersOpen = !S.filtersOpen; return render(); }
  if ((el = g("[data-unset]"))){ const k = el.dataset.unset; if (k==="unread") S.tab = "all"; else S[k] = ""; return render(); }
  if (g("[data-clearall]")){ Object.assign(S,{mom:"",prod:"",agent:"",topic:""}); if (S.tab==="unread") S.tab="all"; return render(); }
  if (g("[data-more]")){ S.limit += 25; return render(); }
  if ((el = g("[data-cb]"))){ ev.stopPropagation(); const id = el.dataset.cb; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.focus = id; return render(); }
  if ((el = g("[data-keep]"))){ keep(E.find(x=>x.id===el.dataset.keep)); S.fixing=null; return flash(T().kept); }
  if ((el = g("[data-keepall]"))){ E.filter(e=>!e.ignored&&e.review&&e.src===el.dataset.keepall).forEach(keep); return render(); }
  if ((el = g("[data-fix]"))){ S.fixing = S.fixing===el.dataset.fix ? null : el.dataset.fix; return render(); }
  if ((el = g("[data-fixcat]"))){ const e = E.find(x=>x.id===S.fixing); if (e.cat!==el.dataset.fixcat){ e.cat = el.dataset.fixcat; e.topic = null; } return render(); }
  if ((el = g("[data-ignore]"))){ E.find(x=>x.id===el.dataset.ignore).ignored = true; return render(); }
  if ((el = g("[data-treat]"))){ ev.stopPropagation(); return openPeek(el.dataset.treat); }
  if ((el = g("[data-ipeek]"))){ Object.assign(S,{ipeek:el.dataset.ipeek, peek:null}); return render(); }
  if (g("[data-closepeek]")){ S.peek = null; S.ipeek = null; return render(); }
  if ((el = g("[data-step]"))){ const rows = visibleList(), i = rows.findIndex(x=>x.id===S.peek), n = rows[i + +el.dataset.step]; if (n) openPeek(n.id); return; }
  if ((el = g("[data-setcat2]"))){ const e = E.find(x=>x.id===S.peek); if (e.cat!==el.dataset.setcat2){ e.cat = el.dataset.setcat2; e.topic = null; if (e.cat==="reclamation" && !e.status) e.status = "open"; if (e.cat!=="reclamation") e.status = null; } return render(); }
  if ((el = g("[data-settopic]"))){ const e = E.find(x=>x.id===S.peek); e.topic = e.topic===el.dataset.settopic ? null : el.dataset.settopic; return render(); }
  if ((el = g("[data-cst]"))){ const e = E.find(x=>x.id===S.peek), s = el.dataset.cst, note = document.getElementById("res").value.trim();
    if (s==="resolved" && !note){ S.resErr = true; return render(); } S.resErr = false; e.resolution = note; if (e.status!==s){ e.status = s; e.tl.push({k:"status",d:TODAY,s,a:S.role==="super_admin"?"Super Admin":"Manager LY"}); } return render(); }
  if (g("[data-linking]")){ S.linking = true; return render(); }
  if ((el = g("[data-linkto]"))){ E.find(x=>x.id===S.peek).ins.unshift(el.dataset.linkto); S.linking = false; return flash(T().linked); }
  if ((el = g("[data-ist]"))){ insOf(S.ipeek).st = el.dataset.ist; return render(); }
  if ((el = g("[data-link1]"))){ const [iid, eid] = el.dataset.link1.split("|"); E.find(x=>x.id===eid).ins.push(iid); return render(); }
  if ((el = g("[data-linkall]"))){ const i = insOf(el.dataset.linkall); newUnlinked(i).forEach(e=>e.ins.push(i.id)); return render(); }
  if (g("[data-mkins]")){ S.modal = {ids:[...S.sel]}; render(); return document.getElementById("mTitle")?.select(); }
  if ((el = g("[data-newins-one]"))){ S.modal = {ids:[el.dataset.newinsOne]}; render(); return document.getElementById("mTitle")?.select(); }
  if (g("[data-newins]")){ S.modal = {ids:[], title:""}; render(); return document.getElementById("mTitle")?.focus(); }
  if (g("[data-markread]")){ S.sel.forEach(id=>{ E.find(x=>x.id===id).unread = false; }); S.sel.clear(); return render(); }
  if (g("[data-clearsel]")){ S.sel.clear(); return render(); }
  if ((el = g("[data-seeins]"))){ const id = el.dataset.seeins; goTab("insights"); S.ipeek = id; S.toast = null; return render(); }
  if ((el = g(".main .frow[data-id]")) && !g(".rv")) return openPeek(el.dataset.id);
});
document.addEventListener("change", ev => {
  const id = ev.target.id, v = ev.target.value;
  if (id==="ovPer" || id==="fPer"){ S.per = v; return render(); }
  if (id==="fMom"){ S.mom = v; return render(); }
  if (id==="fProd"){ S.prod = v; return render(); }
  if (id==="fAgent"){ S.agent = v; return render(); }
  if (id==="owner"){ const e = E.find(x=>x.id===S.peek); e.owner = v; e.tl.push({k:"assigned",d:TODAY,a:"Manager LY",o:v}); return render(); }
  if (id==="iowner"){ insOf(S.ipeek).owner = v; return render(); }
});
document.addEventListener("input", ev => { if (ev.target.id==="q"){ S.q = ev.target.value; S.limit = 25; keepFocus("q"); } });
const editable = el => el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT");
document.addEventListener("keydown", ev => {
  if (S.modal){ if (ev.key==="Escape"){ S.modal = null; return render(); } if (ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)) return createInsight(); return; }
  if (ev.key==="Escape"){ if (S.peek||S.ipeek){ S.peek = null; S.ipeek = null; return render(); } if (S.sel.size){ S.sel.clear(); return render(); } }
  if (editable(ev.target) || !["all","unread","complaints"].includes(S.tab)) return;
  const rows = visibleList(); if (!rows.length) return;
  const cur = S.peek || S.focus, i = rows.findIndex(x=>x.id===cur);
  const go = n => { if (S.peek) return openPeek(n.id); S.focus = n.id; render(); document.querySelector(`.frow[data-id="${n.id}"]`)?.scrollIntoView({block:"nearest"}); };
  if (ev.key==="j"||ev.key==="ArrowDown"){ ev.preventDefault(); return go(rows[Math.min(i+1, rows.length-1)] || rows[0]); }
  if (ev.key==="k"||ev.key==="ArrowUp"){ ev.preventDefault(); return go(rows[Math.max(i-1, 0)] || rows[0]); }
  if (ev.key==="Enter" && S.focus && !S.peek){ ev.preventDefault(); return openPeek(S.focus); }
  if (ev.key==="x" && (S.focus||S.peek) && S.tab!=="complaints"){ ev.preventDefault(); const id = S.peek||S.focus; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); return render(); }
});
render();
</script>
</body>
</html>
