<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<title>Ordra — WhatsApp côté manager (v1)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v1 — WhatsApp Business (Cloud API) vu par le MANAGER et le SUPER_ADMIN. Construit 2026-09-25.
  Plan : plans/whatsapp-cloud-api.md (Phase 0). Console claire de docs/design-system.md, barre latérale
  sombre, atomes de manager-console-v1.html ; cartes de connexion de settings/MetaAdsSection.tsx ;
  interrupteurs et cartes d'option de settings/general ; la feuille de campagne de
  prospects/console/CampaignSheet.tsx (audience · canal · distribution).
  Écrans :
   · connexions  — Système › Connexions › Services : une carte WhatsApp par marché (identifiants chiffrés,
                   test par étapes, qualité, palier, modèles, dernier webhook), le bloc « à coller dans Meta ».
   · modeles     — la table des modèles synchronisés, l'événement que chaque modèle sert, la création en un
                   clic du catalogue Ordra, le tiroir d'un modèle refusé.
   · parametres  — Paramètres › WhatsApp : l'interrupteur général, les cinq événements, la langue par défaut,
                   la plage d'envoi, et les deux bandeaux qui empêchent une mauvaise surprise.
   · messages    — Clients › Messages : les conversations sans commande ni prospect, à rattacher.
   · campagne    — la feuille de campagne en mode « numéro Ordra » : le corps avec ses variables, l'image,
                   la soumission à Meta, l'approbation, le lancement.
  URL : ?lang=fr|ar &screen=connexions|modeles|parametres|messages|campagne &role=super_admin|manager
        &tstatus=pending|approved|rejected
-->
<style>
:root{
  --page:#F6F6F7; --card:#FFFFFF; --hover:#F7F7F7; --sunken:#FAFAFB; --text:#1A1A1A; --text2:#6D7175; --line:#ECEEF0; --border:#E1E3E5; --border-strong:#C9CCCF;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-line:#BBF7D0; --brand-deep:#14532D;
  --sb:#0E1013; --sb-el:#14171C; --sb-text:#E6E8EB; --sb-text2:#B5BAC2; --sb-muted:#7F858F; --sb-active:#10B981;
  --action:#2C6ECB; --action-bg:#EAF1FB; --success:#008060; --success-bg:#F1F8F5; --warning:#B98900; --warning-bg:#FFF8E6; --critical:#D72C0D; --critical-bg:#FFF4F4; --neutral:#6D7175; --neutral-bg:#F6F6F7;
  --wa:#15803D; --wa-btn:#1E8E5A; --wa-bubble:#E8F6EE;
  --studio:#E9EBEE; --studio-ink:#2B2F36;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--studio);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.q{unicode-bidi:plaintext}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* studio (always LTR) */
.studio{padding:18px 20px 40px;direction:ltr}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1520px;margin:0 auto 12px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:#6B7280;font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:#6B7280;border:0;background:none}
.seg button[aria-pressed=true]{background:#111;color:#fff}
.note{max-width:1520px;margin:0 auto 14px;font-size:12.5px;color:#6B7280;line-height:1.55}
.note b{color:#374151}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:1px 4px;border-radius:4px}
.stage{max-width:1520px;margin:0 auto;position:relative}
.hscroll{overflow-x:auto}

/* frame */
.frame{width:1420px;height:960px;border:1px solid #C9CDD3;border-radius:12px;overflow:hidden;background:var(--page);display:flex;text-align:start;position:relative}
[dir=rtl] .frame{direction:rtl}
.sb{width:224px;flex:0 0 auto;background:var(--sb);color:var(--sb-text);padding:14px 12px;display:flex;flex-direction:column;gap:1px;font-size:13.5px;overflow-y:auto;scrollbar-width:none}
.sb .logo{font-weight:700;padding:6px 10px 12px;color:#fff;font-size:17px}
.sb .logo small{display:block;font-weight:400;color:var(--sb-muted);font-size:12px}
.sb .mk{margin:0 4px 10px;padding:8px 10px;border-radius:8px;background:var(--sb-el);color:var(--sb-text2);font-size:12.5px;display:flex;justify-content:space-between}
.sb .sh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-muted);padding:12px 10px 4px}
.sb a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;color:var(--sb-text);text-decoration:none;cursor:pointer}
.sb a[aria-current=page]{background:#1B2027;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--sb-active)}
[dir=rtl] .sb a[aria-current=page]{box-shadow:inset -3px 0 0 var(--sb-active)}
.sb a .n{margin-inline-start:auto;background:var(--warning-bg);color:var(--warning);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700}
.sb a .n[data-wa]{background:#D1FAE5;color:#065F46}
.sb .ro{margin:auto 4px 0;padding:8px 10px;border-radius:8px;background:var(--sb-el);color:var(--sb-text2);font-size:12px;line-height:1.4}
.mc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex:0 0 auto}
.top h1{font-size:20px;font-weight:600;margin:0}
.top .sub{color:var(--text2);font-size:13px}
.top .crumb{color:var(--text2);font-size:13px;margin-bottom:2px}
.top .cta{margin-inline-start:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;font-weight:500;font-size:13.5px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn[data-primary]{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn[data-primary]:hover{background:var(--brand-hover)}
.btn[data-danger]{color:var(--critical);border-color:#F2B8AE}
.btn[data-quiet]{border-color:transparent;background:transparent;color:var(--text2)}
.btn[disabled]{opacity:.5}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 24px 28px;scrollbar-width:thin}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:9px 14px;border:0;background:transparent;color:var(--text2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-current=true]{color:var(--text);border-bottom-color:var(--brand);font-weight:600}
.tab b{margin-inline-start:6px;font-weight:600;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--text2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card h2 .r{margin-inline-start:auto;font-weight:400;color:var(--text2);font-size:12.5px;display:flex;align-items:center;gap:8px}
.card .pad{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.badge[data-s=neutral]{background:var(--neutral-bg);color:var(--neutral)}
.badge[data-s=warn]{background:var(--warning-bg);color:var(--warning)}
.badge[data-s=info]{background:var(--action-bg);color:var(--action)}
.badge[data-s=ok]{background:var(--success-bg);color:var(--success)}
.badge[data-s=bad]{background:var(--critical-bg);color:var(--critical)}
.badge[data-s=draft]{background:#fff;border:1px solid var(--border);color:var(--text2)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:start;font-weight:600;color:var(--text2);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunken);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr[data-click]{cursor:pointer}
table.t tbody tr:hover td{background:var(--hover)}
table.t tr[aria-selected=true] td{background:var(--brand-bg)}
.fl{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:4px;display:block}
.fi{display:block;width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;background:#fff;margin-bottom:10px;color:var(--text)}
.fi:focus{outline:2px solid var(--brand);outline-offset:1px}
.fi[readonly]{background:var(--sunken)}
textarea.fi{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--sunken);align-items:center}
.foot .sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0;font-size:13px;color:var(--text2)}
.sw i{width:34px;height:20px;border-radius:999px;background:#CBD0D6;position:relative;transition:background .15s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] i{background:var(--brand)}
.sw[aria-checked=true] i::after{transform:translateX(14px)}
[dir=rtl] .sw[aria-checked=true] i::after{transform:translateX(-14px)}
.sw[disabled]{opacity:.55}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .k{font-weight:500}
.set .h{color:var(--text2);font-size:12.5px;margin-top:2px}
.set .tpls{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.set .fi{margin:0}
.set .unit{display:flex;gap:8px;align-items:center}
.set .unit span{color:var(--text2);font-size:12.5px;white-space:nowrap}
.set[data-master]{background:var(--sunken)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;text-align:start}
.opt[aria-pressed=true]{border:1.5px solid var(--brand);background:var(--brand-bg)}
.opt b{font-size:13.5px}
.opt span{font-size:12px;color:var(--text2)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;line-height:1.45}
.notice svg{width:16px;height:16px;margin-top:1px}
.notice b{font-weight:600}
.notice[data-tone=warn]{background:var(--warning-bg);color:#7A5B00;border:1px solid #F5E1A4}
.notice[data-tone=info]{background:var(--action-bg);color:#1F4F94;border:1px solid #C9DBF5}
.notice[data-tone=bad]{background:var(--critical-bg);color:#9A2A14;border:1px solid #F5C6BC}
.notice[data-tone=ok]{background:var(--success-bg);color:#065F46;border:1px solid #BFE3D2}
.toast{position:absolute;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#1A1A1A;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast[data-on=true]{opacity:1}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--text2)}
.kv dd{margin:0;display:flex;align-items:center;gap:8px;min-width:0}
.kv dd .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .cp{border:0;background:none;color:var(--text2);padding:2px;display:inline-grid;place-items:center;border-radius:4px}
.kv .cp:hover{background:var(--hover)}
.kv .rv{border:0;background:none;color:var(--action);font-size:12.5px;font-weight:600;padding:0}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* connexions — market card */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.mcard .mh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mcard .mh .flag{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--neutral-bg);color:var(--text2);font-weight:700;font-size:12px}
.mcard .mh h3{margin:0;font-size:14.5px;font-weight:600}
.mcard .mh .sub{font-size:12.5px;color:var(--text2)}
.mcard .mh .badge{margin-inline-start:auto}
.health{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.health div{padding:10px 12px;border-inline-end:1px solid var(--line);min-width:0}
.health div:last-child{border-inline-end:0}
.health .l{font-size:11.5px;color:var(--text2)}
.health .v{font-size:13px;font-weight:600;margin-top:2px;display:flex;align-items:flex-start;gap:6px;line-height:1.3}
.health .v i{margin-top:4px}
.health .v i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.health .v i[data-q=GREEN]{background:#16A34A}.health .v i[data-q=YELLOW]{background:#EAB308}.health .v i[data-q=RED]{background:#DC2626}.health .v i[data-q=NA]{background:#CBD0D6}
.health .s{font-size:11.5px;color:var(--text2);margin-top:1px}
.stages{list-style:none;margin:0;padding:6px 0}
.stages li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:6px 14px;font-size:13px;align-items:start}
.stages li b{font-weight:600}
.stages li span{color:var(--text2)}
.stages li .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stages li .ic svg{width:12px;height:12px;stroke-width:3}
.stages li[data-s=ok] .ic{background:var(--success)}
.stages li[data-s=warn] .ic{background:var(--warning)}
.stages li[data-s=bad] .ic{background:var(--critical)}
.stages li[data-s=skip] .ic{background:#CBD0D6}
.mcard .acts{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--sunken)}
.mcard .acts .sp{flex:1}
.mcard .form{padding:14px;border-top:1px solid var(--line)}
.mcard .form .fi{margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipm{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--neutral-bg);font-size:12px;font-weight:600;color:var(--text)}
.chipm.mono{font-weight:500}

/* modeles */
.mseg{display:inline-flex;gap:4px;padding:3px;border-radius:8px;background:var(--neutral-bg);margin-bottom:12px}
.mseg button{padding:6px 12px;border:0;border-radius:6px;background:none;font-weight:500;color:var(--text2)}
.mseg button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.evsel{padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:13px;min-width:150px}
.evsel[data-none]{color:var(--text2)}
.drawer{position:absolute;inset:0;background:rgba(17,24,39,.28);z-index:50;display:flex;justify-content:flex-end}
.drawer .dp{width:520px;height:100%;background:#fff;border-inline-start:1px solid var(--border);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dh .x{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:#fff}
.drawer .db{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;scrollbar-width:thin}
.drawer .df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunken)}
pre.json{margin:0;padding:12px;border-radius:8px;background:#0E1013;color:#E6E8EB;font-size:12px;line-height:1.5;overflow:auto;direction:ltr;text-align:left}
pre.json .k{color:#93C5FD}.json .s{color:#A7F3D0}.json .n{color:#FCD34D}
.waprev{border-radius:12px;background:#E5DDD5;padding:14px 12px 12px;display:flex;flex-direction:column;gap:6px;min-height:180px}
.waprev .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#374151}
.waprev .hd .av{width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.waprev .hd .tm{margin-inline-start:auto;font-size:11px;color:#6B7280}
.waprev .img{width:70%;aspect-ratio:4/3;border-radius:10px 10px 0 0;border:1px solid #CBEBC3;border-bottom:0;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><circle cx='22' cy='22' r='13' fill='%23F9D5C0'/><rect x='17' y='9' width='10' height='26' rx='4' fill='%23E8946A'/></svg>") center/38% no-repeat}
.waprev .bub{position:relative;width:70%;background:#DCF8C6;border:1px solid #CBEBC3;border-radius:0 10px 10px 10px;padding:8px 10px 18px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;unicode-bidi:plaintext}
.waprev .bub[data-img]{border-radius:0 0 10px 10px}
.waprev .bub .ft{display:block;margin-top:6px;font-size:12px;color:#6B7280}
.waprev .bub .tk{position:absolute;bottom:4px;inset-inline-end:8px;font-size:10.5px;color:#5B7A57}
.waprev mark{background:#B5E7B0;border-radius:4px;padding:0 3px;color:inherit}
.waprev .re{align-self:flex-end;background:#fff;border-radius:10px 2px 10px 10px;padding:8px 10px;font-size:13.5px}
.waprev .re small{display:block;font-size:11px;color:#6B7280;margin-top:3px}

/* messages */
.convs{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:14px;align-items:start}
.conv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;width:100%;text-align:start;border-inline:0;border-top:0;background:#fff}
.conv:last-child{border-bottom:0}
.conv:hover{background:var(--hover)}
.conv[aria-selected=true]{background:var(--brand-bg)}
.conv .av{width:40px;height:40px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;font-weight:700;color:var(--text2)}
.conv .nm{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:baseline}
.conv .nm .ph{font-weight:400;color:var(--text2);font-size:12.5px}
.conv .lm{font-size:13px;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.conv .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--text2)}
.conv .un{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.thread{padding:12px 14px;background:var(--sunken);display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.msg{max-width:82%;display:flex;flex-direction:column;gap:3px}
.msg[data-dir=in]{align-self:flex-start}.msg[data-dir=out]{align-self:flex-end}
.msg .bub{padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;unicode-bidi:plaintext;border:1px solid transparent}
.msg[data-dir=in] .bub{background:#fff;border-color:var(--line);border-start-start-radius:4px}
.msg[data-dir=out] .bub{background:var(--wa-bubble);border-color:#CDEBD9;border-start-end-radius:4px}

.attach{padding:12px 14px;border-top:1px solid var(--line)}

.attach .res button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:start;font-size:13px}
.attach .res button:last-child{border-bottom:0}

.attach .res .sub{color:var(--text2);font-size:12px}

.csheet{position:absolute;inset:0;background:rgba(17,24,39,.28);z-index:50;display:flex;justify-content:flex-end}

.csheet .ch{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.csheet .ch h3{margin:0;font-size:17px;font-weight:600;flex:1}
.csheet .ch .x{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:#fff}
.steps{display:flex;gap:0;border-bottom:1px solid var(--line)}
.step{flex:1;padding:12px 16px;display:flex;gap:10px;align-items:center;color:var(--text2);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.step i{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;flex:0 0 auto}
.step[aria-current=true]{color:var(--text);font-weight:600;border-bottom-color:var(--brand)}
.step[aria-current=true] i{background:var(--brand);color:#fff;border-color:var(--brand)}
.step[data-done=true] i{background:var(--brand-bg);color:var(--brand-hover);border-color:var(--brand-bg)}
.csheet .cb{flex:1;min-height:0;overflow-y:auto;padding:16px 20px;scrollbar-width:thin}
.csheet .cf{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--sunken);align-items:center}
.chan{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}

.chan span{font-size:12.5px;color:var(--text2);line-height:1.35}

.rule svg{width:13px;height:13px}

.imgpick .t{flex:1;font-size:13px}
.imgpick .t small{display:block;color:var(--text2);font-size:12px}

.tstat svg{width:18px;height:18px;margin-top:1px}
.tstat b{display:block}

.tstat[data-s=approved]{background:var(--success-bg);border:1px solid #BFE3D2;color:#065F46}
.tstat[data-s=rejected]{background:var(--critical-bg);border:1px solid #F5C6BC;color:#9A2A14}
.tstat .acts{display:flex;gap:8px;margin-top:8px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.summary div{padding:10px 12px;border-inline-end:1px solid var(--line)}
.summary div:last-child{border-inline-end:0}
.summary .l{font-size:11.5px;color:var(--text2)}
.summary .v{font-size:16px;font-weight:600;margin-top:2px}

.ccard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ccard .h{display:flex;align-items:center;gap:10px}

.ccard .h .badge{margin-inline-start:auto}
.ccard .sub{font-size:12.5px;color:var(--text2);margin-top:2px}

.funnel .l{font-size:11px;color:var(--text2)}
.funnel .v{font-size:16px;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><label class="fl" style="margin:0">${T.cBody}</label><span style="flex:1"></span><div class="lseg"><button data-clang="ar" aria-pressed="${c.lang==="ar"}">العربية</button><button data-clang="fr" aria-pressed="${c.lang==="fr"}">Français</button></div></div>

          <div class="vars"><span>${T.cVars} :</span>${["{nom}","{produit}","{ville}","{remise}"].map(v=>`<button data-var="${v}">${v}</button>`).join("")}<span style="margin-inline-start:auto" class="num">${body.length} / 1024</span></div>
          <div class="rule" ${bad||starts?"data-bad":""}>${bad||starts?I.warn:I.info}<span>${bad||starts?T.cRuleBad:T.cRule}</span></div>
          <label class="sw" style="margin-bottom:10px"><input type="checkbox" hidden><i style="${c.img?"background:var(--brand)":""}"></i><span style="color:var(--text)">${I.image} ${T.cImg}</span></label>
          ${c.img?`<div class="imgpick"><span class="th"></span><span class="t">Sérum vitamine C — 50 ml<small>${T.cImgSub}</small></span><button class="btn sm">${T.cImgChange}</button></div>`:""}
          <div class="row3"><div><label class="fl">${T.cWin}</label><select class="fi"><option>10-20 h</option><option>9-13 h</option><option>14-21 h</option></select></div><div><label class="fl">${T.cRate}</label><input class="fi num" type="number" value="${c.rate}"><div style="font-size:11.5px;color:var(--text2);margin-top:-6px">${T.cRateH}</div></div>${c.channel==="wa_call"?`<div><label class="fl">${T.cThen}</label><input class="fi num" type="number" value="${c.then}"><div style="font-size:11.5px;color:var(--text2);margin-top:-6px">${T.cThenH}</div></div>`:""}</div>
        </div>
        <div><label class="fl">${T.cPrev}</label>
          <div class="waprev"><div class="hd"><span class="av">O</span><b>Ordra Libya</b><span class="tm">10:42</span></div>${c.img?`<div class="img"></div>`:""}<div class="bub" ${c.img?"data-img":""} dir="${c.lang==="ar"?"rtl":"ltr"}">${rendered||"…"}<span class="ft">${T.cFooter}</span><span class="tk">10:42 ✓✓</span></div><div class="re">${T.cReply}<small>${T.cReplyCap}</small></div></div>
          ${summary}
        </div>
      </div>
    </div>
    <div class="cf"><button class="btn">${T.back}</button><span style="flex:1"></span>
      ${st==="approved"?`<button class="btn" data-primary data-launch>${I.send}${T.launch}</button>`:st==="rejected"?`<button class="btn" data-primary>${I.pen}${T.resubmit}</button>`:`<button class="btn" data-primary disabled>${I.send}${T.launch}</button>`}
    </div></div></div>`;
}

/* ═════════ Render + notes + wiring ═════════ */
const NOTES={
 connexions:`<b>Écran 1 — Connexions › Services.</b> La carte « bientôt » d'aujourd'hui devient une carte par marché, sur le modèle de Meta Ads : identifiants masqués (chiffrés côté serveur, colonnes révoquées du rôle authentifié), <b>test par étapes</b> (identifiants → numéro → WABA → abonnement de l'app → webhook), qualité, palier, modèles, dernier webhook. La Libye montre l'état intermédiaire réel d'un compte neuf : connecté, non vérifié (250/jour), 14 modèles en attente, aucun webhook reçu — et le formulaire ouvert. Le bloc du bas est ce qu'on colle dans l'app Meta ; une seule URL pour les deux portefeuilles. Bascule <code>market_manager</code> : tout en lecture seule.`,
 modeles:`<b>Écran 2 — Modèles.</b> Un tableau par marché de ce que Meta a synchronisé : langue, catégorie, statut, et surtout <b>l'événement que le modèle sert</b> (un seul modèle par événement et par langue — la base le garantit). « Créer les modèles Ordra » soumet tout le catalogue en un clic. Cliquez la ligne <code>ordra_delivered_v1 · ar</code> : le tiroir montre le motif de refus de Meta, l'aperçu, et le JSON exact envoyé.`,
 parametres:`<b>Écran 3 — Paramètres › WhatsApp.</b> Un interrupteur général, puis les cinq événements, chacun coupé par défaut et portant l'état de ses modèles (fr · ar). Les deux bandeaux sont la sécurité : le compte non vérifié (250/jour) et l'événement activé sans modèle approuvé (« rien n'est perdu, rien ne part » — la file attend l'approbation). La langue par défaut ne sert qu'aux clients dont un agent n'a pas encore choisi la langue ; la plage d'envoi empêche un message à 3 h du matin quand Darb synchronise la nuit.`,
 messages:`<b>Écran 4 — Clients › Messages.</b> Ce qui arrive sur le numéro sans correspondre à une commande vivante ni à un prospect : une liste courte, la conversation, la réponse (fenêtre ouverte puisque le client vient d'écrire), et « Rattacher à » qui cherche par nom ou numéro dans les commandes et les prospects, ou crée un prospect. Une fois rattachée, la conversation quitte cette liste et vit dans la commande. Les agents n'ont pas cette page : leurs fils sont sur leurs commandes.`,
 campagne:`<b>Écran 5 — la campagne en mode « numéro Ordra ».</b> La feuille est celle d'aujourd'hui (audience · canal · distribution) ; en choisissant « Depuis le numéro Ordra », le message devient un <b>modèle marketing</b> : corps avec variables à insérer, règle de Meta (ni début ni fin par une variable, vérifiée en direct — effacez le dernier mot du corps), image en en-tête, pied de désabonnement ajouté d'office, aperçu tel que le client le verra. « Soumettre » crée le modèle chez Meta et la campagne attend ; le bandeau du haut suit <code>?tstatus=</code> : en attente, approuvé (résumé + « Lancer »), refusé (motif + resoumettre). Derrière, la carte de campagne montre le statut du modèle et l'entonnoir en file → envoyés → remis → lus → réponses → échecs.`
};
function render(){
  document.documentElement.dir=isAr()?"rtl":"ltr"; document.documentElement.lang=S.lang;
  $("#note").innerHTML=NOTES[S.screen]||"";
  [["segLang","lang"],["segRole","role"],["segScreen","screen"],["segT","tstatus"]].forEach(([id,key])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[key])));
  $("#segT").style.visibility=S.screen==="campagne"?"visible":"hidden";
  $("#sb").innerHTML=sidebar(); $("#over").innerHTML="";
  ({connexions:renderConnexions,modeles:renderModeles,parametres:renderParametres,messages:renderMessages,campagne:renderCampagne})[S.screen]();
  const u=new URLSearchParams({lang:S.lang,screen:S.screen,role:S.role}); if(S.screen==="campagne")u.set("tstatus",S.tstatus);
  history.replaceState(null,"",location.pathname+"?"+u);
}
document.addEventListener("click",e=>{
  const seg=e.target.closest("#segLang button,#segRole button,#segScreen button,#segT button");
  if(seg){S[{segLang:"lang",segRole:"role",segScreen:"screen",segT:"tstatus"}[seg.parentElement.id]]=seg.dataset.v;S.drawer=null;return render();}
  const go=e.target.closest("[data-go]"); if(go){e.preventDefault();S.screen=go.dataset.go;S.drawer=null;return render();}
  const rv=e.target.closest("[data-reveal]"); if(rv){S.reveal[rv.dataset.reveal]=!S.reveal[rv.dataset.reveal];return render();}
  const ed=e.target.closest("[data-edit]"); if(ed){S.edit=ed.dataset.edit||null;return render();}
  const sv=e.target.closest("[data-save]"); if(sv){sv.innerHTML=`<span class="spin"></span>${isAr()?"جارٍ التحقق لدى Meta…":"Vérification auprès de Meta…"}`;setTimeout(()=>{S.edit=null;S.tested[sv.dataset.save]=true;render();toast(isAr()?"تم التحقق والحفظ (مشفّر)":"Vérifié auprès de Meta et enregistré (chiffré)")},1100);return;}
  const ts=e.target.closest("[data-test]"); if(ts){ts.innerHTML=`<span class="spin" style="border-color:rgba(0,0,0,.2);border-top-color:#111"></span>${t().test}`;setTimeout(()=>{S.tested[ts.dataset.test]=true;render()},900);return;}
  const mk=e.target.closest("[data-market]"); if(mk){S.market=mk.dataset.market;return render();}
  const tp=e.target.closest("[data-tpl]"); if(tp&&!e.target.closest("select")){S.drawer=+tp.dataset.tpl;return render();}
  if(e.target.closest("[data-sync]")){toast(isAr()?"تمت المزامنة · 15 قالباً":"Synchronisé · 15 modèles, 1 statut mis à jour");return;}
  if(e.target.closest("[data-create]")){toast(isAr()?"أُرسل 14 قالباً إلى Meta":"14 modèles soumis à Meta · approbation en attente");return;}
  const sw=e.target.closest("[data-sw]"); if(sw&&!sw.disabled){S.settings[sw.dataset.sw]=!S.settings[sw.dataset.sw];return render();}
  const pl=e.target.closest("[data-plang]"); if(pl&&!pl.disabled){S.settings.lang=pl.dataset.plang;return render();}
  if(e.target.closest("[data-psave]")){toast(t().saved);return;}
  const cv=e.target.closest("[data-conv]"); if(cv){S.conv=cv.dataset.conv;S.cSent=null;S.cText="";return render();}
  if(e.target.closest("[data-csend]")){if(!S.cText.trim())return;S.cSent=S.cText;S.cText="";return render();}
  const ch=e.target.closest("[data-chan]"); if(ch){S.camp.channel=ch.dataset.chan;return render();}
  const sd=e.target.closest("[data-sender]"); if(sd){S.camp.sender=sd.dataset.sender;return render();}
  const cl=e.target.closest("[data-clang]"); if(cl){S.camp.lang=cl.dataset.clang;S.camp.body=cl.dataset.clang==="fr"?"Bonjour {nom}, deux mois ont passé depuis votre {produit}.\n{remise} cette semaine, livraison offerte à {ville}.\nRépondez OUI et on prépare votre commande.":"مرحباً {nom}، مرّ شهران على طلبك {produit}.\nلك {remise} هذا الأسبوع، التوصيل مجاني في {ville}.\nردّ بنعم ونجهّز طلبك.";return render();}
  const vr=e.target.closest("[data-var]"); if(vr){S.camp.body+=vr.dataset.var;return render();}
  if(e.target.closest("[data-launch]")){toast(isAr()?"أُطلقت الحملة · 412 في الطابور · أول إرسال 10:00":"Campagne lancée · 412 en file · premier envoi 10:00");return;}
  if(e.target.closest("[data-close]")||e.target.id==="veil"){if(S.screen==="campagne"){S.screen="campagne";$("#over").innerHTML="";return;}S.drawer=null;return render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="cbody"){S.camp.body=e.target.value;const pos=e.target.selectionStart;render();const el=$("#cbody");el.focus();el.setSelectionRange(pos,pos);}
  if(e.target.id==="cta"){S.cText=e.target.value;}
});
render();
</script>
</body>
</html>
