<!doctype html>
<!--
  Agent — prototype v1 (2026-10-04) : les cinq onglets de l'agent dans le langage « Aurore » de commandes-v4.html.
  Remplace, pour l'apparence, prototypes/agent-shell-v1.html (septembre).

  Ce que le propriétaire a demandé : « en suivant le style de commandes-v4, redessine la page commandes de l'agent
  et les autres pages ». Ses réponses (4 oct.) :
  - périmètre = LES CINQ ONGLETS : Commandes (file), CRM (Prospects), Livraison, Mes commissions, Voix du client,
    plus l'en-tête et ses onglets. Commandes est le plus détaillé : la liste, le panneau, le résultat d'appel ;
  - en haut de la file = UNE TUILE PAR SEAU (Nouveau · En cours · Confirmé · Fermées), comme les raccourcis de v4 ;
    la tuile « En cours » vire au rouge quand un rappel est dû ;
  - ORDINATEUR ET TÉLÉPHONE : chaque onglet aux deux tailles (bouton « Format » en haut) ;
  - les autres pages = LE MÊME CONTENU, PLUS CALME : chaque information et chaque action restent ; seuls l'aspect et
    l'ordre de lecture changent ; les bugs trouvés sont corrigés et listés (plans/agent-shell-aurore.md).
  Le panneau d'une commande est celui de commandes-v4 (« un seul panneau pour tous »), avec les quatre issues de l'agent.

  Décisions de l'expert visibles ici : les étapes d'une issue (motif du refus, heure du rappel, transporteur) s'ouvrent
  DANS la commande sur ordinateur, en feuille sur téléphone ; l'heure du rappel s'écrit sur la ligne ; le bouton vert du
  téléphone appelle PUIS ouvre le résultat ; une commande confirmée montre un camion, pas un téléphone ; les trois
  compteurs disent ce qu'ils comptent (depuis minuit) ; « En cours » de Fermées devient « Chez le transporteur ».

  DONNÉES FICTIVES générées dans la page (graine fixe, celle de commandes-v4) : boutiques, produits, clients inventés.
  URL : ?tab=orders|crm|delivery|commissions|voc &dev=phone &lang=ar &bucket=new|cours|conf|closed &open=<réf>
        &sheet=<réf> &tray=reject|callback|send|schedule &demo=call|reject|callback|confirmed|taken|ro|fnew|keys|lead|parcel
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent · Aurore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fa:"Noto Sans Arabic","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:22px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 18px 46px rgba(42,52,110,.13);
  --glass-in:rgba(255,255,255,.72); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7; --line:rgba(15,23,40,.07);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A; --warn:#B54708; --warn-bg:#FFF4E0; --bad:#B42318; --bad-bg:#FEF3F2;
  --flat-bg:rgba(15,23,40,.05); --tip-bg:#101828; --accent:#3538CD; --pbh:45px; --ahh:64px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
/* status families — a pill is a wash + a 1px edge + ink in its own hue (design-system §4.19) */
.h-neutral{--pb:#F2F4F7;--pd:#E4E7EC;--pi:#344054}
.h-amber{--pb:#FFFAEB;--pd:#FEDF89;--pi:#B54708}
.h-violet{--pb:#F4F3FF;--pd:#D9D6FE;--pi:#5925DC}
.h-teal{--pb:#F0FDF9;--pd:#99F6E0;--pi:#107569}
.h-green{--pb:#ECFDF3;--pd:#ABEFC6;--pi:#067647}
.h-red{--pb:#FEF3F2;--pd:#FECDCA;--pi:#B42318}
.h-blue{--pb:#EFF8FF;--pd:#B2DDFF;--pi:#175CD3}
.h-pink{--pb:#FDF2FA;--pd:#FCCEEE;--pi:#C11574}
.h-gold{--pb:#FEF7E6;--pd:#F5DFA8;--pi:#854A0E}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
[lang=ar]{font-family:var(--fa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* prototype bar (always LTR, always French) */
.pbar{position:sticky;top:0;z-index:400;background:#16191E;color:#E6E8EB;padding:8px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;border-bottom:1px solid #000;direction:ltr;font-family:"Plus Jakarta Sans",sans-serif}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2}
.looks button:hover{color:#fff}
.looks button.on{background:#fff;color:#0E1013}

/* ═══ the agent shell — one glass band: the word, the five tabs, then search · availability · me ═══ */
.stage{min-height:calc(100vh - var(--pbh));background:var(--page);background-attachment:fixed}
.ah{position:sticky;top:var(--pbh);z-index:150;height:var(--ahh);display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(255,255,255,.66);border-bottom:1px solid rgba(255,255,255,.95);box-shadow:0 8px 30px rgba(42,52,110,.07);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.word{font:800 18px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:-.03em;color:var(--ink);flex:none;display:flex;align-items:center;gap:8px}
.word i{width:9px;height:9px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
.at{display:flex;gap:3px;padding:4px;border-radius:15px;background:rgba(15,23,40,.045);box-shadow:inset 0 0 0 1px rgba(15,23,40,.035);min-width:0}
.at button{position:relative;height:38px;padding:0 12px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.at button .ic{color:var(--ink-3)}
.at button:hover{color:var(--ink)}
.at button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,40,.12)}
.at button.on .ic{color:var(--brand)}
.nb{font-style:normal;min-width:19px;height:19px;border-radius:10px;padding:0 6px;display:inline-grid;place-items:center;font-size:11px;font-weight:800;background:#DCFCE7;color:#15803D;font-variant-numeric:tabular-nums}
.ah .sp{flex:1}
.gs{display:flex;align-items:center;gap:9px;height:40px;width:clamp(180px,15vw,280px);padding:0 8px 0 12px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);color:var(--ink-3);font-size:13px;font-weight:600}
[dir=rtl] .gs{padding:0 12px 0 8px}
.gs span{flex:1;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs:hover{background:#fff;border-color:rgba(15,23,40,.14)}
.avl{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 12px 0 10px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
[dir=rtl] .avl{padding:0 10px 0 12px}
.avl.on{color:var(--good);border-color:#ABEFC6;background:#F6FEF9}
.tog{width:34px;height:20px;border-radius:99px;background:#D0D5DD;position:relative;flex:none;transition:background .15s}
.tog.on{background:var(--brand)}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.tog.on::after{inset-inline-start:17px}
.me{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px;border-radius:12px;font-size:13px;font-weight:700}
.me:hover{background:rgba(255,255,255,.7)}
.me small{display:none}
.me > span:last-child{display:grid;text-align:start;line-height:1.2}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.who .av{width:24px;height:24px;font-size:10.5px}
@media (max-width:1420px){ .at button .ic{display:none} .at button{padding:0 11px} }
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:color-mix(in srgb,var(--h) 16%,#fff);color:color-mix(in srgb,var(--h) 78%,#000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 28%,#fff)}
.av.sm{width:24px;height:24px;font-size:10.5px}

main{padding:22px 28px 120px}
.page{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* header — workbench scale (H1 24 / 800) */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
[lang=ar] .ph h1{letter-spacing:0}
.sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700}
.live i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--live)}
.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 1.8s ease-out infinite}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:38px;padding:0 15px;border-radius:11px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn .ic{width:15px;height:15px}
.btn:disabled{opacity:.4}
.btn2{height:36px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.88);border:1px solid rgba(15,23,40,.09);color:var(--ink);justify-content:center}
.btn2:hover:not(:disabled){background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2:disabled{opacity:.4}
.btn2 .ic{width:15px;height:15px}
.btn2.neg{color:var(--bad)}
.ph .acts .btn,.ph .acts .btn2{height:40px}
/* the three meters of today's header, kept, now quiet */
.mets{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.met{display:grid;gap:1px;padding:4px 12px;border-radius:10px;min-width:96px;cursor:help}
.met + .met{border-inline-start:1px solid var(--line);border-radius:0}
.met b{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.met span{font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.met b small{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-inline-start:2px}

/* 1 · the buckets — four soft tiles; one is always the list you are working */
.wts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:start;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.wt:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover)}
.wt.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand),var(--card-sh);background:rgba(255,255,255,.92)}
.wt.alarm{border-color:#FDA29B;box-shadow:0 0 0 1.5px #F97066,var(--card-sh)}
.wt.alarm.on{border-color:#D92D20;box-shadow:0 0 0 1.5px #D92D20,var(--card-sh)}
.wt .hold{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.wt .hold .ic{width:20px;height:20px}
.wt-t{display:grid;min-width:0}
.wt b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wt-t > span{font-size:13.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small em{font-style:normal;color:var(--bad);font-weight:700}
.wt.zero b{color:var(--ink-q)}

/* 2 · search — one line */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srch{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);color:var(--ink-3);min-width:240px}
[dir=rtl] .srch{padding:0 14px 0 10px}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;color:var(--ink);min-width:0;font-weight:500}
.srch input::placeholder{color:var(--ink-3)}
.srch:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12),var(--card-sh)}
.kbd2{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid rgba(15,23,40,.12);border-radius:6px;padding:0 6px;line-height:20px;font-family:"Plus Jakarta Sans",sans-serif}
.count{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.count b{color:var(--ink);font-weight:800}
.sortd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.sortd .ic{width:13px;height:13px}

/* 3 · the list — one glass container, plain white rows with hairlines, no motion on rows */
.list{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden;min-width:0}
.lh{height:42px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
[lang=ar] .lh{letter-spacing:0;font-size:12px}
.lh .e,.e{text-align:end}
.rows{background:#fff}
.row{position:relative;min-height:66px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:#F8F9FC}
.row.sel{background:var(--brand-wash)}
.row.open{background:#F4FAF6}
.row.open::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--brand)}
.ck{width:18px;height:18px;border-radius:6px;border:1.5px solid #C9CED7;display:grid;place-items:center;margin:auto;background:#fff;color:#fff}
.ck.on{background:var(--brand);border-color:var(--brand)}
.ck .ic{width:12px;height:12px;stroke-width:3}
.oc{display:flex;align-items:center;gap:12px;min-width:0}
.oc-t{min-width:0;flex:1}
.thumb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--ti);box-shadow:inset 0 0 0 1px rgba(15,23,40,.05);position:relative}
.thumb .ic{width:19px;height:19px}
.thumb .qx{position:absolute;bottom:-5px;inset-inline-end:-6px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.l1{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.l2 b{color:var(--ink-2);font-weight:600}
.l2 .miss{color:var(--warn);font-weight:700}
.amt{text-align:end;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-inline-start:4px;letter-spacing:.02em}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:14px;background:#fff;display:grid;justify-items:center;gap:10px}
.empty .ic{width:30px;height:30px;color:var(--ink-4)}
.empty b{color:var(--ink);font-size:15px}

/* pills and tags — a status says its word; a tag says its number */
.pl{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px 0 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid var(--pd);background:var(--pb);color:var(--pi);max-width:100%;overflow:hidden}
[dir=rtl] .pl{padding:0 8px 0 10px}
.pl span{overflow:hidden;text-overflow:ellipsis}
.pl .ic{width:13px;height:13px}
.tg{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pi);flex:none;cursor:help}
.tg .ic{width:11px;height:11px;stroke-width:2.4}

/* the agent's row: what was done, how long it has waited */
.actv{display:grid;gap:3px;min-width:0}
.actv small{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actv small.no{color:var(--ink-q)}
.agew{display:grid;gap:5px;min-width:0}
.age{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.age .ic{width:12px;height:12px}
.age.late{color:var(--warn);font-weight:800}
.age.vlate{color:var(--bad);font-weight:800}
.gauge{height:4px;border-radius:4px;background:#EEF0F4;overflow:hidden;max-width:120px}
.gauge i{display:block;height:100%;border-radius:4px;background:#98A2B3}
.gauge.late i{background:#F79009}
.gauge.vlate i{background:#F04438}
.sendb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;justify-self:start}
.sendb:hover{background:var(--brand-hover)}
.sendb .ic{width:14px;height:14px}
.sendb.ghost{background:#fff;color:var(--brand);border:1px solid #ABEFC6}

/* the queue: list + the order's own column beside it */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.split.open{grid-template-columns:minmax(0,1fr) 560px}
.qh,.qr{display:grid;grid-template-columns:44px minmax(260px,1fr) 230px 170px 128px;align-items:center;column-gap:12px;padding-inline:6px 18px}
[dir=rtl] .qh,[dir=rtl] .qr{padding-inline:6px 18px}
.split.open .qh,.split.open .qr{grid-template-columns:40px minmax(190px,1fr) 150px 96px 100px}
.split.open .qr .l2 .city{display:none}
@media (max-width:1320px){ .split.open{grid-template-columns:minmax(0,1fr) 500px} .split.open .qh,.split.open .qr{grid-template-columns:36px minmax(170px,1fr) 128px 84px 92px} }

/* the order — the same content, calmer (one panel for managers and agents) */
.pcol{position:sticky;top:calc(var(--pbh) + var(--ahh) + 14px);max-height:calc(100vh - var(--pbh) - var(--ahh) - 28px);display:flex;flex-direction:column;background:#fff;border-radius:22px;border:1px solid rgba(15,23,40,.06);box-shadow:0 18px 50px rgba(42,52,110,.13);overflow:hidden;animation:fade .18s}
.dr-top{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line);flex:none}
[dir=rtl] .dr-top{padding:12px 18px 12px 12px}
.dr-age{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sla{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:800;white-space:nowrap}
.sla.vlate{background:var(--bad-bg);color:var(--bad)}
.sla .ic{width:12px;height:12px}
.sp{flex:1}
.ref{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;direction:ltr}
.ref .ic{width:13px;height:13px;color:var(--ink-3)}
.ref:hover,.xbtn:hover{background:var(--flat-bg)}
.xbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.dr-body{flex:1;overflow:auto;overscroll-behavior:contain;min-height:0}
.pc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:18px 20px 16px;align-items:center}
.pc-n{display:flex;align-items:center;gap:10px;min-width:0}
.pc-n h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rel{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pi);border:1px solid var(--pd);flex:none}
.rel .ic{width:12px;height:12px}
.pc-btns{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px}
.pc-add{grid-column:1 / -1;margin-top:-2px}
.pc-btns .btn,.pc-btns .btn2{height:40px}
.pc-ph{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);flex-wrap:wrap}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mini{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.mini .ic{width:13px;height:13px}
.mini:hover{background:var(--flat-bg);color:var(--ink)}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--brand)}
.lnk .ic{width:13px;height:13px}
.lnk:hover{text-decoration:underline}
.facts{display:grid;grid-template-columns:118px minmax(0,1fr);gap:11px 12px;margin:0;padding:16px 20px 18px;border-top:1px solid var(--line);font-size:13.5px}
.facts dt{color:var(--ink-3);font-weight:600}
.facts dd{margin:0;font-weight:600;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.miss{display:inline-flex;align-items:center;gap:5px;color:var(--warn);font-weight:700}
.miss .ic{width:13px;height:13px}
.q{color:var(--ink-3);font-weight:500}
.tabwrap{position:sticky;top:0;z-index:3;background:#fff;padding:10px 20px;border-top:1px solid var(--line)}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:#F2F4F7}
.tabs button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,40,.14)}
.tabs em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.pane{padding:6px 20px 22px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line b{font-size:14px;font-weight:700;display:block}
.line small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.line .amt{font-size:14.5px;white-space:nowrap}
.line .amt small{display:inline;margin-top:0}
.pane-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pane-acts .btn2{height:34px;font-size:12.5px}
.tot{display:grid;gap:7px;padding:16px 0 0;font-size:13.5px;color:var(--ink-2);font-weight:600}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{color:var(--ink);font-size:16px;font-weight:800;padding-top:8px;border-top:1px solid var(--line)}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding-inline-start:26px;padding-block:7px;font-size:13.5px;font-weight:600}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--pi);box-shadow:0 0 0 3px var(--pb)}
.tl li::after{content:"";position:absolute;inset-inline-start:9px;top:26px;bottom:-8px;width:1.5px;background:#E4E7EC}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.tl li.now{font-weight:800}
.trk,.reco{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F8F9FC;border:1px solid var(--line);margin:8px 0 10px}
.trk .hold,.reco .hold{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.trk div,.reco div{flex:1;display:grid;min-width:0;gap:2px}
.trk small,.reco small{font-size:12px;color:var(--ink-3);font-weight:600}
.trk b{font-size:14px;font-weight:800;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.reco b{font-size:14px;font-weight:800}
.thread{display:grid;gap:8px;margin-top:8px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;background:#F2F4F7;font-family:var(--fa)}
.bub.out{margin-inline-start:auto;background:#DCFAE6;color:#05432A;border-end-end-radius:4px}
.bub.in{border-end-start-radius:4px}
.bub small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;font-family:var(--f);font-weight:600}
.compose{display:flex;gap:8px;margin-top:14px}
.compose input{flex:1;height:40px;border-radius:11px;border:1px solid #D0D5DD;padding:0 12px;font-size:13.5px;min-width:0}
.compose .btn{height:40px}
.thread-empty{display:grid;justify-items:center;gap:6px;padding:26px 10px;color:var(--ink-3);font-size:13px;text-align:center}
.notes{flex:none;display:grid;gap:6px;padding:12px 16px 0;border-top:1px solid var(--line)}
.note{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;font-size:12.5px;font-weight:700;background:var(--pb);color:var(--pi);border:1px solid var(--pd)}
.note .ic{width:14px;height:14px}
.dr-foot{flex:none;display:flex;gap:8px;padding:12px 16px 10px}
.fa{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:0 8px}
.fa span{overflow:hidden;text-overflow:ellipsis}
.fa:hover{background:#F9FAFB}
.fa .ic{width:16px;height:16px}
.fa.pri{background:var(--brand);border-color:var(--brand);color:#fff;flex:1.15}
.fa.pri:hover{background:var(--brand-hover)}
.fa.neg{color:var(--bad)}
.fa.io{flex:none;width:46px;padding:0}
.fa.wide{flex:2}
.fa kbd{font:700 10.5px/18px "Plus Jakarta Sans",sans-serif;padding:0 5px;border-radius:5px;background:rgba(15,23,40,.06);color:var(--ink-3)}
.fa.pri kbd{background:rgba(255,255,255,.2);color:#fff}
.keys{flex:none;padding:0 16px 12px;font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.keys kbd{font:700 10.5px/17px "Plus Jakarta Sans",sans-serif;padding:0 5px;border-radius:5px;border:1px solid rgba(15,23,40,.12);color:var(--ink-2);margin-inline-end:3px}
.pempty{display:grid;place-items:center;align-content:center;gap:10px;min-height:420px;padding:30px;text-align:center;color:var(--ink-3)}
.pempty .ic{width:34px;height:34px;color:var(--ink-4)}
.pempty b{color:var(--ink);font-size:15px}

/* the step a button opens — reasons, a time — slides up inside the order, never a second window */
.tray{flex:none;border-top:1px solid var(--line);background:#FBFCFE;padding:14px 16px 6px;display:grid;gap:12px;animation:upin .2s cubic-bezier(.2,.8,.2,1);max-height:62%;overflow:auto}
.tray-h{display:flex;align-items:center;gap:10px}
.tray-h b{font-size:15px;font-weight:800;flex:1}
.tray-h .hold{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.rg{display:grid;gap:7px}
.rg h6{margin:0;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
[lang=ar] .rg h6{letter-spacing:0;font-size:12px}
.rg h6 .ic{width:13px;height:13px}
.rch{display:flex;gap:6px;flex-wrap:wrap}
.rc{height:34px;padding:0 13px;border-radius:10px;border:1px solid #D0D5DD;background:#fff;font-size:13px;font-weight:700;color:var(--ink-2)}
.rc:hover{border-color:#98A2B3;color:var(--ink)}
.rc.on{background:var(--pb,#FEF3F2);border-color:var(--pi,#B42318);color:var(--pi,#B42318);box-shadow:0 0 0 1px var(--pi,#B42318)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tm2{display:grid;gap:1px;padding:10px 12px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;text-align:start}
.tm2 b{font-size:14px;font-weight:800}
.tm2 small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.tm2:hover{border-color:#98A2B3}
.tm2.on{border-color:#7A5AF8;background:#F4F3FF;box-shadow:0 0 0 1px #7A5AF8}
.tm2.on b{color:#5925DC}
.trayf{display:flex;gap:8px;padding:4px 0 10px}
.trayf .fa{height:42px}
.inp{height:40px;border-radius:11px;border:1px solid #D0D5DD;background:#fff;padding:0 12px;font-size:14px;color:var(--ink);width:100%;font-weight:500}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
textarea.inp{height:64px;padding:10px 12px;resize:vertical;line-height:1.45}
.carr{display:grid;gap:8px}
.cr2{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;border:1px solid #D0D5DD;background:#fff;text-align:start}
.cr2 .rd{width:18px;height:18px;border-radius:50%;border:1.5px solid #C9CED7;display:grid;place-items:center}
.cr2.on{border-color:var(--brand);background:#F6FEF9;box-shadow:0 0 0 1px var(--brand)}
.cr2.on .rd{border-color:var(--brand)}
.cr2.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand)}
.cr2 b{font-size:13.5px;font-weight:800;display:block}
.cr2 small{font-size:12px;color:var(--ink-3);font-weight:600}
.best{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:7px;background:var(--good-bg);color:var(--good);font-size:11px;font-weight:800;margin-inline-start:6px}

/* the takeover screen — a manager is inside this order */
.lockv{display:grid;justify-items:center;gap:12px;padding:40px 26px;text-align:center}
.lockv .hold{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.lockv .hold .ic{width:26px;height:26px}
.lockv b{font-size:17px;font-weight:800}
.lockv p{font-size:13.5px;color:var(--ink-2);max-width:360px}

/* segmented sub-tabs */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid var(--card-bd);box-shadow:var(--card-sh);flex-wrap:wrap}
.seg button{height:36px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,40,.14)}
.seg em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:800;font-variant-numeric:tabular-nums}
.seg button.on em{color:var(--brand)}
.seg-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg-row .hint{font-size:12.5px;color:var(--ink-3);font-weight:600}

/* « Nouvelle commande » — the drawer of the manager page, unchanged */
.scrim{position:fixed;inset:0;top:var(--pbh);z-index:200;background:rgba(15,23,40,.16);animation:fade .2s}
.drawer{position:fixed;top:var(--pbh);bottom:0;inset-inline-end:0;z-index:210;width:min(600px,100vw);background:#fff;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(15,23,40,.06),-30px 0 70px rgba(20,25,60,.18);animation:slide .24s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .drawer{box-shadow:0 0 0 1px rgba(15,23,40,.06),30px 0 70px rgba(20,25,60,.18);animation-name:slideR}
.dr-title{flex:1;display:grid}
.dr-title b{font-size:17px;font-weight:800}
.dr-title small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.fs{margin:16px 20px 0;padding:16px;border-radius:16px;background:#FAFBFD;border:1px solid var(--line);display:grid;gap:13px}
.fs h3{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800}
.fs h3 .hold{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--pb);color:var(--pi)}
.fs h3 .hold .ic{width:15px;height:15px}
.fld{display:grid;gap:6px;min-width:0}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fld label i{color:var(--bad);font-style:normal;margin-inline-start:2px}
.inp-pre{display:flex}
.inp-pre span{display:grid;place-items:center;padding:0 12px;border:1px solid #D0D5DD;border-inline-end:0;border-start-start-radius:11px;border-end-start-radius:11px;background:#F2F4F7;font-weight:700;font-size:13.5px;direction:ltr}
.inp-pre .inp{border-start-start-radius:0;border-end-start-radius:0;direction:ltr;text-align:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;height:40px;border:1px solid #D0D5DD;border-radius:11px;overflow:hidden;background:#fff}
.step button{width:40px;display:grid;place-items:center;color:var(--ink-2)}
.step button:hover{background:#F2F4F7}
.step span{flex:1;display:grid;place-items:center;font-weight:800;border-inline:1px solid #EAECF0}
.calc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--good-bg);color:var(--good)}
.calc b{font-size:17px;font-weight:800}
.calc small{display:block;font-size:12px;font-weight:600;opacity:.85}

/* the bulk bar — white glass, never dark */
.bulk{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 22px 56px rgba(20,25,60,.24);font-size:13px;font-weight:700;animation:rise .2s ease-out;white-space:nowrap}
[dir=rtl] .bulk{padding:8px 16px 8px 8px}
.bulk .vsep{width:1px;height:24px;background:var(--line)}
.bulk .btn2{height:36px}
.lnkb{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:0 8px}
.lnkb:hover{color:var(--ink)}

.tip{position:fixed;z-index:600;pointer-events:none;background:var(--tip-bg);color:#fff;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:340px;line-height:1.45;font-family:var(--f)}
.tip.on{opacity:1;transform:none}

@keyframes pulse{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.9);opacity:0}}
@keyframes slide{from{transform:translateX(48px);opacity:0}}
@keyframes slideR{from{transform:translateX(-48px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes upin{from{opacity:0;transform:translateY(14px)}}
@keyframes sheet{from{transform:translateY(100%)}}
@media (max-width:1220px){ .wts{grid-template-columns:repeat(2,minmax(0,1fr))} .gs{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ═══ the phone — the same pages at 390 px: a top bar, the page, five tabs at the bottom ═══ */
.devwrap{display:flex;justify-content:center;align-items:flex-start;gap:34px;padding:26px 16px 70px;flex-wrap:wrap}
.devnote{width:300px;display:grid;gap:12px;align-self:center;font-size:13px;color:var(--ink-2);font-weight:500;direction:ltr;font-family:"Plus Jakarta Sans",sans-serif}
.devnote b{color:var(--ink);font-weight:800}
.devnote .nt{padding:12px 14px;border-radius:16px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh)}
.devnote .nt h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.devnote button{color:var(--brand);font-weight:700}
.phone{width:390px;height:844px;border-radius:54px;padding:11px;background:#0B0D10;box-shadow:0 34px 90px rgba(20,25,60,.34),inset 0 0 0 2px #2B3038;flex:none;position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:90}
.scr{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--page);display:flex;flex-direction:column;isolation:isolate}
.sbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:700 15px/1 "Plus Jakarta Sans",sans-serif;color:var(--ink);direction:ltr}
.sbar span:last-child{display:flex;gap:5px;align-items:center}
.sbar i{display:block;width:17px;height:11px;border-radius:3px;border:1.5px solid var(--ink);position:relative}
.sbar i::after{content:"";position:absolute;inset:1.5px;width:60%;border-radius:1px;background:var(--ink)}
.mtop{flex:none;display:flex;align-items:center;gap:8px;padding:4px 16px 2px}
.mtitle{flex:none;font-size:26px;font-weight:800;letter-spacing:-.03em;padding:2px 16px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[lang=ar] .mtitle{letter-spacing:0}
.mscroll > *{flex-shrink:0}
.mtop h1{font-size:23px;font-weight:800;letter-spacing:-.025em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[lang=ar] .mtop h1{letter-spacing:0}
.mtop .live{font-size:12px}
.mav{width:36px;height:36px}
.mic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);color:var(--ink-2);flex:none}
.mic .ic{width:18px;height:18px}
.mavl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;background:#fff;border:1px solid rgba(15,23,40,.08);color:var(--ink-3)}
.mavl i{width:8px;height:8px;border-radius:50%;background:#98A2B3}
.mavl.on{color:var(--good);border-color:#ABEFC6;background:#F6FEF9}
.mavl.on i{background:var(--live);box-shadow:0 0 0 3px rgba(18,183,106,.18)}
.mscroll{flex:1;overflow:auto;padding:0 14px 18px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;scrollbar-width:none}

.mtabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:7px 6px 24px;background:rgba(255,255,255,.88);border-top:1px solid rgba(15,23,40,.07);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);position:relative;z-index:5}

/* a phone row: who and what on the first line, how long and how many calls on the second, the call at the end */

.callb{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(21,128,61,.28)}

.chipm{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--pb);color:var(--pi);white-space:nowrap}

.chipm.plain{background:#F2F4F7;color:var(--ink-2)}
/* the order, full screen, behind a back bar */
.mpanel{position:absolute;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;animation:fade .15s}
.mback{flex:none;height:56px;margin-top:50px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}
.mback b{flex:1;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpanel .pc{grid-template-columns:minmax(0,1fr);padding:14px 16px 12px}
.mpanel .dr-top{flex-wrap:wrap;row-gap:6px;padding:10px 12px}

.mpanel .tabs{display:flex}
.mpanel .tabs button{flex:1;justify-content:center;padding:0 6px}

.mpanel .keys{display:none}

/* bottom sheet */
.shscrim{position:absolute;inset:0;z-index:60;background:rgba(15,23,40,.34);animation:fade .2s}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:61;background:#fff;border-radius:28px 28px 0 0;padding:8px 16px 28px;box-shadow:0 -20px 50px rgba(20,25,60,.25);animation:sheet .28s cubic-bezier(.2,.8,.2,1);max-height:90%;display:flex;flex-direction:column;gap:12px;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:#D0D5DD;margin:0 auto 2px;flex:none}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h b{font-size:17px;font-weight:800;flex:1}
.sh-o{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#F8F9FC;border:1px solid var(--line)}
.sh-o div{flex:1;min-width:0;display:grid;gap:1px}
.sh-o b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-o small{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oct{display:grid;justify-items:start;align-content:space-between;gap:10px;padding:14px;border-radius:18px;background:var(--pb);border:1px solid var(--pd);color:var(--pi);font-weight:800;font-size:14.5px;min-height:88px;text-align:start}
.oct .ic{width:22px;height:22px}
.oct.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 10px 24px rgba(21,128,61,.28)}
.m .tray{max-height:none;border-top:0;background:#fff;padding:0;animation:none}
.m .times{grid-template-columns:repeat(2,minmax(0,1fr))}

/* menus (the manager page's) */
.fbw{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:190;min-width:250px;max-height:460px;overflow:auto;padding:6px;border-radius:14px;background:rgba(255,255,255,.98);border:1px solid var(--card-bd);box-shadow:0 22px 54px rgba(20,25,60,.2);animation:drop .14s ease-out;text-align:start}

.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 8px;border-radius:9px;font-size:13px;font-weight:600;text-align:start}

.mi .cb .ic{width:11px;height:11px;stroke-width:3}
.mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.act .ic{color:var(--ink-3)} .mi.act.neg,.mi.act.neg .ic{color:var(--bad)}
.msep{height:1px;background:var(--line);margin:6px 4px}
.mehead{display:grid;padding:8px 10px 4px}.mehead b{font-size:14px}.mehead small{font-size:12px;color:var(--ink-3);font-weight:600}
.fb{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.fb:hover{background:#fff;color:var(--ink)}
.fb.on{border-color:rgba(21,128,61,.55);color:var(--ink)}

.dotk{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pi);flex:none}

/* header extras */
.mkt{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-inline-start:-8px}

.gsw{position:relative}
.gs input{flex:1;border:0;outline:0;background:none;font-size:13px;font-weight:600;color:var(--ink);min-width:0}

.bell{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08)}
.bell:hover{background:#fff}
.bell .ic{width:18px;height:18px}
.bell .nb{position:absolute;top:-6px;inset-inline-end:-6px;box-shadow:0 0 0 2px #fff}
.nb.red{background:#D92D20;color:#fff}
.bdrop{width:360px;padding:0}
.bhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bhead b{flex:1;font-size:14px}
.bn{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);position:relative}
.bn:hover{background:#F8F9FC}
.bn:not(.rd)::before{content:"";position:absolute;inset-inline-start:5px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.bn .hold{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--pb);color:var(--pi);flex:none;box-shadow:inset 0 0 0 1px var(--pd)}
.bn .hold .ic{width:15px;height:15px}
.st{flex:1;display:grid;gap:1px;min-width:0}
.st b{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .late{color:var(--bad);font-weight:800}
.bn .lnk{font-size:12px;white-space:nowrap;align-self:center}
.bfoot{display:flex;justify-content:center;padding:8px}
/* the global search drop */
.sdrop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:190;width:520px;max-height:72vh;overflow:auto;padding:8px;border-radius:18px;background:rgba(255,255,255,.98);border:1px solid var(--card-bd);box-shadow:0 24px 60px rgba(20,25,60,.22);animation:drop .14s ease-out;text-align:start}
.sdrop.flat{position:static;width:auto;max-height:none;box-shadow:none;border:0;background:transparent;padding:0}
.sdrop h6{display:flex;align-items:center;gap:8px;margin:10px 8px 4px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
[lang=ar] .sdrop h6{letter-spacing:0;font-size:12px}
.shead{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:4px 6px 6px;font-size:12px;font-weight:600}
.sres{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:11px;text-align:start}
.sres:hover{background:#F2F4F7}

.sres > .ic{color:var(--ink-4)}
.sres .amt{font-size:13.5px}
.shint{display:flex;align-items:center;gap:8px;padding:10px 8px 4px;font-size:12px;color:var(--ink-3);font-weight:600;border-top:1px solid var(--line);margin-top:6px}
.who2{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.who2 .av{width:20px;height:20px;font-size:9.5px}
/* dialogs */
.modal{position:fixed;inset:0;top:var(--pbh);z-index:300;display:grid;place-items:center;background:rgba(15,23,40,.22);animation:fade .15s;padding:16px}
.mbox{width:min(520px,100%);max-height:calc(100vh - var(--pbh) - 40px);overflow:auto;border-radius:22px;background:#fff;box-shadow:0 30px 80px rgba(20,25,60,.3);padding:18px;display:grid;gap:14px;animation:upin .2s cubic-bezier(.2,.8,.2,1)}
.mbox.wide{width:min(680px,100%)}
.klist{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}

.klist kbd{font:800 12px/22px "Plus Jakarta Sans",sans-serif;min-width:26px;text-align:center;padding:0 7px;border-radius:7px;border:1px solid rgba(15,23,40,.14);background:#F8F9FC}

/* the queue, details */
.lcol{display:grid;gap:16px;min-width:0;align-content:start}
.btn2.sq{width:44px;height:44px;padding:0;border-radius:14px;font-weight:800;font-size:15px}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line);background:rgba(255,255,255,.82)}
.more .btn2 .q{font-weight:600}
.lfoot{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.82);font-size:12.5px;color:var(--ink-3);font-weight:600}
.row.kf{box-shadow:inset 0 0 0 2px var(--brand);z-index:1}
.row:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--brand)}
.av.here2{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #98A2B3}
.mini2{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--ink-3);background:#F2F4F7;flex:none;cursor:help}

.wa-in{display:inline-flex;align-items:center;gap:4px;color:#067647;font-weight:800}
.wa-in .ic{width:12px;height:12px}
.carp{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;background:#F0FDF9;color:#107569;font-size:11px;font-weight:800}
.sla.run{background:#F2F4F7;color:var(--ink-2)}
.sla.ok{background:var(--good-bg);color:var(--good)}
.vdc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2);border:1px solid rgba(15,23,40,.09)}

.wab{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:#12B76A;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tabs em.c{background:#E4E7EC;color:var(--ink-2)}
.brief{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:11px 13px;border-radius:14px;background:#FEF7E6;border:1px solid #F5DFA8;color:#854A0E;text-align:start}
.brief span{flex:1;font-size:13px;font-weight:600;display:grid;gap:1px}
.brief b{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
[lang=ar] .brief b{letter-spacing:0}
.grp2{margin-top:12px}
.grp2 h6,.blk2 h6{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.facts.sm{padding:4px 0 0;border-top:0;grid-template-columns:132px minmax(0,1fr);gap:9px 12px;font-size:13px}
.win{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 11px;border-radius:10px;background:#F8F9FC;font-size:12px;font-weight:700;color:var(--ink-2)}
.win .ic{width:13px;height:13px}
.tl.his time b{color:var(--ink-2)}
.lnk.neg{color:var(--bad);margin-inline-start:auto;white-space:nowrap}
.note .lnk{margin-inline-start:auto;white-space:nowrap}

.tray-h .tt{flex:1;display:grid;gap:1px;min-width:0}

.tray-h .tt small{font-size:12px;color:var(--ink-3);font-weight:600}
.rgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rgc{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:13px;border:1px solid #E4E7EC;background:#fff;text-align:start}
.rgc:hover{border-color:#98A2B3}
.rgc.on{border-color:#D92D20;background:#FEF3F2;box-shadow:0 0 0 1px #D92D20}
.rgc .hold{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--pb);color:var(--pi);flex:none}
.rgc .hold .ic{width:15px;height:15px}
.rgc span:last-child{display:grid;gap:1px;min-width:0}
.rgc b{font-size:13px;font-weight:800}
.rgc small{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.3}
.later{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:13px;background:#F4F3FF;border:1px dashed #BDB4FE;color:#5925DC;text-align:start}
.later span{flex:1;display:grid}
.later b{font-size:13px;font-weight:800}
.later small{font-size:12px;font-weight:600;opacity:.85}
.keepv{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.keepv input{width:16px;height:16px;accent-color:var(--brand)}
.fa.red:not(:disabled){background:#D92D20;border-color:#D92D20;color:#fff}
.fa.violet:not(:disabled){background:#6938EF;border-color:#6938EF;color:#fff}

.fa.wa{background:#12B76A;border-color:#12B76A}
.tm2.dt{gap:4px}
.tm2.dt .inp{height:30px;padding:0 6px;font-size:12px;border-radius:8px}
/* the call-result list on the phone (the live sheet's four options, with their one line) */
.ocl{display:grid;gap:8px}
.ocr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid #E4E7EC;text-align:start}
.ocr .hold{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--pb);color:var(--pi);flex:none;box-shadow:inset 0 0 0 1px var(--pd)}

.ocr b{font-size:15px;font-weight:800;color:var(--pi)}
.ocr small{font-size:12px;color:var(--ink-3);font-weight:600;line-height:1.35}
.ocr.h-green{background:#F6FEF9;border-color:#ABEFC6}
.req{font-size:10.5px;font-weight:800;color:var(--bad);background:var(--bad-bg);padding:2px 7px;border-radius:6px}
p.foot{font-size:12px;text-align:center}
.hscroll{overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .seg-row,.hscroll .bks{flex-wrap:nowrap;width:max-content}
.hscroll .seg{flex-wrap:nowrap}
.mid{display:flex;align-items:center;gap:10px;min-width:0;grid-column:1}

.mid .nm{display:inline-block;max-width:100%;vertical-align:top}

/* bucket mini-tiles (CRM, Livraison): a dot, the name, the count, the money */

.bks.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.bk{display:grid;gap:3px;padding:12px 14px;border-radius:16px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:start;min-width:0;transition:transform .15s,box-shadow .15s}
.bk:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover)}

.bk-l{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
/* ═════════════ seeded randomness — every reload shows the same orders ═════════════ */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(4102026);
const pick = (items, w) => { let r = R() * w.reduce((s, x) => s + x, 0); for (let i = 0; i < items.length; i++){ r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; };
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const chance = p => R() < p;

/* ═════════════ the calendar of the dummy market ═════════════ */
const TODAY = "2026-10-04", NOW_MIN = 17 * 60 + 20, DAYS = 80;
function dt(s){ return new Date(s + "T12:00:00Z"); }
function addDays(s, k){ const d = dt(s); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); }
function daysBetween(a, b){ return Math.round((dt(b) - dt(a)) / 864e5); }
const FIRST = addDays(TODAY, -(DAYS - 1));
const NOW_T = (DAYS - 1) * 1440 + NOW_MIN, TODAY_T = (DAYS - 1) * 1440;        /* t = minutes since FIRST 00:00 */
const dayOfT = t => addDays(FIRST, Math.floor(t / 1440));
const adOfT = t => DAYS - 1 - Math.floor(t / 1440);
const hm = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const SLA = 120;                                   /* the market's SLA (settings), in minutes */


/* ═════════════ state ═════════════ */
const S = {tab:"orders", dev:"desk", lang:"fr", avail:true, menu:null, gs:false, msearch:false, keys:false,
  /* Commandes */ bucket:"new", sub:"all", att:0, q:"", more:40, open:null, ro:false, focus:null, ptab:"art", tray:null, done:null, rj:null, rjNote:"", rjVoc:false, cbk:null, car:null, sheet:null, sel:new Set(), create:false, cf:null, psheet:false,
  /* CRM */ lb:"all", lq:"", lopen:null, ltray:false, lsheet:null, lout:null, lsub:null, newlead:false,
  /* Livraison */ db:"all", dq:"", dopen:null, drisk:false, dsort:"prio", ddone:false, dstall:false, djf:"all", dsheet:null, dwho:"client", dres:null, drem:2,
  /* Mes commissions */ ctab:"unpaid", cmore:30, cfil:"all", cpay:false,
  /* Voix du client */ vcat:"all", vmom:new Set(), vq:"", fnew:false, ff:null,
  /* the v4 generator's leftovers */ dsel:new Set(), keep:{}};
const L = (fr, ar) => S.lang === "ar" ? ar : fr;
/* ═════════════ format ═════════════ */
const NB = " ";
/* in Arabic the number is isolated, or the bidi algorithm reorders its digit groups (« 1 679 » read « 679 1 ») */
const fnum = n => { const s = Math.round(n).toLocaleString("fr-FR").replace(/\s/g, NB); return S.lang === "ar" ? "⁦" + s + "⁩" : s; };
const CCY = () => L("LYD", "د.ل");
const MON = {fr:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."], ar:["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]};
const MONL = {fr:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"], ar:MON.ar};
const dShort = s => `${+s.slice(8)} ${MON[S.lang][+s.slice(5, 7) - 1]}`;
const dRange = (f, t) => f === t ? dShort(f) : `${dShort(f)} → ${dShort(t)}`;
const monthName = m => { const n = MONL[S.lang][+m.slice(5, 7) - 1]; return S.lang === "fr" ? n[0].toUpperCase() + n.slice(1) : n; };
const lastDay = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).toISOString().slice(0, 10);

}

function bestCarrier(o){ return o.city != null && CITIES[o.city][3] === "e" ? 1 : 0; }
function trayHTML(o){

function keep(fn){
  const y = scrollY, sc = [...document.querySelectorAll(".dr-body,.mscroll,.mpanel .dr-body")].map(e => e.scrollTop);
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && typeof ae.selectionStart === "number" ? ae.selectionStart : null, fds = ae && ae.dataset && ae.dataset.ffs;
  fn(); render(); scrollTo(0, y);
  document.querySelectorAll(".dr-body,.mscroll,.mpanel .dr-body").forEach((e, i) => { if (sc[i] != null) e.scrollTop = sc[i]; });
  const el = fid ? document.getElementById(fid) : fds ? document.querySelector(`[data-ffs="${fds}"]`) : null;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){ el.focus(); if (pos != null) try { el.setSelectionRange(pos, pos); } catch (_) {} }
}

/* ═════════════ toasts — the 5-second « Annuler » of the live app ═════════════ */
const tip = document.getElementById("tip"); let toastT, UNDO = null;

/* ═════════════ the agent's actions ═════════════ */
function nextOpen(){ const r = qRows().filter(o => o.id !== S.open && callStage(o)); return r.length ? r[0].id : null; }
function openOrder(id, ro){ keep(() => { S.open = id; S.ro = !!ro; S.tray = null; S.done = null; S.menu = null; S.ptab = ORDERS[id].trk ? "dlv" : "art"; S.focus = null; S.psheet = false; }); }
function act(kind){
  const id = S.sheet != null ? S.sheet : S.open, o = ORDERS[id]; if (o == null) return;
  if (["reject", "callback", "send", "schedule"].includes(kind)){ keep(() => { S.tray = kind; S.rj = kind === "reject" && o.att >= MAXATT ? "2:0" : null; S.rjNote = ""; S.cbk = null; S.car = null; S.menu = null; }); return; }
  if (kind === "noanswer"){ keep(() => { o.att = Math.min(MAXATT, o.att + 1); o.st = "attempt_" + o.att; o.lastT = NOW_T; S.done = ["amber", "phone", L(`Tentative ${o.att}/${MAXATT} enregistrée — prochain essai ${hm(RETRY.find(m => m > NOW_MIN) || 660)}`, `سُجلت المحاولة ${o.att}/${MAXATT} — المحاولة التالية ${hm(RETRY.find(m => m > NOW_MIN) || 660)}`)]; S.sheet = null; S.tray = null; }); toast(L("Pas de réponse enregistré", "تم تسجيل عدم الرد")); return; }
  if (kind === "confirm"){ keep(() => { o.st = "confirmed"; o.confT = NOW_T; o.att = Math.max(1, o.att); o.justConf = true; S.tray = "send"; S.done = null; }); return; }
  if (kind === "sendnow"){ ship(o); return; }
  if (kind === "unschedule"){ keep(() => { o.st = "confirmed"; S.done = ["violet", "check", L("Planification annulée — la commande reste confirmée", "أُلغيت الجدولة — يبقى الطلب مؤكداً")]; }); return; }
  if (kind === "reopen"){ toast(L("Réouvrir cette commande ? — Confirmer la réouverture", "إعادة فتح هذا الطلب؟ — تأكيد إعادة الفتح")); return; }
}
function ship(o){ keep(() => { o.st = "uploaded"; o.upT = NOW_T; o.trk = "DRB" + (30000000 + o.id * 7919 % 69999999); o.car = S.car == null ? bestCarrier(o) : S.car; o.justConf = false; S.tray = null; S.sheet = null; S.done = ["teal", "truck", L(`Envoyé — suivi ${o.trk}`, `أُرسل — رقم التتبع ${o.trk}`)]; }); toast(L(`Envoyé chez ${CARRIERS[o.car][0]}`, `أُرسل إلى ${CARRIERS[o.car][1]}`)); }
function demo(k){
  const pickO = f => mine().filter(f).sort(queueSort)[0];
  if (k === "lead"){ keep(() => { S.lopen = leadRows()[0].id; }); return; }
  if (k === "parcel"){ keep(() => { S.dopen = dlvRows().filter(p => p.sit !== "stall")[0].id; }); return; }
  if (k === "keys"){ keep(() => S.keys = true); return; }
  if (k === "fnew"){ const o = pickO(o => o.st.startsWith("attempt_")); keep(() => { S.tab = "orders"; if (S.dev === "desk"){ S.open = o.id; S.ro = false; } S.fnew = true; S.ff = null; }); return; }
  if (k === "ro"){ const o = ORDERS.filter(x => x.ag !== ME && x.ag != null && x.ad <= 3 && x.st !== "deleted").slice(-1)[0]; keep(() => { S.q = o.phone.slice(0, 6); }); openOrder(o.id, true); return; }
  if (k === "taken"){ const o = pickO(o => o.st === "pending"); o.taken = true; openOrder(o.id); return; }
  if (k === "confirmed"){ const o = pickO(o => o.st === "attempt_1" || o.st === "attempt_2"); keep(() => { S.bucket = "cours"; S.sub = "all"; S.q = ""; S.open = o.id; S.ro = false; S.ptab = "art"; o.st = "confirmed"; o.confT = NOW_T; o.justConf = true; S.tray = "send"; if (S.dev === "phone"){ S.sheet = o.id; S.open = null; } }); return; }
  const o = pickO(o => o.st.startsWith("attempt_") && !o.mgr) || pickO(o => o.st === "pending");
  keep(() => { S.bucket = bucketOf(o); S.sub = "all"; S.q = ""; S.ro = false; S.done = null; S.tray = k === "call" || k === "open" ? null : k; S.rj = null; S.cbk = null; S.ptab = "art";
    if (S.dev === "phone" && k !== "open"){ S.sheet = o.id; S.open = null; } else { S.open = o.id; S.sheet = null; } });
}
function switchTab(k){ keep(() => { S.tab = k; S.menu = null; S.gs = false; S.msearch = false; S.sheet = null; S.tray = null; S.fnew = false; S.psheet = false; S.dsheet = null; S.lsheet = null; S.ltray = false; if (S.dev === "phone"){ S.open = null; S.lopen = null; S.dopen = null; } }); scrollTo(0, 0); }

/* ═════════════ events ═════════════ */
document.addEventListener("click", e => {
  const g = s => e.target.closest(s); let t;
  if (g("[data-undo]")){ if (UNDO) UNDO(); tip.classList.remove("on", "toast"); return; }
  if ((t = g("[data-tab]"))){ switchTab(t.dataset.tab); return; }
  if ((t = g("[data-dev]"))){ keep(() => { S.dev = t.dataset.dev; S.menu = null; if (S.dev === "phone"){ S.open = null; S.lopen = null; S.dopen = null; } }); return; }
  if ((t = g("[data-lang]"))){ keep(() => S.lang = t.dataset.lang); return; }
  if ((t = g("[data-demo]"))){ demo(t.dataset.demo); return; }
