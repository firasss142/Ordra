<!doctype html>
<!--
  Entrepôt — prototype desk v1 (2026-10-04). La rénovation « Aurore » de toute la section, côté bureau
  (managers + super admin, français). Langage visuel : prototypes/commandes-v4.html (même barre latérale,
  mêmes tuiles comptées, même ligne de filtres, même liste blanche, mêmes pastilles, même tiroir).

  Ce que le propriétaire a demandé : reconstruire l'Entrepôt (structure, design, visuels, mise en page) ;
  simple, facile à lire, pas dense ; l'accent sur la RÉCEPTION.
  Ses réponses (4 oct.) : nos bâtiments vont renvoyer des colis → Sortir reste le premier métier ; le bureau
  d'abord (le téléphone de l'agent suivra, même structure) ; on garde les quatre métiers en les simplifiant ;
  toute la section dans un seul prototype.

  Décisions de l'expert :
  - Recevoir devient une PAGE (elle était un onglet caché de Stock — personne n'a jamais soldé une réception).
    Barre latérale : Aujourd'hui · Sortir · Rentrer · Recevoir · Stock. Compter et le Journal vivent dans Stock.
  - Chaque page = une question, 3–4 tuiles comptées qui filtrent, une ligne de recherche, une liste. Plus de
    tuiles KPI qui répètent la liste. Le détail s'ouvre dans un tiroir.
  - Le ramassage Darb n'apparaît qu'une fois : dans Sortir (Aujourd'hui en dit l'état, sans bouton).
  - Recevoir suit le modèle v4 « le quai et le bureau » : un arrivage = bâtiment + produits + quantités, le stock
    entre tout de suite, compté À L'AVEUGLE (l'attendu n'apparaît qu'après) ; le bureau SOLDE ensuite contre la
    facture, et l'écart s'explique tout seul quand il le peut (abîmés facturés → réclamation).
  - Compter : on tape d'abord, Ordra montre ensuite ce qu'il croyait — un comptage qui voit l'attendu le recopie.
  - Couleurs : une teinte par métier (famille du vert, design-system §4.20) ; rouge/ambre = sévérité seulement ;
    la couleur d'un rouleau Darb est un objet physique, toujours écrite à côté de sa pastille.

  DONNÉES FICTIVES générées dans la page (graine fixe) : produits, fournisseurs, agents et clients inventés.
  Les ordres de grandeur suivent la production du 4 oct. (32 retours chez Darb, 323 colis Dexpress bloqués à
  Tripoli, aucun comptage). « Avant » = captures de l'écran actuel sur la base LOCALE de test.
  URL : ?screen=today|out|returns|receive|stock|count &tab=products|journal &before=1 &open=<id>
        &rec=new|settle  ·  touches 1–6 = écrans, B = avant / après
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrepôt · rénovation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-hov:rgba(255,255,255,.07);
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:22px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 18px 46px rgba(42,52,110,.13);
  --glass-in:rgba(255,255,255,.72); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7; --line:rgba(15,23,40,.07);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A; --warn:#B54708; --warn-bg:#FFF4E0; --bad:#B42318; --bad-bg:#FEF3F2;
  --flat-bg:rgba(15,23,40,.05); --pbh:49px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
/* families: a wash, a 1px edge, an ink — status pills, tags and icon holders */
.h-neutral{--pb:#F2F4F7;--pd:#E4E7EC;--pi:#344054}
.h-amber{--pb:#FFFAEB;--pd:#FEDF89;--pi:#B54708}
.h-green{--pb:#ECFDF3;--pd:#ABEFC6;--pi:#067647}
.h-red{--pb:#FEF3F2;--pd:#FECDCA;--pi:#B42318}
.h-violet{--pb:#F4F3FF;--pd:#D9D6FE;--pi:#5925DC}
/* the four jobs — design-system §4.20, the brand green's family + one warm counterpoint */
.j-out{--pb:#E9F6EE;--pd:#B7E2C6;--pi:#12692F;--jf:#15803D}
.j-ret{--pb:#E3F3F1;--pd:#A9DAD4;--pi:#0B5C56;--jf:#0F766E}
.j-rec{--pb:#EEF5E1;--pd:#CFE2AE;--pi:#3F6212;--jf:#4D7C0F}
.j-cnt{--pb:#FBF3DC;--pd:#EED7A0;--pi:#854D0E;--jf:#A16207}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
[dir=auto]{unicode-bidi:plaintext}

/* prototype bar */
.pbar{position:sticky;top:0;z-index:400;background:#16191E;color:#E6E8EB;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #000;direction:ltr}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2}
.looks button:hover{color:#fff}
.looks button.on{background:#fff;color:#0E1013}

/* shell + sidebar (as commandes-v4) */
.stage{display:flex;min-height:calc(100vh - var(--pbh))}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:var(--pbh);height:calc(100vh - var(--pbh))}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.sb-mk svg.flag{width:26px;height:18px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{flex:none;height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(247,144,9,.18);color:#FDB022}
.sb-item.on .sb-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-group{margin-top:14px}
.sb-gl{height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:24px 28px 120px;background:var(--page);background-attachment:fixed}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.before-img{display:block;width:100%;max-width:1440px;margin:0 auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.before-wrap{padding:24px;background:#2A2F36;min-height:calc(100vh - var(--pbh))}
.before-note{max-width:1440px;margin:0 auto 14px;color:#E6E8EB;font-size:13px;font-weight:600}

/* header — workbench scale */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700}
.live i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--live)}
.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:40px;padding:0 15px;border-radius:11px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn .ic{width:15px;height:15px}
.btn2{height:40px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.88);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:15px;height:15px}
.btn2.sm,.btn.sm{height:32px;font-size:12.5px;padding:0 11px;border-radius:9px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--card-bd)}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.seg em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700}

/* counted tiles — each one a filter (as commandes-v4) */
.wts{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px}
.wt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:start;transition:transform .15s,box-shadow .15s;min-width:0}
.wt:hover{transform:translateY(-2px);box-shadow:var(--card-sh-hover)}
.wt.on{box-shadow:0 0 0 1.5px var(--brand),var(--card-sh)}
.hold{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.hold .ic{width:20px;height:20px}
.wt-t{display:grid;min-width:0}
.wt b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wt-t > span{font-size:13.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small em{font-style:normal;color:var(--bad);font-weight:700}
.wt small em.w{color:var(--warn)}
.wt.zero b{color:var(--ink-q)}

/* search line */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srch{flex:1;min-width:280px;display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);color:var(--ink-3)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;color:var(--ink);min-width:0;font-weight:500}
.srch input::placeholder{color:var(--ink-3)}
.srch:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12),var(--card-sh)}
.kbd2{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid rgba(15,23,40,.12);border-radius:6px;padding:0 6px;line-height:20px}
.count{margin-inline-start:auto;font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.count b{color:var(--ink);font-weight:800}

/* the armed scan bar (Sortir) */
.scanbar{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--brand);box-shadow:0 0 0 4px rgba(21,128,61,.10),var(--card-sh);animation:rise .2s ease-out}
.scanbar .hold{width:40px;height:40px}
.scanbar div{flex:1;min-width:0;display:grid}
.scanbar b{font-size:14.5px;font-weight:800}
.scanbar small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.scanbar .beam{height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:200% 100%;animation:beam 1.4s linear infinite;margin-top:6px}
@keyframes beam{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* roll line */
.rolls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rolls .lab{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-inline-end:4px}
.rc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid rgba(15,23,40,.08);font-size:13px;font-weight:700;color:var(--ink-2)}
.rc:hover{background:#fff;color:var(--ink)}
.rc.on{background:#fff;color:var(--ink);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.rc em{font-style:normal;color:var(--ink-3);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* the list (as commandes-v4): one glass container, white rows, hairlines, no motion on rows */
.list{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow:hidden}
.lh,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:12px;padding-inline:16px 14px}
.lh{height:42px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.lh .e,.row .e{text-align:end;justify-self:end}
.rows{background:#fff}
.row{position:relative;min-height:64px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:#F8F9FC}
.row.sel{background:var(--brand-wash)}
.row.sel::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--brand)}
.row.done{opacity:.6}
.lt{display:flex;align-items:center;gap:12px;min-width:0}
.lt > div{min-width:0}
.thumb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--ti);box-shadow:inset 0 0 0 1px rgba(15,23,40,.05)}
.thumb .ic{width:19px;height:19px}
.thumb.lg{width:64px;height:64px;border-radius:18px}.thumb.lg .ic{width:30px;height:30px}
.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.l2{font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;display:block}
.l2 b{color:var(--ink-2);font-weight:600}
.l2 .qty{color:var(--ink);font-weight:800}
.amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.amt small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-inline-start:4px}
.age{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.age .ic{width:12px;height:12px}
.age.late{color:var(--warn);font-weight:800}
.age.vlate{color:var(--bad);font-weight:800}
.roll{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.site{font-size:13px;font-weight:600;color:var(--ink-2)}
.pl{display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 10px 0 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid var(--pd);background:var(--pb);color:var(--pi);max-width:100%;overflow:hidden}
.pl .ic{width:13px;height:13px}
.tg{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:7px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pi);flex:none}
.tg .ic{width:11px;height:11px;stroke-width:2.4}
.kb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.kb:hover{background:var(--flat-bg);color:var(--ink)}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:14px;background:#fff;display:grid;justify-items:center;gap:10px}
.empty .ic{width:28px;height:28px;color:var(--ink-4)}
.lfoot{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.82);font-size:12.5px;color:var(--ink-3);font-weight:600}

/* cards on the ground */
.card{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.h2{display:flex;align-items:baseline;gap:10px;margin:10px 0 -4px}
.h2 h2{font-size:17px;font-weight:800;letter-spacing:-.015em}
.h2 span{font-size:13px;color:var(--ink-3);font-weight:600}

/* Aujourd'hui — four job cards */
.jobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.job{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:18px 18px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--card-bd);box-shadow:var(--card-sh);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:start;transition:transform .18s,box-shadow .18s;animation:rise .35s ease-out both}

.job .st{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);min-height:20px}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none;background:linear-gradient(140deg,var(--a5),var(--a7));box-shadow:0 8px 22px color-mix(in srgb,var(--a5) 40%,transparent)}

.drawer{position:fixed;top:calc(var(--pbh) + 12px);bottom:12px;inset-inline-end:12px;z-index:210;width:min(600px,calc(100vw - 24px));background:rgba(250,251,255,.97);border:1px solid #fff;border-radius:26px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(42,52,110,.24);animation:slide .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}

.eb span{margin-inline-start:auto;letter-spacing:0;text-transform:none;font-size:12px;font-weight:600}
.big{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{padding:11px 12px;border-radius:13px;background:#F8F9FC;border:1px solid var(--line)}
.kv b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv small{font-size:12px;color:var(--ink-3);font-weight:600}
.mv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0}

.mv small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}

/* site split bar (Stock) */
.split{display:grid;gap:5px;min-width:0}

.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.free{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}

/* returns decision */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ch.on{border-color:var(--pi);box-shadow:0 0 0 3px var(--pb);background:linear-gradient(160deg,var(--pb),#fff 70%)}
.causes{display:flex;gap:6px;flex-wrap:wrap}
.cz{height:32px;padding:0 12px;border-radius:99px;border:1px solid rgba(15,23,40,.12);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2)}
.cz.on{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}

/* Recevoir */
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stage-c{padding:16px 18px;display:grid;gap:10px;align-content:start;position:relative}
.stage-c .sh{display:flex;align-items:center;gap:10px}
.stage-c .sh b{font-size:15px;font-weight:800;flex:1}
.stage-c .sh .n{font-size:12px;font-weight:800;color:var(--pi);background:var(--pb);border:1px solid var(--pd);border-radius:99px;padding:2px 9px}
.stage-c > p{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:-4px}
.arrow{position:absolute;top:28px;inset-inline-end:-13px;width:12px;height:12px;color:var(--ink-q);z-index:2}
.po{display:grid;gap:7px;padding:12px 13px;border-radius:15px;background:rgba(255,255,255,.8);border:1px solid var(--glass-in-bd);text-align:start;width:100%;transition:box-shadow .15s,transform .15s}
button.po:hover{box-shadow:0 6px 18px rgba(42,52,110,.12);transform:translateY(-1px)}

.po-h b{font-size:14px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po-h small{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.po .l2{margin-top:0}
.po .bar{height:6px}
.po-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2)}
.po-f .btn.sm{height:30px}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ptile{display:grid;justify-items:center;gap:6px;padding:10px 6px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;text-align:center;line-height:1.25}
.ptile:hover{border-color:var(--brand)}
.ptile.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(21,128,61,.15);background:var(--brand-wash)}
.ptile .thumb{width:42px;height:42px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 96px 32px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.qin{display:flex;height:44px;border:1px solid #D0D5DD;border-radius:12px;overflow:hidden;background:#fff}
.qin button{width:38px;display:grid;place-items:center;color:var(--ink-2)}
.qin button:hover{background:#F2F4F7}
.qin input{flex:1;min-width:0;border:0;border-inline:1px solid #EAECF0;text-align:center;font-size:17px;font-weight:800;outline:0;font-variant-numeric:tabular-nums}
.dmg{display:grid;gap:3px}
.dmg label{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.dmg input{height:32px;border:1px solid #D0D5DD;border-radius:9px;text-align:center;font-weight:700;width:100%}
.blind{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#F8F9FC;border:1px dashed var(--ink-4);font-size:12.5px;color:var(--ink-2);font-weight:600}
.blind .ic{width:15px;height:15px;color:var(--ink-3)}
.res{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res b{font-size:14px;font-weight:800;display:block}
.res small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.ok-big{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:linear-gradient(160deg,#DCFAE6,rgba(255,255,255,.9));border:1px solid #ABEFC6}
.ok-big .hold{background:var(--brand);color:#fff;box-shadow:0 8px 22px rgba(21,128,61,.35)}
.ok-big b{font-size:16px;font-weight:800;display:block}
.ok-big small{font-size:13px;color:var(--ink-2);font-weight:600}
.fld{display:grid;gap:6px}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp{height:42px;border-radius:11px;border:1px solid #D0D5DD;background:#fff;padding:0 12px;font-size:14px;width:100%;font-weight:600}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cost{display:grid;grid-template-columns:40px minmax(0,1fr) 90px 110px 100px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.cost.hd{border-top:0;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:0}
.cost .e{text-align:end}
.cost .inp{height:36px;padding:0 8px}
.cost b{font-weight:800}
.recon{display:grid;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--pd);background:linear-gradient(160deg,var(--pb),rgba(255,255,255,.92) 75%)}
.recon-h{display:flex;align-items:center;gap:12px}

/* Compter */
.cnt{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cnt-main{padding:28px;display:grid;gap:20px;justify-items:center;text-align:center}

.cnt-main .q{font-size:15px;color:var(--ink-2);font-weight:600}
.cnt-in{display:flex;align-items:center;gap:10px}
.cnt-in button{width:56px;height:56px;border-radius:16px;background:#fff;border:1px solid rgba(15,23,40,.1);display:grid;place-items:center}

.cnt-in input{width:180px;height:72px;border-radius:18px;border:2px solid var(--brand);text-align:center;font-size:40px;font-weight:800;letter-spacing:-.03em;outline:0;box-shadow:0 0 0 5px rgba(21,128,61,.1);font-variant-numeric:tabular-nums}
.reveal{width:100%;max-width:520px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;padding:16px;border-radius:18px;background:#F8F9FC;border:1px solid var(--line);animation:rise .25s ease-out}
.reveal div{display:grid}

.reveal .ic{color:var(--ink-q)}
.prog{display:flex;align-items:center;gap:12px;width:100%;max-width:520px}
.prog .bar{flex:1}
.prog span{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.todo{padding:6px 0}
.todo-i{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.todo-i:first-of-type{border-top:0}

.todo-i > span:not(.thumb):not(.ck){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.todo-i .ck .ic{width:12px;height:12px;stroke-width:3}

.toast{position:fixed;bottom:24px;inset-inline-start:calc(240px + (100vw - 240px)/2);transform:translateX(-50%);z-index:500;background:#101828;color:#fff;font-size:13px;font-weight:600;padding:12px 16px 12px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:rise .2s ease-out;border-inline-start:4px solid var(--live)}
.toast .ic{color:#6CE9A6}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1180px){.jobs{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.pipe,.cnt{grid-template-columns:1fr}.arrow{display:none}}

/* ---------- tiny helpers ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const ICON = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  out:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m15 11 3 3-3 3"/>', back:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  boxes:'<rect x="3" y="12" width="8" height="8" rx="1"/><rect x="13" y="12" width="8" height="8" rx="1"/><rect x="8" y="3" width="8" height="8" rx="1"/>',
  dock:'<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/>',
  count:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',

      <div class="job-n"><strong>${fnum(n)}</strong><span>${unit}</span></div>${st}${extra || ""}
      <div class="go"><span>${{out:"Ouvrir la file", returns:"Voir les retours", receive:"Recevoir", count:"Commencer le comptage"}[k]}</span>${ic("arrowr")}</div></button>`;
  const stl = (c, t) => `<div class="st ${c}"><i></i>${t}</div>`;
  const pickTxt = s => S.pickup[s] ? `<span class="pick ok">${ic("truck")}Chauffeur Darb passé à ${S.pickup[s]}</span>` : `<span class="pick">${ic("truck")}Chauffeur Darb pas encore passé</span>`;
  const bld = s => { const t = OUT.filter(o => o.site === s && !o.done).length, d = OUT.filter(o => o.site === s && o.done).length, r = RET.filter(x => x.site === s && x.state === "darb" && !x.done).length;
    return `<div class="card bld"><div class="bld-h"><span class="av" style="--a5:${SITES[s].a5};--a7:${SITES[s].a7}">${SITES[s].ag[0]}</span><div style="flex:1"><b>${siteName(s)}</b><small>${SITES[s].ag} · ${d ? `dernier scan ${OUT.filter(o => o.site === s && o.done).map(o => o.at).sort().pop()}` : "aucun scan aujourd'hui"}</small></div></div>
      <div class="bld-k"><div><b>${t}</b><small>à sortir</small></div><div><b>${d}</b><small>sortis</small></div><div><b>${r}</b><small>retours chez Darb</small></div></div>${pickTxt(s)}</div>`; };
  return `<div class="page">${header("Aujourd'hui", liveSub(), siteSeg())}
    <div class="jobs">
      ${job("j-out", "out", 1, "out", "Sortir", todo.length, pl(todo.length, "colis à scanner", "colis à scanner"),
        late.length ? stl("w", `${late.length} en attente depuis plus de 2 jours`) : stl("g", "Tout est récent"),
        `<div class="bar"><i style="width:${pct}%"></i></div><div class="bar-l"><span><b>${done.length}</b> sortis aujourd'hui</span><span>${pct} %</span></div>`)}
      ${job("j-ret", "returns", 2, "back", "Rentrer", darb.length, "retours chez Darb", darb.length ? stl("b", `le plus ancien attend depuis ${oldest} j`) : stl("g", "Rien à récupérer"), `<div class="st">${retWay().length} encore en route vers Darb</div>`)}
      ${job("j-rec", "receive", 3, "dock", "Recevoir", poDue, pl(poDue, "livraison attendue", "livraisons attendues"),
        stl(poDue ? "w" : "g", poDue ? `aujourd'hui, de ${POS.filter(p => inSite(p) && p.eta === "4 oct.").map(p => supName(p.sup)).join(", ")}` : "rien n'est attendu aujourd'hui"), `<div class="st">${recOpen} ${pl(recOpen, "arrivage", "arrivages")} à solder au bureau</div>`)}
      ${job("j-cnt", "count", 4, "count", "Compter", nc.length, "jamais comptés", stl("w", "le stock par bâtiment reste éteint"), `<div class="st">environ 1 min par produit</div>`)}
    </div>
    <div class="two">
      <div class="card dec"><div class="dec-h"><span class="hold h-red" style="width:32px;height:32px;border-radius:10px">${ic("alert")}</span><b>À décider</b><span class="l2" style="margin:0">ce que l'entrepôt ne peut pas régler seul</span></div>
        ${S.site !== "ben" ? `<div class="di"><span class="hold h-red">${ic("archive")}</span><div><b>${GHOST_TRI} colis Dexpress bloqués à Tripoli</b><small>transporteur arrêté depuis mai · ils comptent encore comme stock engagé</small></div><button class="btn2 sm">Annuler en lot</button></div>` : ""}
        <div class="di"><span class="hold h-amber">${ic("back")}</span><div><b>${darb.length} retours attendent chez Darb</b><small>personne n'a scanné de retour depuis le 18 août · ${fnum(darb.reduce((s, r) => s + r.val, 0))} LYD de marchandise</small></div><button class="btn2 sm" data-go="returns">Voir</button></div>
        <div class="di"><span class="hold j-rec">${ic("receipt")}</span><div><b>${recOpen} ${pl(recOpen, "arrivage non soldé", "arrivages non soldés")}</b><small>la marchandise est en vente, son coût est encore inconnu</small></div><button class="btn2 sm" data-go="receive">Solder</button></div>
      </div>
      <div class="blds">${S.site === "all" ? bld("ben") + bld("tri") : bld(S.site)}</div>
    </div></div>`;
}

/* ======================= SORTIR ======================= */
function screenOut(){
  const todo = outTodo(), done = outDone(), late = outLate();
  const tileOn = S.tile || "todo";
  let rows = tileOn === "done" ? done : tileOn === "late" ? late : todo;
  const rollCounts = {}; (tileOn === "done" ? done : todo).forEach(o => rollCounts[o.roll] = (rollCounts[o.roll] || 0) + 1);
  if (S.roll) rows = rows.filter(o => o.roll === S.roll);
  if (S.q) rows = rows.filter(o => (o.cust + o.city + P(o.p).fr + o.id).toLowerCase().includes(S.q.toLowerCase()));
  const pk = s => S.pickup[s] ? `<span class="pk ok">${ic("check")}${siteName(s)} · chauffeur passé ${S.pickup[s]}</span>` : `<span class="pk">${ic("truck")}${siteName(s)} · pas encore passé<button data-pickup="${s}">Il est passé</button></span>`;
  const sites = S.site === "all" ? ["ben","tri"] : [S.site];
  const hand = S.inHand && OUT.find(o => o.id === S.inHand);
  const cols = tileOn === "done" ? "minmax(260px,1.6fr) 130px 110px 110px 130px 40px" : "minmax(260px,1.6fr) 130px 110px 90px 110px 120px";
  return `<div class="page">${header("Sortir", liveSub(), `${sites.map(pk).join("")}${siteSeg()}`)}
    <div class="wts" style="--n:3">
      ${tile("todo", "j-out", "out", todo.length, "À sortir", `${Object.keys(rollCounts).length} rouleaux · le plus ancien ${ageTxt(todo.reduce((m, o) => Math.max(m, o.ageH), 0))}`, tileOn === "todo")}
      ${tile("late", "h-amber", "clock", late.length, "En attente depuis + 2 jours", late.length ? `<em class="w">à sortir en premier</em>` : "rien en retard", tileOn === "late")}
      ${tile("done", "h-green", "check", done.length, "Sortis aujourd'hui", done.length ? `dernier à ${done.map(o => o.at).sort().pop()}` : "aucun scan aujourd'hui", tileOn === "done")}
    </div>
    ${hand ? `<div class="scanbar"><span class="hold j-out">${ic("scan")}</span><div><b>Colis en main : <span dir="auto">${esc(hand.cust)}</span> · ${esc(P(hand.p).fr)} ×${hand.q}</b>
        <small>Collez un sticker <b style="color:var(--ink)">${ROLLS[hand.roll].fr}</b> puis scannez-le — le pistolet ou la caméra, n'importe où sur la page.</small><span class="beam"></span></div>
        <button class="btn2" data-act="drop">Reposer</button><button class="btn" data-act="bind">${ic("scan")}Simuler le scan</button></div>`
      : `<div class="tools"><label class="srch">${ic("search")}<input data-q placeholder="Rechercher un client, une ville, un produit — ou scannez un sticker" value="${esc(S.q)}"><span class="kbd2">/</span></label>
        <button class="btn" data-act="run">${ic("scan")}Commencer une tournée</button></div>`}
    <div class="rolls"><span class="lab">Rouleau</span><button class="rc ${!S.roll ? "on" : ""}" data-roll="">Tous <em>${(tileOn === "done" ? done : todo).length}</em></button>
      ${Object.entries(rollCounts).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<button class="rc ${S.roll === k ? "on" : ""}" data-roll="${k}"><i class="dot" style="--c:${ROLLS[k].c}"></i>${ROLLS[k].fr} <em>${n}</em></button>`).join("")}
      <span class="count"><b>${rows.length}</b> ${pl(rows.length, "colis", "colis")}</span></div>
    <div class="list" style="--cols:${cols}">
      <div class="lh"><span>Colis</span><span>Rouleau</span><span class="e">Montant</span><span>${tileOn === "done" ? "Sorti à" : "Attente"}</span><span>Bâtiment</span><span></span></div>
      <div class="rows">${rows.length ? rows.map(o => { const p = P(o.p);
        return `<div class="row ${S.inHand === o.id ? "sel" : ""}" data-take="${o.done ? "" : o.id}">
          <div class="lt">${thumb(p)}<div><span class="nm">${esc(p.fr)}${o.q > 1 ? ` <span style="color:var(--ink-3)">×${o.q}</span>` : ""}</span><span class="l2"><b dir="auto">${esc(o.cust)}</b> · ${o.city} · <span class="num">${o.id}</span></span></div></div>
          <span class="roll"><i class="dot" style="--c:${ROLLS[o.roll].c}"></i>${ROLLS[o.roll].fr}</span>
          <span class="amt e">${fnum(o.amt)}<small>LYD</small></span>
          ${o.done ? `<span class="age">${ic("check")}${o.at} · ${o.by}</span>` : `<span class="age ${o.ageH >= 96 ? "vlate" : o.ageH >= 48 ? "late" : ""}">${o.ageH >= 48 ? ic("clock") : ""}${ageTxt(o.ageH)}</span>`}
          <span class="site">${siteName(o.site)}</span>
          ${o.done ? `<button class="kb" title="Annuler la sortie">${ic("more")}</button>` : o.short ? `<span class="tg h-red" style="justify-self:end">${ic("alert")}Stock manquant</span>` : `<button class="btn2 sm" style="justify-self:end" data-take="${o.id}">${ic("hand")}Prendre</button>`}
        </div>`; }).join("") : `<div class="empty">${ic("check")}Rien à sortir ici. Les nouveaux colis arrivent dès qu'une commande est téléchargée chez Darb.</div>`}</div>
      <div class="lfoot">${ic("info")}Les colis partis du dépôt Darb lui-même n'apparaissent pas ici : rien à scanner chez nous.</div>
    </div></div>`;
}

/* ======================= RENTRER ======================= */
function screenReturns(){
  const darb = retDarb(), way = retWay(), today = retDoneToday();
  const on = S.tile || "darb";
  const rows = on === "way" ? way : on === "done" ? today : darb;
  const val = darb.reduce((s, r) => s + r.val, 0);
  const cols = "minmax(260px,1.6fr) 190px 110px 110px 120px";
  return `<div class="page">${header("Rentrer", liveSub(), siteSeg())}
    <div class="wts" style="--n:3">
      ${tile("darb", "j-ret", "back", darb.length, "Chez Darb, à récupérer", `<em>${fnum(val)} LYD</em> de marchandise immobilisée`, on === "darb")}
      ${tile("way", "h-neutral", "truck", way.length, "En route vers Darb", "pas encore récupérables", on === "way")}
      ${tile("done", "h-green", "check", today.length, "Rentrés aujourd'hui", today.length ? `${today.filter(r => r.done === "ok").length} remis en stock` : "dernier retour scanné le 18 août", on === "done")}
    </div>
    <div class="tools"><label class="srch">${ic("search")}<input data-q placeholder="Scannez le sticker du colis revenu — ou cherchez un client, un produit" value="${esc(S.q)}"><span class="kbd2">/</span></label></div>
    <div class="list" style="--cols:${cols}">
      <div class="lh"><span>Colis revenu</span><span>Ce que Darb a noté</span><span>Attente</span><span>Bâtiment</span><span></span></div>
      <div class="rows">${rows.filter(r => !S.q || (r.cust + P(r.p).fr + r.id).toLowerCase().includes(S.q.toLowerCase())).map(r => { const p = P(r.p);
        return `<div class="row ${r.done ? "done" : ""}" data-decide="${on === "darb" ? r.id : ""}">
          <div class="lt">${thumb(p)}<div><span class="nm">${esc(p.fr)}</span><span class="l2"><b dir="auto">${esc(r.cust)}</b> · ${r.city} · <span class="num">${r.id}</span></span></div></div>
          <span class="l2" style="margin:0;color:var(--ink-2);font-weight:600">${r.reason}</span>
          <span class="age ${r.days > 21 ? "vlate" : r.days > 7 ? "late" : ""}">${r.days > 7 ? ic("clock") : ""}${r.days} j ${on === "way" ? "en route" : "chez Darb"}</span>
          <span class="site">${siteName(r.site)}</span>
          ${on === "darb" ? `<button class="btn2 sm" style="justify-self:end" data-decide="${r.id}">${ic("back")}Réceptionner</button>`
            : r.done ? `<span class="pl ${r.done === "ok" ? "h-green" : "h-red"}" style="justify-self:end">${r.done === "ok" ? ic("check") + "En stock" : ic("broken") + "Abîmé"}</span>`
            : `<span class="tg h-neutral" style="justify-self:end">pas encore chez Darb</span>`}
        </div>`; }).join("") || `<div class="empty">${ic("check")}Aucun colis ici.</div>`}</div>
      <div class="lfoot">${ic("info")}Un colis n'est réceptionnable qu'une fois que Darb l'a marqué « à retourner ». Le plus ancien en premier.</div>
    </div></div>`;
}
function drawerDecide(){
  const r = RET.find(x => x.id === S.decide); if (!r) return ""; const p = P(r.p);
  const ok = S.cause === "ok", bad = S.cause && S.cause !== "ok";
  return `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true">
    <div class="dr-top">${thumb(p)}<div class="dr-title"><b>${esc(p.fr)} ×${r.q}</b><small><span dir="auto">${esc(r.cust)}</span> · ${r.city} · ${r.id} · revenu après « ${r.reason} »</small></div><button class="xbtn" data-close>${ic("x")}</button></div>
    <div class="dr-body">
      <div class="sec"><div class="eb">${ic("hand")}Dans quel état est-il revenu ?</div>
        <div class="choice">
          <button class="ch j-out ${ok ? "on" : ""}" data-cause="ok"><span class="hold">${ic("check")}</span><b>Intact</b><small>Remis sur l'étagère : +${r.q} ${esc(p.fr)} à ${siteName(r.site)}</small></button>
          <button class="ch h-red ${bad ? "on" : ""}" data-cause="${bad ? S.cause : "pick"}"><span class="hold">${ic("broken")}</span><b>Abîmé</b><small>Ne revient pas en stock, compté comme perte</small></button>
        </div>
        ${bad ? `<div class="eb" style="margin-top:4px">Ce qui est abîmé</div><div class="causes">${["Emballage","Produit défectueux","Abîmé par le client","Abîmé par le transporteur","Autre"].map(c => `<button class="cz ${S.cause === c ? "on" : ""}" data-cause="${c}">${c}</button>`).join("")}</div>` : ""}
      </div>
      <div class="sec"><div class="eb">${ic("clock")}Son parcours<span>${r.days} j chez Darb</span></div>
        <div class="mv"><span class="hold h-neutral" style="width:30px;height:30px;border-radius:9px">${ic("out")}</span><div><b>Sorti de ${siteName(r.site)}</b><small>scanné par ${SITES[r.site].ag}</small></div><span></span></div>
        <div class="mv"><span class="hold h-red" style="width:30px;height:30px;border-radius:9px">${ic("x")}</span><div><b>${r.reason}</b><small>noté par le livreur Darb</small></div><span></span></div>
        <div class="mv"><span class="hold j-ret" style="width:30px;height:30px;border-radius:9px">${ic("back")}</span><div><b>Rendu à notre bâtiment</b><small>en attente de votre geste</small></div><span></span></div>
      </div>
    </div>
    <div class="dr-foot"><button class="btn2">${ic("send")}Relivrer au client</button><span class="grow"></span><button class="btn" ${S.cause && S.cause !== "pick" ? "" : "disabled"} data-act="decide">${ic("check")}Valider</button></div></aside>`;
}

/* ======================= RECEVOIR ======================= */
function screenReceive(){
  const pos = POS.filter(inSite), arr = ARR.filter(inSite), set = SETTLED.filter(inSite);
  const poCard = po => { const o = po.lines.reduce((s, l) => s + l.o, 0), r = po.lines.reduce((s, l) => s + l.r, 0); const due = po.eta === "4 oct.";
    return `<div class="po"><div class="po-h">${thumb(P(po.lines[0].p))}<b>${supName(po.sup)}</b><small>${po.id} · ${siteName(po.site)}</small></div>
      <span class="l2">${po.lines.map(l => `<span class="qty">${l.o}</span> ${esc(P(l.p).fr)}`).join(" · ")}</span>
      <div class="bar"><i style="width:${Math.round(r / o * 100)}%"></i></div>
      <div class="po-f"><span>${due ? `<span class="tg h-amber">${ic("clock")}attendue aujourd'hui</span>` : `attendue le ${po.eta}`}</span><button class="btn sm" data-rec-new="${po.id}">${ic("dock")}C'est arrivé</button></div></div>`; };
  const arrCard = a => { const units = a.lines.reduce((s, l) => s + l.q, 0), dmg = a.lines.reduce((s, l) => s + l.d, 0);
    return `<button class="po" data-settle="${a.id}"><div class="po-h">${thumb(P(a.lines[0].p))}<b>${siteName(a.site)} · ${a.day}</b><small>${a.when}</small></div>
      <span class="l2">${a.lines.map(l => `<span class="qty">${l.q}</span> ${esc(P(l.p).fr)}`).join(" · ")}</span>
      <div class="po-f"><span>${fnum(units)} unités en stock${dmg ? ` · <span style="color:var(--bad)">${dmg} abîmées</span>` : ""} · ${a.po ? a.po : "hors commande"}</span><span class="btn sm">${ic("receipt")}Solder</span></div></button>`; };
  const setRow = s => `<div class="po" style="background:rgba(255,255,255,.6)"><div class="po-h"><span class="hold h-green" style="width:32px;height:32px;border-radius:10px">${ic("check")}</span><b>${supName(s.sup)}</b><small>${s.day}</small></div>
      <span class="l2"><span class="num">${s.ref}</span> · ${s.units} unités · <b>${fnum(s.value)} LYD</b></span>
      <div class="po-f">${s.state === "claim" ? `<span class="pl h-amber">${ic("alert")}Réclamation ouverte · ${s.claim} LYD retenus</span>` : `<span class="pl h-green">${ic("check")}Facture rapprochée</span>`}</div></div>`;
  return `<div class="page">${header("Recevoir", `Libye <span class="sep"></span> ce qu'on a commandé, ce qui est arrivé, ce qu'on doit`, `${siteSeg()}<button class="btn" data-rec-new="">${ic("plus")}Enregistrer un arrivage</button>`)}
    <div class="pipe">
      <div class="card stage-c j-rec"><div class="sh"><span class="hold" style="width:34px;height:34px;border-radius:11px">${ic("truck")}</span><b>1 · En route</b><span class="n">${pos.length}</span></div>
        <p>Commandé chez le fournisseur, pas encore arrivé.</p>${pos.map(poCard).join("") || `<div class="empty" style="background:none">Aucune commande en route.</div>`}<span class="arrow">${ic("right")}</span></div>
      <div class="card stage-c j-rec"><div class="sh"><span class="hold" style="width:34px;height:34px;border-radius:11px">${ic("dock")}</span><b>2 · Arrivé, à solder</b><span class="n">${arr.length}</span></div>
        <p>Déjà en stock et en vente. Il reste à saisir la facture.</p>${arr.map(arrCard).join("") || `<div class="empty" style="background:none">${ic("check")}Tout est soldé.</div>`}<span class="arrow">${ic("right")}</span></div>
      <div class="card stage-c h-green"><div class="sh"><span class="hold" style="width:34px;height:34px;border-radius:11px">${ic("receipt")}</span><b>3 · Soldé</b><span class="n">${set.length}</span></div>
        <p>Facture rapprochée, coût de revient connu.</p>${set.map(setRow).join("")}</div>
    </div>
    <div class="card" style="padding:14px 18px;display:flex;gap:14px;align-items:center">
      <span class="hold h-neutral">${ic("eyeoff")}</span>
      <div style="flex:1"><b style="font-size:14px">Comment ça marche</b><div class="l2" style="white-space:normal">Au quai, on compte ce qui est dans les cartons — sans voir ce qui était commandé — et le stock entre tout de suite. Au bureau, on solde avec la facture : prix, transport, et Ordra explique l'écart s'il y en a un.</div></div>
    </div></div>`;
}
function drawerRecord(){
  const saved = S.recSaved;
  const po = POS.find(p => p.id === S.recPo);
  if (saved) return `<div class="scrim" data-close></div><aside class="drawer wide" role="dialog" aria-modal="true">
    <div class="dr-top"><span class="hold j-rec">${ic("dock")}</span><div class="dr-title"><b>Arrivage enregistré</b><small>${siteName(saved.site)} · aujourd'hui 17:20 · par Firas</small></div><button class="xbtn" data-close>${ic("x")}</button></div>
    <div class="dr-body">
      <div class="ok-big"><span class="hold">${ic("check")}</span><div><b>+${fnum(saved.lines.reduce((s, l) => s + l.q, 0))} unités en stock à ${siteName(saved.site)}</b><small>Elles sont vendables dès maintenant. Le bureau soldera avec la facture.</small></div></div>
      ${po ? `<div class="sec"><div class="eb">${ic("list")}Comparé à la commande ${po.id}<span>${supName(po.sup)}</span></div>
        ${saved.lines.map(l => { const pl_ = po.lines.find(x => x.p === l.p); const o = pl_ ? pl_.o : 0, gap = l.q + l.d - o;
          return `<div class="res">${thumb(P(l.p))}<div><b>${esc(P(l.p).fr)}</b><small>commandé ${o} · compté ${l.q + l.d}${l.d ? ` dont ${l.d} abîmés` : ""}</small></div>
            ${!pl_ ? `<span class="pl h-violet">hors commande</span>` : gap === 0 && !l.d ? `<span class="pl h-green">${ic("check")}complet</span>` : gap < 0 ? `<span class="pl h-amber">${ic("alert")}${-gap} manquent</span>` : l.d ? `<span class="pl h-red">${ic("broken")}${l.d} abîmés</span>` : `<span class="pl h-violet">+${gap} en trop</span>`}</div>`; }).join("")}
        <div class="l2" style="white-space:normal">Les manquants restent « en route » sur la commande. Les abîmés n'entrent pas en stock : le bureau les retrouvera au soldage.</div></div>` : ""}
    </div>
    <div class="dr-foot"><button class="btn2" data-close>Fermer</button><span class="grow"></span><button class="btn" data-settle="new">${ic("receipt")}Solder maintenant</button></div></aside>`;
  const lines = S.recLines;
  return `<div class="scrim" data-close></div><aside class="drawer wide" role="dialog" aria-modal="true">
    <div class="dr-top"><span class="hold j-rec">${ic("dock")}</span><div class="dr-title"><b>Enregistrer un arrivage</b><small>Comptez ce qui est dans les cartons. C'est tout.</small></div><button class="xbtn" data-close>${ic("x")}</button></div>

function drawerSettle(){
  const a = ARR.find(x => x.id === S.settle); if (!a) return "";
  const po = POS.find(p => p.id === a.po);
  const sup = po ? po.sup : "atlas";
  const units = a.lines.reduce((s, l) => s + l.q, 0), dmg = a.lines.reduce((s, l) => s + l.d, 0);
  const priceOf = l => { const pl_ = po && po.lines.find(x => x.p === l.p); return pl_ ? pl_.c : P(l.p).cost - 3; };
  const goods = a.lines.reduce((s, l) => s + l.q * priceOf(l), 0), billedDmg = a.lines.reduce((s, l) => s + l.d * priceOf(l), 0);
  const fees = +S.fees || 0;
  const invDefault = goods + billedDmg + fees;
  const inv = S.inv === "" ? invDefault : +S.inv.replace(/\s/g, "").replace(",", ".");
  const gap = Math.round((inv - goods - fees) * 1000) / 1000;
  const explained = Math.abs(gap - billedDmg) < .001 && billedDmg > 0;
  const landed = l => priceOf(l) + fees / units;
  const recon = gap === 0
    ? `<div class="recon h-green"><div class="recon-h"><span class="hold">${ic("check")}</span><div><b>La facture tombe juste</b><small>Rien à réclamer — vous pouvez solder.</small></div></div></div>`
    : explained
    ? `<div class="recon h-amber"><div class="recon-h"><span class="hold">${ic("alert")}</span><div><b>Écart de ${fmoney(gap)} LYD — c'est exactement les ${dmg} abîmés</b><small>Le fournisseur les a facturés alors qu'ils n'entrent pas en stock.</small></div></div>
        <div class="eq"><div><span>Facture</span><b>${fmoney(inv)}</b></div><div><span>− marchandise vendable (${units} × prix)</span><b>${fmoney(goods)}</b></div><div><span>− transport</span><b>${fmoney(fees)}</b></div><div class="tot"><span>= ${dmg} abîmés × ${fmoney(billedDmg / dmg)}</span><b>${fmoney(gap)} LYD</b></div></div>
        <label class="mi" style="display:flex;gap:10px;align-items:center;font-weight:700;font-size:13.5px;cursor:pointer"><input type="checkbox" ${S.claimed ? "checked" : ""} data-claim style="width:18px;height:18px;accent-color:var(--brand)"> Ouvrir une réclamation de ${fmoney(gap)} LYD et ne pas la payer</label></div>`
    : `<div class="recon h-red"><div class="recon-h"><span class="hold">${ic("alert")}</span><div><b>Écart de ${fmoney(gap)} LYD que rien n'explique</b><small>Vérifiez le total de la facture ou les prix — on ne solde pas un écart sans raison.</small></div></div></div>`;
  const canSettle = gap === 0 || (explained && S.claimed);
  return `<div class="scrim" data-close></div><aside class="drawer wide" role="dialog" aria-modal="true">
    <div class="dr-top"><span class="hold j-rec">${ic("receipt")}</span><div class="dr-title"><b>Solder l'arrivage · ${siteName(a.site)} · ${a.day}</b><small>${fnum(units)} unités déjà en stock${dmg ? ` · ${dmg} abîmées` : ""} · ${a.po || "hors commande"}</small></div><button class="xbtn" data-close>${ic("x")}</button></div>
    <div class="dr-body">
      <div class="sec"><div class="eb">${ic("file")}La facture du fournisseur</div>
        <div class="g2"><div class="fld"><label>Fournisseur</label><input class="inp" value="${supName(sup)}"></div><div class="fld"><label>Total de la facture (LYD)</label><input class="inp money" data-inv value="${S.inv === "" ? fmoney(invDefault) : esc(S.inv)}"></div></div>
        <div class="g2"><div class="fld"><label>N° de facture</label><input class="inp" placeholder="ex. F-2026-118"></div><div class="fld"><label>Transport et frais d'approche (LYD)</label><input class="inp money" data-fees value="${esc(S.fees)}"></div></div></div>
      <div class="sec"><div class="eb">${ic("coins")}Prix et coût de revient<span>le transport est réparti par unité</span></div>
        <div class="cost hd"><span></span><span>Produit</span><span class="e">Reçu</span><span class="e">Prix unitaire</span><span class="e">Coût de revient</span></div>
        ${a.lines.map(l => `<div class="cost">${thumb(P(l.p))}<span><b>${esc(P(l.p).fr)}</b>${l.d ? `<br><small style="color:var(--bad);font-weight:700">+ ${l.d} abîmés</small>` : ""}</span><span class="e num"><b>${l.q}</b></span><input class="inp money" value="${fmoney(priceOf(l))}"><span class="e num"><b>${fmoney(landed(l))}</b></span></div>`).join("")}
        <div class="l2" style="white-space:normal">Le coût de revient de chaque produit sera mis à jour pour les ventes à venir — les commandes déjà livrées gardent leur marge.</div></div>
      ${recon}

  return `<div class="page">${header(`Compter · ${siteName(cur.s)}`, `Libye <span class="sep"></span> les produits jamais comptés d'abord <span class="sep"></span> environ 1 minute chacun`, `<button class="btn2" data-go="stock">${ic("x")}Terminer plus tard</button>`)}

const BEFORE = {today:"today", out:"out", returns:"returns", receive:"arrivals", stock:"stock", count:null};

  let body;
  if (S.before){

  } else {

    const dr = S.decide ? drawerDecide() : S.settle ? drawerSettle() : S.rec ? drawerRecord() : S.open ? drawerProduct() : "";

  }

}
let toastT;
function toast(t){ S.toast = t; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2600); }
function go(k){ Object.assign(S, {screen:k, tile:null, roll:null, q:"", inHand:null, open:null, decide:null, settle:null, rec:null, recSaved:null}); if (k === "stock") S.stockTab = S.stockTab || "products"; render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-before],[data-site],[data-tile],[data-roll],[data-take],[data-act],[data-pickup],[data-decide],[data-cause],[data-close],[data-prod],[data-stab],[data-rec-new],[data-settle],[data-recsite],[data-addp],[data-qd],[data-rml],[data-cd],[data-claim]");
  if (!t) return; const d = t.dataset;
  if (d.go !== undefined && d.go) return go(d.go);
  if (d.before !== undefined) { S.before = d.before === "1"; return render(); }
  if (d.site) { S.site = d.site; S.roll = null; return render(); }
  if (d.tile !== undefined) { S.tile = S.tile === d.tile ? null : d.tile; S.roll = null; return render(); }
  if (d.roll !== undefined) { S.roll = d.roll || null; return render(); }
  if (d.pickup) { S.pickup[d.pickup] = "17:20"; toast(`${siteName(d.pickup)} : les prochaines expéditions ne demanderont plus de ramassage aujourd'hui`); return render(); }
  if (d.take) { e.stopPropagation(); S.inHand = S.inHand === d.take ? null : d.take; return render(); }
  if (d.decide) { S.decide = d.decide; S.cause = null; return render(); }
  if (d.cause) { S.cause = d.cause === "pick" ? "pick" : d.cause; return render(); }
  if (d.prod) { S.open = d.prod; return render(); }
  if (d.stab) { S.stockTab = d.stab; S.tile = null; return render(); }
  if (d.recNew !== undefined) { S.open = null; S.rec = "new"; S.recSaved = null; S.recPo = d.recNew || null;
    const po = POS.find(p => p.id === d.recNew); S.recSite = po ? po.site : "ben"; S.recLines = po ? po.lines.map(l => ({p:l.p, q:"", d:0})) : []; return render(); }
  if (d.settle) { if (d.settle === "new") { const a = ARR[ARR.length - 1]; S.rec = null; S.recSaved = null; S.settle = a.id; } else S.settle = d.settle; S.inv = ""; S.fees = "120"; S.claimed = false; return render(); }
  if (d.recsite) { S.recSite = d.recsite; return render(); }
  if (d.addp) { const k = S.recLines.findIndex(l => l.p === d.addp); if (k >= 0) S.recLines.splice(k, 1); else S.recLines.push({p:d.addp, q:"", d:0}); return render(); }
  if (d.qd) { const [i, s] = d.qd.split(":"); const l = S.recLines[+i]; l.q = Math.max(0, (+l.q || 0) + (+s)); return render(); }
  if (d.rml !== undefined) { S.recLines.splice(+d.rml, 1); return render(); }
  if (d.cd) { if (S.cnt.shown) return; S.cnt.typed = String(Math.max(0, (+S.cnt.typed || 0) + (+d.cd))); return render(); }
  if (d.claim !== undefined) { S.claimed = !S.claimed; return render(); }
  if (d.close !== undefined) { S.decide = null; S.settle = null; S.rec = null; S.recSaved = null; S.open = null; return render(); }
  const a = d.act;
  if (a === "drop") { S.inHand = null; return render(); }
  if (a === "run") { const first = outTodo()[0]; S.inHand = first && first.id; return render(); }
  if (a === "bind") { const o = OUT.find(x => x.id === S.inHand); o.done = true; o.at = "17:20"; o.by = "Firas";
    const next = outTodo().find(x => x.roll === o.roll); S.inHand = next ? next.id : null;
    toast(`Sticker 4471 lié à ${o.id} — vérifié chez Darb${next ? ` · suivant : même rouleau ${ROLLS[o.roll].fr}` : ""}`); return render(); }
  if (a === "decide") { const r = RET.find(x => x.id === S.decide); r.done = S.cause === "ok" ? "ok" : "bad";
    toast(S.cause === "ok" ? `+1 ${P(r.p).fr} remis en stock à ${siteName(r.site)}` : `Noté abîmé (${S.cause}) — rien n'entre en stock`); S.decide = null; return render(); }
  if (a === "recsave") { const lines = S.recLines.map(l => ({p:l.p, q:+l.q || 0, d:+l.d || 0})).filter(l => l.q || l.d);
    const po = POS.find(p => p.id === S.recPo);
    ARR.push({id:"a" + (ARR.length + 1), site:S.recSite, day:"aujourd'hui", when:"4 oct. · 17:20", by:"Firas", po:po ? po.id : null, lines});
    if (po) lines.forEach(l => { const x = po.lines.find(y => y.p === l.p); if (x) x.r += l.q + l.d; });
    lines.forEach(l => { const p = P(l.p); p[S.recSite] += l.q; });
    S.recSaved = {site:S.recSite, lines}; return render(); }
  if (a === "settle") { const ar = ARR.find(x => x.id === S.settle); ARR = ARR.filter(x => x.id !== S.settle);
    SETTLED.unshift({ref:`REC-LY-2026-000${SETTLED.length + 2}`, sup:(POS.find(p => p.id === ar.po) || {sup:"atlas"}).sup, site:ar.site, day:"4 oct.", units:ar.lines.reduce((s, l) => s + l.q, 0), value:0, state:S.claimed ? "claim" : "ok", claim:0});
    S.settle = null; toast("Soldé — coût de revient mis à jour, le dû apparaît dans Finances › Achats"); return render(); }
  if (a === "cntshow") { S.cnt.shown = true; return render(); }
  if (a === "recount") { S.cnt.shown = false; S.cnt.typed = ""; return render(); }
  if (a === "cntok" || a === "skip") { const list = neverCounted().filter(x => S.site === "all" ? x.s === "ben" : true); const cur = list[S.cnt.i];
    if (a === "cntok" && cur){ S.cnt.done.push(cur.p.id + cur.s); toast(`${cur.p.fr} · ${siteName(cur.s)} : ${S.cnt.typed} comptés`); }
    S.cnt.i = Math.min(S.cnt.i + 1, list.length - 1); S.cnt.typed = ""; S.cnt.shown = false; return render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-q]")) { S.q = t.value; const pos = t.selectionStart; render(); const n = document.querySelector("[data-q]"); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.matches("[data-qv]")) { S.recLines[+t.dataset.qv].q = t.value.replace(/\D/g, ""); }
  if (t.matches("[data-dv]")) { S.recLines[+t.dataset.dv].d = t.value.replace(/\D/g, ""); }
  if (t.matches("[data-cnt]")) { S.cnt.typed = t.value.replace(/\D/g, ""); const b = document.querySelector('[data-act="cntshow"]'); if (b) b.disabled = S.cnt.typed === ""; }
  if (t.matches("[data-inv]")) { S.inv = t.value; }
  if (t.matches("[data-fees]")) { S.fees = t.value.replace(",", "."); }
});
document.addEventListener("change", e => { if (e.target.matches("[data-inv],[data-fees],[data-qv],[data-dv]")) render(); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "Escape") { S.decide = S.settle = S.rec = S.open = null; S.recSaved = null; return render(); }
  if (e.key === "b" || e.key === "B") { S.before = !S.before; return render(); }
  const n = +e.key; if (n >= 1 && n <= SCREENS.length) go(SCREENS[n - 1][0]);
});
/* URL presets for screenshots */
if (S.rec === "settle") { ARR.push({id:"a2", site:"ben", day:"aujourd'hui", when:"4 oct. · 10:42", by:"Nabil", po:"BC-LY-0006", lines:[{p:"p5", q:118, d:2}, {p:"p6", q:40, d:0}]}); S.settle = "a2"; S.rec = null; }
if (S.rec === "new") { S.recPo = "BC-LY-0006"; S.recSite = "ben"; }
if (QS.get("rec") === "saved") { S.screen = "receive"; S.recPo = "BC-LY-0006"; S.rec = "new"; S.recLines = [{p:"p5", q:118, d:2}, {p:"p6", q:40, d:0}];
  const po = POS[1]; po.lines[0].r = 120; po.lines[1].r = 40; ARR.push({id:"a2", site:"ben", day:"aujourd'hui", when:"4 oct. · 17:20", by:"Firas", po:"BC-LY-0006", lines:[{p:"p5", q:118, d:2}, {p:"p6", q:40, d:0}]});
  S.recSaved = {site:"ben", lines:[{p:"p5", q:118, d:2}, {p:"p6", q:40, d:0}]}; }
if (QS.get("decide")) { S.screen = "returns"; S.decide = RET[0].id; S.cause = QS.get("decide") === "bad" ? "Emballage" : "ok"; }
if (QS.get("hand")) { S.screen = "out"; S.inHand = outTodo()[0].id; }
render();
</script>
