<!doctype html>
<!--
  Journaux — planche v3 (2026-10-08). « Aurore calme » : le SQUELETTE de /orders (Commandes) —
  en-tête · 4 tuiles qui filtrent · ligne de recherche · une ligne de filtres · UN tableau avec
  ses en-têtes de colonnes — habillé comme /feedback (Voix du client) : sol aurore, verre 20 px,
  fil « Système › Journaux », bascule de vue à droite de l'en-tête, groupes de jours en lignes
  de tableau, tiroir flottant 26 px.
  v2 (prototypes/journaux-v2.html, en prod) reste la référence du CONTENU : mêmes deux questions
  (Aperçu = est-ce que tout marche ? · Historique = que s'est-il passé ?), mêmes règles, mêmes
  phrases, mêmes panneaux. v3 change la forme.

  Ce que le propriétaire compare :
    view=overview|history     les deux vues (une seule page, un seul H1)
    tile=…                    la tuile allumée (overview : now|watch|systems|muted · history : team|ext|auto|sec)
    drawer=none|issue|row|trace   un tiroir ouvert
    calm=0|1                  aujourd'hui (3 choses à surveiller) ou « tout fonctionne »
  Pas de langue : Journaux est super_admin seulement, et un super_admin est toujours en français.

  Chiffres : base de prod lue le 8 oct. 2026 — 3 problèmes ouverts (tous « à surveiller »),
  1 en sourdine ; sur 7 jours 113 modifications d'équipe dont 35 connexions, 38 erreurs
  (21 sur /api/cities), 10 appels transporteur dont 2 en échec, 2 061 passages automatiques.
  Noms de boutiques, de personnes et du transporteur coupé INVENTÉS (dépôt public).
  Touches : V vue · C calme · / retrouver une commande · Échap ferme
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journaux v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --quiet:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --card:rgba(255,255,255,.86); --card-bd:rgba(16,24,40,.06); --r:20px;
  --sh:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(42,52,110,.05);
  --sh-hover:0 18px 46px rgba(42,52,110,.13);
  --sh-float:0 20px 52px rgba(42,52,110,.18); --sh-panel:0 30px 80px rgba(42,52,110,.24);
  --glass-in:rgba(255,255,255,.72); --glass-in-bd:rgba(255,255,255,.95);
  --brand:#15803D; --brand-h:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  --good:#067647; --good-bg:#ECFDF3; --live:#12B76A; --bad:#B42318; --bad-bg:#FEF3F2; --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --flat:#475467; --flat-bg:#F2F4F7;
  --aurore:radial-gradient(58% 40% at 2% 0%,#D3DBFF 0%,transparent 72%),radial-gradient(48% 36% at 100% 0%,#FAD3EC 0%,transparent 72%),
           radial-gradient(56% 46% at 98% 100%,#C6F2DA 0%,transparent 72%),radial-gradient(52% 46% at 0% 100%,#FFE6B3 0%,transparent 72%),
           radial-gradient(40% 30% at 50% 50%,#EDE7FF 0%,transparent 80%),#F6F7FB;
}
/* the six areas — the hues of Commandes' tiles (.h-*) */
.h-neutral{--pb:#F2F4F7;--pd:#E4E7EC;--pi:#344054}
.h-amber{--pb:#FFFAEB;--pd:#FEDF89;--pi:#B54708}
.h-violet{--pb:#F4F3FF;--pd:#D9D6FE;--pi:#5925DC}
.h-teal{--pb:#F0FDF9;--pd:#99F6E0;--pi:#107569}
.h-green{--pb:#ECFDF3;--pd:#ABEFC6;--pi:#067647}
.h-red{--pb:#FEF3F2;--pd:#FECDCA;--pi:#B42318}
.h-blue{--pb:#EFF8FF;--pd:#B2DDFF;--pi:#175CD3}
.h-pink{--pb:#FDF2FA;--pd:#FCCEEE;--pi:#C11574}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;background:#F6F7FB}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* ── studio bar (not part of the design) ── */
.studio{position:relative;z-index:90;background:#0E1013;color:#E6E8EB;padding:10px 20px 11px;display:grid;gap:7px}
.studio .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.studio .word{font-weight:800;font-size:15px}
.studio .word small{font-weight:500;color:#7F858F;font-size:12.5px;margin-inline-start:8px}
.studio .grp{display:flex;align-items:center;gap:7px}
.studio .glab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7F858F}
.studio .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#1B1F26}
.studio .seg button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:#B5BAC2;white-space:nowrap}
.studio .seg button:hover{color:#fff}
.studio .seg button.on{background:#2A303A;color:#fff}
.studio .why{font-size:12.5px;color:#B5BAC2;line-height:1.5}
.studio .why b{color:#fff}

/* ── app shell (the live sidebar, simplified) ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:#0E1013;color:#C9CDD3;padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:4px 8px 14px;color:#fff;font-weight:800;font-size:17px}
.side .mk{margin:0 2px 14px;padding:9px 10px;border-radius:12px;background:#171A20;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:9px;font-size:13px;color:#fff;font-weight:600}
.side .mk i{width:26px;height:26px;border-radius:7px;background:#344054;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.side .mk div{line-height:1.3}
.side .mk small{display:block;color:#7F858F;font-weight:500;font-size:11.5px}
.side .sec{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:#C9CDD3;font-weight:500}
.side .sec .ic{color:#7F858F}
.side .sec .rb{margin-inline-start:auto;min-width:18px;height:18px;border-radius:9px;background:#F04438;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.side .glab2{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7F858F;padding:14px 10px 4px}
.side .sec.on{background:rgba(255,255,255,.07);color:#fff;font-weight:700}
.side .sec.on .ic{color:#fff}

.stage{background:var(--aurore);background-attachment:fixed;min-width:0;position:relative}
.page{max-width:1320px;margin:0 auto;padding:26px 32px 110px;display:flex;flex-direction:column;gap:16px}

/* header — /feedback's crumb + title, Commandes' live sub line, controls on the right */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.crumb i{font-style:normal;margin:0 6px;color:var(--ink-4)}
.ph h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700}
.live i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--live)}
.live i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{to{transform:scale(2.6);opacity:0}}
.sub .warnw{color:var(--warn);font-weight:700}
.ph .end{display:flex;align-items:center;gap:10px}
.segc{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.segc button{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.segc button:hover{color:var(--ink)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.segc .cc{display:inline-grid;place-items:center;height:20px;min-width:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:800;background:var(--warn-bg);color:var(--warn)}
.btn2{height:40px;padding:0 13px;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:rgba(255,255,255,.88);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:15px;height:15px;color:var(--ink-3)}
.kbd2{font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid rgba(15,23,40,.12);border-radius:6px;padding:0 6px;line-height:20px}

/* work tiles — Commandes .wts, they filter the table */
.wts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wt{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--glass-in);border:1px solid var(--glass-in-bd);box-shadow:var(--sh);backdrop-filter:blur(20px) saturate(170%);text-align:start;transition:transform .15s,box-shadow .15s;min-width:0}
.wt:hover{transform:translateY(-2px);box-shadow:var(--sh-hover)}
.wt.on{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand),var(--sh)}
.wt .hold{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.wt .hold .ic{width:20px;height:20px}
.wt-t{display:grid;min-width:0}
.wt b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wt b small{font-size:15px;color:var(--ink-3);font-weight:700;letter-spacing:-.01em}
.wt-t > span{font-size:13.5px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-t > small{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-t > small em{font-style:normal;color:var(--bad);font-weight:700}
.wt-t > small em.w{color:var(--warn)}
.wt.zero b{color:var(--quiet)}
.wt-x{position:absolute;top:10px;inset-inline-end:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff}
.wt-x .ic{width:12px;height:12px;stroke-width:2.6}

/* search + filter line — Commandes .srch / .fl / .fb */
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);box-shadow:var(--sh);color:var(--ink-3)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:14px;color:var(--ink);min-width:0;font-weight:500}
.srch input::placeholder{color:var(--ink-3)}
.srch:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12),var(--sh)}
.fl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 10px 0 12px;border-radius:11px;background:rgba(255,255,255,.75);border:1px solid rgba(15,23,40,.08);font-size:13px;font-weight:700;color:var(--ink-2)}
.fb:hover{background:#fff;color:var(--ink)}
.fb.on{background:#fff;color:var(--ink);border-color:rgba(21,128,61,.55)}
.fb .ic{width:15px;height:15px}
.fb .chev{width:13px;height:13px;color:var(--ink-3)}
.fb .l{color:var(--ink-3);font-weight:600}
.fb .sw{width:30px;height:18px;border-radius:99px;background:var(--ink-4);position:relative;flex:none}
.fb .sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.fb .sw.on{background:var(--brand)}
.fb .sw.on::after{inset-inline-start:14px}
.fl .count{margin-inline-start:auto;font-size:13px;color:var(--ink-2);font-weight:600}
.fl .count b{color:var(--ink);font-weight:800}

/* the one table — glass list, /feedback column headers, white rows */
.list{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(16px) saturate(150%);overflow:hidden}
.lh,.row{display:grid;align-items:center;column-gap:14px;padding-inline:18px 14px}
.lh{height:42px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);background:rgba(255,255,255,.45)}
.lh .e,.row .e{text-align:end;justify-self:end}
.rows{background:#fff}
.row{position:relative;min-height:64px;border-top:1px solid var(--line);cursor:pointer;padding-block:10px}
.row:hover{background:#F8F9FC}
.row.open::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--brand)}
.row.quiet{cursor:default}
.row.quiet:hover{background:#fff}
.chv{width:16px;height:16px;color:var(--quiet);justify-self:end}
.t-prob{grid-template-columns:minmax(300px,1fr) 200px 100px 170px 124px 18px}
.t-sys{grid-template-columns:minmax(240px,1fr) 160px 150px 210px 132px 18px}
.t-hist{grid-template-columns:62px 190px minmax(280px,1fr) 170px 112px 18px}

/* cells */
.oc{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--pb);color:var(--pi);box-shadow:inset 0 0 0 1px var(--pd)}
.thumb .ic{width:19px;height:19px}
.thumb.sm{width:30px;height:30px;border-radius:9px}
.thumb.sm .ic{width:15px;height:15px}
.oc-t{min-width:0;flex:1}
.nm{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.l2 code{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2)}
.cell{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.mk{display:inline-grid;place-items:center;height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.04em;background:rgba(15,23,40,.06);color:var(--ink-2);margin-inline-start:6px;vertical-align:1px}
.imp{text-align:end}
.imp b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.imp small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.time{font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:var(--good-bg);color:var(--good)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.st.off{background:var(--flat-bg);color:var(--flat)}
.st.none{background:none;color:var(--ink-3);font-weight:600;padding:0}
.area{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.area i{width:8px;height:8px;border-radius:50%;background:var(--pi);flex:none}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none;background:linear-gradient(140deg,var(--a5,#475467),var(--a7,#1D2939));box-shadow:0 0 0 2px #fff,0 4px 10px color-mix(in srgb,var(--a5,#475467) 35%,transparent)}
.av .ic{width:14px;height:14px}
.ser{display:inline-grid;place-items:center;height:20px;min-width:26px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(15,23,40,.06);color:var(--ink-2);margin-inline-start:6px;vertical-align:1px}
/* 48 hours, one bar each */
.hb{display:flex;gap:1.5px;align-items:flex-end;height:22px}
.hb i{flex:1;min-width:2px;border-radius:1.5px;height:100%}
.hb .o{background:color-mix(in srgb,var(--live) 55%,#fff)}
.hb .n{background:rgba(15,23,40,.08);height:45%}
.hb .f{background:#F04438}
.hb .m{background:var(--warn-dot)}
.hb .x{background:transparent;border-bottom:1.5px dotted rgba(15,23,40,.18);height:2px}
/* day group — /feedback tr.g */
.g{display:flex;align-items:center;gap:10px;padding:9px 18px;border-top:1px solid var(--line);background:rgba(246,247,251,.85);font-size:13px;font-weight:800}
.g .gn{color:var(--ink-3);font-weight:600}
.g:first-child{border-top:0}
.routine{display:flex;align-items:center;gap:10px;padding:11px 18px 12px 94px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);font-weight:600;background:#fff}
.routine .ic{width:14px;height:14px;color:var(--quiet)}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--line);background:#fff}
.empty{display:flex;align-items:center;gap:16px;padding:26px 24px;background:#fff}
.empty .okc{width:44px;height:44px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;flex:none}
.empty .okc .ic{width:22px;height:22px}
.empty b{font-size:16px;font-weight:800;display:block}
.empty small{font-size:13px;color:var(--ink-3);font-weight:500}
.empty .lnk{margin-inline-start:auto}
.lnk{font-size:13px;font-weight:700;color:var(--brand-h);display:inline-flex;align-items:center;gap:6px}
.lnk:hover{text-decoration:underline}
.foldrow{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;width:100%}
.foldrow:hover{background:#F8F9FC;color:var(--ink)}
.foldrow .ic{width:14px;height:14px;color:var(--quiet)}

/* drawer — the floating glass panel of /feedback */
.scrim{position:fixed;inset:0;background:rgba(15,23,40,.22);backdrop-filter:blur(3px);z-index:95}
.drawer{position:fixed;top:12px;bottom:12px;inset-inline-end:12px;width:520px;max-width:calc(100vw - 24px);z-index:96;background:rgba(250,251,255,.94);border:1px solid #fff;border-radius:26px;box-shadow:var(--sh-panel);backdrop-filter:blur(24px);display:flex;flex-direction:column;overflow:hidden;animation:sl .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(30px);opacity:0}}
.dh{padding:20px 22px 14px;display:flex;gap:14px;align-items:flex-start}
.dh .x{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.75);border:1px solid #fff;color:var(--ink-2);flex:none}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.dh h2{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25;margin-top:5px}
.dh .s{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);font-weight:600}
.db{padding:0 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.gl{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:14px 16px}
.gl h4{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.gl p{font-size:13.5px;color:var(--ink-2);font-weight:500;line-height:1.55}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fig{background:#fff;border:1px solid rgba(15,23,40,.06);border-radius:14px;padding:12px 14px}
.fig b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fig small{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px}
.fig.w b{color:var(--warn)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:10px;font-size:13.5px;font-weight:600;line-height:1.45}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--brand-bg);color:var(--brand-h);font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:none}
.tech summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
.tech summary::-webkit-details-marker{display:none}
.tech pre{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#101828;color:#E6E8EB;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.ct{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.ct th{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:start;padding:0 8px 8px;border-bottom:1px solid var(--line)}
.ct td{padding:9px 8px;border-bottom:1px solid var(--line);font-weight:600}
.ct tr:last-child td{border-bottom:0}
.ct .bf{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(15,23,40,.25)}
.ct .af{color:var(--ink);font-weight:800}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.facts dt{color:var(--ink-3);font-weight:600}
.facts dd{margin:0;font-weight:700}
.dsrch{display:flex;align-items:center;gap:9px;height:46px;border-radius:14px;background:#fff;border:1.5px solid var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12);padding:0 12px;color:var(--quiet)}
.dsrch input{border:0;outline:0;flex:1;background:transparent;font-size:15px;font-weight:700;color:var(--ink)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-inline-start:26px;padding-block:7px;font-size:13.5px;font-weight:600}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--pi);box-shadow:0 0 0 3px var(--pb)}
.tl li::after{content:"";position:absolute;inset-inline-start:9px;top:26px;bottom:-8px;width:1.5px;background:#E4E7EC}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:12px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.tl small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.df{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.55)}
.df .sp{flex:1}
.btn{height:38px;padding:0 15px;border-radius:11px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--brand-h)}
.btn .ic{width:15px;height:15px}
.df .btn2{height:38px}

   ${tile('muted','h-neutral','bell',muted.length,'En sourdine',muted.length?'jusqu’au 10 oct.':'Aucun problème ignoré',!muted.length)}
  </div>
  <label class="srch">${ic('search')}<input placeholder="Chercher un problème, un système, une boutique, un transporteur…"><span class="kbd2">⌘K</span></label>
  <div class="fl">
    <button class="fb">${ic('layers')}<span class="l">Catégorie</span> Toutes ${ic('down','chev')}</button>
    <button class="fb">${ic('globe')}<span class="l">Marché</span> Tous ${ic('down','chev')}</button>`;
  if(S.tile==='systems'){
    const list=S.calm?SYS.map(s=>({...s,st:s.st[0]==='warn'?['ok','Fonctionne']:s.st})):SYS;
    h+=`<span class="count"><b>${list.length}</b> systèmes affichés sur ${SYS_TOTAL}</span></div>
    <div class="list"><div class="lh t-sys"><span>Système</span><span>Catégorie</span><span>Dernière activité</span><span>48 dernières heures</span><span>État</span><span></span></div><div class="rows">
    ${list.map(s=>`<div class="row t-sys" data-drawer="issue"><span class="oc">${thumb(s.area)}<span class="oc-t"><span class="nm">${s.n}${s.mk?`<span class="mk">${s.mk}</span>`:''}</span><span class="l2">${s.where}</span></span></span>
      <span>${areaPill(s.area)}</span><span class="cell">${s.last}</span><span class="hb">${[...s.bars].map(c=>`<i class="${c==='-'?'x':c==='i'?'n':c}"></i>`).join('')}</span>
      <span><span class="st ${s.st[0]}"><i></i>${s.st[1]}</span></span>${ic('chev','chv')}</div>`).join('')}
    <button class="foldrow">${ic('down')}Afficher les ${SYS_TOTAL-list.length} autres systèmes en ordre</button></div></div>`;
    return h;
  }
  let rows=S.tile==='muted'?muted:S.tile==='now'?[]:open;
  h+=`<span class="count"><b>${rows.length}</b> ${S.tile==='muted'?'en sourdine':'problème'+(rows.length>1?'s':'')+' ouvert'+(rows.length>1?'s':'')}</span></div>
  <div class="list"><div class="lh t-prob"><span>Problème</span><span>Système</span><span>Depuis</span><span class="e">Impact</span><span>État</span><span></span></div><div class="rows">`;
  if(!rows.length){
    h+=`<div class="empty"><span class="okc">${ic('check')}</span><div><b>${S.tile==='now'&&!S.calm?'Rien d’urgent':'Tout fonctionne'}</b><small>${S.tile==='now'&&!S.calm?'Les 3 choses ouvertes peuvent attendre — elles sont dans « À surveiller ».':`Rien à régler. Les ${SYS_TOTAL} systèmes suivis répondent normalement.`}</small></div><button class="lnk" data-tile="systems">Voir les systèmes ${ic('chev')}</button></div>`;
  } else {
    h+=rows.map((r,i)=>`<div class="row t-prob ${S.drawer==='issue'&&i===1?'open':''}" data-drawer="issue"><span class="oc">${thumb(r.area)}<span class="oc-t"><span class="nm">${r.title}</span><span class="l2">${r.line}</span></span></span>
      <span class="cell">${r.sys}${r.mk?`<span class="mk">${r.mk}</span>`:''}<small>${AREA[r.area].n}</small></span>
      <span class="cell">${r.since}</span><span class="imp"><b>${r.imp[0]}</b><small>${r.imp[1]}</small></span>
      <span><span class="st ${r.sev==='mute'?'off':r.sev}"><i></i>${r.sev==='mute'?'En sourdine':r.sev==='bad'?'À régler':'À surveiller'}</span></span>${ic('chev','chv')}</div>`).join('');
    if(S.tile!=='muted'&&muted.length) h+=`<button class="foldrow" data-tile="muted">${ic('bell')}1 problème en sourdine jusqu’au 10 oct.</button>`;
  }
  return h+`</div></div>`;
}
function history(){
  const F={team:['h-violet','users','113','Équipe','modifications · dont 35 connexions'],ext:['h-blue','plug','10','Systèmes externes','appels · <em>2 en échec</em>'],auto:['h-teal','repeat','2 061','Tâches automatiques','passages · <em>3 bloqués</em>'],sec:['h-red','shield','38','Sécurité et erreurs','erreurs · 1 connexion refusée']};
  let h=`<div class="wts">${Object.entries(F).map(([k,v])=>tile(k,v[0],v[1],v[2],v[3],v[4])).join('')}</div>
  <label class="srch">${ic('search')}<input placeholder="Chercher une personne, une commande, une boutique, une action…"><span class="kbd2">⌘K</span></label>
  <div class="fl">
   <button class="fb on">${ic('cal')}<span class="l">Période</span> 7 derniers jours ${ic('down','chev')}</button>
   <button class="fb">${ic('user')}<span class="l">Personne</span> Tout le monde ${ic('down','chev')}</button>
   <button class="fb">${ic('globe')}<span class="l">Marché</span> Tous ${ic('down','chev')}</button>
   <button class="fb ${S.onlyIssues?'on':''}" data-only>${`<span class="sw ${S.onlyIssues?'on':''}"></span>`}Problèmes seulement</button>
   <span class="count"><b>${S.onlyIssues?'12':'176'}</b> événements</span></div>
  <div class="list"><div class="lh t-hist"><span>Heure</span><span>Qui</span><span>Ce qui s’est passé</span><span>Catégorie</span><span>Résultat</span><span></span></div><div class="rows">`;
  for(const d of HIST){
    let rows=d.rows.filter(r=>(!S.tile||r.fam===S.tile)&&(!S.onlyIssues||r.res[0]==='bad'||r.res[0]==='warn'));
    if(!rows.length) continue;
    h+=`<div class="g">${d.day}<span class="gn">${d.n} événements</span></div>`;
    h+=rows.map((r,i)=>`<div class="row t-hist ${S.drawer==='row'&&d===HIST[0]&&i===0?'open':''}" data-drawer="row"><span class="time">${r.t}</span>
      <span class="who">${r.who?`<span class="av" style="--a5:${r.who[2]};--a7:${r.who[3]}">${r.who[0].split(' ').map(x=>x[0]).join('')}</span><span style="min-width:0"><b>${r.who[0]}</b><small>${r.who[1]}</small></span>`:`${thumb(r.area,true)}<span style="min-width:0"><b>${r.fam==='auto'?'Ordra':r.fam==='ext'?'Transporteur':'Ordra'}</b><small>${r.fam==='auto'?'automatique':r.fam==='ext'?'appel externe':'serveur'}</small></span>`}</span>
      <span class="oc-t"><span class="nm" style="font-weight:600">${r.what}${r.ser?`<span class="ser">×${r.ser}</span>`:''}</span><span class="l2">${r.sub}</span></span>
      <span>${areaPill(r.area)}</span><span>${r.res[1]?`<span class="st ${r.res[0]}"><i></i>${r.res[1]}</span>`:'<span class="st none">—</span>'}</span>${ic('chev','chv')}</div>`).join('');
    if(!S.onlyIssues&&(!S.tile||S.tile==='auto')) h+=`<div class="routine">${ic('repeat')}${d.routine} passages de routine sans changement (synchronisations, imports vides) — comptés, pas listés</div>`;
  }
  return h+`<div class="more"><button class="btn2">Afficher plus ancien</button></div></div></div>`;
}

/* ── drawers ── */
function drawer(){
  if(S.drawer==='none') return '';
  let head='',body='',foot='';
  if(S.drawer==='issue'){
    head=`${thumb('auto')}<div><div class="eyebrow"><span class="st warn" style="height:20px;font-size:11px"><i></i>À surveiller</span>Tâches automatiques</div><h2>« poll-carriers » reste bloqué</h2><div class="s">Ouvert le 4 oct. · dernier blocage le 6 oct. à 04:30 · se ferme seul</div></div>`;
    body=`<div class="figs"><div class="fig w"><b>3</b><small>blocages en 7 jours</small></div><div class="fig"><b>04:30</b><small>toujours à la même heure</small></div><div class="fig"><b>30 min</b><small>avant l’abandon</small></div></div>
     <div class="gl"><h4>Ce qui se passe</h4><p>Cette tâche démarre normalement mais ne se termine pas. Les autres passages réussissent, c’est pourquoi rien ne l’avait signalé : le travail de ces passages-là n’est pas fait.</p></div>
     <div class="gl"><h4>Que faire</h4><ol class="steps"><li>Regarder l’heure des blocages : s’ils tombent toujours à la même heure, une autre tâche lourde tourne en même temps.</li><li>Le problème se ferme seul après 7 jours sans blocage.</li></ol></div>
     <div class="gl"><h4>Les 48 dernières heures</h4><div class="hb" style="height:30px">${[...'oooooooooooooooooooooooooooomooooooooooooooooooo'].map(c=>`<i class="${c}"></i>`).join('')}</div><div class="s" style="display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--ink-3);font-weight:600"><span>6 oct. 16:00</span><span>maintenant</span></div></div>
     <div class="gl tech"><details><summary>${ic('chev')}Détails techniques</summary><pre>job        poll-carriers
schedule   */10 * * * *
runs       04 oct 04:30 · 05 oct 04:30 · 06 oct 04:30
status     failed (reaped after 30 min in running)
rule       job_hanging · fingerprint jobs:poll-carriers</pre></details></div>`;
    foot=`<button class="btn2">${ic('bell')}Ignorer 7 jours</button><span class="sp"></span><button class="btn2" data-view="history">${ic('history')}Voir dans l’historique</button>`;
  } else if(S.drawer==='row'){
    head=`<span class="av" style="--a5:#7A4BD8;--a7:#5925DC;width:42px;height:42px;font-size:14px">SB</span><div><div class="eyebrow">Équipe · aujourd’hui à 16:12</div><h2>Salma B. a modifié la boutique Maison Lina</h2><div class="s">Manager · Tunisie ${areaPill('intake')}</div></div>`;
    body=`<div class="gl"><h4>Ce qui a changé</h4><table class="ct"><thead><tr><th>Champ</th><th>Avant</th><th>Après</th></tr></thead><tbody>
       <tr><td>Active</td><td class="bf">non</td><td class="af">oui</td></tr>
       <tr><td>Onglet de la feuille</td><td class="bf">Commandes</td><td class="af">Commandes oct.</td></tr></tbody></table></div>
     <div class="gl"><h4>Le contexte</h4><dl class="facts"><dt>Qui</dt><dd>Salma B. · manager</dd><dt>Quand</dt><dd>mer. 8 oct. 2026 · 16:12:08</dd><dt>Marché</dt><dd>Tunisie</dd><dt>Depuis</dt><dd>Réglages › Boutiques</dd></dl></div>
     <div class="gl"><h4>Ensuite</h4><p>Le premier import de la feuille a tourné à 16:20 : <b>14 commandes</b> créées, 1 ligne refusée (« Missing product name »). Ce refus est le problème ouvert « Maison Lina : 1 ligne refusée à l’import ».</p></div>`;
    foot=`<button class="btn2" data-drawer="issue">${ic('eye')}Ouvrir le problème lié</button><span class="sp"></span><button class="btn2">${ic('user')}Tout ce qu’a fait Salma B.</button>`;
  } else {
    head=`<span class="thumb h-neutral">${ic('search')}</span><div><div class="eyebrow">Retrouver une commande</div><h2>Tout ce qui est arrivé à une commande</h2><div class="s">N° de commande, de suivi ou téléphone du client</div></div>`;
    body=`<label class="dsrch">${ic('search')}<input value="TN-48213"></label>
     <div class="gl"><h4>TN-48213 · Sérum éclat 30 ml × 2 · 110 TND</h4><ol class="tl">
       <li class="h-green"><time>3 oct. · 10:14</time>Reçue de Maison Lina<small>Google Sheets · ligne 812</small></li>
       <li class="h-amber"><time>3 oct. · 11:02</time>Appel sans réponse · 1ʳᵉ tentative<small>Amel R.</small></li>
       <li class="h-green"><time>3 oct. · 15:40</time>Confirmée<small>Amel R.</small></li>
       <li class="h-blue"><time>3 oct. · 15:41</time>Envoyée au transporteur · Atlas Express<small>Suivi 7731 0042 · accepté en 1,2 s</small></li>
       <li class="h-violet"><time>4 oct. · 09:30</time>Scannée à la sortie de l’entrepôt<small>Stock −2</small></li>
       <li class="h-amber"><time>4 oct. · 22:51</time>Suivi arrêté — Atlas Express désactivé<small>Dernière nouvelle du transporteur : « en transit »</small></li>
     </ol></div>`;
    foot=`<span class="sp"></span><button class="btn">${ic('box')}Ouvrir la commande</button>`;
  }
  return `<div class="scrim" data-close></div><aside class="drawer"><div class="dh">${head}<button class="x" data-close>${ic('x')}</button></div><div class="db">${body}</div><div class="df">${foot}</div></aside>`;
}

function render(){
  studio(); side();
  document.getElementById('stage').innerHTML=`<div class="page">${header()}${S.view==='overview'?overview():history()}</div>${drawer()}`;
  const st=document.getElementById('stage');
  st.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;S.tile='';S.drawer='none';render()});
  st.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{S.tile=S.tile===b.dataset.tile?'':b.dataset.tile;render()});
  st.querySelectorAll('[data-drawer]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.drawer=b.dataset.drawer;render()});
  st.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{S.drawer='none';render()});
  st.querySelectorAll('[data-only]').forEach(b=>b.onclick=()=>{S.onlyIssues=!S.onlyIssues;render()});
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='Escape'){S.drawer='none';render()}
  else if(e.key==='/'){e.preventDefault();S.drawer='trace';render()}
  else if(e.key==='v'||e.key==='V'){S.view=S.view==='overview'?'history':'overview';S.tile='';render()}
  else if(e.key==='c'||e.key==='C'){S.calm=!S.calm;render()}
});
render();
</script>
