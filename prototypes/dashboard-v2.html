<!doctype html>
<!--
  Accueil (/dashboard) — prototype v2 (2026-10-04) : la page d'accueil devient « vos boutiques ».

  Réponses du propriétaire (4 oct., 2e tour — elles remplacent « résumé + 3 portes » du matin) :
  - le travail de la page = VOS BOUTIQUES (page centrée boutiques ; le détail vit dans Performance) ;
  - UNE CARTE PAR BOUTIQUE — la boutique = le sous-compte / sous-domaine que voit le client, quelle que
    soit la plateforme (Converty, Shopify, LightFunnels, YouCan, WooCommerce, EasyOrders…) ;
  - l'argent = le PROFIT DU MARCHÉ + le PAYÉ PAR BOUTIQUE. Pas de profit par boutique tant que chaque
    campagne pub ne dit pas vers quelle boutique elle envoie (la pub est rattachée aux produits, et un
    produit peut se vendre dans plusieurs boutiques — 3 le font déjà en Libye) ;
  - clic sur une boutique = Performance › Commandes filtrée sur cette boutique.
  Décisions de l'expert : même bouton de dates que Performance (30 jours par défaut ; base = commandes
  REÇUES dans la période, suivies jusqu'à aujourd'hui) ; cartes de même taille jugées « sur 100 », la
  taille de la boutique dite par sa part ; < 30 commandes = « trop tôt pour juger » ; boutiques sans
  commande repliées sur une ligne ; 5 couleurs de boutique validées toutes paires (indigo, rose, cyan,
  or foncé, vert tilleul), la 6e et les suivantes en ardoise, regroupées en « Autres » dans la barre ;
  plateforme = étiquette neutre, jamais une couleur ; managers = même page sans argent.

  DONNÉES FICTIVES générées dans la page (graine fixe). Boutiques, domaines et produits inventés.
  Habillage « Aurore » (prototypes/team-v6.html · performance-commandes-v4.html) ; barre latérale = v4.
  URL : ?set=demain|aujourdhui|tn &period=7d|30d|90d|month|m:2026-09|custom&from=&to= &role=manager &sort=cmd|liv|paye
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accueil · vos boutiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand:#15803D; --brand-hover:#12692F;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-4:#5A616B; --sb-hov:rgba(255,255,255,.07);
  /* outcomes — fixed, the same as Performance › Commandes */
  --o-del:#079455; --o-ret:#F79009; --o-rej:#E8385A; --o-junk:#7A5AF8; --o-pend:#D5D9E0;
  /* Aurore */
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:24px; --r-in:16px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 20px 52px rgba(42,52,110,.14);
  --glass-in:rgba(255,255,255,.66); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7; --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A; --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --flat:#475467; --flat-bg:rgba(15,23,40,.05);
  --tip-bg:#101828; --accent:#3538CD; --rw:15px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* prototype bar */
.pbar{position:sticky;top:0;z-index:300;background:#16191E;color:#E6E8EB;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #000}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2}
.looks button.on{background:#fff;color:#0E1013}
.pbar label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B5BAC2;cursor:pointer}

/* shell + sidebar (v4's proposed structure) */
.stage{display:flex;min-height:calc(100vh - 45px)}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:45px;height:calc(100vh - 45px)}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1;text-align:start}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.sb-mk svg.flag{width:26px;height:18px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .sb-badge{flex:none}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.sb-badge.wn{background:rgba(247,144,9,.18);color:#FDB022}.sb-badge.s{background:rgba(18,183,106,.18);color:#47CD89}.sb-badge.c{background:rgba(240,68,56,.2);color:#F97066}
.sb-group{margin-top:14px}
.sb-gl{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.sb-gl span{flex:1}
.chg{display:none;height:16px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;align-items:center;flex:none;font-style:normal}
.marks .chg{display:inline-flex}
.chg.new{background:#7A5AF8;color:#fff}.chg.mv{background:rgba(255,255,255,.1);color:#C7D7FE}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:30px 40px 90px;background:var(--page);background-attachment:fixed}
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.ph > div:first-child{flex:1 1 480px;min-width:0}
.ph .dwrap{flex:none}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub b{color:var(--ink);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill .ic{width:13px;height:13px}
.chipb{height:32px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chipb:hover{background:#fff;color:var(--ink)}
.btn{height:34px;padding:0 14px;border-radius:10px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn:disabled{opacity:.35;cursor:default}
.btn2{height:32px;padding:0 13px;border-radius:10px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.08);color:var(--ink)}
.btn2:hover{background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:14px;height:14px}

/* shared */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.meta{font-size:13px;color:var(--ink-3);font-weight:500}
.tr{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tr .ic{width:12px;height:12px;stroke-width:2.8}
.tr.good{background:var(--good-bg);color:var(--good)} .tr.bad{background:var(--bad-bg);color:var(--bad)} .tr.eq,.tr.na{background:var(--flat-bg);color:var(--flat);padding:0 9px}
.k-del{--k:var(--o-del)} .k-ret{--k:var(--o-ret)} .k-rej{--k:var(--o-rej)} .k-junk{--k:var(--o-junk)} .k-pend{--k:var(--o-pend)}
.sw{width:11px;height:11px;border-radius:4px;background:var(--k);flex:none;display:inline-block}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ccy{font-size:15px;font-weight:700;color:var(--ink-3);letter-spacing:0;unicode-bidi:isolate}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}}
@keyframes sweep{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.8);opacity:0}}

/* banner (a market-wide fact that explains the cards) */
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--r);background:linear-gradient(120deg,rgba(255,228,232,.88),rgba(255,255,255,.7));border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(192,16,72,.08);backdrop-filter:blur(16px)}
.banner .bi{width:38px;height:38px;border-radius:12px;background:var(--o-rej);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(232,56,90,.35)}
.banner b{display:block;color:var(--bad);font-size:15px;font-weight:800}
.banner p{font-size:13px;color:var(--ink-2);margin-top:2px}
.banner .btn2{margin-inline-start:auto}

/* 1 · all stores */
.sum{z-index:5;padding:24px 28px 24px;display:grid;gap:20px;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.sum-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.sum-h h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sum-h .meta{margin-top:3px}
.doors{margin-inline-start:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doors > span{font-size:12px;font-weight:700;color:var(--ink-3);margin-inline-end:2px}
.door{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:10px;background:var(--glass-in);border:1px solid var(--glass-in-bd);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.door:hover{background:#fff;color:var(--ink)}
.door .ic{width:14px;height:14px}
.t4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st{position:relative;padding:15px 16px 14px;border-radius:var(--r-in);background:var(--glass-in);border:1px solid var(--glass-in-bd);text-align:start;min-width:0}
.st-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.st-h .ic{width:14px;height:14px;color:var(--ink-q)}
.st-h .tr{margin-inline-start:auto}
.st-n{display:flex;align-items:baseline;gap:3px;margin-top:10px;white-space:nowrap}
.st-n b{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.st-n small{font-size:15px;font-weight:700;color:var(--ink-3)}
.st-s{font-size:12px;color:var(--ink-3);margin-top:7px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.neg .st-n b{color:var(--bad)}
.why{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:700;color:var(--accent)}
.why:hover{text-decoration:underline}
.why .ic{width:13px;height:13px}
.mix{display:grid;gap:10px}
.mix-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mixbar{display:flex;gap:2px;height:16px;border-radius:99px;overflow:hidden;animation:reveal 1s cubic-bezier(.2,.8,.2,1) .15s backwards}
.mixbar i{display:block;height:100%;background:linear-gradient(180deg,var(--a5),var(--a7));min-width:3px;cursor:pointer;transition:opacity .2s}
.mixleg{display:flex;flex-wrap:wrap;gap:8px 20px}
.ml{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:opacity .2s}
.ml .sq{width:11px;height:11px;border-radius:4px;background:var(--a5);flex:none}
.ml b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.mix[data-hl] .mixbar i,.mix[data-hl] .ml{opacity:.28}
.mix[data-hl] .mixbar i.hl,.mix[data-hl] .ml.hl{opacity:1}
.empty{padding:30px;border-radius:18px;border:1.5px dashed var(--ink-4);text-align:center;color:var(--ink-2);font-weight:600;display:grid;gap:6px}
.empty small{color:var(--ink-3);font-weight:500;font-size:12.5px}

/* profit — its calculation, in the open */
.pop{position:absolute;z-index:90;top:calc(100% + 8px);inset-inline-end:0;width:400px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 24px 60px rgba(20,25,60,.22);padding:16px 18px;text-align:start;cursor:default}
.pop h4{font-size:14px;font-weight:800;margin-bottom:12px}
.pl{display:grid;grid-template-columns:1fr auto;gap:7px 16px;font-size:13px;align-items:baseline}
.pl span{color:var(--ink-2);font-weight:600}
.pl span small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.pl b{text-align:end;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pl .tot{border-top:1px solid var(--line);padding-top:9px;font-weight:800;color:var(--ink)}
.pop .pnote{margin-top:12px;font-size:12px;color:var(--ink-3);line-height:1.5}
.pop .pnote b{color:var(--ink-2)}
.pop .link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--accent)}

/* 2 · one card per store */
.sec-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:2px 2px 16px}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.sec-h .meta{margin-top:6px}
.sec-h .rt{margin-inline-start:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-in-bd)}
.seg > span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 0 6px}
.seg button{height:28px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sc{position:relative;overflow:hidden;isolation:isolate;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);padding:20px 20px 18px;display:flex;flex-direction:column;cursor:pointer;text-align:start;transition:transform .25s,box-shadow .25s,opacity .2s;animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n) * 70ms + 80ms);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.sc::before{content:"";position:absolute;z-index:-1;width:300px;height:300px;border-radius:50%;top:-150px;inset-inline-start:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--a5) 30%,transparent),transparent 68%);pointer-events:none}
.sc:hover{transform:translateY(-4px);box-shadow:var(--card-sh-hover)}
.cards[data-hl] .sc{opacity:.45}
.cards[data-hl] .sc.hl{opacity:1;transform:translateY(-4px);box-shadow:0 0 0 2px var(--a5),0 20px 52px color-mix(in srgb,var(--a5) 22%,transparent)}
.sc.flash{box-shadow:0 0 0 2px var(--a5),0 20px 52px color-mix(in srgb,var(--a5) 26%,transparent)}
.sc-h{display:flex;align-items:flex-start;gap:12px}
.sav{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--a5),var(--a7));flex:none;box-shadow:0 8px 22px color-mix(in srgb,var(--a5) 40%,transparent)}
.sav .dot{position:absolute;inset-inline-end:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;background:var(--ink-4)}
.sav .dot.live{background:var(--live)}
.sav .dot.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;background:var(--live);opacity:.35;animation:pulse 1.8s ease-out infinite}
.sav .dot.quiet{background:var(--warn-dot)}
.sc-n{min-width:0;flex:1}
.sc-n b{display:block;font-size:17px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfl{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--ink-2);min-width:0;white-space:nowrap}
.pfl > span{flex:none}
.pfl em{font-style:normal;font-weight:500;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.pfl em::before{content:"· "}

let ORDERS = [], ADS = {}, DAYN = {};   /* DAYN["si|day"] = orders that day */
function generate(key){
  const set = SETS[key];
  R = rng(20261004 + key.length * 7919);
  ORDERS = []; ADS = {};
  daysOf(FIRST, TODAY).forEach(d => ADS[d] = 0);
  set.stores.forEach((s, si) => {
    const start = s.seg.length ? s.seg[0][0] : null;
    s.seg.forEach(([f, t, vol, exact]) => daysOf(f, t).forEach(d => {
      if (d < FIRST || d > TODAY) return;
      const ramp = s.noramp ? 1 : Math.min(1, (daysBetween(start, d) + 2) / 9);
      const exp = vol * (dt(d).getUTCDay() === 5 ? .7 : 1) * ramp;
      const n = exact ? vol : Math.floor(exp * (0.75 + R() * .5) + R());
      const off = set.adsOff.some(([a, b]) => d >= a && d <= b);
      if (!off && set.cpo) ADS[d] += exp * set.cpo * (0.85 + R() * .3);
      for (let k = 0; k < n; k++) ORDERS.push(makeOrder(s, si, d));
    }));
  });
  /* a broken connection: nothing arrives after the first failure */
  set.stores.forEach((s, si) => { if (s.err) ORDERS = ORDERS.filter(o => !(o.s === si && o.d === TODAY && o.m >= s.err.at)); });
  ORDERS.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.m - b.m);
  DAYN = {}; ORDERS.forEach(o => { const k = o.s + "|" + o.d; DAYN[k] = (DAYN[k] || 0) + 1; });
}
function makeOrder(s, si, d){
  const p = pick(s.prods, s.prods.map(x => x[2])), age = daysBetween(d, TODAY);
  /* orders arrive mostly between 9h and midnight (ads), rarely at night */
  const HW = [1,.6,.4,.3,.3,.4,.8,1.5,2.5,3.5,4,4.2,4.5,4.6,4.4,4.5,4.8,5,5.2,5.6,6,5.5,4,2.4];
  let m; do { m = pick([...Array(24).keys()], HW) * 60 + Math.floor(R() * 60); } while (d === TODAY && m >= NOW_MIN);
  /* the outcome AND the day it was reached: junk 0–2 d, rejected 0–4 d, delivered 1–5 d, returned 3–11 d */
  let fin, delay;
  if (R() < s.J){ fin = R() < .3 ? "s" : "j"; delay = Math.floor(R() * 3); }
  else if (R() > s.C){ fin = "x"; delay = Math.floor(R() * R() * 5); }
  else if (R() < s.D){ fin = "d"; delay = 1 + Math.floor(R() * 5); }
  else { fin = "f"; delay = 3 + Math.floor(R() * 9); }
  if (R() < .008){ fin = "c"; delay = null; }   /* a few stay stuck in calls */
  const od = delay == null ? "9999-12-31" : addDays(d, delay);
  const tp = R() < .1 ? Math.round(p[1] * 1.8 / 5) * 5 : p[1];   /* one order in ten takes two */
  const um = !!s.unmapped && age <= 9 && R() < s.unmapped / (9 * s.seg[0][2]);
  return {s:si, d, m, fin, od, tp, cost:s.cost, pr:p[0], um, cm:30 + Math.floor(R() * 240)};
}
/* where an order stood on a given day: its outcome once reached; before that « en cours » (in calls, then on the road) */
function bkAt(o, asOf){
  if (o.od <= asOf && !(o.od === asOf && "xjs".includes(o.fin) && minsTo(o, asOf) < o.cm)) return o.fin;
  return "df".includes(o.fin) && minsTo(o, asOf) >= o.cm ? "r" : "c";
}
/* minutes between an order and the moment we look: « today » looks at NOW, and so does « yesterday at the same hour » */
function minsTo(o, asOf){ const cut = asOf === TODAY || S.period === "today" ? NOW_MIN : 1440; return daysBetween(o.d, asOf) * 1440 + cut - o.m; }

const GROUP = {d:"del", f:"ret", b:"ret", x:"rej", j:"junk", s:"junk", c:"pend", u:"pend", r:"pend"};

function sum(list, asOf = TODAY){
  const c = {n:list.length, paid:0, cogs:0, left:0, um:0};
  KEYS.forEach(k => c[k] = 0); "dfbxjscur".split("").forEach(k => c[k] = 0);
  list.forEach(o => { const b = bkAt(o, asOf); c[b]++; c[GROUP[b]]++; if (b === "d"){ c.paid += o.tp; c.cogs += o.tp * o.cost; } if ("dfrb".includes(b)) c.left++; if (o.um) c.um++; });
  c.up = c.d + c.f + c.r + c.b; c.rejAll = c.x + c.j;
  c.conf = c.up + c.rejAll ? c.up / (c.up + c.rejAll) * 100 : null;
  c.final = c.n ? (1 - (c.c + c.u + c.r) / c.n) * 100 : 0;
  c.p = {}; KEYS.forEach(k => c.p[k] = c.n ? c[k] / c.n * 100 : 0);
  return c;
}
function round100(p){ const fl = {}; let left = 100; KEYS.forEach(k => { fl[k] = Math.floor(p[k]); left -= fl[k]; }); KEYS.slice().sort((a, b) => (p[b] % 1) - (p[a] % 1)).slice(0, Math.max(0, left)).forEach(k => fl[k]++); return fl; }

   invoice per delivered parcel (a failed parcel costs nothing); packaging per parcel that left; ads = every campaign of

function money(c, f, t){

  const ads = days.reduce((x, d) => x + (ADS[d] || 0), 0), deliv = c.d * MK().fee, pack = c.left * 2;
  return {paid:c.paid, cogs:c.cogs, deliv, pack, ads, profit:c.paid - c.cogs - deliv - pack - ads};
}

const MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const monthName = m => { const s = MONTHS_FR[+m.slice(5, 7) - 1]; return s[0].toUpperCase() + s.slice(1); };
const lastDay = m => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).toISOString().slice(0, 10);
const addMonths = (m, k) => new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1)).toISOString().slice(0, 7);

const PRESETS = [["today","Aujourd'hui"],["7d","7 derniers jours"],["30d","30 derniers jours"],["90d","3 derniers mois"],["month","Ce mois-ci"]];
const WHOLE = ["2026-09","2026-08","2026-07","2026-06"];
function range(k){
  if (k === "today") return [TODAY, TODAY];
  if (k === "7d") return [addDays(TODAY, -6), TODAY];
  if (k === "30d") return [addDays(TODAY, -29), TODAY];
  if (k === "90d") return [addDays(TODAY, -89), TODAY];
  if (k === "month") return [TODAY.slice(0, 8) + "01", TODAY];
  if (k.startsWith("m:")){ const m = k.slice(2); return [m + "-01" < FIRST ? FIRST : m + "-01", lastDay(m)]; }
  return [S.from, S.to];
}
function nameRange(f, t){
  const p = PRESETS.find(([k]) => { const [a, b] = range(k); return a === f && b === t; }); if (p) return p[0];
  const m = WHOLE.find(x => { const [a, b] = range("m:" + x); return a === f && b === t; }); return m ? "m:" + m : "custom";

function win(){
  const k = S.period, [from, to] = range(k), len = daysBetween(from, to) + 1;
  let pf, pt, prevName;
  if (k === "today"){ pf = pt = addDays(TODAY, -1); prevName = "hier à la même heure"; }
  else if (k === "month"){ pf = addMonths(TODAY.slice(0, 7), -1) + "-01"; pt = addDays(pf, len - 1); prevName = `le même début de ${MONTHS_FR[+pf.slice(5, 7) - 1]}`; }
  else if (k.startsWith("m:")){ const pm = addMonths(k.slice(2), -1); pf = pm + "-01"; pt = lastDay(pm); prevName = MONTHS_FR[+pm.slice(5, 7) - 1]; }
  else { pf = addDays(from, -len); pt = addDays(from, -1); prevName = `les ${len} jours d'avant`; }
  const p = PRESETS.find(x => x[0] === k);
  const label = p ? p[1] : k.startsWith("m:") ? `${monthName(k.slice(2))} ${k.slice(2, 6)}` : `${len} ${pl(len, "jour", "jours")}`;
  const lag = daysBetween(pf, from);
  return {from, to, pf, pt, len, label, range:k === "today" ? `${dShort(TODAY)} · jusqu'à ${hm(NOW_MIN)}` : dRange(from, to), prevName, live:to === TODAY, lag, asOfP:addDays(TODAY, -lag)};
}

function stopped(si){
  const day = d => DAYN[si + "|" + d] || 0;
  const usualDays = daysOf(addDays(TODAY, -20), addDays(TODAY, -7)), usual = usualDays.reduce((x, d) => x + day(d), 0) / usualDays.length;
  if (usual < 5) return null;
  let since = null;
  for (let d = TODAY; d >= addDays(TODAY, -10); d = addDays(d, -1)){ if (day(d) < usual * .25) since = d; else break; }
  if (!since || daysBetween(since, TODAY) < 2) return null;
  const recent = daysOf(since, TODAY).reduce((x, d) => x + day(d), 0);
  return {since, usual:Math.round(usual), recent, days:daysBetween(since, TODAY) + 1};
}
function lastOrder(si, upto){ for (let i = ORDERS.length - 1; i >= 0; i--){ const o = ORDERS[i]; if (o.s === si && o.d <= upto) return o; } return null; }
function firstOrder(si){ return ORDERS.find(o => o.s === si) || null; }
function ago(o){
  if (!o) return "aucune commande";
  const mins = daysBetween(o.d, TODAY) * 1440 + NOW_MIN - o.m;
  if (mins < 60) return `il y a ${Math.max(1, mins)}${NB}min`;
  if (mins < 24 * 60 && o.d === TODAY) return `il y a ${Math.floor(mins / 60)}${NB}h`;
  if (daysBetween(o.d, TODAY) === 1) return `hier à ${hm(o.m)}`;
  if (daysBetween(o.d, TODAY) < 7) return `il y a ${daysBetween(o.d, TODAY)}${NB}j`;
  return `le ${dShort(o.d)}`;
}
function adsStopped(w){
  if (!w.live || !SET().cpo) return null;
  let since = null;
  for (let d = TODAY; d >= addDays(TODAY, -20); d = addDays(d, -1)){ if (!ADS[d]) since = d; else break; }
  return since && daysBetween(since, TODAY) >= 2 ? since : null;
}

function ctx(){
  const w = win(), set = SET();
  const cur = ORDERS.filter(o => o.d >= w.from && o.d <= w.to), prev = ORDERS.filter(o => o.d >= w.pf && o.d <= w.pt && (S.period !== "today" || o.m <= NOW_MIN));
  /* arrows compare AT EQUAL AGE: the period before is read as it stood `lag` days ago, so a young cohort (parcels
     still on the road) is never set against a finished one. Counts are final at once; rates and money are not. */
  const A = sum(cur), P = sum(prev, w.asOfP);
  const ok = (a, p) => a.n >= 30 && p.n >= 30 && w.pf >= FIRST;
  const stores = set.stores.map((s, i) => {
    const a = sum(cur.filter(o => o.s === i)), p = sum(prev.filter(o => o.s === i), w.asOfP);
    const first = firstOrder(i);
    return {i, s, a, p, comparable:ok(a, p) && S.period !== "today", last:lastOrder(i, w.to), first, isNew:!!first && first.d >= w.from && daysBetween(first.d, w.to) < 21, stop:w.live && a.n ? stopped(i) : null};
  });
  const active = stores.filter(x => x.a.n > 0), quiet = stores.filter(x => !x.a.n);
  const judged = active.filter(x => x.a.n >= 30 && x.a.final >= 80);
  const best = judged.length >= 2 ? judged.reduce((b, x) => x.a.p.del > b.a.p.del ? x : b) : null;
  return {w, A, P, comparable:ok(A, P) && S.period !== "today", stores, active, quiet, best, M:money(A, w.from, w.to), PM:money(P, w.pf, w.pt), ads:adsStopped(w)};
}
function why(C){ return C.w.pf < FIRST ? "Rien à comparer : pas de commandes avant le 7 juin" : "Trop peu de commandes pour comparer (moins de 30)"; }
const sameAge = C => S.period === "today" ? "hier à la même heure" : `${C.w.prevName}, au même âge (tels qu'ils étaient le ${dShort(C.w.asOfP)})`;
function trendPts(now, prev, upGood, comparable, C){
  if (!comparable) return `<span class="tr na" data-tip="${esc(why(C))}">—</span>`;
  const d = Math.round(now) - Math.round(prev);
  if (!d) return `<span class="tr eq" data-tip="${esc(`Stable · ${sameAge(C)} : ${Math.round(prev)}`)}">=</span>`;
  return `<span class="tr ${(d > 0) === upGood ? "good" : "bad"}" data-tip="${esc(`${sameAge(C)} : ${Math.round(prev)} sur 100`)}">${ic(d > 0 ? "up" : "dn")}${Math.abs(d)}</span>`;
}
function trendPct(now, prev, comparable, C, fmt){
  if (!comparable || !prev) return `<span class="tr na" data-tip="${esc(!prev && comparable ? "Rien sur la période d'avant" : why(C))}">—</span>`;
  const d = Math.round((now - prev) / Math.abs(prev) * 100);
  if (!d) return `<span class="tr eq" data-tip="${esc(`Stable · ${sameAge(C)} : ${fmt(prev)}`)}">=</span>`;
  return `<span class="tr ${d > 0 ? "good" : "bad"}" data-tip="${esc(`${sameAge(C)} : ${fmt(prev)}`)}">${ic(d > 0 ? "up" : "dn")}${Math.abs(d)}${NB}%</span>`;
}

function ring(seg, n){
  const Rr = 66, Cc = 2 * Math.PI * Rr, gap = 3.2, tot = KEYS.reduce((t, k) => t + (seg[k] || 0), 0);
  let acc = 0, segs = "";
  KEYS.forEach(k => {
    const x = seg[k] || 0; if (!x) return;
    const len = x / tot * Cc, vis = tot === x ? Cc : Math.max(len - gap, 1.2);
    segs += `<circle class="sg k-${k}" cx="84" cy="84" r="${Rr}" stroke-dasharray="${vis.toFixed(2)} ${(Cc + 10).toFixed(2)}" stroke-dashoffset="${(-acc - (tot === x ? 0 : gap / 2)).toFixed(2)}" data-tip="${esc(`${O[k]} · ${x} sur 100 — ${ODEF[k]}`)}"/>`;
    acc += len;
  });
  return `<svg class="ringsvg" viewBox="0 0 168 168" aria-hidden="true"><circle class="ringtrack" cx="84" cy="84" r="${Rr}"/>
    <defs><mask id="m${n}" maskUnits="userSpaceOnUse" x="0" y="0" width="168" height="168"><circle class="sweep" cx="84" cy="84" r="${Rr}" transform="rotate(-90 84 84)" style="--n:${n}"/></mask></defs>
    <g mask="url(#m${n})"><g class="segs" transform="rotate(-90 84 84)">${segs}</g></g></svg>`;
}
function liveDot(x, C){
  if (!C.w.live || !x.last) return "";
  const mins = daysBetween(x.last.d, TODAY) * 1440 + NOW_MIN - x.last.m;
  return x.stop || x.s.err ? `<i class="dot quiet"></i>` : mins <= 120 ? `<i class="dot live"></i>` : `<i class="dot"></i>`;
}
function statusLine(x, C){
  if (!C.w.live || !x.last) return "";
  const at = x.last.d === TODAY ? `aujourd'hui à ${hm(x.last.m)}` : `le ${dShort(x.last.d)} à ${hm(x.last.m)}`;
  return `<span class="fresh${x.stop || x.s.err ? " quiet" : ""}" data-tip="${esc(`Dernière commande reçue ${at}`)}">${ic("clock")}${ago(x.last)}</span>`;
}
function storeNote(x, C){
  const {a, s} = x, mkt = Math.round(C.A.p.del), mine = Math.round(a.p.del);
  const note = (k, icon, t, sub, act) => `<div class="note ${k}"><span class="ni">${ic(icon)}</span><div><b>${t}</b><small>${sub}</small></div>${act || ""}</div>`;
  if (s.err && C.w.live) return note("bad", "plug", `En panne depuis ${hm(s.err.at)}`, `${s.err.n} échecs · feuille inaccessible`, `<button class="act" data-toast="${esc(`Système › Connexions › ${s.n} — ${s.err.n} échecs depuis ${hm(s.err.at)} : ${s.err.msg}`)}">Voir</button>`);
  if (x.stop) return note("bad", "moon", `Presque plus rien depuis le ${dShort(x.stop.since)}`, `${x.stop.recent} en ${x.stop.days}${NB}j · d'habitude ≈${NB}${x.stop.usual} par jour${C.ads ? " · pub à l'arrêt" : ""}`);
  if (a.um) return note("warn", "link", `${a.um} commandes à relier`, `produits ${PF[s.pf].n} inconnus d'Ordra`, `<button class="act" data-toast="${esc(`Système › Connexions › ${s.n} › Produits — relier les produits ${PF[s.pf].n} à Ordra`)}">Relier</button>`);
  if (S.period === "today") return note("ok", "check", "Rien à signaler", `dernière commande ${ago(x.last)}`);
  if (a.n < 30) return x.isNew ? note("new", "spark", `Nouvelle boutique`, `ouverte le ${dShort(x.first.d)} · jugée à partir de 30 commandes`) : note("ok", "clock", "Peu de commandes", `jugée à partir de 30 commandes`);
  if (C.best && C.best.i === x.i) return note("good", "star", "Meilleure livraison des boutiques", `${mine} livrées sur 100 · ${mkt} pour l'ensemble`);
  if (mine <= mkt - 5) return note("warn", "alert", "Livre moins bien que les autres", `${mine} livrées sur 100 · ${mkt} pour l'ensemble`);
  return note("ok", "check", "Rien à signaler", `${mine} livrées sur 100 · ${mkt} pour l'ensemble`);
}
function storeCard(x, C, n){
  const {s, a} = x, p = PF[s.pf], share = a.n / C.A.n * 100, today = S.period === "today", early = a.n < 30;
  const r = round100(a.p), countOk = C.w.pf >= FIRST && x.p.n > 0;
  let vis;
  if (today) vis = `<div class="sc-hours">${columns(C, [x], x.i)}</div>`;
  else vis = `<div class="sc-ring">${early
    ? `<svg class="ringsvg" viewBox="0 0 168 168" aria-hidden="true"><circle class="ringtrack dash" cx="84" cy="84" r="66"/></svg><div class="rc early"><div class="l">livrées /100</div><div class="h">trop tôt pour juger · jugée à 30 commandes</div></div>`
    : `${ring(r, n)}<div class="rc"><div class="big"><b>${r.del}</b><small>/100</small></div><div class="l">livrées</div>${trendPts(a.p.del, x.p.p.del, true, x.comparable, C)}</div>`}</div>`;
  const prods = s.prods.map(q => q[0]);
  const prodHtml = prods.length === 1
    ? `<span class="pc">${ic("tag")}${esc(prods[0])}</span><span class="meta">produit unique</span>`
    : prods.slice(0, 2).map(q => `<span class="pc">${ic("tag")}${esc(q)}</span>`).join("") + (prods.length > 2 ? `<span class="pc more" data-tip="${esc(prods.slice(2).join(" · "))}">+${prods.length - 2}</span>` : "");
  const cell = (l, v, e, z) => `<div><small>${l}</small><b class="${z ? "z" : ""}">${v}</b><em>${e}</em></div>`;
  const ccy = `<span class="ccy">${NB}${MK().ccy}</span>`;
  const mini = today
    ? cell("Confirmées", a.conf == null ? "—" : Math.round(a.conf) + NB + "%", `${a.up} uploadées`, a.conf == null) + cell("À appeler", fnum(a.c), "en attente", !a.c) + cell("Rejetées", fnum(a.rejAll), (a.j + a.s) + " jamais réelles", !a.rejAll)
    : cell("Confirmées", a.conf == null ? "—" : Math.round(a.conf) + NB + "%", "des décidées", !a.conf) + cell("Livrées", fnum(a.d), "colis arrivés", !a.d)
      + (S.role === "owner" ? cell("Payé", (a.paid >= 100000 ? fnum(a.paid / 1000) + NB + "k" : fnum(Math.round(a.paid))) + ccy, "par les clients", !a.paid) : cell("Retournées", early ? fnum(a.ret) : r.ret + `<span class="ccy">/100</span>`, `${fnum(a.ret)} colis`, !a.ret));
  const dom = `${p.n} · ${s.dom}${s.via ? " · reçue via " + s.via : ""}${p.fresh ? " · connecteur à construire" : ""}`;
  return `<article class="sc" data-store="${x.i}" data-card="${x.i}" role="button" tabindex="0" style="${hueVars(s.hue)};--n:${n}" aria-label="${esc(`${s.n} — ouvrir sa performance`)}">
    <div class="sc-h"><span class="sav">${esc(initials(s.n))}${liveDot(x, C)}</span><div class="sc-n"><b>${esc(s.n)}</b>
      <span class="pfl" data-tip="${esc(dom)}"><i class="pg">${p.g}</i><span>${p.n}</span>${p.fresh ? `<i class="chg new" data-tip="Pas encore de connecteur ${p.n} dans Ordra">nouveau</i>` : ""}</span></div>${statusLine(x, C)}</div>
    <div class="sc-cnt"><b>${fnum(a.n)}</b><span>${pl(a.n, "commande reçue", "commandes reçues")}<small>${pctS(share)} du total</small></span>${trendPct(a.n, x.p.n, countOk, C, v => fnum(v))}</div>
    <div class="sc-share"><i style="width:${Math.max(1.5, share).toFixed(1)}%"></i></div>
    <div class="prods">${prodHtml}</div>
    ${vis}
    <div class="mini">${mini}</div>
    ${storeNote(x, C)}
  </article>`;
}
function storesBlock(C){
  if (!C.active.length) return quietRow(C, true);
  const key = {cmd:x => x.a.n, liv:x => x.a.n >= 30 ? x.a.p.del : -1, paye:x => x.a.paid};
  if (S.role !== "owner" && S.sort === "paye") S.sort = "cmd";
  const rows = [...C.active].sort((a, b) => key[S.sort](b) - key[S.sort](a) || b.a.n - a.a.n);
  const sorts = [["cmd","Commandes"],["liv","Livrées /100"]].concat(S.role === "owner" ? [["paye","Payé"]] : []);
  return `<section><div class="sec-h"><div><h2>Vos boutiques</h2><div class="meta">${S.period === "today" ? "une carte par boutique · ses commandes d'aujourd'hui, heure par heure · cliquez pour sa performance" : "une carte par boutique · sur 100 commandes reçues, ce qu'elles sont devenues · cliquez pour sa performance"}</div></div>
      <div class="rt">${S.period === "today" ? "" : `<div class="legend">${KEYS.map(k => `<span><i class="sw k-${k}"></i>${O[k]}</span>`).join("")}</div>`}
      <div class="seg" role="tablist" aria-label="Trier"><span>Trier</span>${sorts.map(([k, l]) => `<button role="tab" aria-selected="${S.sort === k}" class="${S.sort === k ? "on" : ""}" data-sort="${k}">${l}</button>`).join("")}</div></div></div>
    <div class="cards" id="cards">${rows.map((x, n) => storeCard(x, C, n)).join("")}</div>${quietRow(C, false)}</section>`;
}
/* 3 · stores with nothing in the period — one line, not empty cards */
function quietRow(C, alone){
  const add = S.role === "owner" ? `<button class="qchip qadd" data-toast="Système › Connexions › Ajouter une boutique — Converty, Shopify, LightFunnels, YouCan, WooCommerce, EasyOrders…">${ic("plus")}Connecter une boutique</button>` : "";
  if (!C.quiet.length) return add ? `<div class="quiet">${add}</div>` : "";
  const chips = C.quiet.map(x => {
    const l = x.last, p = PF[x.s.pf];
    const sub = l ? `dernière commande le ${dShort(l.d)}` : x.first && x.first.d > C.w.to ? `pas encore ouverte` : "aucune commande, jamais";
    return `<button class="qchip" style="${hueVars("slate")}" data-toast="${esc(`Système › Connexions › ${x.s.n} — vérifier la connexion (${x.s.dom})`)}"><span class="sav">${esc(initials(x.s.n))}</span><span><b>${esc(x.s.n)}</b><small>${sub}</small></span><i class="pg" data-tip="${esc(p.n)}">${p.g}</i></button>`;
  }).join("");
  return `<div class="quiet" ${alone ? 'style="margin-top:0"' : ""}>${ic("moon")}<span>${C.quiet.length} ${pl(C.quiet.length, "boutique sans commande", "boutiques sans commande")} sur la période</span>${chips}${add}</div>`;
}
function defs(){
  return `<details class="defs"><summary>Comment lire cette page</summary><div>
    <b>Base</b> : les commandes <b>reçues</b> pendant la période, suivies jusqu'à aujourd'hui — les mêmes que Performance › Commandes et Produits & marges.
    <b>Livrées sur 100</b> : pour 100 commandes reçues par la boutique, combien sont arrivées chez le client. <b>Confirmées</b> : uploadées ÷ (uploadées + rejetées).
    Une boutique est jugée à partir de <b>30 commandes</b> ; avant, « trop tôt pour juger ». Les <b>flèches</b> comparent à la période d'avant <b>au même âge</b> : telle qu'elle était il y a 30 jours (pour 30 jours), jamais des colis encore en route contre des colis arrivés.
    <b>Payé</b> : ce que les clients ont payé pour les commandes livrées (orders.total_price). Le <b>profit</b> n'existe qu'à l'échelle du marché tant que la pub n'est pas rattachée à une boutique.
    Une <b>boutique</b> = un sous-compte (sous-domaine) d'une plateforme ; la plateforme n'est qu'une étiquette.</div></details>`;
}

/* ═════════════ render ═════════════ */
function render(){
  renderBar(); renderSide();
  const C = ctx();
  document.getElementById("page").innerHTML = glue(header(C) + allStores(C) + storesBlock(C) + defs());
  const q = new URLSearchParams(); q.set("set", S.set); q.set("period", S.period); if (S.period === "custom"){ q.set("from", S.from); q.set("to", S.to); }
  if (S.role !== "owner") q.set("role", S.role); if (S.sort !== "cmd") q.set("sort", S.sort);
  history.replaceState(null, "", location.pathname + "?" + q);
}
const keep = fn => { const y = scrollY; fn(); render(); scrollTo(0, y); };

/* ═════════════ events ═════════════ */
const tip = document.getElementById("tip"); let toastT;
function toast(msg){ tip.textContent = "→ " + msg; tip.classList.add("on"); tip.style.left = "50%"; tip.style.top = "64px"; tip.style.transform = "translateX(-50%)"; clearTimeout(toastT); toastT = setTimeout(() => { tip.classList.remove("on"); tip.style.transform = ""; }, 2800); }
function openStore(i){ const s = SET().stores[i]; toast(`Performance › Commandes, filtrée sur la boutique « ${s.n} » · ${win().label.toLowerCase()} · ?boutique=${s.k}`); }
document.addEventListener("click", e => {
  const g = s => e.target.closest(s);
  let t;
  if ((t = g("[data-href]"))){ e.preventDefault(); location.href = t.dataset.href; return; }
  if ((t = g("[data-toast]"))){ e.preventDefault(); toast(t.dataset.toast); return; }
  if ((t = g("[data-role]"))){ keep(() => { S.role = t.dataset.role; S.pop = null; }); return; }
  if ((t = g("[data-set]"))){ S.set = t.dataset.set; generate(S.set); keep(() => { S.pop = null; S.dp = null; }); return; }
  if ((t = g("[data-dp]"))){ keep(() => { if (S.dp) S.dp = null; else openDp(); }); return; }
  if ((t = g("[data-dpp]"))){ const k = t.dataset.dpp; keep(() => { S.period = k; S.from = S.to = null; S.dp = null; }); return; }
  if ((t = g("[data-dday]"))){ const x = t.dataset.dday, d = S.dp; keep(() => { if (!d.s || d.e){ d.s = x; d.e = null; } else if (x < d.s){ d.e = d.s; d.s = x; } else d.e = x; }); return; }
  if ((t = g("[data-dpnav]"))){ keep(() => S.dp.m = addMonths(S.dp.m, +t.dataset.dpnav)); return; }
  if (g("[data-dpcancel]")){ keep(() => S.dp = null); return; }
  if (g("[data-dpapply]")){ const d = S.dp; if (d.s && d.e) keep(() => { const k = nameRange(d.s, d.e); S.period = k; S.from = k === "custom" ? d.s : null; S.to = k === "custom" ? d.e : null; S.dp = null; }); return; }
  if (g(".dp")) return;
  if (S.dp){ keep(() => S.dp = null); return; }
  if ((t = g("[data-pop]"))){ const k = t.dataset.pop; keep(() => S.pop = S.pop === k ? null : k); return; }
  if (g(".pop")) return;
  if (S.pop){ keep(() => S.pop = null); return; }
  if ((t = g("[data-sort]"))){ keep(() => S.sort = t.dataset.sort); return; }
  if ((t = g("[data-go]"))){ const k = t.dataset.go, card = k === "o" ? document.querySelector(`.sc[style*="${HUES.slate[0]}"]`) : document.querySelector(`[data-card="${k}"]`);
    if (card){ card.scrollIntoView({behavior:"smooth", block:"center"}); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 1400); } return; }
  if ((t = g("[data-card]"))){ openStore(+t.dataset.card); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (S.dp || S.pop)){ keep(() => { S.dp = null; S.pop = null; }); return; }
  const c = e.target.closest && e.target.closest("[data-card]");
  if (c && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openStore(+c.dataset.card); }
});
document.addEventListener("change", e => { if (e.target.id === "marks"){ S.marks = e.target.checked; renderSide(); document.body.classList.toggle("marks", S.marks); } });
/* hover a store anywhere (share bar, legend, card) → it lights up in both places */
function hl(key, fromMix){
  const cards = document.getElementById("cards"), mixEl = document.getElementById("mix");
  [[cards, fromMix], [mixEl, true]].forEach(([el, on]) => { if (!el) return; if (key == null || !on) delete el.dataset.hl; else el.dataset.hl = key; });
  document.querySelectorAll(".sc").forEach(c => c.classList.toggle("hl", key != null && (key === "o" ? c.style.getPropertyValue("--a5").trim() === HUES.slate[0] : c.dataset.store === key)));
  document.querySelectorAll("#mix [data-store]").forEach(m => {
    const isO = m.dataset.store === "o", card = key != null && key !== "o" ? SET().stores[+key] : null;
    m.classList.toggle("hl", key != null && (m.dataset.store === key || (isO && card && card.hue === "slate")));
  });
}
document.addEventListener("mouseover", e => {
  if (S.dp && S.dp.s && !S.dp.e){ const dd = e.target.closest && e.target.closest("[data-dday]"), s = S.dp.s;
    document.querySelectorAll(".cal-d").forEach(b => { const x = b.dataset.dday; b.classList.toggle("c-hv", !!dd && ((x > s && x <= dd.dataset.dday) || (x < s && x >= dd.dataset.dday))); }); }
  const st = e.target.closest && e.target.closest("#mix [data-store], .sc[data-store]");
  hl(st ? st.dataset.store : null, !!(st && st.closest("#mix")));
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t){ if (!tip.textContent.startsWith("→")) tip.classList.remove("on"); return; }
  if (tip.textContent.startsWith("→") && tip.classList.contains("on")) return;
  tip.textContent = t.dataset.tip; tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on") || tip.textContent.startsWith("→")) return;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 50) y = e.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

const q = new URLSearchParams(location.search);
if (SETS[q.get("set")]) S.set = q.get("set");
const per = q.get("period") || "";
if (PRESETS.some(p => p[0] === per) || WHOLE.some(m => per === "m:" + m) || per === "custom") S.period = per;
if (S.period === "custom"){ S.from = q.get("from") || "2026-09-01"; S.to = q.get("to") || "2026-09-30"; }
if (q.get("role") === "manager") S.role = "manager";
if (["cmd","liv","paye"].includes(q.get("sort"))) S.sort = q.get("sort");
if (q.get("pop") === "profit") S.pop = "profit";
if (q.get("dp") === "1") openDp();
document.body.classList.toggle("marks", S.marks);
generate(S.set);
render();
</script>
</body>
</html>
