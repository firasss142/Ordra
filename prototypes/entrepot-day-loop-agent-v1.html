<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Prototype — Entrepôt « day loop », AGENT (téléphone). v1, 2026-10-02.
  Plan : plans/entrepot-day-loop-redesign.md. Pendant desk : entrepot-day-loop-manager-v1.html.

  Presets : ?lang=ar|fr  ?screen=today|out|run|bound|free|wrongsite|returns|verdict|stock|product|count|settings
  Données : produits, stocks, villes, volumes et bâtiments RÉELS (prod, lus le 2026-10-02, Benghazi / adel).
  Prénoms des clients FICTIFS — pas de données personnelles dans git. Couleurs de rouleau déduites de la ville
  (la table darb_shipments n'a pas encore la branche pour ces colis).
  Jetons : copiés de src/app/globals.css (Ordra), PAS de --wh-* / --wm-*.
-->
<title>Entrepôt — journée (agent)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ── Ordra tokens (src/app/globals.css) ─────────────────────────────────── */
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --hover:#F7F7F7; --selected:#F2F2F2; --sunken:#FAFAFB;
  --ink:#1A1A1A; --ink2:#6D7175; --ink3:#9CA3AF;
  --line:#ECEEF0; --line2:#E1E3E5; --line3:#C9CCCF;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4;
  --action:#2C6ECB; --action-bg:#EEF4FC;
  --success:#008060; --success-bg:#F1F8F5;
  --warning:#B98900; --warning-bg:#FFF8E6; --warning-ink:#7A5B00; /* -ink partner, §4.21 rule; added in Phase 1 */
  --critical:#D72C0D; --critical-bg:#FFF4F4;
  --shadow-floating:0 8px 24px rgba(16,24,40,.10);
  --r-sm:8px; --r:12px; --r-lg:16px; --pill:9999px;
  --fast:120ms; --base:160ms;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --studio:#E9EAEC; --studio-ink:#24272B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--studio);color:var(--ink);font:14px/1.5 Inter,"Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;padding:0}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ── studio (always LTR) ────────────────────────────────────────────────── */
.studio{min-height:100vh;display:grid;grid-template-columns:1fr;justify-items:center}
.notes{display:none}
@media (min-width:960px){
  .studio{grid-template-columns:340px auto;justify-content:center;align-items:start;gap:48px;padding:32px 40px}
  .notes{display:block;position:sticky;top:28px;direction:ltr;color:var(--studio-ink);font-size:13px;max-width:340px}
  .notes h1{font-size:17px;font-weight:700;margin-bottom:4px}
  .notes .sub{color:#5B6067;margin-bottom:16px}
  .notes .row{display:flex;gap:6px;margin-bottom:12px}
  .notes .row button{padding:5px 10px;border:1px solid #C9CCCF;border-radius:6px;background:#F7F7F8;font-size:12.5px;font-weight:600}
  .notes .row button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
  .notes .pick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:16px}
  .notes .pick button{padding:7px 10px;border:1px solid #D5D7DA;border-radius:7px;background:#F7F7F8;font-size:12.5px}
  .notes .pick button[aria-current=true]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-hover);font-weight:600}
  .notes .why{background:#fff;border:1px solid #D5D7DA;border-radius:10px;padding:14px 16px}
  .notes .why h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6D7175;margin-bottom:6px}
  .notes .why p{margin-bottom:8px}
  .notes .why p:last-child{margin-bottom:0}
  .notes code{font-family:var(--mono);font-size:11.5px;background:#F2F2F3;padding:1px 4px;border-radius:4px}
  .phone{width:390px;height:844px;border:10px solid #16181B;border-radius:46px;overflow:hidden;position:relative;background:var(--bg)}
}
@media (max-width:959px){.phone{width:100%;min-height:100vh;position:relative;background:var(--bg)}}

/* ── the stage (mirrors for Arabic) ─────────────────────────────────────── */
.phone[dir=rtl]{font-family:Cairo,"Noto Sans Arabic",system-ui,sans-serif}
.phone{text-align:start}
.screen{position:absolute;inset:0;overflow-y:auto;padding:18px 16px 120px;scrollbar-width:none;display:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block;animation:enter var(--base) ease-out}
.screen.full{padding-bottom:24px}
@media (max-width:959px){.screen{position:static;min-height:100vh}}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--ink2)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.h2{font-size:17px;font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.mid{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.label{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.phone[dir=rtl] .label{letter-spacing:0;text-transform:none;font-size:12.5px}

/* chrome */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line2)}
.phone[dir=rtl] .flip{transform:scaleX(-1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.sep{height:1px;background:var(--line);margin:0}
.pad{padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink3);flex:none}

/* pickup */
.pickup{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.pickup .dot{width:8px;height:8px;border-radius:50%;background:var(--warning);flex:none}
.pickup.done .dot{background:var(--success)}
.pickup .btn-sm{margin-inline-start:auto}
.btn-sm{padding:7px 12px;border-radius:var(--pill);border:1px solid var(--line3);font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--card)}

/* the day loop */
.hero{padding:20px 18px 18px;display:block;width:100%}
.hero .row{align-items:flex-end}
.bar{height:8px;border-radius:var(--pill);background:var(--selected);overflow:hidden;margin-top:16px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:inherit;transform-origin:left;animation:fill .7s ease-out}
.phone[dir=rtl] .bar>i{transform-origin:right}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.step{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--selected);color:var(--ink2);flex:none}
.hero .step{background:var(--ink);color:#fff}
.job{display:flex;align-items:center;gap:14px;width:100%;padding:16px 16px;min-height:72px}
.job+.job{border-top:1px solid var(--line)}
.job .t{font-weight:700;font-size:15.5px}
.job .s{font-size:13px;color:var(--ink2)}
.job .fig{font-size:24px;font-weight:700;letter-spacing:-.02em}
.job.quiet .fig{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:var(--pill);font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;flex:none}
.chip.warn{background:var(--warning-bg);color:var(--warning-ink)} .chip.warn i{background:var(--warning)}
.chip.bad{background:var(--critical-bg);color:var(--critical)} .chip.bad i{background:var(--critical)}
.chip.ok{background:var(--success-bg);color:var(--success)} .chip.ok i{background:var(--success)}
.chip.info{background:var(--action-bg);color:var(--action)} .chip.info i{background:var(--action)}
.chip.mute{background:var(--selected);color:var(--ink2)} .chip.mute i{background:var(--ink3)}
.strip{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:12px;width:100%}

/* soft tabs (design-system: one soft track, white active pill) */
.tabs{display:flex;gap:3px;background:#ECEDEF;border-radius:var(--r);padding:3px;margin:14px 0}
.tabs button{flex:1;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);text-align:center}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink)}
.tabs .c{font-size:12px;color:var(--ink3);margin-inline-start:4px}

/* rolls */
.roll{display:flex;align-items:center;gap:12px;padding:14px 14px;width:100%;min-height:68px}
.roll+.roll,.roll+.parcels,.parcels+.roll{border-top:1px solid var(--line)}
.sw{width:14px;height:40px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.go{padding:8px 14px;border-radius:var(--pill);background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.parcels{background:var(--sunken)}
.parcel{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 14px;width:100%;min-height:64px}
.parcel+.parcel{border-top:1px solid var(--line)}
.thumb{width:40px;height:40px;border-radius:10px;background:var(--selected);display:grid;place-items:center;flex:none;color:var(--ink2)}
.qty{font-weight:700}
.fold{display:flex;align-items:center;gap:10px;padding:14px 16px;width:100%;color:var(--ink2);font-weight:600}

/* scan run */
.band{margin:-18px -16px 16px;padding:16px 16px 14px;color:#fff;display:flex;align-items:center;gap:10px}
.band .plate{background:rgba(255,255,255,.92);color:var(--ink);font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:6px}
.band .x{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.18)}
.band.light{color:var(--ink)} .band.light .x{background:rgba(0,0,0,.08)}
.progress-dots{display:flex;gap:4px;margin-top:2px}
.progress-dots i{height:4px;flex:1;border-radius:2px;background:var(--line2)}
.progress-dots i.d{background:var(--brand)}
.inhand{padding:18px}
.inhand .pname{font-size:20px;font-weight:700;line-height:1.3}
.inhand .x2{font-size:34px;font-weight:700}
.viewfinder{margin-top:14px;height:208px;border-radius:var(--r-lg);background:#1C1F22;position:relative;overflow:hidden;display:grid;place-items:center;color:#C9CCCF;width:100%}
.viewfinder .c{position:absolute;width:34px;height:34px;border:4px solid var(--rc,#fff)}
.viewfinder .c1{top:22px;left:22px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.viewfinder .c2{top:22px;right:22px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.viewfinder .c3{bottom:22px;left:22px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.viewfinder .c4{bottom:22px;right:22px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.viewfinder .laser{position:absolute;left:40px;right:40px;height:2px;background:var(--rc,#fff);opacity:.85;animation:laser 1.8s ease-in-out infinite alternate}
@keyframes laser{from{top:46px}to{top:160px}}
.typed{display:flex;gap:8px;margin-top:12px}
.typed input{flex:1;min-width:0;height:48px;border:1px solid var(--line3);border-radius:var(--r);padding:0 14px;background:var(--card);font-family:var(--mono);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:700;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line3)}
.btn.ghost{color:var(--ink2);font-weight:600}
.btn.block{width:100%}
.btn.danger{background:var(--card);border:1.5px solid var(--critical);color:var(--critical)}
.btn.xl{min-height:64px;font-size:16px;border-radius:var(--r-lg)}

/* outcome */
.outcome{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 18px;text-align:center}
.outcome.ok{background:var(--success-bg);border:1px solid #CFE7DE}
.outcome.bad{background:var(--critical-bg);border:1px solid #F5C9C1;animation:shake .32s ease-in-out}
.outcome .sweep{position:absolute;top:0;bottom:0;left:0;width:45%;background:rgba(0,128,96,.10);transform:translateX(-110%);animation:sweep .7s ease-out .05s forwards}
/* The sweep is MOTION, not decoration: a flat band that crosses once, on the event. No gradient (§1). */
@keyframes sweep{to{transform:translateX(260%)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#fff;animation:pop .28s cubic-bezier(.3,1.6,.6,1)}
.ok .badge-ic{background:var(--success)} .bad .badge-ic{background:var(--critical)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.code-xl{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.04em;margin:6px 0 4px}
.ring{width:22px;height:22px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .t{stroke:var(--line2)} .ring .p{stroke:var(--brand);stroke-dasharray:57;stroke-dashoffset:57;animation:ring 1.4s linear forwards;transform:rotate(-90deg);transform-origin:center}
@keyframes ring{to{stroke-dashoffset:0}}

/* choose / radio cards */
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line2);border-radius:var(--r);width:100%;background:var(--card)}
.opt+.opt{margin-top:8px}
.opt[aria-checked=true]{border-color:var(--brand);background:var(--brand-tint)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line3);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .radio{border-color:var(--brand)}
.opt[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}

/* verdict */
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.verdict .btn{flex-direction:column;gap:4px;min-height:96px;font-size:15px}
.verdict .btn small{font-weight:600;font-size:12px;opacity:.85}
.causes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.causes button{padding:9px 14px;border-radius:var(--pill);border:1px solid var(--line3);background:var(--card);font-weight:600;font-size:13.5px}
.causes button[aria-pressed=true]{background:var(--critical);border-color:var(--critical);color:#fff}

/* stock */
.truth{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--warning-bg);border:1px solid #F1DFA8;color:var(--warning-ink);margin-bottom:14px}
.truth .btn{min-height:40px;font-size:13.5px;margin-top:10px;background:var(--ink);color:#fff}
.prod{display:flex;align-items:center;gap:12px;padding:14px;width:100%;min-height:72px}
.prod+.prod{border-top:1px solid var(--line)}
.spark{width:56px;height:22px;flex:none}
.spark path{fill:none;stroke:var(--ink3);stroke-width:1.5}
.free{font-size:20px;font-weight:700;letter-spacing:-.01em;text-align:end}
.stack-bar{display:flex;height:14px;border-radius:var(--pill);overflow:hidden;background:var(--selected);margin:14px 0 8px}
.stack-bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend b{color:var(--ink);font-weight:700}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px;background:var(--k)}
.mv{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mv+.mv{border-top:1px solid var(--line)}
.mv .d{font-weight:700;min-width:44px;text-align:end}

/* count */
.stepper{display:flex;align-items:center;gap:10px;margin-top:16px}
.stepper button{width:64px;height:64px;border-radius:var(--r-lg);border:1px solid var(--line3);background:var(--card);display:grid;place-items:center;font-size:26px;font-weight:600}
.stepper input{flex:1;min-width:0;height:72px;border:2px solid var(--ink);border-radius:var(--r-lg);text-align:center;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card)}
.delta{margin-top:12px;text-align:center;font-weight:700;font-size:15px;min-height:24px}

/* settings */
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px}
.set+.set{border-top:1px solid var(--line)}
.toggle{width:44px;height:26px;border-radius:var(--pill);background:var(--brand);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff}

/* bottom bar + scan */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:8px;z-index:5}
@media (max-width:959px){.tabbar{position:fixed}}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink3);padding-top:4px}
.tab .plate{width:52px;height:30px;border-radius:var(--pill);display:grid;place-items:center;transition:background var(--fast)}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page] .plate{background:var(--brand-bg);color:var(--brand-hover)}
.tab .badge{position:absolute;margin-top:-4px;margin-inline-start:26px;min-width:18px;height:18px;border-radius:9px;background:var(--critical);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.scanbtn{justify-self:center;margin-top:-26px;width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-floating);border:4px solid var(--bg);transition:transform var(--fast)}
.scanbtn:active{transform:scale(.94)}
.scanlbl{display:block;text-align:center;font-size:11.5px;font-weight:700;color:var(--brand-hover);margin-top:2px}
.hide-bar .tabbar{display:none}

/* sheet (lookup) */
.scrim{position:absolute;inset:0;background:rgba(26,26,26,.45);z-index:8;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px 24px;z-index:9;display:none;max-height:92%;overflow:auto;animation:up var(--base) ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30%)}to{transform:none}}
.open .scrim,.open .sheet{display:block}
.sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sim button{padding:7px 11px;border-radius:var(--pill);border:1px dashed var(--line3);font-size:12.5px;font-weight:600;color:var(--ink2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="studio">
  <aside class="notes">
    <h1>Entrepôt — la journée · agent</h1>
    <p class="sub">Téléphone, Benghazi (adel). v1 — 2 oct. 2026. Desk : <code>entrepot-day-loop-manager-v1.html</code></p>
    <div class="row" id="langs">
      <button data-lang="ar">العربية (RTL)</button><button data-lang="fr">Français</button>
    </div>
    <div class="pick" id="pick"></div>
    <div class="why"><h2>Ce que montre cet écran</h2><div id="why"></div></div>
  </aside>

  <div class="phone" id="phone">
    <div id="screens"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
(() => {
/* ═══ Real data (prod, 2026-10-02). Customer first names are fictional. ═══ */
const ZONES = {

function spark(seed){
  const pts = Array.from({length:14},(_,i)=>{const v=Math.sin(i*0.9+seed)*4+Math.cos(i*0.37+seed*2)*3; return [i*4, 11 - v*0.9 + (i/14)*4];});

}

function sheet(){

/* ═══ Render ═══ */
const phone = document.getElementById("phone");
function render(){
  phone.dir = lang === "ar" ? "rtl" : "ltr"; phone.lang = lang;
  document.getElementById("screens").innerHTML = `<section class="screen on ${FULL.includes(screen)?"full":""}">${R[screen]()}</section>`;
  phone.classList.toggle("hide-bar", FULL.includes(screen));
  const cur = TAB_OF[screen];
  const tab = (k, icon, badge) => `<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':""}><span class="plate">${ic(icon,20)}</span>${t(k)}${badge?`<span class="badge num">${badge}</span>`:""}</button>`;
  document.getElementById("tabbar").innerHTML = tab("today","home") + tab("out","out") +
    `<div><button class="scanbtn" data-sheet aria-label="${t("scan")}">${ic("scan",26,2.2)}</button><span class="scanlbl">${t("scan")}</span></div>` +
    tab("returns","back",2) + tab("stock","boxes");
  document.getElementById("sheet").innerHTML = sheet();
  // studio
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("pick").innerHTML = SCREENS.map(s => `<button data-go="${s}" ${s===screen?'aria-current="true"':""}>${s}</button>`).join("");
  document.getElementById("why").innerHTML = WHY[screen];
  const u = new URL(location); u.searchParams.set("lang", lang); u.searchParams.set("screen", screen); history.replaceState(null, "", u);
}
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-go]"); if (!el) return;
  if (el.dataset.lang){ lang = el.dataset.lang; render(); return; }
  if (el.hasAttribute("data-sheet")){ phone.classList.add("open"); return; }
  if (el.hasAttribute("data-already")){ document.getElementById("already").innerHTML = `<div class="card pad" style="margin-top:12px"><div class="row"><span class="thumb">${ic("book",18)}</span><div class="grow"><div style="font-weight:700">${pname("qr")} · ${L("بنغازي","Benghazi")}</div><div class="small muted">${t("outAlready")} · ${t("notTaken")}</div></div></div><button class="btn danger block" style="margin-top:12px">${t("unscan")}</button></div>`; return; }
  if (el.hasAttribute("data-close")) phone.classList.remove("open");
  if (el.dataset.toggle === "damaged"){ damagedOpen = !damagedOpen; render(); return; }
  if (el.dataset.cause){ cause = el.dataset.cause; render(); return; }
  if (el.dataset.choose){ chosen = +el.dataset.choose; render(); return; }
  if (el.dataset.step){ countVal = Math.max(0, countVal + +el.dataset.step); render(); return; }
  if (el.dataset.go){ screen = el.dataset.go; damagedOpen = false; cause = null; render(); document.querySelector(".screen")?.scrollTo(0,0); }
});
document.getElementById("scrim").addEventListener("click", () => phone.classList.remove("open"));
document.addEventListener("input", e => { if (e.target.id === "countIn"){ countVal = parseInt(e.target.value || "0", 10) || 0; const d = countVal - P.th.stock;
  document.getElementById("delta").innerHTML = d===0?`<span class="chip ok"><i></i>${t("same")}</span>`:`<span class="chip ${d<0?"bad":"info"}"><i></i>${t("diff")} <span class="num">${d>0?"+":"−"}${Math.abs(d)}</span></span>`; }});
render();
})();
