<!doctype html>
<!--
  Finances › Produits & marges — prototype v1 (2026-10-04). Refonte de la section Finances en « Aurore »
  (plans/finances-redesign.md). Le KIT (CSS, sprite, script) est recopié à l'identique de finances-pnl-v1.html.

  Réponse du propriétaire (4 oct.) : MÊME STRUCTURE que Produits v6 (approuvé, en production — liste, fiche produit,
  édition en onglets avec un seul enregistrement, création), redessinée en Aurore ; plus 4 petites améliorations qu'il
  peut couper une par une (barre du studio « Améliorations ») ; un repère NOUVEAU montre ce qui a bougé :
    1 · « Profit net » devient « Bénéfice brut » (avant salaires et charges fixes) — le mot de toute la section ;
    2 · le bandeau « stock pas encore compté » disparaît (le stock s'affiche comme juste ; « dernier comptage » reste,
        en simple information) ;
    3 · « à réapprovisionner » devient « Commander → », vers Achats, bon de commande pré-rempli ;
    4 · une puce de base à côté de la période : « commandes reçues, suivies jusqu'à aujourd'hui » (le P&L compte les
        ventes livrées dans le mois).
  Base de la page (inchangée) : une COHORTE — les commandes reçues dans la période, suivies jusqu'à aujourd'hui.
  « Où va l'argent » suit la palette argent de la section, ordre fixe : Coût des produits #2563eb · Livraison #0d9488 ·
  Pub #ea6a1f · Emballage #a855f7 (rose en v6) · Bénéfice #15803d. Livrées / échouées / en route gardent les couleurs v6.
  Manager (?role=mm) : comme v6 (pas d'ajout, pas d'ajustement de stock, édition = Fiche agent seule) ET sans argent.

  DONNÉES FICTIVES (feuille commune du plan) : catalogue Tadabbur… Tapis de prière + 3 produits inactifs inventés ;
  chiffres de cohorte inventés, plausibles (5 sept. → 4 oct. 2026). Aucune photo : un médaillon teinté par produit.
  URL : ?screen=list|sheet|edit|new · &p=tad|mem|mal|cor|sac|gan|tap (inactifs pdn|cas|pcb) · &tab=general|prix|var|stock|fiche
        · ?role=mm · ?fix=0 (aucune amélioration) | ?fix=1,3 (seulement celles-là)
-->

<style>
/* ═══════════════ KIT — shared by every finances-*-v1.html (copy verbatim) ═══════════════ */
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-hov:rgba(255,255,255,.07);
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:24px; --r-in:16px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 20px 52px rgba(42,52,110,.14);
  --glass-in:rgba(255,255,255,.66); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A;
  --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --bad-dot:#E8385A;
  --flat:#475467; --flat-bg:rgba(15,23,40,.05); --tip-bg:#101828;
  /* money — ONE vocabulary for the whole Finances section, fixed order, validated (plans/finances-redesign.md) */
  --m-cogs:#2563eb; --m-ship:#0d9488; --m-ads:#ea6a1f; --m-pack:#a855f7; --m-profit:#15803d;
  /* identity (people) — the agent ramps; used for investors and suppliers' initials only */
  --id-indigo:#444CE7; --id-indigo-7:#3538CD; --id-pink:#DD2590; --id-pink-7:#C11574;
  --id-cyan:#088AB2; --id-cyan-7:#0E7090; --id-gold:#CA8504; --id-gold-7:#A15C07; --id-lime:#4CA30D; --id-lime-7:#3B7C0F;
  --pbh:45px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.cur{font-size:max(.42em,10.5px);font-weight:700;color:var(--ink-3);margin-inline-start:.28em;letter-spacing:0}

/* studio bar — always LTR, always French, never part of the product */
.pbar{position:sticky;top:0;z-index:400;height:var(--pbh);background:#16191E;color:#E6E8EB;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #000;direction:ltr;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks a,.looks button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2;display:inline-flex;align-items:center}
.looks a:hover,.looks button:hover{color:#fff}
.looks a.on,.looks button.on{background:#fff;color:#0E1013}

/* shell + sidebar (the live structure on main) */
.stage{display:flex;min-height:calc(100vh - var(--pbh))}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:var(--pbh);height:calc(100vh - var(--pbh))}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1;text-align:start}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.flag{width:26px;height:18px;border-radius:4px;overflow:hidden;display:grid;grid-template-rows:1fr 2fr 1fr;box-shadow:0 0 0 1px rgba(255,255,255,.14);position:relative;flex:none}
.flag i:nth-child(1){background:#E70013}.flag i:nth-child(2){background:#000}.flag i:nth-child(3){background:#239E46}
.flag b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:9px}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{flex:none;height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(247,144,9,.18);color:#FDB022}
.sb-item.on .sb-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-group{margin-top:14px}
.sb-gl{height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:28px 36px 96px;background:var(--page);background-attachment:fixed}
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* page header — showcase scale (H1 32 / 800) */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb .ic{width:13px;height:13px}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.ph-r{display:grid;justify-items:end;gap:8px}
.acts{display:flex;gap:8px;align-items:center}
.cmp{font-size:12px;color:var(--ink-3);font-weight:500}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn .ic{width:15px;height:15px}
.btn2{height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover:not(:disabled){background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:15px;height:15px}
.btn2.sm,.btn.sm{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px}
.dbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);text-align:start}
.dbtn:hover,.dbtn.open{background:#fff}
.dbtn > div{display:grid;line-height:1.2}
.dbtn b{font-size:14px;font-weight:800}
.dbtn small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.dbtn .chev{width:15px;height:15px;color:var(--ink-3)}

/* pills, chips, trend pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--flat-bg);color:var(--ink-2);white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill i.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.72);border:1px solid var(--glass-in-bd);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tr{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tr .ic{width:12px;height:12px;stroke-width:2.8}
.tr.good{background:var(--good-bg);color:var(--good)} .tr.bad{background:var(--bad-bg);color:var(--bad)} .tr.eq{background:var(--flat-bg);color:var(--flat);padding:0 9px}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chead{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 8px;flex-wrap:wrap}
.chead h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chead .q{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:4px}
.chead .rt{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.glass{background:var(--glass-in);border:1px solid var(--glass-in-bd);border-radius:var(--r-in)}
.link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.link:hover{text-decoration:underline}
.link .ic{width:13px;height:13px}
.hold{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.hold .ic{width:17px;height:17px}
.sw{width:11px;height:11px;border-radius:4px;background:var(--k);flex:none;display:inline-block}
.k-cogs{--k:var(--m-cogs)} .k-ship{--k:var(--m-ship)} .k-ads{--k:var(--m-ads)} .k-pack{--k:var(--m-pack)} .k-profit{--k:var(--m-profit)}
.empty{padding:28px;border:1.5px dashed var(--ink-4);border-radius:18px;text-align:center;color:var(--ink-3);font-weight:600}
.foot{display:flex;gap:10px;align-items:flex-start;padding:2px 6px;font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.5}
.foot .ic{width:15px;height:15px;margin-top:2px;color:var(--ink-q)}
.foot b{color:var(--ink-2)}

/* tooltip — on every mark; never the only place a figure lives */
.tip{position:fixed;z-index:600;pointer-events:none;background:var(--tip-bg);color:#fff;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:320px;line-height:1.45}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:800}
.tip small{display:block;color:#B5BAC2;font-weight:600}

/* popover (date / month picker, menus) */
.popw{position:relative}
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:80;min-width:300px;padding:10px;border-radius:18px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 24px 60px rgba(20,25,60,.22);display:none}
.pop.on{display:block}

/* drawer — floating glass, a halo of its colour (--h) */
.scrim{position:fixed;inset:0;z-index:500;background:rgba(15,23,40,.16);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;bottom:12px;inset-inline-end:12px;z-index:510;width:min(560px,calc(100vw - 24px));border-radius:26px;background:rgba(250,251,255,.86);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--card-bd);box-shadow:0 30px 80px rgba(20,25,60,.24);transform:translateX(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;z-index:-1;inset-inline-start:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--h,#444CE7) 30%,transparent),transparent 70%)}
.dr-h{padding:22px 24px 14px;display:flex;gap:12px;align-items:flex-start}
.dr-h h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dr-h p{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:3px}
.dr-x{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--glass-in);border:1px solid var(--glass-in-bd);flex:none}
.dr-x:hover{background:#fff}
.dr-b{flex:1;overflow:auto;padding:4px 24px 24px;display:grid;gap:16px;align-content:start}
.dr-sec{padding:14px 16px;border-radius:var(--r-in);background:rgba(255,255,255,.66);border:1px solid var(--glass-in-bd)}
.dr-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.dr-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* motion — explains once; off under reduced motion */
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ═══════════════ /KIT ═══════════════ */

/* ═══ PAGE · Produits & marges ═══ */
/* outcome hues — v6's, kept (livrées / échouées / en route; uploadées / rejetées / supprimées / en appel) */
.k-dlv{--k:#16A34A} .k-fail{--k:#DC2626} .k-fly{--k:#0D9488} .k-up{--k:#0D9488} .k-rej{--k:#DC2626}
.k-del{--k:#A1A7AE} .k-call{--k:#D97706} .k-src{--k:#64748B} .k-wd{--k:#A1A7AE} .k-neu{--k:#475467} .k-bad{--k:#C01048}
.noanim *,.noanim *::before{animation:none!important}

/* studio annotation: what an improvement moved — prototype chrome, never product */
.nv{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px 0 4px;border-radius:99px;background:#16191E;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;vertical-align:middle;flex:none;box-shadow:0 4px 12px rgba(15,23,40,.18);cursor:help}
.nv b{display:grid;place-items:center;min-width:13px;height:13px;border-radius:7px;background:#fff;color:#16191E;font-size:9.5px;letter-spacing:0}
.gone-note{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600;padding:4px 2px}

/* toast */
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:620;background:var(--tip-bg);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;box-shadow:0 20px 52px rgba(42,52,110,.18);border-inline-start:4px solid var(--live)}
.toast.bad{border-inline-start-color:var(--bad-dot)}
.toast[hidden]{display:none}
.btn:disabled,.btn2:disabled{opacity:.45;box-shadow:none}
.btn:disabled:hover{background:var(--brand)}

/* period row, segmented controls, small tags */
.prow{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}

.frow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{min-width:0}
.field > label,.field > .lbl{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.req{color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3);font-weight:500;margin-top:6px;line-height:1.45}
.errmsg{font-size:12px;color:var(--bad);font-weight:700;margin-top:6px}
.inp{width:100%;height:40px;border-radius:11px;border:1px solid rgba(15,23,40,.12);background:#fff;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.14)}
.inp::placeholder{color:var(--ink-q);font-weight:500}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical;line-height:1.5;font-weight:500}
.inp.err{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.inp[readonly]{background:rgba(255,255,255,.6);color:var(--ink-2)}
.unit{position:relative}
.unit .u{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;color:var(--ink-3);pointer-events:none}
.unit .inp{padding-inline-end:46px}
.selw{position:relative}
.selw select{appearance:none;-webkit-appearance:none;padding-inline-end:34px}
.selw .ic{position:absolute;inset-inline-end:12px;top:12px;color:var(--ink-q);pointer-events:none}
.count{font-size:11.5px;color:var(--ink-3);text-align:end;margin-top:5px;font-weight:600}
.photo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.photo .pimg{width:72px;height:72px;border-radius:20px}
.photo .pimg .ic{width:30px;height:30px}
.switch{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--glass-in);border:1px solid var(--glass-in-bd);text-align:start;width:100%}
.swt{width:40px;height:23px;border-radius:99px;background:#D0D5DD;position:relative;flex:none;transition:background .15s}
.swt::after{content:"";position:absolute;top:2.5px;inset-inline-start:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,40,.25);transition:inset-inline-start .15s}
.switch[aria-checked=true] .swt{background:var(--brand)}
.switch[aria-checked=true] .swt::after{inset-inline-start:19.5px}
.switch b{display:block;font-size:14px;font-weight:700}
.switch small{display:block;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px}
.tones{display:flex;gap:6px;flex-wrap:wrap}
.tones button{height:38px;padding:0 13px;border-radius:11px;border:1px solid rgba(15,23,40,.1);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.tones .dot{width:8px;height:8px;border-radius:50%}
.tones button.on.info{border-color:#98A2B3;background:#F2F4F7;color:var(--ink)}
.tones button.on.warning{border-color:var(--warn-dot);background:var(--warn-bg);color:var(--warn)}
.tones button.on.critical{border-color:var(--bad-dot);background:var(--bad-bg);color:var(--bad)}
.infob{display:flex;gap:12px;align-items:center;padding:13px 15px;font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.5}
.infob b{color:var(--ink);font-weight:800}
.axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px auto 16px;max-width:520px;text-align:start}
.axes > div{padding:12px 14px}
.axes b{display:block;font-size:13.5px;font-weight:800;color:var(--ink)}
.axes span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.rail{display:grid;gap:14px;position:sticky;top:calc(var(--pbh) + 16px)}
.rc{padding:18px 20px}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rh .ic{width:14px;height:14px;color:var(--ink-q)}
.rh .nv{margin-inline-start:auto}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:6px 0;color:var(--ink-2);font-weight:600}
.crow > span{min-width:0}
.crow .sw{margin-inline-end:8px;vertical-align:-1px}
.crow b{font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.crow small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.crow.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;color:var(--ink);font-weight:800}
.crow.sum b{font-size:16px}
.rail .stk{max-width:none;height:10px;margin-top:12px}
.rnote{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:10px;line-height:1.45}
.rnote b{color:var(--ink-2);font-weight:700}
.impact{display:grid;gap:10px;font-size:13px;color:var(--ink-2);font-weight:500;line-height:1.45}
.impact > div{display:flex;gap:10px;align-items:flex-start}
.impact .ic{margin-top:2px;color:var(--warn)}
.pv{padding:12px;display:grid;gap:8px}
.pvn{font-weight:800;font-size:14px}
.pvb{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:11px;font-size:13px;font-weight:600;line-height:1.45;background:#F2F4F7;color:var(--ink)}
.pvb.warning{background:var(--warn-bg);color:var(--warn)} .pvb.critical{background:var(--bad-bg);color:var(--bad)}
.pvl{font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.45}
.pvl b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pvl.crit{color:var(--bad)}
.savebar{position:fixed;bottom:18px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:450;display:flex;align-items:center;gap:12px;padding-block:8px;padding-inline:18px 8px;border-radius:16px;background:rgba(255,255,255,.92);border:1px solid var(--card-bd);box-shadow:0 20px 52px rgba(42,52,110,.22);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:13.5px;font-weight:700}
.savebar .dang{background:var(--bad)} .savebar .dang:hover{background:#A30E3D}
.sbig > .nv{font-size:9.5px;color:#fff;font-weight:800}
</style>
</head>

  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).slice(0, r).forEach(([, i]) => out[i]++);
  return out;

function listRows() {

  return list.sort((a, b) => { const x = key(a), y = key(b); if (typeof x === "string") return S.dir * x.localeCompare(y); return S.dir * (x - y) || a.n.localeCompare(b.n); });
}

/* ═══ SHEET ═══ */
function sankey(p) {
  const W = 720, H = 320, top = 34, bot = 10, nw = 12, gap = 12, X0 = 104, X1 = 330, X2 = 530;
  const c1 = [["up", p.up, "up"], ["rej", p.rej, "rej"], ["del", p.del, "del"], ["call", p.call + p.toUp, "call"]].filter((n) => n[1] > 0);
  const c2 = [["dlv", p.dlv, "dlv"], ["fly", p.fly, "fly"], ["fail", p.fail, "fail"], ["wd", p.wd, "wd"]].filter((n) => n[1] > 0);
  const L = { rec: "Reçues", up: "Uploadées", call: "En cours d'appel", rej: "Rejetées", del: "Supprimées", dlv: "Livrées", fly: "Chez Darb", fail: "Échouées", wd: "Annulées avant envoi" };
  const k = (H - top - bot - gap * (c1.length - 1)) / p.rec, hh = (v) => Math.max(v * k, 2.5);
  const c1tot = c1.reduce((s, n) => s + hh(n[1]), 0) + gap * (c1.length - 1);
  const n0 = { y: top + (c1tot - p.rec * k) / 2, h: p.rec * k }, N1 = {}, N2 = {};
  let y = top, out = "";
  c1.forEach((n) => { N1[n[0]] = { y, h: hh(n[1]) }; y += hh(n[1]) + gap; });
  if (N1.up) { let y2 = N1.up.y; c2.forEach((n) => { N2[n[0]] = { y: y2, h: hh(n[1]) }; y2 += hh(n[1]) + 10; }); }
  const rect = (x, yy, h, c, tip) => `<rect class="nd k-${c}" x="${x}" y="${yy.toFixed(1)}" width="${nw}" height="${h.toFixed(1)}" rx="4" data-tip="${esc(tip)}"/>`;
  const rib = (x0, y0, x1, y1, h0, h1, c, tip) => { const m = (x0 + x1) / 2; return `<path class="rb k-${c}" data-tip="${esc(tip)}" d="M${x0} ${y0.toFixed(1)} C${m} ${y0.toFixed(1)} ${m} ${y1.toFixed(1)} ${x1} ${y1.toFixed(1)} L${x1} ${(y1 + h1).toFixed(1)} C${m} ${(y1 + h1).toFixed(1)} ${m} ${(y0 + h0).toFixed(1)} ${x0} ${(y0 + h0).toFixed(1)} Z"/>`; };
  const settled = p.dlv + p.fail;
  let so = n0.y;
  c1.forEach((n) => { const tn = N1[n[0]], h = n[1] * k; out += rib(X0 + nw, so, X1, tn.y, h, Math.max(h, tn.h), n[2], `<b>${L[n[0]]}</b> · ${fmt(n[1])}<small>${pct(n[1] / p.rec)} des reçues</small>`); so += h; });
  if (N1.up) { let so2 = N1.up.y; c2.forEach((n) => { const tn = N2[n[0]], h = n[1] * k; out += rib(X1 + nw, so2, X2, tn.y, h, Math.max(h, tn.h), n[2], `<b>${L[n[0]]}</b> · ${fmt(n[1])}<small>${pct(n[1] / p.up)} des uploadées</small>`); so2 += h; }); }
  out += rect(X0, n0.y, n0.h, "src", `<b>Reçues</b> · ${fmt(p.rec)}`);
  c1.forEach((n) => (out += rect(X1, N1[n[0]].y, N1[n[0]].h, n[2], `<b>${L[n[0]]}</b> · ${fmt(n[1])}`)));
  c2.forEach((n) => (out += rect(X2, N2[n[0]].y, N2[n[0]].h, n[2], `<b>${L[n[0]]}</b> · ${fmt(n[1])}`)));
  const label = (x, yy, name, val, pc) => `<text x="${x}" y="${yy.toFixed(1)}"><tspan class="lb">${name}</tspan><tspan class="lv" dx="6">${fmt(val)}</tspan>${pc != null ? `<tspan class="lp" dx="6">${fmt(pc * 100)} %</tspan>` : ""}</text>`;
  const c0y = n0.y + n0.h / 2;
  out += `<text x="${X0 - 12}" y="${(c0y - 10).toFixed(1)}" text-anchor="end" class="l0">Reçues</text><text x="${X0 - 12}" y="${(c0y + 20).toFixed(1)}" text-anchor="end" class="v0">${fmt(p.rec)}</text>`;
  c1.forEach((n) => { const node = N1[n[0]]; out += n[0] === "up" ? label(X1, node.y - 11, L.up, n[1], n[1] / p.rec) : label(X1 + nw + 8, node.y + node.h / 2 + 4.5, L[n[0]], n[1], n[1] / p.rec); });
  c2.forEach((n) => { const node = N2[n[0]]; out += label(X2 + nw + 8, node.y + node.h / 2 + 4.5, L[n[0]], n[1], (n[0] === "dlv" || n[0] === "fail") && settled ? n[1] / settled : null); });
  return `<svg class="sk" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ce que sont devenues les ${fmt(p.rec)} commandes">${out}</svg>`;
}

  }
  let calc;
  if (!p.dlv) calc = `<p class="rnote">Pas encore de livraison : la pub par livraison sera connue après les premières ventes.</p>`;
  else {
    const price = num(ed.price), darb = p.darb / p.dlv, cogsPer = (num(ed.cogs) * p.units) / p.dlv, kPer = p.parcels / p.dlv, packPer = num(ed.pack) * kPer, adsPer = p.ads / p.dlv;
    const before = price - darb - cogsPer - packPer, net = before - adsPer, tot = Math.max(price, darb + cogsPer + packPer + adsPer);
    const segs = [["cogs", cogsPer], ["ship", darb], ["ads", adsPer], ["pack", packPer], ["profit", Math.max(net, 0)]].filter((s) => s[1] > 0);
    calc = `${r("", "Prix payé", "", price)}${r("ship", "Livraison", "facture Darb moyenne", -darb)}${r("cogs", "Coût d'achat", "", -cogsPer)}${num(ed.pack) > 0 ? r("pack", "Emballage", `${fmt1(num(ed.pack))} × ${fmt1(kPer)} colis`, -packPer) : ""}
      ${r("", "Avant pub", "", before, "sum")}${r("ads", "Pub", "moyenne 30 j", -adsPer)}${r("profit", F(1) ? "Bénéfice brut par livraison" : "Net par livraison", F(1) ? "avant salaires et charges fixes" : "", net, "sum")}
      <div class="stk">${segs.map(([k, v]) => `<i class="k-${k}" style="flex:${Math.round((v / tot) * 1000)}" data-tip="<b>${mLabel(k)}</b> · ${fmt1(v)} د.ل"></i>`).join("")}</div>
      <p class="rnote">La pub peut monter jusqu'à <b>${money1(before)}</b> par livraison. Elle en coûte <b>${money1(adsPer)}</b> aujourd'hui.</p><p class="rnote">Moyennes des 30 derniers jours · ${fmt(p.dlv)} livraisons</p>`;
  }
  return `<div class="card rc"><div class="rh eyebrow">${ic("wallet")}Par livraison${nv(1)}</div>${calc}</div>
    <div class="card rc"><div class="rh eyebrow">${ic("alert")}Avant d'enregistrer</div><div class="impact">${p.fly ? `<div>${ic("truck")}<span>${fmt(p.fly)} colis de ce produit sont chez Darb en ce moment.</span></div>` : ""}<div>${ic("coins")}<span>Changer le coût d'achat recalcule ${F(1) ? "le bénéfice brut" : "le profit"} de toutes les livraisons passées.</span></div></div></div>`;
}
function saveBarHTML() {
  const n = dirtyKeys().length, isNew = S.screen === "new";
  if (!n) return "";
  if (S.discard) return `<div class="savebar" role="region" aria-label="Enregistrement"><span>${isNew ? "Abandonner ce nouveau produit ?" : `Abandonner ${n} modification(s) ?`}</span><button class="btn2 sm" type="button" data-act="keep">Continuer</button><button class="btn sm dang" type="button" data-act="discard">Abandonner</button></div>`;
  return `<div class="savebar" role="region" aria-label="Enregistrement"><span>${n} modification(s) non enregistrée(s)</span><button class="btn2 sm" type="button" data-act="cancel">Annuler</button><button class="btn sm" type="button" data-act="save">${ic("check")}${isNew ? "Créer le produit" : "Enregistrer"}</button></div>`;
}
function editScreen(p) {
  const isNew = S.screen === "new";
  if (!S.ed) startEdit();
  if (!tabList().includes(S.tab)) S.tab = tabList()[0];
  const crumb = isNew
    ? `Finances ${ic("right")}<button type="button" data-act="tolist">Produits &amp; marges</button>${ic("right")}<span>Ajouter un produit</span>`
    : `Finances ${ic("right")}<button type="button" data-act="tolist">Produits &amp; marges</button>${ic("right")}<button type="button" data-act="tosheet">${esc(p.n)}</button>${ic("right")}<span>Modifier</span>`;
  const dirty = dirtyKeys().length;
  let h = `<nav class="crumb rise" style="--d:0" aria-label="Fil d'Ariane">${crumb}</nav>
  <div class="ehead rise" style="--d:0">${isNew ? `<span class="pimg new">${ic("plus")}</span>` : pimg(p)}<div class="grow"><h1>${isNew ? "Ajouter un produit" : "Modifier le produit"}</h1><div class="nm" id="edName">${esc(S.ed.name || (isNew ? "Sans nom pour l'instant" : p.n))}</div></div>
    <div class="acts">${isNew ? `<button class="btn2" type="button" data-act="tolist">Annuler</button>` : `<button class="btn2" type="button" data-act="tosheet">${ic("eye")}Voir la fiche</button>`}<button class="btn" type="button" id="hdrSave" data-act="save"${dirty ? "" : " disabled"}>${ic("check")}${isNew ? "Créer le produit" : "Enregistrer"}</button></div></div>
  <div class="tabsrow rise" style="--d:1"><div class="seg" role="tablist" id="tabs">${tabsHTML()}</div>${SA() ? "" : `<span class="rolenote">${ic("info")}Les autres onglets sont réservés au super admin.</span>`}</div>
  <div class="egrid rise" style="--d:2"><div class="card panel" role="tabpanel">${panelHTML(p)}</div><aside class="rail" id="rail">${railHTML(p)}</aside></div>`;
  return h;
}
function updateEditChrome() {
  const p = prod();
  if ($("#tabs")) $("#tabs").innerHTML = tabsHTML();
  if ($("#rail")) $("#rail").innerHTML = railHTML(p);
  $("#savebar").innerHTML = saveBarHTML();
  const hs = $("#hdrSave"); if (hs) hs.disabled = !dirtyKeys().length;
  if ($("#briefCount")) $("#briefCount").textContent = `${280 - S.ed.brief.length} caractères restants`;
  if ($("#edName")) $("#edName").textContent = S.ed.name || (S.screen === "new" ? "Sans nom pour l'instant" : p.n);
}

/* ═══ render ═══ */
function syncUrl() {
  const u = new URLSearchParams();
  if (S.screen !== "list") u.set("screen", S.screen);
  if (S.screen === "sheet" || S.screen === "edit") u.set("p", S.p);
  if ((S.screen === "edit" || S.screen === "new") && S.tab !== "general") u.set("tab", S.tab);
  if (S.role === "mm") u.set("role", "mm");
  const f = [...S.fix].sort().join(",");
  if (f !== "1,2,3,4") u.set("fix", f || "0");
  const s = u.toString();
  history.replaceState(null, "", s ? `?${s}` : location.pathname);
}
function render(anim = true) {
  if (S.screen === "new" && !SA()) S.screen = "list";
  renderShell("produits", S.role);
  if (!SA()) $$("#side .sb-group").forEach((g) => { if (g.querySelector(".sb-gl")?.textContent === "Système") g.remove(); });
  const page = $("#page");
  page.classList.toggle("noanim", !anim);
  const p = prod();
  page.innerHTML = S.screen === "list" ? listScreen() : S.screen === "sheet" ? sheetScreen(p) : editScreen(p);
  if (S.screen === "list") renderTable();
  $("#savebar").innerHTML = S.screen === "edit" || S.screen === "new" ? saveBarHTML() : "";
  $$(".pbar [data-screen]").forEach((b) => b.classList.toggle("on", b.dataset.screen === S.screen));
  $$(".pbar [data-role]").forEach((b) => b.classList.toggle("on", b.dataset.role === S.role));
  $$(".pbar [data-fix]").forEach((b) => { b.classList.toggle("on", F(b.dataset.fix)); b.dataset.tip = `<b>Amélioration ${b.dataset.fix} · ${F(b.dataset.fix) ? "activée" : "coupée"}</b><small>${esc(FIXES[b.dataset.fix])}</small>`; });
  syncUrl();
}
let toastT;
function toast(msg, bad = false) { const t = $("#toast"); t.textContent = msg; t.className = `toast${bad ? " bad" : ""}`; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }
function go(screen, extra = {}) {
  if ((screen === "edit" || screen === "new") && S.screen !== screen) { S.ed = null; S.tab = extra.tab || (SA() ? "general" : "fiche"); }
  Object.assign(S, extra, { screen });
  render(true); window.scrollTo(0, 0);
}

/* ═══ events ═══ */
document.addEventListener("click", (e) => {
  const sc = e.target.closest(".pbar [data-screen]");
  if (sc) { go(sc.dataset.screen); return; }
  const rl = e.target.closest(".pbar [data-role]");
  if (rl) { S.role = rl.dataset.role; if (S.ed && !SA()) S.tab = "fiche"; render(true); return; }
  const fx = e.target.closest(".pbar [data-fix]");
  if (fx) { const k = fx.dataset.fix; S.fix.has(k) ? S.fix.delete(k) : S.fix.add(k); render(false); return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const link = e.target.closest("a[href]");
  if (link && !link.dataset.act) return; /* « Commander → » inside a row navigates to Achats */
  const act = a.dataset.act, v = a.dataset.v;
  switch (act) {
    case "proto": e.stopPropagation(); toast("Prototype : cette action ne fait rien ici."); break;
    case "open": go("sheet", { p: a.dataset.k }); break;
    case "tolist": go("list"); break;
    case "tosheet": go("sheet"); break;
    case "edit": go("edit"); break;
    case "new": go("new"); break;
    case "writesheet": go("edit", { tab: "fiche" }); break;
    case "filter": S.filter = v; S.sig = null; render(false); break;
    case "sig": S.sig = S.sig === v ? null : v; if (S.sig) S.filter = "active"; render(false); break;
    case "sort": if (S.sort === v) S.dir = -S.dir; else { S.sort = v; S.dir = v === "name" ? 1 : -1; } render(false); break;
    case "period": if (v !== "30") toast("Prototype : seules les données des 30 derniers jours sont chargées."); break;
    case "tab": S.tab = v; S.discard = false; render(false); break;
    case "active": S.ed.active = !S.ed.active; a.setAttribute("aria-checked", String(S.ed.active)); updateEditChrome(); break;
    case "tone": S.ed.tone = v; $$("[data-act=tone]").forEach((b) => { const on = b.dataset.v === v; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); updateEditChrome(); break;
    case "save": {
      const isNew = S.screen === "new";
      if (!S.ed.name.trim() || (isNew && !String(S.ed.cogs).trim())) {
        S.err = true; S.tab = !S.ed.name.trim() ? "general" : "prix"; render(false);
        toast(isNew ? "Il manque le nom ou le coût d'achat." : "Le nom est obligatoire.", true); $(!S.ed.name.trim() ? "#f-name" : "#f-cogs")?.focus(); break;
      }
      if (isNew) { S.ed = null; go("list"); toast("Produit créé — prototype : rien n'est enregistré."); break; }
      S.orig = JSON.parse(JSON.stringify(S.ed)); S.err = false; S.discard = false; render(false); toast("Enregistré"); break;
    }
    case "cancel": S.discard = true; updateEditChrome(); break;
    case "keep": S.discard = false; updateEditChrome(); break;
    case "discard": S.ed = JSON.parse(JSON.stringify(S.orig)); S.discard = false; S.err = false; render(false); break;
  }
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("row")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "q") { S.q = el.value; renderTable(); return; }
  const k = el.dataset?.f; if (!k || !S.ed) return;
  S.ed[k] = el.value;
  if (S.err && el.value.trim()) { el.classList.remove("err"); el.parentNode.closest(".field")?.querySelector(".errmsg")?.remove(); }
  updateEditChrome();
});
document.addEventListener("change", (e) => { const k = e.target.dataset?.f; if (k && S.ed && e.target.tagName === "SELECT") { S.ed[k] = e.target.value; updateEditChrome(); } });
/* legend hover highlights its marks in every row */
document.addEventListener("pointerover", (e) => {
  const t = $("#tblc"); if (!t) return;
  const l = e.target.closest("#lgd [data-hl]");
  if (l) t.dataset.hl = l.dataset.hl; else delete t.dataset.hl;
});

render(true);
</script>
</body>
</html>
