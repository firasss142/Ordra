/* ═══════════════════════════════════════════════════════════════════════════
   TOKENS — restated from src/app/globals.css (--oms-* console palette and the
   --ads-* cost hues). Copied, not chosen. Light only: the product has no dark
   mode (see pnl-v2 rationale).
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --oms-bg:#FAFAF8; --oms-surface:#FFFFFF; --oms-sunken:#F4F3EF;
  --oms-border:#EAE7E1; --oms-border-strong:#DCD8D0;
  --oms-ink-1:#1B1917; --oms-ink-2:#5C5852; --oms-ink-3:#78726A;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-pos:#16A34A;
  --oms-accent:#6E56CF; --oms-accent-ink:#513FA8; --oms-accent-bg:#F1EEFC;
  --oms-age-warm:#A9670C; --oms-warn-bg:#FBF1E2; --oms-warn-ink:#8F5608;
  --oms-age-late:#B23A32; --oms-bad-bg:#FBECEA;
  --oms-ok:#2F7A4A; --oms-ok-bg:#E8F4EC;
  --oms-info:#0E7A6E; --oms-info-bg:#E4F3F0; --oms-info-ink:#0B6A60;
  --status-success:#008060; --status-critical:#D72C0D;
  /* ad-spend cost hues (validated: all pass; packing needs a labelled legend, which it has) */
  --ads-pub:#ea6a1f; --ads-cogs:#2563eb; --ads-delivery:#0d9488; --ads-returns:#6d5ce0; --ads-packing:#e87ba4; --ads-profit:#15803d;
  --ads-red:#DC2626; --ads-red-ink:#B91C1C; --ads-red-bg:#FEE2E2; --ads-green-ink:#15803D;
  --ads-hatch-bad:repeating-linear-gradient(135deg,#F3B4B4 0 5px,#FBDCDC 5px 10px);
  --shadow-hover-row:0 1px 2px rgba(16,24,40,.04); --shadow-panel:0 4px 16px rgba(16,24,40,.06); --shadow-floating:0 8px 24px rgba(16,24,40,.10);
  --r-card:10px; --r-lg:8px; --r-pill:9999px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:InterP,NotoArabicP,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#EFEEEA;color:var(--oms-ink-1);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ═══════ prototype chrome ═══════ */
.chrome{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:#14171C;color:#E6E8EB;border-bottom:1px solid rgba(255,255,255,.10)}
.chrome .brand{font-size:12.5px;font-weight:600;letter-spacing:.02em;margin-inline-end:6px}
.chrome .brand span{color:#7F858F;font-weight:400}
.chrome button{font-size:12px;font-weight:600;height:28px;padding:0 11px;border-radius:var(--r-lg);cursor:pointer;background:transparent;color:#B5BAC2;border:1px solid rgba(255,255,255,.14);transition:background 120ms,color 120ms,border-color 120ms}
.chrome button:hover{background:rgba(255,255,255,.07);color:#fff}
.chrome button[aria-pressed=true]{background:#15803D;border-color:#15803D;color:#fff}
.chrome .spacer{margin-inline-start:auto}
.chrome .hint{font-size:11px;color:#7F858F}
.chrome .sep{width:1px;height:18px;background:rgba(255,255,255,.14);margin:0 4px}

/* ═══════ stage / frames ═══════ */
.stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 20px 60px;flex-wrap:wrap}
.view{display:none}.view.is-on{display:block}
.phone{width:390px;flex:none;background:var(--oms-bg);border-radius:34px;border:1px solid #D6D3CC;box-shadow:0 20px 50px rgba(16,24,40,.14),0 0 0 8px #1B1917,0 0 0 9px #3A3733;overflow:hidden;position:relative}
.phone .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12.5px;font-weight:600;background:var(--oms-bg)}
.phone .screen{min-height:760px;max-height:860px;overflow-y:auto;scrollbar-width:none;padding-bottom:78px}
.phone .screen::-webkit-scrollbar{display:none}
body.full .phone .screen{max-height:none;overflow:visible}
body.full .tabbar{position:sticky}
.tabbar{position:absolute;inset-inline:0;bottom:0;height:70px;background:var(--oms-surface);border-top:1px solid var(--oms-border);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px 14px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--oms-ink-3);font-size:10.5px;font-weight:600;padding-top:6px;border-radius:8px}
.tabbar a.on{color:var(--oms-ink-1)}
.tabbar svg{width:20px;height:20px}
.desk{width:min(1280px,100%);background:var(--oms-bg);border-radius:12px;border:1px solid #D6D3CC;box-shadow:0 20px 50px rgba(16,24,40,.12);overflow:hidden}
.aside{width:360px;flex:none;display:none;flex-direction:column;gap:10px}
body.notes-on .aside{display:flex}
.aside h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--oms-ink-3)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--oms-warn-bg);border:1px solid var(--oms-age-warm);border-radius:var(--r-lg);font-size:12px;line-height:1.5;color:var(--oms-warn-ink)}
.note b{color:#6F4306}
.note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:rgba(169,103,12,.12);padding:1px 4px;border-radius:4px}
.n{flex:none;display:grid;place-items:center;width:18px;height:18px;margin-top:1px;border-radius:var(--r-pill);background:var(--oms-age-warm);color:#fff;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.mark{display:none;position:absolute;z-index:5;width:18px;height:18px;border-radius:var(--r-pill);background:var(--oms-age-warm);color:#fff;font-size:10.5px;font-weight:700;place-items:center;box-shadow:0 0 0 2px #fff}
body.notes-on .mark{display:grid}
.rel{position:relative}

/* ═══════ portal grammar (maps to /dashboard + /orders Tailwind strings) ═══════ */
.pg{display:flex;flex-direction:column;gap:14px;padding:6px 14px 20px}
.top{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.top .who span{display:block;font-size:11.5px;color:var(--oms-ink-3);margin-top:1px}
.avatar{width:36px;height:36px;border-radius:var(--r-pill);background:var(--oms-ink-1);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.bell{position:relative;width:34px;height:34px;border-radius:var(--r-pill);border:1px solid var(--oms-border);background:var(--oms-surface);display:grid;place-items:center;color:var(--oms-ink-2)}
.bell i{position:absolute;top:-3px;inset-inline-end:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);background:var(--status-critical);color:#fff;font-size:10px;font-weight:700;font-style:normal;display:grid;place-items:center}
.fresh{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--oms-ink-3)}
.fresh .dot{width:7px;height:7px;border-radius:50%;background:var(--brand-pos)}
.card{background:var(--oms-surface);border:1px solid var(--oms-border);border-radius:var(--r-card);padding:14px}
.card.pad0{padding:0}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--oms-ink-3)}
.hero .lbl{margin-bottom:6px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hero .big small{font-size:14px;font-weight:600;color:var(--oms-ink-3);letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.chip.up{background:var(--oms-ok-bg);color:var(--oms-ok)}
.chip.down{background:var(--oms-bad-bg);color:var(--oms-age-late)}
.chip.flat{background:var(--oms-sunken);color:var(--oms-ink-2)}
.chip.ghost{background:transparent;border:1px dashed var(--oms-border-strong);color:var(--oms-ink-3);font-weight:600}
.hero .sub{margin-top:6px;font-size:12px;color:var(--oms-ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hero .sub .dotsep{color:var(--oms-border-strong)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:26px;padding:0 10px;border-radius:var(--r-lg);border:1px solid var(--oms-border);background:var(--oms-surface);color:var(--oms-ink-2);font-size:12px;font-weight:600;cursor:pointer}
.pill[aria-pressed=true]{border-color:var(--oms-border-strong);color:var(--oms-ink-1);background:var(--oms-sunken)}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr}
.chart{direction:ltr}
.tt{position:absolute;pointer-events:none;background:#1B1917;color:#fff;font-size:11.5px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);display:none;box-shadow:var(--shadow-floating)}
.tt b{font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--oms-ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-inline-end:5px}
.legend i.dash{border-top-style:dashed}
.legend i.area{width:12px;height:10px;border:0;border-radius:2px;background:var(--oms-warn-bg);outline:1px solid var(--oms-age-warm)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--oms-surface);border:1px solid var(--oms-border);border-radius:var(--r-card);padding:10px 10px 9px;min-width:0}
.tile .lbl{font-size:10px}
.tile .v{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:10.5px;font-weight:600;color:var(--oms-ink-3)}
.tile .h{font-size:10.5px;color:var(--oms-ink-3);margin-top:3px;line-height:1.35}

function dealValueSeries(d){ // returns [{d,val,econ}] val = settled part + unsettled payable part
  const out=[];let cumAtStmt=null;

document.querySelector(".chrome").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.view)show(b.dataset.view);
  if(b.id==="notesBtn"){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);document.body.classList.toggle("notes-on",on);}
  if(b.dataset.lang){S.lang=b.dataset.lang;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.querySelectorAll(".chrome [data-lang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===S.lang));renderAll();}
});
document.body.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();show(g.dataset.go);return;}
  const d=e.target.closest("[data-deal]");if(d){e.preventDefault();S.deal=d.dataset.deal;renderDeal();show("deal");return;}
  const r=e.target.closest("[data-range]");if(r){S.range=r.dataset.range;renderHome();return;}
  const dr=e.target.closest("[data-drange]");if(dr){S.dealRange=dr.dataset.drange;renderDeal();return;}
  const at=e.target.closest("[data-atab]");if(at){e.preventDefault();A.tab=at.dataset.atab;renderAdmin();return;}
  const ai=e.target.closest("[data-ainv]");if(ai){A.inv=ai.dataset.ainv;renderAdmin();return;}
  const ad=e.target.closest("[data-adeal]");if(ad){A.deal=ad.dataset.adeal;renderAdmin();return;}
  const aw=e.target.closest("[data-awd]");if(aw){A.wd=aw.dataset.awd;renderAdmin();return;}
});
(function(){const h=new URLSearchParams(location.hash.slice(1));if(h.get("lang")){S.lang=h.get("lang");document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.querySelectorAll(".chrome [data-lang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===S.lang));}
if(h.get("deal"))S.deal=h.get("deal");if(h.get("tab"))A.tab=h.get("tab");if(h.get("adeal"))A.deal=h.get("adeal");if(h.get("inv"))A.inv=h.get("inv");if(h.get("range"))S.dealRange=h.get("range");
if(h.get("full")==="1")document.body.classList.add("full");if(h.get("notes")==="1"){document.body.classList.add("notes-on");document.getElementById("notesBtn").setAttribute("aria-pressed","true");}
renderAll();if(h.get("view"))show(h.get("view"));})();
</script>
</body>
</html>
