<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ordra — Voix du client, côté agent (v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v2 — « Voix du client / صوت العميل » vu par l'AGENT. Construit 2026-10-01.
  Plan : plans/voix-du-client.md. Remplace la v1 (approuvée, puis rouverte par le propriétaire le 2026-10-01 :
  « plus dédié à mes besoins » — quand et comment la voix du client nous arrive, 3 catégories).
  Décisions du propriétaire (2026-10-01) :
   · 4 moments : appel de confirmation · en attente / en route · à la porte / retour · après livraison.
   · Les clients ne nous joignent qu'en RAPPELANT l'agent (pas de page, pas de WhatsApp) → la saisie pendant un
     appel entrant compte autant que pendant un appel sortant. Pas de prise de contact après livraison.
   · 3 catégories PAR INTENTION : Réclamation (un souci à régler) · Objection (pourquoi il hésite ou refuse) ·
     Suggestion (ce qu'il aimerait ou apprécie). Sujet facultatif sous chaque catégorie, modifiable par le responsable.
   · Le MOMENT est déduit automatiquement du statut de la commande — aucun geste de plus.
   · Les mêmes agents suivent la livraison (onglet Livraison) : « Veut annuler » / « Retour confirmé » proposent
     d'enregistrer le pourquoi (même schéma que le refus « Autre »).
   · Les remarques du livreur deviennent des suggestions confirmées par le RESPONSABLE (voir manager-v3).
  Écrans : ?screen=call | callback | delivery | reject | mine   ·   ?view=mobile   ·   ?lang=ar|fr
  Clavier : F ouvrir (e.code KeyF — marche en clavier arabe) · 1–3 catégorie · Ctrl/⌘+Entrée enregistrer · Échap.
  Données RÉELLES (Libye) : produits, prix, libellés des issues de livraison (src/messages, delivery.sheet), remarques
  réelles du livreur Darb, phrases réelles des notes « Autre ». Noms et téléphones des clients INVENTÉS.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FAFAF9; --soft:#F9FAFB; --sunk:#F3F4F6;
  --line:#E5E7EB; --line-2:#D1D5DB; --line-strong:#C9CCCF;
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280; --ink-4:#9CA3AF;
  --brand:#15803D; --brand-deep:#14532D; --brand-tint:#F0FDF4; --brand-line:#BBF7D0;
  --black:#111111; --studio:#E9EBEF;
  --g-red:#D72C0D; --g-amber:#B98900; --g-violet:#7C3AED; --g-teal:#0E7490; --g-neutral:#8C9196;
  --f-lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
}
/* The THREE categories — shared with voix-du-client-manager-v3.html */
[data-c=reclamation]{--tb:#FEE2E2;--ti:#991B1B;--td:#EF4444}
[data-c=objection]  {--tb:#FEF3C7;--ti:#92400E;--td:#F59E0B}
[data-c=suggestion] {--tb:#DCFCE7;--ti:#166534;--td:#22C55E}
/* /delivery tones (delivery/ui.tsx TONE) */
[data-t=red]   {--from:#FECACA;--to:#FEF2F2;--tink:#991B1B;--ring:#FCA5A5;--edge:#EF4444}
[data-t=indigo]{--from:#C7D2FE;--to:#EEF2FF;--tink:#3730A3;--ring:#A5B4FC;--edge:#6366F1}
[data-t=amber] {--from:#FDE68A;--to:#FFFBEB;--tink:#92400E;--ring:#FCD34D;--edge:#F59E0B}
[data-t=teal]  {--from:#99F6E4;--to:#F0FDFA;--tink:#115E59;--ring:#5EEAD4;--edge:#14B8A6}
[data-t=grey]  {--from:#E5E7EB;--to:#F9FAFB;--tink:#374151;--ring:#D1D5DB;--edge:#9CA3AF}

*{box-sizing:border-box}
body{margin:0;background:var(--studio);color:var(--ink);font-family:var(--f-lat);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.q{unicode-bidi:plaintext}
.app,.scr{font-family:var(--f-lat)}
.app[dir=rtl],.scr[dir=rtl]{font-family:var(--f-ar)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:#fff;font:700 11px/1 var(--f-lat);color:var(--ink-3)}
[dir=rtl] .flip svg,[dir=rtl] svg.flip{transform:scaleX(-1)}

/* studio */
.studio{padding:18px 20px 40px;direction:ltr;font-family:var(--f-lat)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1520px;margin:0 auto 12px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--black);color:#fff}
.note{max-width:1520px;margin:0 auto 14px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.note b{color:var(--ink-2)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:1px 4px;border-radius:4px}
.stage{max-width:1520px;margin:0 auto}
.hscroll{overflow-x:auto}

/* atoms */
.thumb{width:44px;height:44px;border-radius:8px;background:#F3F4F6 center/cover no-repeat;flex:0 0 auto}
.thumb.q{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%234B2E2B'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%234B2E2B'/></svg>")}
.thumb.d{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%23123B2F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%23123B2F'/></svg>")}
.thumb.h{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%231F3A5F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%231F3A5F'/></svg>")}
.thumb.t{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%235B2333'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23D8B46A' opacity='.85'/><circle cx='22' cy='22' r='5' fill='%235B2333'/></svg>")}
.thumb.b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><path d='M22 4v6' stroke='%236B7280' stroke-width='2'/><rect x='14' y='10' width='16' height='28' rx='8' fill='%23B91C1C'/><rect x='14' y='18' width='16' height='3' fill='%23111827' opacity='.35'/></svg>")}
.ctag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:600;white-space:nowrap}
.ctag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--td);flex:0 0 auto}
.mom{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#F1F5F9;color:#334155;font-size:12.5px;font-weight:600;white-space:nowrap}
.mom svg{width:14px;height:14px;color:#475569}
.mom small{font-weight:500;color:#64748B}
.stat{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.stat[data-s=open]{background:#FFF4F4;color:#D72C0D}
.stat[data-s=in_progress]{background:#FFF8E6;color:#8A5A00}
.stat[data-s=resolved]{background:#F1F8F5;color:#008060}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-p kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn-o:hover{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;font-weight:600;background:linear-gradient(to right,var(--from),var(--to));color:var(--tink);box-shadow:inset 0 0 0 1px var(--ring)}
[dir=rtl] .chip{background:linear-gradient(to left,var(--from),var(--to));padding:4px 10px 4px 12px}
.chip svg{width:14px;height:14px;stroke-width:2}

/* shell */
.app{min-width:1180px;height:980px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:start}
.top{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);z-index:30}
.top .brand{font-size:22px;font-weight:800;color:var(--brand-deep);font-family:var(--f-lat)}
.top .brand i{font-style:normal;color:var(--brand)}
.top .mkt{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:12px}
.top .mkt svg{width:14px;height:14px}
.tabs{display:flex;align-items:center;gap:2px;height:52px;padding:4px;margin-inline-start:auto;border-radius:14px;background:var(--sunk)}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs a svg{width:16px;height:16px;opacity:.7}
.tabs a[aria-current=page]{color:var(--brand);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#DCFCE7;color:var(--brand);font-size:12px;font-weight:700}
.slot-end{display:flex;align-items:center;gap:12px;margin-inline-start:16px}
.presence{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--brand-tint);border:1px solid var(--brand-line);font-size:13px;font-weight:600;color:#14532D}
.presence i{width:7px;height:7px;border-radius:50%;background:#22C55E}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:var(--ink-2)}

/* queue + panel (as shipped; panel not redesigned) */
.qpage{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 20px 0}
.qh{display:flex;align-items:center;gap:16px;height:52px}
.qh h2{margin:0;font-size:22px;font-weight:700;white-space:nowrap}
.qh .sub{color:var(--ink-3);font-size:13px;white-space:nowrap}
.qh .meters{margin-inline-start:auto;display:flex}
.qh .mt{display:flex;flex-direction:column;align-items:flex-end;padding:0 14px;border-inline-start:1px solid var(--line)}
.qh .mt:first-child{border-inline-start:0}
.qh .mt .v{font-size:15px;font-weight:700}
.qh .mt .l{font-size:11.5px;color:var(--ink-3)}
.qchips{display:flex;gap:14px;margin-top:4px}
.qchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:14px;font-weight:600}
.qchip b{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 7px;border-radius:999px;background:var(--sunk);font-size:12px}
.qchip[aria-pressed=true]{border:1.5px solid var(--brand);color:#14532D}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:20px;margin-top:17px;padding-bottom:24px}
.qbody[data-nopanel]{grid-template-columns:minmax(0,1fr)}
.qtable{min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qth,.qrow{display:grid;grid-template-columns:minmax(0,1fr) 190px 80px 92px;gap:16px;align-items:center;padding:0 16px}
.qth{height:34px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-3)}
.qrows{flex:1;min-height:0;overflow-y:auto}
.qrow{min-height:66px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow[aria-selected=true]{box-shadow:inset 0 0 0 1.5px var(--brand);border-radius:8px}
.qid{display:flex;align-items:center;gap:12px;min-width:0}
.qid .nm{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qid .pr{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.qid .pr .fb{color:#991B1B;font-weight:600}
.c-act{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13.5px;color:var(--ink-2)}
.c-act .att{display:inline-grid;place-items:center;height:26px;padding:0 8px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;font-weight:600;direction:ltr}
.c-age{direction:ltr;justify-self:left}
.c-age .v{font-size:16px;font-weight:700;display:block}
.c-age .bar{margin-top:6px;width:70px;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.c-age .bar i{display:block;height:100%;background:#F97316}
.c-age[data-tone=red] .v{color:#DC2626}.c-age[data-tone=red] .bar i{background:#DC2626}
.c-amt{direction:ltr;justify-self:left;white-space:nowrap}
.c-amt small{font-size:13px;color:var(--ink-3)} .c-amt b{font-size:17px}
.qfoot{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.qfoot .sp{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.qpanel{min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qpanel .pt{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-bottom:1px solid var(--line)}
.qpanel .st{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;background:var(--sunk);font-size:13.5px;font-weight:600;white-space:nowrap}
.qpanel .st svg{width:15px;height:15px}
.qpanel .ref{margin-inline-start:auto;font-size:14px;color:var(--ink-2)}
.qpanel .x{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.fbk{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);position:relative;white-space:nowrap}
[dir=rtl] .fbk{padding:0 10px 0 8px}
.fbk svg{width:15px;height:15px;color:#6D28D9}
.fbk .n{position:absolute;top:-7px;inset-inline-end:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#EF4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.qpanel .cust{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 12px}
.qpanel .lbl{font-size:12.5px;color:var(--ink-3)}
.qpanel .cust .nm{font-size:22px;font-weight:700;margin-top:2px}
.qpanel .cust .cp{font-size:15px;font-weight:600;margin-top:6px}
.qpanel .cust .ctas{margin-inline-start:auto;align-self:center;display:flex;gap:8px}
.qpanel .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.qpanel .fc{padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.qpanel .fc:nth-child(odd){border-inline-end:1px solid var(--line)}
.qpanel .fc .v{font-size:14px;margin-top:3px}
.qpanel .ptabs{display:flex;gap:26px;padding:0 18px;border-bottom:1px solid var(--line);height:42px}
.qpanel .ptabs button{height:42px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.qpanel .ptabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.qpanel .pbs{flex:1;min-height:0;overflow-y:auto}
.qpanel .prod{display:flex;align-items:center;gap:12px;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.qpanel .prod .thumb{width:56px;height:56px}
.qpanel .prod .pn{font-size:15px;font-weight:700}
.qpanel .prod .pa{margin-inline-start:auto;font-size:15px;font-weight:700;direction:ltr}
.qpanel .pf{padding:10px 12px 8px;border-top:1px solid var(--line)}
.qpanel .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qpanel .act{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.qpanel .act svg{width:15px;height:15px}
.qpanel .act.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.qpanel .act.no{border-color:#F87171;color:#B91C1C}
.qpanel .act.cb2{border-color:#FCD34D;background:#FFFBEB;color:#92400E}
.qpanel .hint{margin-top:9px;text-align:center;font-size:12px;color:var(--ink-3)}
.qpanel .hint b{color:#6D28D9}

/* ── the capture window, v2 ── */
.cveil{position:absolute;inset:0;background:rgba(17,24,39,.34);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:56px}
.cap{width:680px;max-height:calc(100% - 84px);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(17,24,39,.24);display:flex;flex-direction:column;overflow:hidden}
.cap .ch{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.cap .ch .ic{width:40px;height:40px;border-radius:10px;background:#F5F3FF;color:#6D28D9;display:grid;place-items:center}
.cap .ch h3{margin:0;font-size:18px;font-weight:700}
.cap .ch p{margin:1px 0 0;font-size:13px;color:var(--ink-3)}
.cap .ch .x{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.cap .ch .x button{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);color:var(--ink-2)}
.cap .cb{flex:1;min-height:0;overflow-y:auto;padding:0 18px 16px}
.cap .l3{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-3);margin:14px 0 8px}
.cap .l3 small{font-weight:500;color:var(--ink-4)}
.cap .l3 .sp{margin-inline-start:auto;font-weight:500}
.ctx{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.ctx .who{min-width:0;flex:1}
.ctx .who b{font-size:15px;font-weight:700;display:block}
.ctx .who span{font-size:13px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.ctx .chg{font-size:13px;font-weight:600;color:var(--brand);white-space:nowrap}
.momrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.momrow .auto{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:#475569;background:#F1F5F9;border-radius:999px;padding:1px 8px}
.hist{margin-top:8px;padding:9px 12px;border-radius:10px;background:#FFF4F4;border:1px solid #FECACA;font-size:13px;color:#7F1D1D;display:flex;gap:10px;align-items:flex-start}
.hist svg{width:16px;height:16px;color:#DC2626;margin-top:1px}
.hist b{font-weight:700}

/* ═════════ Notes ═════════ */
const NOTES={
 call:`<b>① Appel de confirmation.</b> <kbd>F</kbd> (ou le bouton du panneau) ouvre la fenêtre <b>liée</b> à la commande. Nouveau : <b>3 catégories</b> en cartes, avec leur mot d'explication — <b>Réclamation</b> (un souci à régler), <b>Objection</b> (pourquoi il hésite ou refuse), <b>Suggestion</b> (ce qu'il aimerait ou apprécie) — touches <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>. Le <b>sujet</b> est facultatif. Le <b>moment</b> s'affiche tout seul (« Appel de confirmation · auto », déduit du statut « En attente »). Flux clavier : <kbd>F</kbd> → <kbd>2</kbd> → ses mots → <kbd>Ctrl</kbd>+<kbd>Entrée</kbd>.`,
 callback:`<b>② Le client rappelle.</b> C'est votre seul canal entrant : le client rappelle le numéro de l'agent. L'agent n'a pas de commande ouverte → <kbd>F</kbd> → il tape le numéro affiché sur son téléphone → les commandes de ce client apparaissent <b>avec leur moment</b> (livrée → <b>Après livraison</b>, en livraison → <b>En route</b>, retournée → <b>À la porte</b>). Choisir la commande pose le moment automatiquement. C'est ainsi que « après livraison » arrive chez nous, sans prise de contact de notre part. Essayez : choisissez la commande #39340 (livrée).`,
 delivery:`<b>③ Livraison.</b> L'onglet Livraison des mêmes agents. Chaque colis montre déjà la <b>remarque réelle du livreur Darb</b>. Quand l'agent enregistre « <b>Veut annuler</b> », un bloc propose de garder le pourquoi (activé par défaut) : la remarque du livreur sert de contexte, la catégorie est <b>suggérée</b> (« معنديش فلوس » → Objection · Pas de cash), la <b>note de l'action devient ses mots</b>, le moment est posé (« En attente · en route », statut « En livraison »). Changez le résultat pour « Va recevoir » : le bloc disparaît. Les remarques du livreur elles-mêmes arrivent chez le <b>responsable</b> comme suggestions à confirmer.`,
 reject:`<b>④ Refus « Autre ».</b> Inchangé dans son principe (approuvé), avec les 3 catégories : « بطاقة » → <b>Objection · carte</b> suggérée, moment « Appel de confirmation ». Les motifs structurés ne créent rien.`,
 mine:`<b>Mes retours.</b> La feuille de l'agent, filtrable par <b>catégorie</b> et par <b>moment</b> — on voit d'un coup d'œil d'où viennent les retours : l'appel, la route, la porte, l'après-livraison. Le statut de ses réclamations est en lecture seule. Phrases réelles (notes « Autre » et remarques du livreur relayées).`
};

/* ═════════ Render ═════════ */
function render(){
  document.getElementById("note").innerHTML=NOTES[S.screen]||"";
  [["segLang","lang"],["segView","view"],["segScreen","screen"]].forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[k])));
  const stage=document.getElementById("stage");
  if(S.view==="mobile"){stage.innerHTML=mobile();}
  else{
    const active=S.screen==="mine"?4:S.screen==="delivery"?2:0;
    const body=S.screen==="mine"?screenMine():S.screen==="delivery"?screenDelivery():screenQueue();
    stage.innerHTML=`<div class="hscroll"><div class="app" dir="${AR()?"rtl":"ltr"}" lang="${S.lang}">${topbar(active)}${body}${S.screen==="reject"?rejectSheet():""}${S.cap?capture(false):""}${toast()}</div></div>`;
  }
  history.replaceState(null,"",location.pathname+"?"+new URLSearchParams({lang:S.lang,view:S.view,screen:S.screen}));
}
function focusEl(sel){const el=document.querySelector(sel);if(el){el.focus();const v=el.value||"";el.setSelectionRange&&el.setSelectionRange(v.length,v.length);}}
function keep(id){render();focusEl("#"+id);}
function openCap(){
  if(S.screen==="reject"||S.screen==="delivery") return;
  const has=!!ORDERS.find(x=>x.id===S.open)&&S.screen!=="mine";
  Object.assign(S,{cap:true,mode:has?"context":"blank",cat:null,topic:null,text:"",custQ:"",pickCust:null,pickOrder:null,focus:has?null:"cust"});
  render(); focusEl(has?".cat":"#custIn");
}
function flash(m){S.toast=m;render();clearTimeout(S.tt);S.tt=setTimeout(()=>{S.toast=null;render();},4500);}
function save(){
  if(!(S.cat&&S.text.trim())) return;
  let prod=null, st=null;
  const o=ORDERS.find(x=>x.id===S.open);
  if(S.mode==="context"&&o){prod=o.prod;st=o.st;} else if(S.pickOrder){const p=PAST.find(x=>x.ref===S.pickOrder);prod=p.prod;st=p.st;}
  const m=st?momentOf(st):"call";
  const e={id:"n"+Date.now(),d:"Aujourd'hui|اليوم",t:new Date().toTimeString().slice(0,5),cat:S.cat,topic:S.topic,prod,mom:m,text:S.text.trim(),st:S.cat==="reclamation"?"open":null,fresh:true};
  S.mine.forEach(x=>x.fresh=false); S.mine.unshift(e); S.cap=false;
  flash({msg:T().toast,cat:e.cat,mom:m,undo:e.id});
}

/* ═════════ Events ═════════ */
document.addEventListener("click",e=>{
  const g=e.target.closest.bind(e.target); let el;
  if((el=g("#segLang button,#segView button,#segScreen button"))){const k={segLang:"lang",segView:"view",segScreen:"screen"}[el.parentElement.id];S[k]=el.dataset.v;if(k==="screen")preset();return render();}
  if((el=g("[data-tab]"))){const i=+el.dataset.tab;S.screen=i===4?"mine":i===2?"delivery":"call";preset();if(i===0)S.cap=false;return render();}
  if(g("[data-opencap]")) return openCap();
  if(g("[data-closecap]")||e.target.matches("[data-veil]")){S.cap=false;return render();}
  if((el=g("[data-cat]"))){S.cat=S.cat===el.dataset.cat?null:el.dataset.cat;S.topic=null;render();return focusEl("#ta");}
  if((el=g("[data-topic]"))){S.topic=S.topic===el.dataset.topic?null:el.dataset.topic;render();return focusEl("#ta");}
  if(g("[data-tomode]")){S.mode="blank";S.focus="cust";render();return focusEl("#custIn");}
  if((el=g("[data-pickorder]"))){S.pickOrder=el.dataset.pickorder;S.focus=null;render();return focusEl(S.cat?"#ta":".cat");}
  if((el=g("[data-pickcust]"))){const c=+el.dataset.pickcust;const p=PAST.find(x=>x.cust===c);if(p){S.pickOrder=p.ref;}S.focus=null;render();return focusEl(".cat");}
  if(g("[data-unpick]")){S.pickOrder=null;S.focus="cust";render();return focusEl("#custIn");}
  if(g("[data-save]")) return save();
  if(g("[data-undo]")){S.mine=S.mine.filter(m=>m.id!==S.toast.undo);S.toast=null;return render();}
  if((el=g("[data-open]"))){S.open=el.dataset.open;return render();}
  if(g("[data-closepanel]")){S.open=null;return render();}
  if(g("[data-reject]")){S.screen="reject";preset();return render();}
  if(g("[data-closer]")){S.screen="call";preset();S.cap=false;return render();}
  if(g("[data-rsw]")){S.rOn=!S.rOn;return render();}
  if((el=g("[data-rcat]"))){S.rCat=el.dataset.rcat;S.rTopic=null;return render();}
  if((el=g("[data-rtopic]"))){S.rTopic=S.rTopic===el.dataset.rtopic?null:el.dataset.rtopic;return render();}
  if(g("[data-rgo]")){const on=S.rOn,c=S.rCat,tp=S.rTopic;S.screen="call";preset();S.cap=false;S.open=null;if(on)S.mine.unshift({id:"r"+Date.now(),d:"Aujourd'hui|اليوم",t:"10:50",cat:c,topic:tp,prod:"d",mom:"call",text:"قال اريد الدفع بالبطاقة",fresh:true});return flash({msg:on?T().rToast:T().rTitle,cat:on?c:null,mom:on?"call":null});}
  if((el=g("[data-dout]"))){S.dOutcome=el.dataset.dout;return render();}
  if(g("[data-dsw]")){S.dOn=!S.dOn;return render();}
  if((el=g("[data-dcat]"))){S.dCat=el.dataset.dcat;S.dTopic=null;return render();}
  if((el=g("[data-dtopic]"))){S.dTopic=S.dTopic===el.dataset.dtopic?null:el.dataset.dtopic;return render();}
  if(g("[data-dsave]")){const on=S.dOn&&S.dOutcome==="reached_wants_cancel";if(on)S.mine.unshift({id:"d"+Date.now(),d:"Aujourd'hui|اليوم",t:"11:02",cat:S.dCat,topic:S.dTopic,prod:"d",mom:"transit",text:S.dText,fresh:true});S.dOpen=false;return flash({msg:on?T().dToast:T().dToastOff,cat:on?S.dCat:null,mom:on?"transit":null});}
  if(g("[data-dclose]")||e.target.matches(".rveil[data-closed]")){S.dOpen=false;return render();}
  if((el=g("[data-mf]"))){S.mf=el.dataset.mf;return render();}
  if((el=g("[data-mm]"))){S.mm=S.mm===el.dataset.mm?"all":el.dataset.mm;return render();}
  if(S.cap&&S.mode==="blank"&&S.focus&&!g(".fld")){S.focus=null;render();}
});
document.addEventListener("focusin",e=>{if(e.target.id==="custIn"&&S.focus!=="cust"){S.focus="cust";keep("custIn");}});
document.addEventListener("input",e=>{
  if(e.target.id==="ta"){S.text=e.target.value;const c=document.querySelector(".cnt .num");if(c)c.textContent=T().chars(S.text.length);const b=document.querySelector("[data-save]");if(b)b.disabled=!(S.cat&&S.text.trim());}
  if(e.target.id==="custIn"){S.custQ=e.target.value;S.hot=0;keep("custIn");}
  if(e.target.id==="dta"){S.dText=e.target.value;}
  if(e.target.id==="mq"){S.mq=e.target.value;keep("mq");}
});
const editable=el=>el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA");
document.addEventListener("keydown",e=>{
  if(S.view==="mobile") return;
  if(S.cap){
    if(e.key==="Escape"){e.preventDefault();S.cap=false;return render();}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();return save();}
    if(e.target.id==="custIn"){const opts=[...document.querySelectorAll(".sugg button")];
      if(e.key==="ArrowDown"){e.preventDefault();S.hot=Math.min(S.hot+1,opts.length-1);return keep("custIn");}
      if(e.key==="ArrowUp"){e.preventDefault();S.hot=Math.max(S.hot-1,0);return keep("custIn");}
      if(e.key==="Enter"&&opts[S.hot]){e.preventDefault();return opts[S.hot].click();}}
    if(!editable(e.target)&&/^Digit[1-3]$/.test(e.code)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();const k=CATS[+e.code.slice(5)-1].k;S.cat=S.cat===k?null:k;S.topic=null;render();return focusEl("#ta");}
    return;
  }
  if(editable(e.target)) return;
  if(e.code==="KeyF"&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey){e.preventDefault();return openCap();}
  if(e.key==="/"&&S.screen==="mine"){e.preventDefault();focusEl("#mq");}
});
preset(); render();
if(S.cap&&S.view==="desktop") focusEl(S.mode==="blank"?"#custIn":".cat");
</script>
</body>
</html>
