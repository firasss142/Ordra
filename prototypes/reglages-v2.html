<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ordra — Réglages (v2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v2 — RÉGLAGES : la refonte complète de Système (Marchés · Connexions · Paramètres · Journaux).
  v2 (2026-10-02, retour du propriétaire sur v1) : Marchés devient une simple liste — plus de « À vérifier »,
  plus de compteurs d'attention dans le menu. Le reste est identique à v1.
  Construit 2026-10-02. Plan : plans/reglages-redesign.md (Phase 0 — rien dans src/ avant validation).
  Console claire de docs/design-system.md, barre latérale sombre, atomes de whatsapp-manager-v1.html.

  Une seule page « Réglages » avec un menu de sujets, rangés dans l'ordre du trajet d'une commande :
  Marchés → Boutiques → Commandes → Motifs de rejet → Équipe → Entrepôts → Livraison → WhatsApp → Publicité.
  Pas d'onglets dans Réglages. Journaux reste à part (super_admin).

  Données : lues en production le 2026-10-02 — marchés, boutiques et leurs commandes sur 30 jours,
  transporteurs (frais, colis livrés), sites, motifs de rejet et leur usage, agents, commissions,
  compte Meta, valeurs des réglages, historique des réglages. Ce qui est illustratif est dit dans
  la note de chaque écran.

  URL : ?lang=fr|ar &role=super_admin|manager &screen=markets|shops|orders|rejections|team|warehouses|delivery|whatsapp|ads|logs
        &scope=ly|tn|all &dirty=1 &drawer=<id> &algo=percentage &wa=on &pending=1 &tab=received|carrier|sync|audit
-->
<style>
:root{
  --page:#F6F6F7; --card:#FFFFFF; --hover:#F7F7F7; --sunken:#FAFAFB; --selected:#F2F2F2;
  --text:#1A1A1A; --text2:#6D7175; --text3:#8C9196;
  --line:#ECEEF0; --border:#E1E3E5; --input:#D2D5D9; --border-strong:#C9CCCF;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4; --brand-line:#BBF7D0;
  --sb:#0E1013; --sb-el:#161A20; --sb-text:#E6E8EB; --sb-text2:#B5BAC2; --sb-muted:#7F858F; --sb-active:#10B981;
  --action:#2C6ECB; --action-bg:#EAF1FB; --success:#008060; --success-bg:#F1F8F5; --warning:#B98900; --warning-bg:#FFF8E6; --warning-line:#F0DCA4;
  --critical:#D72C0D; --critical-bg:#FFF4F4; --neutral:#6D7175; --neutral-bg:#F1F2F3;
  --studio:#E9EBEE;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Geeza Pro",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--studio);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ── studio (always LTR) ───────────────────────────────── */
.studio{padding:16px 20px 40px;direction:ltr}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;max-width:1440px;margin:0 auto 10px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:#6B7280;font-weight:500}
.bar .grp{display:flex;align-items:center;gap:6px;font-size:12px;color:#6B7280}
.seg{display:inline-flex;flex-wrap:wrap;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:#6B7280;border:0;background:none}
.seg button[aria-pressed=true]{background:#111;color:#fff}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.bar select{padding:6px 8px;border-radius:8px;border:1px solid #E5E7EB;background:#fff;font-size:12.5px}
.note{max-width:1440px;margin:0 auto 12px;font-size:12.5px;color:#4B5563;line-height:1.6;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:10px 14px}
.note b{color:#111827}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#F3F4F6;padding:1px 4px;border-radius:4px}
.note ul{margin:4px 0 0;padding-inline-start:18px}
.stagewrap{max-width:1440px;margin:0 auto;overflow-x:auto}

/* ── frame ──────────────────────────────────────────────── */
.frame{width:1440px;height:980px;border:1px solid #C9CDD3;border-radius:12px;overflow:hidden;background:var(--page);display:flex;text-align:start;position:relative}
.sb{width:232px;flex:0 0 auto;background:var(--sb);color:var(--sb-text);padding:14px 12px;display:flex;flex-direction:column;gap:1px;font-size:13.5px;overflow-y:auto;scrollbar-width:none}
.sb .logo{font-weight:700;padding:4px 10px 12px;color:#fff;font-size:17px;letter-spacing:-.01em}
.sb .mk{margin:0 2px 12px;padding:8px 10px;border-radius:8px;background:var(--sb-el);color:var(--sb-text2);font-size:12.5px;display:flex;align-items:center;gap:8px;border:0;width:calc(100% - 4px);text-align:start}
.sb .mk b{color:#fff;font-weight:600}
.sb .mk svg{margin-inline-start:auto;width:14px;height:14px}
.sb .sh{display:flex;align-items:center;gap:9px;padding:8px 10px;color:var(--sb-text2);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:7px}
[dir=rtl] .sb .sh{letter-spacing:0;font-size:13px}
.sb .sh svg{width:15px;height:15px;color:var(--sb-muted)}
.sb .sh .chev{margin-inline-start:auto;width:14px;height:14px}
.sb .sh .adm{margin-inline-start:auto;font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#232830;color:var(--sb-text2)}
.sb .sh .adm + .chev{margin-inline-start:6px}
.sb .si{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 30px;border-radius:7px;color:var(--sb-text);text-decoration:none;cursor:pointer;font-size:13.5px}
[dir=rtl] .sb .si{padding:7px 30px 7px 10px}
.sb .si svg{width:15px;height:15px;color:var(--sb-muted)}
.sb .si:hover{background:#171B21}
.sb .si[aria-current=page]{background:#1B2027;color:#fff;font-weight:600}
.sb .si[aria-current=page] svg{color:var(--sb-active)}
.sb .me{margin-top:auto;padding:10px;border-radius:8px;background:var(--sb-el);display:flex;gap:10px;align-items:center;font-size:12.5px}
.sb .me .av{width:28px;height:28px;border-radius:50%;background:#2A3038;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff}
.sb .me small{display:block;color:var(--sb-muted);font-size:11.5px}

.main{flex:1 1 auto;min-width:0;position:relative;display:flex;flex-direction:column}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 48px}

/* ── Réglages layout ─────────────────────────────────────── */
.rg{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;align-items:start}
.menu{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.menu h1{font-size:20px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.mkctl{margin:0 0 16px}
.mkctl .l{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500}
.mkctl .fixed{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:600}
.code{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 5px;border-radius:5px;background:var(--neutral-bg);color:var(--text2);font-size:10.5px;font-weight:700;letter-spacing:.04em}
.track{display:flex;padding:3px;border-radius:9px;background:#E9EAEC;gap:2px}
.track button{flex:1;border:0;background:none;padding:6px 8px;border-radius:7px;font-weight:500;color:var(--text2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.track button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.track button[aria-pressed=true] .code{background:var(--brand-bg);color:var(--brand)}
.mkctl .hint{font-size:12px;color:var(--warning);margin-top:6px}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);font-weight:500;border:1px solid transparent;cursor:pointer;background:none;width:100%;text-align:start}
.mi svg{color:var(--text2)}
.mi:hover{background:#EDEEF0}
.mi[aria-current=page]{background:#fff;border-color:var(--line);font-weight:600}
.mi[aria-current=page] svg{color:var(--brand)}
.mi .cnt{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.mi .cnt[data-t=warn]{background:var(--warning-bg);color:var(--warning)}
.mi .cnt[data-t=info]{background:var(--neutral-bg);color:var(--text2)}
.menu .sep{height:1px;background:var(--border);margin:10px 4px}
.menu .foot{font-size:12px;color:var(--text2);padding:0 10px;line-height:1.5}

.th{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.th .crumb{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:4px}
.th .crumb svg{width:13px;height:13px}
.th h2{font-size:20px;font-weight:600;margin:2px 0 4px;letter-spacing:-.01em}
.th p{margin:0;color:var(--text2);font-size:14px;max-width:64ch}
.mchip{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto}
[dir=rtl] .mchip{padding:5px 6px 5px 11px}

/* ── cards & rows ────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.ch{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.ch p{margin:3px 0 0;font-size:13px;color:var(--text2);max-width:72ch}
.ch .end{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
.lockline{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);white-space:nowrap}
.lockline svg{width:14px;height:14px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:4px 20px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
.sr:last-child{border-bottom:0}
.sr .lb{font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.sr[data-dirty] .lb::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--warning)}
.sr .hp{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.5;max-width:60ch}
.sr .ctl{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-height:36px}
.sr.stack{grid-template-columns:minmax(0,1fr) 32px}
.sr.stack .full{grid-column:1 / -1;margin-top:10px}
.hb{width:32px;height:32px;border-radius:6px;border:0;background:none;color:#A0A5AA;display:grid;place-items:center;margin-top:2px}
.hb:hover,.hb[aria-expanded=true]{background:var(--selected);color:var(--text)}
.nin{display:inline-flex;align-items:stretch;border:1px solid var(--input);border-radius:6px;height:36px;background:#fff;overflow:hidden}
.nin input{width:76px;border:0;padding:0 10px;text-align:end;font-variant-numeric:tabular-nums;outline:0;background:none;direction:ltr}
.nin input::-webkit-inner-spin-button{opacity:.4}
.nin span{padding:0 10px;color:var(--text2);font-size:13px;border-inline-start:1px solid var(--line);background:var(--sunken);display:flex;align-items:center;white-space:nowrap}
.nin span.pre{border-inline-start:0;border-inline-end:1px solid var(--line)}
.nin:focus-within{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.sr[data-dirty] > .ctl .nin{border-color:var(--warning)}
.rov{font-weight:600;font-size:14px;white-space:nowrap}
.rov small{font-weight:400;color:var(--text2);font-size:13px}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.slot{display:inline-flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 8px;border:1px solid var(--input);border-radius:6px;background:#fff}
[dir=rtl] .slot{padding:0 8px 0 4px}
.slot input{border:0;width:52px;text-align:center;outline:0;background:none;direction:ltr;font-variant-numeric:tabular-nums}
.slot button{border:0;background:none;color:var(--text2);width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.slot button:hover{background:var(--selected)}
.slot button svg{width:14px;height:14px}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--input);border-radius:8px;background:#fff;text-align:start}
.opt b{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.opt b i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);flex:0 0 auto;display:grid;place-items:center}
.opt span{font-size:12.5px;color:var(--text2);line-height:1.4}
.opt[aria-pressed=true]{border:1.5px solid var(--brand);background:var(--brand-tint);padding:10.5px 11.5px}
.opt[aria-pressed=true] b i{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.opt:disabled{cursor:default}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--input);background:#fff;font-weight:500;font-size:13.5px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn[data-primary]{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.btn[data-primary]:hover{background:var(--brand-hover)}
.btn[data-danger]{color:var(--critical);border-color:#F2C1B8}
.btn[data-quiet]{border-color:transparent;background:transparent;color:var(--text2)}
.btn[data-quiet]:hover{background:var(--selected);color:var(--text)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn svg{width:15px;height:15px}
.ib{width:32px;height:32px;border-radius:7px;border:0;background:none;color:var(--text2);display:inline-grid;place-items:center}
.ib:hover{background:var(--selected);color:var(--text)}
.link{border:0;background:none;padding:0;color:var(--action);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link svg{width:14px;height:14px}

/* switch */
.sw{display:inline-flex;align-items:center;border:0;background:none;padding:2px;border-radius:999px}
.sw i{width:36px;height:20px;border-radius:999px;background:#C9CDD2;position:relative;transition:background .15s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] i{background:var(--brand)}
.sw[aria-checked=true] i::after{transform:translateX(16px)}
[dir=rtl] .sw[aria-checked=true] i::after{transform:translateX(-16px)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.badge[data-s=neutral]{background:var(--neutral-bg);color:var(--neutral)}
.badge[data-s=warn]{background:var(--warning-bg);color:var(--warning)}
.badge[data-s=info]{background:var(--action-bg);color:var(--action)}
.badge[data-s=ok]{background:var(--success-bg);color:var(--success)}
.badge[data-s=bad]{background:var(--critical-bg);color:var(--critical)}
.badge[data-s=plain]{background:#fff;border:1px solid var(--border);color:var(--text2);font-weight:500}
.rj{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--critical-bg);color:var(--critical);font-size:12px;font-weight:600;white-space:nowrap}
[dir=rtl] .rj{padding:2px 7px 2px 9px}
.rj svg{width:13px;height:13px}

/* tables */
table.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);text-align:start;padding:9px 16px;background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap}
[dir=rtl] .t th{letter-spacing:0;text-transform:none;font-size:12.5px}
.t td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr[data-a]{cursor:pointer}
.t tbody tr[data-a]:hover td{background:var(--hover)}
.t .sub{font-size:12.5px;color:var(--text2)}
.t .end{text-align:end}
.t td.w0{width:1%;white-space:nowrap}
.t tr[data-off] td:not(:last-child){color:var(--text2)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm b{font-weight:600;display:block}
.pf{width:30px;height:30px;border-radius:7px;background:var(--neutral-bg);border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--text2);flex:0 0 auto;letter-spacing:.02em}
.grip{color:#B5BAC0;cursor:grab;display:grid;place-items:center}
.pills{display:inline-flex;padding:3px;border-radius:9px;background:#EEEFF1;gap:2px}
.pills button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.pills button b{font-size:11.5px;font-weight:600;color:var(--text3)}
.pills button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.pills button[aria-pressed=true] b{color:var(--text2)}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cfoot{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2);display:flex;gap:8px;align-items:center;background:var(--sunken);border-radius:0 0 10px 10px}
.cfoot svg{width:14px;height:14px}

/* notice, empty, kv */
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.5;background:#fff;border:1px solid var(--line);color:var(--text)}
.notice svg{margin-top:1px;color:var(--text2)}
.notice[data-t=warn]{background:var(--warning-bg);border-color:var(--warning-line);color:#6B5000}
.notice[data-t=warn] svg{color:var(--warning)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 20px}
.empty .ei{width:40px;height:40px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;color:var(--text2);margin-bottom:4px}
.empty .ei[data-t=ok]{background:var(--success-bg);color:var(--success)}
.empty b{font-size:14.5px;font-weight:600}
.empty p{margin:0;color:var(--text2);font-size:13px;max-width:56ch}
.empty .acts{display:flex;gap:8px;margin-top:8px}
dl.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--text2)}
dl.kv dd{margin:0;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.miss{display:inline-flex;align-items:center;gap:5px;color:var(--warning);font-weight:600}
.miss svg{width:14px;height:14px}
.sub-h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);margin:0 0 10px}
[dir=rtl] .sub-h{letter-spacing:0;text-transform:none;font-size:13px}

/* markets */
.mlist td{padding:16px}
.mlist .tile{width:36px;height:36px;border-radius:9px;background:var(--neutral-bg);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--text);flex:0 0 auto}
.mlist .nm b{font-size:15px;font-weight:600}
.mlist .go{color:var(--text3);display:grid;place-items:center}
.mlist tbody tr:hover .go{color:var(--text)}

/* matching */
.mt{display:grid;grid-template-columns:1fr 1fr}
.mt > div{min-width:0}
.mt > div + div{border-inline-start:1px solid var(--line)}
.mt h4{margin:0;padding:12px 16px 4px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.mrow b{font-weight:600;display:block}
.mrow small{color:var(--text2);font-size:12.5px}

/* shares */
.shares{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shr{display:grid;grid-template-columns:minmax(0,1fr) 120px 220px;gap:16px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.shr:last-child{border-bottom:0}
.shr .sbar{height:8px;border-radius:999px;background:var(--neutral-bg);overflow:hidden}
.shr .sbar i{display:block;height:100%;background:#9CA3AF;border-radius:999px}
.shr.tot{background:var(--sunken);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--neutral-bg);display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text2);flex:0 0 auto}

/* save bar */
.savebar{position:sticky;top:12px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;margin-bottom:16px;background:#fff;border:1px solid var(--warning-line);border-radius:10px;box-shadow:0 0 0 4px var(--page)}
[dir=rtl] .savebar{padding:8px 16px 8px 8px}
.savebar .msg{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.savebar .msg i{width:8px;height:8px;border-radius:50%;background:var(--warning)}
.savebar .sp{flex:1}

/* history popover */
.pop{position:absolute;top:50px;inset-inline-end:16px;width:340px;background:#fff;border:1px solid var(--border);border-radius:10px;z-index:30;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.pop h5{margin:0;padding:10px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pop h5 button{margin-inline-start:auto}
.pop ol{list-style:none;margin:0;padding:4px 0}
.pop li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 12px;font-size:13px}
.pop li + li{border-top:1px solid var(--line)}
.pop li small{grid-column:1 / -1;color:var(--text2);font-size:12px}
.pop .chg{font-weight:600;white-space:nowrap}
.pop .chg s{color:var(--text3);font-weight:400;text-decoration:none}
.pop .none{padding:12px;color:var(--text2);font-size:13px}

/* drawer */
.dw{position:absolute;inset:0;background:rgba(17,24,39,.28);z-index:50;display:flex;justify-content:flex-end}
.dp{width:500px;height:100%;background:#fff;border-inline-start:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(15,23,42,.10)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:17px;font-weight:600}
.dh p{margin:2px 0 0;font-size:13px;color:var(--text2)}
.dh .x{margin-inline-start:auto;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:#fff;flex:0 0 auto}
.db{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.ds{padding:16px 20px;border-bottom:1px solid var(--line)}
.ds:last-child{border-bottom:0}
.ds h4{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ds h4 .end{margin-inline-start:auto}
.df{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--sunken);align-items:center}
.df .sp{flex:1}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f label,.f .fl{font-size:13px;font-weight:500}
.f .in{height:38px;border:1px solid var(--input);border-radius:7px;padding:0 11px;background:#fff;width:100%}
.f .in:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
.f .in[readonly]{background:var(--sunken);color:var(--text2)}
.f .hp{font-size:12.5px;color:var(--text2);line-height:1.45}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cpy{display:flex;align-items:center;gap:6px;height:38px;border:1px solid var(--input);border-radius:7px;padding:0 4px 0 11px;background:var(--sunken)}
[dir=rtl] .cpy{padding:0 11px 0 4px}
.cpy .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.swrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}
.swrow b{font-weight:500;display:block}
.swrow small{color:var(--text2);font-size:12.5px}
.optt td{padding:9px 10px;font-size:13.5px}
.optt th{padding:8px 10px}
.check{width:18px;height:18px;accent-color:var(--brand)}
.result{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--success);margin-top:10px}
.result svg{width:15px;height:15px}
.typec{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* modal + toast */
.modal{position:absolute;inset:0;background:rgba(17,24,39,.36);z-index:60;display:grid;place-items:center}
.modal .mb{width:420px;background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:0 16px 40px rgba(15,23,42,.18)}
.modal .mb h3{margin:0;padding:16px 20px 6px;font-size:16px}
.modal .mb p{margin:0;padding:0 20px 16px;color:var(--text2);font-size:13.5px}
.modal .mb .df{border-radius:0 0 12px 12px;justify-content:flex-end}
.toast{position:absolute;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#1A1A1A;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:70;display:flex;gap:8px;align-items:center}
.toast svg{width:15px;height:15px;color:#6EE7B7}

/* logs */
.lh{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.lh h1{font-size:20px;font-weight:600;margin:0 0 4px}
.lh p{margin:0;color:var(--text2);max-width:76ch}
.ltabs{display:inline-flex;padding:3px;border-radius:10px;background:#E9EAEC;gap:2px;margin-bottom:14px}
.ltabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);display:inline-flex;align-items:center;gap:8px}
.ltabs button b{font-size:11.5px;font-weight:600;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.05);color:var(--text2)}
.ltabs button b[data-t=bad]{background:var(--critical-bg);color:var(--critical)}
.ltabs button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.lsearch{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--input);border-radius:8px;padding:0 10px;background:#fff;flex:1;max-width:360px}
.lsearch input{border:0;outline:0;flex:1;background:none}
.lsearch svg{color:var(--text2)}
.sel{height:36px;border:1px solid var(--input);border-radius:8px;padding:0 10px;background:#fff;font-size:13.5px}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--input);background:#fff;font-size:13px;font-weight:500;color:var(--text2)}
.chip[aria-pressed=true]{background:var(--critical-bg);border-color:#F5C6BC;color:var(--critical);font-weight:600}
.json{margin:0;padding:12px 14px;border-radius:8px;background:var(--sunken);border:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;white-space:pre;overflow:auto;direction:ltr;text-align:left;color:#374151}
.json .k{color:#1D4ED8}.json .s{color:#047857}.json .n{color:#B45309}
.arrow{color:var(--text3);margin:0 4px}
</style>
</head>

  commission_amount:{area:'commissions', step:0.5, u:'CUR', l:['Montant par commande livrée','المبلغ لكل طلب مسلَّم'],
    h:()=>{const f = V[curMk()].commission_from; return f ? T(`En vigueur depuis le ${dt(f,true)}. Un nouveau montant s’applique à partir de la date choisie ; ce qui est déjà gagné ne change pas.`, `ساري منذ ${dt(f,true)}. يُطبَّق المبلغ الجديد ابتداءً من التاريخ المختار؛ ما تم كسبه لا يتغير.`) : '';}},
};
const val = k => (k in S.edits) ? S.edits[k] : V[curMk()][k];
const unitOf = f => f.u === 'CUR' ? cur() : T(f.u[0], f.u[1]);

const card = ({title, desc='', end='', body='', foot=''}) =>
  `<section class="card"><header class="ch"><div><h3>${title}</h3>${desc?`<p>${desc}</p>`:''}</div>${end?`<div class="end">${end}</div>`:''}</header>${body}${foot?`<div class="cfoot">${foot}</div>`:''}</section>`;
const lockLine = () => `<span class="lockline">${ic('lock')}${T('Modifiable par un administrateur','يعدّله المسؤول فقط')}</span>`;
const sw = (on, a, label, disabled) => disabled
  ? `<span class="badge" data-s="${on?'ok':'neutral'}"><i></i>${on?T('Actif','مفعّل'):T('Désactivé','معطّل')}</span>`
  : `<button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(label)}" data-a="${a}"><i></i></button>`;
const histBtn = k => `<button class="hb" data-a="hist:${k}" aria-expanded="${S.hist===k}" title="${T('Historique des modifications','سجل التعديلات')}" aria-label="${T('Historique des modifications','سجل التعديلات')}">${ic('history')}</button>`;
function histPop(k, label){
  const rows = (HIST[curMk()]||{})[k] || [];
  const v = x => Array.isArray(x) ? T(x[0], x[1]) : x;
  return `<div class="pop" role="dialog"><h5>${ic('history')}${esc(label)}<button class="ib" data-a="hist:">${ic('x')}</button></h5>${rows.length ? `<ol>${rows.map(r=>`<li><span>${esc(r[1])}</span><span class="chg"><s>${v(r[2])}</s><span class="arrow">→</span>${v(r[3])}</span><small>${dt(r[0],true)}</small></li>`).join('')}</ol>` : `<div class="none">${T('Aucune modification enregistrée : c’est la valeur d’origine.','لا توجد تعديلات مسجلة: هذه هي القيمة الأصلية.')}</div>`}</div>`;
}
function numRow(k){
  const f = F[k], v = val(k), ed = canEdit(f.area), label = T(f.l[0], f.l[1]);
  const ctl = ed
    ? `<label class="nin">${f.pre?`<span class="pre">${f.pre}</span>`:''}<input type="number" data-k="${k}" value="${v}" min="${f.min??0}" ${f.max?`max="${f.max}"`:''} step="${f.step||1}" aria-label="${esc(label)}"><span>${unitOf(f)}</span></label>`
    : `<span class="rov">${f.pre?`<small>${f.pre}</small> `:''}${v===''?'—':nn(v)} <small>${unitOf(f)}</small></span>`;
  return `<div class="sr" data-row="${k}" ${k in S.edits?'data-dirty':''}><div><div class="lb">${label}</div><div class="hp" data-help="${k}">${f.h(v)}</div></div><div class="ctl">${ctl}</div>${histBtn(k)}${S.hist===k?histPop(k,label):''}</div>`;
}
const pf = p => `<span class="pf" title="${PF[p][1]}">${PF[p][0]}</span>`;
const siteName = id => { for (const m in SITES) { const s = SITES[m].find(x=>x.id===id); if (s) return T(s.fr, s.ar); } return '—'; };
const empty = (icon, title, text, acts='', tone='') => `<div class="empty"><span class="ei" ${tone?`data-t="${tone}"`:''}>${ic(icon)}</span><b>${title}</b>${text?`<p>${text}</p>`:''}${acts?`<div class="acts">${acts}</div>`:''}</div>`;
const initials = s => s.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

function shopState(s){
  if (!s.active) return ['neutral', T('Désactivée','معطّل')];
  if (!s.last) return ['neutral', T('Jamais reçu de commande','لم يستلم أي طلب')];
  const d = daysSince(s.last);
  if (d > 14) return ['warn', T(`Silencieuse depuis ${d} j`,`صامت منذ ${d} يوماً`)];
  return ['ok', T('Reçoit des commandes','يستقبل الطلبات')];
}
PAGES.shops = () => {
  const m = curMk(), all = SHOPS[m], ed = isSA();
  const groups = { all, ok: all.filter(s=>shopState(s)[0]==='ok'), quiet: all.filter(s=>s.active && shopState(s)[0]!=='ok'), off: all.filter(s=>!s.active) };
  const list = groups[S.shopFilter] || all;
  const pills = [['all',T('Toutes','الكل')],['ok',T('Reçoivent','تستقبل')],['quiet',T('Silencieuses','صامتة')],['off',T('Désactivées','معطّلة')]]
    .map(([k,l])=>`<button aria-pressed="${S.shopFilter===k}" data-a="pill:${k}">${l}<b class="num">${groups[k].length}</b></button>`).join('');
  const rows = list.map(s=>{ const [st, lbl] = shopState(s); return `<tr data-a="drawer:shop:${s.id}" ${s.active?'':'data-off'}>
      <td><div class="nm">${pf(s.pf)}<div><b>${esc(s.name)}</b><span class="sub">${PF[s.pf][1]}</span></div></div></td>
      <td class="end">${nn(s.o30)}</td><td>${s.last?dt(s.last, daysSince(s.last)>200):'—'}</td>
      <td><span class="badge" data-s="${st}"><i></i>${lbl}</span></td>
      ${ed?`<td class="w0 end">${sw(s.active, `tg:shop:${s.id}`, s.name, false)}</td>`:''}</tr>`; }).join('');
  const shopsCard = card({ title:T('Boutiques','المتاجر'),
    desc:T('Chaque boutique envoie ses commandes à Ordra. Une boutique silencieuse est active, mais n’a rien envoyé depuis plus de 14 jours.','يرسل كل متجر طلباته إلى أوردرا. المتجر الصامت مفعّل لكنه لم يرسل شيئاً منذ أكثر من 14 يوماً.'),
    end: ed ? `<button class="btn" data-primary data-a="drawer:addShop">${ic('plus')}${T('Ajouter une boutique','إضافة متجر')}</button>` : lockLine(),
    body:`<div class="toolbar"><div class="pills" role="group">${pills}</div></div><table class="t"><thead><tr><th>${T('Boutique','المتجر')}</th><th class="end">${T('Commandes · 30 j','الطلبات · 30 يوماً')}</th><th>${T('Dernière commande','آخر طلب')}</th><th>${T('État','الحالة')}</th>${ed?`<th class="end">${T('Active','مفعّل')}</th>`:''}</tr></thead><tbody>${rows || `<tr><td colspan="5">${empty('bag', T('Aucune boutique ici','لا متاجر هنا'), '')}</td></tr>`}</tbody></table>`});
  const P = S.pending ? [['Crème Biovera 50 ml','4471','Converty Libya (Sheets)',12],['Sérum Vit C — pack x2','4519','Converty Libya (Sheets)',5],['Huile de nigelle 100ml','88213','EasyOrdersLY - Quran',2]] : [];
  const C = S.pending ? [['Tarhuna','ترهونة',4],['Al Khums','الخمس',2]] : [];
  const okEmpty = (txt) => `<div class="mrow" style="grid-template-columns:auto 1fr"><span class="badge" data-s="ok">${ic('check')}${T('Tout est associé','كل شيء مربوط')}</span><small>${txt}</small></div>`;
  const matchCard = card({ title:T('Produits et villes à associer','منتجات ومدن يجب ربطها'),
    desc:T('Quand une boutique envoie un produit ou une ville qu’Ordra ne reconnaît pas, la commande attend ici avant d’être confirmée. Une fois associé, le nom est reconnu pour toutes les commandes suivantes.','عندما يرسل متجر منتجاً أو مدينة لا يعرفها أوردرا، ينتظر الطلب هنا قبل تأكيده. بعد الربط، يُعرَف الاسم في كل الطلبات التالية.'),
    body:`<div class="mt"><div><h4>${T('Produits','المنتجات')} <span class="badge" data-s="${P.length?'warn':'neutral'}">${nn(P.length)}</span></h4>${P.length ? P.map((p,i)=>`<div class="mrow"><div><b>${p[0]}</b><small>${p[2]} · ${T('réf.','مرجع')} <span class="num">${p[1]}</span> · ${T(`${p[3]} commandes en attente`,`${p[3]} طلبات معلقة`)}</small></div><button class="btn sm" data-a="drawer:match:${i}">${T('Associer','ربط')}</button></div>`).join('') : okEmpty(T('Aucune commande en attente d’un produit.','لا طلبات تنتظر منتجاً.'))}</div>
      <div><h4>${T('Villes','المدن')} <span class="badge" data-s="${C.length?'warn':'neutral'}">${nn(C.length)}</span></h4>${C.length ? C.map(c=>`<div class="mrow"><div><b>${T(c[0],c[1])}</b><small>${T(`${c[2]} commandes en attente`,`${c[2]} طلبات معلقة`)}</small></div><button class="btn sm" data-a="drawer:matchCity">${T('Associer','ربط')}</button></div>`).join('') : okEmpty(T('Aucune commande en attente d’une ville.','لا طلبات تنتظر مدينة.'))}</div></div>`});

    const rs = REASONS.filter(r=>r[0]===g.k), total = rs.reduce((a,r)=>a+r[ui],0);

PAGES.team = () => {

      <div class="shr tot"><span>${T('Total','المجموع')}</span><span class="num" style="text-align:end;padding-inline-end:12px">${total} %</span><span>${total===100?`<span class="badge" data-s="ok">${ic('check')}${T('Prêt','جاهز')}</span>`:`<span class="badge" data-s="warn"><i></i>${T(`Il manque ${100-total} %`,`ينقص ${100-total}٪`)}</span>`}</span></div></div>

  }
  const algoLbl = T('Méthode de distribution','طريقة التوزيع');
  const dist = card({ title:T('Distribution des commandes','توزيع الطلبات'), desc:T('Comment une commande en attente trouve son agent, à chaque distribution automatique.','كيف يجد الطلب المعلق موظفه عند كل توزيع تلقائي.'),
    body:`<div class="sr stack" data-row="assignment_algorithm" ${'assignment_algorithm' in S.edits?'data-dirty':''}><div><div class="lb">${algoLbl}</div><div class="hp">${T('Les commandes déjà affectées ne bougent pas quand vous changez de méthode.','الطلبات الموزعة مسبقاً لا تتغير عند تغيير الطريقة.')}</div></div>${histBtn('assignment_algorithm')}${S.hist==='assignment_algorithm'?histPop('assignment_algorithm',algoLbl):''}<div class="full">${opts}${shares}</div></div>`});
  const goals = card({ title:T('Objectifs','الأهداف'), desc:T('Les cibles affichées dans la salle de contrôle et sur la fiche de chaque agent.','الأهداف المعروضة في غرفة التحكم وفي بطاقة كل موظف.'),
    body: numRow('goal_daily_treated') + numRow('goal_min_rate') + numRow('goal_conf_per_hour') + numRow('goal_team_weekly_conf') });
  if (!isSA()) return dist + goals;
  const C = V[m];
  const agentRows = AGENTS[m].map(([a, amt, from, on])=>{ const diff = on && amt !== C.commission_amount;
    return `<tr><td><div class="nm"><span class="av">${initials(a)}</span><b style="font-weight:500">${a}</b></div></td><td>${on?`<span class="badge" data-s="ok"><i></i>${T('Payé','مدفوع')}</span>`:`<span class="badge" data-s="neutral"><i></i>${T('Non payé','غير مدفوع')}</span>`}</td>
      <td class="end">${on?`${nn(amt)} ${cur()}${diff?` <span class="badge" data-s="info">${T('montant propre','مبلغ خاص')}</span>`:''}`:'—'}</td><td>${from?dt(from):'—'}</td><td class="w0 end"><button class="btn sm" data-a="drawer:rate:${esc(a)}">${T('Modifier','تعديل')}</button></td></tr>`;}).join('');
  const comm = card({ title:T('Commissions','العمولات'), desc:T('Ce qu’un agent gagne pour chaque commande livrée qu’il a confirmée.','ما يكسبه الموظف عن كل طلب مسلَّم قام بتأكيده.'),
    end:`<span class="lockline">${ic('lock')}${T('Visible par l’administrateur seulement','يراه المسؤول فقط')}</span>`,
    body:`<div class="sr"><div><div class="lb">${T('Payer des commissions','دفع العمولات')}</div><div class="hp">${C.commission_enabled?T('Activé : chaque commande livrée crédite son agent.','مفعّل: كل طلب مسلَّم يُضاف إلى رصيد موظفه.'):T('Désactivé : aucune commande ne crédite d’agent.','معطّل: لا يُضاف أي طلب إلى رصيد أي موظف.')}</div></div><div class="ctl">${sw(C.commission_enabled,'toast:commission',T('Payer des commissions','دفع العمولات'))}</div><span></span></div>`
      + (C.commission_enabled ? numRow('commission_amount') : '')
      + `<table class="t"><thead><tr><th>${T('Agent','الموظف')}</th><th>${T('Commission','العمولة')}</th><th class="end">${T('Montant','المبلغ')}</th><th>${T('Depuis','منذ')}</th><th class="w0"></th></tr></thead><tbody>${agentRows}</tbody></table>`});

const closeFoot = () => `<span class="sp"></span><button class="btn" data-a="close">${T('Fermer','إغلاق')}</button>`;

const inp = (v, ph='', ro=false, mono=false) => `<input class="in ${mono?'mono':''}" value="${esc(v)}" placeholder="${esc(ph)}" ${ro?'readonly':''}>`;

  orders:`<b>Commandes</b> = ce qui reste d'Opérations après avoir retiré les 13 réglages qu'aucun code ne lit (affectation à l'arrivée, montants min/max, ville inconnue, heure limite, téléversement auto, colis sans nouvelle, retours, après la dernière tentative, fenêtre de rappel…). Chaque aide <b>reprend la valeur</b> (« Au 8<sup>e</sup> appel… ») et se met à jour pendant la saisie. Modifier un champ fait apparaître la barre d'enregistrement ; changer de sujet avec des modifications demande confirmation. L'horloge ouvre l'historique réel (Libye : 3 → 9 → 5 → 8). ⚠ En Tunisie, <code>sla_minutes</code> vaut 120 mais sa seule ligne d'historique dit 137 : l'historique a des trous.`,

  team:`<b>Équipe</b> = Affectation + Objectifs + Commissions. Retirés car sans effet : plafond par agent, inactivité, files orphelines, hors heures, heures ouvrées (qui en plus disait <code>Africa/Tunis</code> pour la Libye). « Round Robin » devient « Tour à tour ». <code>?algo=percentage</code> montre l'éditeur de parts (répartition illustrative : aucune part n'est enregistrée en prod). Commissions : montants réels de la Libye, visibles par l'administrateur seulement.`,

  logs:`<b>Journaux</b> (administrateur, toujours en français) : les quatre vues dans la piste douce à pastille blanche, un filtre marché qui n'existait pas, des mots clairs (« Commandes reçues » au lieu de Webhooks, « Modifications » au lieu d'Audit, « Relancer le traitement » au lieu de Rejouer), et les données reçues en clair (plus de bloc noir). L'onglet Modifications montre l'historique réel ; les trois autres sont illustratifs.`,
};
function studio(){

    ${seg('screen',SCREENS,S.screen,v=>S.role==='manager'&&['markets','ads','logs'].includes(v))}

  document.querySelectorAll('[data-s^="flag:"]').forEach(b=>{ const f = b.dataset.s.split(':')[1]; const on = f==='dirty'?Object.keys(S.edits).length>0 : f==='wa'?S.wa : f==='algo'?val2('assignment_algorithm')==='percentage' : S.pending; b.setAttribute('aria-pressed', on); });
  document.getElementById('note').innerHTML = (NOTES[S.screen]||'') + (S.role==='manager' ? `<br><b>Vue manager (manager.ly, en arabe dans la vraie vie)</b> : ni Marchés, ni Publicité, ni Journaux, ni Commissions. Les cartes en lecture seule montrent des valeurs (pas des champs grisés) et disent « Modifiable par un administrateur ».` : '') + (S.role!=='manager' && S.scope==='all' ? `<br><b>Portée « Tous »</b> : au lieu du chargement infini d'aujourd'hui, la page demande un marché. Le choix écrit la même portée que le sélecteur de la barre latérale (un seul état, deux endroits).` : '');
}
function val2(k){ const m = curMk() || 'ly'; return (k in S.edits) ? S.edits[k] : V[m][k]; }

function syncURL(){
  const p = new URLSearchParams();
  if (S.lang!=='fr') p.set('lang',S.lang); if (S.role!=='super_admin') p.set('role',S.role); p.set('screen',S.screen);
  if (S.scope!=='ly') p.set('scope',S.scope); if (S.drawer) p.set('drawer',S.drawer); if (S.wa) p.set('wa','on'); if (S.pending) p.set('pending','1');
  if (val2('assignment_algorithm')==='percentage' && S.edits.assignment_algorithm) p.set('algo','percentage'); if (S.screen==='logs' && S.tab!=='received') p.set('tab',S.tab);
  history.replaceState(null,'','?'+p.toString());
}
function render(){
  if (S.role==='manager' && ['markets','ads','logs'].includes(S.screen)) S.screen = 'shops';
  document.documentElement.lang = S.lang;
  const scroll = document.getElementById('scroll'); const top = scroll ? scroll.scrollTop : 0;
  studio();
  const stage = document.getElementById('stage');
  stage.setAttribute('dir', S.lang==='ar' ? 'rtl' : 'ltr');
  stage.innerHTML = frame();
  const ns = document.getElementById('scroll'); if (ns && keepScroll) ns.scrollTop = top; keepScroll = false;
  const sel = document.getElementById('drsel'); if (sel) sel.onchange = e => { S.drawer = e.target.value; S.tested = false; render(); };
  syncURL();
}
let keepScroll = false, toastTimer;
function toast(msg){ S.toast = msg; keepScroll = true; render(); clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=''; keepScroll = true; render(); }, 1800); }
function goTopic(t){ S.screen = t; S.drawer = ''; S.hist = ''; S.shopFilter = 'all'; S.tested = false; render(); const s = document.getElementById('scroll'); if (s) s.scrollTop = 0; }

/* ═════════════ events ═════════════ */
document.addEventListener('click', e => {
  const sb = e.target.closest('#bar [data-s]');
  if (sb) {
    const [k, v] = sb.dataset.s.split(':');
    if (k==='flag') {
      if (v==='dirty') S.edits = Object.keys(S.edits).length ? {} : {...(DIRTY_PRESET[S.screen] || {max_call_attempts:6})};
      if (v==='wa') S.wa = !S.wa;
      if (v==='pending') S.pending = !S.pending;
      if (v==='algo') { if (S.edits.assignment_algorithm==='percentage') delete S.edits.assignment_algorithm; else S.edits.assignment_algorithm = 'percentage'; }
    } else if (k==='screen') { S.edits = {}; S.screen = v; S.drawer=''; S.hist=''; }
    else S[k] = v;
    if (k==='lang' || k==='role' || k==='scope') S.hist = '';
    render(); return;
  }
  const el = e.target.closest('[data-a]');
  if (!el || !document.getElementById('stage').contains(el)) return;
  if (el.classList.contains('dw') && e.target.closest('[data-stop]')) return;
  const a = el.dataset.a, [cmd, ...rest] = a.split(':'), arg = rest.join(':');
  if (cmd==='go') { if (Object.keys(S.edits).length && arg!==S.screen) { S.leave = arg; keepScroll = true; render(); } else goTopic(arg); return; }
  if (cmd==='gomk') { const [mk, t] = arg.split(':'); S.scope = mk; goTopic(t); return; }
  if (cmd==='leave') { if (arg==='go') { const t = S.leave; S.edits = {}; S.leave=''; goTopic(t); } else { S.leave=''; keepScroll = true; render(); } return; }
  if (cmd==='mk') { S.scope = arg; S.edits = {}; S.hist=''; keepScroll = true; render(); return; }
  if (cmd==='cyclescope') { S.scope = {ly:'tn', tn:'all', all:'ly'}[S.scope]; S.edits = {}; render(); return; }
  if (cmd==='drawer') { S.drawer = arg; S.tested = false; keepScroll = true; render(); return; }
  if (cmd==='close') { S.drawer = ''; keepScroll = true; render(); return; }
  if (cmd==='dsave') { S.drawer = ''; toast(T('Enregistré','تم الحفظ')); return; }
  if (cmd==='testok') { S.tested = true; keepScroll = true; render(); return; }
  if (cmd==='hist') { S.hist = (arg && S.hist !== arg) ? arg : ''; keepScroll = true; render(); return; }
  if (cmd==='save') { const m = curMk(); Object.entries(S.edits).forEach(([k,v])=>{ if (k!=='shares') V[m][k] = v; }); S.edits = {}; toast(T('Réglages enregistrés','تم حفظ الإعدادات')); return; }
  if (cmd==='cancel') { S.edits = {}; keepScroll = true; render(); return; }
  if (cmd==='pill') { S.shopFilter = arg; keepScroll = true; render(); return; }
  if (cmd==='algo') { const m = curMk(); if (arg === V[m].assignment_algorithm) delete S.edits.assignment_algorithm; else S.edits.assignment_algorithm = arg; keepScroll = true; render(); return; }
  if (cmd==='slotdel') { const v = [...val('attempt_retry_times')]; v.splice(Number(arg),1); S.edits.attempt_retry_times = v; keepScroll = true; render(); return; }
  if (cmd==='slotadd') { S.edits.attempt_retry_times = [...val('attempt_retry_times'), '20:00']; keepScroll = true; render(); return; }
  if (cmd==='tab') { S.tab = arg; render(); return; }
  if (cmd==='errs') { S.errorsOnly = !S.errorsOnly; keepScroll = true; render(); return; }
  if (cmd==='tg') {
    e.stopPropagation();
    const [kind, id] = arg.split(':'), m = curMk();
    const list = kind==='shop' ? SHOPS[m] : kind==='carrier' ? CARRIERS[m] : SITES[m];
    const it = list.find(x=>x.id===id); it.active = !it.active;
    const name = it.name || T(it.fr, it.ar);
    toast(it.active ? T(`${name} activé`,`تم تفعيل ${name}`) : T(`${name} désactivé`,`تم تعطيل ${name}`)); return;
  }
  if (cmd==='toast') { toast(T('Action de démonstration','إجراء تجريبي')); return; }
});
document.addEventListener('input', e => {

    if (String(v) === String(V[m][k])) delete S.edits[k]; else S.edits[k] = v;
    const row = t.closest('.sr'); if (row) row.toggleAttribute('data-dirty', k in S.edits);
    const h = document.querySelector(`[data-help="${k}"]`); if (h && F[k].h) h.innerHTML = F[k].h(v === '' ? 0 : v);
    updateSaveBar();
  }
  if (t.dataset.share !== undefined) { S.edits.shares = {...(S.edits.shares||{}), [t.dataset.share]: Number(t.value||0)}; S.edits.assignment_algorithm = S.edits.assignment_algorithm || 'percentage'; keepScroll = true; const pos = t.selectionStart; const name = t.dataset.share; render(); const again = document.querySelector(`[data-share="${CSS.escape(name)}"]`); if (again) again.focus(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.slot !== undefined) { const v = [...val('attempt_retry_times')]; v[Number(t.dataset.slot)] = t.value; S.edits.attempt_retry_times = v; keepScroll = true; render(); }
});
function updateSaveBar(){
  const c = Object.keys(S.edits).length, bar = document.getElementById('savebar');
  if (!bar) return; bar.hidden = !c; const sc = document.getElementById('savecount'); if (sc) sc.textContent = countTxt(c);
  document.querySelectorAll('[data-s="flag:dirty"]').forEach(b=>b.setAttribute('aria-pressed', c>0));
}
render();
</script>
</body>
