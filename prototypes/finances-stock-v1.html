<!doctype html>
<!--
  Finances › Stock & inventaire — prototype v1 (2026-10-04). Part of the full Finances rebuild in « Aurore »
  (plans/finances-redesign.md). KIT CSS, icon sprite and KIT script copied verbatim from finances-pnl-v1.html.

  Owner's answers (binding):
  - the page answers: HOW MUCH MONEY IS ASLEEP IN STOCK, AND WHAT SHOULD I REBUY;
  - value shown AS IF RIGHT (no trust levels, no « estimé » badges);
  - ONE BLOCK PER WAREHOUSE (Tripoli, Benghazi), side by side;
  - reordering lives in Achats: « Commander » links to finances-achats-v1.html?tile=po&open=po&p=<key>&site=<tri|bgz>;
  - stock not yet attached to a building = one small line « pas encore dans un entrepôt »;
  - units, counts and movements live in Entrepôt › Stock — this page is money.

  SAMPLE DATA (the plan's shared sheet): fictional products and suppliers.
  URL: ?win=7|28|90 (sales window, 28 default) · ?p=tad|mem|mal|cor|sac|gan|tap (product drawer)
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock &amp; inventaire · Finances v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ═══════════════ KIT — shared by every finances-*-v1.html (copy verbatim) ═══════════════ */
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-hov:rgba(255,255,255,.07);
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:24px; --r-in:16px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 20px 52px rgba(42,52,110,.14);
  --glass-in:rgba(255,255,255,.66); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A;
  --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --bad-dot:#E8385A;
  --flat:#475467; --flat-bg:rgba(15,23,40,.05); --tip-bg:#101828;
  /* money — ONE vocabulary for the whole Finances section, fixed order, validated (plans/finances-redesign.md) */
  --m-cogs:#2563eb; --m-ship:#0d9488; --m-ads:#ea6a1f; --m-pack:#a855f7; --m-profit:#15803d;
  /* identity (people) — the agent ramps; used for investors and suppliers' initials only */
  --id-indigo:#444CE7; --id-indigo-7:#3538CD; --id-pink:#DD2590; --id-pink-7:#C11574;
  --id-cyan:#088AB2; --id-cyan-7:#0E7090; --id-gold:#CA8504; --id-gold-7:#A15C07; --id-lime:#4CA30D; --id-lime-7:#3B7C0F;
  --pbh:45px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.cur{font-size:max(.42em,10.5px);font-weight:700;color:var(--ink-3);margin-inline-start:.28em;letter-spacing:0}

/* studio bar — always LTR, always French, never part of the product */
.pbar{position:sticky;top:0;z-index:400;height:var(--pbh);background:#16191E;color:#E6E8EB;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #000;direction:ltr;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks a,.looks button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2;display:inline-flex;align-items:center}
.looks a:hover,.looks button:hover{color:#fff}
.looks a.on,.looks button.on{background:#fff;color:#0E1013}

/* shell + sidebar (the live structure on main) */
.stage{display:flex;min-height:calc(100vh - var(--pbh))}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:var(--pbh);height:calc(100vh - var(--pbh))}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1;text-align:start}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.flag{width:26px;height:18px;border-radius:4px;overflow:hidden;display:grid;grid-template-rows:1fr 2fr 1fr;box-shadow:0 0 0 1px rgba(255,255,255,.14);position:relative;flex:none}
.flag i:nth-child(1){background:#E70013}.flag i:nth-child(2){background:#000}.flag i:nth-child(3){background:#239E46}
.flag b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:9px}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{flex:none;height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(247,144,9,.18);color:#FDB022}
.sb-item.on .sb-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-group{margin-top:14px}
.sb-gl{height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:28px 36px 96px;background:var(--page);background-attachment:fixed}
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* page header — showcase scale (H1 32 / 800) */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb .ic{width:13px;height:13px}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.ph-r{display:grid;justify-items:end;gap:8px}
.acts{display:flex;gap:8px;align-items:center}
.cmp{font-size:12px;color:var(--ink-3);font-weight:500}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn .ic{width:15px;height:15px}
.btn2{height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover:not(:disabled){background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:15px;height:15px}
.btn2.sm,.btn.sm{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px}
.dbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);text-align:start}
.dbtn:hover,.dbtn.open{background:#fff}
.dbtn > div{display:grid;line-height:1.2}
.dbtn b{font-size:14px;font-weight:800}
.dbtn small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.dbtn .chev{width:15px;height:15px;color:var(--ink-3)}

/* pills, chips, trend pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--flat-bg);color:var(--ink-2);white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill i.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.72);border:1px solid var(--glass-in-bd);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tr{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tr .ic{width:12px;height:12px;stroke-width:2.8}
.tr.good{background:var(--good-bg);color:var(--good)} .tr.bad{background:var(--bad-bg);color:var(--bad)} .tr.eq{background:var(--flat-bg);color:var(--flat);padding:0 9px}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chead{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 8px;flex-wrap:wrap}
.chead h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chead .q{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:4px}
.chead .rt{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.glass{background:var(--glass-in);border:1px solid var(--glass-in-bd);border-radius:var(--r-in)}
.link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.link:hover{text-decoration:underline}
.link .ic{width:13px;height:13px}
.hold{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.hold .ic{width:17px;height:17px}
.sw{width:11px;height:11px;border-radius:4px;background:var(--k);flex:none;display:inline-block}
.k-cogs{--k:var(--m-cogs)} .k-ship{--k:var(--m-ship)} .k-ads{--k:var(--m-ads)} .k-pack{--k:var(--m-pack)} .k-profit{--k:var(--m-profit)}
.empty{padding:28px;border:1.5px dashed var(--ink-4);border-radius:18px;text-align:center;color:var(--ink-3);font-weight:600}
.foot{display:flex;gap:10px;align-items:flex-start;padding:2px 6px;font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.5}
.foot .ic{width:15px;height:15px;margin-top:2px;color:var(--ink-q)}
.foot b{color:var(--ink-2)}

/* tooltip — on every mark; never the only place a figure lives */
.tip{position:fixed;z-index:600;pointer-events:none;background:var(--tip-bg);color:#fff;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:320px;line-height:1.45}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:800}
.tip small{display:block;color:#B5BAC2;font-weight:600}

/* popover (date / month picker, menus) */
.popw{position:relative}
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:80;min-width:300px;padding:10px;border-radius:18px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 24px 60px rgba(20,25,60,.22);display:none}
.pop.on{display:block}

/* drawer — floating glass, a halo of its colour (--h) */
.scrim{position:fixed;inset:0;z-index:500;background:rgba(15,23,40,.16);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;bottom:12px;inset-inline-end:12px;z-index:510;width:min(560px,calc(100vw - 24px));border-radius:26px;background:rgba(250,251,255,.86);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--card-bd);box-shadow:0 30px 80px rgba(20,25,60,.24);transform:translateX(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;z-index:-1;inset-inline-start:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--h,#444CE7) 30%,transparent),transparent 70%)}
.dr-h{padding:22px 24px 14px;display:flex;gap:12px;align-items:flex-start}
.dr-h h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dr-h p{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:3px}
.dr-x{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--glass-in);border:1px solid var(--glass-in-bd);flex:none}
.dr-x:hover{background:#fff}
.dr-b{flex:1;overflow:auto;padding:4px 24px 24px;display:grid;gap:16px;align-content:start}
.dr-sec{padding:14px 16px;border-radius:var(--r-in);background:rgba(255,255,255,.66);border:1px solid var(--glass-in-bd)}
.dr-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.dr-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* motion — explains once; off under reduced motion */
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ═══════════════ /KIT ═══════════════ */

/* ═══ PAGE · Stock & inventaire ═══ */
/* window segmented control (§4.11) */
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-in-bd)}
.seg > span{font-size:12.5px;font-weight:700;color:var(--ink-3);padding:0 8px 0 7px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}

/* severity fills — fills only, the word and the figure are always written beside */
.h-good{--k:linear-gradient(90deg,#12B76A,#079455)} .h-warn{--k:#F79009} .h-bad{--k:#E8385A}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--k);flex:none;display:inline-block}

/* 1 · hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;padding:28px 30px 26px;align-items:start}
.hero-n{margin-top:12px;font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.hero-st{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.hero-hl{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-top:8px}
.hero-hl em{font-style:normal;color:var(--ink-2)}
.cur{unicode-bidi:isolate}
.wh{margin-top:22px;padding:6px 14px}
.wh-r{display:grid;grid-template-columns:minmax(0,1fr) 120px 78px;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.wh-r:last-child{border-bottom:0}
.wh-r b{text-align:end;font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.wh-bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.wh-bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,#667085,#344054);transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards}
.wh-r.un .wh-bar i{background:repeating-linear-gradient(135deg,#98A2B3 0 4px,#C9CED7 4px 8px)}
.pr2-t small.note{margin-top:1px}
.dnote{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);font-size:12.5px;color:var(--ink-2);font-weight:500}
.dnote .ic{width:15px;height:15px;margin-top:1px;color:var(--ink-q)}
.hero-q{margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:500}
.hbar{display:flex;gap:3px;height:16px;border-radius:99px;overflow:hidden;margin-top:18px}
.hbar.sm{height:10px;margin-top:14px;gap:2px}
.hbar i{display:block;height:100%;background:var(--k);min-width:4px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) backwards;transition:opacity .18s}
.hbar i:first-child{border-radius:99px 0 0 99px} .hbar i:last-child{border-radius:0 99px 99px 0}
[data-hl] .hbar i{opacity:.18}
[data-hl=good] .hbar .h-good,[data-hl=warn] .hbar .h-warn,[data-hl=bad] .hbar .h-bad{opacity:1}
.hlg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.hlg button{display:grid;gap:3px;padding:10px 12px;border-radius:14px;text-align:start;transition:background .15s,opacity .18s}
.hlg button:hover{background:rgba(255,255,255,.78)}
[data-hl] .hlg button{opacity:.45} [data-hl=good] .hlg .h-good,[data-hl=warn] .hlg .h-warn,[data-hl=bad] .hlg .h-bad{opacity:1;background:rgba(255,255,255,.78)}
.hlg .lw{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.hlg b{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hlg small{font-size:12px;color:var(--ink-3);font-weight:600}
.hlg.sm{gap:6px;margin-top:10px} .hlg.sm button{padding:7px 9px;border-radius:12px} .hlg.sm b{font-size:15px}

/* 2 · one card per warehouse */
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.site{padding:22px 22px 18px;overflow:hidden;isolation:isolate}
.site-h{display:flex;align-items:center;gap:12px}
.site-h h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
.site-h p{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
.site-h .share{margin-inline-start:auto}
.site-n{display:flex;align-items:baseline;gap:12px;margin-top:16px;flex-wrap:wrap}
.site-n b{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.blk{margin-top:16px;padding:12px 14px 6px}
.blk-h{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.blk-h .eyebrow{display:flex;align-items:center;gap:6px}
.blk-h .eyebrow .ic{width:13px;height:13px}
.blk-h .meta{margin-inline-start:auto;font-size:12px;color:var(--ink-3);font-weight:600}
.blk-ok{display:inline-flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:12px;font-weight:700;color:var(--good)}
.blk-ok .ic{width:14px;height:14px;stroke-width:2.6}
.pr2{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;border-radius:10px;transition:background .15s}
.pr2:last-child{border-bottom:0}
.pr2:hover{background:rgba(255,255,255,.6)}
.pg{width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em;font-style:normal;flex:none}
.pg.sm{width:24px;height:24px;border-radius:8px;font-size:10px}
.pr2-t{display:grid;min-width:0;text-align:start;gap:1px}
.pr2-t b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr2-t small{font-size:12px;color:var(--ink-3);font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pr2-t small .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.pr2-a{display:grid;justify-items:end;gap:4px}
.pr2-a > b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ordered{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ordered .ic{width:13px;height:13px;color:var(--good);stroke-width:2.6}
.wtag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11.5px;font-weight:700;white-space:nowrap}
.wtag .ic{width:12px;height:12px}
.stag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.btn.sm .cur{color:rgba(255,255,255,.8)}

.more:hover{background:#fff;color:var(--ink)}
.more .ic{width:14px;height:14px;transition:transform .2s}
.more[aria-expanded=true] .ic{transform:rotate(180deg)}
.all{display:none;margin-top:10px;padding:6px 12px 8px}
.all.on{display:block;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.ar{display:grid;grid-template-columns:24px minmax(0,1fr) 52px 74px 58px 104px;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;width:100%;text-align:start;border-radius:8px}
.ar:last-child{border-bottom:0}
button.ar:hover{background:rgba(255,255,255,.65)}
.ar.hd{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.ar > b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .n{text-align:end;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ar .n.v{font-weight:800}
.ar .st{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);font-size:12px;white-space:nowrap}

/* 3 · unassigned line */
.unas{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:20px}
.unas .t{flex:1;min-width:0;font-size:13px;color:var(--ink-2);font-weight:500}
.unas .t b{color:var(--ink);font-weight:800;font-size:14px}
.unas .pgs{display:flex}

.unas .pgs .pg:first-child{margin-inline-start:0}

/* drawer — product */

.dk b{font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

<script>
/* ═══════════════ KIT script — shared by every finances-*-v1.html (copy verbatim) ═══════════════ */
const ic = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nf = new Intl.NumberFormat("fr-FR");
const fmt = (n) => nf.format(Math.round(n)).replace(/\u202f/g, "\u00a0");
const fmt1 = (n) => new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(n).replace(/\u202f/g, "\u00a0");
const LYD = `<span class="cur">د.ل</span>`;
const money = (n) => `${fmt(n)}${LYD}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const qs = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* a trend pill: dir = "up" | "down" | "eq"; good = is this direction good news? */
function trend(delta, unit, goodWhenUp = true, tipText = "") {
  if (Math.abs(delta) < 0.5) return `<span class="tr eq" ${tipText ? `data-tip="${esc(tipText)}"` : ""}>=</span>`;
  const up = delta > 0, good = up === goodWhenUp;
  return `<span class="tr ${good ? "good" : "bad"}" ${tipText ? `data-tip="${esc(tipText)}"` : ""}>${ic(up ? "up" : "dn")}${fmt(Math.abs(delta))}${unit ? " " + unit : ""}</span>`;
}

/* tooltip: any element with data-tip */
(function tooltip() {
  const tip = $("#tip");
  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) return tip.classList.remove("on");
    tip.innerHTML = t.dataset.tip;
    tip.classList.add("on");
  });
  document.addEventListener("pointermove", (e) => {
    if (!tip.classList.contains("on")) return;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.addEventListener("pointerout", (e) => { if (!e.relatedTarget || !e.relatedTarget.closest?.("[data-tip]")) tip.classList.remove("on"); });
})();

const UNAS = { tad: 20, mem: 30, sac: 10, tap: 14 };
const UNAS_ST = { tad: "good", mem: "good", sac: "good", tap: "bad" };

  { k: "warn", t: "Dort", s: "se vend à peine" },

];

/* sales window — changes the per-day rates (and so the days of cover), never the money */
const WIN = { 7: { f: 1.12, l: "7 derniers jours" }, 28: { f: 1, l: "28 derniers jours" }, 90: { f: 0.9, l: "90 derniers jours" } };
let win = WIN[qs.get("win")] ? +qs.get("win") : 28;
const rate = (row) => row.r * WIN[win].f;
const days = (u, r) => (r > 0 ? Math.round(u / r) : null);
const val = (k, u) => u * PROD[k].cost;
const achats = (k, site) => `finances-achats-v1.html?tile=po&open=po&p=${k}&site=${site}`;
const pg = (k, sm = "") => `<i class="pg ${sm}" aria-hidden="true">${PROD[k].g}</i>`;

function siteTotals(site) {
  const t = { v: 0, good: 0, warn: 0, bad: 0, perDay: 0 };
  for (const k of KEYS) { const r = site.rows[k], v = val(k, r.u); t.v += v; t[r.st] += v; t.perDay += rate(r) * PROD[k].cost; }
  return t;
}
function market() {
  const m = { v: 0, good: 0, warn: 0, bad: 0, perDay: 0, sale: 0, unas: 0 };
  for (const s of SITES) { const t = siteTotals(s); ["v", "good", "warn", "bad", "perDay"].forEach((x) => (m[x] += t[x])); for (const k of KEYS) m.sale += s.rows[k].u * PROD[k].price; }
  for (const k in UNAS) { const v = val(k, UNAS[k]); m.v += v; m.unas += v; m[UNAS_ST[k]] += v; m.sale += UNAS[k] * PROD[k].price; }
  return m;
}
/* a seeded, plausible day-by-day of units shipped (28 bars), summing to the rate × 28 */
function series(k) {
  let seed = [...k].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 2147483647;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const r = SITES.reduce((a, s) => a + rate(s.rows[k]), 0);
  const stop = Math.min(...SITES.map((s) => s.rows[k].last ?? 0).filter(Boolean), 99);
  const live = r > 0 ? 28 - (stop < 99 && SITES.every((s) => s.rows[k].r === 0 || s.rows[k].last) ? stop : 0) : 0;
  const per = live ? (r * 28) / live : 0;
  let carry = 0;
  const out = Array.from({ length: 28 }, (_, d) => {
    if (d >= live) return 0;
    const x = per * (0.45 + rnd() * 1.1 + (d % 7 === 4 ? -0.3 : 0)) + carry;
    const n = Math.max(0, Math.round(x)); carry = x - n; return n;
  });
  /* make the 28 bars sum to exactly rate × 28, so the drawer's figures agree */
  let diff = Math.round(r * 28) - out.reduce((a, c) => a + c, 0);
  for (let i = 0; diff !== 0 && i < 400; i++) { const d = Math.floor(rnd() * live); if (diff > 0) { out[d]++; diff--; } else if (out[d] > 0) { out[d]--; diff++; } }
  return out;
}

function productDrawer(k) {

  const ser = series(k), top = Math.max(...ser, 1), shipped = ser.reduce((a, c) => a + c, 0);
  const site = (SITES.find((s) => s.rows[k].buy) || SITES.reduce((a, s) => (days(s.rows[k].u, rate(s.rows[k])) ?? 1e9) < (days(a.rows[k].u, rate(a.rows[k])) ?? 1e9) ? s : a)).k;

    <div class="dr-h"><span class="pg" style="width:48px;height:48px;border-radius:15px;font-size:16px">${p.g}</span>
      <div><h3 id="dr-title">${p.n}</h3><p>${fmt(p.cost)} د.ل le prix d'achat · vendu ${fmt(p.price)} د.ل</p></div>
      <button class="dr-x" type="button" aria-label="Fermer">${ic("x")}</button></div>
    <div class="dr-b">
      <div class="dk"><b>${money(V)}</b><span>${fmt(U)} unités en stock · au prix d'achat</span></div>
      <div class="dfacts">
        <div><small>Part par jour</small><b>${R ? fmt1(R) : "0"} u</b></div>
        <div><small>Jours de ventes</small><b>${R ? "≈ " + Math.round(U / R) + " j" : "—"}</b></div>
        <div><small>Dernier comptage</small><b>jamais</b></div>
      </div>
      <div class="dr-sec"><h4>Par entrepôt</h4>
        <div class="dt hd"><span>Où</span><span class="n">Unités</span><span class="n">Valeur</span><span class="n">Jours</span></div>
        ${rows.map((r) => `<div class="dt"><span>${r.st ? `<i class="hdot h-${r.st}" data-tip="${SEVT[r.st]}"></i>` : `<span style="display:inline-flex;color:var(--ink-q)">${ic("pin")}</span>`}${r.n}</span><span class="n">${fmt(r.u)}</span><span class="n v">${fmt(r.v)}</span><span class="n">${r.d == null ? "—" : r.d + " j"}</span></div>`).join("")}
        <div class="dt tot"><span>Total</span><span class="n">${fmt(U)}</span><span class="n v">${fmt(V)}</span><span class="n">${R ? Math.round(U / R) + " j" : "—"}</span></div>
      </div>
      <div class="dr-sec"><h4>Unités parties par jour · 28 jours</h4>
        <div class="spk" role="img" aria-label="${shipped} unités parties en 28 jours">${ser.map((n, i) => `<i class="${n ? "" : "z"}" style="--h:${(n / top) * 100}%;--i:${i}" data-tip="<b>${dlabel(i)}</b> · ${n} unité${n > 1 ? "s" : ""}"></i>`).join("")}</div>
        <div class="spx"><span>${dlabel(0)}</span><span>${shipped} unités en 28 j</span><span>aujourd'hui</span></div>
      </div>
      <div class="dnote">${ic("info")}<span>Dernier comptage : jamais. Les unités viennent des entrées et des sorties enregistrées dans Entrepôt.</span></div>
    </div>
    <div class="dr-f"><a class="btn sm" href="${achats(k, site)}">${ic("cart")}Commander${ic("right")}</a><a class="btn2 sm" href="#">Mouvements → Entrepôt${ic("right")}</a><span style="font-size:12.5px;color:var(--ink-3);font-weight:500;margin-inline-start:auto">Échap pour fermer</span></div>`, "#667085");
}

/* events */
document.addEventListener("click", (e) => {
  const w = e.target.closest("[data-win]");
  if (w) { win = +w.dataset.win; render(); history.replaceState(null, "", `?win=${win}`); return; }
  const mo = e.target.closest("[data-more]");
  if (mo) { const open = mo.getAttribute("aria-expanded") !== "true"; mo.setAttribute("aria-expanded", open); mo.firstChild.textContent = open ? "Masquer la liste" : "Voir les 7 produits"; $("#all-" + mo.dataset.more).classList.toggle("on", open); return; }
  if (e.target.closest("a.btn, a.link")) return;
  const p = e.target.closest("[data-p]");
  if (p) productDrawer(p.dataset.p);
});
document.addEventListener("keydown", (e) => { const p = e.target.closest?.("[role=button][data-p]"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); productDrawer(p.dataset.p); } });
/* hovering a legend item (or a segment) highlights its segment and dims the others, in its own block */
document.addEventListener("pointerover", (e) => {
  $$("[data-hl]").forEach((x) => delete x.dataset.hl);
  const s = e.target.closest("[data-sev], .hbar i"); if (!s) return;
  const k = s.dataset.sev || [...s.classList].find((c) => c.startsWith("h-"))?.slice(2);
  const box = s.closest(".hero > div, .site"); if (box && k) box.dataset.hl = k;
});

renderShell("stock");
render();
if (PROD[qs.get("p")]) productDrawer(qs.get("p"));
</script>
</body>
</html>
