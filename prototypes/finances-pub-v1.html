<!doctype html>
<!--
  Finances › Dépenses pub — prototype v1 (2026-10-04). « Ce que rapporte la pub ».
  Kit CSS + kit script + sprite recopiés de finances-pnl-v1.html (blocs KIT, à l'identique ; symboles ajoutés seulement).

  Réponses du propriétaire (4 oct.) :
  - niveau A (le pilote par produit) maintenant + la capture par campagne (niveau B) démarrée en même temps ;
  - il pilote la pub LUI-MÊME, CHAQUE MATIN dans Ads Manager → la page s'ouvre sur 7 jours + aujourd'hui ;
  - elle s'ouvre sur UNE CARTE PAR PRODUIT AVEC SON VERDICT (Augmenter / Garder / Réparer / Couper) ;
  - plateformes Meta (synchro horaire), TikTok (import CSV), Snapchat (import CSV) — étiquettes neutres, jamais leurs couleurs.
  Décision de l'expert #9 : deux horloges. Rapide (48 h) : coût par lead + confirmation des leads frais → coût PROJETÉ
  par livrée. Lente (vérité) : la cohorte finie. Verdict = projection ÷ max par livrée : ≤ 70 % Augmenter · 70–100 %
  Garder · 100–120 % Réparer · > 120 % Couper ; < 30 leads = « Trop tôt » ; une cohorte finie qui contredit la
  projection l'emporte (Coran couleurs ici).

  DONNÉES FICTIVES (feuille commune du plan, « Pub — 7 derniers jours »).
  URL : ?win=today|7d|30d (défaut 7d) · ?p=tad|mem|mal|cor|sac|gan|tap (tiroir campagnes) · ?map=1 (tiroir « Rattacher »)
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dépenses pub · Finances v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ═══════════════ KIT — shared by every finances-*-v1.html (copy verbatim) ═══════════════ */
:root{
  --f:"Plus Jakarta Sans","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --brand:#15803D; --brand-hover:#12692F; --brand-wash:#EEF8F1;
  --sb-bg:#0E1013; --sb-el:#14171C; --sb-bd:rgba(255,255,255,.06); --sb-bd2:rgba(255,255,255,.10);
  --sb-ink:#E6E8EB; --sb-2:#B5BAC2; --sb-3:#7F858F; --sb-hov:rgba(255,255,255,.07);
  --bg:#F6F7FB; --card:rgba(255,255,255,.62); --card-bd:rgba(255,255,255,.9); --r:24px; --r-in:16px;
  --card-sh:0 10px 36px rgba(42,52,110,.07); --card-sh-hover:0 20px 52px rgba(42,52,110,.14);
  --glass-in:rgba(255,255,255,.66); --glass-in-bd:rgba(255,255,255,.95); --blur:blur(20px) saturate(170%);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A;
  --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --bad-dot:#E8385A;
  --flat:#475467; --flat-bg:rgba(15,23,40,.05); --tip-bg:#101828;
  /* money — ONE vocabulary for the whole Finances section, fixed order, validated (plans/finances-redesign.md) */
  --m-cogs:#2563eb; --m-ship:#0d9488; --m-ads:#ea6a1f; --m-pack:#a855f7; --m-profit:#15803d;
  /* identity (people) — the agent ramps; used for investors and suppliers' initials only */
  --id-indigo:#444CE7; --id-indigo-7:#3538CD; --id-pink:#DD2590; --id-pink-7:#C11574;
  --id-cyan:#088AB2; --id-cyan-7:#0E7090; --id-gold:#CA8504; --id-gold-7:#A15C07; --id-lime:#4CA30D; --id-lime-7:#3B7C0F;
  --pbh:45px;
  --page:radial-gradient(58% 40% at 2% 0%, #D3DBFF 0%, transparent 72%), radial-gradient(48% 36% at 100% 0%, #FAD3EC 0%, transparent 72%),
         radial-gradient(56% 46% at 98% 100%, #C6F2DA 0%, transparent 72%), radial-gradient(52% 46% at 0% 100%, #FFE6B3 0%, transparent 72%),
         radial-gradient(40% 30% at 50% 50%, #EDE7FF 0%, transparent 80%), var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.cur{font-size:max(.42em,10.5px);font-weight:700;color:var(--ink-3);margin-inline-start:.28em;letter-spacing:0}

/* studio bar — always LTR, always French, never part of the product */
.pbar{position:sticky;top:0;z-index:400;height:var(--pbh);background:#16191E;color:#E6E8EB;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #000;direction:ltr;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.pbar .tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7F858F}
.pbar .pt{font-size:13.5px;font-weight:700;color:#fff}
.pbar .src{font-size:12px;color:#8B9198}
.looks{display:inline-flex;gap:3px;background:#0E1013;border:1px solid #2A2F36;border-radius:10px;padding:3px;align-items:center}
.looks > i{font-style:normal;font-size:11px;color:#7F858F;font-weight:700;padding:0 6px 0 4px}
.looks a,.looks button{height:27px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;color:#B5BAC2;display:inline-flex;align-items:center}
.looks a:hover,.looks button:hover{color:#fff}
.looks a.on,.looks button.on{background:#fff;color:#0E1013}

/* shell + sidebar (the live structure on main) */
.stage{display:flex;min-height:calc(100vh - var(--pbh))}
.side{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:var(--pbh);height:calc(100vh - var(--pbh))}
.sb-head{padding:12px 12px 10px;display:grid;gap:10px}
.sb-top{display:flex;align-items:center;gap:8px}
.sb-word{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;padding-inline-start:4px;flex:1}
.sb-alerts{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 7px;border-radius:8px;border:1px solid var(--sb-bd2);color:var(--sb-ink);font-size:12px;font-weight:600}
.sb-alerts b{min-width:18px;height:18px;border-radius:9px;background:#D72C0D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:var(--sb-el);border:1px solid var(--sb-bd);color:var(--sb-3);font-size:13px}
.sb-search span{flex:1;text-align:start}
.kbd{font-size:11px;padding:0 5px;line-height:18px;border-radius:5px;border:1px solid var(--sb-bd2);color:var(--sb-3)}
.sb-mk{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 8px;border-radius:10px;background:var(--sb-el);border:1px solid var(--sb-bd2)}
.flag{width:26px;height:18px;border-radius:4px;overflow:hidden;display:grid;grid-template-rows:1fr 2fr 1fr;box-shadow:0 0 0 1px rgba(255,255,255,.14);position:relative;flex:none}
.flag i:nth-child(1){background:#E70013}.flag i:nth-child(2){background:#000}.flag i:nth-child(3){background:#239E46}
.flag b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:9px}
.sb-mk div{flex:1;display:grid}
.sb-mk strong{font-size:13.5px;color:#fff;font-weight:600}
.sb-mk small{font-size:11.5px;color:var(--sb-3)}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.sb-item{display:flex;align-items:center;gap:10px;height:32px;margin-top:1px;padding:0 8px 0 10px;border-radius:8px;color:var(--sb-ink);font-size:14px;width:100%;text-align:start}
.sb-item .ic{color:var(--sb-3)}
.sb-item:hover{background:var(--sb-hov)}
.sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item.on{background:var(--brand);color:#fff;font-weight:600}
.sb-item.on .ic{color:#fff}
.sb-badge{flex:none;height:18px;min-width:20px;padding:0 6px;border-radius:9px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(247,144,9,.18);color:#FDB022}
.sb-item.on .sb-badge{background:rgba(255,255,255,.22);color:#fff}
.sb-group{margin-top:14px}
.sb-gl{height:26px;padding:0 10px;color:var(--sb-3);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center}
.sb-foot{border-top:1px solid var(--sb-bd2);padding:8px;display:flex;align-items:center;gap:10px}
.sb-foot .me{width:30px;height:30px;border-radius:50%;background:#2A2F36;display:grid;place-items:center;font-weight:700;font-size:12px}
.sb-foot div{display:grid;font-size:13px}.sb-foot small{color:var(--sb-3);font-size:12px}

main{flex:1;min-width:0;padding:28px 36px 96px;background:var(--page);background-attachment:fixed}
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* page header — showcase scale (H1 32 / 800) */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.crumb{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb .ic{width:13px;height:13px}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px;color:var(--ink-2);font-weight:500;flex-wrap:wrap}
.sub .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.ph-r{display:grid;justify-items:end;gap:8px}
.acts{display:flex;gap:8px;align-items:center}
.cmp{font-size:12px;color:var(--ink-3);font-weight:500}

/* buttons */
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--brand-hover)}
.btn .ic{width:15px;height:15px}
.btn2{height:40px;padding:0 14px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(255,255,255,.85);border:1px solid rgba(15,23,40,.09);color:var(--ink)}
.btn2:hover:not(:disabled){background:#fff;box-shadow:0 4px 14px rgba(42,52,110,.12)}
.btn2 .ic{width:15px;height:15px}
.btn2.sm,.btn.sm{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px}
.dbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 14px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--card-bd);box-shadow:var(--card-sh);text-align:start}
.dbtn:hover,.dbtn.open{background:#fff}
.dbtn > div{display:grid;line-height:1.2}
.dbtn b{font-size:14px;font-weight:800}
.dbtn small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.dbtn .chev{width:15px;height:15px;color:var(--ink-3)}

/* pills, chips, trend pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--flat-bg);color:var(--ink-2);white-space:nowrap}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill i.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.72);border:1px solid var(--glass-in-bd);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tr{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tr .ic{width:12px;height:12px;stroke-width:2.8}
.tr.good{background:var(--good-bg);color:var(--good)} .tr.bad{background:var(--bad-bg);color:var(--bad)} .tr.eq{background:var(--flat-bg);color:var(--flat);padding:0 9px}

/* cards */
.card{position:relative;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);box-shadow:var(--card-sh);min-width:0;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.chead{display:flex;align-items:flex-start;gap:14px;padding:22px 24px 8px;flex-wrap:wrap}
.chead h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
.chead .q{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:4px}
.chead .rt{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.glass{background:var(--glass-in);border:1px solid var(--glass-in-bd);border-radius:var(--r-in)}
.link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.link:hover{text-decoration:underline}
.link .ic{width:13px;height:13px}
.hold{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.hold .ic{width:17px;height:17px}
.sw{width:11px;height:11px;border-radius:4px;background:var(--k);flex:none;display:inline-block}
.k-cogs{--k:var(--m-cogs)} .k-ship{--k:var(--m-ship)} .k-ads{--k:var(--m-ads)} .k-pack{--k:var(--m-pack)} .k-profit{--k:var(--m-profit)}
.empty{padding:28px;border:1.5px dashed var(--ink-4);border-radius:18px;text-align:center;color:var(--ink-3);font-weight:600}
.foot{display:flex;gap:10px;align-items:flex-start;padding:2px 6px;font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.5}
.foot .ic{width:15px;height:15px;margin-top:2px;color:var(--ink-q)}
.foot b{color:var(--ink-2)}

/* tooltip — on every mark; never the only place a figure lives */
.tip{position:fixed;z-index:600;pointer-events:none;background:var(--tip-bg);color:#fff;font-size:12.5px;font-weight:600;padding:8px 11px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.22);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:320px;line-height:1.45}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:800}
.tip small{display:block;color:#B5BAC2;font-weight:600}

/* popover (date / month picker, menus) */
.popw{position:relative}
.pop{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:80;min-width:300px;padding:10px;border-radius:18px;background:rgba(255,255,255,.97);border:1px solid var(--card-bd);box-shadow:0 24px 60px rgba(20,25,60,.22);display:none}
.pop.on{display:block}

/* drawer — floating glass, a halo of its colour (--h) */
.scrim{position:fixed;inset:0;z-index:500;background:rgba(15,23,40,.16);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;bottom:12px;inset-inline-end:12px;z-index:510;width:min(560px,calc(100vw - 24px));border-radius:26px;background:rgba(250,251,255,.86);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--card-bd);box-shadow:0 30px 80px rgba(20,25,60,.24);transform:translateX(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.drawer.on{transform:none}
.drawer::before{content:"";position:absolute;z-index:-1;inset-inline-start:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--h,#444CE7) 30%,transparent),transparent 70%)}
.dr-h{padding:22px 24px 14px;display:flex;gap:12px;align-items:flex-start}
.dr-h h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dr-h p{font-size:13px;color:var(--ink-2);font-weight:500;margin-top:3px}
.dr-x{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--glass-in);border:1px solid var(--glass-in-bd);flex:none}
.dr-x:hover{background:#fff}
.dr-b{flex:1;overflow:auto;padding:4px 24px 24px;display:grid;gap:16px;align-content:start}
.dr-sec{padding:14px 16px;border-radius:var(--r-in);background:rgba(255,255,255,.66);border:1px solid var(--glass-in-bd)}
.dr-sec h4{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.dr-f{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* motion — explains once; off under reduced motion */
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ═══════════════ /KIT ═══════════════ */

/* ═══ PAGE · Dépenses pub ═══ */
/* header extras — window segmented control, platform status chips */
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--glass-in-bd)}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.plats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip .ic{width:13px;height:13px;color:var(--ink-q)}
.chip em{font-style:normal;font-weight:600;color:var(--ink-3)}
.ldot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
.ldot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--live);opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.8);opacity:0}}

/* 1 · summary hero */
.sum{padding:26px 28px 20px;display:grid;gap:20px}
.sum-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:end}
.sum-n{display:flex;align-items:baseline;gap:4px;margin-top:10px;white-space:nowrap}
.sum-n b{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.sum-n .cur{font-size:17px}
.sum-n span.w{font-size:17px;font-weight:700;color:var(--ink-2);margin-inline-start:8px}
.sum-s{margin-top:9px;font-size:13px;color:var(--ink-3);font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sum-s .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.split-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.split-h small{font-size:12px;color:var(--ink-3);font-weight:600}
.pbar2{display:flex;gap:2px;height:14px;border-radius:99px;overflow:hidden;margin:9px 0 10px;transform-origin:left;animation:growx .9s cubic-bezier(.2,.8,.2,1) .1s backwards}
.pbar2 i{display:block;height:100%;background:var(--k);min-width:3px;transition:opacity .2s}
.pf-meta{--k:#344054} .pf-tt{--k:#7A8599} .pf-sc{--k:#B4BCC9}
.plg{display:flex;gap:6px 20px;flex-wrap:wrap}
.plg span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:opacity .2s;cursor:default}
.plg span b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.plg span em{font-style:normal;color:var(--ink-3);font-weight:600}
.split[data-hl] .pbar2 i,.split[data-hl] .plg span{opacity:.25}
.split[data-hl] .pbar2 i.hl,.split[data-hl] .plg span.hl{opacity:1}

.st{padding:15px 16px 14px;min-width:0}

.ck{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);flex:none}

/* section head on the ground */
.sec-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:8px 2px -4px}

.rule{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.6);border:1px solid var(--glass-in-bd);color:var(--ink-2);white-space:nowrap}

.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pc{padding:20px 22px 16px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:start;transition:transform .25s,box-shadow .25s;animation-delay:calc(var(--d,0) * 70ms + 160ms)}

.pc-n{flex:1;min-width:0}
.pc-n b{display:block;font-size:17px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-n small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.vd{height:30px;padding:0 12px;font-size:13px;font-weight:800;gap:6px;flex:none}
.vd .g{font-size:11px;line-height:1}
.fig{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.fig b{font-size:36px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.fig .cur{font-size:14px}
.fig span.l{font-size:13px;color:var(--ink-2);font-weight:600;margin-inline-start:6px}
.fig span.mx{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--ink-2)}
.fig span.mx b{font-size:15px;letter-spacing:0}
.gauge{position:relative;height:12px;border-radius:99px;background:var(--track);margin:12px 0 18px}
.gauge > i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);border-radius:99px;background:var(--k);transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) .25s backwards}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-inline-start:-1px;border-radius:2px;inset-inline-start:var(--x);background:var(--ink-2)}

.gauge .mk span{position:absolute;top:calc(100% + 3px);inset-inline-start:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.gauge .mk.max span{color:var(--ink-2);font-weight:800}
.sv-good{--k:var(--live)} .sv-flat{--k:#98A2B3} .sv-warn{--k:var(--warn-dot)} .sv-bad{--k:var(--bad-dot)}

.ck-h{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;white-space:nowrap}
.ck-h .ic{width:13px;height:13px;color:var(--ink-2);stroke-width:2.2}
.ck-h em{font-style:normal;margin-inline-start:auto;letter-spacing:0;text-transform:none;font-weight:600;font-size:11.5px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px}
.kv div{display:grid;min-width:0}
.kv small{font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.kv b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv b .cur{font-size:10.5px}
.kv b.bad{color:var(--bad)}
.kv em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600;margin-inline-start:4px}
.spark svg{width:100%;height:70px;display:block;overflow:visible}
.spark .sp-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-weight:600;margin-top:5px}

.sp-area{fill:color-mix(in srgb,var(--m-ads) 12%,transparent)}
.sp-max{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 4}

.sp-dot{fill:#fff;stroke:var(--m-ads);stroke-width:1.8}

.ph{flex-wrap:nowrap}
.ph > div:first-child{min-width:0;flex:1}

.ph-r{flex:none}

        <span class="chip" data-tip="<b>Meta</b> · synchronisé chaque heure<small>dernière synchro 17:08 · prochaine 18:08</small>"><span class="ldot"></span>Meta <em>· synchro il y a 12 min</em></span>
        <span class="chip" data-tip="<b>TikTok</b> · pas encore synchronisé<small>dernier import : CSV du 3 oct., jusqu'au 2 oct. inclus</small>">${ic("file")}TikTok <em>· import CSV du 3 oct.</em></span>
        <span class="chip" data-tip="<b>Snapchat</b> · pas encore synchronisé<small>dernier import : CSV du 1 oct. — 3 jours sans chiffres</small>">${ic("file")}Snapchat <em>· import CSV du 1 oct.</em></span>
      </div>
    </div>
    <div class="ph-r">
      <div class="acts">
        <div class="seg" role="tablist" aria-label="Période">${Object.entries(WIN).map(([k, w]) => `<button type="button" role="tab" aria-selected="${k === win}" class="${k === win ? "on" : ""}" data-win="${k}">${w.l}</button>`).join("")}</div>
        <button class="btn2" type="button" data-tip="Un CSV exporté de TikTok Ads ou de Snapchat Ads — montants convertis en dinars au taux du jour">${ic("upload")}Importer</button>
        <button class="btn2" type="button" data-tip="Une dépense hors plateforme : influenceur, page sponsorisée…">${ic("plus")}Dépense</button>
      </div>
      <div class="cmp">Lu chaque matin · verdicts sur les 7 derniers jours</div>
    </div>
  </header>`;
}

function renderHero() {
  const w = WIN[win], f = w.f;
  const spend = Math.round(MARKET.spend * f), leads = Math.round(MARKET.leads * f);
  const cpl = r1(MARKET.spend / MARKET.leads), pj = Math.round(cpl / (MARKET.d100 / 100));
  const tot = PLATF.reduce((a, p) => a + p.v, 0);
  return `
  <section class="card sum rise" style="--d:1" aria-label="Résumé">
    <div class="sum-top">
      <div>
        <div class="eyebrow">Pub · ${w.lead} · toutes plateformes</div>
        <div class="sum-n"><b>${fmt(spend)}</b>${LYD}<span class="w">dépensés</span></div>
        <div class="sum-s"><span>${w.sub}</span><span class="sep"></span><span>dont ${fmt(640 * f)} rattachés à aucun produit</span></div>
      </div>
      <div class="split" id="split">
        <div class="split-h"><span>Par plateforme</span><small>étiquettes neutres — une plateforme n'est pas un résultat</small></div>
        <div class="pbar2" role="img" aria-label="Répartition par plateforme">${PLATF.map((p) => `<i class="pf-${p.k}" data-pf="${p.k}" style="width:${(p.v / tot) * 100}%" data-tip="<b>${p.n}</b> · ${fmt(p.v * f)} د.ل · ${Math.round((p.v / tot) * 100)} %<small>${p.how}</small>"></i>`).join("")}</div>
        <div class="plg">${PLATF.map((p) => `<span class="pf-${p.k}" data-pf="${p.k}"><i class="sw"></i>${p.n} <b>${fmt(p.v * f)}</b><em>${Math.round((p.v / tot) * 100)} %</em></span>`).join("")}</div>
      </div>
    </div>
    <div class="t3">
      <div class="glass st"><div class="st-h">${ic("inbox")}Commandes reçues</div>
        <div class="st-n"><b>${fmt(leads)}</b><small>leads</small></div>
        <div class="st-s"><b>${fmt1(cpl)} د.ل</b> par lead · lead = commande reçue</div></div>
      <div class="glass st"><div class="st-h">${ic("phone")}Leads frais confirmés <span class="pill" data-tip="44 % d'habitude sur ces produits">48 h</span></div>
        <div class="st-n"><b>${MARKET.conf}</b><small>%</small></div>
        <div class="st-s">leads des 48 dernières heures · <b>44 %</b> d'habitude</div></div>
      <div class="glass st"><div class="st-h">${ic("target")}Coût projeté par livrée <span class="pill good">${ic("check")}Rentable</span></div>
        <div class="st-n"><b>${pj}</b><small>د.ل · max ${MARKET.max}</small></div>
        <div class="st-s">${fmt1(cpl)} par lead ÷ <b>${MARKET.d100} livrées pour 100 leads</b></div></div>
    </div>
    <div class="clocks">
      <span><span class="ck">${ic("zap")}</span><b>48 h</b> : coût par lead + confirmation → projection</span>
      <span><span class="ck">${ic("check")}</span><b>Vérité</b> : la cohorte finie, livrées réelles (2–3 semaines)</span>
      <span style="margin-inline-start:auto;color:var(--ink-3)">${win === "today" ? "Aujourd'hui : chiffres du jour, verdicts sur 7 jours" : "Verdicts : 7 derniers jours"}</span>
    </div>
  </section>`;
}

/* 14 days of cost per lead (21 sept. → 4 oct.), seeded, against the « max par lead » line */
const DAYS = Array.from({ length: 14 }, (_, i) => (i < 10 ? `${21 + i} sept.` : `${i - 9} oct.`));
function series(p) {
  const base = cpl7(p), seed = p.k.charCodeAt(0) + p.k.charCodeAt(1);
  return DAYS.map((_, i) => r1(base * (1 + p.tr * (i - 10) + 0.1 * Math.sin(i * 1.7 + seed) + 0.04 * Math.cos(i * 3.1 + seed))));
}
function spark(p) {
  const s = series(p), ml = maxLead(p), W = 214, H = 70, top = Math.max(ml, ...s) * 1.18;
  const x = (i) => (i / 13) * W, y = (v) => H - (v / top) * H;
  const pts = s.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area = `M0,${H} L${pts.join(" L")} L${W},${H} Z`;
  const ym = y(ml).toFixed(1);
  return `
    <div class="spark">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Coût par lead sur 14 jours, contre le max par lead ${fmt1(ml)}">
        <path class="sp-area" d="${area}"/>
        <line class="sp-max" x1="0" x2="${W}" y1="${ym}" y2="${ym}"/>
        <text class="sp-maxl" x="${W}" y="${+ym - 5}" text-anchor="end">max ${fmt1(ml)}</text>
        <polyline class="sp-line" points="${pts.join(" ")}"/>
        ${s.map((v, i) => `<circle class="sp-hit" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="8" data-tip="<b>${DAYS[i]}</b> · ${fmt1(v)} د.ل par lead<small>max par lead ${fmt1(ml)} · ${v <= ml ? `marge ${fmt1(ml - v)}` : `${fmt1(v - ml)} de trop`}</small>"/><circle class="sp-dot${i === 13 ? " last" : ""}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === 13 ? 3.4 : 2.2}" pointer-events="none"/>`).join("")}
      </svg>
      <div class="sp-cap"><span>21 sept.</span><span>coût par lead · 14 j</span><span>4 oct.</span></div>
    </div>`;
}

function card(p, d) {
  const v = verdict(p), V = VD[v.k], w = inWin(p), ml = maxLead(p);
  const scale = p.max * 1.6, wd = Math.min(w.proj / scale, 1) * 100;
  const over = w.cpl > ml;
  const platT = Object.entries(p.plat).sort((a, b) => b[1] - a[1]);
  const main = platT[0], mainN = PLATF.find((x) => x.k === main[0]).n;
  const confBad = p.conf < p.usual - 5;
  const coh = p.coh, cohGood = coh.profit >= 0;
  return `
  <article class="card pc rise" style="--d:${d + 2}" data-p="${p.k}" role="button" tabindex="0" aria-label="${esc(p.n)} — ${V.t}, voir les campagnes">
    <div class="pc-h">
      <span class="pg">${p.g}</span>
      <div class="pc-n"><b>${esc(p.n)}</b><small>${p.why}</small></div>
      ${vpill(v.k)}
    </div>
    <div>
      <div class="fig"><b>${w.proj}</b>${LYD}<span class="l">par livrée (projeté)</span><span class="mx">max <b>${p.max}</b></span></div>
      <div class="gauge sv-${V.sv}" data-tip="<b>${w.proj} د.ل par livrée</b> · ${Math.round((w.proj / p.max) * 100)} % du max<small>max ${p.max} = ce qu'une livrée laisse avant la pub</small>">
        <i style="--w:${wd}%"></i>
        <span class="mk soft" style="--x:${(0.7 / 1.6) * 100}%"><span>70 %</span></span>
        <span class="mk max" style="--x:${(1 / 1.6) * 100}%"><span>max ${p.max}</span></span>
      </div>
    </div>
    <div class="room">vous payez <b class="${over ? "bad" : ""}">${fmt1(w.cpl)}</b> par lead · ${over ? `<b>${fmt1(ml)}</b> au plus — ${fmt1(w.cpl - ml)} de trop` : `jusqu'à <b>${fmt1(ml)}</b> possible`}</div>
    <div class="glass fast">
      <div>
        <div class="ck-h">${ic("zap")}Horloge 48 h<em>${WIN[win].lead}</em></div>
        <div class="kv">
          <div><small>Dépensé</small><b>${fmt(w.spend)}${LYD}</b></div>
          <div><small>Leads</small><b>${fmt(w.leads)}</b></div>
          <div><small>Coût par lead</small><b class="${over ? "bad" : ""}">${fmt1(w.cpl)}${LYD}</b></div>
          <div><small>Confirmés · 48 h</small><b class="${confBad ? "bad" : ""}">${p.conf} %<em>vs ${p.usual} % d'habitude</em></b></div>
        </div>
      </div>
      ${spark(p)}
    </div>
    <div class="glass slow${v.override ? " win" : ""}">
      <span class="ck">${ic(v.override ? "alert" : "check")}</span>
      <span>Vérité · cohorte 1–21 sept., ${coh.mat} % finie : <b>${coh.per} د.ل par livrée</b> · bénéfice brut <b class="${cohGood ? "up" : "dn"}">${cohGood ? "+" : "−"}${fmt(Math.abs(coh.profit))}</b>${v.override ? `<span class="wn">La cohorte finie l'emporte : la projection dit ${w.proj} (sous le max), la vérité ${coh.per}.</span>` : ""}</span>
    </div>
    <div class="pc-f"><span><b>${fmt(w.spend)}</b> dépensés · ${mainN} ${Math.round((main[1] / p.spend) * 100)} %</span><a class="link" href="?p=${p.k}" data-p="${p.k}">Voir les campagnes${ic("right")}</a></div>
  </article>`;
}

function smallCard(p, d) {
  const v = verdict(p), w = inWin(p);
  if (p.early) return `
  <article class="card pc cmp rise" style="--d:${d + 2}" data-p="${p.k}" role="button" tabindex="0">
    <span class="pg">${p.g}</span>
    <div class="pc-n"><b>${esc(p.n)}</b><small>lancé le ${p.since} · ${fmt(w.spend)} dépensés · ${fmt(w.leads)} leads · ${fmt1(w.cpl)} par lead</small></div>
    <div class="pc-r">${vpill(v.k)}<span class="pmeter" data-tip="${w.leads} leads sur 30 — jugé à partir de 30"><i style="--w:${(w.leads / 30) * 100}%"></i></span><small>jugé à 30 leads · encore ${30 - w.leads}</small></div>
  </article>`;
  return `
  <article class="card pc cmp rise" style="--d:${d + 2}" data-p="${p.k}" role="button" tabindex="0">
    <span class="pg">${p.g}</span>
    <div class="pc-n"><b>${esc(p.n)}</b><small>${((n) => `${fmt(n)} commande${n > 1 ? "s" : ""} reçue${n > 1 ? "s" : ""}`)(Math.round(p.leads * WIN[win].f) || 1)} sans pub · cohorte sept. : bénéfice brut +${fmt(p.coh.profit)}</small></div>
    <div class="pc-r">${vpill(v.k)}<small>aucune dépense rattachée</small></div>
  </article>`;
}

function renderCards() {
  const big = P.filter((p) => !p.early && !p.none).sort((a, b) => b.spend - a.spend);
  const small = P.filter((p) => p.early || p.none);
  const rules = [["good", "▲ Augmenter ≤ 70 %"], ["flat", "= Garder 70–100 %"], ["warn", "✎ Réparer 100–120 %"], ["bad", "▼ Couper > 120 %"]];
  return `
  <div class="sec-h rise" style="--d:2">
    <div><h2>Par produit</h2><p>Le verdict compare le coût projeté par livrée au max que le produit peut payer. Rangés par dépense.</p></div>
    <div class="rt">${rules.map(([s, t]) => `<span class="rule sv-${s}"><i></i>${t}</span>`).join("")}</div>
  </div>
  <div class="pcards">${big.map((p, i) => card(p, i)).join("")}
    <div class="pstack">${small.map((p, i) => smallCard(p, i + big.length)).join("")}${renderUnmapped()}</div>
  </div>`;
}

function renderCapture() {
  return `
  <section class="card capt rise" style="--d:9" aria-label="Suivi par campagne">
    <div>
      <div class="eyebrow">Suivi par campagne · en capture depuis le 3 oct.</div>
      <div class="capt-n"><b>64 %</b><span>des commandes d'hier portent leur campagne</span></div>
      <div class="capt-s">La campagne arrive avec la commande (lien tagué). Quand ces commandes seront livrées, chaque campagne aura son propre verdict.</div>
    </div>
    <div>${CAPT.map((c) => `
      <div class="cb"><span>${c.n}</span><span class="cb-t" data-tip="<b>${c.n}</b> · ${c.v} % des commandes d'hier tagguées"><i style="--w:${c.v}%"></i></span><b class="${c.v ? "" : "z"}">${c.v} %</b>
      ${c.v ? "" : `<a class="link" href="#" data-tip="Ajouter les paramètres UTM aux liens des annonces Snapchat">${ic("tag")}liens à taguer${ic("right")}</a>`}</div>`).join("")}
    </div>
    <div class="glass when">
      <small>Verdict par campagne</small>
      <b>dès ≈ 25 oct.</b>
      <span class="pmeter" data-tip="2 jours de capture sur ≈ 21 nécessaires"><i style="--w:${(2 / 21) * 100}%"></i></span>
      <small>2 jours sur ≈ 21</small>
    </div>
  </section>`;
}

function renderUnmapped() {
  const f = WIN[win].f;
  return `
  <section class="card alert rise" style="--d:10" aria-label="Pub non rattachée">
    <span class="ai">${ic("link")}</span>
    <div><b>${fmt(640 * f)}${LYD} de pub rattachés à aucun produit</b><p>2 ensembles de pub sans produit — ils comptent dans le total, aucun verdict ne peut les juger.</p></div>
    <button class="btn2" type="button" data-map="1">${ic("link")}Rattacher</button>
  </section>`;
}

function render() {
  $("#page").innerHTML = renderHeader() + renderHero() + renderCards() + renderCapture() + `
    <p class="foot rise" style="--d:11">${ic("info")}<span><b>Lead</b> = une commande reçue (Meta compte un « achat » dès le formulaire : sur 100, 13 à 20 deviennent une livraison payée). <b>Max par livrée</b> = ce qu'une commande livrée laisse avant la pub : prix − coût du produit − livraison − emballage. <b>Projection</b> = coût par lead ÷ (livrées attendues pour 100 leads ÷ 100), avec la confirmation des leads frais et le taux de livraison habituel du produit. Base : commandes <b>reçues</b> dans la période, suivies jusqu'à aujourd'hui — le P&amp;L compte les ventes livrées dans le mois. <a class="link" href="finances-pnl-v1.html">P&amp;L global${ic("right")}</a></span></p>`;
  $$(".pbar [data-win]").forEach((b) => b.classList.toggle("on", b.dataset.win === win && !qs.get("p") && !qs.get("map")));
}

/* drawer — the product's campaigns / ad sets */
function campDrawer(k) {
  const p = P.find((x) => x.k === k); if (!p) return;
  const v = verdict(p), V = VD[v.k], list = CAMP[k] || [], w = inWin(p);
  const tot = list.reduce((a, c) => a + c.s, 0) || 1;
  const rows = list.map((c) => `
    <div class="cp">
      <div class="cp-h"><span class="plat">${c.pf}</span><b>${esc(c.n)}</b><span class="amt">${money(c.s)}</span></div>
      <div class="cp-sh"><span class="dbar2" data-tip="${Math.round((c.s / tot) * 100)} % de la pub de ${esc(p.n)}"><i style="--w:${(c.s / tot) * 100}%"></i></span><span>${Math.round((c.s / tot) * 100)} %</span></div>
      <div class="cp-g">
        <div><small>Leads</small><b>${c.leads}</b></div>
        <div data-tip="Meta compte un achat au formulaire ; Ordra compte les commandes vraiment reçues"><small>« Achats » / réels</small><b>${c.ach == null ? `—<em> / ${c.leads}</em>` : `${c.ach}<em> / ${c.leads}</em>`}</b></div>
        <div><small>Coût par lead</small><b>${fmt1(c.s / c.leads)}</b></div>
        <div class="off" data-tip="Les commandes taguées depuis le 3 oct. seront livrées dans 2–3 semaines"><small>Livrées par campagne</small><b>en capture</b><em>depuis le 3 oct.</em></div>
      </div>
      <div class="cp-map">${ic("link")}${c.map}${c.ach == null ? " · Snapchat ne transmet pas d'achats" : ""}</div>
    </div>`).join("");
  const body = p.none
    ? `<div class="empty">Aucune campagne ne vise ce produit.<br><span style="font-weight:500">${p.leads} commandes reçues cette semaine sans pub — elles comptent dans sa cohorte.</span></div>`
    : `<div class="dr-sec"><h4>${ic("mega")}Campagnes et ensembles de pub<em>${list.length} · ${WIN["7d"].lead}</em></h4>${rows}</div>`;
  const verdictLine = p.none ? "" : p.early
    ? `<div class="dnote">${ic("clock")}<span><b>Trop tôt</b> : ${p.leads} leads, il en faut 30 pour juger. À ce rythme, verdict dans ≈ 4 jours.</span></div>`
    : `<div class="dsum">
        <div><small>Projeté par livrée</small><b>${proj(cpl7(p), p)} د.ل</b></div>
        <div><small>Max par livrée</small><b>${p.max} د.ل</b></div>
        <div><small>Vérité · cohorte sept.</small><b>${p.coh.per} د.ل</b></div>
      </div>`;
  openDrawer(`
    <div class="dr-h"><span class="pg">${p.g}</span>
      <div><h3 id="dr-title">${esc(p.n)}</h3><p>${vpill(v.k)} <span style="margin-inline-start:6px">${p.why || (p.early ? "moins de 30 leads" : "aucune dépense")}</span></p></div>
      <button class="dr-x" type="button" aria-label="Fermer">${ic("x")}</button></div>
    <div class="dr-b">
      <div class="dk"><b>${money(p.spend)}</b><span>dépensés · 7 jours · ${p.leads} leads${p.none ? "" : ` · ${fmt1(cpl7(p))} par lead`}</span></div>
      ${verdictLine}
      ${body}
      <div class="dnote">${ic("info")}<span>Aujourd'hui, aucune commande ne dit quelle annonce l'a amenée : les leads d'une campagne sont <b>répartis selon ses produits</b> (100 % quand elle n'en vise qu'un). La colonne <b>« Livrées par campagne »</b> se remplit avec la capture commencée le 3 oct. — verdict par campagne dès ≈ 25 oct.</span></div>
    </div>
    <div class="dr-f"><a class="btn2 sm" href="#" data-tip="Ouvrir Ads Manager sur ces campagnes">Ads Manager${ic("ext")}</a><span style="font-size:12.5px;color:var(--ink-3);font-weight:500">Échap pour fermer</span></div>`, HUE[V.sv]);
}

/* drawer — attach unmapped ad sets to a product (static) */
function mapDrawer() {
  const opts = (sel) => `<option value="">Choisir un produit…</option>` + P.map((p) => `<option ${p.k === sel ? "selected" : ""}>${esc(p.n)}</option>`).join("") + `<option>Réparti selon les commandes du jour</option>`;
  openDrawer(`
    <div class="dr-h"><span class="hold" style="background:var(--warn-bg);color:var(--warn)">${ic("link")}</span>
      <div><h3 id="dr-title">Rattacher la pub</h3><p>${money(640)} · 2 ensembles de pub sans produit · 7 jours</p></div>
      <button class="dr-x" type="button" aria-label="Fermer">${ic("x")}</button></div>
    <div class="dr-b">
      <div class="dr-sec"><h4>${ic("mega")}Ensembles sans produit<em>2</em></h4>
      ${UNMAPPED.map((u) => `
        <div class="um">
          <div class="um-h"><span class="plat">${u.pf}</span><b>${esc(u.n)}</b><span class="amt">${money(u.s)}</span></div>
          <small>${u.sub}${u.guess ? " · suggestion : le nom contient « COR »" : ""}</small>
          <div class="um-p"><select aria-label="Produit pour ${esc(u.n)}">${opts(u.guess)}</select><button class="btn sm" type="button">Rattacher</button></div>
        </div>`).join("")}
      </div>
      <div class="dnote">${ic("info")}<span>Le rattachement vaut pour <b>toute la vie</b> de l'ensemble, passé compris : les verdicts des produits se recalculent. « Réparti selon les commandes du jour » partage la dépense entre les produits commandés ce jour-là.</span></div>
    </div>
    <div class="dr-f"><span style="font-size:12.5px;color:var(--ink-3);font-weight:500">Échap pour fermer</span></div>`, HUE.warn);
}

/* events */
document.addEventListener("click", (e) => {
  const wb = e.target.closest(".seg [data-win]");
  if (wb) { win = wb.dataset.win; render(); history.replaceState(null, "", `?win=${win}`); return; }
  if (e.target.closest("[data-map]")) { mapDrawer(); return; }
  const pc = e.target.closest("[data-p]");
  if (pc && !e.target.closest("#drawer")) { e.preventDefault(); campDrawer(pc.dataset.p); }
});
document.addEventListener("keydown", (e) => {
  const pc = e.target.closest?.("article[data-p]");
  if (pc && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); campDrawer(pc.dataset.p); }
});
/* hovering a platform highlights its segment */
document.addEventListener("pointerover", (e) => {
  const sp = $("#split"); if (!sp) return;
  const t = e.target.closest("[data-pf]");
  $$("[data-pf]", sp).forEach((x) => x.classList.toggle("hl", !!t && x.dataset.pf === t.dataset.pf));
  if (t && sp.contains(t)) sp.dataset.hl = t.dataset.pf; else delete sp.dataset.hl;
});

renderShell("pub");
render();
if (qs.get("p")) campDrawer(qs.get("p"));
if (qs.get("map")) mapDrawer();
</script>
</body>
</html>
