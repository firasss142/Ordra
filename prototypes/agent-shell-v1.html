<title>Ordra — coquille agent (v1)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v1 — « la coquille agent », les trois surfaces restantes réécrites dans la
  langue de /delivery (Suivi livraison). Construit 2026-09-18. Plan : plans/agent-shell-redesign.md
   · Écran 1 « Commandes » : la situation d'abord, une teinte par situation, le liseré,
     la bande de paniers, la colonne d'action à x fixe, le panneau collant à droite.
   · Écran 2 « Navigation + recherche » : l'en-tête ne bouge plus d'un onglet à l'autre,
     le champ de recherche est rendu partout et propose des résultats de TOUS les onglets.
   · Écran 3 « Commissions » : la même charpente que la livraison, plus la carte isolée.
  Rien n'est inventé : chaque atome vient de src/components/delivery/ui.tsx et de
  DeliveryWorklistView/DeliveryRow. L'écran « Livraison » est reproduit tel quel comme étalon.
  URL : ?lang=fr|ar &view=desktop|mobile &screen=orders|search|commissions|delivery
        &tab=all|nouveau|en_cours|confirme|fermees &open=<id> &state=normal|loading|empty
        &check=contrast|touch  &ruler=1
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Ground + ink — exactly the values the live delivery page hard-codes. */
  --bg:#FAFAF9; --surface:#FFFFFF; --soft:#F9FAFB; --sunk:#F3F4F6;
  --line:#E5E7EB; --line-2:#D1D5DB; --line-strong:#C9CCCF;
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280; --ink-4:#9CA3AF;
  --brand:#15803D; --brand-deep:#14532D; --brand-tint:#F0FDF4; --brand-line:#BBF7D0;
  --wa:#15803D; --wa-soft:#DCFCE7;
  --black:#111111; --studio:#E9EBEF;
  --f-lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
}
/* ── The 14 tones, copied value-for-value from TONE in src/components/delivery/ui.tsx.
      One hue per situation (design-system §4.22). Nothing here is new. ───────────── */
[data-t=red]     {--from:#FECACA;--to:#FEF2F2;--tink:#991B1B;--ring:#FCA5A5;--edge:#EF4444;--soft:#FEE2E2;--bord:#F87171;--ticon:#DC2626}
[data-t=rose]    {--from:#FECDD3;--to:#FFF1F2;--tink:#9F1239;--ring:#FDA4AF;--edge:#F43F5E;--soft:#FFE4E6;--bord:#FDA4AF;--ticon:#BE123C}
[data-t=fuchsia] {--from:#F5D0FE;--to:#FDF4FF;--tink:#86198F;--ring:#F0ABFC;--edge:#D946EF;--soft:#FAE8FF;--bord:#F0ABFC;--ticon:#A21CAF}
[data-t=violet]  {--from:#DDD6FE;--to:#F5F3FF;--tink:#5B21B6;--ring:#C4B5FD;--edge:#8B5CF6;--soft:#EDE9FE;--bord:#C4B5FD;--ticon:#6D28D9}
[data-t=orange]  {--from:#FED7AA;--to:#FFF7ED;--tink:#9A3412;--ring:#FDBA74;--edge:#F97316;--soft:#FFEDD5;--bord:#FDBA74;--ticon:#C2410C}
[data-t=amber]   {--from:#FDE68A;--to:#FFFBEB;--tink:#92400E;--ring:#FCD34D;--edge:#F59E0B;--soft:#FEF3C7;--bord:#FBBF24;--ticon:#B45309}
[data-t=yellow]  {--from:#FEF08A;--to:#FEFCE8;--tink:#854D0E;--ring:#FDE047;--edge:#EAB308;--soft:#FEF9C3;--bord:#FDE047;--ticon:#A16207}
[data-t=teal]    {--from:#99F6E4;--to:#F0FDFA;--tink:#115E59;--ring:#5EEAD4;--edge:#14B8A6;--soft:#CCFBF1;--bord:#5EEAD4;--ticon:#0F766E}
[data-t=indigo]  {--from:#C7D2FE;--to:#EEF2FF;--tink:#3730A3;--ring:#A5B4FC;--edge:#6366F1;--soft:#E0E7FF;--bord:#A5B4FC;--ticon:#4338CA}
[data-t=stone]   {--from:#D6D3D1;--to:#FAFAF9;--tink:#44403C;--ring:#A8A29E;--edge:#A8A29E;--soft:#E7E5E4;--bord:#D6D3D1;--ticon:#57534E}
[data-t=slate]   {--from:#CBD5E1;--to:#F8FAFC;--tink:#334155;--ring:#94A3B8;--edge:#94A3B8;--soft:#E2E8F0;--bord:#CBD5E1;--ticon:#475569}
[data-t=blue]    {--from:#BFDBFE;--to:#EFF6FF;--tink:#1D4ED8;--ring:#93C5FD;--edge:#3B82F6;--soft:#DBEAFE;--bord:#93C5FD;--ticon:#1D4ED8}
[data-t=grey]    {--from:#E5E7EB;--to:#F9FAFB;--tink:#374151;--ring:#D1D5DB;--edge:#9CA3AF;--soft:#F3F4F6;--bord:#D1D5DB;--ticon:#374151}
[data-t=green]   {--from:#BBF7D0;--to:#F0FDF4;--tink:#166534;--ring:#86EFAC;--edge:#22C55E;--soft:#DCFCE7;--bord:#86EFAC;--ticon:#15803D}

*{box-sizing:border-box}
body{margin:0;background:var(--studio);color:var(--ink);font-family:var(--f-lat);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.q{unicode-bidi:plaintext}
[dir=rtl] .app,[dir=rtl] .scr{font-family:var(--f-ar);direction:rtl}
.app a,.scr a{text-decoration:none}
[dir=rtl] .flip svg{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Studio chrome (always LTR) ──────────────────────────────── */
.studio{padding:18px 20px 40px;direction:ltr}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1520px;margin:0 auto 12px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--black);color:#fff}
.note{max-width:1520px;margin:0 auto 14px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.note b{color:var(--ink-2)}
.stage{max-width:1520px;margin:0 auto}
.hscroll{overflow-x:auto}
.report{max-width:1520px;margin:14px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:12.5px}
.report h3{margin:0 0 8px;font-size:13.5px}
.report table{border-collapse:collapse;width:100%}
.report td,.report th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;font-weight:400}
.report th{font-weight:600;color:var(--ink-3)}
.ok{color:#15803D;font-weight:600}.bad{color:#B91C1C;font-weight:600}

/* ── Shared atoms — all of them exist on /delivery today ─────── */
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;font-weight:600;
      background:linear-gradient(to right,var(--from),var(--to));color:var(--tink);box-shadow:inset 0 0 0 1px var(--ring)}
[dir=rtl] .chip{background:linear-gradient(to left,var(--from),var(--to));padding:4px 10px 4px 12px}
.chip svg{width:14px;height:14px;stroke-width:2}
.chip .dot{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--edge);flex:0 0 auto}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;
     color:var(--tink);box-shadow:inset 0 0 0 1px var(--ring)}
.thumb{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--ink-4);overflow:hidden;flex:0 0 auto;font-size:19px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn-o:hover{background:var(--soft)}
.btn-o[data-tone]{border-color:var(--bord)}
.btn-o[data-tone] svg{color:var(--ticon)}
.btn-sq{width:44px;height:44px;border:1px solid var(--brand-line);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.btn-sq:hover{background:var(--brand-tint)}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 16px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn-p:hover{background:#166534}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--brand-line);background:var(--brand-tint);font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill svg{width:16px;height:16px;color:var(--brand)}
.pill b{color:var(--ink);font-weight:600}
.money{white-space:nowrap}
.money .v{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.skel{border-radius:10px;background:linear-gradient(90deg,#EFF0F2 25%,#F8F9FA 50%,#EFF0F2 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
mark{background:#FEF3C7;color:inherit;border-radius:3px;padding:0 2px}

/* ── The shell — identical on every tab, which is the point ──── */
.app{min-width:1180px;height:1020px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:start}
.top{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .brand{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--brand-deep)}
.top .brand i{font-style:normal;color:var(--brand)}
.top .mkt{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:12px}
.top .mkt svg{width:14px;height:14px}
/* Tabs: one soft track, the active tab a white pill — no underline, no hard edges,
   a 180 ms ease on colour and background so a switch feels like a slide, not a jump. */
.tabs{display:flex;align-items:center;gap:2px;height:52px;padding:4px;margin-inline-start:auto;border-radius:14px;background:var(--sunk);min-width:0;flex-shrink:1}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;min-width:0;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .18s ease,color .18s ease}
.tabs a svg{width:16px;height:16px;opacity:.7;transition:opacity .18s ease}
.tabs a:hover{color:var(--ink);background:rgba(255,255,255,.55)}
.tabs a[aria-current=page]{color:var(--brand);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tabs a[aria-current=page] svg{opacity:1}
.tabs a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--wa-soft);color:var(--brand);font-size:12px;font-weight:700}
/* Sub-tabs: the same soft track, counts as small pills, nothing bordered. */
.segs{display:inline-flex;gap:2px;height:52px;padding:4px;border-radius:14px;background:var(--sunk);margin-bottom:12px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.segs button{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .18s ease,color .18s ease}
.segs button:hover{color:var(--ink);background:rgba(255,255,255,.55)}
.segs button[aria-pressed=true]{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.segs button .dot{width:7px;height:7px}
.segs button b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:rgba(17,24,39,.07);color:var(--ink-2);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .18s ease,color .18s ease}
.segs button[aria-pressed=true] b{background:var(--brand-tint);color:var(--brand)}
.segs button[data-zero]{color:var(--ink-3)}.segs button[data-zero] b{color:var(--ink-3)}
/* The gentle tag: a flat tint, its ink, a dot — no gradient, no ring. Same 14 tones. */
.tagg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;font-weight:600;background:var(--soft);color:var(--tink)}
[dir=rtl] .tagg{padding:5px 9px 5px 11px}
.tagg .dot{width:7px;height:7px}
.tagg svg{width:14px;height:14px;stroke-width:2;color:var(--ticon);opacity:.9}
.tagg small{font-weight:500;opacity:.85}
/* The drawer placeholder — the existing OrderDetailPanel opens here, unchanged. */
.veil{position:absolute;inset:0;background:rgba(17,24,39,.28);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:480px;max-width:100%;height:100%;background:#fff;border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;height:60px;padding:0 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dh .x{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.drawer .dh .x:hover{background:var(--sunk)}
.drawer .ph{flex:1;display:grid;place-items:center;text-align:center;padding:40px;color:var(--ink-3);border:0}
.drawer .ph .box{border:1.5px dashed var(--line-2);border-radius:14px;padding:28px 24px;max-width:340px;background:var(--soft)}
.drawer .ph b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.drawer .ph p{margin:0;font-size:13.5px;line-height:1.55}
/* The search slot: same width on every tab, so nothing to its right ever moves. */
.slot-search{flex:1 1 340px;min-width:300px;display:flex;justify-content:center;padding:0 16px}
.search{position:relative;width:100%;min-width:260px;max-width:560px}
.search .field{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-3)}
[dir=rtl] .search .field{padding:0 14px 0 8px}
.search .field:focus-within,.search[data-open=true] .field{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}
.search input::-webkit-search-cancel-button,.mbar input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search kbd{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);font-size:11px;font-weight:700;color:var(--ink-3);font-family:inherit}
.search .cnt{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.slot-end{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.presence{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--brand-tint);border:1px solid var(--brand-line);font-size:13px;font-weight:500;color:#14532D;white-space:nowrap}
.presence .dot{width:7px;height:7px;background:#22C55E}
.presence small{display:block;font-size:11px;color:var(--ink-3)}
.presence[data-on=false]{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.presence[data-on=false] .dot{background:#EF4444}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.bell:hover{background:var(--sunk)}
.bell b{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#B98900;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 4px;border-radius:10px;border:1px solid transparent}
.me:hover{border-color:var(--line);background:var(--soft)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2)}
.me span{font-size:14px;font-weight:700}
.me svg{width:16px;height:16px;color:var(--ink-3)}

/* ── Page body: list + sticky aside, the delivery grid ───────── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;padding:16px 20px 0}
.left{min-width:0;display:flex;flex-direction:column;min-height:0}
.right{min-width:0;min-height:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.head .ttl{display:flex;align-items:flex-start;gap:10px}
.head svg.hero{width:30px;height:30px;color:var(--brand);margin-top:3px;stroke-width:1.9}
.head h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.head .sub{color:var(--ink-3);font-size:14px;margin-top:2px;unicode-bidi:plaintext}
.head .end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
.strip.c4{grid-template-columns:repeat(4,1fr)}
.strip.c6{grid-template-columns:repeat(6,1fr)}
.strip button{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border-inline-start:1px solid var(--line);text-align:start;min-width:0}
.strip button:first-child{border-inline-start:0}
.strip button:hover{background:var(--soft)}
.strip .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.strip .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .l b{margin-inline-start:auto;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding-inline-start:8px}
.strip .s{font-size:12.5px;color:var(--ink-3);unicode-bidi:plaintext}
.strip button[aria-pressed=true]{background:var(--brand-tint);box-shadow:inset 0 -2px 0 var(--brand)}
.strip button[aria-pressed=true] .l{color:var(--ink);font-weight:700}
.strip button[data-zero] .l,.strip button[data-zero] .s{color:var(--ink-3)}
.strip button[data-zero] .l b{color:var(--ink-3)}
.thead{display:grid;gap:16px;padding:4px 16px 8px 20px;font-size:12px;font-weight:500;color:var(--ink-3)}
.thead.yard{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(216px,auto) minmax(88px,auto)}
.thead.orders{grid-template-columns:minmax(0,1fr) 210px 96px 120px 100px}
.thead.orders .n{text-align:end}
.thead.comm{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 120px minmax(100px,auto)}
.thead .e{text-align:end}
.rows{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px;scrollbar-width:thin}
.row{position:relative;display:grid;gap:16px;align-items:center;padding:10px 16px 10px 20px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.row.yard{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(216px,auto) minmax(88px,auto)}
.row.orders{grid-template-columns:minmax(0,1fr) 210px 96px 120px 100px;padding:12px 16px 12px 20px;min-height:68px}
.row.orders .thumb{width:40px;height:40px}
.c-time{font-size:13.5px;color:var(--ink-2);text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-time[data-late]{color:var(--ink);font-weight:600}
.c-time[data-none]{color:var(--ink-4)}
.c-time small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.body.single{grid-template-columns:minmax(0,1fr)}
.body:not(.single) .row.orders,.body:not(.single) .thead.orders{grid-template-columns:minmax(0,1fr) 190px 80px 110px 92px}
.row.comm{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 120px minmax(100px,auto)}
.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--edge)}
.row:hover{border-color:var(--line-strong)}
.row[aria-selected=true]{border:1.5px solid var(--brand);background:var(--brand-tint)}
.c-sit{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}

/* ═════════ The queue situation model — one hue per situation ═════════
   Aligned with SIT_TONE on /delivery wherever the meaning is the same:
   amber = ne répond pas, orange = rappel dépassé, blue = rappel prévu,
   green = livrée, grey = rien à faire. The confirmation phase adds
   yellow (sans appel), teal (confirmée, à envoyer), indigo (envoi programmé),
   slate (chez le transporteur), red/rose/stone for the three endings.
   Violet stays reserved for « client à risque », which is a TAG here. */
const SIT={
 new:            {tone:'grey',   icon:'inbox'},
 new_late:       {tone:'yellow', icon:'alarm'},
 no_answer:      {tone:'amber',  icon:'phoneoff'},
 callback_due:   {tone:'orange', icon:'alarm'},
 callback_ahead: {tone:'blue',   icon:'calclock'},
 confirmed:      {tone:'teal',   icon:'circlecheck'},
 dispatch:       {tone:'indigo', icon:'hourglass'},
 uploaded:       {tone:'slate',  icon:'send'},
 delivered:      {tone:'green',  icon:'circlecheck'},
 returned:       {tone:'red',    icon:'undo'},
 rejected:       {tone:'rose',   icon:'ban'},
 cancelled:      {tone:'stone',  icon:'pause'}
};

/* One search field, rendered on every tab — the reflow is gone because the
   slot exists whether or not the tab has anything of its own to filter. */
function searchField(){

    </div>

/* ═════════ The predictive index — every tab, every order type ═════════
   In React these four groups read the SWR caches that are already warm
   (/api/agent/queue, ?include=closed, /api/delivery/worklist,
   /api/agent/leads/queue) plus GET /api/agent/search for anything older. */
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ْ]/g,"");
const digits=s=>String(s||"").replace(/\D/g,"");
function hit(hay,q){
  const term=norm(q.trim()); if(term.length<2) return false;
  const d=digits(term);
  if(d.length>=3&&digits(hay.phones).includes(d)) return true;
  return norm(hay.text).includes(term);
}
function matches(q){
  if(!q||q.trim().length<2) return {groups:[],total:0};
  const G=[];
  const ord=ORDERS.filter(o=>hit({text:[o.name,o.nf,o.city,o.cityf,o.prod,PF[o.prod],o.ref,o.note].join(" "),phones:o.ph+o.ph2},q)).slice(0,5);
  const par=PARCELS.filter(o=>hit({text:[o.name,o.nf,o.city,o.cityf,o.addr,o.ref].join(" "),phones:o.ph},q)).slice(0,5);
  const led=LEADS.filter(o=>hit({text:[o.name,o.nf,o.city,o.cityf].join(" "),phones:o.ph},q)).slice(0,5);
  const arc=ARCHIVE.filter(o=>hit({text:[o.name,o.nf,o.city,o.cityf,o.ref].join(" "),phones:o.ph},q)).slice(0,5);
  if(ord.length) G.push({k:"orders",label:t().gOrders,icon:"bag",rows:ord});
  if(par.length) G.push({k:"delivery",label:t().gDelivery,icon:"truck",rows:par});
  if(led.length) G.push({k:"leads",label:t().gLeads,icon:"people",rows:led});
  if(arc.length) G.push({k:"archive",label:t().gArchive,icon:"archive",rows:arc});
  return {groups:G,total:G.reduce((n,g)=>n+g.rows.length,0)};
}
function mark(s,q){
  const term=q.trim(); if(term.length<2) return esc(s);
  const i=norm(s).indexOf(norm(term)); if(i<0) return esc(s);
  return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+term.length))+"</mark>"+esc(s.slice(i+term.length));
}
function suggestions(){
  const {groups,total}=matches(S.q);
  if(!S.q||S.q.trim().length<2){
    return `<div class="sugg" id="sugg" role="listbox">
      <div class="gh">${I.clock}<span>${t().gRecent}</span><button class="n" id="clearhist">${t().clearHist}</button></div>
      ${RECENT.map(r=>`<button class="rc" data-recent="${esc(r)}">${I.clock}<span>${esc(r)}</span></button>`).join("")}
      <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> ${t().kHint}</span></div></div>`;
  }
  if(!total) return `<div class="sugg" id="sugg" role="listbox"><div class="empty" style="padding:28px 20px">${I.search}<h3>${t().emptyT}</h3><p>${t().emptyS}</p></div></div>`;
  let ix=-1;
  const body=groups.map(g=>{
    const rows=g.rows.map(r=>{
      ix++;
      const sel=ix===S.sugIx;
      let chipHtml,meta;
      if(g.k==="orders"){ chipHtml=tagg(SIT[r.sit].tone,t().sit[r.sit],null,SIT[r.sit].icon); meta=`#${r.ref} · ${cty(r)} · ${r.ph}`; }
      else if(g.k==="delivery"){ chipHtml=tagg(({stalled:"stone",due:"orange",no_answer:"amber",delayed:"indigo",returning:"red",waiting_carrier:"grey",address:"teal"})[r.sit],t().dSit[r.sit]); meta=`#${r.ref} · ${cty(r)} · ${r.ph}`; }
      else if(g.k==="leads"){ chipHtml=tagg(r.tone,isAr()?r.st:r.stf); meta=`${cty(r)} · ${r.ph}`; }
      else { chipHtml=tagg(SIT[r.sit].tone,t().sit[r.sit],null,SIT[r.sit].icon); meta=`#${r.ref} · ${cty(r)} · ${isAr()?r.when:r.whenF}`; }
      return `<button class="opt" role="option" aria-selected="${sel}" data-go="${g.k}:${r.id}">
        ${chipHtml}
        <span><span class="nm">${mark(nm(r),S.q)}</span><span class="mt">${mark(meta,S.q)}</span></span>
        <span class="am">${r.amt?money(r.amt):""}</span></button>`;
    }).join("");
    return `<div class="gh">${I[g.icon]}<span>${g.label}</span><span class="n">${g.rows.length}</span></div>${rows}`;
  }).join("");
  return `<div class="sugg" id="sugg" role="listbox">${body}
    <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> ${t().kHint}</span><span style="margin-inline-start:auto">${t().fieldHints}</span></div></div>`;
}

        <div class="nm"><b>${it.type==="payout"?t().cPaid:it.type==="adjustment"?t().cAdj:k==="reversal"?t().cCorr(it.corrections):t().cDay(it.delivered)}</b></div>

/* ═════════ Checks — the brief's constraints, measured not asserted ═════════ */
function lum(hex){
  const c=hex.replace("#","").match(/../g).map(h=>{const v=parseInt(h,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}
const ratio=(a,b)=>{const [x,y]=[lum(a),lum(b)].sort((m,n)=>n-m);return (x+.05)/(y+.05)};
const TONE_HEX={red:["#991B1B","#FECACA"],rose:["#9F1239","#FECDD3"],fuchsia:["#86198F","#F5D0FE"],violet:["#5B21B6","#DDD6FE"],
 orange:["#9A3412","#FED7AA"],amber:["#92400E","#FDE68A"],yellow:["#854D0E","#FEF08A"],teal:["#115E59","#99F6E4"],
 indigo:["#3730A3","#C7D2FE"],stone:["#44403C","#D6D3D1"],slate:["#334155","#CBD5E1"],blue:["#1D4ED8","#BFDBFE"],
 grey:["#374151","#E5E7EB"],green:["#166534","#BBF7D0"]};
const USED={new:"grey",new_late:"yellow",no_answer:"amber",callback_due:"orange",callback_ahead:"blue",confirmed:"teal",
 dispatch:"indigo",uploaded:"slate",delivered:"green",returned:"red",rejected:"rose",cancelled:"stone"};
function contrastReport(){
  const rows=Object.keys(USED).map(k=>{
    const tone=USED[k],[ink,bg]=TONE_HEX[tone],r=ratio(ink,bg);
    return `<tr><td>${k}</td><td>${tone}</td><td class="num">${ink} / ${bg}</td><td class="num ${r>=4.5?"ok":"bad"}">${r.toFixed(2)}:1</td><td>${r>=4.5?"AA":"échec"}</td></tr>`;
  }).join("");
  const extra=[["ink sur surface","#111827","#FFFFFF"],["ink-2 sur surface","#374151","#FFFFFF"],["ink-3 sur surface","#6B7280","#FFFFFF"],
    ["blanc sur brand","#FFFFFF","#15803D"],["brand sur tint","#15803D","#F0FDF4"],["ink-3 sur ground","#6B7280","#FAFAF9"]]
    .map(([l,a,b])=>{const r=ratio(a,b);return `<tr><td>${l}</td><td>—</td><td class="num">${a} / ${b}</td><td class="num ${r>=4.5?"ok":"bad"}">${r.toFixed(2)}:1</td><td>${r>=4.5?"AA":"échec"}</td></tr>`}).join("");
  return `<div class="report"><h3>Contraste — chaque teinte de situation sur sa pastille, et le texte courant (cible ≥ 4,5:1)</h3>
    <table><tr><th>Situation</th><th>Teinte</th><th>Encre / fond</th><th>Ratio</th><th>WCAG AA</th></tr>${rows}${extra}</table></div>`;
}
function touchReport(){
  const bad=[];
  document.querySelectorAll(".scr button,.scr a,.scr input,.app button,.app a,.app input").forEach(el=>{
    // The tap target of a text field is the pill that wraps it, not the text box.
    const target=el.tagName==="INPUT"?(el.closest(".field")||el.closest("label")||el):el;
    const r=target.getBoundingClientRect();
    if(r.width<1||r.height<1) return;
    if(r.height<44||r.width<44){
      const lbl=((el.getAttribute("aria-label")||el.textContent||el.tagName).trim().replace(/\s+/g," ").slice(0,44))||el.tagName;
      if(bad.some(x=>x.lbl===lbl&&x.w===Math.round(r.width))) return;
      bad.push({lbl,w:Math.round(r.width),h:Math.round(r.height)});
      target.style.outline="2px dashed #B91C1C";target.style.outlineOffset="1px";
    }
  });
  return `<div class="report"><h3>Cibles tactiles — tout ce qui est cliquable doit faire ≥ 44 px (${S.view==="mobile"?"vue mobile":"vue bureau"})</h3>
    ${bad.length?`<table><tr><th>Élément</th><th>Largeur</th><th>Hauteur</th></tr>${bad.map(b=>`<tr><td>${esc(b.lbl)}</td><td class="num ${b.w<44?"bad":"ok"}">${b.w}</td><td class="num ${b.h<44?"bad":"ok"}">${b.h}</td></tr>`).join("")}</table>
      <p style="margin:8px 0 0;color:var(--ink-3)">Entourés en rouge dans la maquette. Les icônes décoratives ne sont pas comptées.</p>`
    :`<p class="ok" style="margin:0">Aucune cible sous 44 px.</p>`}</div>`;
}
</script>

<script>
/* ═════════ Render + boot ═════════ */
const NOTES={
 orders:`<b>Écran 1 — Commandes (révision 4, 2026-09-19 : les captures du propriétaire, reproduites).</b> Bureau : la rangée de titre porte le champ de recherche et les trois compteurs, puis les quatre paniers en puces bordées, et la table (case, vignette ×N, client + produit, activité <span class="num">n / 8</span> + dernier appel, âge avec sa jauge, montant) à côté du <b>panneau existant</b>, reproduit tel quel — en-tête, bloc client, grille de faits, onglets, produit, et les quatre issues en <b>icône + nom</b>, sans description. Téléphone : les puces, la recherche, des cartes en deux rangées (client · montant / produit · âge · tentatives) avec un <b>petit bouton d'appel</b> au bout de la rangée. Toucher la carte ouvre <b>le panneau de commande</b> ; toucher le bouton d'appel ouvre la feuille « نتيجة المكالمة » à quatre issues.`,
 search:`<b>Écran 2 — Navigation + recherche.</b> L'en-tête est rendu à l'identique sur les quatre onglets : même ordre d'emplacements, même largeur de champ. Aujourd'hui le champ n'existe que sur la file, donc tout le bloc de droite glisse quand on change d'onglet — active la <b>Règle</b> pour vérifier que les repères ne bougent plus. La liste déroulante est celle des recherches récentes, agrandie : elle groupe par onglet — Commandes (tous les paniers), Livraison, Prospects, puis « Plus anciennes » qui vient du serveur au-delà de la fenêtre de 7 jours. Tape <code>محمود</code>, <code>091</code> ou <code>Benghazi</code>.`,
 commissions:`<b>Écran 3 — Commissions.</b> La carte unique de 640 px devient la charpente de la livraison : bande de paniers par type d'écriture (livrées, corrections, paiements, ajustements) avec la somme sous chaque compte, en-têtes de colonnes, lignes à liseré et pastille, et le résumé (À recevoir, ce mois, en cours, dernier paiement) déplacé dans le panneau collant. Les jours s'ouvrent toujours sur leurs commandes. La période devient un choix dans « Filtrer » au lieu du bouton « Voir plus ».`,
 delivery:`<b>Étalon — /delivery tel qu'il est en production.</b> Reproduit ici pour comparer côte à côte : c'est de cet écran que viennent la pastille en dégradé, le liseré, la bande de paniers, les en-têtes de colonnes, le panneau collant et les deux emplacements d'action. Rien n'a été inventé pour les trois autres écrans.`
};
function render(){
  document.documentElement.dir=isAr()?"rtl":"ltr";
  document.documentElement.lang=S.lang;
  document.getElementById("note").innerHTML=NOTES[S.screen]||"";
  [["segLang","lang"],["segView","view"],["segScreen","screen"],["segState","state"],["segCheck","check"]].forEach(([id,key])=>{
    document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[key]));
  });
  const screen=S.screen==="search"?"orders":S.screen;
  const active=screen==="commissions"?"commissions":screen==="delivery"?"delivery":"orders";
  const stage=document.getElementById("stage");
  if(S.view==="mobile"){
    let inner;
    if(S.mobileSearch) inner=mSearch();
    else if(screen==="commissions") inner=mCommissions();
    else if(screen==="delivery") inner=mDelivery();
    else if(S.mPanel&&screen==="orders") inner=mPanel(S.mPanel);
    else inner=mOrders(S.sheet);
    // Three phones: the list, the panel a row opens, the sheet the call button opens.
    const extra=(!S.mobileSearch&&!S.mPanel&&!S.sheet&&screen==="orders")
      ?`<div class="pwrap"><p class="cap">${S.screen} · ${S.lang} · ${isAr()?"لوحة الطلب":"panneau"}</p><div class="scr">${mPanel(MOB[0])}</div></div>`
      +`<div class="pwrap"><p class="cap">${S.screen} · ${S.lang} · ${isAr()?"نتيجة المكالمة":"résultat de l'appel"}</p><div class="scr">${mOrders(MOB[0])}</div></div>`:"";
    stage.innerHTML=`<div class="phones"><div class="pwrap"><p class="cap">${S.screen} · ${S.lang}</p><div class="scr">${inner}</div></div>${extra}</div>`;
  }else{
    const body=screen==="commissions"?screenCommissions():screen==="delivery"?screenDelivery():screenOrders();
    stage.innerHTML=`<div class="hscroll"><div class="app ${screen==="orders"?"orders-app":""}">${topbar(active)}${body}${S.check==="ruler"?ruler():""}</div></div>`;
  }
  const rep=document.getElementById("report");
  rep.innerHTML=S.check==="contrast"?contrastReport():"";
  if(S.check==="geom") setTimeout(()=>{
    const app=document.querySelector(".app")?.getBoundingClientRect();
    const meta="viewport="+document.documentElement.clientWidth+" app="+Math.round(app?.width||0)+" top="+Math.round(document.querySelector(".top")?.getBoundingClientRect().width||0)+" tabsA=["+[...document.querySelectorAll(".tabs a")].map(a=>Math.round(a.getBoundingClientRect().width)).join(",")+"] | ";
    const out=[meta].concat([".tabs",".slot-search",".search .field",".slot-end"].map(sel=>{
      const e=document.querySelector(sel); if(!e||!app) return sel+"=absent";
      const r=e.getBoundingClientRect();
      return sel+" x="+Math.round(r.left-app.left)+" w="+Math.round(r.width);
    })).join(" | ");
    rep.innerHTML='<div class="report"><pre id="geom">'+out+'</pre></div>';
  },500);
  // Measured after the webfonts land and one frame has been laid out —
  // measuring during render reads half-built boxes and lies about widths.
  if(S.check==="touch"){
    rep.innerHTML=`<div class="report"><p>${t().loading}</p></div>`;
    setTimeout(()=>{rep.innerHTML=touchReport()},500);
  }
  if(S.suggOpen){const i=document.getElementById("q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
  if(S.mobileSearch){const i=document.getElementById("q");if(i)i.focus();}
  const u=new URLSearchParams({lang:S.lang,view:S.view,screen:S.screen,tab:S.tab,state:S.state});
  if(S.open)u.set("open",S.open); if(S.q)u.set("q",S.q); if(S.check!=="off")u.set("check",S.check);
  history.replaceState(null,"",location.pathname+"?"+u);
}
/* The ruler measures the four slot boundaries in the real DOM — if a screen
   moved them, the labels would differ between tabs. */
function ruler(){
  return `<div class="ruler" id="ruler"></div>`;
}
function drawRuler(){
  const r=document.getElementById("ruler"); if(!r) return;
  const app=r.parentElement.getBoundingClientRect();
  const marks=[[".tabs","tabs"],[".slot-search","search"],[".slot-end","fin"]];
  r.innerHTML=marks.map(([sel,l])=>{
    const el=document.querySelector(sel); if(!el) return "";
    const b=el.getBoundingClientRect();
    const x1=Math.round(b.left-app.left), x2=Math.round(b.right-app.left);
    return `<i style="left:${x1}px" data-l="${l} ${x1}"></i><i style="left:${x2}px" data-l="${x2}"></i>`;
  }).join("");
}
/* ═════════ Events ═════════ */
document.addEventListener("click",e=>{
  const seg=e.target.closest("#segLang button,#segView button,#segScreen button,#segState button,#segCheck button");
  if(seg){
    const key={segLang:"lang",segView:"view",segScreen:"screen",segState:"state",segCheck:"check"}[seg.parentElement.id];
    S[key]=seg.dataset.v;
    if(key==="screen"){S.suggOpen=S.screen==="search";S.mobileSearch=S.view==="mobile"&&S.screen==="search";S.pop=null;S.mPanel=null;S.sheet=null;
      if(S.screen==="search"&&!S.q)S.q=isAr()?"محمود":"Mahmoud";}
    if(key==="check"&&seg.dataset.v==="off")document.getElementById("report").innerHTML="";
    return render(),drawRuler();
  }
  const tab=e.target.closest("[data-screen]");
  if(tab){e.preventDefault();const s=tab.dataset.screen;S.screen=s==="leads"?"orders":s;S.suggOpen=false;S.mobileSearch=false;S.mPanel=null;S.sheet=null;S.pop=null;return render(),drawRuler();}
  const b=e.target.closest("[data-tab]"); if(b){S.tab=b.dataset.tab;S.open=null;S.mPanel=null;S.sheet=null;return render(),drawRuler();}
  const d=e.target.closest("[data-dtab]"); if(d){S.dTab=d.dataset.dtab;return render(),drawRuler();}
  const c=e.target.closest("[data-ctab]"); if(c){S.cTab=c.dataset.ctab;return render(),drawRuler();}
  const tog=e.target.closest("[data-ctog]"); if(tog){const i=+tog.dataset.ctog;S.cOpen=S.cOpen===i?null:i;return render();}
  if(e.target.closest("#fbtn")){S.pop=S.pop==="filter"?null:"filter";return render();}
  if(e.target.closest("#sbtn")){S.pop=S.pop==="sort"?null:"sort";return render();}
  if(e.target.closest("#qclear")){S.q="";S.sugIx=0;return render();}
  if(e.target.closest("#clearhist")){RECENT.length=0;return render();}
  if(e.target.closest("#mopen")){S.mobileSearch=true;return render();}
  if(e.target.closest("#mback")){S.mobileSearch=false;S.mPanel=null;return render();}
  if(e.target.closest("#closePanel")){S.open=null;return render(),drawRuler();}
  const rec=e.target.closest("[data-recent]"); if(rec){S.q=rec.dataset.recent;S.sugIx=0;return render();}
  const go=e.target.closest("[data-go]");
  if(go){
    const [g,id]=go.dataset.go.split(":");
    S.suggOpen=false;S.mobileSearch=false;S.q="";
    if(g==="orders"){const o=ORDERS.find(x=>x.id===id);S.screen="orders";S.tab=BUCKET_OF[o.sit];S.open=id;if(S.view==="mobile")S.mPanel=id;}
    else if(g==="delivery"){S.screen="delivery";S.open=id;}
    else if(g==="archive"){S.screen="orders";S.tab="fermees";}
    else S.screen="orders";
    return render(),drawRuler();
  }
  if(e.target.closest("#sheetclose")||e.target.id==="sheetveil"){S.sheet=null;return render();}
  const call=e.target.closest("[data-mcall]"); if(call){S.sheet=call.dataset.mcall;return render();}
  const mo=e.target.closest("[data-mopen]"); if(mo){S.mPanel=mo.dataset.mopen;S.open=mo.dataset.mopen;return render();}
  const row=e.target.closest("[data-open]");
  if(row){S.open=row.dataset.open;return render(),drawRuler();}
  if(!e.target.closest(".search")){if(S.suggOpen){S.suggOpen=false;render();}}
  if(!e.target.closest(".rel")&&S.pop){S.pop=null;render();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;S.sugIx=0;S.suggOpen=true;
    const pos=e.target.selectionStart;render();
    const i=document.getElementById("q");if(i){i.focus();i.setSelectionRange(pos,pos);}}
});
document.addEventListener("focusin",e=>{if(e.target.id==="q"&&S.view!=="mobile"&&!S.suggOpen){S.suggOpen=true;render();}});
document.addEventListener("keydown",e=>{
  const inField=e.target.id==="q";
  /* "/" focuses the search on EVERY tab — today the handler lives in QueuePage. */
  if(e.key==="/"&&!inField&&!/INPUT|TEXTAREA/.test(e.target.tagName)){
    e.preventDefault();
    if(S.view==="mobile"){S.mobileSearch=true;render();}
    else{S.suggOpen=true;render();document.getElementById("q").focus();}
    return;
  }
  if(!S.suggOpen&&!S.mobileSearch) return;
  const {total}=matches(S.q);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    if(!total) return;
    S.sugIx=(S.sugIx+(e.key==="ArrowDown"?1:-1)+total)%total;
    const pos=document.getElementById("q")?.selectionStart??0;
    render();const i=document.getElementById("q");if(i){i.focus();i.setSelectionRange(pos,pos);}
  }
  if(e.key==="Enter"){
    const opt=document.querySelectorAll("[data-go]")[S.sugIx];
    if(opt){e.preventDefault();opt.click();}
  }
  if(e.key==="Escape"){
    e.preventDefault();
    if(S.q){S.q="";render();const i=document.getElementById("q");if(i)i.focus();}
    else{S.suggOpen=false;S.mobileSearch=false;render();}
  }
});
if(S.screen==="search"){S.suggOpen=S.view!=="mobile";S.mobileSearch=S.view==="mobile";if(!S.q)S.q=isAr()?"محمود":"Mahmoud";}
render();drawRuler();
window.addEventListener("resize",drawRuler);
</script>
