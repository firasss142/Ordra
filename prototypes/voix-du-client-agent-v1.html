<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ordra — Voix du client, côté agent (v1)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v1 — « Voix du client / صوت العميل » vu par l'AGENT. Construit 2026-09-30.
  Plan : plans/voix-du-client.md (Phase 0 — rien sous src/ ni supabase/ avant validation).
  Ce qui est montré :
   · ?screen=queue   La file + le panneau de commande EXISTANT (non redessiné). Touche F (ou le bouton
                     « صوت العميل » de l'en-tête du panneau) → la fenêtre de saisie, LIÉE à la commande :
                     client, téléphone, produit, et ce que ce client a déjà dit (1 réclamation ouverte).
   · ?screen=multi   Même chose sur une commande à 2 produits : l'agent choisit la ligne concernée.
   · ?screen=blank   Aucune commande ouverte : F ouvre la fenêtre en mode libre — recherche client /
                     commande (nom, téléphone, n°) avec suggestions, puis produit avec suggestions.
   · ?screen=mine    Le nouvel onglet agent « صوت العميل » : ses retours, en feuille, filtres + recherche,
                     statut de ses réclamations en lecture seule.
   · ?screen=reject  Refus avec le groupe « Autre » : la note est proposée comme retour client, type
                     suggéré d'après les mots de la note.
   · ?view=mobile    La fenêtre de saisie en feuille basse sur téléphone (bouton, pas de touche F).
  Clavier (essayez-le) : F ouvrir · 1–7 type · Ctrl/⌘+Entrée enregistrer · Échap fermer.
  F est lu sur e.code (« KeyF »), pas e.key : il marche aussi en clavier arabe, où cette touche tape « ب ».
  Données RÉELLES (Libye, lues le 2026-09-30) : produits et prix habituels (orders.total_price, mode sur
  30 j), libellés des motifs de rejet (rejection_reason_configs), et les phrases des clients — ce sont
  des notes « Autre » réelles. AUCUNE donnée client réelle : noms et téléphones sont inventés.
  Tokens et atomes : copiés de prototypes/whatsapp-agent-v1.html (lui-même agent-shell-v1 +
  OrderDetailPanel). Teintes des types = la table du plan, partagée avec voix-du-client-manager-v1.html.
  URL : ?lang=ar|fr &view=desktop|mobile &screen=queue|multi|blank|mine|reject
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --soft:#F9FAFB; --sunk:#F3F4F6;
  --line:#E5E7EB; --line-2:#D1D5DB; --line-strong:#C9CCCF;
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280; --ink-4:#9CA3AF;
  --brand:#15803D; --brand-deep:#14532D; --brand-tint:#F0FDF4; --brand-line:#BBF7D0;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FCD34D;
  --bad:#B91C1C; --bad-bg:#FEF2F2; --bad-line:#FECACA;
  --black:#111111; --studio:#E9EBEF;
  --g-red:#D72C0D; --g-amber:#B98900; --g-violet:#7C3AED; --g-teal:#0E7490; --g-neutral:#8C9196;
  --f-lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
}
/* Feedback TYPES — the plan's table; the manager prototype uses the same values. */
[data-ft=complaint]{--tb:#FEE2E2;--ti:#991B1B;--td:#EF4444}
[data-ft=product]  {--tb:#EDE9FE;--ti:#5B21B6;--td:#8B5CF6}
[data-ft=price]    {--tb:#FEF3C7;--ti:#92400E;--td:#F59E0B}
[data-ft=payment]  {--tb:#CCFBF1;--ti:#115E59;--td:#14B8A6}
[data-ft=delivery] {--tb:#DBEAFE;--ti:#1D4ED8;--td:#3B82F6}
[data-ft=request]  {--tb:#E0E7FF;--ti:#3730A3;--td:#6366F1}
[data-ft=praise]   {--tb:#DCFCE7;--ti:#166534;--td:#22C55E}

*{box-sizing:border-box}
body{margin:0;background:var(--studio);color:var(--ink);font-family:var(--f-lat);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.q{unicode-bidi:plaintext}
.app,.scr{font-family:var(--f-lat)}
.app[dir=rtl],.scr[dir=rtl]{font-family:var(--f-ar)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:#fff;font:700 11px/1 var(--f-lat);color:var(--ink-3)}
[hidden]{display:none!important}

/* ── Studio chrome (always LTR, French — it is for the owner, not the product) ── */
.studio{padding:18px 20px 40px;direction:ltr;font-family:var(--f-lat)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1520px;margin:0 auto 12px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--black);color:#fff}
.note{max-width:1520px;margin:0 auto 14px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.note b{color:var(--ink-2)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:1px 4px;border-radius:4px}
.stage{max-width:1520px;margin:0 auto}
.hscroll{overflow-x:auto}

/* ── Atoms ── */
.thumb{width:44px;height:44px;border-radius:8px;background:#F3F4F6 center/cover no-repeat;flex:0 0 auto}
.thumb.q{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%234B2E2B'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%234B2E2B'/></svg>")}
.thumb.d{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%23123B2F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%23123B2F'/></svg>")}
.thumb.h{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%231F3A5F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%231F3A5F'/></svg>")}
.thumb.t{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%235B2333'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23D8B46A' opacity='.85'/><circle cx='22' cy='22' r='5' fill='%235B2333'/></svg>")}
.thumb.b{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><path d='M22 4v6' stroke='%236B7280' stroke-width='2'/><rect x='14' y='10' width='16' height='28' rx='8' fill='%23B91C1C'/><rect x='14' y='18' width='16' height='3' fill='%23111827' opacity='.35'/></svg>")}
.ftag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;background:var(--tb);color:var(--ti);font-size:12.5px;font-weight:600;white-space:nowrap}
.ftag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--td);flex:0 0 auto}
.stat{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.stat[data-s=open]{background:#FFF4F4;color:#D72C0D}
.stat[data-s=in_progress]{background:#FFF8E6;color:#8A5A00}
.stat[data-s=resolved]{background:#F1F8F5;color:#008060}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.btn-p:hover{background:#166534}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-p kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn-o:hover{background:var(--soft)}

/* ── Shell (agent top bar — AgentNavTabs) ── */
.app{min-width:1180px;height:960px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:start}
.top{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .brand{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--brand-deep);font-family:var(--f-lat)}
.top .brand i{font-style:normal;color:var(--brand)}
.top .mkt{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:12px}
.top .mkt svg{width:14px;height:14px}
.tabs{display:flex;align-items:center;gap:2px;height:52px;padding:4px;margin-inline-start:auto;border-radius:14px;background:var(--sunk)}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;cursor:pointer}
.tabs a svg{width:16px;height:16px;opacity:.7}
.tabs a:hover{background:rgba(255,255,255,.55)}
.tabs a[aria-current=page]{color:var(--brand);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tabs a[aria-current=page] svg{opacity:1}
.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#DCFCE7;color:var(--brand);font-size:12px;font-weight:700}
.tabs a[data-new]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-inline-start:-2px}
.slot-end{display:flex;align-items:center;gap:12px;margin-inline-start:16px}
.presence{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--brand-tint);border:1px solid var(--brand-line);font-size:13px;font-weight:600;color:#14532D;white-space:nowrap}
.presence i{width:7px;height:7px;border-radius:50%;background:#22C55E}
.me{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 4px;border-radius:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2)}
.me span{font-size:14px;font-weight:700}

/* ── Queue (agent-shell-v1 révision 3, as shipped) ── */
.qpage{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 20px 0}
.qh{display:flex;align-items:center;gap:16px;height:52px;flex:0 0 auto}
.qh h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.qh .sub{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.qh .sub i{width:8px;height:8px;border-radius:50%;background:#22C55E}
.qh .meters{margin-inline-start:auto;display:flex}
.qh .mt{display:flex;flex-direction:column;align-items:flex-end;padding:0 14px;border-inline-start:1px solid var(--line)}
.qh .mt:first-child{border-inline-start:0}
.qh .mt .v{font-size:15px;font-weight:700}
.qh .mt .l{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.qchips{display:flex;align-items:center;gap:14px;margin-top:4px}
.qchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.qchip svg{width:17px;height:17px;color:var(--ink-3)}
.qchip b{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:12px;font-weight:700}
.qchip[aria-pressed=true]{border:1.5px solid var(--brand);color:#14532D}
.qchip[aria-pressed=true] svg{color:var(--brand)}
.qchip[aria-pressed=true] b{background:#DCFCE7;color:var(--brand)}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:20px;margin-top:17px;padding-bottom:24px}
.qbody[data-nopanel]{grid-template-columns:minmax(0,1fr)}
.qtable{min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qth,.qrow{display:grid;grid-template-columns:minmax(0,1fr) 190px 80px 92px;gap:16px;align-items:center;padding:0 16px}
.qth{height:34px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-3)}
.qrows{flex:1;min-height:0;overflow-y:auto}
.qrow{min-height:66px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow:hover{background:var(--soft)}
.qrow[aria-selected=true]{box-shadow:inset 0 0 0 1.5px var(--brand);border-radius:8px;border-bottom-color:transparent;background:#fff}
.qid{display:flex;align-items:center;gap:12px;min-width:0}
.qid .nm{font-size:15px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qid .pr{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.qid .pr .fb{display:inline-flex;align-items:center;gap:4px;color:#991B1B;font-weight:600}
.qid .pr .fb svg{width:13px;height:13px}
.c-act{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:13.5px;color:var(--ink-2)}
.c-act .att{display:inline-grid;place-items:center;height:26px;padding:0 8px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;font-weight:600;direction:ltr}
.c-age{direction:ltr;text-align:left;justify-self:left}
.c-age .v{font-size:16px;font-weight:700;display:block}
.c-age .bar{margin-top:6px;width:70px;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.c-age .bar i{display:block;height:100%;background:#F97316}
.c-age[data-tone=red] .v{color:#DC2626}.c-age[data-tone=red] .bar i{background:#DC2626}
.c-amt{direction:ltr;justify-self:left;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.c-amt small{font-size:13px;color:var(--ink-3)} .c-amt b{font-size:17px}
.qfoot{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.qfoot .sp{margin-inline-start:auto;display:flex;align-items:center;gap:6px}

/* ── The EXISTING OrderDetailPanel — three additions only, marked NEW ── */
.qpanel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qpanel .pt{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.qpanel .st{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-size:13.5px;font-weight:600;white-space:nowrap}
.qpanel .st svg{width:15px;height:15px}
.qpanel .late{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:#FEE2E2;color:#B91C1C;font-size:13.5px;font-weight:700;direction:ltr;white-space:nowrap}
.qpanel .late svg{width:15px;height:15px}
.qpanel .ref{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.qpanel .ref svg{width:15px;height:15px;color:var(--ink-3)}
.qpanel .x{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
/* NEW 1/3 — the header button. Outline, quiet, the shortcut printed on it. */
.fbk{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;position:relative}
[dir=rtl] .fbk{padding:0 10px 0 8px}
.fbk:hover{background:var(--soft);color:var(--ink)}
.fbk svg{width:15px;height:15px;color:#6D28D9}
.fbk .n{position:absolute;top:-7px;inset-inline-end:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#EF4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.qpanel .pb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.qpanel .lbl{font-size:12.5px;color:var(--ink-3)}
.qpanel .cust{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 12px}
.qpanel .cust .nm{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.qpanel .cust .cp{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-top:6px}
.qpanel .cust .cp svg{width:15px;height:15px;color:var(--ink-3)}
.qpanel .cust .ctas{margin-inline-start:auto;align-self:center;display:flex;gap:8px}
.qpanel .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.qpanel .fc{padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.qpanel .fc:nth-child(odd){border-inline-end:1px solid var(--line)}
.qpanel .fc .v{font-size:14px;margin-top:3px}
.qpanel .fc .v.big{font-size:17px;font-weight:700}
.qpanel .ptabs{display:flex;gap:26px;padding:0 18px;border-bottom:1px solid var(--line);height:42px;flex:0 0 auto}
.qpanel .ptabs button{height:42px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.qpanel .ptabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.qpanel .pbs{flex:1;min-height:0;overflow-y:auto}
.qpanel .prod{display:flex;align-items:center;gap:12px;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.qpanel .prod .thumb{width:56px;height:56px}
.qpanel .prod .pn{font-size:15px;font-weight:700}
.qpanel .prod .pq{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.qpanel .prod .pa{margin-inline-start:auto;font-size:15px;font-weight:700;direction:ltr;white-space:nowrap}
.qpanel .sub{display:flex;justify-content:space-between;padding:12px 18px;font-size:14px;color:var(--ink-2)}
.qpanel .sub b{font-size:15px;color:var(--ink);direction:ltr}
.qpanel .pf{padding:10px 12px 8px;border-top:1px solid var(--line);flex:0 0 auto}
.qpanel .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qpanel .act{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.qpanel .act svg{width:15px;height:15px;stroke-width:2.2}
.qpanel .act.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.qpanel .act.no{border-color:#F87171;color:#B91C1C}
.qpanel .act.cb2{border-color:#FCD34D;background:#FFFBEB;color:#92400E}
/* NEW 3/3 — F joins the footer hint line. */
.qpanel .hint{margin-top:9px;text-align:center;font-size:12px;color:var(--ink-3)}
.qpanel .hint b{color:#6D28D9;font-weight:700}

/* ── NEW — the capture window (CaptureDialog on ui/Sheet placement="center") ── */
.cveil{position:absolute;inset:0;background:rgba(17,24,39,.34);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:64px}
.cap{width:660px;max-height:calc(100% - 96px);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(17,24,39,.24);display:flex;flex-direction:column;overflow:hidden}

/* blank mode — search with suggestions */
.fld{position:relative}

.sh-h{height:36px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-3);position:sticky;top:0}

.sh-r .vb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;color:var(--ink);font-size:14px}

.phones{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}

const T=()=>L[S.lang], isAr=()=>S.lang==="ar";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=o=>isAr()?o.name:(o.nf||o.name);
const pn=k=>PR[k][S.lang];
const tl=k=>{const x=TYPES.find(y=>y.k===k);return x?x[S.lang]:"";};
const topl=(ty,k)=>{const x=(TOPICS[ty]||[]).find(y=>y[0]===k);return x?(isAr()?x[2]:x[1]):"";};
const ftag=k=>`<span class="ftag" data-ft="${k}">${tl(k)}</span>`;
const digits=s=>String(s).replace(/\D/g,"");
function hl(text,q){
  if(!q) return esc(text);
  const d=digits(q);
  if(d.length>=3){const raw=String(text),rd=digits(raw),i=rd.indexOf(d);if(i<0)return esc(raw);
    let seen=0,a=-1,b=-1;for(let k=0;k<raw.length;k++){if(/\d/.test(raw[k])){if(seen===i)a=k;seen++;if(seen===i+d.length){b=k+1;break;}}}
    return a<0?esc(raw):esc(raw.slice(0,a))+"<mark>"+esc(raw.slice(a,b))+"</mark>"+esc(raw.slice(b));}
  const i=String(text).toLowerCase().indexOf(q.toLowerCase());
  return i<0?esc(text):esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}

  const types=`<div class="types">${TYPES.map(x=>`<button class="tchip" data-ft="${x.k}" data-rtype="${x.k}" aria-pressed="${S.rType===x.k}"><span>${x[S.lang]}</span>${x.k==="payment"?`<span class="sugtag">${t.suggested}</span>`:""}</button>`).join("")}</div>`;
  const topics=S.rType?`<div class="topics">${TOPICS[S.rType].map(([k,f,a])=>`<button class="topic" data-ft="${S.rType}" data-rtopic="${k}" aria-pressed="${S.rTopic===k}">${isAr()?a:f}</button>`).join("")}</div>`:"";
  return `<div class="rveil"><div class="rsheet" role="dialog"><div class="rh"><h3>${t.rTitle}</h3><span class="num">#${o.ref}</span><span class="q">· ${nm(o)}</span><button class="x" data-closer>${I.x}</button></div>
    <div class="rb"><div class="panes"><div>${t.groups.map(([k,l,h])=>`<button class="grp" aria-pressed="${k==="autre"}"><i style="background:var(${hue[h]})"></i><span>${l}</span><span class="chev">${I.chev}</span></button>`).join("")}</div>
      <div class="rdet"><div class="rl">${t.rNote}</div><textarea>قال اريد الدفع بالبطاقة</textarea>
        <div class="offer"><div class="oh">${I.quote}<div><b>${t.offerT}</b><span>${t.offerS}</span></div><button class="sw" role="switch" data-rsw aria-checked="${S.rOn}"></button></div>
          ${S.rOn?types+topics:""}</div></div></div></div>
    <div class="rf"><span style="font-size:12.5px;color:var(--ink-3)">${isAr()?"النوع مقترح من كلمات الملاحظة — «بطاقة» ← الدفع":"Type suggéré d'après les mots de la note — « بطاقة » → Paiement"}</span><span class="sp"><button class="btn-o" data-closer>${t.cancel}</button><button class="btn-no" data-rgo>${I.x}<span>${t.rGo}</span></button></span></div>
  </div></div>`;
}

/* ═════════ Mobile ═════════ */
function mobile(){
  const o=ORDERS.find(x=>x.id===(S.open||"o2"))||ORDERS[1];
  if(S.mode==="blank"&&S.screen==="blank"){S.mode="blank";}
  const sb=`<div class="sbar"><span>9:41</span><span style="display:flex;gap:6px">${I.sig}${I.bat}</span></div>`;
  const phone=(inner,cap)=>`<div class="pwrap"><p class="cap2">${cap}</p><div class="scr" dir="${isAr()?"rtl":"ltr"}">${sb}${inner}<div class="home"></div></div></div>`;
  const a=phone(qPanel(o,true),"1 · Panneau — bouton « صوت العميل » dans l'en-tête");
  const savedOpen=S.open,savedMode=S.mode; if(!S.open&&S.screen!=="blank")S.open="o2";
  const b=phone(qPanel(o,true)+capture(true),"2 · Saisie en feuille basse, liée à la commande");
  S.open=savedOpen;S.mode=savedMode;
  return `<div class="phones">${a}${b}</div>`;
}

/* ═════════ Notes ═════════ */
const NOTES={
 queue:`<b>Panneau + F.</b> Le panneau n'est pas redessiné. Trois ajouts seulement : le bouton <b>« صوت العميل »</b> dans l'en-tête (avec <kbd>F</kbd> imprimé dessus, et une pastille rouge quand ce client a une réclamation ouverte), la mention <b>F</b> dans la ligne d'aide du pied, et la ligne de la file qui signale « شكوى مفتوحة ». La fenêtre est <b>liée</b> : client, téléphone, n° de commande, produit — rien à retaper. Elle montre ce que ce client a déjà dit (ici une réclamation ouverte il y a 4 jours : « حاجزه وموصلتهاش الاوله ») — l'agent sait avant de parler. Essayez : <kbd>Échap</kbd>, puis <kbd>F</kbd> (clavier arabe compris), <kbd>1</kbd>–<kbd>7</kbd> pour le type, tapez une phrase, <kbd>Ctrl</kbd>+<kbd>Entrée</kbd>. Choisir <b>Réclamation</b> affiche le cycle de suivi.`,
 multi:`<b>Commande à 2 produits.</b> Depuis le 25 sept. l'intake garde toutes les lignes (<code>order_items</code>). La fenêtre demande alors « ce retour concerne quel produit ? » — une ligne, ou « toute la commande » (produit vide). C'est ce qui rend le tableau « produit × sujet » juste côté responsable.`,
 blank:`<b>Sans commande ouverte</b> — un client qui rappelle, une remarque entendue hors file. <kbd>F</kbd> depuis la file (aucun panneau) ouvre le mode libre. La recherche client lit <code>customers</code> (téléphone normalisé, ou nom) et les commandes par n°, dans le marché de l'agent seulement ; choisir une commande remplit client <i>et</i> produit. Les deux champs sont facultatifs : « le livreur est passé en retard » n'a pas forcément de produit. Tapez un autre numéro ou un nom (« فاطمة », « Fathi »).`,
 mine:`<b>L'onglet « صوت العميل ».</b> Un 5ᵉ onglet agent (<code>AgentNavTabs</code>). C'est la « feuille » : ses propres retours, filtres par type, recherche dans les mots des clients, <kbd>j</kbd>/<kbd>k</kbd> + <kbd>Entrée</kbd> pour déplier (liens commande · historique client · fiche produit). L'agent voit le <b>statut de ses réclamations</b> en lecture seule — il sait si son responsable a traité. Les phrases sont de vraies notes « Autre » de Libye (mai–sept.). Le bandeau « pour 100 appels » lui montre sa propre régularité.`,
 reject:`<b>Refus « Autre ».</b> 694 refus « Autre » depuis mai (141 sur les 456 refus du 19 au 30 sept., soit 31 %) ; 148 portent un vrai retour. Quand l'agent refuse avec « Autre », un bloc propose d'enregistrer la note comme retour client (activé par défaut), <b>type suggéré</b> d'après les mots (« بطاقة » → Paiement · carte). Un seul geste, aucune ressaisie. Les motifs structurés (« السعر مرتفع », « اشترى من مكان آخر »…) ne créent rien : le tableau de bord les lit directement.`
};

/* ═════════ Render ═════════ */
function render(){
  const ar=isAr();
  document.getElementById("note").innerHTML=NOTES[S.screen]||"";
  [["segLang","lang"],["segView","view"],["segScreen","screen"]].forEach(([id,k])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[k])));
  const stage=document.getElementById("stage");
  if(S.view==="mobile"){stage.innerHTML=mobile();}
  else{
    const active=S.screen==="mine"?4:0;
    const body=S.screen==="mine"?screenMine():screenQueue();
    const over=S.screen==="reject"?rejectSheet():"";
    stage.innerHTML=`<div class="hscroll"><div class="app" dir="${ar?"rtl":"ltr"}" lang="${S.lang}">${topbar(active)}${body}${over}${S.cap?capture(false):""}${toast()}</div></div>`;
  }
  const u=new URLSearchParams({lang:S.lang,view:S.view,screen:S.screen});
  history.replaceState(null,"",location.pathname+"?"+u);
}
function focusAfter(sel){const el=document.querySelector(sel);if(el){el.focus();const v=el.value||"";if(el.setSelectionRange)el.setSelectionRange(v.length,v.length);}}
function rerenderKeep(id){render();focusAfter("#"+id);}

function openCap(){
  if(S.screen==="reject") return;
  const hasPanel=!!ORDERS.find(x=>x.id===S.open)&&S.screen!=="mine";
  S.cap=true;S.mode=hasPanel?"context":"blank";S.type=null;S.topic=null;S.text="";S.line=0;
  S.custQ="";S.prodQ="";S.pickCust=null;S.pickOrder=null;S.pickProd=null;S.focus=S.mode==="blank"?"cust":null;
  render(); focusAfter(S.mode==="blank"?"#custIn":".tchip");
}
function save(){
  if(!(S.type&&S.text.trim())) return;
  const o=ORDERS.find(x=>x.id===S.open);
  let prod=null,c="—",cf="—",ref="—";
  if(S.mode==="context"&&o){prod=S.line>=0?o.lines[S.line]||o.lines[0]:null;c=o.name;cf=o.nf;ref=o.ref;}
  else{ if(S.pickOrder){const p=PAST.find(x=>x.ref===S.pickOrder);prod=p.prod;c=CUSTS[p.cust].name;cf=CUSTS[p.cust].nf;ref=p.ref;}
        else if(S.pickCust!=null){c=CUSTS[S.pickCust].name;cf=CUSTS[S.pickCust].nf;}
        if(S.pickProd)prod=S.pickProd; }
  const entry={id:"n"+Date.now(),d:0,t:new Date().toTimeString().slice(0,5),type:S.type,topic:S.topic,prod,c,cf,ref,text:S.text.trim(),st:S.type==="complaint"?"open":null,fresh:true};
  S.mine.forEach(m=>m.fresh=false); S.mine.unshift(entry);
  if(o&&S.mode==="context"&&S.type==="complaint"){o.hist=o.hist||{n:0,open:0,quote:entry.text};o.hist.n++;o.hist.open++;}
  S.cap=false;S.toast={msg:T().toast,type:S.type,undo:entry.id};render();
  clearTimeout(S.tt);S.tt=setTimeout(()=>{S.toast=null;render();},5000);
}

/* ═════════ Events ═════════ */
document.addEventListener("click",e=>{
  const seg=e.target.closest("#segLang button,#segView button,#segScreen button");
  if(seg){const k={segLang:"lang",segView:"view",segScreen:"screen"}[seg.parentElement.id];S[k]=seg.dataset.v;if(k!=="lang"&&k!=="view")preset();return render();}
  const tab=e.target.closest("[data-tab]"); if(tab){const i=+tab.dataset.tab;if(i===4){S.screen="mine";preset();}else if(i===0){S.screen="queue";preset();S.cap=false;}return render();}
  if(e.target.closest("[data-opencap]")) return openCap();
  if(e.target.closest("[data-closecap]")||e.target.matches("[data-veil]")){S.cap=false;return render();}
  const ty=e.target.closest("[data-type]"); if(ty){S.type=S.type===ty.dataset.type?null:ty.dataset.type;S.topic=null;render();return focusAfter("#ta");}
  const tp=e.target.closest("[data-topic]"); if(tp){S.topic=S.topic===tp.dataset.topic?null:tp.dataset.topic;render();return focusAfter("#ta");}
  const ln=e.target.closest("[data-line]"); if(ln){S.line=+ln.dataset.line;return render();}
  const tm=e.target.closest("[data-tomode]"); if(tm){S.mode="blank";S.focus="cust";render();return focusAfter("#custIn");}
  const pc=e.target.closest("[data-pickcust]"); if(pc){S.pickCust=+pc.dataset.pickcust;S.focus="prod";render();return focusAfter("#prodIn");}
  const po=e.target.closest("[data-pickorder]"); if(po){S.pickOrder=po.dataset.pickorder;S.pickProd=PAST.find(x=>x.ref===S.pickOrder).prod;S.focus=null;render();return focusAfter(S.type?"#ta":".tchip");}
  const pp=e.target.closest("[data-pickprod]"); if(pp){S.pickProd=pp.dataset.pickprod;S.focus=null;render();return focusAfter(S.type?"#ta":".tchip");}
  const up=e.target.closest("[data-unpick]"); if(up){if(up.dataset.unpick==="cust"){S.pickCust=null;S.pickOrder=null;S.focus="cust";render();return focusAfter("#custIn");}S.pickProd=null;S.focus="prod";render();return focusAfter("#prodIn");}
  if(e.target.closest("[data-save]")) return save();
  const ud=e.target.closest("[data-undo]"); if(ud){S.mine=S.mine.filter(m=>m.id!==S.toast.undo);S.toast=null;return render();}
  const row=e.target.closest("[data-open]"); if(row){S.open=row.dataset.open;return render();}
  if(e.target.closest("[data-closepanel]")){S.open=null;return render();}
  const mf=e.target.closest("[data-mf]"); if(mf){S.mf=mf.dataset.mf;S.mfocus=0;return render();}
  const mr=e.target.closest("[data-mrow]"); if(mr&&!e.target.closest(".links")){S.mexp=S.mexp===mr.dataset.mrow?null:mr.dataset.mrow;return render();}
  if(e.target.closest("[data-rsw]")){S.rOn=!S.rOn;return render();}
  const rt=e.target.closest("[data-rtype]"); if(rt){S.rType=rt.dataset.rtype;S.rTopic=null;return render();}
  const rp=e.target.closest("[data-rtopic]"); if(rp){S.rTopic=S.rTopic===rp.dataset.rtopic?null:rp.dataset.rtopic;return render();}
  if(e.target.closest("[data-reject]")){S.screen="reject";preset();return render();}
  if(e.target.closest("[data-closer]")){S.screen="queue";preset();S.cap=false;return render();}
  if(e.target.closest("[data-rgo]")){const on=S.rOn;S.screen="queue";preset();S.cap=false;S.open=null;S.toast={msg:on?T().rToast:T().rToastOff,type:on?S.rType:null};
    if(on)S.mine.unshift({id:"r"+Date.now(),d:0,t:new Date().toTimeString().slice(0,5),type:S.rType,topic:S.rTopic,prod:"d",c:"فاطمة المقريف",cf:"Fatma Megrisi",ref:"39508",text:"قال اريد الدفع بالبطاقة",fresh:true});
    render();clearTimeout(S.tt);S.tt=setTimeout(()=>{S.toast=null;render();},4000);return;}
  const inCap=e.target.closest(".fld"); if(!inCap&&S.focus&&S.cap&&S.mode==="blank"&&!e.target.closest(".sugg")){S.focus=null;render();}
});
document.addEventListener("focusin",e=>{
  if(e.target.id==="custIn"&&S.focus!=="cust"){S.focus="cust";rerenderKeep("custIn");}
  if(e.target.id==="prodIn"&&S.focus!=="prod"){S.focus="prod";rerenderKeep("prodIn");}
});
document.addEventListener("input",e=>{
  if(e.target.id==="ta"){S.text=e.target.value;const c=document.querySelector(".cnt .num");if(c)c.textContent=T().chars(S.text.length);const b=document.querySelector("[data-save]");if(b)b.disabled=!(S.type&&S.text.trim());}
  if(e.target.id==="custIn"){S.custQ=e.target.value;S.hot=0;rerenderKeep("custIn");}
  if(e.target.id==="prodIn"){S.prodQ=e.target.value;rerenderKeep("prodIn");}
  if(e.target.id==="mq"){S.mq=e.target.value;S.mfocus=0;rerenderKeep("mq");}
});
const editable=el=>el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable);
document.addEventListener("keydown",e=>{
  if(S.view==="mobile") return;
  /* Inside the capture window */
  if(S.cap){
    if(e.key==="Escape"){e.preventDefault();S.cap=false;return render();}
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();return save();}
    if(S.mode==="blank"&&S.focus==="cust"&&e.target.id==="custIn"){
      const opts=[...document.querySelectorAll(".sugg button")];
      if(e.key==="ArrowDown"){e.preventDefault();S.hot=Math.min(S.hot+1,opts.length-1);return rerenderKeep("custIn");}
      if(e.key==="ArrowUp"){e.preventDefault();S.hot=Math.max(S.hot-1,0);return rerenderKeep("custIn");}
      if(e.key==="Enter"&&opts[S.hot]){e.preventDefault();return opts[S.hot].click();}
    }
    if(S.mode==="blank"&&S.focus==="prod"&&e.target.id==="prodIn"&&e.key==="Enter"){const b=document.querySelector(".sugg button[data-hot]");if(b){e.preventDefault();return b.click();}}
    if(!editable(e.target)&&/^Digit[1-7]$/.test(e.code)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();const k=TYPES[+e.code.slice(5)-1].k;S.type=S.type===k?null:k;S.topic=null;render();return focusAfter("#ta");}
    return;
  }
  if(editable(e.target)) return;
  /* F — physical key, so the Arabic layout (« ب ») works too */
  if(e.code==="KeyF"&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.shiftKey&&S.screen!=="reject"){e.preventDefault();return openCap();}
  if(S.screen==="mine"){
    const n=document.querySelectorAll("[data-mrow]").length;
    if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();S.mfocus=Math.min(S.mfocus+1,n-1);return render();}
    if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();S.mfocus=Math.max(S.mfocus-1,0);return render();}
    if(e.key==="Enter"){const r=document.querySelectorAll("[data-mrow]")[S.mfocus];if(r){S.mexp=S.mexp===r.dataset.mrow?null:r.dataset.mrow;return render();}}
    if(e.key==="/"){e.preventDefault();return focusAfter("#mq");}
  }
  if(e.key==="Escape"&&S.screen==="reject"){S.screen="queue";preset();S.cap=false;return render();}
});
preset();
render();
if(S.cap&&S.view==="desktop") focusAfter(S.mode==="blank"?"#custIn":(S.type?"#ta":".tchip"));
</script>
</body>
</html>
