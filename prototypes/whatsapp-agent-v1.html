<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<title>Ordra — WhatsApp côté agent (v1)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Prototype v1 — WhatsApp Business (Cloud API) vu par l'AGENT. Construit 2026-09-25.
  Plan : plans/whatsapp-cloud-api.md (Phase 0). Décisions : §« Decisions I made as the expert ».
  Ce qui est montré, et rien de plus :
   · Écran « panel »        : la file + le panneau de commande EXISTANT (agent-shell-v1, non redessiné)
                              avec deux ajouts — un bouton WhatsApp à côté d'« Appeler », et un onglet
                              « Messages » : le fil (entrant/sortant, coches d'état) + le composeur.
   · Écran « panel-closed » : le même panneau quand la fenêtre de 24 h est fermée — modèles uniquement.
   · Écran « delivery »     : /delivery, la feuille WhatsApp existante qui ENVOIE au lieu d'ouvrir wa.me.
   · Écran « prospects »    : la liste des prospects, le bouton WhatsApp de la ligne ouvre le composeur.
   · Écran « product »      : la fiche produit, « Envoyer sur WhatsApp » envoie l'image depuis le numéro
                              de l'entreprise.
  Rien n'est inventé : tokens, teintes et atomes viennent de agent-shell-v1.html, de
  OrderDetailPanel/{CustomerHero,PanelTabs}.tsx, de delivery/Sheets.tsx (WhatsAppSheet) et de
  delivery/ui.tsx. Les textes client viennent de src/lib/delivery/whatsapp-templates.ts.
  URL : ?lang=fr|ar &view=desktop|mobile &screen=panel|panel-closed|delivery|prospects|product
        &state=normal|optedout|noconfig|failed|unread
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --soft:#F9FAFB; --sunk:#F3F4F6;
  --line:#E5E7EB; --line-2:#D1D5DB; --line-strong:#C9CCCF;
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280; --ink-4:#9CA3AF;
  --brand:#15803D; --brand-deep:#14532D; --brand-tint:#F0FDF4; --brand-line:#BBF7D0;
  --wa:#15803D; --wa-soft:#DCFCE7; --wa-btn:#1E8E5A; --wa-bubble:#E8F6EE;
  --action:#2C6ECB; --action-bg:#EAF1FB;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FCD34D;
  --bad:#B91C1C; --bad-bg:#FEF2F2; --bad-line:#FECACA;
  --black:#111111; --studio:#E9EBEF;
  --f-lat:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Cairo","Noto Sans Arabic",system-ui,sans-serif;
}
/* The 14 tones, value-for-value from TONE in src/components/delivery/ui.tsx. */
[data-t=red]     {--from:#FECACA;--to:#FEF2F2;--tink:#991B1B;--ring:#FCA5A5;--edge:#EF4444;--soft:#FEE2E2;--bord:#F87171;--ticon:#DC2626}
[data-t=rose]    {--from:#FECDD3;--to:#FFF1F2;--tink:#9F1239;--ring:#FDA4AF;--edge:#F43F5E;--soft:#FFE4E6;--bord:#FDA4AF;--ticon:#BE123C}
[data-t=violet]  {--from:#DDD6FE;--to:#F5F3FF;--tink:#5B21B6;--ring:#C4B5FD;--edge:#8B5CF6;--soft:#EDE9FE;--bord:#C4B5FD;--ticon:#6D28D9}
[data-t=orange]  {--from:#FED7AA;--to:#FFF7ED;--tink:#9A3412;--ring:#FDBA74;--edge:#F97316;--soft:#FFEDD5;--bord:#FDBA74;--ticon:#C2410C}
[data-t=amber]   {--from:#FDE68A;--to:#FFFBEB;--tink:#92400E;--ring:#FCD34D;--edge:#F59E0B;--soft:#FEF3C7;--bord:#FBBF24;--ticon:#B45309}
[data-t=teal]    {--from:#99F6E4;--to:#F0FDFA;--tink:#115E59;--ring:#5EEAD4;--edge:#14B8A6;--soft:#CCFBF1;--bord:#5EEAD4;--ticon:#0F766E}
[data-t=indigo]  {--from:#C7D2FE;--to:#EEF2FF;--tink:#3730A3;--ring:#A5B4FC;--edge:#6366F1;--soft:#E0E7FF;--bord:#A5B4FC;--ticon:#4338CA}
[data-t=stone]   {--from:#D6D3D1;--to:#FAFAF9;--tink:#44403C;--ring:#A8A29E;--edge:#A8A29E;--soft:#E7E5E4;--bord:#D6D3D1;--ticon:#57534E}
[data-t=slate]   {--from:#CBD5E1;--to:#F8FAFC;--tink:#334155;--ring:#94A3B8;--edge:#94A3B8;--soft:#E2E8F0;--bord:#CBD5E1;--ticon:#475569}
[data-t=blue]    {--from:#BFDBFE;--to:#EFF6FF;--tink:#1D4ED8;--ring:#93C5FD;--edge:#3B82F6;--soft:#DBEAFE;--bord:#93C5FD;--ticon:#1D4ED8}
[data-t=grey]    {--from:#E5E7EB;--to:#F9FAFB;--tink:#374151;--ring:#D1D5DB;--edge:#9CA3AF;--soft:#F3F4F6;--bord:#D1D5DB;--ticon:#374151}
[data-t=green]   {--from:#BBF7D0;--to:#F0FDF4;--tink:#166534;--ring:#86EFAC;--edge:#22C55E;--soft:#DCFCE7;--bord:#86EFAC;--ticon:#15803D}
[data-t=yellow]  {--from:#FEF08A;--to:#FEFCE8;--tink:#854D0E;--ring:#FDE047;--edge:#EAB308;--soft:#FEF9C3;--bord:#FDE047;--ticon:#A16207}

*{box-sizing:border-box}
body{margin:0;background:var(--studio);color:var(--ink);font-family:var(--f-lat);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.q{unicode-bidi:plaintext}
[dir=rtl] .app,[dir=rtl] .scr{font-family:var(--f-ar);direction:rtl}
.app a,.scr a{text-decoration:none;color:inherit}
[dir=rtl] .flip svg{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}

/* ── Studio chrome (always LTR) ──────────────────────────────── */
.studio{padding:18px 20px 40px;direction:ltr}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1520px;margin:0 auto 12px}
.bar h1{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto}
.bar h1 span{color:var(--ink-3);font-weight:500}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--black);color:#fff}
.note{max-width:1520px;margin:0 auto 14px;font-size:12.5px;color:var(--ink-3);line-height:1.55}
.note b{color:var(--ink-2)}
.note code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#fff;padding:1px 4px;border-radius:4px}
.stage{max-width:1520px;margin:0 auto}
.hscroll{overflow-x:auto}

/* ── Shared atoms — all of them exist on /delivery today ─────── */
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;font-weight:600;
      background:linear-gradient(to right,var(--from),var(--to));color:var(--tink);box-shadow:inset 0 0 0 1px var(--ring)}
[dir=rtl] .chip{background:linear-gradient(to left,var(--from),var(--to));padding:4px 10px 4px 12px}
.chip svg{width:14px;height:14px;stroke-width:2}
.dot{width:8px;height:8px;border-radius:50%;background:var(--edge);flex:0 0 auto}
.tagg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;font-weight:600;background:var(--soft);color:var(--tink)}
[dir=rtl] .tagg{padding:5px 9px 5px 11px}
.tagg .dot{width:7px;height:7px}
.tagg svg{width:14px;height:14px;stroke-width:2;color:var(--ticon);opacity:.9}
.tagg small{font-weight:500;opacity:.85}
.thumb{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--ink-4);overflow:hidden;flex:0 0 auto;font-size:19px}
.thumb.q,.thumb.d,.thumb.h{border-radius:8px;font-size:0;border:0}
.thumb.q{background:#F3F4F6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%234B2E2B'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%234B2E2B'/></svg>") center/cover}
.thumb.d{background:#F3F4F6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%23123B2F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%23123B2F'/></svg>") center/cover}
.thumb.h{background:#F3F4F6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%231F3A5F'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%231F3A5F'/></svg>") center/cover}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn-o:hover{background:var(--soft)}
.btn-o[data-tone]{border-color:var(--bord)}
.btn-o[data-tone] svg{color:var(--ticon)}
.btn-sq{width:44px;height:44px;border:1px solid var(--brand-line);border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--brand);flex:0 0 auto;position:relative}
.btn-sq:hover{background:var(--brand-tint)}
.btn-sq[data-off]{border-color:var(--line);color:var(--ink-4);background:var(--soft)}
.btn-sq .n{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.btn-p{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 16px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn-p:hover{background:#166534}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--brand-line);background:var(--brand-tint);font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill svg{width:16px;height:16px;color:var(--brand)}
.pill b{color:var(--ink);font-weight:600}
.money{white-space:nowrap}.money .v{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
mark.v{background:var(--wa-bubble);color:var(--brand-deep);border-radius:5px;padding:0 4px;font-weight:600}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── The shell — identical to agent-shell-v1 ─────────────────── */
.app{min-width:1180px;height:1100px;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;text-align:start}
.top{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:30}
.top .brand{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--brand-deep)}
.top .brand i{font-style:normal;color:var(--brand)}
.top .mkt{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:13px;border-inline-start:1px solid var(--line);padding-inline-start:12px}
.top .mkt svg{width:14px;height:14px}
.tabs{display:flex;align-items:center;gap:2px;height:52px;padding:4px;margin-inline-start:auto;border-radius:14px;background:var(--sunk);min-width:0;flex-shrink:1}
.tabs a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;min-width:0;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:background .18s ease,color .18s ease}
.tabs a svg{width:16px;height:16px;opacity:.7}
.tabs a:hover{color:var(--ink);background:rgba(255,255,255,.55)}
.tabs a[aria-current=page]{color:var(--brand);background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tabs a[aria-current=page] svg{opacity:1}
.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--wa-soft);color:var(--brand);font-size:12px;font-weight:700}
.slot-search{flex:1 1 340px;min-width:300px;display:flex;justify-content:center;padding:0 16px}
.search{position:relative;width:100%;min-width:260px;max-width:560px}
.search .field{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink-3)}
[dir=rtl] .search .field{padding:0 14px 0 8px}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search kbd{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);font-size:11px;font-weight:700;color:var(--ink-3);font-family:inherit}
.slot-end{display:flex;align-items:center;gap:12px;flex:0 0 auto;position:relative}
.presence{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--brand-tint);border:1px solid var(--brand-line);font-size:13px;font-weight:500;color:#14532D;white-space:nowrap}
.presence .dot{width:7px;height:7px;background:#22C55E}
.presence small{display:block;font-size:11px;color:var(--ink-3)}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.bell:hover,.bell[aria-expanded=true]{background:var(--sunk)}
.bell b{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#B98900;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.bell b[data-wa]{background:var(--brand)}
.me{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 4px;border-radius:10px;border:1px solid transparent}
.me:hover{border-color:var(--line);background:var(--soft)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-2)}
.me span{font-size:14px;font-weight:700}
.me svg{width:16px;height:16px;color:var(--ink-3)}
/* The bell's list — the existing NotificationBell dropdown, one new row kind. */
.npop{position:absolute;top:calc(100% + 8px);inset-inline-end:60px;width:420px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(17,24,39,.12);z-index:40;overflow:hidden}
.npop .nh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.npop .nh button{font-size:12.5px;font-weight:600;color:var(--brand)}
.npop .nr{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:start}
.npop .nr:last-child{border-bottom:0}
.npop .nr:hover{background:var(--soft)}
.npop .nr[data-new]{background:var(--brand-tint)}
.npop .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.npop .ic[data-wa]{background:var(--wa-soft);color:var(--brand)}
.npop .ic svg{width:17px;height:17px}
.npop .nt{font-size:13.5px;font-weight:600;line-height:1.3}
.npop .ns{font-size:12.5px;color:var(--ink-3);margin-top:2px;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:270px}
.npop .nw{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* ── Queue page (agent-shell-v1, screen 1) ───────────────────── */
.qpage{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 20px 0}
.qh{display:flex;align-items:center;gap:16px;height:52px;flex:0 0 auto}
.qh .ttl{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.qh h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.qh .sub{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px}
.qh .sub .dot{width:8px;height:8px;background:#22C55E}
.qh .meters{margin-inline-start:auto;display:flex;align-items:stretch}
.qh .mt{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;padding:0 14px;border-inline-start:1px solid var(--line)}
.qh .mt:first-child{border-inline-start:0}
.qh .mt .v{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.qh .mt .l{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.qh .btn-p{height:44px;padding:0 18px;font-size:15px;font-weight:700}
.qchips{display:flex;align-items:center;gap:14px;margin-top:4px;flex:0 0 auto}
.qchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.qchip svg{width:17px;height:17px;color:var(--ink-3);stroke-width:2}
.qchip b{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.qchip[aria-pressed=true]{border:1.5px solid var(--brand);color:#14532D}
.qchip[aria-pressed=true] svg{color:var(--brand)}
.qchip[aria-pressed=true] b{background:#DCFCE7;color:var(--brand)}
.qbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:20px;margin-top:17px;padding-bottom:24px}
.qtable{min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qth,.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) 190px 80px 92px;gap:16px;align-items:center;padding:0 12px 0 16px}
.qth{height:34px;flex:0 0 auto;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-3)}
.qth .lt{text-align:left;direction:ltr;justify-self:left}
.qrows{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.qrow{position:relative;min-height:66px;border-bottom:1px solid var(--line);cursor:pointer}
.qrow:hover{background:var(--soft)}
.qrow[aria-selected=true]{box-shadow:inset 0 0 0 1.5px var(--brand);border-radius:8px;border-bottom-color:transparent;background:#fff}
.cb{width:20px;height:20px;border:1px solid var(--line-2);border-radius:5px;background:#fff;display:grid;place-items:center;justify-self:center;color:#fff}
.cb svg{width:13px;height:13px;stroke-width:3}
.cb[aria-checked=true]{background:var(--brand);border-color:var(--brand)}
.qid{display:flex;align-items:center;gap:12px;min-width:0}
.qid .th{position:relative;flex:0 0 auto}
.qid .qty{position:absolute;bottom:-5px;inset-inline-end:-5px;min-width:20px;height:17px;padding:0 5px;border-radius:999px;background:var(--black);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;direction:ltr}
.qid .nb{flex:1;min-width:0}
.qid .nm{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qid .pr{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.qid .pr .wa-mini{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:600}
.qid .pr .wa-mini svg{width:13px;height:13px}
.c-act{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.c-act .att{display:inline-grid;place-items:center;height:26px;padding:0 8px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);direction:ltr;font-variant-numeric:tabular-nums;flex:0 0 auto}
.c-act .lc{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-act .lc svg{width:16px;height:16px;stroke-width:2;color:var(--ink-2)}
.c-act .lc[data-none]{color:var(--ink-3)}
.c-age{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;justify-self:left}
.c-age .v{font-size:17px;font-weight:700;line-height:1.1;display:block}
.c-age .bar{margin-top:6px;width:70px;height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.c-age .bar i{display:block;height:100%;border-radius:999px}
.c-age[data-tone=red] .v{color:#DC2626}.c-age[data-tone=red] .bar i{background:#DC2626}
.c-age[data-tone=orange] .v{color:#C2410C}.c-age[data-tone=orange] .bar i{background:#F97316}
.c-amt2{direction:ltr;text-align:left;white-space:nowrap;display:flex;align-items:baseline;gap:6px;justify-self:left}
.c-amt2 small{font-size:13px;font-weight:500;color:var(--ink-3)}
.c-amt2 b{font-size:17px;font-weight:700}
.qfoot{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}

/* ── The existing OrderDetailPanel, reproduced — plus the two WhatsApp additions ── */
.qpanel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qpanel .pt{flex:0 0 auto;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-bottom:1px solid var(--line)}
.qpanel .st{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;background:var(--sunk);color:var(--ink-2);font-size:13.5px;font-weight:600;white-space:nowrap}
.qpanel .st svg{width:15px;height:15px}
.qpanel .late{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:#FEE2E2;color:#B91C1C;font-size:13.5px;font-weight:700;white-space:nowrap;direction:ltr}
.qpanel .late svg{width:15px;height:15px;stroke-width:2.2}
.qpanel .ref{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.qpanel .ref svg,.qpanel .cp svg{width:15px;height:15px;color:var(--ink-3)}
.qpanel .pt .x{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.qpanel .pb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.qpanel .pbs{overflow-y:auto;scrollbar-width:thin;flex:1;min-height:0}
.qpanel .lbl{font-size:12.5px;color:var(--ink-3)}
.qpanel .cust{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 12px;flex:0 0 auto}
.qpanel .cust .nm{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.qpanel .cust .cp{display:flex;width:max-content;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-top:6px}
.qpanel .cust .add{display:flex;width:max-content;align-items:center;gap:4px;color:var(--brand);font-size:13px;font-weight:600;margin-top:6px;height:24px}
.qpanel .cust .add svg{width:13px;height:13px}
.qpanel .cust .ctas{margin-inline-start:auto;align-self:center;display:flex;align-items:center;gap:8px}
.qpanel .cust .btn-p{height:40px;padding:0 18px;font-size:15px;font-weight:700;border-radius:8px}
.qpanel .cust .btn-p svg{width:16px;height:16px}
/* NEW — the WhatsApp button: outline, brand ink, the same 40 px as « Appeler », never louder than it. */
.qpanel .cust .btn-wa{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--brand-line);border-radius:8px;background:#fff;color:var(--brand);font-size:14px;font-weight:700;white-space:nowrap;position:relative}
.qpanel .cust .btn-wa:hover{background:var(--brand-tint)}
.qpanel .cust .btn-wa svg{width:17px;height:17px;stroke-width:2}
.qpanel .cust .btn-wa[data-off]{border-color:var(--line);color:var(--ink-4);background:var(--soft)}
.qpanel .cust .btn-wa .n{position:absolute;top:-7px;inset-inline-end:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.qpanel .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);flex:0 0 auto}
.qpanel .fc{padding:10px 18px 12px;border-bottom:1px solid var(--line);min-width:0}
.qpanel .fc:nth-child(odd){border-inline-end:1px solid var(--line)}
.qpanel .fc .v{font-size:14px;margin-top:3px}
.qpanel .fc .v.big{font-size:17px;font-weight:700}
.qpanel .av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#EDE9FE;color:#6D28D9;font-size:11px;font-weight:800}
.qpanel .carrier{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px;border-radius:6px;background:var(--sunk);color:var(--ink-3);font-size:12.5px;font-weight:600;margin-top:4px}
.qpanel .carrier svg{width:15px;height:15px}
.qpanel .ptabs{display:flex;gap:26px;padding:0 18px;border-bottom:1px solid var(--line);height:42px;flex:0 0 auto}
.qpanel .ptabs button{display:inline-flex;align-items:center;gap:7px;height:42px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.qpanel .ptabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.qpanel .ptabs b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:12px}
.qpanel .ptabs b[data-new]{background:var(--brand);color:#fff}
.qpanel .prod{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.qpanel .prod .thumb{width:56px;height:56px;border-radius:8px;font-size:0}
.qpanel .prod .pn{font-size:15px;font-weight:700}
.qpanel .prod .pq{font-size:13.5px;color:var(--ink-3);margin-top:2px;direction:ltr;text-align:start}
.qpanel .prod .ok{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:#15803D;font-weight:600;margin-top:2px}
.qpanel .prod .ok i{width:7px;height:7px;border-radius:50%;background:#22C55E}
.qpanel .prod .pa{margin-inline-start:auto;font-size:15px;font-weight:700;white-space:nowrap;direction:ltr}
.qpanel .wide{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;margin:0 18px 8px;width:calc(100% - 36px);border:1px solid var(--line-2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.qpanel .wide svg{width:16px;height:16px}
.qpanel .sub{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 18px;font-size:14px;color:var(--ink-2)}
.qpanel .sub b{font-size:15px;color:var(--ink);direction:ltr}
.qpanel .pf{flex:0 0 auto;padding:10px 12px 8px;border-top:1px solid var(--line);background:#fff}
.qpanel .acts{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.qpanel .act{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 9px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:13px;font-weight:700;color:var(--ink);min-width:0}
.qpanel .act>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qpanel .act svg{width:15px;height:15px;stroke-width:2.2;flex:0 0 auto}
.qpanel .act.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.qpanel .act.no{border-color:#F87171;color:#B91C1C}
.qpanel .act.cb2{border-color:#FCD34D;background:#FFFBEB;color:#92400E}
.qpanel .hint{margin-top:9px;text-align:center;font-size:12px;color:var(--ink-3)}
.qpanel .hint kbd{font-family:inherit}

/* ── NEW — the Messages tab: thread + composer ───────────────── */
.msgs{display:flex;flex-direction:column;flex:1;min-height:0}
.thread{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:14px 18px 8px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.thread .day{align-self:center;margin:6px 0 4px;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-3)}
.msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg[data-dir=in]{align-self:flex-start}
.msg[data-dir=out]{align-self:flex-end}
.msg .bub{padding:9px 12px 8px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;unicode-bidi:plaintext;border:1px solid transparent}
.msg[data-dir=in] .bub{background:#fff;border-color:var(--line);border-start-start-radius:4px}
.msg[data-dir=out] .bub{background:var(--wa-bubble);border-color:#CDEBD9;border-start-end-radius:4px}
.msg[data-new] .bub{box-shadow:0 0 0 2px var(--brand-line)}
.msg .bub .tplh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--brand-deep);margin-bottom:5px;text-transform:none;letter-spacing:0}
.msg .bub .tplh svg{width:13px;height:13px}
.msg .bub .img{width:100%;aspect-ratio:4/3;border-radius:9px;margin-bottom:7px;background:#F3F4F6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'><rect x='9' y='7' width='26' height='30' rx='3' fill='%234B2E2B'/><rect x='12' y='10' width='20' height='24' rx='2' fill='%23C9A24D' opacity='.85'/><rect x='16' y='14' width='12' height='16' rx='1' fill='%234B2E2B'/></svg>") center/40% no-repeat}
.msg .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);padding:0 4px}
.msg[data-dir=out] .meta{justify-content:flex-end}
.msg .meta .by{font-weight:600;color:var(--ink-2)}
.tick{display:inline-flex;align-items:center;gap:3px;font-weight:700;letter-spacing:-.06em;direction:ltr;font-size:12px}
.tick[data-s=sent],.tick[data-s=delivered]{color:var(--ink-4)}
.tick[data-s=read]{color:var(--action)}
.tick[data-s=failed]{color:var(--bad);letter-spacing:0;gap:5px}
.tick svg{width:13px;height:13px;stroke-width:2.4}
.msg[data-failed] .bub{background:var(--bad-bg);border-color:var(--bad-line)}
.msg .retry{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--bad);height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--bad-line);background:#fff;align-self:flex-end}
.sysrow{align-self:center;display:inline-flex;align-items:center;gap:7px;margin:4px 0;padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--ink-2);unicode-bidi:plaintext}
.sysrow svg{width:13px;height:13px;color:var(--ink-3)}
.sysrow[data-tone=warn]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.sysrow[data-tone=warn] svg{color:var(--warn)}
/* The composer — the WhatsAppSheet's controls, compacted for a 560 px aside. */
.comp{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:8px 14px 10px}
.comp .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lseg{display:inline-flex;border-radius:999px;background:var(--sunk);padding:3px;flex:0 0 auto}
.lseg button{height:30px;padding:0 16px;border-radius:999px;font-size:13px;color:var(--ink-3)}
.lseg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
.win{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;margin-inline-start:auto}
.win svg{width:13px;height:13px;stroke-width:2.2}
.win[data-open=true]{background:var(--brand-tint);color:var(--brand-deep);border:1px solid var(--brand-line)}
.win[data-open=false]{background:var(--sunk);color:var(--ink-3);border:1px solid var(--line)}
.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.tchips::-webkit-scrollbar{display:none}
.tchips button{height:34px;flex:0 0 auto;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tchips button[aria-pressed=true]{border:1.5px solid var(--wa-btn);background:var(--wa-bubble);color:var(--brand-deep);font-weight:600}
.tchips button[data-free]{border-style:dashed}
.comp .prev{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:52px;max-height:92px;overflow-y:auto;background:#fff}
.comp textarea{width:100%;margin-top:8px;min-height:64px;resize:vertical;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;font-size:14.5px;line-height:1.55;background:#fff;unicode-bidi:plaintext}
.comp textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.comp textarea:disabled{background:var(--sunk);color:var(--ink-3)}
.comp .r2{display:flex;align-items:center;gap:10px;margin-top:8px}
.comp .cnt{font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.comp .hint{font-size:12px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-send{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:132px;padding:0 16px;border-radius:10px;background:var(--wa-btn);color:#fff;font-size:14.5px;font-weight:700;white-space:nowrap}
.btn-send:hover{background:#177A4C}
.btn-send:disabled{opacity:.45}
.btn-send[data-done]{background:var(--brand-tint);color:var(--brand-deep);border:1px solid var(--brand-line)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.45}
.banner svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.banner b{display:block;font-weight:700;margin-bottom:1px}
.banner[data-tone=warn]{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.banner[data-tone=bad]{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad)}
.banner[data-tone=grey]{background:var(--sunk);border:1px solid var(--line);color:var(--ink-2)}
.banner .acts2{display:flex;gap:8px;margin-top:8px}
.banner .acts2 button{height:32px;padding:0 12px;border-radius:8px;border:1px solid currentColor;font-size:13px;font-weight:700;background:#fff}
.err{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-size:13px}
.err svg{width:15px;height:15px}
.err b{font-weight:700}
.err button{margin-inline-start:auto;font-weight:700;text-decoration:underline}

/* ── Delivery page (the /delivery yardstick) ─────────────────── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;padding:16px 20px 0}
.left{min-width:0;display:flex;flex-direction:column;min-height:0}
.right{min-width:0;min-height:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
.head .ttl{display:flex;align-items:flex-start;gap:10px}
.head svg.hero{width:30px;height:30px;color:var(--brand);margin-top:3px;stroke-width:1.9}
.head h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.head .sub{color:var(--ink-3);font-size:14px;margin-top:2px;unicode-bidi:plaintext}
.head .end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
.strip button{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border-inline-start:1px solid var(--line);text-align:start;min-width:0}
.strip button:first-child{border-inline-start:0}
.strip .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.strip .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .l b{margin-inline-start:auto;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding-inline-start:8px}
.strip .s{font-size:12.5px;color:var(--ink-3)}
.strip button[aria-pressed=true]{background:var(--brand-tint);box-shadow:inset 0 -2px 0 var(--brand)}
.strip button[aria-pressed=true] .l{color:var(--ink);font-weight:700}
.thead{display:grid;gap:16px;padding:4px 16px 8px 20px;font-size:12px;font-weight:500;color:var(--ink-3)}
.thead.yard,.row.yard{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(216px,auto) minmax(88px,auto)}
.thead .e{text-align:end}
.rows{flex:1;min-height:0;overflow-y:auto;padding-bottom:20px;scrollbar-width:thin}
.row{position:relative;display:grid;gap:16px;align-items:center;padding:10px 16px 10px 20px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.row::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--edge)}
.row:hover{border-color:var(--line-strong)}
.row[aria-selected=true]{border:1.5px solid var(--brand);background:var(--brand-tint)}
.c-sit{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.c-sit .sub{font-size:13px;color:var(--ink-3)}
.c-sit .tm{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3)}
.c-sit .tm svg{width:13px;height:13px}
.c-sit .tm[data-wa]{color:var(--brand-deep);font-weight:600}
.c-sit .tm[data-wa] svg{color:var(--brand)}
.c-cl{display:flex;gap:12px;min-width:0;align-items:flex-start}
.c-cl .nm{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.c-cl .nm b{font-size:15px;font-weight:700;unicode-bidi:plaintext}
.c-cl .nm .id{font-size:13.5px;color:var(--ink-3)}
.c-cl .ph{font-size:14px;color:var(--ink-2);margin-top:2px}
.c-cl .ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--ink-3);margin-top:2px}
.c-cl .ln span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.c-cl .ln svg{width:14px;height:14px}
.c-cl .tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.c-act2{display:flex;align-items:center;gap:8px}
.c-act2 .btn-o{min-width:0;flex:1}
.c-act2 .btn-o .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-amt{text-align:end;font-size:19px;font-weight:700;white-space:nowrap}
.aside{height:calc(100% - 16px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.aside .ah{padding:16px 18px;border-bottom:1px solid var(--line)}
.aside .ah h3{margin:0;font-size:21px;font-weight:700}
.aside .ah .id{font-size:14px;color:var(--ink-3);font-weight:400;margin-inline-start:8px}
.aside .ab{flex:1;min-height:0;overflow-y:auto;padding:14px 18px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.ct{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;margin-bottom:8px}
.ct svg{width:17px;height:17px;color:var(--ink-3)}
.tl{list-style:none;margin:4px 0 0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:14px 1fr;gap:10px;padding:6px 0}
.tl li::before{content:"";position:absolute;inset-inline-start:6px;top:20px;bottom:-6px;width:1px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:8px;height:8px;border-radius:50%;background:var(--ink-4);margin-top:6px;justify-self:center}
.tl li[data-wa] i{background:var(--brand)}
.tl b{display:block;font-size:14px;font-weight:500}
.tl span{display:block;font-size:12.5px;color:var(--ink-3)}

/* ── The sheet — SheetFrame from delivery/Sheets.tsx ─────────── */

function tick(s){
  if(s==="failed") return `<span class="tick" data-s="failed">${I.warn}<span>${t().st.failed}</span></span>`;
  if(s==="sent") return `<span class="tick" data-s="sent" title="${t().st.sent}">${I.check}</span>`;
  return `<span class="tick" data-s="${s}" title="${t().st[s]}">${I.check2}</span>`;
}
/* The thread for Mahmoud (o2). Bodies stay in the customer's language whatever the UI language. */
function threadFor(){
  const closed=S.screen==="panel-closed";
  const shippedBody="مرحباً محمود، طلبك مع درب السبيل في طريقه إليك.\nرقم التتبع SH2164265.\nالمبلغ عند الاستلام 249 د.ل.";
  const m=[];
  if(closed){
    m.push({day:t().daysAgo(3)});
    m.push({dir:"out",kind:"tpl",auto:"shipped",time:"17:40",status:"read",body:shippedBody});
    m.push({dir:"in",time:"18:02",body:"متى يوصل الطلب؟"});
    m.push({dir:"out",kind:"text",by:"Tasnim",time:"18:05",status:"read",body:"المندوب يمرّ عليك غداً إن شاء الله قبل الساعة 6 مساءً"});
    return m;
  }
  m.push({day:t().yesterday});
  m.push({dir:"out",kind:"tpl",auto:"shipped",time:"17:40",status:"read",body:shippedBody});
  m.push({day:t().today});
  m.push({dir:"in",time:"09:58",body:"السلام عليكم، متى يوصل الطلب؟"});
  m.push({dir:"out",kind:"text",by:"Tasnim",time:"10:03",status:"delivered",body:"وعليكم السلام، المندوب يمرّ عليك اليوم قبل الساعة 6 مساءً"});
  if(S.state==="unread") m.push({dir:"in",time:"10:12",body:"تمام، شكراً. لو ممكن يتصل قبل ما يوصل",isNew:true});
  else m.push({dir:"in",time:"10:12",body:"تمام، شكراً"});
  if(S.state==="failed") m.push({dir:"out",kind:"text",by:"Tasnim",time:"10:15",status:"failed",code:131000,body:"أكيد، المندوب يتصل بك قبل الوصول"});
  if(S.state==="optedout"){ m.push({dir:"in",time:"10:20",body:"توقف"}); m.push({sys:t().optedOutRow(isAr()?"25 سبتمبر 10:20":"25 sept. 10:20"),tone:"warn"}); }

function threadHtml(msgs){
  if(!msgs.length) return `<div class="thread"><div class="sysrow">${I.msg}<span>${t().threadEmpty}</span></div><div class="sysrow" style="border:0;background:none">${t().threadEmptySub}</div></div>`;
  return `<div class="thread" id="thread">${msgs.map(m=>{
    if(m.day) return `<span class="day">${m.day}</span>`;
    if(m.sys) return `<span class="sysrow" data-tone="${m.tone||""}">${I.ban}<span>${m.sys}</span></span>`;
    const head=m.kind==="tpl"?`<span class="tplh">${m.auto?I.bolt:I.file}<span>${m.auto?`${t().auto} · ${t().autoEvent[m.auto]}`:t().tplTag}</span></span>`:"";
    const img=m.kind==="img"?`<span class="img" aria-hidden="true"></span>`:"";
    const meta=m.dir==="in"?`<span class="meta"><span class="num">${m.time}</span></span>`
      :`<span class="meta">${m.by?`<span class="by">${m.by}</span> ·`:""}<span class="num">${m.time}</span>${tick(m.status)}${m.status==="failed"?`<span style="color:var(--bad)">· Meta <span class="num">${m.code}</span></span>`:""}</span>`;
    return `<div class="msg" data-dir="${m.dir}" ${m.isNew?"data-new":""} ${m.status==="failed"?"data-failed":""}><div class="bub" dir="auto">${head}${img}${esc(m.body)}</div>${meta}${m.status==="failed"?`<button class="retry">${I.undo}${t().retry}</button>`:""}</div>`;
  }).join("")}</div>`;
}
/* The composer. `opts`: {target, windowOpen, windowLabel, set, compact, delivery} */
function composer(o){
  const T=t();
  if(noConfig()) return `<div class="comp"><div class="banner" data-tone="grey">${I.info}<div><b>${T.noConfig}</b>${T.noConfigSub}</div></div></div>`;
  if(optedOut()) return `<div class="comp"><div class="banner" data-tone="warn">${I.ban}<div><b>${T.optedOut}</b>${T.optedOutSub(isAr()?"25 سبتمبر":"25 sept.")}<div class="acts2"><button>${I.phone}${T.callBtn}</button></div></div></div></div>`;
  const keys=Object.keys(TPL).filter(k=>TPL[k].set===(o.set||"agent"));
  if(!S.ctpl||!keys.includes(S.ctpl)) S.ctpl=o.defaultTpl||keys[0];
  const free=o.windowOpen&&S.free;
  const vars=varsFor(o.target,S.clang);
  const parts=renderTpl(S.ctpl,S.clang,vars);
  const win=o.windowOpen?`<span class="win" data-open="true">${I.clock}<span>${T.winOpen(o.windowUntil)}</span></span>`:`<span class="win" data-open="false" title="${esc(o.windowLabel)}">${I.clock}<span>${o.windowLabel}</span></span>`;
  const errBox=S.send==="failed"?`<div class="err">${I.warn}<span><b>${T.failed}</b> · ${T.failedSub(S.errCode,T.errs[S.errCode])}</span><button data-send>${T.retry}</button></div>`:"";
  const btn=S.send==="sending"?`<button class="btn-send" disabled><span class="spin"></span>${T.sending}</button>`
    :S.send==="sent"?`<button class="btn-send" data-done>${I.check2}${T.sent}</button>`
    :`<button class="btn-send" data-send>${I.send}${T.send}</button>`;
  return `<div class="comp">
    <div class="r1">
      <div class="lseg" role="group">${["ar","fr"].map(l=>`<button data-clang="${l}" aria-pressed="${S.clang===l}">${l==="ar"?"العربية":"Français"}</button>`).join("")}</div>
      ${win}
    </div>
    <div class="tchips" role="tablist">
      ${keys.map(k=>`<button role="tab" data-ctpl="${k}" aria-pressed="${!free&&S.ctpl===k}">${TPL[k].label[S.lang]||TPL[k].label.fr}</button>`).join("")}
      ${o.windowOpen?`<button role="tab" data-free data-cfree aria-pressed="${free}">${I.pen||""}${T.free}</button>`:""}
    </div>
    ${free
      ?`<textarea id="ta" dir="auto" placeholder="${T.placeholder}" maxlength="1000">${esc(S.text)}</textarea>`
      :`<div class="prev" dir="${S.clang==="ar"?"rtl":"ltr"}" lang="${S.clang}">${partsHtml(parts)}</div>`}
    ${errBox}
    <div class="r2">
      <span class="hint">${free?T.chars(S.text.length):T.varsHint}</span>
      ${btn}
    </div>
  </div>`;
}

      <span class="lbl2">${T.sheetTpl}</span>
      <div class="tchips">${keys.map(k=>`<button data-ctpl="${k}" aria-pressed="${!free&&S.ctpl===k}">${TPL[k].label[S.lang]||TPL[k].label.fr}</button>`).join("")}${windowOpen?`<button data-free data-cfree aria-pressed="${free}">${I.pen}${T.free}</button>`:""}</div>
      ${windowOpen?`<span class="win" data-open="true">${I.clock}<span>${T.winOpen(opts.windowUntil)}</span></span>`:`<span class="win" data-open="false">${I.clock}<span>${opts.windowLabel||T.winNever}</span></span>`}
      <span class="lbl2">${T.sheetText}</span>
      ${free?`<textarea id="ta" dir="auto" placeholder="${T.placeholder}">${esc(S.text)}</textarea><div class="cnt">${T.chars(S.text.length)}</div>`
            :`<div class="txt" dir="${S.clang==="ar"?"rtl":"ltr"}" lang="${S.clang}">${partsHtml(parts)}</div><div class="cnt">${T.chars(partsText(parts).length)}</div>`}
      ${err}${go}${after}`;
  }
  return `<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="${T.sheetTitle}">
    <div class="sh"><h3>${T.sheetTitle}</h3><button class="x" data-close>${I.x}</button></div>
    <div class="sb">
      <div class="who"><span class="thumb" style="width:36px;height:36px;font-size:0">${I.user}</span><b class="q">${nm(p)}</b><span class="ph num">${p.ph}</span></div>
      ${opts.reply?`<div class="msg" data-dir="in" style="max-width:100%;margin:8px 0 2px"><div class="bub" dir="auto">${esc(opts.reply)}</div><span class="meta"><span class="num">10:19</span></span></div>`:""}
      ${body}
    </div></div></div>`;
}
function screenDelivery(){
  const T=t(), p=PARCELS.find(x=>x.id===S.sheet)||PARCELS[0];
  const keys=["all","returning","act_now","waiting_customer","waiting_carrier","done"], c={all:13,returning:1,act_now:3,waiting_customer:2,waiting_carrier:6,done:1};
  return `<div class="body"><section class="left">
    <div class="head"><div class="ttl">${I.truck.replace("<svg","<svg class=\"hero\"")}<div><h2>${T.dTitle}</h2><div class="sub">${T.dSub(13)}</div></div></div>
      <span class="pill">${I.circlecheck}<span>${T.dStat(99,2)}</span></span>
      <div class="end"><button class="btn-o">${I.filter}<span>${T.filter}</span></button><button class="btn-o">${I.sort}<span>${T.sort}</span></button></div></div>
    <div class="strip" role="group">${keys.map((k,i)=>`<button aria-pressed="${i===2}"><span class="l">${k==="all"?"":`<span class="dot" data-t="${({returning:"red",act_now:"amber",waiting_customer:"blue",waiting_carrier:"grey",done:"green"})[k]}"></span>`}<span>${T.dBuckets[k]}</span><b class="num">${c[k]}</b></span><span class="s">${money(c[k]*231)}</span></button>`).join("")}</div>
    <div class="thead yard"><span>${T.dCols[0]}</span><span>${T.dCols[1]}</span><span>${T.dCols[2]}</span><span class="e">${T.dCols[3]}</span></div>
    <div class="rows" role="list">${PARCELS.map(dRow).join("")}</div></section>
    <section class="right">${dAside(p)}</section></div>
    ${S.sheet?waSheet(p,{set:"agent",defaultTpl:suggestTemplate(p),windowOpen:false,windowLabel:T.winNever}):""}`;
}

/* ═════════ Screen 4 — prospects: the row's WhatsApp slot opens the composer ═════════ */
function pRow(l){
  const T=t(), sel=S.lead===l.id;
  const sub=l.replied?`<span class="sub" style="color:var(--brand-deep);font-weight:600;display:inline-flex;gap:5px;align-items:center">${I.wa}${T.repliedAgo(isAr()?l.replied.ar:l.replied.fr)}</span>`:l.camp?`<span class="sub">${T.prTpl.camp} · ${isAr()?"أُرسل أمس":"envoyé hier"} ${tick("read")}</span>`:"";
  return `<article class="prow" data-t="${l.tone}" aria-selected="${sel}" data-lrow="${l.id}">
    <div class="who"><b>${nm(l)}</b><div class="ph num">${l.ph}</div><div class="ln"><span>${I.pin}${cty(l)}</span><span>${I.box}${prd(l)}</span></div></div>
    <div class="sit">${chip(l.tone,l.replied?"wa":"user",l.replied?T.replied:T.prSit[l.sit])}${sub}</div>
    <div class="mv"><button class="btn-o" data-t="${l.tone}" data-tone>${I.phone}<span>${T.prMoves.call}</span></button><button class="btn-sq" data-lsheet="${l.id}" aria-label="WhatsApp" ${noConfig()?"data-off":""}>${I.wa}${l.replied?`<span class="n num">1</span>`:""}</button></div>
    <div class="val"><b>${money(l.val)}</b><span>${T.potential}</span></div>
  </article>`;
}
function screenProspects(){
  const T=t(), l=LEADS.find(x=>x.id===S.lead);
  return `<div class="body" style="grid-template-columns:minmax(0,1fr)"><section class="left">
    <div class="head"><div class="ttl">${I.people.replace("<svg","<svg class=\"hero\"")}<div><h2>${T.prTitle}</h2><div class="sub">${T.prSub(LEADS.length)}</div></div></div>
      <div class="end"><button class="btn-o">${I.filter}<span>${T.filter}</span></button><button class="btn-o">${I.sort}<span>${T.sort}</span></button></div></div>
    <div class="thead pros"><span>${T.prCols[0]}</span><span>${T.prCols[1]}</span><span>${T.prCols[2]}</span><span class="e">${T.prCols[3]}</span></div>
    <div class="rows" role="list">${LEADS.map(pRow).join("")}</div></section></div>
    ${l?waSheet({...l,prodf:l.prodf},{set:"prospect",defaultTpl:l.camp?"camp":"prospect_follow_up",windowOpen:!!l.replied,windowUntil:isAr()?"غداً 10:19":"demain 10:19",windowLabel:T.winNever,reply:l.reply}):""}`;
}

/* ═════════ Screen 5 — the product sheet sends the image ═════════ */
function productDrawer(o){
  const T=t(), windowOpen=S.screen!=="panel-closed"&&!optedOut();
  const cap=T.psCaption(prd(o),"249",T.cur);
  const btn=noConfig()?`<a class="sw" href="#" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--black);color:#fff;border-radius:8px;height:36px;flex:1;font-size:12px;font-weight:700">${I.wa}${T.sheetOpen}</a>`
    :optedOut()?`<button class="sw" disabled style="opacity:.4">${I.wa}${T.psSend}</button>`
    :S.send==="sending"?`<button class="sw" disabled><span class="spin" style="width:13px;height:13px"></span>${T.sending}</button>`
    :S.send==="sent"?`<button class="sw" data-done>${I.check2}${T.psSentTo(nm(o).split(" ")[0])}</button>`
    :`<button class="sw" data-send>${I.wa}${T.psSend}</button>`;
  const sent=S.send==="sent"?`<div class="sentcard"><div class="t">${I.wa}<span>${T.psSentTo(nm(o))}</span>${tick("sent")}</div><div class="cap">${esc(cap)}</div><div class="how">${windowOpen?T.psHowText:T.psHowTpl}</div></div>`:"";
  const noconf=noConfig()?`<div class="banner" data-tone="grey" style="margin:0 16px 12px">${I.info}<div><b>${T.noConfig}</b>${T.noConfigSub}</div></div>`:"";
  const opted=optedOut()?`<div class="banner" data-tone="warn" style="margin:0 16px 12px">${I.ban}<div><b>${T.optedOut}</b></div></div>`:"";
  return `<div class="rveil" id="veil"><aside class="pdr" role="dialog" aria-label="${T.psTitle}">
    <div class="dh"><h3>${T.psTitle}</h3><button class="x" data-close>${I.x}</button></div>
    <div class="db"><div class="cover" aria-hidden="true"></div>
      <div class="pi"><h4 class="q">${prd(o)}</h4><div class="pr"><span class="num">249</span><small>${T.cur}</small></div><p>${T.psDesc}</p>
        <div class="kv"><span>${T.psStock}</span><b class="num">142</b></div><div class="kv" style="margin-top:0"><span>${T.psSku}</span><b class="num">QT-GF-01</b></div></div>
      ${sent}${noconf}${opted}</div>
    <div class="df"><button class="cp">${I.copy}${T.psCopy}</button>${btn}</div>
  </aside></div>`;
}
function screenProduct(){
  const o=ORDERS[0];
  return `<div class="qpage">${qHead()}<div class="qbody">${qTable()}${qPanel(o,false)}</div></div>${productDrawer(o)}`;
}

/* ═════════ Mobile — the same markup in a phone ═════════ */
const sbar=()=>`<div class="sbar"><span>9:41</span><span style="display:flex;gap:6px;align-items:center">${I.sig}${I.wifi}${I.bat}</span></div>`;
function mobile(){
  const T=t(), o=ORDERS[0];
  let inner;
  if(S.screen==="panel"||S.screen==="panel-closed") inner=qPanel(o,true);
  else if(S.screen==="delivery"){const p=PARCELS.find(x=>x.id===S.sheet)||PARCELS[0]; inner=`<div class="mtop"><button class="back">${I.back}</button><b>${T.dTitle}</b></div><div style="padding:12px;opacity:.5">${PARCELS.slice(0,3).map(x=>`<div class="card" style="margin-bottom:8px"><b class="q">${nm(x)}</b><div style="font-size:13px;color:var(--ink-3)">${T.dSit[x.sit]}</div></div>`).join("")}</div>${waSheet(p,{set:"agent",defaultTpl:suggestTemplate(p),windowOpen:false})}`;}
  else if(S.screen==="prospects"){const l=LEADS.find(x=>x.id===S.lead)||LEADS[1]; inner=`<div class="mtop"><button class="back">${I.back}</button><b>${T.prTitle}</b></div><div style="padding:12px;opacity:.5">${LEADS.slice(0,3).map(x=>`<div class="card" style="margin-bottom:8px"><b class="q">${nm(x)}</b><div style="font-size:13px;color:var(--ink-3)">${T.prSit[x.sit]}</div></div>`).join("")}</div>${waSheet(l,{set:"prospect",defaultTpl:l.camp?"camp":"prospect_follow_up",windowOpen:!!l.replied,windowUntil:isAr()?"غداً 10:19":"demain 10:19",reply:l.reply})}`;}
  else inner=`<div class="mtop"><button class="back">${I.back}</button><b>${T.qTitle}</b></div>${productDrawer(o)}`;
  return `<div class="phones"><div class="pwrap"><p class="cap">${S.screen} · ${S.lang} · ${S.state}</p><div class="scr">${sbar()}${inner}<div class="home"></div></div></div></div>`;
}

/* ═════════ Render + notes ═════════ */
const NOTES={
 panel:`<b>Écran 1 — le panneau, onglet Messages.</b> Le panneau n'est pas redessiné : en-tête, bloc client, grille de faits, onglets, produit et les quatre issues sont ceux d'aujourd'hui. Deux ajouts : un bouton <b>WhatsApp</b> en contour à côté d'« Appeler » (jamais plus fort que lui), et l'onglet <b>Messages</b>. Le fil montre les deux sens, les coches d'état (✓ envoyé · ✓✓ remis · ✓✓ bleu lu · ⚠ échec + code Meta), et distingue un <b>modèle automatique</b> (éclair « Automatique · Expédié ») d'un texte de l'agent. Le composeur reprend la feuille de /delivery : bascule de langue (mémorisée sur le client), puces de modèles, aperçu avec variables surlignées ; « Texte libre » n'apparaît que si la <b>fenêtre de 24 h</b> est ouverte. Les variables viennent de la commande — l'agent ne saisit rien. Essayez les états : <code>Réponse non lue</code>, <code>Échec</code>, <code>Client désabonné</code>, <code>Marché non connecté</code>.`,
 "panel-closed":`<b>Écran 2 — fenêtre fermée.</b> Le client n'a pas écrit depuis 3 jours : WhatsApp n'autorise plus le texte libre, seulement un modèle approuvé. La puce l'annonce, le bouton « Texte libre » disparaît, rien n'est grisé sans explication. C'est le cas le plus fréquent en phase de confirmation.`,
 delivery:`<b>Écran 3 — /delivery.</b> La feuille est celle d'aujourd'hui (même cadre, même bascule, mêmes cinq modèles, <code>suggestTemplate</code> pré-choisit selon la situation). Un seul changement : le bouton envoie depuis le numéro de l'entreprise au lieu d'ouvrir wa.me. Après l'envoi : la ligne d'action est consignée comme aujourd'hui (<code>delivery_actions</code>), et la trace de la ligne + la chronologie portent le vrai statut (✓✓). Cliquez « Envoyer ». En <code>Marché non connecté</code>, le lien wa.me d'aujourd'hui reste tel quel.`,
 prospects:`<b>Écran 4 — prospects.</b> Le carré WhatsApp de la ligne ouvre le composeur avec la relance et le modèle de la campagne ; la puce « a répondu » et le badge sur le bouton signalent une réponse. Quand le prospect a répondu (ligne 2), la fenêtre est ouverte et le texte libre est possible, la réponse est rappelée en tête de feuille.`,
 product:`<b>Écran 5 — fiche produit.</b> « Envoyer sur WhatsApp » envoie l'image depuis le numéro de l'entreprise avec la légende actuelle (<code>productSheet.whatsappMessage</code>). Fenêtre ouverte : image + légende en libre ; fenêtre fermée : le modèle approuvé « Fiche produit » avec l'image en en-tête — la carte après envoi le dit.`
};
function render(){
  document.documentElement.dir=isAr()?"rtl":"ltr";
  document.documentElement.lang=S.lang;
  document.getElementById("note").innerHTML=NOTES[S.screen]||"";
  [["segLang","lang"],["segView","view"],["segScreen","screen"],["segState","state"]].forEach(([id,key])=>document.querySelectorAll(`#${id} button`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S[key])));
  const stage=document.getElementById("stage");
  if(S.view==="mobile"){ stage.innerHTML=mobile(); }
  else{
    const active=S.screen==="delivery"?2:S.screen==="prospects"?1:0;
    const body=S.screen==="delivery"?screenDelivery():S.screen==="prospects"?screenProspects():S.screen==="product"?screenProduct():screenPanel();
    stage.innerHTML=`<div class="hscroll"><div class="app">${topbar(active)}${body}</div></div>`;
  }
  const th=document.getElementById("thread"); if(th) th.scrollTop=th.scrollHeight;
  const ta=document.getElementById("ta"); if(ta&&S.focusTa){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);S.focusTa=false;}
  const u=new URLSearchParams({lang:S.lang,view:S.view,screen:S.screen,state:S.state});
  history.replaceState(null,"",location.pathname+"?"+u);
}
function resetCompose(){S.send=null;S.free=false;S.text="";S.ctpl=null;S.clang="ar";}
function simulateSend(){
  S.send="sending"; render();
  setTimeout(()=>{
    if(S.state==="failed"){S.send="failed";S.errCode=S.screen==="delivery"?131026:131000;}
    else{S.send="sent";S.sentBody=S.free?S.text:partsText(renderTpl(S.ctpl,S.clang,varsFor(ORDERS[0],S.clang)));}
    render();
  },900);
}
document.addEventListener("click",e=>{
  const seg=e.target.closest("#segLang button,#segView button,#segScreen button,#segState button");
  if(seg){const key={segLang:"lang",segView:"view",segScreen:"screen",segState:"state"}[seg.parentElement.id];S[key]=seg.dataset.v;
    if(key==="screen"||key==="state"){resetCompose();S.bell=S.state==="unread";S.sheet=S.screen==="delivery"?"p1":null;S.lead=S.screen==="prospects"?"l2":null;S.ptab=3;}
    return render();}
  if(e.target.closest("#bell")){S.bell=!S.bell;return render();}
  const pt=e.target.closest("[data-ptab]"); if(pt){S.ptab=+pt.dataset.ptab;return render();}
  const cl=e.target.closest("[data-clang]"); if(cl){S.clang=cl.dataset.clang;S.send=null;return render();}
  const ct=e.target.closest("[data-ctpl]"); if(ct){S.ctpl=ct.dataset.ctpl;S.free=false;S.send=null;return render();}
  if(e.target.closest("[data-cfree]")){S.free=true;S.send=null;S.focusTa=true;return render();}
  if(e.target.closest("[data-send]")){return simulateSend();}
  if(e.target.closest("[data-close]")||e.target.id==="veil"){S.sheet=null;S.lead=null;S.prodOpen=false;resetCompose();if(S.screen==="product")S.screen="panel";return render();}
  const ds=e.target.closest("[data-dsheet]"); if(ds){S.sheet=ds.dataset.dsheet;resetCompose();return render();}
  const ls=e.target.closest("[data-lsheet]"); if(ls){if(noConfig())return;S.lead=ls.dataset.lsheet;resetCompose();return render();}
  const row=e.target.closest("[data-open]"); if(row){S.open=row.dataset.open;return render();}
  if(!e.target.closest(".npop")&&!e.target.closest("#bell")&&S.bell&&S.state!=="unread"){S.bell=false;render();}
});
document.addEventListener("input",e=>{if(e.target.id==="ta"){S.text=e.target.value;const c=e.target.closest(".comp,.sb")?.querySelector(".hint,.cnt");if(c)c.textContent=t().chars(S.text.length);}});
/* boot */
S.bell=S.state==="unread"; S.sheet=S.screen==="delivery"?"p1":null; S.lead=S.screen==="prospects"?"l2":null;
render();
</script>
</body>
</html>
