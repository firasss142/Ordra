<!doctype html>
<!--
  Accueil (/dashboard) — prototype v3 (2026-10-07) : « le point du jour ».

  Demande du propriétaire (7 oct.) : refaire l'accueil — la page qu'il ouvre chaque jour en premier ;
  téléphone ET bureau ; garder l'idée (le total des commandes, et les commandes de chaque boutique) ;
  calme, élégant, moderne ; corriger les bugs introduits au fil des versions (v2 → calme → passes 2 et 3).

  Recommandation (détail dans le panneau « Ce qui change » du studio) :
  1. une question chaque matin — « est-ce que tout tourne, et d'où viennent mes commandes ? » ;
  2. les problèmes d'abord, une ligne chacun AVEC leur cause (pub coupée, boutique à l'arrêt, panne,
     commandes à relier, import ancien, file en retard) — rien à signaler = une ligne verte ;
  3. « Aujourd'hui » jugé contre une journée habituelle à la même heure, pas contre hier ; « Hier » ajouté ;
  4. le total et chaque boutique dans le même regard (barres empilées par boutique + légende chiffrée) ;
  5. l'argent en trois chiffres : encaissé, en route, bénéfice brut (« provisoire » tant que des colis roulent) ;
  6. téléphone d'abord : période collée en haut, boutiques en lignes, détail en feuille du bas, rien au seul survol.

  Formes tirées de la prod (lue le 7 oct., agrégats seulement) : Libye — pub à 0 depuis le 30 sept., commandes
  arrêtées le 29 à 17:30, connexion saine (960 synchros, 0 échec) ; Tunisie — 5 boutiques Converty connectées le
  5 oct., 698 anciennes commandes importées d'un coup (passées en juil.–sept.), toutes « pending », sans agent.

  DONNÉES FICTIVES (graine fixe) : boutiques, produits, montants inventés — le dépôt est public.
  Habillage « Aurore calme » (docs/design-system.md, palette des issues validée §2.4, couleurs boutique du plan).

  URL : ?set=normal|alerte|import|vide &role=owner|manager &lang=fr|ar &device=desktop|phone
        &period=today|yesterday|7d|30d|90d|month|m:2026-09|custom&from=&to= &view=cards|list &stale=1
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accueil v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --f:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fa:"IBM Plex Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif;
  --brand:#15803D; --brand-bg:#E9F6EE;
  --ground:#F6F7FB;
  --aurora:radial-gradient(58% 40% at 2% 0%,#D3DBFF 0%,transparent 72%),radial-gradient(48% 36% at 100% 0%,#FAD3EC 0%,transparent 72%),
           radial-gradient(56% 46% at 98% 100%,#C6F2DA 0%,transparent 72%),radial-gradient(52% 46% at 0% 100%,#FFE6B3 0%,transparent 72%),
           radial-gradient(40% 30% at 50% 50%,#EDE7FF 0%,transparent 80%),var(--ground);
  --card:rgba(255,255,255,.86); --card-edge:rgba(16,24,40,.06);
  --card-sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(42,52,110,.05);
  --card-sh-h:0 1px 2px rgba(16,24,40,.05),0 14px 36px rgba(42,52,110,.11);
  --ink:#0F1728; --ink-2:#475467; --ink-3:#667085; --ink-q:#8A94A6; --ink-4:#C9CED7;
  --line:rgba(15,23,40,.07); --track:rgba(15,23,40,.06);
  --good:#067647; --good-bg:#DCFAE6; --live:#12B76A;
  --warn:#B54708; --warn-bg:#FFF4E0; --warn-dot:#F79009;
  --bad:#C01048; --bad-bg:#FFE4E8; --bad-dot:#E8385A;
  --o-del:#4DAE7E; --o-route:#6FC29A; --o-ret:#E9A23B; --o-rej:#E46A7B; --o-junk:#9D8FEF; --o-call:#D0D5DD;
  --answer:#2C7F57; --tip:#101828; --studio-h:46px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9ECF3;color:var(--ink);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ── studio (prototype only, always LTR) ─────────────────────────────── */
.studio{position:sticky;top:0;z-index:300;height:var(--studio-h);display:flex;align-items:center;gap:16px;padding:0 14px;background:#101828;color:#E6E8EB;font-size:12.5px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.studio .brand{font-weight:800;letter-spacing:-.01em}
.studio .brand small{color:#98A2B3;font-weight:600;margin-inline-start:6px}
.st-g{display:inline-flex;align-items:center;gap:7px}
.st-g > span{color:#98A2B3;font-weight:600}
.st-seg{display:inline-flex;background:#1D2939;border-radius:8px;padding:2px}
.st-seg button{height:26px;padding:0 9px;border-radius:6px;color:#D0D5DD;font-weight:700;font-size:12px}
.st-seg button.on{background:#fff;color:#101828}
.st-chk{display:inline-flex;align-items:center;gap:6px;color:#D0D5DD;font-weight:600;cursor:pointer}
.st-notes{margin-inline-start:auto;height:30px;padding:0 13px;border-radius:8px;background:#15803D;color:#fff;font-weight:800;font-size:12.5px;flex:none}

/* ── device frames ───────────────────────────────────────────────────── */
.stagewrap{min-height:calc(100vh - var(--studio-h))}
.device{background:var(--ground)}
.device[data-device=phone]{width:390px;height:844px;margin:26px auto 40px;border-radius:46px;overflow:hidden;box-shadow:0 0 0 11px #0B0D10,0 0 0 12px #2A2F37,0 36px 90px rgba(20,25,60,.35);transform:translateZ(0)}
.app{display:flex;min-height:calc(100vh - var(--studio-h));background:var(--aurora);background-attachment:fixed}
.device[data-device=phone] .app{height:100%;min-height:0;overflow-y:auto;background-attachment:local;scrollbar-width:none}
.app[dir=rtl]{font-family:var(--fa)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.main{flex:1;min-width:0;container:main/inline-size}

/* ── sidebar (dark — the only dark surface) ──────────────────────────── */
.sb{position:sticky;top:var(--studio-h);height:calc(100vh - var(--studio-h));width:240px;flex:none;background:#0E1013;color:#E6E8EB;display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:10px;height:34px;padding:0 6px;font-weight:800;font-size:17px;letter-spacing:-.02em}
.sb-logo{width:26px;height:26px;border-radius:8px;background:#15803D;display:grid;place-items:center}
.sb-mkt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;background:#14171C;border:1px solid rgba(255,255,255,.08);text-align:start}
.sb-mkt span{display:grid;line-height:1.25;flex:1;min-width:0}
.sb-mkt b{font-size:13.5px;font-weight:700}
.sb-mkt small{font-size:11.5px;color:#7F858F;font-weight:600}
.flag{width:24px;height:16px;border-radius:3px;overflow:hidden;flex:none;display:block}
.sb-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.04);color:#7F858F;font-size:12.5px;font-weight:600}
.sb-search kbd{margin-inline-start:auto;font:inherit;font-size:11px;color:#5A616B;border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:0 5px}
.sb-nav{display:grid;gap:2px;margin-top:4px;overflow:auto;scrollbar-width:none}
.sb-nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;color:#B5BAC2;font-size:13.5px;font-weight:600;text-decoration:none;cursor:pointer}
.sb-nav a:hover{background:rgba(255,255,255,.07);color:#E6E8EB}
.sb-nav a.on{background:#15803D;color:#fff}
.sb-nav a .ic{width:17px;height:17px}
.sb-nav a .chev{margin-inline-start:auto;width:14px;height:14px;opacity:.5}
[dir=rtl] .sb-nav a .chev{transform:scaleX(-1)}
.sb-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid rgba(255,255,255,.08)}
.sb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#6172F3,#3538CD);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.sb-foot span:last-child{display:grid;line-height:1.25}
.sb-foot b{font-size:13px}
.sb-foot small{font-size:11.5px;color:#7F858F}
.pbar{display:none;position:sticky;top:0;z-index:30;height:52px;align-items:center;gap:6px;padding:0 10px 0 6px;background:#0E1013;color:#E6E8EB}
.pbar .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.pbar .ib .ic{width:20px;height:20px}
.pbar .word{font-weight:800;font-size:16px;letter-spacing:-.02em}
.pbar .grow{flex:1}
.pbar .chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:99px;background:#14171C;border:1px solid rgba(255,255,255,.1);font-size:12.5px;font-weight:700}
.pbar .bell{position:relative}
.pbar .bell i{position:absolute;top:8px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 2px #0E1013}
.device[data-device=phone] .sb{display:none}
.device[data-device=phone] .pbar{display:flex}
@media (max-width:767px){.sb{display:none}.pbar{display:flex}}

/* ── page ────────────────────────────────────────────────────────────── */
.page{max-width:1240px;margin:0 auto;padding:30px 40px 80px;display:flex;flex-direction:column;gap:20px}
.card{position:relative;background:var(--card);border:1px solid var(--card-edge);border-radius:20px;box-shadow:var(--card-sh);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);min-width:0}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.meta{font-size:13px;color:var(--ink-3);font-weight:500}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
[dir=rtl] .eyebrow{letter-spacing:0;text-transform:none;font-size:12px}
.ccy{font-size:.5em;font-weight:700;color:var(--ink-3);letter-spacing:0;margin-inline-start:.18em;unicode-bidi:isolate}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#3538CD;cursor:pointer}
.lnk:hover{text-decoration:underline}
.lnk .ic{width:14px;height:14px}
[dir=rtl] .lnk .ic.flipx{transform:scaleX(-1)}

/* header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ph .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:13.5px;color:var(--ink-3);font-weight:500}
.live{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--card-edge);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2.4s ease-out infinite}
.live.stale{background:var(--warn-bg);color:var(--warn);border-color:#FBE0B5;cursor:pointer}
.live.stale .ic{width:13px;height:13px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,183,106,.55)}70%{box-shadow:0 0 0 7px rgba(18,183,106,0)}100%{box-shadow:0 0 0 0 rgba(18,183,106,0)}}
.periods{position:relative;z-index:70}
.raise{z-index:70}
.seg{display:inline-flex;padding:3px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);box-shadow:var(--card-sh)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.seg button .ic{width:14px;height:14px}

/* À regarder */
.watch{padding:8px 10px;overflow:hidden}
.watch::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--acc,transparent)}
.watch.bad{--acc:linear-gradient(90deg,var(--bad-dot),rgba(232,56,90,.25))}
.watch.warn{--acc:linear-gradient(90deg,var(--warn-dot),rgba(247,144,9,.25))}
.w-h{display:flex;align-items:center;gap:8px;padding:8px 10px 2px}
.w-h b{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
[dir=rtl] .w-h b{letter-spacing:0;text-transform:none;font-size:12.5px}
.w-h i{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--bad-dot);border-radius:99px;padding:0 6px;line-height:17px}
.watch.warn .w-h i{background:var(--warn-dot)}
.wl{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 10px}
.wl + .wl{border-top:1px solid var(--line)}
.wi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.wi .ic{width:17px;height:17px}
.wl.bad .wi{background:var(--bad-bg);color:var(--bad)}
.wl.warn .wi{background:var(--warn-bg);color:var(--warn)}
.wl.ok .wi{background:var(--good-bg);color:var(--good)}
.wl b{display:block;font-size:14px;font-weight:700;line-height:1.35}
.wl.bad b{color:#A8323F}
.wl small{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.45}
.wa{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid rgba(15,23,40,.1);font-size:12.5px;font-weight:700;white-space:nowrap}
.wa:hover{border-color:var(--ink-4);box-shadow:0 4px 14px rgba(42,52,110,.08)}
.wa .ic{width:13px;height:13px}
[dir=rtl] .wa .ic{transform:scaleX(-1)}
.watch.ok{padding:4px 10px}
.watch.ok .wl b{color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:292px minmax(0,1fr);gap:36px;padding:24px 28px 20px}
.h-eye{font-size:13px;font-weight:700;color:var(--ink-2)}
.h-eye span{color:var(--ink-3);font-weight:600}
.h-num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.h-num > b{font-size:54px;font-weight:800;letter-spacing:-.045em;line-height:1}
.h-cmp{margin-top:9px;font-size:13px;color:var(--ink-3);font-weight:500;line-height:1.5}
.h-cmp b{color:var(--ink-2);font-weight:700}
.tr{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 7px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:default}
.tr .ic{width:12px;height:12px;stroke-width:2.6}
.tr.good{background:var(--good-bg);color:var(--good)}
.tr.bad{background:var(--bad-bg);color:var(--bad)}
.tr.eq{background:rgba(15,23,40,.05);color:var(--ink-3);padding:0 9px}
.tr.sm{height:21px;font-size:11.5px}
.verdict{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.verdict i{width:7px;height:7px;border-radius:50%}
.verdict.ok{background:rgba(255,255,255,.8);border:1px solid var(--card-edge);color:var(--ink-2)}
.verdict.ok i,.verdict.good i{background:var(--live)}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.warn i{background:var(--warn-dot)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)} .verdict.bad i{background:var(--bad-dot)}
.verdict.flat{background:rgba(15,23,40,.05);color:var(--ink-3)} .verdict.flat i{background:var(--ink-4)}
.legend{display:grid;gap:1px;margin-top:16px}
.lg{display:grid;grid-template-columns:24px minmax(0,1fr) auto 42px;align-items:center;gap:10px;width:100%;padding:6px 8px;margin-inline:-8px;width:calc(100% + 16px);border-radius:10px;text-align:start;transition:background .15s}
.lg:hover,.lg.on{background:rgba(255,255,255,.85)}
.lg .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .nm small{display:none}
.lg .ct{font-size:14px;font-weight:800}
.lg .sh{font-size:12px;font-weight:600;color:var(--ink-3);text-align:end}
.lg.zero .ct{color:var(--bad)}
.lg.fold{cursor:default}
.lg.fold:hover{background:none}
.sw{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--a5),var(--a7));box-shadow:0 3px 8px color-mix(in srgb,var(--a5) 30%,transparent)}
.sw.slate{--a5:#98A2B3;--a7:#667085}
.h-chart{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}

/* bars (multi-day) */
.bchart{display:grid;gap:8px}
.plot{position:relative;height:236px}
.bars{position:absolute;inset:22px 0 0;display:grid;align-items:end;border-bottom:1px solid var(--line)}
.col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col::before{content:"";position:absolute;inset:-22px 0 0;border-radius:8px;transition:background .12s}
.col:hover::before,.col.hot::before{background:rgba(255,255,255,.55)}
.stk{position:relative;width:min(var(--bw,22px),62%);display:flex;flex-direction:column-reverse;gap:2px}
.sg{display:block;min-height:2px;border-radius:2px;background:color-mix(in srgb,var(--a5) 40%,#fff);transition:opacity .15s,background .15s}
.stk .sg:last-child{border-radius:5px 5px 2px 2px}
.col.last .sg{background:color-mix(in srgb,var(--a5) 66%,#fff)}
.col.part .sg{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 2px,transparent 2px 5px);opacity:.6}
.hero.focus .sg{opacity:.16}
.hero.focus .sg.lit{opacity:1;background:var(--a5)}
.col em{position:absolute;bottom:calc(var(--h) + 5px);font-style:normal;font-size:12px;font-weight:800;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.avg{position:absolute;inset-inline:0;height:0;border-top:1.5px dashed rgba(15,23,40,.24);z-index:1;pointer-events:none}
.avg span{position:absolute;inset-inline-start:0;bottom:4px;font-size:11px;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,.9);padding:1px 7px;border-radius:99px;white-space:nowrap}
.xl{display:grid;font-size:11.5px;color:var(--ink-q);font-weight:600}
.xl span{display:flex;justify-content:center;white-space:nowrap;min-width:0;visibility:hidden}
.xl span.x-edge,.xl span.x-wk{visibility:visible}
@container main (max-width:480px){.xl span.x-wk{visibility:hidden}.xl span.x-mid{visibility:visible}}
.xl span:first-child{justify-content:flex-start}
.xl span:last-child{justify-content:flex-end}
.ckey{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey .k-part{width:12px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--ink-4) 0 2px,transparent 2px 5px)}
.ckey .k-avg{width:16px;border-top:1.5px dashed rgba(15,23,40,.35)}
.ckey .k-line{width:16px;height:2px;border-radius:2px;background:#1D2939}

/* pace (today / yesterday) */
.pchart{display:grid;gap:8px}
.pplot{position:relative;height:236px;cursor:crosshair}
.pplot svg{position:absolute;inset:22px 0 0;width:100%;height:calc(100% - 22px);overflow:visible}
[dir=rtl] .pplot svg{transform:scaleX(-1)}
.p-base{stroke:var(--line);stroke-width:1}
.p-usual{fill:none;stroke:#98A2B3;stroke-width:1.75;stroke-dasharray:5 5}
.p-line{fill:none;stroke:#1D2939;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.p-area{fill:url(#pg)}
.p-now{stroke:var(--ink-4);stroke-width:1}
.p-in{position:absolute;inset:22px 0 0}
.p-dot{position:absolute;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#1D2939;box-shadow:0 0 0 2.5px #fff,0 2px 8px rgba(16,24,40,.25);inset-inline-start:var(--x);top:var(--y)}
.p-lab{position:absolute;inset-inline-start:var(--x);top:var(--y);transform:translate(-50%,-150%);font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;background:rgba(255,255,255,.9);padding:1px 7px;border-radius:99px}
[dir=rtl] .p-lab{transform:translate(50%,-150%)}
.p-lab.u{font-weight:700;color:var(--ink-3);transform:translate(-100%,-140%)}
[dir=rtl] .p-lab.u{transform:translate(100%,-140%)}
.p-cross{position:absolute;top:0;bottom:0;width:0;border-inline-start:1px solid rgba(15,23,40,.22);display:none;pointer-events:none}
.pxl{position:relative;height:16px;font-size:11.5px;color:var(--ink-q);font-weight:600}
.pxl span{position:absolute;inset-inline-start:var(--x);transform:translateX(-50%);white-space:nowrap}
[dir=rtl] .pxl span{transform:translateX(50%)}
.pxl span:first-child{transform:none}
.pxl span:last-child{transform:translateX(-100%)}
[dir=rtl] .pxl span:last-child{transform:translateX(100%)}

/* row B */
.rowb{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:18px}
.rowb.one{grid-template-columns:1fr}
.box{padding:22px 26px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.mat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.mat i{width:7px;height:7px;border-radius:50%;background:var(--live)}
.mat.warn i{background:var(--warn-dot)}
.obar{display:flex;gap:2px;height:12px;margin-top:16px}
.obar i{display:block;height:100%;border-radius:3px;min-width:4px;background:var(--k)}
.oleg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.oleg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.oleg i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.oleg b{color:var(--ink);font-weight:700}
.oleg small{font-size:11.5px;color:var(--ink-3);font-weight:600}
.k-del{--k:var(--o-del)} .k-route{--k:var(--o-route)} .k-ret{--k:var(--o-ret)} .k-rej{--k:var(--o-rej)} .k-junk{--k:var(--o-junk)} .k-call{--k:var(--o-call)}
.tiles{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line)}
.tile{min-width:0;padding:16px 18px 4px 0}
.tile + .tile{padding-inline-start:18px;border-inline-start:1px solid var(--line)}
.tile:last-child{padding-inline-end:0}
.tile .l{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tile .v{margin-top:6px;font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.1;white-space:nowrap}
.tile .v small{font-size:14px;font-weight:700;color:var(--ink-3);letter-spacing:0;margin-inline-start:4px}
.tile .v.z{color:var(--ink-4)}
.tile .s{margin-top:5px;font-size:12px;color:var(--ink-3);font-weight:500;line-height:1.4}
.tile .s.bad{color:var(--bad);font-weight:600}
.box .lnk{margin-top:16px}
.m-paid{margin-top:14px}
.m-paid .l,.m-row .l{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.m-paid b{display:block;margin-top:6px;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--answer)}
.m-paid small,.m-row small{display:block;margin-top:5px;font-size:12px;color:var(--ink-3);font-weight:500}
.m-row{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-top:1px solid var(--line)}
.m-row > div{padding:16px 16px 0 0;min-width:0}
.m-row > div + div{padding-inline-start:18px;border-inline-start:1px solid var(--line)}
.m-row b{display:block;margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.m-row b.neg{color:var(--bad)}
.prov{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:800;cursor:default}
.why{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:700;color:#3538CD}
.why .ic{width:13px;height:13px}
.why:hover{text-decoration:underline}

/* stores */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 2px 0}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.025em}
.sec-h .meta{margin-top:3px}
.vt{display:inline-flex;padding:3px;border-radius:11px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95)}
.vt button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.vt button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(42,52,110,.10)}
.vt .ic{width:14px;height:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:18px}
.sc{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;padding:20px 20px 16px;border-radius:20px;background:var(--card);border:1px solid color-mix(in srgb,var(--a5) 18%,transparent);box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px color-mix(in srgb,var(--a5) 8%,transparent);cursor:pointer;text-align:start;transition:transform .2s,box-shadow .2s}
.sc::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a5),color-mix(in srgb,var(--a5) 25%,transparent))}
[dir=rtl] .sc::before{background:linear-gradient(270deg,var(--a5),color-mix(in srgb,var(--a5) 25%,transparent))}
.sc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--a5) 7%,#fff),rgba(255,255,255,0) 150px)}
.sc:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(16,24,40,.05),0 16px 40px color-mix(in srgb,var(--a5) 16%,transparent)}
.sc.alarm{border-color:#F6CDD2}
.sc-h{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--a5),var(--a7));box-shadow:0 0 0 3px #fff,0 8px 20px color-mix(in srgb,var(--a5) 35%,transparent)}
.sc-n{min-width:0;flex:1}
.sc-n b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;color:color-mix(in srgb,var(--a7) 70%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-n small{display:block;margin-top:1px;font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;flex:none;align-self:flex-start;margin-top:3px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.fresh.live i{background:var(--live)}
.fresh.bad{color:var(--bad)} .fresh.bad i{background:var(--bad-dot)}
.sc-c{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.sc-c .cnt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sc-c .cnt > b{font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1}
.sc-c .cnt > b.zero{color:var(--bad)}
.sc-sub{margin-top:5px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.spark{display:flex;align-items:flex-end;gap:2px;width:118px;height:38px;flex:none}
.spark i{flex:1;min-height:2px;border-radius:2px 2px 1px 1px;background:color-mix(in srgb,var(--a5) 45%,#fff)}
.spark i.last{background:var(--a5)}
.spark i.part{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--a5) 55%,#fff) 0 2px,transparent 2px 4px)}
.spark i.z{background:var(--track)}
.prods{display:flex;align-items:center;gap:6px;margin-top:12px;min-width:0}
.pc{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2);min-width:0;max-width:48%}
.pc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ic{width:12px;height:12px;color:var(--ink-q)}
.pc.more{flex:none;color:var(--ink-3)}
.sc-q{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sc-q.flat{grid-template-columns:1fr}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
[dir=rtl] .ring svg{transform:scaleX(-1)}
.ring .tk{fill:none;stroke:var(--track);stroke-width:9}
.ring .tk.dash{stroke:var(--ink-4);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
.ring .sgr{fill:none;stroke:var(--k);stroke-width:9}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring .rc b{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1;color:color-mix(in srgb,var(--a7) 70%,var(--ink))}
.ring .rc small{font-size:11px;font-weight:600;color:var(--ink-3);margin-top:3px}
.ring .rc.early small{max-width:80px;line-height:1.25}
.minis{display:grid;gap:9px}
.mi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.mi b{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
.mi b small{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-inline-start:4px}
.mi b.z{color:var(--ink-4)}
.minis.row{grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.minis.row .mi{display:grid;gap:2px;justify-items:start;padding-inline:12px;border-inline-start:1px solid var(--line)}
.minis.row .mi:first-child{padding-inline-start:0;border:0}
.minis.row .mi b{font-size:19px}
.note{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.note .ni{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--good-bg);color:var(--good)}
.note .ni .ic{width:14px;height:14px}
.note div{min-width:0;flex:1}
.note b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.bad .ni{background:var(--bad-bg);color:var(--bad)} .note.bad b{color:#A8323F}
.note.warn .ni{background:var(--warn-bg);color:var(--warn)} .note.warn b{color:#9A5B07}
.note.new .ni{background:#EEF2FF;color:#4F5BD5}
.note.flat .ni{background:rgba(15,23,40,.05);color:var(--ink-3)}

/* list view (desktop) */
.slist{padding:6px 12px}
.sr{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1.5fr) 74px 96px 118px minmax(0,1.9fr) 16px;align-items:center;gap:14px;padding:12px 8px;border-radius:12px;cursor:pointer}
.sr + .sr{border-top:1px solid var(--line)}
.sr:hover{background:linear-gradient(90deg,color-mix(in srgb,var(--a5) 9%,transparent),transparent 70%)}
[dir=rtl] .sr:hover{background:linear-gradient(270deg,color-mix(in srgb,var(--a5) 9%,transparent),transparent 70%)}
.sr.hd{cursor:default;padding-block:8px}
.sr.hd:hover{background:none}
.sr.hd span{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
[dir=rtl] .sr.hd span{letter-spacing:0;text-transform:none;font-size:12px}
.sr .who{display:flex;align-items:center;gap:11px;min-width:0}
.sr .who .av{width:36px;height:36px;border-radius:11px;font-size:13px;box-shadow:0 0 0 2px #fff,0 5px 12px color-mix(in srgb,var(--a5) 30%,transparent)}
.sr .who span{display:grid;min-width:0}
.sr .who b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .who small{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sr .vol{display:grid;gap:5px}
.sr .vol b{font-size:15px;font-weight:800}
.sr .vol b small{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-inline-start:5px}
.bar5{height:5px;border-radius:99px;background:var(--track);overflow:hidden}
.bar5 i{display:block;height:100%;border-radius:99px;background:var(--a5)}
.sr .num-c{font-size:14px;font-weight:800;white-space:nowrap}
.sr .num-c small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.sr .st{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sr .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .st .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--live)}
.sr .st.bad{color:var(--bad)} .sr .st.bad .dot{background:var(--bad-dot)}
.sr .st.warn{color:var(--warn)} .sr .st.warn .dot{background:var(--warn-dot)}
.sr .st.flat .dot{background:var(--ink-4)}
.sr .go{color:var(--ink-q)}
[dir=rtl] .sr .go{transform:scaleX(-1)}

/* phone rows */
.srows{display:none;padding:4px 14px}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.prow + .prow{border-top:1px solid var(--line)}
.prow .av{width:40px;height:40px;border-radius:12px;font-size:13.5px;box-shadow:0 0 0 2px #fff,0 5px 12px color-mix(in srgb,var(--a5) 30%,transparent)}
.prow .tx{min-width:0}
.prow .tx b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tx small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden}
.prow .tx small i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
.prow .tx small i.on{background:var(--live)}
.prow .tx .al{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;font-weight:700}
.prow .tx .al.bad{color:var(--bad)} .prow .tx .al.warn{color:var(--warn)}
.prow .tx .al .ic{width:13px;height:13px}
.prow .rt{display:grid;justify-items:end;gap:3px}
.prow .rt b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.prow .rt b.zero{color:var(--bad)}

/* silent stores + footer */
.silent{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:2px;padding:0 4px}
.sil-t{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-3)}
.sil-t b{color:#3538CD;font-weight:700}
.sil-l{display:none;flex-wrap:wrap;gap:6px;width:100%}
.silent.open .sil-l{display:flex}
.sil-c{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.sil-c small{color:var(--ink-3);font-weight:500}
.connect{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;border:1px dashed var(--ink-4);font-size:12.5px;font-weight:700;color:var(--ink-2)}
.connect .ic{width:14px;height:14px}
.foot{font-size:12.5px;color:var(--ink-3);font-weight:500;padding:4px 4px 0;line-height:1.55}

/* empty */
.empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:8px;padding:34px 20px;border-radius:18px;border:1.5px dashed var(--ink-4)}
.empty .ei{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#EEF2FF;color:#4F5BD5}
.empty .ei .ic{width:22px;height:22px}
.empty b{font-size:16px;font-weight:800}
.empty small{font-size:13px;color:var(--ink-3);max-width:460px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px}
.btn:hover{background:#12692F}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);border:1px solid rgba(15,23,40,.1)}

/* popover, sheet, toast, tooltip */
.pop{position:absolute;z-index:80;top:calc(100% + 8px);inset-inline-end:0;width:300px;padding:10px;border-radius:16px;background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:0 24px 60px rgba(20,25,60,.20);text-align:start}
.pop.wide{width:420px}
.pop h6,.sheet h6{margin:6px 8px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
[dir=rtl] .pop h6,[dir=rtl] .sheet h6{letter-spacing:0;text-transform:none;font-size:12px}
.pi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:700;text-align:start}
.pi small{font-size:12px;color:var(--ink-3);font-weight:600}
.pi:hover{background:#F2F4F7}
.pi.on{background:var(--brand-bg);color:var(--brand)}
.pi.on small{color:var(--brand)}
.pi .ic{width:15px;height:15px}
.sep{height:1px;background:var(--line);margin:6px 4px}
.cal{padding:4px 6px 2px}
.cal-h{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;text-align:center;margin-bottom:6px}
.cal-h b{font-size:13.5px;font-weight:800}
.cal-nav{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.cal-nav:hover{background:rgba(15,23,40,.05)}
.cal-nav:disabled{opacity:.25;cursor:default}
[dir=rtl] .cal-nav .ic{transform:scaleX(-1)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.cal-w{height:24px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--ink-3)}
.cal-d{height:36px;font-size:13px;font-weight:700;border-radius:9px;font-variant-numeric:tabular-nums}
.cal-d:hover{background:rgba(15,23,40,.05)}
.cal-d.in{background:color-mix(in srgb,var(--brand) 11%,transparent);border-radius:0}
.cal-d.st,.cal-d.en{background:var(--brand);color:#fff}
.cal-d.st{border-start-start-radius:9px;border-end-start-radius:9px;border-start-end-radius:0;border-end-end-radius:0}
.cal-d.en{border-start-end-radius:9px;border-end-end-radius:9px;border-start-start-radius:0;border-end-start-radius:0}
.cal-d.st.en{border-radius:9px}
.cal-d.td{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal-d:disabled{color:var(--ink-4);cursor:default;background:none}
.cal-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 4px 2px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);font-weight:600}
.cal-f .btns{display:flex;gap:8px}
.cal-f .btn{height:34px;font-size:13px}
.cal-f .btn:disabled{opacity:.45;cursor:default}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13px;align-items:baseline;padding:4px 8px}
.calc span{color:var(--ink-2);font-weight:600}
.calc span small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.calc b{text-align:end;font-weight:700;white-space:nowrap}
.calc .tot{border-top:1px solid var(--line);padding-top:9px;font-weight:800;color:var(--ink)}
.calc-n{margin:10px 8px 4px;font-size:12px;color:var(--ink-3);line-height:1.5}
.scrim{position:fixed;inset:0;z-index:90;background:rgba(15,23,40,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s ease both}

// ═════════════════════════════════════════════════════════════════════════

const $ = (s, r = document) => r.querySelector(s);

      const base = { recent: N(h.stop.recent), days: N(h.stop.days), usual: N(h.stop.usual), day: dayL(h.stop.since) };
      if (h.stop.ads) alerts.push({ sev: "bad", icon: "mega", title: t("a_ads", base), sub: t("a_adsS", { ...base, spend: owner() ? M(sc.adsDaily) : null, sync: N(st.sync || 5) }), act: t("act_ads"), go: "Finances › Dépenses pub" });
      else alerts.push({ sev: "bad", icon: "moon", title: t("a_stop", { ...base, store: esc(st.name) }), sub: t("a_stopS", base), act: t("act_see"), go: `store:${st.id}` });
    }
    if (h.broken) alerts.push({ sev: "bad", icon: "plug", title: t("a_broken", { store: esc(st.name), time: hm(h.broken.min) }), sub: t("a_brokenS", { n: N(h.broken.n), msg: h.broken.msg[S.lang] }), act: t("act_conn"), go: "Système › Connexions" });
    if (h.imported) alerts.push({ sev: "warn", icon: "download", title: t("a_imp", { n: N(h.imported.n), store: esc(st.name) }), sub: t("a_impS", { day: dayL(h.imported.day), from: dayL(h.imported.from), to: dayL(h.imported.to) }), act: t("act_imp"), go: "Commandes" });
    if (h.unmapped) alerts.push({ sev: "warn", icon: "link", title: t("a_unm", { n: N(h.unmapped), store: esc(st.name) }), sub: t("a_unmS", { pf: tg("pf", st.pf) }), act: t("act_link"), go: "Commandes › Produits à relier" });
  }
  if (sc.adsStop && !stoppedAds) alerts.push({ sev: "warn", icon: "mega", title: t("a_adsOnly", { day: dayL(sc.adsStop) }), sub: t("a_adsOnlyS"), act: t("act_ads"), go: "Finances › Dépenses pub" });
  const waitingOld = data.orders.filter((o) => o.day < TODAY && bkAt(o, NOW_TM) === "c" && !o.hold);
  if (waitingOld.length >= 5) {
    const oldest = Math.min(...waitingOld.map((o) => o.at));
    alerts.push({ sev: "warn", icon: "phone", title: t("a_queue", { n: N(waitingOld.length) }), sub: t("a_queueS", { d: dur(NOW_TM - oldest) }), act: t("act_room"), go: "Équipe › Salle de contrôle" });
  }
  alerts.sort((x, y) => (x.sev === "bad" ? 0 : 1) - (y.sev === "bad" ? 0 : 1));

  // ── money (owner) ──
  const adsIn = (f, tt) => { let v = 0; for (let d = f; d <= tt; d = shift(d, 1)) v += data.ads[d] || 0; return v; };
  const money = (s2, f, tt) => { const m = s2.money, ads = adsIn(f, tt); return { ...m, ads, profit: m.paid - m.cogs - m.car - m.pack - m.proc - ads }; };
  const mA = w.day ? null : money(sA, w.from, w.to);
  const mP = w.day ? null : money(sP, w.pf, w.pt);
  const imported = stores.reduce((v, x) => v + (x.h.imported ? x.h.imported.n : 0), 0);
  const lastAny = Math.max(...stores.map((x) => x.lastAt ?? -Infinity));

  return { kspark, prevDaily, sc, data, w, A, sA, sP, comparable, pace, stores, shown, silent, cols, avg, alerts, mA, mP, mkt, imported, lastAny, health };
}

/** A card's one line — the first that applies (connection, stop, import, links, …). */
function noteFor(x, w, best, mkt) {
  const h = x.h, a = x.a;
  if (h.broken) return { cls: "bad", icon: "plug", b: t("n_broken", { time: hm(h.broken.min) }), s: t("n_brokenS", { n: N(h.broken.n) }) };
  if (h.stop) return { cls: "bad", icon: "moon", b: t("n_stop", { day: dayL(h.stop.since) }), s: t("n_stopS", { recent: N(h.stop.recent), days: N(h.stop.days), usual: N(h.stop.usual), ads: h.stop.ads }) };
  if (h.imported) return { cls: "warn", icon: "download", b: t("n_imp", { n: N(h.imported.n) }), s: t("n_impS", { day: dayL(h.imported.day) }) };
  if (h.unmapped) return { cls: "warn", icon: "link", b: t("n_unm", { n: N(h.unmapped) }), s: t("n_unmS") };
  if (h.waiting) return { cls: "new", icon: "clock", b: t("n_wait"), s: t("n_waitS", { when: t("whenY", { time: hm(h.waiting.min) }), sync: N(x.st.sync || 4) }) };
  if (w.day) return { cls: "ok", icon: "check", b: t("n_ok"), s: t("n_okT", { ago: ago(x.lastAt) }) };
  if (x.st.since && x.st.since >= w.from && daysLen(x.st.since, w.to) <= 21 && a.n < JUDGED) return { cls: "new", icon: "spark", b: t("n_new"), s: t("n_newS", { day: dayL(x.st.since) }) };
  if (a.n < JUDGED) return { cls: "flat", icon: "clock", b: t("n_few"), s: t("n_fewS") };
  const del = a.delRate == null ? null : Math.round(a.delRate), m = mkt == null ? null : Math.round(mkt);
  const vs = del == null || m == null ? "" : t("n_okS", { del: P(del), mkt: P(m) });
  if (best === x.st.id) return { cls: "good", icon: "star", b: t("n_best"), s: vs };
  if (del != null && m != null && del <= m - 5) return { cls: "warn", icon: "alert", b: t("n_below"), s: vs };
  return { cls: "ok", icon: "check", b: t("n_ok"), s: vs };
}

const initials = (name) => (name.split(/\s+/).filter((x) => /^[\p{L}\p{N}]/u.test(x)).slice(0, 2).map((x) => x[0]).join("") || "?").toUpperCase();
const pfLabel = (st) => tg("pf", st.pf) + (st.sheets ? ` · ${t("viaSheets")}` : "");

// A dead band: under ±5 % (or ±2 pts) a change is noise — grey, never a red or green verdict.
function trendPct(now, prev, ok = true, tip = "") {
  if (!ok) return "";
  const c = change(now, prev);
  if (!c) return "";
  if (!c.dir) return `<span class="tr eq" data-tip="${esc(tip)}">=</span>`;
  const cls = c.pct < 5 ? "eq" : c.dir > 0 ? "good" : "bad";
  return `<span class="tr ${cls}" data-tip="${esc(tip)}">${ic(c.dir > 0 ? "up" : "dn")}${c.times ? `×${N(c.times)}` : P(c.pct)}</span>`;
}
function trendPts(now, prev, ok, tip = "", sm = false) {
  if (!ok || now == null || prev == null) return "";
  const d = Math.round(now) - Math.round(prev);
  if (!d) return `<span class="tr eq${sm ? " sm" : ""}" data-tip="${esc(tip)}">=</span>`;
  const cls = Math.abs(d) < 2 ? "eq" : d > 0 ? "good" : "bad";
  const unit = S.lang === "ar" ? plAr(Math.abs(d), ["نقطة", "نقطتان", "نقاط", "نقطة", "نقطة"]) : Math.abs(d) > 1 ? "pts" : "pt";
  return `<span class="tr ${cls}${sm ? " sm" : ""}" data-tip="${esc(tip)}">${ic(d > 0 ? "up" : "dn")}${N(Math.abs(d))}${NB}${unit}</span>`;
}

/** v9 · a quiet trend inside each KPI — the time the ring cannot show. Today's bar is hatched:
 *  a day in progress is never read as a drop. */
function ksparkHTML(V, key) {
  const sp = V.kspark || [];
  if (sp.length < 3) return "";
  const max = Math.max(1, ...sp.map((b) => b[key]));
  const lastFull = sp.map((b) => !b.part).lastIndexOf(true);
  const fmt = (v) => (key === "val" ? M(v) : N(v));
  return `<div class="kspark">${sp.map((b, i) => `<i class="${b.part ? "part" : i === lastFull ? "last" : ""}" style="height:${b[key] ? Math.max(6, (b[key] / max) * 100).toFixed(1) : 4}%" data-tip="${esc(`${b.lab} · ${fmt(b[key])}${b.part ? (S.lang === "ar" ? " · جارٍ" : " · en cours") : ""}`)}"></i>`).join("")}</div>`;
}

/** v8 · shares by largest remainder: the column always adds up to exactly 100 %
 *  (round 1's pain was « numbers I don't trust » — 33 + 33 + 33 is one of them). */
function shareRound(ns) {
  const tot = sum(ns);
  if (!tot) return ns.map(() => 0);
  const raw = ns.map((v) => (v / tot) * 100), fl = raw.map(Math.floor);
  let left = 100 - sum(fl);
  raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && ns[i] > 0) { fl[i]++; left--; } });
  return fl;
}
/** The ring's centre is a readout: empty at rest, the store under the pointer (or tapped) otherwise. */
function pieCenter(V, id) {
  if (!V.sA.n) return `<small>${S.lang === "ar" ? "لا طلبات" : "aucune commande"}</small>`;
  const r = id && V.brk ? V.brk.find((y) => y.id === id) : null;
  return r ? `<b class="num">${P(r.sh)}</b><small>${esc(r.name)}</small>` : "";
}
/** v8 · the storefront breakdown: a calm ring for the shape, ONE ranked list for the numbers.
 *  Every figure appears once — name, orders, share, CA. The ring carries no text at all. */
function pieHTML(V) {
  const ar = S.lang === "ar", tot = V.sA.n, own = owner();
  const top = V.shown.slice(0, 6), rest = V.shown.slice(6);
  const rows = top.map((x) => ({ id: x.st.id, name: x.st.name, ini: initials(x.st.name), hue: x.st.hue, n: x.a.n, ca: x.a.money.val, zero: x.a.n === 0 && !!(x.h.stop || x.h.broken) }));
  if (rest.length) rows.push({ id: "", name: t("others", { n: N(rest.length) }), ini: "+", hue: "slate", n: sum(rest.map((x) => x.a.n)), ca: sum(rest.map((x) => x.a.money.val)) });
  const sh = shareRound(rows.map((r) => r.n));
  rows.forEach((r, i) => { r.sh = sh[i]; });
  V.brk = rows;
  // one stroked circle per store, 3 px apart, from 12 o'clock clockwise — biggest first
  const R = 84, C = 2 * Math.PI * R, lit = rows.filter((r) => r.n), gap = lit.length > 1 ? 3 : 0;
  let acc = 0;
  const segs = lit.map((r) => {
    const len = (r.n / tot) * C, vis = Math.max(len - gap, 1.5);
    const el = `<circle class="slice${S.focus && S.focus === r.id ? " lit" : ""}" data-s="${r.id}"${r.id ? ` data-store="${r.id}"` : ""} cx="100" cy="100" r="${R}" stroke-dasharray="${vis.toFixed(2)} ${(C + 10).toFixed(2)}" stroke-dashoffset="${(-acc - gap / 2).toFixed(2)}" style="${hueVars(r.hue)}"/>`;
    acc += len;
    return el;
  }).join("");
  const donut = `<div class="donut"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="${R}"/><g transform="rotate(-90 100 100)">${segs}</g></svg><div class="pie-c" id="pieC">${pieCenter(V, S.focus)}</div></div>`;
  const head = `<div class="lrow lh" aria-hidden="true"><span></span><span>${ar ? "المتجر" : "Boutique"}</span><span class="r span2">${ar ? "الطلبات" : "Commandes"}</span>${own ? `<span class="r">${ar ? "رقم الأعمال" : "CA"}</span>` : ""}</div>`;
  const body = rows.map((r) => `<button class="lrow${S.focus && S.focus === r.id ? " lit" : ""}${r.id ? "" : " fold"}" data-s="${r.id}"${r.id ? ` data-store="${r.id}" aria-pressed="${S.focus === r.id}"` : " disabled"} style="${hueVars(r.hue)}">
      <span class="sw${r.id ? "" : " slate"}">${esc(r.ini)}</span>
      <span class="ln">${esc(r.name)}</span>
      <b class="num r${r.zero ? " zero" : ""}">${N(r.n)}</b>
      <span class="num r sh">${r.n ? P(r.sh) : "—"}</span>
      ${own ? `<span class="num r ca">${r.n ? MH(r.ca) : "—"}</span>` : ""}
    </button>`).join("");
  return `<div class="brk" role="group" aria-label="${esc((ar ? "الطلبات حسب المتجر: " : "Commandes par boutique : ") + rows.map((r) => `${r.name} ${r.n}`).join(", "))}">${donut}<div class="lst${own ? "" : " noca"}">${head}${body}</div></div>`;
}

/** Days (or weeks), stacked by store in their soft hues; the day in progress hatched, outside the average. */
function barsHTML(V) {
  const cols = V.cols, max = Math.max(1, ...cols.map((c) => c.n));
  const order = V.shown.map((x) => x.st);
  const lastFull = cols.map((c) => !c.part).lastIndexOf(true);
  const maxI = cols.reduce((b, c, i) => (c.n > cols[b].n ? i : b), 0);
  const weekly = cols.length && cols[0].days > 1 || V.w.len > 45;
  const bars = cols.map((c, i) => {
    const h = c.n ? Math.max(1.2, (c.n / max) * 100) : 0;
    const segs = order.filter((st) => c.by[st.id]).map((st) => `<i class="sg${S.focus === st.id ? " lit" : ""}" data-s="${st.id}" style="flex:${c.by[st.id]} 0 0;${hueVars(st.hue)}"></i>`).join("");
    const lab = (i === lastFull || i === maxI) && c.n && !c.part ? `<em>${N(c.n)}</em>` : "";
    return `<div class="col${c.part ? " part" : ""}${i === lastFull ? " last" : ""}" data-i="${i}" style="--h:${h.toFixed(2)}%">${lab}<div class="stk" style="height:${h.toFixed(2)}%">${segs}</div></div>`;
  }).join("");
  const grid = `grid-template-columns:repeat(${cols.length},minmax(0,1fr));column-gap:${cols.length <= 10 ? 14 : cols.length <= 31 ? 4 : 3}px;--bw:${cols.length > 20 ? 16 : 22}px`;
  // Edges always; Mondays (or every other week) in between, never within 3 columns of an edge.
  const labs = cols.map((c, i) => {
    const edge = i === 0 || i === cols.length - 1;
    const wk = !edge && (weekly ? i % 2 === 0 : dow(c.from) === 0) && i > 2 && i < cols.length - 3;
    const mid = cols.length > 6 && i === Math.floor((cols.length - 1) / 2);
    return `<span class="${[edge && "x-edge", wk && "x-wk", mid && "x-mid"].filter(Boolean).join(" ")}">${dayL(c.from)}</span>`;
  }).join("");
  const avgLine = V.avg > 0 ? `<div class="avg" style="bottom:${((V.avg / max) * 100).toFixed(2)}%"><span>${t("avg", { n: N(V.avg, V.avg < 10 ? 1 : 0) })}</span></div>` : "";
  const hasPart = cols.some((c) => c.part);
  return `<div class="bchart" role="img" aria-label="${weekly ? t("a11yWeeks") : t("a11yBars")}">
    <div class="plot"><div class="bars" style="${grid}">${avgLine}${bars}</div></div>
    <div class="xl" style="${grid}">${labs}</div>
    <div class="ckey">${hasPart ? `<span><i class="k-part"></i>${t("k_part")}</span>` : ""}<span><i class="k-avg"></i>${weekly ? t("k_avgW") : t("k_avg")}</span></div>
  </div>`;
}

/** Expert suggestion: one smooth curve of the total, the previous period as a ghost line behind it —
 *  « am I above or below last month, day by day? » answered without reading a single number. */
function areaHTML(V) {
  const cols = V.cols, prev = V.prevDaily, n = cols.length;
  const max = Math.max(1, ...cols.map((c) => c.n), ...prev) * 1.12;
  const X = (i) => ((i + 0.5) / n) * 1000, Y = (v) => 200 - (v / max) * 200;
  const curve = (pts) => pts.reduce((d, p, i) => { if (!i) return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`; const q = pts[i - 1], mx = (q[0] + p[0]) / 2; return `${d} C${mx.toFixed(1)} ${q[1].toFixed(1)} ${mx.toFixed(1)} ${p[1].toFixed(1)} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`; }, "");
  const full = cols.map((c, i) => [X(i), Y(c.n), c.part]).filter((p) => !p[2]);
  const cur = curve(full), last = full[full.length - 1];
  const area = `${cur} L${last[0].toFixed(1)} 200 L${full[0][0].toFixed(1)} 200 Z`;
  const ghost = curve(prev.map((v, i) => [X(i), Y(v)]));
  const li = cols.map((c) => !c.part).lastIndexOf(true);
  const labs = cols.map((c, i) => `<span class="${i === 0 || i === n - 1 ? "x-edge" : dow(c.from) === 0 && i > 2 && i < n - 3 ? "x-wk" : ""}">${dayL(c.from)}</span>`).join("");
  return `<div class="bchart" role="img" aria-label="${S.lang === "ar" ? "منحنى الطلبات مقابل الفترة السابقة" : "Commandes reçues par jour, comparées à la période d’avant"}">
    <div class="plot"><div class="bars" style="display:block">
      <svg viewBox="0 0 1000 200" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" aria-hidden="true">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B95F5" stop-opacity=".2"/><stop offset="1" stop-color="#8B95F5" stop-opacity="0"/></linearGradient></defs>
        <path d="${ghost}" fill="none" stroke="#98A2B3" stroke-width="1.75" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
        <path d="${area}" fill="url(#ag)"/>
        <path d="${cur}" fill="none" stroke="#7F8AF2" stroke-width="2.25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="p-dot" style="--x:${(last[0] / 10).toFixed(2)}%;--y:${(last[1] / 2).toFixed(1)}%"></span>
      <span class="p-lab" style="--x:${(last[0] / 10).toFixed(2)}%;--y:${(last[1] / 2).toFixed(1)}%">${N(cols[li].n)}</span>
    </div></div>
    <div class="xl" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${labs}</div>
    <div class="ckey"><span><i class="k-line"></i>${periodLong(V.w)}</span><span><i class="k-avg"></i>${prevName(V.w)}</span></div>
  </div>`;
}

/** Today (or yesterday) since midnight against a usual day, both cumulative. */
function paceHTML(V) {
  const pc = V.pace, live = V.w.live;
  const lastI = live ? Math.floor(pc.upto / 15) : 96;
  const nowVal = V.sA.n;
  const ymax = Math.max(6, pc.usual[96], nowVal) * 1.12;
  const X = (i) => (i / 96) * 1000, Y = (v) => 200 - (v / ymax) * 200;
  const pts = [];
  for (let i = 0; i <= lastI; i++) pts.push([X(i), Y(pc.cur[i])]);
  if (live) pts.push([(pc.upto / 1440) * 1000, Y(nowVal)]);
  const line = "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} 200 L0 200 Z`;
  const usual = "M" + pc.usual.map((v, i) => X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" L");
  const nx = live ? (pc.upto / 1440) * 100 : 100;
  const ny = (Y(nowVal) / 200) * 100;
  const uy = (Y(pc.usual[96]) / 200) * 100;
  return `<div class="pchart" role="img" aria-label="${t("a11yPace")}">
    <div class="pplot" id="pplot" data-upto="${pc.upto}">
      <svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6172F3" stop-opacity=".32"/><stop offset="1" stop-color="#6172F3" stop-opacity="0"/></linearGradient></defs>
        <line class="p-base" x1="0" y1="200" x2="1000" y2="200" vector-effect="non-scaling-stroke"/>
        <path class="p-usual" d="${usual}" vector-effect="non-scaling-stroke"/>
        <path class="p-area" d="${area}"/>
        <path class="p-line" d="${line}" vector-effect="non-scaling-stroke"/>
        ${live ? `<line class="p-now" x1="${(nx * 10).toFixed(1)}" y1="0" x2="${(nx * 10).toFixed(1)}" y2="200" vector-effect="non-scaling-stroke"/>` : ""}
      </svg>
      <div class="p-in">
        <span class="p-lab u" style="--x:100%;--y:${uy.toFixed(1)}%">${t("usual", { n: N(pc.usual[96]) })}</span>
        <span class="p-dot" style="--x:${nx.toFixed(2)}%;--y:${ny.toFixed(1)}%"></span>
        <span class="p-lab" style="--x:${nx.toFixed(2)}%;--y:${ny.toFixed(1)}%">${N(nowVal)}</span>
        <div class="p-cross" id="pcross"></div>
      </div>
    </div>
    <div class="pxl">${[0, 6, 12, 18, 24].map((h) => `<span style="--x:${(h / 24) * 100}%">${hh(h)}</span>`).join("")}</div>
    <div class="ckey"><span><i class="k-line"></i>${live ? t("k_today") : t("k_yday")}</span><span><i class="k-avg"></i>${t("k_usual", { wd: wdName(V.w.from) })}</span></div>
  </div>`;
}
// ═════════════════════════════════════════════════════════════════════════
// 8 · render — what the orders became, the money, the treatment, the stores
// ═════════════════════════════════════════════════════════════════════════
const OUT = [["del", (k) => k.d], ["route", (k) => k.r + k.u], ["ret", (k) => k.f + k.b], ["rej", (k) => k.x], ["junk", (k) => k.j], ["call", (k) => k.c]];
const tile = (l, v, s, extra = "", zero = false, sCls = "") => `<div class="tile"><div class="l">${l}${extra}</div><div class="v${zero ? " z" : ""}">${v}</div>${s ? `<div class="s ${sCls}">${s}</div>` : ""}</div>`;

function rowBHTML(V) {
  if (S.set === "vide" || !V.sA.n) return "";
  return V.w.day ? `<div class="rowb one">${treatHTML(V)}</div>` : `<div class="rowb${owner() ? "" : " one"}">${resultHTML(V)}${owner() ? moneyHTML(V) : ""}</div>`;
}

function treatHTML(V) {
  const a = V.sA, w = V.w;
  // The oldest wait is information, not an alarm: night orders always wait for the morning shift.
  // Orders left from yesterday are the alarm, and they live in « À regarder ».
  const oldest = a.oldestC != null ? t("toCallOld", { d: dur(NOW_TM - a.oldestC) }) : t("toCallNone");
  return `<section class="card box">
    <div class="card-h"><h3>${t("treatT")}</h3><span class="meta">${w.live ? t("treatToday") : t("treatY")}</span></div>
    <div class="tiles" style="--n:4">
      ${tile(t("toCall"), N(a.k.c), oldest, "", !a.k.c)}
      ${tile(t("conf"), `${N(a.conf)}${a.confRate != null ? `<small>${P(Math.round(a.confRate))}</small>` : ""}`, a.decided ? t("onDecided", { n: N(a.decided) }) : "", "", !a.conf)}
      ${tile(t("rej"), N(a.rejAll), t("rejSub", { n: N(a.k.j) }), "", !a.rejAll)}
      ${tile(t("shipped"), N(a.shipped + a.k.u), owner() ? t("shippedOwner", { v: M(a.money.route) }) : t("shippedMgr"), "", !(a.shipped + a.k.u))}
    </div>
    <button class="lnk" data-go="Équipe › Salle de contrôle">${t("room")}${ic("arrow", "flipx")}</button>
  </section>`;
}

function resultHTML(V) {
  const a = V.sA, p = V.sP, k = a.k, total = a.n;
  const cmpTip = (v) => `${prevName(V.w)} : ${v}`;
  const seg = OUT.map(([key, f]) => { const v = f(k); return v ? `<i class="k-${key}" style="flex:${v} 0 0" data-tip="${esc(`${N(v)} ${t("o_" + key)} · ${P(Math.round((v / total) * 100))}`)}"></i>` : ""; }).join("");
  const leg = OUT.map(([key, f]) => { const v = f(k); return v ? `<span class="k-${key}"><i></i><b>${N(v)}</b>${t("o_" + key)}<small>${P(Math.round((v / total) * 100))}</small></span>` : ""; }).join("");
  const fin = Math.round(a.final);
  const confOk = V.comparable && a.decided >= JUDGED && p.decided >= JUDGED;
  const delOk = V.comparable && a.fin >= JUDGED && p.fin >= JUDGED;
  const tiles = [
    tile(t("conf"), `${N(a.conf)}${a.confRate != null ? `<small>${P(Math.round(a.confRate))}</small>` : ""}`, a.decided ? t("onDecided", { n: N(a.decided) }) : "", trendPts(a.confRate, p.confRate, confOk, cmpTip(p.confRate != null ? P(Math.round(p.confRate)) : "—"), true)),
    tile(t("del"), `${N(k.d)}${a.delRate != null ? `<small>${P(Math.round(a.delRate))}</small>` : ""}`, (a.fin ? t("onFinished", { n: N(a.fin) }) : "") + (a.onRoad ? t("delRoute", { n: N(a.onRoad) }) : ""), trendPts(a.delRate, p.delRate, delOk, cmpTip(p.delRate != null ? P(Math.round(p.delRate)) : "—"), true)),
    tile(t("ret"), N(a.ret), t("retSub"), "", !a.ret),
  ];
  if (!owner()) tiles.push(tile(t("rej"), N(a.rejAll), t("rejSub", { n: N(k.j) }), "", !a.rejAll));
  return `<section class="card box">
    <div class="card-h"><h3>${t("resT")}</h3><span class="mat${fin < 90 ? " warn" : ""}" data-tip="${esc(t("finalTip"))}"><i></i>${t("final", { pct: P(fin) })}${fin < 90 ? ` · ${t("finalMove")}` : ""}</span></div>
    <div class="obar" role="img" aria-label="${esc(OUT.map(([key, f]) => `${f(k)} ${t("o_" + key)}`).join(", "))}">${seg}</div>
    <div class="oleg">${leg}</div>
    <div class="tiles" style="--n:${tiles.length}">${tiles.join("")}</div>
    <button class="lnk" data-go="Performance › Commandes">${t("leaks")}${ic("arrow", "flipx")}</button>
  </section>`;
}

function moneyHTML(V) {
  const m = V.mA, mp = V.mP, prov = Math.round(V.sA.final) < 90; // the same rounding as the « n % ont leur issue finale » chip
  const tipP = `${prevName(V.w)} : ${M(mp.paid)}`;
  const open = S.ui === "calc" && !isPhone();
  return `<section class="card box${open ? " raise" : ""}">
    <div class="card-h"><h3>${t("moneyT")}</h3></div>
    <div class="m-paid"><div class="l">${t("paid")}${trendPct(m.paid, mp.paid, V.comparable && mp.paid > 0, tipP)}</div>
      <b>${MH(m.paid)}</b><small>${t("paidSub", { n: N(V.sA.k.d), raw: V.sA.k.d })}</small></div>
    <div class="m-row">
      <div><div class="l">${t("route")}</div><b>${MH(m.route)}</b><small>${t("routeSub", { n: N(V.sA.onRoad), raw: V.sA.onRoad })}</small></div>
      <div><div class="l">${t("profit")}${prov ? `<span class="prov" data-tip="${esc(t("provTip"))}">${t("prov")}</span>` : trendPct(m.profit, mp.profit, V.comparable && mp.profit > 0, `${prevName(V.w)} : ${M(mp.profit)}`)}</div>
        <b class="${m.profit < 0 ? "neg" : ""}">${MH(m.profit)}</b>
        <button class="why" data-act="calc">${ic("info")}${t("calc")}</button></div>
    </div>
    ${open ? `<div class="pop wide" style="top:calc(100% - 22px);inset-inline-end:18px">${calcBody(V)}</div>` : ""}
  </section>`;
}

function calcBody(V) {
  const m = V.mA, a = V.sA;
  const line = (l, sub, v) => `<span>${l}${sub ? `<small>${sub}</small>` : ""}</span><b>${M(v)}</b>`;
  return `<h6>${t("calcT")}</h6>
    <div class="calc">
      ${line(t("c_paid"), t("paidSub", { n: N(a.k.d), raw: a.k.d }), m.paid)}
      ${line(t("c_cogs"), t("c_cogsS"), -m.cogs)}
      ${line(t("c_car"), t("c_carS"), -m.car)}
      ${line(t("c_pack"), t("c_packS", { n: N(a.shipped) }), -m.pack)}
      ${line(t("c_proc"), t("c_procS"), -m.proc)}
      ${line(t("c_ads"), t("c_adsS"), -m.ads)}
      <span class="tot">${t("c_tot")}</span><b class="tot">${M(m.profit)}</b>
    </div>
    <p class="calc-n">${t("calcNote", { range: rangeL(V.w.from, V.w.to) })}</p>
    <button class="lnk" style="margin:2px 8px 6px" data-go="Finances › P&amp;L global">${t("openPnl")}${ic("arrow", "flipx")}</button>`;
}

// ── stores ──────────────────────────────────────────────────────────────
function sparkHTML(x) {
  const sp = x.spark || [], max = Math.max(1, ...sp.map((b) => b.n));
  const lastFull = sp.map((b) => !b.part).lastIndexOf(true);
  return `<div class="spark" aria-hidden="true">${sp.map((b, i) => `<i class="${b.part ? "part" : !b.n ? "z" : i === lastFull ? "last" : ""}" style="height:${b.n ? Math.max(8, (b.n / max) * 100).toFixed(1) : 6}%"></i>`).join("")}</div>`;
}
function ringHTML(a) {
  const R = 50, C = 2 * Math.PI * R, gap = 2.5;
  const segs = [["del", a.k.d], ["route", a.k.r + a.k.u], ["ret", a.k.f + a.k.b], ["rej", a.k.x], ["junk", a.k.j], ["call", a.k.c]].filter(([, v]) => v);
  let acc = 0;
  const arcs = segs.map(([key, v]) => {
    const len = (v / a.n) * C, whole = v === a.n, vis = whole ? C : Math.max(len - gap, 1.2), off = -acc - (whole ? 0 : gap / 2);
    acc += len;
    return `<circle class="sgr k-${key}" cx="60" cy="60" r="${R}" stroke-dasharray="${vis.toFixed(2)} ${(C + 10).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" data-tip="${esc(`${N(v)} ${t("o_" + key)} · ${P(Math.round((v / a.n) * 100))}`)}"/>`;
  }).join("");
  return `<div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(segs.map(([k, v]) => `${v} ${t("o_" + k)}`).join(", "))}"><circle class="tk" cx="60" cy="60" r="${R}"/><g transform="rotate(-90 60 60)">${arcs}</g></svg>
    <div class="rc"><b class="num">${N(a.k.d)}</b><small>${t("ringL")}${a.delRate != null ? ` · ${P(Math.round(a.delRate))}` : ""}</small></div></div>`;
}
function freshHTML(x) {
  if (x.lastAt == null) return "";
  const mins = NOW_TM - x.lastAt, cls = x.h.broken || x.h.stop ? "bad" : mins <= 120 ? "live" : "";
  return `<span class="fresh ${cls}" data-tip="${esc(t("fresh", { at: ago(x.lastAt) }))}"><i></i>${ago(x.lastAt)}</span>`;
}
function cardBody(V, x) {
  const a = x.a, st = x.st, w = V.w;
  const pace = x.storePace && !x.alarm && x.storePace.k !== "early" ? `<span class="verdict ${x.storePace.cls}" style="height:24px;font-size:12px"><i></i>${t("ps_" + (x.storePace.k === "early" ? "normal" : x.storePace.k))}</span>` : "";
  const trend = !w.day && x.p ? trendPct(a.n, x.p.n, x.p.n > 0, `${prevName(w)} : ${N(x.p.n)}`) : "";
  const prods = st.prods && st.prods.length ? `<div class="prods">${st.prods.slice(0, 2).map((p) => `<span class="pc" data-tip="${esc(p)}">${ic("tag")}<span>${esc(p)}</span></span>`).join("")}${st.prods.length > 2 ? `<span class="pc more" data-tip="${esc(st.prods.slice(2).join(" · "))}">+${N(st.prods.length - 2)}</span>` : ""}</div>` : "";
  let q;
  if (w.day || !a.n) {
    // v9 · the four tiles, in the order an order lives them; a confirmed order not yet sent to the
    //    carrier is in none of the four, so it is said underneath — the tiles always add up to the count
    const mi = (l, v) => `<div class="mi">${l}<b class="${v ? "" : "z"}">${N(v)}</b></div>`;
    q = `<div class="sc-q flat"><div class="minis row four">${mi(t("mWait"), a.k.w)}${mi(t("mTry"), a.k.t)}${mi(t("mUp"), a.shipped)}${mi(t("mRej"), a.rejAll)}</div>
      ${a.k.u ? `<div class="mi-gap">${t("mGap", { n: N(a.k.u), raw: a.k.u })}</div>` : ""}</div>`;
  } else {
    const ring = a.n >= JUDGED ? ringHTML(a) : `<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tk dash" cx="60" cy="60" r="50"/></svg><div class="rc early"><small>${t("early")}<br>${t("earlyS")}</small></div></div>`;
    q = `<div class="sc-q">${ring}<div class="minis">
      <div class="mi">${t("mConf")}<b>${a.confRate != null ? P(Math.round(a.confRate)) : "—"}<small>${N(a.conf)}</small></b></div>
      <div class="mi">${t("mRet")}<b class="${a.ret ? "" : "z"}">${N(a.ret)}</b></div>
      ${owner() ? `<div class="mi">${t("mPaid")}<b class="${a.money.paid ? "" : "z"}">${MH(a.money.paid)}</b></div>` : `<div class="mi">${t("mRej")}<b class="${a.rejAll ? "" : "z"}">${N(a.rejAll)}</b></div>`}
    </div></div>`;
  }
  const n = x.note;
  return `<div class="sc-h"><span class="av">${esc(initials(st.name))}</span>
      <div class="sc-n"><b>${esc(st.name)}</b><small>${esc(pfLabel(st))}</small></div>${freshHTML(x)}</div>
    <div class="sc-c"><div><div class="cnt"><b class="num${!a.n && (x.h.stop || x.h.broken) ? " zero" : ""}">${N(a.n)}</b>${trend}${pace}</div>
      <div class="sc-sub">${t("received", { n: a.n })}</div></div>${sparkHTML(x)}</div>
    ${q}
    <div class="note ${n.cls}"><span class="ni">${ic(n.icon)}</span><div><b>${n.b}</b><small>${n.s}</small></div></div>`;
}
function storesHTML(V) {
  if (!V.shown.length && !V.silent.length) return "";
  const cards = V.shown.map((x) => `<article class="card sc${x.h.broken || x.h.stop ? " alarm" : ""}" role="button" tabindex="0" data-open="${x.st.id}" style="${hueVars(x.st.hue)}" aria-label="${esc(x.st.name)}">${cardBody(V, x)}</article>`).join("");
  const own = owner();
  const list = `<div class="card slist" role="table">
    <div class="sr hd" role="row"><span>${t("storesT")}</span><span>${t("heroL")}</span><span></span><span>${t("mConf")}</span><span>${V.w.day ? t("mCall") : own ? t("mPaid") : t("mRet")}</span><span></span><span></span></div>
    ${V.shown.map((x) => { const a = x.a, n = x.note; return `<div class="sr" role="row" tabindex="0" data-open="${x.st.id}" style="${hueVars(x.st.hue)}">
      <span class="who"><span class="av">${esc(initials(x.st.name))}</span><span><b>${esc(x.st.name)}</b><small>${esc(tg("pf", x.st.pf))}</small></span></span>
      <span class="vol"><b class="num">${N(a.n)}</b></span>
      <span>${!V.w.day && x.p ? trendPct(a.n, x.p.n, x.p.n > 0) : ""}</span>
      <span class="num-c">${a.confRate != null ? P(Math.round(a.confRate)) : "—"}<small>${N(a.conf)}</small></span>
      <span class="num-c">${V.w.day ? N(a.k.c) : own ? MH(a.money.paid) : N(a.ret)}</span>
      <span class="st ${n.cls === "bad" ? "bad" : n.cls === "warn" ? "warn" : n.cls === "flat" || n.cls === "new" ? "flat" : ""}"><i class="dot"></i><span>${n.b}</span></span>
      <span class="go">${ic("right")}</span></div>`; }).join("")}</div>`;
  const rows = `<div class="card srows">${V.shown.map((x) => { const a = x.a, n = x.note, alarm = n.cls === "bad" || n.cls === "warn";
    return `<div class="prow" role="button" tabindex="0" data-open="${x.st.id}" style="${hueVars(x.st.hue)}"><span class="av">${esc(initials(x.st.name))}</span>

function writeUrl() {
  const q = new URLSearchParams();
  for (const k of ["set", "role", "lang", "device", "period", "view"]) if (S[k] !== DEF[k]) q.set(k, S[k]);
  if (S.chart === "area") q.set("chart", "area");
  if (S.period === "custom" && S.from && S.to) { q.set("from", S.from); q.set("to", S.to); }
  if (S.stale) q.set("stale", "1");
  history.replaceState(null, "", `${location.pathname}${q.toString() ? "?" + q : ""}`);
}
function set(p) { Object.assign(S, p); writeUrl(); render(); }
function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2400); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-st],[data-period],[data-act],[data-go],[data-open],[data-view],[data-chart],[data-store],[data-day],[data-cal]");
  if (!el) { if (S.ui && !e.target.closest(".pop,.sheet")) set({ ui: null, cal: null }); return; }
  const d = el.dataset;
  if (d.st && d.st !== "stale") return set({ [d.st]: d.v, ui: null, cal: null, focus: null });
  if (d.period) return set({ period: d.period, from: null, to: null, ui: null, cal: null, focus: null });
  if (d.chart) return set({ chart: d.chart });
  if (d.view) return set({ view: d.view });
  if (d.store) return set({ focus: S.focus === d.store ? null : d.store });
  if (d.day) { const c = S.cal; if (!c.s || c.e) c.s = d.day, c.e = null; else if (d.day < c.s) { c.e = c.s; c.s = d.day; } else c.e = d.day; return render(); }
  if (d.cal) { S.cal.m = addMonths(S.cal.m, +d.cal); return render(); }
  if (d.open) { if (isPhone()) return set({ ui: "store:" + d.open }); const x = V.stores.find((y) => y.st.id === d.open); return toast(t("go", { where: esc(t("goPerfStore", { store: x.st.name, period: periodLong(V.w) })) })); }
  if (d.go) { if (d.go.startsWith("store:")) return isPhone() ? set({ ui: d.go }) : document.querySelector(`.sc[data-open="${d.go.slice(6)}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); S.ui = null; return toast(t("go", { where: d.go })); }
  const a = d.act;
  if (a === "more") return set({ ui: S.ui === "more" ? null : "more", cal: null });
  if (a === "cal") return set({ cal: { m: TODAY.slice(0, 7), s: null, e: null } });
  if (a === "applyCal") { const c = S.cal; return set({ period: "custom", from: c.s, to: c.e, ui: null, cal: null }); }
  if (a === "calc") return set({ ui: S.ui === "calc" ? null : "calc" });
  if (a === "close") return set({ ui: null, cal: null });
  if (a === "silent") return set({ silentOpen: !S.silentOpen });
  if (a === "notes") return set({ notes: !S.notes });
  if (a === "refresh") { S.stale = false; writeUrl(); return toast(t("refreshed")); }
});
document.addEventListener("change", (e) => { if (e.target.dataset.st === "stale") set({ stale: e.target.checked }); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return set({ ui: null, cal: null, notes: false, focus: null });
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.open) { e.preventDefault(); e.target.click(); }
});

function showTip(html, x, y) {
  tip.innerHTML = html; tip.dir = S.lang === "ar" ? "rtl" : "ltr"; tip.classList.add("on");

  tip.style.left = `${Math.max(8, left)}px`; tip.style.top = `${top}px`;
}
const hideTip = () => tip.classList.remove("on");
function colTip(i) {
  const c = V.cols[i];
  if (!c) return "";
  const head = c.days > 1 || V.w.len > 45 ? t("tipWeek", { from: dayL(c.from), to: dayL(c.to), n: N(c.n), raw: c.n }) : t("tipDay", { day: dayLong(c.from), n: N(c.n), raw: c.n });
  const lines = V.shown.filter((x) => c.by[x.st.id]).map((x) => `<div class="tl" style="${hueVars(x.st.hue)}"><i></i>${esc(x.st.name)}<b>${N(c.by[x.st.id])}</b></div>`).join("");
  const note = c.part ? `<div class="tn">${c.from === TODAY || c.to === TODAY ? t("tipPartDay", { time: hm(NOWMIN) }) : t("tipPartWeek", { d: c.days })}</div>` : "";
  return `<b>${head}</b>${lines}${note}`;
}
function paceTip(ev) {
  const plot = $("#pplot"); if (!plot) return;
  const r = plot.getBoundingClientRect();
  let fx = (ev.clientX - r.left) / r.width; if (S.lang === "ar") fx = 1 - fx;
  fx = Math.min(1, Math.max(0, fx));
  const i = Math.round(fx * 96), upto = +plot.dataset.upto, min = i * 15;
  const cross = $("#pcross"); cross.style.display = "block"; cross.style.insetInlineStart = `${(i / 96) * 100}%`;
  const cur = min <= upto ? N(V.pace.cur[i]) : "—";
  showTip(t("tipPace", { h: hm(Math.min(min, 1440)), n: cur, u: N(V.pace.usual[i]) }), ev.clientX, ev.clientY);
}
document.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return;
  const col = e.target.closest(".col");
  if (col) return showTip(colTip(+col.dataset.i), e.clientX, e.clientY);
  if (e.target.closest("#pplot")) return paceTip(e);
  const cross = $("#pcross"); if (cross) cross.style.display = "none";
  const el = e.target.closest("[data-tip]");
  if (el && el.dataset.tip) return showTip(esc(el.dataset.tip), e.clientX, e.clientY);
  hideTip();
});
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch") return;
  const col = e.target.closest(".col");
  if (col) return showTip(colTip(+col.dataset.i), e.clientX, e.clientY);
  if (e.target.closest("#pplot")) return paceTip(e);
  const el = e.target.closest("[data-tip]");
  if (el && el.dataset.tip) return showTip(esc(el.dataset.tip), e.clientX, e.clientY);
  hideTip();
});
document.addEventListener("pointerover", (e) => {
  if (e.pointerType === "touch") return;
  const lg = e.target.closest("[data-store]");
  const hero = $("#hero"); if (!hero) return;
  const id = lg ? lg.dataset.store : S.focus;
  hero.classList.toggle("focus", !!id);
  $$(".sg,.slice,.lrow", hero).forEach((sg) => sg.classList.toggle("lit", !!id && sg.dataset.s === id));
  const pc = $("#pieC"); if (pc) pc.innerHTML = pieCenter(V, id);
});
addEventListener("resize", () => { if (S.ui) render(); });
render();

</script>
</body>
