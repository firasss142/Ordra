  Presets : ?lang=fr|ar  ?screen=today|out|returns|stock|product|receptions|journal
  Données RÉELLES (prod, 2026-10-02) : bâtiments, agents (adel → Benghazi, tarek → Tripoli), files
  (Benghazi 31 frais + 11 anciens ; Tripoli 16 frais + 335 anciens dont 323 Dexpress), retours (2 + 3 en
  route), réception REC-LY-2026-0001 (brouillon de test, sans ligne), produits, stocks, 0 comptage,
  derniers mouvements de qr-01. « Sortis aujourd'hui » = journée type (14, moyenne des jours actifs).
  Prénoms des clients fictifs. Jetons : Ordra (src/app/globals.css) — pas de --wh-* / --wm-*.
  Le studio est LTR ; seule la scène se met en miroir en arabe.
-->
<title>Entrepôt — journée (desk)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --hover:#F7F7F7; --selected:#F2F2F2; --sunken:#FAFAFB;
  --ink:#1A1A1A; --ink2:#6D7175; --ink3:#9CA3AF;
  --line:#ECEEF0; --line2:#E1E3E5; --line3:#C9CCCF;
  --brand:#15803D; --brand-hover:#12692F; --brand-bg:#E9F6EE; --brand-tint:#F1FAF4; --brand-on-dark:#10B981;
  --action:#2C6ECB; --action-bg:#EEF4FC;
  --success:#008060; --success-bg:#F1F8F5;
  --warning:#B98900; --warning-bg:#FFF8E6; --warning-ink:#7A5B00;
  --critical:#D72C0D; --critical-bg:#FFF4F4;
  --sb:#0E1013; --sb-text:#E6E8EB; --sb-muted:#7F858F; --sb-faint:#5A616B; --sb-hover:rgba(255,255,255,.04);
  --shadow-floating:0 8px 24px rgba(16,24,40,.10);
  --r-sm:6px; --r:10px; --r-lg:14px; --pill:9999px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#DCDEE1;color:var(--ink);font:14px/1.5 Inter,"Noto Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;padding:0}
input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* studio bar (LTR) */
.studio{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 20px;background:#F3F4F5;border-bottom:1px solid #CFD2D6;font-size:12.5px}
.studio b{font-size:13.5px}
.studio .grp{display:flex;gap:4px;flex-wrap:wrap}
.studio button{padding:5px 10px;border:1px solid #CFD2D6;border-radius:6px;background:#fff;font-weight:600}
.studio button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.why{direction:ltr;max-width:1440px;margin:12px auto 0;padding:12px 16px;background:#fff;border:1px solid #CFD2D6;border-radius:10px;font-size:13px;color:#30343A}
.why p{margin:0 0 6px}.why p:last-child{margin:0}
.why code{font-family:var(--mono);font-size:11.5px;background:#F2F2F3;padding:1px 4px;border-radius:4px}

/* stage */
.stage{max-width:1440px;margin:14px auto 40px;height:900px;display:grid;grid-template-columns:232px 1fr;background:var(--bg);border-radius:12px;overflow:hidden;border:1px solid #C9CCCF}
.stage[dir=rtl]{font-family:"Noto Sans Arabic",Inter,system-ui,sans-serif}
.sidebar{background:var(--sb);color:var(--sb-text);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:700;font-size:16px;color:#fff}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:13px}
.nsec{font-size:11px;font-weight:600;color:var(--sb-faint);letter-spacing:.05em;text-transform:uppercase;padding:14px 10px 6px}
.stage[dir=rtl] .nsec{letter-spacing:0;text-transform:none;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:#B5BAC2;font-size:13.5px;font-weight:500}
.nav:hover{background:var(--sb-hover)}
.nav[aria-current=page]{background:var(--brand);color:#fff}
.nav .n{margin-inline-start:auto;font-size:11.5px;color:var(--sb-muted)}
.nav[aria-current=page] .n{color:#DDF5E6}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.scanfield{flex:1;display:flex;align-items:center;gap:10px;height:42px;border:1.5px solid var(--line3);border-radius:var(--r);padding:0 12px;background:var(--card);max-width:620px}
.scanfield.hand{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
.scanfield input{flex:1;min-width:0;border:0;outline:0;font-size:14px;background:transparent}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink2)}
.seg{display:inline-flex;gap:2px;background:#ECEDEF;border-radius:var(--r);padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.seg .c{color:var(--ink3);font-size:12px;margin-inline-start:5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--selected);display:grid;place-items:center;font-weight:700;color:var(--ink2);flex:none}
.content{flex:1;overflow:auto;padding:24px 28px 40px}
.content>*{animation:enter 160ms ease-out}
@keyframes enter{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}

/* type */
.h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.h2{font-size:16px;font-weight:700}
.muted{color:var(--ink2)} .small{font-size:12.5px}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stage[dir=rtl] .label{letter-spacing:0;text-transform:none;font-size:12px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.head .grow{flex:1}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line3)}
.btn.ink{background:var(--ink);color:#fff}
.btn.ghost{color:var(--ink2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.danger{border:1px solid #F0B8AD;color:var(--critical);background:var(--card)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--pill);font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;flex:none}
.chip.warn{background:var(--warning-bg);color:var(--warning-ink)} .chip.warn i{background:var(--warning)}
.chip.bad{background:var(--critical-bg);color:var(--critical)} .chip.bad i{background:var(--critical)}
.chip.ok{background:var(--success-bg);color:var(--success)} .chip.ok i{background:var(--success)}
.chip.info{background:var(--action-bg);color:var(--action)} .chip.info i{background:var(--action)}
.chip.mute{background:var(--selected);color:var(--ink2)} .chip.mute i{background:var(--ink3)}
.thumb{width:34px;height:34px;border-radius:9px;background:var(--selected);display:grid;place-items:center;color:var(--ink2);flex:none}

/* pickup strip */
.pick{display:flex;gap:10px;margin-bottom:18px}
.pick .card{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* jobs */
.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.job{display:flex;flex-direction:column;gap:10px;padding:18px;text-align:start;transition:border-color 120ms}
.job:hover{border-color:var(--line3)}
.step{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--selected);color:var(--ink2);flex:none}
.job.lead .step{background:var(--ink);color:#fff}
.split{display:flex;gap:14px;font-size:12.5px;color:var(--ink2)}
.split b{color:var(--ink)}
.bar{height:6px;border-radius:var(--pill);background:var(--selected);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-top:12px}
.list .item{display:flex;align-items:center;gap:12px;padding:13px 18px;width:100%;text-align:start}
.list .item+.item{border-top:1px solid var(--line)}
.list button.item:hover{background:var(--hover)}
.chev{color:var(--ink3)}
.stage[dir=rtl] .flip{transform:scaleX(-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
.stage[dir=rtl] th{letter-spacing:0;text-transform:none;font-size:12px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.n,th.n{text-align:end}
th:first-child{min-width:260px}
.rollrow td{background:var(--sunken);padding-top:10px;padding-bottom:10px}
.sw{display:inline-block;width:12px;height:28px;border-radius:4px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
tr.hand td{background:var(--brand-tint)!important}
tr.hand td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.stage[dir=rtl] tr.hand td:first-child{box-shadow:inset -3px 0 0 var(--brand)}
.fold{display:flex;align-items:center;gap:12px;padding:14px 18px;width:100%;color:var(--ink2)}
.spark{width:64px;height:22px}
.spark path{fill:none;stroke:var(--ink3);stroke-width:1.5}
.dash{color:var(--ink3)}
.truth{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:var(--r-lg);background:var(--warning-bg);border:1px solid #F1DFA8;color:var(--warning-ink);margin-bottom:16px}
.tabs{display:inline-flex;gap:3px;background:#ECEDEF;border-radius:var(--r);padding:3px;margin-bottom:18px}
.tabs button{padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:6px 12px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2)}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips .c{margin-inline-start:5px;font-size:11.5px;opacity:.75}
.stack-bar{display:flex;height:14px;border-radius:var(--pill);overflow:hidden;background:var(--selected);margin:16px 0 8px}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink2)}
.legend b{color:var(--ink)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:6px;background:var(--k)}
.sel{height:36px;border:1px solid var(--line3);border-radius:var(--r);padding:0 10px;background:var(--card)}
</style>
</head>

      <td class="n"><div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sec sm">${t("redeliver")}</button><button class="btn pri sm">${t("receive")}</button></div></td></tr>`).join("")}</tbody></table></div>
  <div class="label" style="margin-bottom:8px">${t("onWay")} · <span class="num">3</span></div>
  <div class="card" style="overflow:hidden;opacity:.65;margin-bottom:20px"><table><tbody>
    ${[["qr","سرت","Syrte"],["qr","مصراتة","Misrata"],["da","بنغازي","Benghazi"]].map(r=>`<tr><td><div class="row"><span class="thumb">${ic("book",16)}</span><span style="font-weight:600">${pn(r[0])}</span></div></td><td>${L(r[1],r[2])}</td><td class="muted n">${t("benghazi")}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="label" style="margin-bottom:8px">${t("processed")}</div>
  <div class="card pad muted small row">${ic("inbox",18)}${t("none7")}</div>`;

const stockTabs = cur => `<div class="tabs" role="tablist">${[["stock","levels"],["receptions","receptions"],["journal","journal"]].map(([go,k])=>`<button role="tab" data-go="${go}" aria-selected="${cur===go}">${t(k)}</button>`).join("")}</div>`;
C.stock = () => `
  <div class="head"><div class="grow"><h1 class="h1">${t("stockT")}</h1></div></div>
  ${stockTabs("stock")}
  <div class="truth">${ic("alert",20)}<div class="grow"><b>${t("truthT")}</b> <span class="small">${t("truthB")}</span></div><button class="btn ink" data-go="product">${ic("tally",16)} ${t("truthBtn")}</button></div>
  <div class="card" style="overflow:hidden"><table>
    <thead><tr><th>${t("product")}</th><th class="n">${t("book")}</th><th class="n">${t("engaged")}</th><th class="n">${t("free")}</th><th class="n">${t("tripoli")}</th><th class="n">${t("benghazi")}</th><th class="n">${t("unalloc")}</th><th>${t("lastCount")}</th><th>${t("days14")}</th><th class="n"></th></tr></thead>
    <tbody>${Object.entries(P).map(([k,p])=>{const free=p.stock-p.engaged;return `
      <tr><td><button class="row" data-go="product" style="text-align:start"><span class="thumb">${ic(k.startsWith("b")?"boxes":"book",16)}</span><div><div style="font-weight:600">${p[lang]}</div><div class="small muted mono">${p.sku}</div></div></button></td>
      <td class="n num">${p.stock}</td><td class="n num ${p.engaged?"":"dash"}">${p.engaged||"—"}</td><td class="n"><b class="num" style="font-size:15px">${free}</b></td>
      <td class="n dash">—</td><td class="n dash">—</td><td class="n num muted">${p.stock}</td>
      <td><span class="chip warn"><i></i>${t("never")}</span></td><td>${spark(p.s)}</td>
      <td class="n"><div class="row" style="justify-content:flex-end;gap:6px"><button class="btn ghost sm" data-go="journal">${t("moves")}</button><button class="btn sec sm" data-go="product">${t("count")}</button></div></td></tr>`;}).join("")}</tbody></table></div>`;

C.product = () => { const p = P.qr, free = p.stock - p.engaged; return `
  <div class="head"><div class="grow"><div class="small muted mono">${p.sku}</div><h1 class="h1">${p[lang]}</h1></div>
    <span class="small muted">${t("countAt")}</span><select class="sel"><option>${t("benghazi")}</option><option>${t("tripoli")}</option></select><button class="btn pri">${ic("tally",16)} ${t("count")}</button></div>
  <div style="display:grid;grid-template-columns:1.1fr 1fr;gap:12px">
    <div>
      <div class="card pad"><div class="row" style="align-items:flex-end"><div class="grow"><div class="label">${t("free")}</div><div class="big num" style="margin-top:6px">${free}</div></div><span class="chip warn"><i></i>${t("never")}</span></div>
        <div class="stack-bar"><i style="width:${p.engaged/p.stock*100}%;background:var(--ink)"></i><i style="width:${free/p.stock*100}%;background:var(--brand)"></i></div>
        <div class="legend"><span style="--k:var(--ink)">${t("engaged")} <b class="num">${p.engaged}</b></span><span style="--k:var(--brand)">${t("free")} <b class="num">${free}</b></span><span style="--k:var(--line3)">${t("book")} <b class="num">${p.stock}</b></span></div></div>
      <div class="card" style="margin-top:12px;overflow:hidden"><div class="card-h"><span class="h2 grow">${t("bySite")}</span></div><table><tbody>
        <tr><td>${t("tripoli")}</td><td class="n dash">—</td><td><span class="chip mute"><i></i>${t("siteNone")}</span></td></tr>
        <tr><td>${t("benghazi")}</td><td class="n dash">—</td><td><span class="chip mute"><i></i>${t("siteNone")}</span></td></tr>
        <tr><td class="muted">${t("unalloc")}</td><td class="n num"><b>${p.stock}</b></td><td></td></tr></tbody></table></div>
      <div class="card pad small muted" style="margin-top:12px"><b style="color:var(--ink)">${t("variants")}</b> · ${t("noVariants")}</div>
    </div>
    <div class="card list" style="overflow:hidden"><div class="card-h"><span class="h2 grow">${t("lastMoves")}</span></div>
      ${[["943","14:42","29"],["944","15:42","28"],["945","15:42","28"],["946","15:41","28"],["947","15:40","28"],["948","15:23","27"]].map(m=>`
      <div class="item"><span class="dot" style="background:var(--ink3)"></span><div class="grow"><div style="font-weight:600">${t("mvScan")}</div><div class="small muted">${L(m[2]+" سبتمبر","" + m[2]+" sept.")} · <span class="num">${m[1]}</span> · adel · ${t("benghazi")}</div></div><b class="num">−1</b><span class="num muted small" style="min-width:34px;text-align:end">${m[0]}</span></div>`).join("")}
      <button class="item" data-go="journal" style="color:var(--brand-hover);font-weight:600">${t("allMoves")} <span class="flip" style="margin-inline-start:auto">${ic("chev",16)}</span></button>
    </div>
  </div>`;};

C.receptions = () => `
  <div class="head"><div class="grow"><h1 class="h1">${t("stockT")}</h1></div><button class="btn pri">${ic("plus",16)} ${t("recNew")}</button></div>
  ${stockTabs("receptions")}
  <div class="chips">${[["rAll",1,true],["rExp",1],["rVal",0],["rPost",0],["rUnpaid",0]].map(([k,n,on])=>`<button aria-pressed="${!!on}">${t(k)}<span class="c num">${n}</span></button>`).join("")}</div>
  <div class="card" style="overflow:hidden"><table>
    <thead><tr><th>${t("ref")}</th><th>${t("supplier")}</th><th>${t("qty")}</th><th class="n">${t("value")}</th><th>${t("state")}</th></tr></thead>
    <tbody><tr><td><div style="font-weight:600" class="mono">REC-LY-2026-0001</div><div class="small muted">${t("tripoli")} · <span style="color:var(--critical);font-weight:600">${t("rLate")}</span></div></td>
      <td>firas <span class="muted small mono">· qd</span></td><td class="muted">${t("rNoLine")}</td><td class="n dash">—</td>
      <td><span class="chip mute"><i></i>${t("rStatus")}</span></td></tr></tbody></table></div>`;

C.journal = () => `
  <div class="head"><div class="grow"><h1 class="h1">${t("stockT")}</h1></div></div>
  ${stockTabs("journal")}
  <div class="row" style="margin-bottom:12px"><span class="small muted">${t("filteredBy")}</span><span class="chip info"><i></i>${pn("qr")} <button aria-label="clear" style="display:inline-grid">${ic("x",13,2.5)}</button></span></div>
  <div class="chips">${[["fAll",225,true],["fScan",225],["fRet",0],["fRec",0],["fCount",0],["fAdj",0]].map(([k,n,on])=>`<button aria-pressed="${!!on}">${t(k)}<span class="c num">${n}</span></button>`).join("")}</div>
  <div class="card" style="overflow:hidden"><table>
    <thead><tr><th>${t("when")}</th><th>${t("event")}</th><th>${t("product")}</th><th>${t("who")}</th><th class="n">${t("delta")}</th></tr></thead>
    <tbody>${[["29","14:42","943"],["28","15:42","944"],["28","15:42","945"],["28","15:41","946"],["28","15:40","947"],["27","15:23","948"]].map(m=>`
      <tr><td class="muted">${L(m[0]+" سبتمبر",m[0]+" sept.")} · <span class="num">${m[1]}</span></td><td><span class="chip mute"><i></i>${t("mvScan")}</span></td><td style="font-weight:600">${pn("qr")}</td><td>adel · <span class="muted">${t("benghazi")}</span></td><td class="n"><b class="num">−1</b> <span class="muted num">→ ${m[2]}</span></td></tr>`).join("")}</tbody></table></div>`;

const stage = document.getElementById("stage");
function render(){
  stage.dir = lang === "ar" ? "rtl" : "ltr"; stage.lang = lang;
  document.getElementById("sidebar").innerHTML = sidebar();
  document.getElementById("topbar").innerHTML = topbar();
  document.getElementById("content").innerHTML = C[screen]();
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("pick").innerHTML = SCREENS.map(s => `<button data-go="${s}" aria-pressed="${s===screen}">${s}</button>`).join("");
  document.getElementById("why").innerHTML = WHY[screen];
  const u = new URL(location); u.searchParams.set("lang",lang); u.searchParams.set("screen",screen); history.replaceState(null,"",u);
}
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-go]"); if (!el) return;
  if (el.dataset.lang){ lang = el.dataset.lang; render(); return; }
  if (el.dataset.site){ site = el.dataset.site; render(); return; }
  if (el.hasAttribute("data-hand")){ hand = true; render(); return; }
  if (el.dataset.go){ screen = el.dataset.go; render(); document.getElementById("content").scrollTo(0,0); }
});
render();
})();
</script>
</body>
</html>
